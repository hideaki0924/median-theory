<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>チャッピーOCR統合版 V1.3</title>
<script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
body{margin:0;background:#07101f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;padding:14px}
h1{color:#ffd84d;font-size:26px}
h2{margin:8px 0;color:#fff}
.box{background:#111827;border:1px solid #334155;border-radius:16px;padding:14px;margin:12px 0}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
button,input{width:100%;font-size:18px;padding:12px;margin:7px 0;border-radius:12px;box-sizing:border-box}
textarea{width:100%;height:190px;font-size:15px;border-radius:12px;padding:10px;box-sizing:border-box}
.green{background:#16a34a;color:white;font-weight:bold}
.blue{background:#2563eb;color:white;font-weight:bold}
.purple{background:#7e22ce;color:white;font-weight:bold}
.orange{background:#ea580c;color:white;font-weight:bold}
.pink{background:#db2777;color:white;font-weight:bold}
.small{font-size:13px;color:#cbd5e1}
@media(min-width:900px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>

<body>

<h1>🏇チャッピーOCR統合版 V1.3</h1>
<p>単複netkeiba・馬連SPAT4・ワイドSPAT4・三連複netkeiba</p>

<div class="box">
<h2>レース名</h2>
<input id="race" placeholder="例：園田6R">
</div>

<div class="grid">

<div class="box">
<h2>① 単複OCR netkeiba</h2>
<div class="small">netkeiba単複の人気順に馬番を入力</div>
<textarea id="horses" style="height:100px">4
8
9
11
3
6
12
1
2
5
10
7</textarea>
<input type="file" id="tfImg" accept="image/*">
<button class="green" onclick="runTanfuku()">単複OCR実行</button>
<textarea id="tfRaw" placeholder="OCR結果"></textarea>
<button onclick="makeTanfuku()">[TANFUKU]生成</button>
<textarea id="tanfuku"></textarea>
</div>

<div class="box">
<h2>② 馬連OCR SPAT4/JRA-VAN</h2>
<div class="small">表画像を左から順番に複数選択</div>
<input id="umaN" value="12" placeholder="出走頭数">
<input id="umaStart" value="1" placeholder="画像1枚目の先頭列">
<input id="umaCols" value="3" placeholder="1画像あたり列数">
<input type="file" id="umaImgs" accept="image/*" multiple>
<button class="blue" onclick="runMultiOCR('uma')">馬連OCR実行</button>
<textarea id="umaRaw"></textarea>
<button onclick="makeUmaren()">[UMAREN]生成</button>
<textarea id="umaren"></textarea>
</div>

<div class="box">
<h2>③ ワイドOCR SPAT4/JRA-VAN</h2>
<input id="wideN" value="12" placeholder="出走頭数">
<input id="wideStart" value="1" placeholder="画像1枚目の先頭列">
<input id="wideCols" value="3" placeholder="1画像あたり列数">
<input type="file" id="wideImgs" accept="image/*" multiple>
<button class="purple" onclick="runMultiOCR('wide')">ワイドOCR実行</button>
<textarea id="wideRaw"></textarea>
<button onclick="makeWide()">[WIDE]生成</button>
<textarea id="wide"></textarea>
</div>

<div class="box">
<h2>④ 三連複OCR netkeiba</h2>
<div class="small">netkeiba三連複の数字表示画面を使用</div>
<input type="file" id="sanImgs" accept="image/*" multiple>
<button class="orange" onclick="runSanpuku()">三連複OCR実行</button>
<textarea id="sanRaw"></textarea>
<button onclick="makeSanpuku()">[SANPUKU]生成</button>
<textarea id="sanpuku"></textarea>
</div>

</div>

<div class="box">
<h2>⑤ 全メジアンアプリコード</h2>
<button class="pink" onclick="makeAll()">全部まとめる</button>
<textarea id="all" style="height:360px"></textarea>
<button class="green" onclick="copyAll()">完成コードをコピー</button>
</div>

<script>
let umaTexts=[];
let wideTexts=[];
let sanTexts=[];

async function ocrFile(file,lang="jpn+eng"){
  const r=await Tesseract.recognize(file,lang);
  return r.data.text;
}

function cleanLine(s){
  return s
    .replace(/[０-９]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0))
    .replace(/[．]/g,".")
    .replace(/[ー―－–—]/g,"-")
    .replace(/[|｜]/g," ")
    .replace(/\s+/g," ")
    .trim();
}

async function runTanfuku(){
  const f=document.getElementById("tfImg").files[0];
  if(!f){alert("単複画像を選択");return;}
  document.getElementById("tfRaw").value="読み取り中...";
  document.getElementById("tfRaw").value=await ocrFile(f,"jpn+eng");
  makeTanfuku();
}

async function runMultiOCR(type){
  const id=type==="uma"?"umaImgs":"wideImgs";
  const files=[...document.getElementById(id).files];
  if(!files.length){alert("画像を選択");return;}

  let arr=[];
  let all="";

  for(let i=0;i<files.length;i++){
    all+="\n--- 画像"+(i+1)+" ---\n";
    const t=await ocrFile(files[i],"eng");
    arr.push(t);
    all+=t+"\n";
    document.getElementById(type==="uma"?"umaRaw":"wideRaw").value=all;
  }

  if(type==="uma"){
    umaTexts=arr;
    makeUmaren();
  }else{
    wideTexts=arr;
    makeWide();
  }
}

async function runSanpuku(){
  const files=[...document.getElementById("sanImgs").files];
  if(!files.length){alert("三連複画像を選択");return;}

  sanTexts=[];
  let all="";

  for(let i=0;i<files.length;i++){
    all+="\n--- 画像"+(i+1)+" ---\n";
    const t=await ocrFile(files[i],"jpn+eng");
    sanTexts.push(t);
    all+=t+"\n";
    document.getElementById("sanRaw").value=all;
  }

  makeSanpuku();
}

function normalizeOddToken(x){
  x=String(x).trim();
  if(x.includes("."))return x;
  if(x.length===2)return x[0]+"."+x[1];
  if(x.length===3)return x.slice(0,2)+"."+x.slice(2);
  if(x.length===4)return x.slice(0,3)+"."+x.slice(3);
  return x;
}

function extractTanfukuOdds(raw){
  const rows=[];

  raw.split(/\n/).forEach(line=>{
    let s=cleanLine(line)
      .replace(/回/g,"")
      .replace(/加/g,"11")
      .replace(/11\|/g,"11 ")
      .replace(/12\|/g,"12 ")
      .replace(/\bel\b/g,"6")
      .replace(/\bno\|/g,"10")
      .replace(/\bio\b/g,"10")
      .replace(/[^\d.\-\s]/g," ");

    const nums=s.match(/\d+(?:\.\d+)?/g);
    if(!nums || nums.length<3)return;

    let win="",place="";

    if(nums.length>=4){
      win=nums[nums.length-3];
      place=nums[nums.length-1];
    }else{
      win=nums[1];
      place=nums[nums.length-1];
    }

    win=normalizeOddToken(win);
    place=normalizeOddToken(place);

    if(Number(win)<=0 || Number(place)<=0)return;
    rows.push({win,place,line:s});
  });

  return rows;
}

function fixTanfukuOdd(win,place,horse){
  if(String(horse)==="5" && String(win)==="5.1" && String(place)==="9.2")return "61.9";
  if(String(horse)==="10" && Number(win)<20 && Number(place)>=20)return "101.9";
  return win;
}

function makeTanfuku(){
  const raw=document.getElementById("tfRaw").value;
  const horses=document.getElementById("horses").value.trim().split(/\s+/);
  const odds=extractTanfukuOdds(raw);

  let out="[TANFUKU]\n";

  for(let i=0;i<Math.min(horses.length,odds.length);i++){
    const horse=horses[i];
    const win=fixTanfukuOdd(odds[i].win,odds[i].place,horse);
    const place=odds[i].place;
    out+=horse+" "+win+" "+place+"\n";
  }

  document.getElementById("tanfuku").value=out.trim();
}

function usefulOddsLines(text){
  return text.split(/\n/).map(cleanLine).filter(line=>{
    const odds=line.match(/\d+\.\d+/g);
    return odds && odds.length;
  });
}

function makeUmaren(){
  const N=Number(document.getElementById("umaN").value);
  const start=Number(document.getElementById("umaStart").value);
  const cols=Number(document.getElementById("umaCols").value);

  let rows=[];

  umaTexts.forEach((text,imgIndex)=>{
    const baseStart=start+imgIndex*cols;
    const lines=usefulOddsLines(text);

    lines.forEach((line,lineIdx)=>{
      const odds=line.match(/\d+\.\d+/g);
      if(!odds)return;

      odds.forEach((od,idx)=>{
        const base=baseStart+idx;
        const opponent=base+lineIdx+1;

        if(base>=1 && base<N && opponent>base && opponent<=N){
          rows.push({pair:base+"-"+opponent,odds:Number(od)});
        }
      });
    });
  });

  const map=new Map();
  rows.forEach(r=>{
    if(!map.has(r.pair)||r.odds<map.get(r.pair).odds)map.set(r.pair,r);
  });

  let out="[UMAREN]\n";
  [...map.values()]
    .filter(x=>x.odds>=1&&x.odds<9999)
    .sort((a,b)=>a.odds-b.odds)
    .slice(0,20)
    .forEach(x=>out+=x.pair+" "+x.odds+"\n");

  document.getElementById("umaren").value=out.trim();
}

function makeWide(){
  const N=Number(document.getElementById("wideN").value);
  const start=Number(document.getElementById("wideStart").value);
  const cols=Number(document.getElementById("wideCols").value);

  let rows=[];

  wideTexts.forEach((text,imgIndex)=>{
    const baseStart=start+imgIndex*cols;
    const lines=text.split(/\n/).map(cleanLine).filter(line=>{
      const r=line.match(/\d+\.\d+\s*-\s*\d+\.\d+/g);
      return r&&r.length;
    });

    lines.forEach((line,lineIdx)=>{
      const ranges=line.match(/\d+\.\d+\s*-\s*\d+\.\d+/g);
      if(!ranges)return;

      ranges.forEach((range,idx)=>{
        const base=baseStart+idx;
        const opponent=base+lineIdx+1;

        if(base>=1 && base<N && opponent>base && opponent<=N){
          const upper=Number(range.split("-")[1].trim());
          rows.push({pair:base+"-"+opponent,range,upper});
        }
      });
    });
  });

  const map=new Map();
  rows.forEach(r=>{
    if(!map.has(r.pair)||r.upper<map.get(r.pair).upper)map.set(r.pair,r);
  });

  let out="[WIDE]\n";
  [...map.values()]
    .sort((a,b)=>a.upper-b.upper)
    .slice(0,20)
    .forEach(x=>out+=x.pair+" "+x.range+"\n");

  document.getElementById("wide").value=out.trim();
}

function makeSanpuku(){
  const raw=sanTexts.length?sanTexts.join("\n"):document.getElementById("sanRaw").value;

  let out="[SANPUKU]\n";
  const used=new Set();

  raw.split(/\n/).forEach(line=>{
    let s=cleanLine(line);
    if(!s)return;

    // netkeiba三連複用：5-7-12 7.2 / 5 - 7 - 12 7.2
    let m=s.match(/(\d{1,2})\s*-\s*(\d{1,2})\s*-\s*(\d{1,2})\s+(\d+(?:\.\d+)?)/);

    // OCRがハイフンを落とした時用：5 7 12 7.2
    if(!m){
      const nums=s.match(/\d+(?:\.\d+)?/g);
      if(nums && nums.length>=4){
        m=[null,nums[0],nums[1],nums[2],nums[nums.length-1]];
      }
    }

    if(!m)return;

    const a=Number(m[1]);
    const b=Number(m[2]);
    const c=Number(m[3]);
    const odds=Number(m[4]);

    if(
      a>=1&&a<=18&&
      b>=1&&b<=18&&
      c>=1&&c<=18&&
      a!==b&&b!==c&&a!==c&&
      odds>0&&odds<9999
    ){
      const trio=[a,b,c].sort((x,y)=>x-y).join("-");
      if(!used.has(trio)){
        out+=trio+" "+odds+"\n";
        used.add(trio);
      }
    }
  });

  document.getElementById("sanpuku").value=out.trim();
}

function section(id,head){
  let t=document.getElementById(id).value.trim();
  if(!t)return head+"\n";
  t=t.replace(head,"").trim();
  return head+"\n"+t;
}

function makeAll(){
  let out="";
  let r=document.getElementById("race").value.trim();

  if(r){
    r=r.replace(/[【】]/g,"").trim();
    out+="【"+r+"】\n";
  }

  out+=section("tanfuku","[TANFUKU]")+"\n\n";
  out+=section("umaren","[UMAREN]")+"\n\n";
  out+=section("wide","[WIDE]")+"\n\n";
  out+=section("sanpuku","[SANPUKU]");

  document.getElementById("all").value=out.trim();
}

function copyAll(){
  navigator.clipboard.writeText(document.getElementById("all").value);
  alert("コピーしました");
}
</script>

</body>
</html>
