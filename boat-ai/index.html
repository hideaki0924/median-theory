<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>競艇配列研究AI</title><style>body{font-family:system-ui;background:#f3f6fb;color:#182333;margin:0}main{max-width:780px;margin:auto;padding:16px}section{background:white;padding:18px;border-radius:14px;margin:12px 0;box-shadow:0 2px 10px #0001}h1{font-size:23px}h2{font-size:18px}input,button{font-size:16px;max-width:100%}input[type=file]{width:100%;padding:12px 0}button{background:#1762c4;color:white;border:0;padding:12px;border-radius:8px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}.muted{color:#667} .warn{color:#a34d00}.ok{color:#176c35}</style></head><body><main><h1>🚤 競艇配列研究AI <small>V0.4</small></h1><section><h2>① 過去マスターCSV</h2><p class="muted">初回だけ選択。master_races.csvを選んでください。読込件数が0件なら形式を確認してください。</p><input type="file" id="master" accept=".csv,text/csv"><p id="mstatus">未読込</p></section><section><h2>② レースCSV</h2><p class="muted">実際の勝率が入ったCSVを選んでください。race_template.csvは空のひな形なので分析できません。まず練習用サンプルで確認できます。</p><p><button id="demo" type="button">まずサンプルで動作確認</button></p><input type="file" id="race" accept=".csv,text/csv"><p id="rstatus">未読込</p></section><section id="output"><h2>③ 配列分析</h2><p>マスターとレースCSVを選んでください。</p></section><section><p class="muted">※データは端末内で処理します。予想は過去頻度による参考値で、期待値・展示補正は未実装です。穴3,000円以上、大穴10,000円以上。履歴の件数が少ない場合は見送り表示。</p></section></main><script>
const $=id=>document.getElementById(id);let master=[],race=null;
function csv(s){let rows=[],row=[],cell='',q=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(q&&s[i+1]==='"'){cell+='"';i++}else q=!q}else if(c===','&&!q){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&s[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x!==''))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(x=>x!==''))rows.push(row);let keys=rows.shift()?.map(x=>x.trim().replace(/^\ufeff/,''))||[];return rows.map(a=>Object.fromEntries(keys.map((k,i)=>[k,a[i]||''])));}
function order(rates){if(rates.some(x=>!Number.isFinite(x)))return null;let a=rates.map((x,i)=>[x,i+1]).sort((a,b)=>b[0]-a[0]);if(a.some((x,i)=>i&&x[0]===a[i-1][0]))return null;return a.map(x=>x[1]).join('-')}
function run(){if(!master.length||!race)return;let rates=Array.from({length:6},(_,i)=>{let v=race['rate'+(i+1)];return v===''||v===undefined?NaN:Number(v)});let key=order(rates);if(!key){$('output').innerHTML='<h2>③ 配列分析</h2><p class="warn">勝率が不足または同率です。CSVを確認してください。</p>';return}let exact=master.filter(r=>r.pattern===key),pool=exact;let counts=new Map();for(let r of pool){let v=counts.get(r.trifecta)||{n:0,pays:[]};v.n++;v.pays.push(+r.payout);counts.set(r.trifecta,v)}let sorted=[...counts].sort((a,b)=>b[1].n-a[1].n),median=a=>{a=[...a].sort((x,y)=>x-y);return a.length?(a[Math.floor((a.length-1)/2)]+a[Math.floor(a.length/2)])/2:0};let normal=sorted.filter(([b,v])=>median(v.pays)<3000),hole=sorted.filter(([b,v])=>median(v.pays)>=3000&&median(v.pays)<10000),big=sorted.filter(([b,v])=>median(v.pays)>=10000);let picks=[],used=new Set();for(let [group,n] of [[normal,3],[hole,2],[big,1],[sorted,6]])for(let [b,v] of group){if(picks.length>=6)break;if(!used.has(b)&&(group===sorted||picks.filter(x=>x.group===group).length<n)){picks.push({bet:b,count:v.n,group});used.add(b)}}let fmt=a=>a.map(([b,v])=>'<tr><td>'+b+'</td><td>'+v.n+'</td><td>'+Math.round(median(v.pays)).toLocaleString()+'円</td></tr>').join('');let labels=new Map([[normal,'本線'],[hole,'穴'],[big,'大穴'],[sorted,'補完']]);let rows=picks.map(p=>'<tr><td>'+labels.get(p.group)+'</td><td>'+p.bet+'</td><td>100円</td></tr>').join('');$('output').innerHTML='<h2>③ '+(race.venue||'')+' '+(race.race||'')+'</h2><p><b>勝率配列 '+key+'</b></p><p>完全一致 '+exact.length+'件</p>'+(exact.length<20?'<p class="warn">サンプル20件未満：買い目は参考表示のみ／購入判断はHOLD</p>':'')+'<h3>参考6点</h3><table><tr><th>区分</th><th>3連単</th><th>金額</th></tr>'+rows+'</table><p><b>合計 '+(picks.length*100)+'円</b></p><h3>この配列の穴・大穴</h3><table><tr><th>3連単</th><th>件数</th><th>配当中央値</th></tr>'+fmt([...hole,...big].sort((a,b)=>b[1].n-a[1].n).slice(0,20))+'</table>'+(exact.length===0?'<p class="warn">完全一致0件：見送り</p>':'');}
$('master').onchange=async e=>{try{master=csv(await e.target.files[0].text()).map(r=>({...r,pattern:r.pattern||r.order,trifecta:r.trifecta||r.result})).filter(r=>r.pattern&&r.trifecta&&Number(r.payout)>0);localStorage.setItem('boat_master_v03',JSON.stringify(master));$('mstatus').textContent=master.length.toLocaleString()+'件読み込み・端末に保存';run()}catch(err){$('mstatus').textContent='読み込み失敗：'+err.message}};
$('demo').onclick=()=>{race={venue:'サンプル',race:'練習用',rate1:'5.93',rate2:'4.36',rate3:'6.59',rate4:'2.03',rate5:'5.52',rate6:'4.99'};$('rstatus').textContent='サンプル読み込み完了';run()};$('race').onchange=async e=>{try{race=csv(await e.target.files[0].text())[0];if(!race)throw Error('レース行なし。race_template.csvは空のひな形です。実データ入りのrace_example.csvを選んでください');$('rstatus').textContent=(race.venue||'')+' '+(race.race||'')+' 読み込み完了';run()}catch(err){$('rstatus').textContent='読み込み失敗：'+err.message}};
try{let s=localStorage.getItem('boat_master_v03');if(s){master=JSON.parse(s).map(r=>({...r,pattern:r.pattern||r.order,trifecta:r.trifecta||r.result})).filter(r=>r.pattern&&r.trifecta&&Number(r.payout)>0);$('mstatus').textContent=master.length.toLocaleString()+'件を端末から復元'}}catch(e){}
</script></body></html>
