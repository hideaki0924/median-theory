<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>チャッピーOCR 三連複V0.3</title>
<script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
body{background:#07101f;color:white;font-family:sans-serif;padding:16px}
h1{color:#ffd84d}
.box{background:#111827;padding:14px;border-radius:16px;margin:12px 0}
button,input{width:100%;font-size:20px;padding:14px;margin:8px 0;border-radius:12px}
textarea{width:100%;height:220px;font-size:16px;border-radius:12px;padding:10px;box-sizing:border-box}
.copy{background:#16a34a;color:white;font-weight:bold}
.small{font-size:14px;color:#cbd5e1}
</style>
</head>
<body>

<h1>📸三連複OCR V0.3</h1>
<p>文字化け馬番を対応表で変換 → [SANPUKU]</p>

<div class="box">
<h2>馬番対応表</h2>
<div class="small">例：A=4 B=8 H=9 1H=11</div>
<textarea id="map" style="height:100px">A=4
B=8
H=9
1H=11</textarea>
</div>

<div class="box">
<h2>三連複画像</h2>
<input type="file" id="img" accept="image/*">
<button onclick="runOCR()">画像を読み取る</button>
</div>

<div class="box">
<h2>OCR結果・修正欄</h2>
<textarea id="raw"></textarea>
<button onclick="makeSanpuku()">[SANPUKU]生成</button>
</div>

<div class="box">
<h2>メジアンアプリコード</h2>
<textarea id="code"></textarea>
<button class="copy" onclick="copyCode()">コピー</button>
</div>

<script>
async function runOCR(){
  const file=document.getElementById("img").files[0];
  if(!file){alert("画像を選択してください");return;}
  document.getElementById("raw").value="読み取り中...";
  const result=await Tesseract.recognize(file,"jpn+eng");
  document.getElementById("raw").value=result.data.text;
}

function buildMap(){
  const m={};
  document.getElementById("map").value
    .split(/\n/)
    .forEach(line=>{
      const p=line.trim().split("=");
      if(p.length===2){
        m[p[0].trim()]=p[1].trim();
      }
    });
  return m;
}

function cleanLine(s){
  return s
    .replace(/[０-９]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0))
    .replace(/[．]/g,".")
    .replace(/[ー―－–—]/g,"-")
    .replace(/[|｜]/g," ")
    .replace(/\s+/g," ")
    .trim();
}

function tokenToHorse(tok,map){
  tok=tok.trim();
  if(map[tok])return map[tok];

  // 直接数字ならそのまま
  if(/^\d+$/.test(tok) && Number(tok)>=1 && Number(tok)<=18){
    return tok;
  }

  return "";
}

function makeSanpuku(){
  const map=buildMap();
  const lines=document.getElementById("raw").value.split(/\n/);

  let out="[SANPUKU]\n";
  const used=new Set();

  lines.forEach(line=>{
    let s=cleanLine(line);
    if(!s)return;

    const oddsMatch=s.match(/\d+(?:\.\d+)?\s*$/);
    if(!oddsMatch)return;

    const odds=oddsMatch[0].trim();
    s=s.replace(/\d+(?:\.\d+)?\s*$/,"").trim();

    // 人気順位を削除
    s=s.replace(/^\d+\s+/,"").trim();

    // A-H-B / A-8B-1H のような崩れ対策
    s=s.replace(/8B/g,"H-B");
    s=s.replace(/1H/g," 1H ");

    const parts=s
      .split(/[-\s]+/)
      .map(x=>x.trim())
      .filter(Boolean);

    const horses=[];

    parts.forEach(p=>{
      const h=tokenToHorse(p,map);
      if(h && !horses.includes(h))horses.push(h);
    });

    if(horses.length>=3){
      const trio=horses.slice(0,3).map(Number).sort((a,b)=>a-b).join("-");
      if(!used.has(trio)){
        out+=trio+" "+odds+"\n";
        used.add(trio);
      }
    }
  });

  document.getElementById("code").value=out;
}

function copyCode(){
  navigator.clipboard.writeText(document.getElementById("code").value);
  alert("コピーしました");
}
</script>

</body>
</html>
