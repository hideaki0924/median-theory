<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>チャッピー神予想 V4 1着指数入り</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#07101f;color:#fff;padding:14px;font-size:18px}
textarea{width:100%;height:280px;font-size:17px;border-radius:10px;padding:10px;background:#fff;color:#000;box-sizing:border-box}
textarea::placeholder{color:#777}
button{font-size:20px;padding:10px 14px;margin:6px 4px 6px 0;border-radius:12px;border:0;background:#22c55e;color:#fff}
.btn2{background:#3b82f6}.btn3{background:#64748b}.btn4{background:#f59e0b}
.box{background:#111827;border-radius:14px;padding:14px;margin:12px 0}
h1{font-size:26px}h2{font-size:22px;border-bottom:1px solid #374151;padding-bottom:6px}
.green{color:#22c55e;font-weight:bold}.yellow{color:#facc15;font-weight:bold}.red{color:#fb7185;font-weight:bold}
.hot{color:#fb7185;font-size:24px;font-weight:bold}.gold{color:#facc15;font-size:24px;font-weight:bold}
.small{font-size:15px;color:#cbd5e1}
pre{white-space:pre-wrap;font-size:16px}
.rankWrap{overflow-x:auto;white-space:nowrap}
.row{margin:12px 0;font-size:24px;font-weight:bold}
.label{display:inline-block;width:70px;color:#cbd5e1;font-size:18px}
.cell{display:inline-block;min-width:34px;text-align:center;padding:4px 6px;border-right:1px solid #64748b}
.wallUma{border-right:3px solid #ff3b30}.wallWin{border-right:3px solid #3b82f6}.wallPlace{border-right:3px solid #facc15}
.raceTitle{font-size:30px;font-weight:bold;color:#facc15}
.indexCard{margin:10px 0;padding:10px;border-bottom:1px solid #374151}
</style>
</head>
<body>

<h1>チャッピー神予想 V4 1着指数入り</h1>

<div class="box">
<textarea id="input" placeholder="【レース名】

[TANFUKU]

[UMAREN]

[SANPUKU]"></textarea>
<br>
<button onclick="analyze()">解析</button>
<button class="btn2" onclick="testData()">テスト</button>
<button class="btn3" onclick="resetInput()">リセット</button>
<button class="btn4" onclick="copyResult()">結果コピー</button>
</div>

<div id="result"></div>

<script>
function norm(s){
  return s.replace(/[０-９]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0))
          .replace(/[－ー―–]/g,'-');
}

function parseInput(text){
  text=norm(text);
  const lines=text.split(/\n/).map(x=>x.trim()).filter(Boolean);
  let mode="", raceName="レース名未入力";
  const tanpuku=[],umaren=[],sanpuku=[];

  for(const line of lines){
    if(line.match(/^【.*】$/)){ raceName=line.replace(/[【】]/g,""); continue; }
    if(line.match(/TANFUKU|単勝|複勝/i)){mode="TANFUKU";continue;}
    if(line.match(/UMAREN|馬連|馬複/i)){mode="UMAREN";continue;}
    if(line.match(/SANPUKU|三連複/i)){mode="SANPUKU";continue;}

    const p=line.split(/\s+/);
    if(mode==="TANFUKU" && p.length>=3){
      tanpuku.push({horse:p[0],win:+p[1],place:+p[2]});
    }
    if(mode==="UMAREN" && p.length>=2 && p[0].includes("-")){
      umaren.push({pair:p[0],odds:+p[1]});
    }
    if(mode==="SANPUKU" && p.length>=2 && p[0].includes("-")){
      sanpuku.push({trio:p[0],odds:+p[1]});
    }
  }
  return {raceName,tanpuku,umaren,sanpuku};
}

function medianHorses(list){
  if(!list.length) return [];
  const n=list.length;
  return n%2 ? [list[Math.floor(n/2)].horse] : [list[n/2-1].horse,list[n/2].horse];
}

function wallIndexes(list,key){
  const s=new Set();
  for(let i=0;i<list.length-1;i++){
    if(list[i][key]>0 && list[i+1][key]/list[i][key]>=1.8) s.add(i);
  }
  return s;
}

function beforeWallHorses(list,walls){
  const s=new Set();
  walls.forEach(i=>{
    if(list[i]) s.add(list[i].horse);
    if(list[i-1]) s.add(list[i-1].horse);
  });
  return [...s];
}

function placeWallBefore(placeRank,limit){
  return placeRank.filter(x=>x.place<limit).slice(-2).map(x=>x.horse);
}

function add(map,h,pt,why){
  if(!h) return;
  if(!map[h]) map[h]={pt:0,why:[]};
  map[h].pt+=pt;
  map[h].why.push(why+" +"+pt);
}

function sortedIndex(map){
  return Object.entries(map)
    .sort((a,b)=>b[1].pt-a[1].pt)
    .map(([h,v])=>({horse:h,pt:v.pt,why:v.why}));
}

function grade(pt){
  if(pt>=80) return "S：勝負";
  if(pt>=60) return "B：狙い目";
  if(pt>=40) return "C：注意";
  return "D：様子見";
}

function indexHtml(title,icon,list){
  let html=`<div class="box"><h2>${icon}${title}</h2>`;
  if(!list.length) return html+`<div class="small">該当なし</div></div>`;
  list.forEach(x=>{
    const cls=x.pt>=80?"hot":x.pt>=60?"gold":"green";
    html+=`
      <div style="border-bottom:1px solid #374151;padding:12px 0">
        <div class="${cls}" style="font-size:30px">${x.horse}番　${x.pt}点　${grade(x.pt)}</div>
        <div class="small">${x.why.join(" / ")}</div>
      </div>`;
  });
  return html+`</div>`;
}

function rankLine(label,list,walls,type){
  const wc=type==="uma"?"wallUma":type==="win"?"wallWin":"wallPlace";
  let html=`<div class="row"><span class="label">${label}</span>`;
  list.forEach((x,i)=>{
    html+=`<span class="cell ${walls.has(i)?wc:""}">${x.horse}</span>`;
  });
  html+=`</div>`;
  return html;
}

function classify(topOdds){
  if(topOdds<4) return ["本命戦","green","馬連1番人気が4倍未満"];
  if(topOdds<9) return ["中荒れ戦","yellow","馬連1番人気が4倍以上9倍未満"];
  return ["荒れ戦","red","馬連1番人気が9倍以上"];
}

function analyze(){
  const {raceName,tanpuku,umaren,sanpuku}=parseInput(document.getElementById("input").value);
  const result=document.getElementById("result");

  if(!tanpuku.length || !umaren.length){
    result.innerHTML=`<div class="box red">単勝複勝と馬連を入れてください</div>`;
    return;
  }

  const winRank=[...tanpuku].sort((a,b)=>a.win-b.win);
  const placeRank=[...tanpuku].sort((a,b)=>a.place-b.place);
  const axis=winRank[0].horse;

  const axisUmaren=umaren.filter(x=>x.pair.split("-").includes(axis))
    .sort((a,b)=>a.odds-b.odds)
    .map(x=>{
      const [a,b]=x.pair.split("-");
      return {horse:a===axis?b:a,odds:x.odds,pair:x.pair};
    });

  const umaList=[{horse:axis,odds:0},...axisUmaren];
  const topUmaren=[...umaren].sort((a,b)=>a.odds-b.odds)[0];

  const umaWallsRaw=wallIndexes(axisUmaren,"odds");
  const umaWalls=new Set([...umaWallsRaw].map(i=>i+1));
  const winWalls=wallIndexes(winRank,"win");
  const placeWalls=wallIndexes(placeRank,"place");

  const fuku10=placeWallBefore(placeRank,10);
  const fuku15=placeWallBefore(placeRank,15);
  const winMed=medianHorses(winRank);
  const placeMed=medianHorses(placeRank);
  const umaMed=medianHorses(umaList);

  const winBefore=beforeWallHorses(winRank,winWalls);
  const placeBefore=beforeWallHorses(placeRank,placeWalls);
  const umaBefore=beforeWallHorses(umaList,umaWalls);

  const tansho={}, gekiso={}, ichaku={}, total={};

  // 単勝案件
  [...winMed,...placeMed,...umaMed].forEach(h=>add(tansho,h,10,"メジアン"));
  winBefore.forEach(h=>add(tansho,h,12,"単勝壁前"));
  placeBefore.forEach(h=>add(tansho,h,8,"複勝自然壁前"));
  umaBefore.forEach(h=>add(tansho,h,12,"馬連壁前"));
  fuku15.forEach(h=>add(tansho,h,10,"複勝15倍壁前"));

  // 超激走
  fuku15.forEach(h=>add(gekiso,h,15,"複勝15倍壁前"));
  fuku10.forEach(h=>add(gekiso,h,10,"複勝10倍壁前"));
  placeBefore.forEach(h=>add(gekiso,h,8,"複勝自然壁前"));
  winRank.filter(x=>x.win>=10 && x.win<=30).forEach(x=>add(gekiso,x.horse,10,"単勝10〜30倍"));
  umaBefore.forEach(h=>add(gekiso,h,10,"馬連壁前"));

  // 1着指数
  winRank.slice(0,3).forEach(x=>add(ichaku,x.horse,20,"単勝1〜3人気"));
  winRank.slice(0,5).forEach(x=>add(ichaku,x.horse,10,"単勝1〜5人気"));
  winRank.filter(x=>x.win<30).forEach(x=>add(ichaku,x.horse,8,"単勝30倍未満"));
  winBefore.forEach(h=>add(ichaku,h,15,"単勝壁前"));
  umaBefore.forEach(h=>add(ichaku,h,12,"馬連壁前"));
  Object.keys(tansho).forEach(h=>add(ichaku,h,10,"単勝案件"));
  if(+winRank[0].horse < +placeRank.find(x=>x.horse===winRank[0].horse)?.horse){}

  // 総合指数
  const horses=[...new Set(tanpuku.map(x=>x.horse))];
  horses.forEach(h=>{
    const w=ichaku[h]?.pt||0;
    const t=tansho[h]?.pt||0;
    const g=gekiso[h]?.pt||0;
    add(total,h,Math.round(w*0.4+t*0.35+g*0.25),"総合");
  });

  const ichiList=sortedIndex(ichaku).slice(0,8);
  const tanshoList=sortedIndex(tansho).slice(0,8);
  const gekisoList=sortedIndex(gekiso).slice(0,8);
  const totalList=sortedIndex(total).slice(0,8);

  const shobu=tanshoList.map(x=>x.horse).filter(h=>gekiso[h]);

  const [raceTitle,raceCls,raceReason]=classify(topUmaren.odds);

  result.innerHTML=`
    <div class="box"><div class="raceTitle">【${raceName}】</div></div>

    ${indexHtml("1着指数","👑",ichiList)}
    ${indexHtml("チャッピー総合指数","🔥",totalList)}

    <div class="box">
      <h2>🔥勝負ランプ</h2>
      <div class="hot">${shobu.length?shobu.join("・"):"該当なし"}</div>
      <div class="small">単勝案件と超激走注意馬が重なった馬</div>
    </div>

    ${indexHtml("単勝案件","🎯",tanshoList)}
    ${indexHtml("超激走注意馬","🚨",gekisoList)}

    <div class="box">
      <h2>レース分類</h2>
      <div>馬連1番人気：${topUmaren.pair}　${topUmaren.odds}倍</div>
      <p>${raceReason}</p>
      <div class="${raceCls}" style="font-size:28px">${raceTitle}</div>
    </div>

    <div class="box">
      <h2>本表</h2>
      <div class="small">馬連の壁＝赤線　単勝の壁＝青線　複勝の壁＝黄色線</div>
      <div class="rankWrap">
        ${rankLine("馬連",umaList,umaWalls,"uma")}
        ${rankLine("単勝",winRank,winWalls,"win")}
        ${rankLine("複勝",placeRank,placeWalls,"place")}
      </div>
    </div>
  `;
}

function resetInput(){
  document.getElementById("input").value="";
  document.getElementById("result").innerHTML="";
}

function copyResult(){
  const text=document.getElementById("result").innerText;
  if(!text){ alert("コピーする結果がありません"); return; }
  navigator.clipboard.writeText(text).then(()=>alert("結果をコピーしました"));
}

}
</script>

</body>
</html>
