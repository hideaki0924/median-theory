<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>チャッピー神予想 メジアン理論 完全版V6</title>
<style>
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;background:#f6f6f6;margin:0;padding:14px;color:#111;font-size:18px;line-height:1.55}h1{font-size:24px;margin:8px 0 12px}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 2px 4px rgba(0,0,0,.05)}label{font-weight:900;display:block;margin:10px 0 6px}input,textarea,button{width:100%;font-size:20px;border-radius:14px;border:1px solid #bbb;padding:12px}textarea{height:390px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre;overflow:auto}button{border:0;background:#111;color:white;font-weight:900;margin-top:12px;padding:16px}.secondary{background:#666}.race{font-size:24px;font-weight:900;text-align:center;border:3px solid #111;border-radius:16px;padding:12px;background:#fff}.title{font-size:21px;font-weight:900;border-left:7px solid #111;padding-left:8px;margin:8px 0 10px}.badge{display:inline-block;border-radius:999px;padding:5px 11px;margin:3px;background:#eee;font-weight:900}.black{background:#111;color:#fff}.warn{background:#fff1b8}.danger{background:#ffdede}.ok{background:#e2ffe2}.blue{background:#e8f1ff}.big{font-size:24px;font-weight:900}.small{font-size:14px;color:#666}.tablewrap{overflow:auto}.tbl{border-collapse:collapse;width:100%;font-size:15px}.tbl th,.tbl td{border:1px solid #ddd;padding:6px;text-align:center;white-space:nowrap}.tbl th{background:#f0f0f0}.hr{height:1px;background:#ddd;margin:12px 0}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.err{background:#ffecec;border:2px solid #e55;padding:12px;border-radius:12px;white-space:pre-wrap}.zone{padding:8px;border-radius:10px;margin:6px 0}.z1{background:#e7ffe7}.z2{background:#fff5cf}.z3{background:#ffe8e8}
</style>
</head>
<body>
<h1>チャッピー神予想 メジアン理論 完全版V6</h1>
<div class="card">
<label>レース名</label>
<input id="raceName" placeholder="例：東京11R 安田記念">
<label>オッズ入力</label>
<textarea id="odds" placeholder="【単勝】\n10 2.1\n9 2.3\n\n【複勝】\n10 1.5\n9 1.6\n\n【馬連】\n9-10 2.9\n1-10 9.0\n\n【三連複】\n1-9-10 8.8"></textarea>
<button id="analyzeBtn" type="button">分析する</button>
<button id="sampleBtn" class="secondary" type="button">サンプル入力</button>
<div class="small">入力は「レース名」と「オッズ入力」だけ。単勝・複勝・馬連・三連複をまとめて貼れます。</div>
</div>
<div id="out"></div>
<script>
(function(){
'use strict';
const $ = id => document.getElementById(id);
const circArr=['','①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩','⑪','⑫','⑬','⑭','⑮','⑯','⑰','⑱','⑲','⑳'];
function circ(n){ n=Number(n); return circArr[n] || String(n); }
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function norm(s){return (s||'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[．。]/g,'.').replace(/[－ー―–—]/g,'-').replace(/　/g,' ');}
function listH(arr){return (arr||[]).map(x=>circ(typeof x==='object'?(x.h??x):x)).join('・') || 'なし';}
function rankMap(list){const m={}; list.forEach((x,i)=>{m[x.h]=i+1}); return m;}
function parseSections(text){
  text=norm(text);
  const sec={tan:[], fuku:[], umaren:[], sanren:[]}; let mode='';
  text.split(/\n/).forEach(raw=>{
    let line=raw.trim(); if(!line) return;
    if(/単勝/.test(line)){mode='tan';return;}
    if(/複勝/.test(line)){mode='fuku';return;}
    if(/馬連|馬複|馬れん/.test(line)){mode='umaren';return;}
    if(/三連複|3連複|３連複/.test(line)){mode='sanren';return;}
    let m=line.match(/^([0-9]+)\s+([0-9]+(?:\.[0-9]+)?)(?:\s*[-~～]\s*([0-9]+(?:\.[0-9]+)?))?$/);
    if((mode==='tan'||mode==='fuku') && m){ sec[mode].push({h:+m[1], o:+(m[3]||m[2])}); return; }
    let p=line.match(/^([0-9]+)\s*-\s*([0-9]+)(?:\s*-\s*([0-9]+))?\s+([0-9]+(?:\.[0-9]+)?)$/);
    if(p){
      if(mode==='sanren' || p[3]) sec.sanren.push({hs:[+p[1],+p[2],+(p[3]||0)].filter(Boolean), o:+p[4]});
      else sec.umaren.push({a:+p[1], b:+p[2], o:+p[4]});
    }
  });
  sec.tan.sort((a,b)=>a.o-b.o); sec.fuku.sort((a,b)=>a.o-b.o); sec.umaren.sort((a,b)=>a.o-b.o); sec.sanren.sort((a,b)=>a.o-b.o);
  return sec;
}
function medianItems(arr){ if(!arr.length) return []; const n=arr.length; return n%2 ? [arr[(n-1)/2]] : [arr[n/2-1], arr[n/2]]; }
function walls(items, threshold){ const res=[]; for(let i=0;i<items.length-1;i++){ const d=+(items[i+1].o-items[i].o).toFixed(1); if(d>=threshold) res.push({i,d,before:items[i],after:items[i+1]}); } return res; }
function prev2(items,i){return items.slice(Math.max(0,i-1), i+1);}
function raceJudge(sec){
  let score=0, reasons=[];
  const u1=sec.umaren[0]?.o || 0, t1=sec.tan[0]?.o || 0, f1=sec.fuku[0]?.o || 0;
  const tan30=sec.tan.filter(x=>x.o<30).length;
  const f3=sec.fuku.filter(x=>x.o<3).length;
  const f6=sec.fuku.filter(x=>x.o<6).length;
  const f15=sec.fuku.findIndex(x=>x.o>=15);
  if(t1 && t1<=3 && f1 && f1<=1.5){score-=2; reasons.push('超1番人気あり');}
  if(u1>=9){score+=3; reasons.push('馬連1人気9倍以上');}
  else if(u1>=5){score+=1; reasons.push('馬連1人気5倍以上');}
  else if(u1>0){score-=1; reasons.push('馬連1人気5倍未満');}
  if(tan30>=10){score+=3; reasons.push('単勝30倍未満10頭以上');}
  else if(tan30>=7){score+=1; reasons.push('単勝30倍未満7頭以上');}
  if(f6<=4 && sec.fuku.length){score+=2; reasons.push('複勝6倍未満4頭以下');}
  else if(f6<=7 && sec.fuku.length){score+=1; reasons.push('複勝6倍未満5〜7頭');}
  else if(f6>=8){score-=1; reasons.push('複勝6倍未満8頭以上');}
  if(f15>0){score+=1; reasons.push('複勝15倍の壁あり');}
  if(walls(sec.umaren.map(p=>({o:p.o,label:p.a+'-'+p.b})),8).length){score+=1; reasons.push('馬連8倍以上の壁あり');}
  let type='普通'; if(score>=6) type='大穴'; else if(score>=3) type='準大穴'; else if(score>=1) type='中穴'; else if(score<=-2) type='堅い/超1番人気';
  return {type,score,reasons,tan30,f3,f6,u1,t1,f1};
}
function ootani(sec){
  const axis=sec.tan[0]?.h; if(!axis) return null;
  const rel=sec.umaren.filter(p=>p.a===axis || p.b===axis).map(p=>({h:p.a===axis?p.b:p.a,o:p.o,label:p.a+'-'+p.b})).sort((a,b)=>a.o-b.o);
  return {axis, rank:[{h:axis,o:null,label:String(axis)}].concat(rel)};
}
function medians(sec){
  const res=[]; function add(name,arr){const m=medianItems(arr); if(m.length) res.push({name, hs:[...new Set(m.map(x=>x.h))], text:listH(m)});}
  add('単勝全体',sec.tan); add('単勝10倍以内',sec.tan.filter(x=>x.o<=10)); add('単勝10倍以上',sec.tan.filter(x=>x.o>=10)); add('単勝20倍以内',sec.tan.filter(x=>x.o<=20)); add('単勝10〜20倍',sec.tan.filter(x=>x.o>=10&&x.o<=20)); add('単勝30倍未満',sec.tan.filter(x=>x.o<30));
  add('複勝全体',sec.fuku); add('複勝3倍未満',sec.fuku.filter(x=>x.o<3)); add('複勝6倍未満',sec.fuku.filter(x=>x.o<6)); add('複勝12倍以内',sec.fuku.filter(x=>x.o<=12));
  const pairs=sec.umaren.map(p=>({o:p.o,label:p.a+'-'+p.b,pair:[p.a,p.b]}));
  [['馬連全体',pairs],['馬連10倍以内',pairs.filter(x=>x.o<=10)],['馬連20倍以内',pairs.filter(x=>x.o<=20)],['馬連80倍未満',pairs.filter(x=>x.o<80)]].forEach(([name,arr])=>{const m=medianItems(arr); if(m.length) res.push({name, hs:[...new Set(m.flatMap(x=>x.pair))], text:m.map(x=>x.label).join(' / ')});});
  return res;
}
function fukuWallHtml(sec){
  let html=''; const f=sec.fuku;
  const idx6=f.findIndex(x=>x.o>=6); if(idx6>0){html += `複勝6倍の壁：${circ(f[idx6-1].h)} ${f[idx6-1].o} → ${circ(f[idx6].h)} ${f[idx6].o}<br>壁前2頭：${listH(f.slice(Math.max(0,idx6-2),idx6))}<br>`;}
  const idx15=f.findIndex(x=>x.o>=15); if(idx15>0){html += `複勝15倍の壁：${circ(f[idx15-1].h)} ${f[idx15-1].o} → ${circ(f[idx15].h)} ${f[idx15].o}<br>壁前2頭：${listH(f.slice(Math.max(0,idx15-2),idx15))}<br>`;}
  return html || '複勝6倍/15倍の壁：明確な壁なし<br>';
}
function renderWalls(title, items, th){
  const ws=walls(items,th); if(!ws.length) return `<b>${title}</b>：大きな壁なし<br>`;
  return `<b>${title}</b><br>`+ws.map(w=>{
    const b=w.before.label || circ(w.before.h); const a=w.after.label || circ(w.after.h);
    const p=prev2(items,w.i).map(x=>x.label || circ(x.h)).join('・');
    return `・${b} ${w.before.o} → ${a} ${w.after.o} <span class="badge danger">+${w.d}</span> 壁前2頭：${p}`;
  }).join('<br>')+'<br>';
}
function moves(sec,o){
  const tr=rankMap(sec.tan), fr=rankMap(sec.fuku); const rows=[];
  o.rank.forEach((x,i)=>{const mr=i+1,h=x.h; const upT=tr[h]?mr-tr[h]:0, upF=fr[h]?mr-fr[h]:0; if(upT>=4 || upF>=4) rows.push({h,mr,tr:tr[h]||'-',fr:fr[h]||'-'});});
  return rows;
}
function dupRank(sec,meds,o){
  const pts={}; function add(h,why){ if(!h)return; pts[h]=pts[h]||{n:0,why:[]}; pts[h].n++; pts[h].why.push(why); }
  meds.forEach(m=>m.hs.forEach(h=>add(h,m.name)));
  if(o){o.rank.slice(1,5).forEach(x=>add(x.h,'大谷式本命')); o.rank.slice(5,9).forEach(x=>add(x.h,'大谷式中穴'));}
  sec.umaren.slice(0,10).forEach(p=>{add(p.a,'馬連上位'); add(p.b,'馬連上位');});
  sec.sanren.slice(0,10).forEach(p=>p.hs.forEach(h=>add(h,'三連複上位')));
  return Object.entries(pts).map(([h,v])=>({h:+h,n:v.n,why:[...new Set(v.why)]})).sort((a,b)=>b.n-a.n || a.h-b.h);
}
function sanrenTop(sec){ const c={}; sec.sanren.slice(0,10).forEach(p=>p.hs.forEach(h=>c[h]=(c[h]||0)+1)); return Object.entries(c).map(([h,n])=>({h:+h,n})).sort((a,b)=>b.n-a.n); }
function rowCells(arr, max){let s=''; for(let i=0;i<max;i++) s+=`<td>${arr[i]!==undefined?arr[i]:''}</td>`; return s;}
function analyze(){
 try{
  const sec=parseSections($('odds').value); const rn=esc($('raceName').value.trim()||'レース名未入力');
  if(!sec.tan.length && !sec.fuku.length && !sec.umaren.length && !sec.sanren.length){$('out').innerHTML='<div class="err">オッズが読み取れません。サンプル入力で形式を確認してください。</div>'; return;}
  const judge=raceJudge(sec), o=ootani(sec), meds=medians(sec), dup=dupRank(sec,meds,o);
  let html=`<div class="race">${rn}</div>`;
  html+=`<div class="card"><div class="title">最初に見るところ</div><span class="badge black">${judge.type}</span><span class="badge">荒れ指数 ${judge.score}</span>${dup[0]?`<div class="big">単勝案件：${circ(dup[0].h)}（${dup[0].n}回）</div>`:''}${o?`<div>大谷式軸：${circ(o.axis)}</div>`:''}<div class="small">${judge.reasons.map(r=>'・'+r).join('<br>')}</div></div>`;
  if(o){
    const max=Math.max(o.rank.length, sec.tan.length, sec.fuku.length);
    html+=`<div class="card"><div class="title">本家大谷式 馬連</div><div>単勝1番人気を先頭：<span class="big">${circ(o.axis)}</span></div><div class="tablewrap"><table class="tbl"><tr><th>順位</th>${Array.from({length:max},(_,i)=>`<th>${i+1}</th>`).join('')}</tr><tr><th>馬連</th>${rowCells(o.rank.map(x=>circ(x.h)),max)}</tr><tr><th>馬連オッズ</th>${rowCells(o.rank.map((x,i)=>i===0?'-':x.o),max)}</tr><tr><th>単勝</th>${rowCells(sec.tan.map(x=>circ(x.h)),max)}</tr><tr><th>複勝</th>${rowCells(sec.fuku.map(x=>circ(x.h)),max)}</tr></table></div><div class="zone z1"><b>本命ゾーン</b>：${listH(o.rank.slice(1,5))}</div><div class="zone z2"><b>中穴ゾーン</b>：${listH(o.rank.slice(5,9))}</div><div class="zone z3"><b>大穴ゾーン</b>：${listH(o.rank.slice(9))}</div></div>`;
  }
  html+=`<div class="card"><div class="title">壁・乖離差</div>${renderWalls('単勝壁',sec.tan.map(x=>({h:x.h,o:x.o})),8)}${renderWalls('馬連壁',sec.umaren.map(p=>({o:p.o,label:p.a+'-'+p.b})),8)}${fukuWallHtml(sec)}</div>`;
  html+=`<div class="card"><div class="title">メジアン</div>${meds.map(m=>`<b>${m.name}</b>：${m.text}`).join('<br>')||'なし'}</div>`;
  if(o){ const mv=moves(sec,o); html+=`<div class="card"><div class="title">突入＆移動馬</div>${mv.length?mv.map(x=>`${circ(x.h)}：馬連${x.mr}位 → 単勝${x.tr}位 / 複勝${x.fr}位`).join('<br>'):'該当なし'}</div>`; }
  html+=`<div class="card"><div class="title">重複ランキング</div>${dup.length?dup.slice(0,10).map((x,i)=>`${i+1}位 ${circ(x.h)}：${x.n}回 <span class="small">${x.why.slice(0,5).join(' / ')}</span>`).join('<br>'):'なし'}</div>`;
  const st=sanrenTop(sec); if(st.length) html+=`<div class="card"><div class="title">三連複 出現回数</div>${st.slice(0,8).map((x,i)=>`${i+1}位 ${circ(x.h)}：${x.n}回`).join('<br>')}<div class="small">三連複上位10点から集計</div></div>`;
  html+=`<div class="card"><div class="title">買い方の目安</div>${o?`本命：${listH(o.rank.slice(1,5))}<br>中穴：${listH(o.rank.slice(5,9))}<br>`:''}${judge.type.includes('堅')?'堅め判定。本命ゾーン中心、小穴まで。':judge.type.includes('大穴')?'荒れ判定。本命1頭＋中穴/大穴ゾーンを厚め。':'本命ゾーン＋中穴ゾーンを中心。'}<br><b>中心候補</b>：${dup.slice(0,6).map(x=>circ(x.h)).join('・')||'なし'}</div>`;
  $('out').innerHTML=html;
 }catch(e){ $('out').innerHTML='<div class="err">エラーが出ました。\n'+esc(e.message)+'\n\n入力形式を確認してください。</div>'; console.error(e); }
}

 $('raceName').value='サンプル 8-9-3検証レース';
 $('odds').value=`【単勝】

window.addEventListener('DOMContentLoaded',function(){
 $('analyzeBtn').addEventListener('click',analyze);
 $('sampleBtn').addEventListener('click',sample);
});
})();
</script>
