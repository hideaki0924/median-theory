<style>

<body>
<h1>チャッピー神予想 V1.8<br>人気ゾーン端頭残し＋穴帯クラスター救済版</h1>

<textarea id="input" placeholder="【レース名】

[TANFUKU]
馬番 単勝 複勝上限

[UMAREN]
馬番-馬番 オッズ

[WIDE]
馬番-馬番 オッズ

[SANPUKU]
馬番-馬番-馬番 オッズ"></textarea><br>

<button class="go" id="btnRun">解析</button>
<button class="test" id="btnSample">テスト</button>
<button class="clear" id="btnClear">リセット</button>
<button class="copy" id="btnCopy">結果コピー</button>
<div id="out"></div>

<script>
var latestCopyText="";

function zenToHan(str){
  return String(str)
    .replace(/[０-９]/g,function(s){return String.fromCharCode(s.charCodeAt(0)-65248);})
    .replace(/．/g,'.').replace(/[－ー―−]/g,'-').replace(/[　]/g,' ').replace(/[〜～]/g,'-');
}
function nums(line){
  var m=zenToHan(line).match(/\d+(?:\.\d+)?/g);
  if(!m)return[];
  return m.map(function(x){return Number(x);});
}
function pairKey(a,b){return[a,b].map(String).sort(function(x,y){return Number(x)-Number(y);}).join('-');}
function triKey(a,b,c){return[a,b,c].map(String).sort(function(x,y){return Number(x)-Number(y);}).join('-');}
function uniq(arr){
  var s={},out=[];
  for(var i=0;i<arr.length;i++){
    var v=String(arr[i]);
    if(v&&v!=="undefined"&&!s[v]){s[v]=true;out.push(v);}
  }
  return out;
}
function sortOdds(arr){return arr.slice().sort(function(a,b){return Number(a.od)-Number(b.od);});}
function sortBy(arr,key){return arr.slice().sort(function(a,b){return Number(a[key])-Number(b[key]);});}
function joinH(arr){if(!arr||!arr.length)return"なし";return arr.map(function(x){return x+"番";}).join("・");}
function mid(arr){
  if(!arr.length)return[];
  if(arr.length===1)return[arr[0]];
  var n=arr.length;
  if(n%2===1)return[arr[Math.floor(n/2)]];
  return[arr[n/2-1],arr[n/2]];
}
function midPair(arr){
  if(!arr.length)return[];
  if(arr.length===1)return[arr[0]];
  var n=arr.length;
  if(n%2===0)return[arr[n/2-1],arr[n/2]];
  var m=Math.floor(n/2);
  return uniq([arr[m],arr[Math.max(0,m-1)]]);
}
function getTf(data,h){
  h=String(h);
  for(var i=0;i<data.tanfuku.length;i++){
    if(data.tanfuku[i].h===h)return data.tanfuku[i];
  }
  return null;
}
function findPair(arr,a,b){
  var k=pairKey(a,b);
  for(var i=0;i<arr.length;i++){if(arr[i].key===k)return arr[i];}
  return null;
}
function findTri(arr,a,b,c){
  var k=triKey(a,b,c);
  for(var i=0;i<arr.length;i++){if(arr[i].key===k)return arr[i];}
  return null;
}

function parseData(raw){
  var text=zenToHan(raw),lines=text.split(/\n/),title="レース",sec="";
  var tanfuku=[],umaren=[],wide=[],sanpuku=[];
  for(var i=0;i<lines.length;i++){
    var line=lines[i].trim();
    if(!line)continue;
    if(line.indexOf("【")===0)title=line;
    var up=line.toUpperCase();
    if(up.indexOf("[TANFUKU]")===0){sec="TANFUKU";continue;}
    if(up.indexOf("[UMAREN]")===0){sec="UMAREN";continue;}
    if(up.indexOf("[WIDE]")===0){sec="WIDE";continue;}
    if(up.indexOf("[SANPUKU]")===0){sec="SANPUKU";continue;}

    if(sec==="TANFUKU"){
      var n=nums(line);
      if(n.length>=3)tanfuku.push({h:String(Math.floor(n[0])),tan:n[1],fuku:n[n.length-1]});
    }
    if(sec==="UMAREN"){
      var m=line.match(/(\d+)\s*-\s*(\d+)/),o=nums(line);
      if(m&&o.length)umaren.push({a:m[1],b:m[2],od:o[o.length-1],key:pairKey(m[1],m[2])});
    }
    if(sec==="WIDE"){
      var mw=line.match(/(\d+)\s*-\s*(\d+)/),ow=nums(line);
      if(mw&&ow.length)wide.push({a:mw[1],b:mw[2],od:ow[ow.length-1],key:pairKey(mw[1],mw[2])});
    }
    if(sec==="SANPUKU"){
      var ms=line.match(/(\d+)\s*-\s*(\d+)\s*-\s*(\d+)/),os=nums(line);
      if(ms&&os.length)sanpuku.push({a:ms[1],b:ms[2],c:ms[3],od:os[os.length-1],key:triKey(ms[1],ms[2],ms[3])});
    }
  }
  return{title:title,tanfuku:tanfuku,umaren:umaren,wide:wide,sanpuku:sanpuku};
}

function countPair(pairs,topN){
  var map={},arr=sortOdds(pairs).slice(0,topN);
  for(var i=0;i<arr.length;i++){
    [arr[i].a,arr[i].b].forEach(function(h){
      if(!map[h])map[h]={h:h,count:0};
      map[h].count++;
    });
  }
  var out=[];for(var k in map)out.push(map[k]);
  return out.sort(function(a,b){return b.count-a.count;});
}
function countTri(tris,topN){
  var map={},arr=sortOdds(tris).slice(0,topN);
  for(var i=0;i<arr.length;i++){
    [arr[i].a,arr[i].b,arr[i].c].forEach(function(h){
      if(!map[h])map[h]={h:h,count:0};
      map[h].count++;
    });
  }
  var out=[];for(var k in map)out.push(map[k]);
  return out.sort(function(a,b){return b.count-a.count;});
}
function detectWalls(items){
  var arr=sortOdds(items).slice(0,14),walls=[];
  for(var i=0;i<arr.length-1;i++){
    var now=arr[i].od,next=arr[i+1].od,ratio=next/now,diff=next-now;
    if(ratio>=1.55||diff>=8)walls.push({before:i+1,after:i+2,ratio:ratio,diff:diff});
  }
  return walls;
}
function zonePairs(pairs,walls){
  var top=sortOdds(pairs).slice(0,14);
  if(!top.length)return[];
  if(walls.length>=2)return top.slice(walls[0].after-1,walls[1].before);
  if(walls.length===1)return top.slice(0,walls[0].before);
  return top.slice(0,6);
}
function pairHorses(pairs){
  var a=[];
  for(var i=0;i<pairs.length;i++){a.push(pairs[i].a);a.push(pairs[i].b);}
  return uniq(a);
}
function fukuFront(tanfuku,limit){
  var arr=sortBy(tanfuku,"fuku").filter(function(x){return x.fuku<=limit;});
  return arr.slice(Math.max(0,arr.length-2)).map(function(x){return x.h;});
}
function fukuAfter(tanfuku,limit){
  var arr=sortBy(tanfuku,"fuku").filter(function(x){return x.fuku>limit;});
  return arr.slice(0,2).map(function(x){return x.h;});
}

function connectionCount(data,h,topN){
  h=String(h);
  var u=sortOdds(data.umaren).slice(0,topN||12).filter(function(p){return p.a===h||p.b===h;}).length;
  var w=sortOdds(data.wide).slice(0,topN||12).filter(function(p){return p.a===h||p.b===h;}).length;
  var s=sortOdds(data.sanpuku).slice(0,topN||12).filter(function(t){return t.a===h||t.b===h||t.c===h;}).length;
  return{umaren:u,wide:w,sanpuku:s,total:u+w+s};
}

function detectEdgeHead(data,ctx){
  if(ctx.topUma<4||ctx.topUma>=9)return null;
  if(ctx.heroH.length||ctx.semiHeroH.length)return null;
  var tanRank=sortBy(data.tanfuku,"tan");
  var zone=tanRank.filter(function(x){return x.tan>=4&&x.tan<=9.9;});
  if(zone.length<3)return null;

  var cand=zone[zone.length-1]; // 人気ゾーンの端＝単勝が一番高い馬
  var con=connectionCount(data,cand.h,12);

  // 福島1R型：人気ゾーン端＋馬連/ワイド/三連複に広く残る
  if(con.umaren>=2||con.wide>=2||con.total>=4){
    return{h:cand.h,tan:cand.tan,fuku:cand.fuku,zone:zone.map(function(x){return x.h;}),con:con};
  }
  return null;
}

function rankHoleForHead(data,head,holes,ctx){
  return holes.slice().sort(function(a,b){
    function pt(h){
      var tf=getTf(data,h),p=0;
      var u=findPair(data.umaren,head,h),w=findPair(data.wide,head,h);
      if(u)p+=Math.max(0,40-Number(u.od));
      if(w)p+=Math.max(0,25-Number(w.od));
      if(ctx.sanTop.indexOf(h)>=0)p+=8;
      if(ctx.umaTop.indexOf(h)>=0)p+=6;
      if(tf){p+=Math.max(0,25-tf.tan)/2;p+=Math.max(0,10-tf.fuku);}
      return p;
    }
    return pt(b)-pt(a);
  });
}


function bestTriWithTwo(data,a,b,limit){
  var best=null;
  var arr=sortOdds(data.sanpuku);
  for(var i=0;i<arr.length;i++){
    var t=arr[i],hs=[t.a,t.b,t.c];
    if(hs.indexOf(String(a))>=0&&hs.indexOf(String(b))>=0){
      if(!best||Number(t.od)<Number(best.od))best=t;
      if(limit&&Number(t.od)<=limit)return t;
    }
  }
  return best;
}

function detectHoleClusterRescue(data,ctx){
  var hero=(ctx.heroH[0]||ctx.semiHeroH[0]);
  if(!hero)return [];

  var anchors=uniq(ctx.fukuM.concat(ctx.doubleMedian).concat(ctx.medianHoleH)).filter(function(h){
    return h!==hero;
  });
  var map={};

  for(var ai=0;ai<anchors.length;ai++){
    var a=anchors[ai];
    var atf=getTf(data,a);
    if(!atf||atf.tan<10||atf.tan>35)continue;

    for(var i=0;i<data.tanfuku.length;i++){
      var x=data.tanfuku[i];
      var h=x.h;
      if(h===hero||h===a)continue;
      if(x.tan<10||x.tan>35)continue;

      var tanDiff=Math.abs(Number(x.tan)-Number(atf.tan));
      var fukuDiff=Math.abs(Number(x.fuku)-Number(atf.fuku));

      // 同じ穴帯クラスターだけを拾う。小倉2Rの7・8・9・5型。
      if(tanDiff>2.5||fukuDiff>1.0)continue;

      var u=findPair(data.umaren,hero,h);
      var w=findPair(data.wide,hero,h);
      var tr=bestTriWithTwo(data,hero,h,60);

      var connected=false;
      if(w&&Number(w.od)<=15)connected=true;
      if(u&&Number(u.od)<=80)connected=true;
      if(tr&&Number(tr.od)<=60)connected=true;
      if(!connected)continue;

      var score=0;
      score+=Math.max(0,1.2-fukuDiff)*30;
      score+=Math.max(0,2.5-tanDiff)*5;
      if(w)score+=Math.max(0,15-Number(w.od));
      if(u)score+=Math.max(0,80-Number(u.od))/12;
      if(tr)score+=Math.max(0,60-Number(tr.od))/4;
      if(ctx.sanTop.indexOf(h)>=0)score+=4;
      if(Number(x.fuku)<=6)score+=3;

      if(!map[h]||score>map[h].score){
        map[h]={h:h,score:score,anchor:a,tan:x.tan,fuku:x.fuku,tri:tr?tr.key:"",triOd:tr?tr.od:""};
      }
    }
  }

  var out=[];
  for(var k in map)out.push(map[k]);
  out.sort(function(a,b){return b.score-a.score;});
  return out;
}

function makeContext(data){
  var tanRank=sortBy(data.tanfuku,"tan"),fukuRank=sortBy(data.tanfuku,"fuku"),umaRank=sortOdds(data.umaren);
  var topUma=umaRank[0]?umaRank[0].od:999;
  var raceType="大荒れ戦";
  if(topUma<4)raceType="本命戦";
  else if(topUma<9)raceType="中荒れ戦";
  else if(topUma<15)raceType="荒れ戦";

  var mainWalls=detectWalls(data.umaren);
  var zone=zonePairs(data.umaren,mainWalls);
  var zoneH=pairHorses(zone);
  var zoneM=mid(zoneH);
  var tanM=mid(tanRank.map(function(x){return x.h;}));
  var fukuM=midPair(fukuRank.map(function(x){return x.h;}));

  var fuku3=fukuRank.filter(function(x){return x.fuku<3;}).map(function(x){return x.h;});
  var fuku6=fukuFront(data.tanfuku,6);
  var fuku10=fukuFront(data.tanfuku,10);
  var fuku15=fukuFront(data.tanfuku,15);
  var fuku15a=fukuAfter(data.tanfuku,15);

  var umaTop=countPair(data.umaren,10).slice(0,5).map(function(x){return x.h;});
  var wideTop=countPair(data.wide,10).slice(0,5).map(function(x){return x.h;});
  var sanTop=countTri(data.sanpuku,10).slice(0,5).map(function(x){return x.h;});

  var heroH=data.tanfuku.filter(function(x){return x.tan<=1.8&&x.fuku<=1.2;}).sort(function(a,b){return a.tan-b.tan;}).map(function(x){return x.h;});
  var semiHeroH=data.tanfuku.filter(function(x){return x.tan<=2.2&&x.fuku<=1.5&&heroH.indexOf(x.h)<0;}).sort(function(a,b){return a.tan-b.tan;}).map(function(x){return x.h;});

  var doubleMedian=tanM.filter(function(h){return fukuM.indexOf(h)>=0;});
  var fukuMedianPair=(topUma>=4&&fukuM.length>=2);
  var medianHoleH=fukuM.filter(function(h){
    var tf=getTf(data,h);
    return tf&&tf.tan>=15;
  });

  var popularZoneH=tanRank.filter(function(x){return x.tan>=4&&x.tan<=9.9;}).map(function(x){return x.h;});

  var ctx={
    tanRank:tanRank,fukuRank:fukuRank,umaRank:umaRank,
    topUma:topUma,raceType:raceType,mainWalls:mainWalls,zone:zone,zoneH:zoneH,zoneM:zoneM,
    tanM:tanM,fukuM:fukuM,fuku3:fuku3,fuku6:fuku6,fuku10:fuku10,fuku15:fuku15,fuku15a:fuku15a,
    umaTop:umaTop,wideTop:wideTop,sanTop:sanTop,
    heroH:heroH,semiHeroH:semiHeroH,doubleMedian:doubleMedian,
    fukuMedianPair:fukuMedianPair,medianHoleH:medianHoleH,popularZoneH:popularZoneH
  };

  ctx.edgeHead=detectEdgeHead(data,ctx);
  if(ctx.edgeHead&&medianHoleH.length){
    ctx.medianHoleH=rankHoleForHead(data,ctx.edgeHead.h,medianHoleH,ctx);
  }

  ctx.holeClusterItems=detectHoleClusterRescue(data,ctx);
  ctx.holeClusterH=ctx.holeClusterItems.map(function(x){return x.h;}).slice(0,3);

  return ctx;
}

function scoreAll(data,ctx){
  var allHorses=uniq(data.tanfuku.map(function(x){return x.h;})),scored=[];
  for(var i=0;i<allHorses.length;i++){
    var h=allHorses[i],tf=getTf(data,h),score=0,reasons=[];
    if(ctx.zoneH.indexOf(h)>=0){score+=6;reasons.push("馬連壁内");}
    if(ctx.zoneM.indexOf(h)>=0){score+=8;reasons.push("馬連ゾーンメジアン");}
    if(ctx.tanM.indexOf(h)>=0){score+=5;reasons.push("単勝メジアン");}
    if(ctx.fukuM.indexOf(h)>=0){score+=5;reasons.push("複勝メジアン");}
    if(ctx.fuku6.indexOf(h)>=0){score+=6;reasons.push("複勝6倍壁前");}
    if(ctx.fuku10.indexOf(h)>=0){score+=5;reasons.push("複勝10倍壁前");}
    if(ctx.fuku15.indexOf(h)>=0){score+=3;reasons.push("複勝15倍壁前");}
    if(ctx.umaTop.indexOf(h)>=0){score+=5;reasons.push("馬連出現上位");}
    if(ctx.wideTop.indexOf(h)>=0){score+=4;reasons.push("ワイド出現上位");}
    if(ctx.sanTop.indexOf(h)>=0){score+=4;reasons.push("三連複出現上位");}
    if(ctx.heroH.indexOf(h)>=0){score+=20;reasons.push("1倍台本命保護");}
    if(ctx.semiHeroH.indexOf(h)>=0){score+=14;reasons.push("準本命保護");}
    if(ctx.doubleMedian.indexOf(h)>=0){score+=10;reasons.push("単複メジアン重複");}
    if(ctx.edgeHead&&ctx.edgeHead.h===h){score+=18;reasons.push("人気ゾーン端の頭残し");}
    if(ctx.medianHoleH.indexOf(h)>=0){score+=8;reasons.push("複勝メジアン穴2・3着");}
    if(ctx.holeClusterH&&ctx.holeClusterH.indexOf(h)>=0){score+=7;reasons.push("穴帯クラスター3着救済");}
    if(tf&&tf.fuku>15){score-=3;reasons.push("複勝15倍外で弱め");}
    scored.push({h:h,score:score,reasons:reasons,tan:tf?tf.tan:"-",fuku:tf?tf.fuku:"-"});
  }
  scored.sort(function(a,b){
    if(b.score!==a.score)return b.score-a.score;
    return Number(a.fuku)-Number(b.fuku);
  });
  return scored;
}

function chooseFinal(data,ctx,scored){
  var lamps=[],mode="通常",axisH=[],partnerH=[],head3tanH=[],hole23H=[],cluster3H=[];

  if(ctx.heroH.length)lamps.push("🚨1倍台本命保護："+joinH(ctx.heroH));
  if(ctx.semiHeroH.length)lamps.push("🟧準本命保護："+joinH(ctx.semiHeroH));
  if(ctx.fukuMedianPair)lamps.push("🟣複勝メジアンペア保護："+joinH(ctx.fukuM));
  if(ctx.doubleMedian.length)lamps.push("🔥単複メジアン重複："+joinH(ctx.doubleMedian));

  if(ctx.edgeHead){
    mode="人気ゾーン端の頭残し";
    axisH=[ctx.edgeHead.h];
    head3tanH=[ctx.edgeHead.h];
    lamps.push("🚩人気ゾーン端の頭残しランプ："+ctx.edgeHead.h+"番 単"+ctx.edgeHead.tan+" / 複"+ctx.edgeHead.fuku+"（馬連"+ctx.edgeHead.con.umaren+"・ワイド"+ctx.edgeHead.con.wide+"・三連複"+ctx.edgeHead.con.sanpuku+"連結）");
    if(ctx.medianHoleH.length){
      hole23H=ctx.medianHoleH.slice(0,2);
      lamps.push("🟣複勝メジアン穴 2・3着寄せ："+joinH(hole23H));
    }

    var pop=ctx.popularZoneH.filter(function(h){return h!==axisH[0];});
    var top=uniq(hole23H.concat(pop).concat(ctx.umaTop).concat(ctx.sanTop).concat(scored.map(function(x){return x.h;})));
    partnerH=top.filter(function(h){return axisH.indexOf(h)<0;}).slice(0,5);
  }
  else if(ctx.heroH.length||ctx.semiHeroH.length){
    mode="本命保護";
    var hero=(ctx.heroH[0]||ctx.semiHeroH[0]);
    axisH=[hero];

    // 本命保護時は、スコア順だけでなく「複勝メジアン穴→単勝メジアン→馬連/ワイド/三連複上位」の順で相手を残す。
    // 小倉2R型では、7・16に加えて単勝メジアン側の8を3着候補へ上げる。
    var heroPool=uniq(
      ctx.fukuM
      .concat(ctx.tanM)
      .concat(ctx.umaTop)
      .concat(ctx.wideTop)
      .concat(ctx.sanTop)
      .concat(scored.map(function(x){return x.h;}))
    );
    partnerH=heroPool.filter(function(h){return h!==hero;}).slice(0,7);

    if(ctx.holeClusterH&&ctx.holeClusterH.length){
      cluster3H=ctx.holeClusterH.slice(0,3);
      lamps.push("🕳穴帯クラスター3着救済："+joinH(cluster3H));
      partnerH=uniq(partnerH.concat(cluster3H)).slice(0,8);
    }

    // 超1番人気赤信号：本命なし三連複
    var ss=sortOdds(data.sanpuku).slice(0,12);
    for(var i=0;i<ss.length;i++){
      var tri=ss[i],hs=[tri.a,tri.b,tri.c];
      if(tri.od<=45&&hs.indexOf(hero)<0){
        lamps.push("🚨超1番人気赤信号：本命なし三連複 "+tri.key+"（"+tri.od+"倍）");
        break;
      }
    }
  }
  else if(ctx.doubleMedian.length&&ctx.topUma>=4){
    mode="複勝メジアンペア";
    var dm=ctx.doubleMedian[0];
    axisH=[dm];
    partnerH=uniq(ctx.fukuM.concat(ctx.popularZoneH).concat(ctx.umaTop).concat(scored.map(function(x){return x.h;}))).filter(function(h){return h!==dm;}).slice(0,5);
    if(ctx.medianHoleH.length){
      hole23H=ctx.medianHoleH.slice(0,2);
      lamps.push("🟣複勝メジアン穴 2・3着寄せ："+joinH(hole23H));
    }
  }
  else{
    mode="通常";
    axisH=scored.slice(0,1).map(function(x){return x.h;});
    partnerH=scored.slice(1,6).map(function(x){return x.h;});
  }

  return{mode:mode,axisH:axisH,partnerH:partnerH,lamps:lamps,head3tanH:head3tanH,hole23H:hole23H,cluster3H:cluster3H};
}

function makeTickets(data,ctx,pick){
  var wide=[],umaren=[],sanpuku=[],sanrentan=[];
  function add(arr,v){if(v&&arr.indexOf(v)<0)arr.push(v);}
  function addFront(arr,v){if(v){var idx=arr.indexOf(v);if(idx>=0)arr.splice(idx,1);arr.unshift(v);}}
  function addPair(a,b){if(a&&b&&a!==b)return pairKey(a,b);return null;}
  function addTri(a,b,c){if(a&&b&&c&&a!==b&&a!==c&&b!==c)return triKey(a,b,c);return null;}
  function addTan(a,b,c){if(a&&b&&c&&a!==b&&a!==c&&b!==c)add(sanrentan,a+"-"+b+"-"+c);}

  var axis=pick.axisH[0],p=pick.partnerH;

  if(axis){
    for(var i=0;i<Math.min(3,p.length);i++){
      add(wide,addPair(axis,p[i]));
      if(i<2)add(umaren,addPair(axis,p[i]));
    }
    if(p.length>=2)add(sanpuku,addTri(axis,p[0],p[1]));
    if(p.length>=3)add(sanpuku,addTri(axis,p[0],p[2]));
    if(p.length>=4)add(sanpuku,addTri(axis,p[1],p[2]));
  }

  // 1倍台本命保護＋穴帯クラスターの3着救済
  // 小倉2R型：10軸、7穴、隣接穴8を3着に追加。
  if(axis&&pick.cluster3H&&pick.cluster3H.length){
    var c=pick.cluster3H[0];
    var frontPartners=p.slice(0,4);
    for(var ck=0;ck<pick.cluster3H.length;ck++){
      if(frontPartners.indexOf(pick.cluster3H[ck])>=0){c=pick.cluster3H[ck];break;}
    }
    var core=p[0]&&p[0]!==c?p[0]:(p[1]||null);
    if(core){
      addFront(sanpuku,addTri(axis,core,c));
      addFront(sanrentan,axis+"-"+c+"-"+core);
      addFront(sanrentan,axis+"-"+core+"-"+c);
    }
  }

  // 新型：人気ゾーン端を1着、複勝メジアン穴を2・3着へ
  if(pick.head3tanH.length){
    var head=pick.head3tanH[0];
    var holes=pick.hole23H.slice();
    var pops=ctx.popularZoneH.filter(function(h){return h!==head&&holes.indexOf(h)<0;});
    if(!holes.length&&p.length)holes=[p[0]];

    var h1=holes[0];
    if(h1){
      for(var j=0;j<Math.min(3,pops.length);j++){
        addTan(head,h1,pops[j]);
        addTan(head,pops[j],h1);
      }
      if(holes[1]){
        addTan(head,h1,holes[1]);
        addTan(head,holes[1],h1);
      }
    }
  }else{
    // 通常の三連単少額候補
    if(axis&&p.length>=2){
      addTan(axis,p[0],p[1]);
      addTan(axis,p[1],p[0]);
      addTan(p[0],axis,p[1]);
      addTan(p[0],p[1],axis);
    }
  }

  return{wide:wide.slice(0,3),umaren:umaren.slice(0,3),sanpuku:sanpuku.slice(0,4),sanrentan:sanrentan.slice(0,8)};
}

function rankMap(row){var m={};for(var i=0;i<row.length;i++)m[row[i]]=i+1;return m;}
function makeOtaniRow(data,ctx){
  var axis=ctx.tanRank[0]?ctx.tanRank[0].h:null,row=[];
  if(axis){
    row.push(axis);
    var items=ctx.umaRank.filter(function(p){return p.a===axis||p.b===axis;});
    for(var i=0;i<items.length;i++){
      var other=items[i].a===axis?items[i].b:items[i].a;
      if(row.indexOf(other)<0)row.push(other);
    }
  }
  for(var j=0;j<ctx.umaRank.length;j++){
    if(row.indexOf(ctx.umaRank[j].a)<0)row.push(ctx.umaRank[j].a);
    if(row.indexOf(ctx.umaRank[j].b)<0)row.push(ctx.umaRank[j].b);
  }
  return row;
}
function renderHonRow(label,row,medians,barClass){
  var html='<div class="honRow"><div class="honLabel">'+label+'</div>';
  for(var i=0;i<row.length;i++){
    var h=row[i],cls=medians.indexOf(h)>=0?'honNum honMed':'honNum';
    html+='<span class="'+cls+'">'+h+'</span>';
    if(i<row.length-1)html+='<span class="bar '+barClass+'"></span>';
  }
  html+='</div>';
  return html;
}
function makeHonpyo(data,ctx){
  var otani=makeOtaniRow(data,ctx);
  var tanRow=ctx.tanRank.map(function(x){return x.h;});
  var fukuRow=ctx.fukuRank.map(function(x){return x.h;});
  var html='<div class="card"><div class="title">本表</div>';
  html+='<div class="small">メジアン候補＝赤文字。馬連は大谷式。</div>';
  html+='<div class="honWrap">';
  html+=renderHonRow("馬連",otani,ctx.zoneM,"barUma");
  html+=renderHonRow("単勝",tanRow,ctx.tanM,"barTan");
  html+=renderHonRow("複勝",fukuRow,ctx.fukuM,"barFuku");
  html+='</div></div>';
  return html;
}

function run(){
  try{
    var data=parseData(document.getElementById("input").value);
    var out=document.getElementById("out");
    if(data.tanfuku.length===0||data.umaren.length===0){
      out.innerHTML='<div class="card"><div class="title warn">入力不足</div>[TANFUKU] と [UMAREN] が必要です。</div>';
      return;
    }
    var ctx=makeContext(data);
    var scored=scoreAll(data,ctx);
    var pick=chooseFinal(data,ctx,scored);
    var tickets=makeTickets(data,ctx,pick);

    var decision="見送り";
    if(pick.axisH.length&&pick.partnerH.length)decision="買う";
    else if(scored[0]&&scored[0].score>=18)decision="少額";

    var html='';
    html+='<div class="card"><div class="title">'+data.title+'</div>';
    html+='🩺 レース診断：<span class="yellow">'+ctx.raceType+'</span><br>';
    html+='馬連1番人気：<span class="yellow">'+(ctx.umaRank[0]?ctx.umaRank[0].key+" "+ctx.umaRank[0].od+"倍":"なし")+'</span><br>';
    html+='結論：<span class="'+(decision==="買う"?"good":decision==="少額"?"yellow":"warn")+'">'+decision+'</span><br>';
    html+='選択モード：<span class="yellow">'+pick.mode+'</span>';
    html+='</div>';

    html+='<div class="card"><div class="title">🚨発動ランプ</div>';
    html+=(pick.lamps.length?pick.lamps.join('<br>'):'特別ランプなし');
    html+='</div>';

    html+='<div class="card"><div class="title">🧠メジアン・壁</div>';
    html+='単勝メジアン：<span class="red">'+joinH(ctx.tanM)+'</span><br>';
    html+='複勝メジアン：<span class="red">'+joinH(ctx.fukuM)+'</span><br>';
    html+='馬連壁内メジアン：<span class="red">'+joinH(ctx.zoneM)+'</span><br>';
    html+='複勝6倍壁前：<span class="yellow">'+joinH(ctx.fuku6)+'</span><br>';
    html+='複勝10倍壁前：<span class="yellow">'+joinH(ctx.fuku10)+'</span><br>';
    html+='複勝15倍壁前：<span class="yellow">'+joinH(ctx.fuku15)+'</span><br>';
    html+='人気ゾーン4〜9.9倍：<span class="blue">'+joinH(ctx.popularZoneH)+'</span><br>';
    html+='穴帯クラスター救済：<span class="yellow">'+joinH(ctx.holeClusterH||[])+'</span>';
    html+='</div>';

    html+='<div class="card"><div class="title">🧱馬連オッズの壁</div>';
    html+='壁：'+(ctx.mainWalls.length?ctx.mainWalls.map(function(w){return w.before+'位→'+w.after+'位';}).join(' / '):'明確な壁なし')+'<br>';
    html+='見るゾーン：'+(ctx.zone.length?ctx.zone.map(function(p){return p.key+'('+p.od+')';}).join(' / '):'なし')+'<br>';
    html+='壁内馬：'+joinH(ctx.zoneH);
    html+='</div>';

    html+=makeHonpyo(data,ctx);

    html+='<div class="card"><div class="title">👑最終候補</div>';
    html+='軸候補：<span class="good">'+joinH(pick.axisH)+'</span><br>';
    html+='相手候補：<span class="yellow">'+joinH(pick.partnerH)+'</span><hr>';
    for(var s=0;s<Math.min(8,scored.length);s++){
      var x=scored[s];
      html+='<div class="rankLine"><span class="badge">'+(s+1)+'位 '+x.h+'番【'+x.score+'】</span> ';
      html+='<span class="small">単'+x.tan+' / 複'+x.fuku+'　'+x.reasons.join('・')+'</span></div>';
    }
    html+='</div>';

    html+='<div class="card"><div class="title">💰買い目</div><pre>';
    if(decision==="見送り"){
      html+='見送り\n理由：重なり不足';
    }else{
      html+='◎ '+joinH(pick.axisH)+'\n';
      html+='○ '+joinH(pick.partnerH)+'\n\n';
      html+='ワイド\n'+(tickets.wide.length?tickets.wide.join('\n'):'なし')+'\n\n';
      html+='馬連\n'+(tickets.umaren.length?tickets.umaren.join('\n'):'なし')+'\n\n';
      html+='三連複\n'+(tickets.sanpuku.length?tickets.sanpuku.join('\n'):'なし')+'\n\n';
      html+='三連単\n'+(tickets.sanrentan.length?tickets.sanrentan.join('\n'):'なし');
    }
    html+='</pre></div>';

    out.innerHTML=html;
    latestCopyText=makeCopyText(data.title,ctx.raceType,decision,pick,tickets,scored);
  }catch(e){
    document.getElementById("out").innerHTML='<div class="card"><div class="title warn">エラー</div><pre>'+String(e&&e.message?e.message:e)+'</pre></div>';
  }
}

function makeCopyText(title,raceType,decision,pick,tickets,scored){
  var t='';
  t+=title+'\n';
  t+='診断：'+raceType+' / '+decision+'\n';
  t+='選択モード：'+pick.mode+'\n';
  if(pick.lamps.length)t+='発動：'+pick.lamps.join(' / ')+'\n';
  t+='◎ '+joinH(pick.axisH)+'\n';
  t+='○ '+joinH(pick.partnerH)+'\n\n';
  t+='ワイド\n'+tickets.wide.join('\n')+'\n\n';
  t+='馬連\n'+tickets.umaren.join('\n')+'\n\n';
  t+='三連複\n'+tickets.sanpuku.join('\n')+'\n\n';
  t+='三連単\n'+tickets.sanrentan.join('\n')+'\n\n';
  t+='最終候補\n';
  for(var i=0;i<Math.min(5,scored.length);i++){
    t+=(i+1)+'位 '+scored[i].h+'番【'+scored[i].score+'】 単'+scored[i].tan+' / 複'+scored[i].fuku+'\n';
  }
  return t;
}

function copyResult(){
  if(!latestCopyText){alert("先に解析してください");return;}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(latestCopyText).then(function(){alert("結果をコピーしました");}).catch(function(){fallbackCopy(latestCopyText);});
  }else{fallbackCopy(latestCopyText);}
}
function fallbackCopy(text){
  var ta=document.createElement("textarea");
  ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);
  alert("結果をコピーしました");
}
