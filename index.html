<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>チャッピー神予想 V5</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#07101f;color:#fff;padding:14px;font-size:18px}
textarea{width:100%;height:280px;font-size:17px;border-radius:10px;padding:10px;background:#fff;color:#000;box-sizing:border-box}
button{font-size:20px;padding:10px 14px;margin:6px 4px 6px 0;border-radius:12px;border:0;background:#22c55e;color:#fff}
.btn2{background:#3b82f6}.btn3{background:#64748b}.btn4{background:#f59e0b}
.box{background:#111827;border-radius:14px;padding:14px;margin:12px 0}
h1{font-size:26px}h2{font-size:22px;border-bottom:1px solid #374151;padding-bottom:6px}
.green{color:#22c55e;font-weight:bold}.yellow{color:#facc15;font-weight:bold}.red{color:#fb7185;font-weight:bold}
.hot{color:#fb7185;font-size:24px;font-weight:bold}.gold{color:#facc15;font-size:24px;font-weight:bold}
.small{font-size:15px;color:#cbd5e1}
.rankWrap{overflow-x:auto;white-space:nowrap}
.row{margin:12px 0;font-size:24px;font-weight:bold}
.label{display:inline-block;width:70px;color:#cbd5e1;font-size:18px}
.cell{display:inline-block;min-width:34px;text-align:center;padding:4px 6px;border-right:1px solid #64748b}
.wallUma{border-right:3px solid #ff3b30}.wallWin{border-right:3px solid #3b82f6}.wallPlace{border-right:3px solid #facc15}
.raceTitle{font-size:30px;font-weight:bold;color:#facc15}
.indexCard{margin:10px 0;padding:10px;border-bottom:1px solid #374151}
</style>
</head>
<body>

<h1>チャッピー神予想 V5</h1>

<div class="box">
<textarea id="input" placeholder="【レース名】

[TANFUKU]

[UMAREN]

[SANPUKU]"></textarea>
<br>
<button onclick="analyze()">解析</button>
<button class="btn2" onclick="testData()">テスト</button>
<button class="btn3" onclick="resetInput()">リセット</button>
<button class="btn4" onclick="copyResult()">結果コピー</button>
</div>

<div id="result"></div>

<script>
function norm(s){
  return s.replace(/[０-９]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0))
          .replace(/[－ー―–—]/g,'-')
          .replace(/[．]/g,'.');
}

function parseInput(text){
  text=norm(text);
  const lines=text.split(/\n/).map(x=>x.trim()).filter(Boolean);
  let mode="", raceName="レース名未入力";
  const tanpuku=[],umaren=[],sanpuku=[];

  for(const line of lines){
    if(line.match(/^【.*】$/)){
      const t=line.replace(/[【】]/g,"");
      if(!t.match(/TANFUKU|UMAREN|SANPUKU|単勝|複勝|馬連|三連複/i)) raceName=t;
    }
    if(line.match(/TANFUKU|単勝|複勝/i)){mode="TANFUKU";continue;}
    if(line.match(/UMAREN|馬連|馬複/i)){mode="UMAREN";continue;}
    if(line.match(/SANPUKU|三連複/i)){mode="SANPUKU";continue;}

    const p=line.split(/\s+/);
    if(mode==="TANFUKU" && p.length>=3){
      const win=parseFloat(p[1]), place=parseFloat(p[2]);
      if(!isNaN(win)&&!isNaN(place)) tanpuku.push({horse:p[0],win,place});
    }
    if(mode==="UMAREN" && p.length>=2){
      const odds=parseFloat(p[1]);
      if(p[0].includes("-")&&!isNaN(odds)) umaren.push({pair:p[0],odds});
    }
    if(mode==="SANPUKU" && p.length>=2){
      const odds=parseFloat(p[1]);
      if(p[0].includes("-")&&!isNaN(odds)) sanpuku.push({trio:p[0],odds});
    }
  }
  return {raceName,tanpuku,umaren,sanpuku};
}

function wallIndexes(list,key){
  const walls=new Set();
  for(let i=0;i<list.length-1;i++){
    const a=list[i][key], b=list[i+1][key];
    if(a>0 && b/a>=1.8) walls.add(i);
  }
  return walls;
}

function medianHorses(list){
  if(!list.length)return[];
  const n=list.length;
  if(n%2===1)return[list[Math.floor(n/2)].horse];
  return[list[n/2-1].horse,list[n/2].horse];
}

function beforeWallHorses(list,walls){
  const s=new Set();
  walls.forEach(i=>{
    if(list[i])s.add(list[i].horse);
    if(list[i-1])s.add(list[i-1].horse);
  });
  return [...s];
}

function placeWallBefore(placeRank,limit){
  const before=placeRank.filter(x=>x.place<limit);
  if(!before.length)return[];
  return before.slice(-2).map(x=>x.horse);
}

function placeWallAfter(placeRank,limit){
  const after=placeRank.filter(x=>x.place>=limit);
  if(!after.length)return[];
  return after.slice(0,2).map(x=>x.horse);
}

function addScore(map,h,pt=1){
  if(!h)return;
  map[h]=(map[h]||0)+pt;
}

function addDetail(map,h,pt,reason){
  if(!h)return;
  if(!map[h])map[h]={pt:0,memo:[]};
  map[h].pt+=pt;
  map[h].memo.push(reason+" +"+pt);
}

function sortDetail(map){
  return Object.entries(map).sort((a,b)=>b[1].pt-a[1].pt).map(([h,v])=>({horse:h,point:v.pt,memo:v.memo}));
}

function topList(map,min=1){
  return Object.entries(map).filter(([h,p])=>p>=min).sort((a,b)=>b[1]-a[1]).map(([h,p])=>`${h}(${p})`);
}

function rankLine(label,list,walls,type){
  let wallClass=type==="uma"?"wallUma":type==="win"?"wallWin":"wallPlace";
  let html=`<div class="row"><span class="label">${label}</span>`;
  list.forEach((x,i)=>{
    const cls=walls.has(i)?`cell ${wallClass}`:"cell";
    html+=`<span class="${cls}">${x.horse}</span>`;
  });
  html+=`</div>`;
  return html;
}

function classify(topOdds){
  if(topOdds<4)return{code:"honmei",cls:"green",title:"本命戦",reason:"馬連1番人気が4倍未満"};
  if(topOdds<9)return{code:"chuare",cls:"yellow",title:"中荒れ戦",reason:"馬連1番人気が4倍以上9倍未満"};
  if(topOdds<15)return{code:"are",cls:"red",title:"荒れ戦",reason:"馬連1番人気が9倍以上15倍未満"};
  return{code:"ooare",cls:"red",title:"大荒れ戦",reason:"馬連1番人気が15倍以上"};
}

function raceDiagnosis(winRank,placeRank,topUmaren){
  const tan10=winRank.filter(x=>x.win<10).length;
  const tan30=winRank.filter(x=>x.win<30).length;
  const fuku3=placeRank.filter(x=>x.place<3).length;
  const fuku6=placeRank.filter(x=>x.place<6).length;
  const fuku10=placeRank.filter(x=>x.place<10).length;
  const fuku15=placeRank.filter(x=>x.place<15).length;
  const race=classify(topUmaren.odds);

  let warnings=[];
  if(tan10>=6) warnings.push("7・8人気警報");
  if(tan30>=8) warnings.push("混戦気配");
  if(fuku6>=7) warnings.push("複勝6倍未満が多い");
  if(topUmaren.odds>=9) warnings.push("荒れ注意");

  return {tan10,tan30,fuku3,fuku6,fuku10,fuku15,race,warnings};
}

function diagnoseBox(d){
  return `<div class="box">
    <h2>🩺レース診断</h2>
    <div>馬連1番人気判定：<span class="${d.race.cls}" style="font-size:26px">${d.race.title}</span></div>
    <div class="small">${d.race.reason}</div>
    <br>
    <div>単勝10倍未満：<b>${d.tan10}頭</b></div>
    <div>単勝30倍未満：<b>${d.tan30}頭</b></div>
    <div>複勝3倍未満：<b>${d.fuku3}頭</b></div>
    <div>複勝6倍未満：<b>${d.fuku6}頭</b></div>
    <div>複勝10倍未満：<b>${d.fuku10}頭</b></div>
    <div>複勝15倍未満：<b>${d.fuku15}頭</b></div>
    <br>
    <div class="hot">${d.warnings.length?d.warnings.join("・"):"特別警報なし"}</div>
  </div>`;
}

function renderIndex(title,icon,list){
  return `<div class="box"><h2>${icon}${title}</h2>
  ${list.slice(0,8).map(x=>`
    <div class="indexCard">
      <div class="${x.point>=80?'hot':x.point>=60?'gold':'green'}" style="font-size:26px">
        ${x.horse}番　${x.point}点
      </div>
      <div class="small">${x.memo.join(" / ")}</div>
    </div>`).join("")}
  </div>`;
}

function analyze(){
  const {raceName,tanpuku,umaren,sanpuku}=parseInput(document.getElementById("input").value);
  const result=document.getElementById("result");

  if(!tanpuku.length||!umaren.length){
    result.innerHTML=`<div class="box red">単勝複勝と馬連を入れてください</div>`;
    return;
  }

  const winRank=[...tanpuku].sort((a,b)=>a.win-b.win);
  const placeRank=[...tanpuku].sort((a,b)=>a.place-b.place);
  const axis=winRank[0].horse;

  const axisUmaren=umaren.filter(x=>x.pair.split("-").includes(axis)).sort((a,b)=>a.odds-b.odds).map(x=>{
    const[a,b]=x.pair.split("-");
    return{horse:a===axis?b:a,odds:x.odds,pair:x.pair};
  });

  const topUmaren=[...umaren].sort((a,b)=>a.odds-b.odds)[0];
  const umaList=[{horse:axis,odds:0},...axisUmaren];

  const umaWalls=new Set([...wallIndexes(axisUmaren,"odds")].map(i=>i+1));
  const winWalls=wallIndexes(winRank,"win");
  const placeWalls=wallIndexes(placeRank,"place");

  const fuku10Before=placeWallBefore(placeRank,10);
  const fuku10After=placeWallAfter(placeRank,10);
  const fuku15Before=placeWallBefore(placeRank,15);

  const winBefore=beforeWallHorses(winRank,winWalls);
  const placeBefore=beforeWallHorses(placeRank,placeWalls);
  const umaBefore=beforeWallHorses(umaList,umaWalls);

  const diagnosis=raceDiagnosis(winRank,placeRank,topUmaren);

  const tanshoScore={}, gekisoScore={};
  [...medianHorses(winRank),...medianHorses(placeRank),...medianHorses(umaList)].forEach(h=>addScore(tanshoScore,h));
  winBefore.forEach(h=>addScore(tanshoScore,h));
  placeBefore.forEach(h=>addScore(tanshoScore,h));
  umaBefore.forEach(h=>addScore(tanshoScore,h));

  fuku10Before.forEach(h=>addScore(gekisoScore,h,2));
  fuku15Before.forEach(h=>addScore(gekisoScore,h,2));
  umaBefore.forEach(h=>addScore(gekisoScore,h,1));
  winRank.filter(x=>x.win>=10&&x.win<=30).forEach(x=>addScore(gekisoScore,x.horse,1));

  const tanshoList=topList(tanshoScore,2);
  const gekisoList=topList(gekisoScore,2);
  const tanshoSet=new Set(tanshoList.map(x=>x.split("(")[0]));
  const gekisoSet=new Set(gekisoList.map(x=>x.split("(")[0]));

  const chappy={}, first={}, third={};

  const allHorses=[...new Set(tanpuku.map(x=>x.horse))];

  allHorses.forEach(h=>{
    const isTansho=tanshoSet.has(h);
    const isGekiso=gekisoSet.has(h);
    const isUma=umaBefore.includes(h);
    const isWin=winBefore.includes(h);
    const isPlace=placeBefore.includes(h);
    const isFuku15=fuku15Before.includes(h);
    const isFuku10=fuku10Before.includes(h);

    if(isTansho)addDetail(chappy,h,20,"単勝案件");
    if(isGekiso)addDetail(chappy,h,15,"超激走注意馬");
    if(isFuku15)addDetail(chappy,h,15,"複勝15倍壁前");
    if(isFuku10)addDetail(chappy,h,10,"複勝10倍壁前");
    if(isUma)addDetail(chappy,h,12,"馬連壁前");
    if(isWin)addDetail(chappy,h,10,"単勝壁前");
    if(isPlace)addDetail(chappy,h,8,"複勝自然壁前");

    const cnt=[isTansho,isGekiso,isUma,isWin,isPlace,isFuku15,isFuku10].filter(Boolean).length;
    if(cnt>=3)addDetail(chappy,h,15,"3項目以上重複");

    if(diagnosis.race.code==="honmei" && winRank.slice(0,3).some(x=>x.horse===h))addDetail(first,h,15,"本命戦補正");
    if(diagnosis.race.code==="chuare" && (isTansho||isUma))addDetail(chappy,h,8,"中荒れ補正");
    if((diagnosis.race.code==="are"||diagnosis.race.code==="ooare") && isGekiso)addDetail(chappy,h,12,"荒れ補正");

    const w=winRank.findIndex(x=>x.horse===h)+1;
    const p=placeRank.findIndex(x=>x.horse===h)+1;

    if(w<=3)addDetail(first,h,20,"単勝1〜3人気");
    else if(w<=5)addDetail(first,h,10,"単勝1〜5人気");
    if(winRank[w-1] && winRank[w-1].win<30)addDetail(first,h,8,"単勝30倍未満");
    if(isWin)addDetail(first,h,15,"単勝壁前");
    if(isUma)addDetail(first,h,12,"馬連壁前");
    if(isTansho)addDetail(first,h,10,"単勝案件");
    if(w<p)addDetail(first,h,10,"単勝順位が複勝より前");
    if(diagnosis.tan10>=6 && (w===7||w===8))addDetail(first,h,15,"7・8人気警報");

    if(isFuku15)addDetail(third,h,20,"複勝15倍壁前");
    if(isFuku10)addDetail(third,h,15,"複勝10倍壁前");
    if(isPlace)addDetail(third,h,12,"複勝自然壁前");
    if(isGekiso)addDetail(third,h,15,"超激走注意馬");
    if(w>=5&&w<=9)addDetail(third,h,10,"中穴3着ゾーン");
  });

  const strictLamp=allHorses.filter(h=>
    tanshoSet.has(h)&&gekisoSet.has(h)&&(umaBefore.includes(h)||fuku15Before.includes(h))
  );

  const noticeLamp=allHorses.filter(h=>
    tanshoSet.has(h)||gekisoSet.has(h)||umaBefore.includes(h)||fuku15Before.includes(h)
  ).filter(h=>!strictLamp.includes(h));

  result.innerHTML=`
  <div class="box"><div class="raceTitle">【${raceName}】</div></div>

  ${diagnoseBox(diagnosis)}

  ${renderIndex("1着指数","👑",sortDetail(first))}
  ${renderIndex("チャッピー総合指数","🔥",sortDetail(chappy))}
  ${renderIndex("3着穴指数","💣",sortDetail(third))}

  <div class="box">
    <h2>🔥勝負ランプ</h2>
    <div class="hot">${strictLamp.length?strictLamp.join("・"):"該当なし"}</div>
    <div class="small">単勝案件＋超激走＋馬連壁前 or 複勝15倍壁前</div>
  </div>

  <div class="box">
    <h2>🟡注意ランプ</h2>
    <div class="gold">${noticeLamp.length?noticeLamp.join("・"):"該当なし"}</div>
    <div class="small">広めに拾うヒモ候補</div>
  </div>

  <div class="box">
    <h2>🎯単勝案件</h2>
    <div class="gold">${tanshoList.length?tanshoList.join("　"):"該当なし"}</div>
  </div>

  <div class="box">
    <h2>🚨超激走注意馬</h2>
    <div class="hot">${gekisoList.length?gekisoList.join("　"):"該当なし"}</div>
  </div>

  <div class="box">
    <h2>📚本の買い方</h2>
    <p>複勝10倍壁前2頭：<b class="gold">${fuku10Before.length?fuku10Before.join("・"):"なし"}</b></p>
    <p>複勝10倍壁直後：<b class="hot">${fuku10After.length?fuku10After.join("・"):"なし"}</b></p>
    <p>複勝15倍壁前2頭：<b class="gold">${fuku15Before.length?fuku15Before.join("・"):"なし"}</b></p>
    <p>馬連壁前：<b class="gold">${umaBefore.length?umaBefore.join("・"):"なし"}</b></p>
    <p>単勝壁前：<b class="gold">${winBefore.length?winBefore.join("・"):"なし"}</b></p>
  </div>

  <div class="box">
    <h2>本表</h2>
    <div class="small">馬連の壁＝赤線　単勝の壁＝青線　複勝の壁＝黄色線</div>
    <div class="rankWrap">
      ${rankLine("馬連",umaList,umaWalls,"uma")}
      ${rankLine("単勝",winRank,winWalls,"win")}
      ${rankLine("複勝",placeRank,placeWalls,"place")}
    </div>
  </div>
  `;
}

function resetInput(){
  document.getElementById("input").value="";
  document.getElementById("result").innerHTML="";
}

function copyResult(){
  const text=document.getElementById("result").innerText;
  if(!text){alert("コピーする結果がありません");return;}
  navigator.clipboard.writeText(text).then(()=>alert("結果をコピーしました")).catch(()=>alert("コピーできませんでした"));
}

</script>

</body>
</html>
