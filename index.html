<script>

function zenToHan(str){return String(str||'').replace(/[０-９]/g,function(s){return String.fromCharCode(s.charCodeAt(0)-65248);}).replace(/．/g,'.').replace(/[－ー―−]/g,'-').replace(/[　]/g,' ').replace(/[〜～]/g,'-');}

/* V2.52 大谷式馬連の唯一の基軸。単勝1番人気を先頭に固定し、その馬を含む馬連だけをオッズ順に並べる。 */
function buildOtaniBase(tanRank,umaRank,ratio){
 ratio=Number(ratio)||1.8;
 var axis=(tanRank&&tanRank[0])?String(tanRank[0].h):null;
 var partners=[],seen={};
 if(axis){
  (umaRank||[]).forEach(function(p,i){
   var a=String(p.a),b=String(p.b);
   if(a!==axis&&b!==axis)return;
   var h=(a===axis)?b:a;
   if(seen[h])return;
   seen[h]=1;
   partners.push({h:h,od:safeNum(p.od),pairRank:i+1,key:p.key||pairKey(a,b),a:a,b:b,axis:false});
  });

 }
 var rank=axis?[{h:axis,od:0,pairRank:0,key:'AXIS',a:axis,b:axis,axis:true}].concat(partners):[];
 var row=rank.map(function(x){return String(x.h);});
 var gaps=[],walls=[];
 /* rank[0] は単勝軸で馬連オッズを持たないため、相手1頭目以降だけを隣接比で比較する。 */
 for(var i=1;i<rank.length-1;i++){
  var low=safeNum(rank[i].od),high=safeNum(rank[i+1].od);
  if(low>0&&high/low>=ratio){
   gaps.push(i); /* 本表の i 番目の馬の直後に線を描く */

  }
 }
 var first=walls[0]||null;
 var segment=first?row.slice(0,first.after):row.slice();
 var before=first?segment.slice(Math.max(0,segment.length-2)):[];
 return{axis:axis,ratio:ratio,partners:partners,rank:rank,row:row,gaps:gaps,walls:walls,firstWall:first,segment:segment,before:before,median:mid(segment.length?segment:row)};
}
function triRow(tris){var row=[];sortOdds(tris).forEach(function(t){add(row,t.a);add(row,t.b);add(row,t.c);});return row;}
function hasReason(x,word){return (x.reasons||[]).join(' / ').indexOf(word)>=0;}
function parseData(raw){var text=zenToHan(raw),lines=text.split(/\n/),title='レース',sec='',tanfuku=[],umaren=[],wide=[],sanpuku=[];for(var i=0;i<lines.length;i++){var line=lines[i].trim();if(!line)continue;if(line.indexOf('【')===0)title=line;var up=line.toUpperCase();if(up.indexOf('[')===0){if(up.indexOf('TAN')>=0||up.indexOf('単')>=0){sec='TANFUKU';continue;}if(up.indexOf('WIDE')>=0||up.indexOf('ワイド')>=0){sec='WIDE';continue;}if(up.indexOf('SAN')>=0||up.indexOf('3')>=0||up.indexOf('三')>=0){sec='SANPUKU';continue;}if(up.indexOf('UMA')>=0||up.indexOf('馬')>=0||up.indexOf('2')>=0){sec='UMAREN';continue;}}if(sec==='TANFUKU'){var n=nums(line);if(n.length>=3)tanfuku.push({h:String(Math.floor(n[0])),tan:n[1],fuku:n[n.length-1]});else if(n.length===2)tanfuku.push({h:String(Math.floor(n[0])),tan:n[1],fuku:null});}else if(sec==='UMAREN'){var m=line.match(/(\d+)\s*-\s*(\d+)/),o=nums(line);if(m&&o.length)umaren.push({a:m[1],b:m[2],od:o[o.length-1],key:pairKey(m[1],m[2])});}else if(sec==='WIDE'){var mw=line.match(/(\d+)\s*-\s*(\d+)/),ow=nums(line);if(mw&&ow.length)wide.push({a:mw[1],b:mw[2],od:ow[ow.length-1],key:pairKey(mw[1],mw[2])});}else if(sec==='SANPUKU'){var ms=line.match(/(\d+)\s*-\s*(\d+)\s*-\s*(\d+)/),os=nums(line);if(ms&&os.length)sanpuku.push({a:ms[1],b:ms[2],c:ms[3],od:os[os.length-1],key:triKey(ms[1],ms[2],ms[3])});}}return{title:title,tanfuku:tanfuku,umaren:umaren,wide:wide,sanpuku:sanpuku};}
function nearWall(sorted,field,wall){var before=[],after=[],idx=-1;for(var i=0;i<sorted.length;i++){var v=safeNum(sorted[i][field]);if(v<=wall)idx=i;}if(idx>=0){if(sorted[idx])before.push(sorted[idx].h);if(sorted[idx-1])before.push(sorted[idx-1].h);}if(sorted[idx+1])after.push(sorted[idx+1].h);if(sorted[idx+2])after.push(sorted[idx+2].h);return{before:uniq(before),after:uniq(after),idx:idx};}
function detectFuku15CliffLower(fukuRank){var res={on:false,upper:null,lower:[],gap:0,reason:''};if(!fukuRank||fukuRank.length<3)return res;for(var i=0;i<fukuRank.length-1;i++){var cur=safeNum(fukuRank[i].fuku),next=safeNum(fukuRank[i+1].fuku);if(cur<=8.0&&next>=15.0&&(next-cur)>=7.0){res.on=true;res.upper=fukuRank[i+1].h;if(fukuRank[i])add(res.lower,fukuRank[i].h);if(fukuRank[i-1])add(res.lower,fukuRank[i-1].h);res.gap=Number((next-cur).toFixed(1));res.reason='複勝'+next+'倍から'+cur+'倍へ大きく落ちる断層。6〜15倍ゾーンが空白に近いため、断層下2頭を要注意。';break;}}return res;}
function rangeMed(tanRank,lo,hi){return mid(tanRank.filter(function(x){return x.tan>=lo&&x.tan<hi;}).map(function(x){return x.h;}));}
function bigGaps(sorted,field,base){var out=[];for(var i=0;i<sorted.length-1;i++){var a=safeNum(sorted[i][field]),b=safeNum(sorted[i+1][field]);if(a>0&&b-a>=base)out.push(i);}return out;}
function makeContext(data){

 var fukuRank=data.tanfuku.filter(function(x){return x.fuku!==null;}).map(function(x){return{h:x.h,od:x.fuku,tan:x.tan,fuku:x.fuku};}).sort(function(a,b){return Number(a.fuku)-Number(b.fuku);});

  tanUnder10:tanRank.filter(function(x){return x.tan<10;}).length,

  fukuUnder10:fukuRank.filter(function(x){return x.fuku<=10;}).length,

 };

  tanRow:tanRow,fukuRow:fukuRow,umaRow:umaRow,wideRow:wideRow,sanRow:sanRow,
  fav1:tanRank[0]?tanRank[0].h:null,fav2:tanRank[1]?tanRank[1].h:null,fav3:tanRank[2]?tanRank[2].h:null,
  tanM:mid(tanRow),fukuM:mid(fukuRow),umaM:otani.median,wideM:mid(wideRow),sanM:mid(sanRow),
  tan10M:rangeMed(tanRank,10,20),tan20M:rangeMed(tanRank,20,30),
  fuku12M:mid(fukuRank.filter(function(x){return x.fuku<=12;}).map(function(x){return x.h;})),
  w80:w80,w6:w6,w10:w10,w15:w15,fukuCliff15:fukuCliff15,
  tanGap:tanGap,fukuGap:fukuGap,umaGap:umaGap,sanGap:sanGap,umaRank6:umaRank6,all:all,counts:counts,
  otaniAxis:otani.axis,otaniRank:otani.rank,otaniPairs:otani.partners,otaniWalls:otani.walls,

}
function makeRaceDiag(ctx){var n1=ctx.umaRank[0]?Number(ctx.umaRank[0].od):null,surface='判定不可',risk=0,cls='gray';if(n1!==null){if(n1<4){surface='本命戦';cls='good';}else if(n1<9){surface='中荒れ戦';cls='yellow';risk+=1;}else if(n1<15){surface='荒れ戦';cls='orange';risk+=2;}else{surface='大荒れ戦';cls='warn';risk+=3;}}var top=ctx.tanRank[0],topF=ctx.fukuRank[0];var san1=ctx.sanRank[0]?Number(ctx.sanRank[0].od):999;var hard=false;if(top&&top.tan<=1.4)hard=true;if(topF&&topF.fuku<=1.1&&san1<=8)hard=true;if(n1!==null&&n1<4&&san1<=6)hard=true;var suitable=(ctx.counts.tanUnder10>=3&&ctx.counts.tanUnder10<=5&&ctx.counts.tanUnder30>=5&&ctx.counts.tanUnder30<=8&&ctx.counts.fukuUnder6>=5&&ctx.counts.fukuUnder6<=7&&ctx.counts.fukuUnder10>=6&&ctx.counts.fukuUnder10<=9&&ctx.counts.fukuUnder15>=7&&ctx.counts.fukuUnder15<=10&&n1!==null&&n1>=3&&n1<=6.9);var wild=(ctx.counts.tanUnder10>=6||ctx.counts.fukuUnder10>=10||(n1!==null&&n1>=9));var mType=hard?'硬すぎ':(wild?'荒れすぎ':(suitable?'まっちゃん単勝向き':'通常'));var back=hard?'硬い本命残し':(wild?'単勝厚張り注意':(suitable?'上位ズレ単勝注意':'軽いズレ注意'));if(ctx.fukuCliff15&&ctx.fukuCliff15.on)back+='＋複勝15倍断層下注意';return{surface:surface,cls:cls,risk:risk,matchanType:mType,back:back,hard:hard,suitable:suitable,wild:wild,san1:san1};}
function detectWallOuter15(ctx){var res={on:false,items:[]};if(!ctx||!ctx.fukuRank||ctx.fukuRank.length<2)return res;for(var i=0;i<ctx.fukuRank.length;i++){var v=safeNum(ctx.fukuRank[i].fuku);if(v>15&&v<=18.8){res.on=true;res.items.push(ctx.fukuRank[i]);break;}}return res;}

  function pairRank(list,key){
    for(var i=0;i<(list||[]).length;i++){
      if(list[i].key===key)return i+1;
    }
    return 999;
  }

  function lockPairKeys(horses){
    return [
      pairKey(horses[0],horses[1]),
      pairKey(horses[0],horses[2]),
      pairKey(horses[1],horses[2])
    ];
  }

  function detectTripleLock(ctx,scored){
    var res={
      on:false,active:false,strongBreak:false,mode:'なし',horses:[],san1:999,
      umaRanks:[],wideRanks:[],triCounts:[],replacement:[],externalHoles:[],
      outsideCombos:[],reasons:[]
    };
    if(!ctx||!ctx.sanRank||!ctx.sanRank.length||!ctx.tanfuku)return res;

    var top=ctx.sanRank[0];
    var horses=uniq([top.a,top.b,top.c]).sort(function(a,b){return Number(a)-Number(b);});
    if(horses.length!==3)return res;

    var keys=lockPairKeys(horses);
    var umaRanks=keys.map(function(k){return pairRank(ctx.umaRank,k);});
    var wideRanks=keys.map(function(k){return pairRank(ctx.wideRank,k);});
    var tanOK=horses.every(function(h){var tf=getTF({tanfuku:ctx.tanfuku},h);return tf&&safeNum(tf.tan)<10;});
    var triCounts=horses.map(function(h){return countAppearTop(ctx.sanRank,h,10);});
    var san1=safeNum(top.od);

    var basic=(
      san1<6 &&
      tanOK &&
      umaRanks.every(function(r){return r<=6;}) &&
      wideRanks.every(function(r){return r<=8;}) &&
      triCounts.every(function(c){return c>=4;})
    );

    res.on=basic;
    res.horses=horses;
    res.san1=san1;
    res.umaRanks=umaRanks;
    res.wideRanks=wideRanks;
    res.triCounts=triCounts;
    if(!basic)return res;

    var outside=scored.filter(function(x){return horses.indexOf(String(x.h))<0;});
    res.replacement=outside.filter(function(x){
      var c5=countAppearTop(ctx.sanRank,x.h,5);
      var c10=countAppearTop(ctx.sanRank,x.h,10);
      return c5>=2||c10>=3;
    }).sort(function(a,b){
      var a5=countAppearTop(ctx.sanRank,a.h,5),b5=countAppearTop(ctx.sanRank,b.h,5);
      if(b5!==a5)return b5-a5;
      var a10=countAppearTop(ctx.sanRank,a.h,10),b10=countAppearTop(ctx.sanRank,b.h,10);
      if(b10!==a10)return b10-a10;
      return b.score-a.score;
    }).slice(0,3);

    res.externalHoles=outside.filter(function(x){
      var tan=safeNum(x.tan),fuku=safeNum(x.fuku);
      var c5=countAppearTop(ctx.sanRank,x.h,5);
      var strongReason=(
        hasReason(x,'単複ズレ大穴')||
        hasReason(x,'複勝15倍壁末端')||
        hasReason(x,'複勝15倍壁前')||
        hasReason(x,'三連複先行支持ジャンプ')
      );
      return tan>=20&&fuku<=15&&c5>=2&&strongReason;
    }).sort(function(a,b){return b.score-a.score;});

    res.outsideCombos=ctx.sanRank.slice(0,10).filter(function(t){
      var arr=[t.a,t.b,t.c],inside=0;
      arr.forEach(function(h){if(horses.indexOf(String(h))>=0)inside++;});
      return inside<=1&&safeNum(t.od)<=40;
    });

    res.strongBreak=(res.externalHoles.length>0&&res.outsideCombos.length>0);
    res.active=!res.strongBreak;
    if(res.strongBreak)res.mode='ロック解除・外部穴支持あり';
    else if(res.replacement.length)res.mode='三強ロック＋1頭差し替え注意';
    else res.mode='三強完全ロック';

    res.reasons.push('三連複1番人気 '+top.key+' '+top.od+'倍');
    res.reasons.push('三強の馬連順位 '+umaRanks.join('・')+'位');
    res.reasons.push('三強のワイド順位 '+wideRanks.join('・')+'位');
    res.reasons.push('三連複上位10件の登場数 '+triCounts.join('・')+'回');
    res.reasons.push('三強は全頭単勝10倍未満');
    if(res.replacement.length)res.reasons.push('差し替え候補 '+res.replacement.map(function(x){return x.h+'番';}).join('・'));
    if(res.strongBreak)res.reasons.push('外部穴支持と三強外し上位組が同時発生');
    return res;
  }
  window.detectTripleLock=detectTripleLock;

  window.applyRaceOverride=function(diag,ctx,scored,adv){
    var ff=detectFalseFavoriteOverride(ctx,scored,adv);
    var lock=(adv&&adv.tripleLock)?adv.tripleLock:detectTripleLock(ctx,scored);
    diag.falseFavorite=ff;
    diag.tripleLock=lock;
    diag.finalSurface=diag.surface;
    diag.finalClass=diag.cls;

    if(lock&&lock.active){
      ff.originalOn=!!ff.on;
      ff.suppressed=!!ff.on;
      ff.on=false;
      diag.finalSurface='本命〜小荒れ戦';
      diag.finalClass='good';
      diag.back='三強三角ロック補正';
      diag.matchanType=lock.replacement.length?'三強ロック＋1頭差し替え':'三強完全ロック';
      diag.wild=false;
      diag.risk=Math.max(0,(diag.risk||0)-2);
      if(adv){
        adv.rawLevel=adv.level;
        adv.level='三強三角ロック優先・大荒れ抑制';
      }
      return diag;
    }

    if(ff.on){
      diag.finalSurface=ff.level||'大荒れ警戒';
      diag.finalClass='warn';
      diag.back=ff.name||'偽本命・大荒れ上書き';
      diag.matchanType=ff.level||'大荒れ警戒';
      diag.wild=true;
      diag.risk=(diag.risk||0)+3;
    }
    return diag;
  };

  window.makeTickets=function(ctx,ms,scored,sw,adv){
    var t=V242_makeTickets(ctx,ms,scored,sw,adv);

      t.lockWide=combo2Box(h);
      lock.replacement.slice(0,2).forEach(function(x){
        addT(t.lockReplace,x.h,h[0],h[1]);
        addT(t.lockReplace,x.h,h[0],h[2]);
        addT(t.lockReplace,x.h,h[1],h[2]);
      });
      t.lockReplace=uniq(t.lockReplace).slice(0,6);
      t.main=uniq(t.lockMain.concat(t.main)).slice(0,6);
    }
    return t;
  };

  function renderLockCard(lock){
    if(!lock||!lock.on)return'';

    if(lock.active)html+='<hr><span class="good">偽本命・大荒れ上書きを抑制。三強を本線固定し、穴は1頭差し替えまで。</span>';

    html+='</div>';
    return html;
  }

    return html;
  };

  };

    var lockHtml='';

      lockHtml='<div class="card lock243"><div class="title">🔒三強ロック買い目</div><pre>';
      lockHtml+='三連複・最優先\n'+(t.lockMain.length?t.lockMain.join('\n'):'なし')+'\n\n';
      lockHtml+='ワイド・三強BOX\n'+(t.lockWide.length?t.lockWide.join('\n'):'なし')+'\n\n';
      lockHtml+='三連複・1頭差し替え保険\n'+(t.lockReplace.length?t.lockReplace.join('\n'):'なし')+'\n\n';
      lockHtml+='※三強ロック発動時は大荒れ5頭BOXより、この本線＋1頭差し替えを優先。</pre></div>';
    }
    return lockHtml+V242_renderTickets(t).replace(/V2\.42/g,'V2.43');
  };

  window.makeCopyText=function(data,diag,ctx,ms,sw,tickets,scored,moves,adv){
    var s=V242_makeCopyText(data,diag,ctx,ms,sw,tickets,scored,moves,adv).replace(/V2\.42/g,'V2.43');

      var block='\n🔒三強三角ロック補正\n';
      block+='判定：'+(lock.active?'発動':'解除')+' / '+lock.mode+'\n';
      block+='三強：'+lock.horses.map(function(h){return h+'番';}).join('・')+'\n';
      block+='三連複1人気：'+lock.horses.join('-')+' '+lock.san1+'倍\n';
      block+='馬連3辺順位：'+lock.umaRanks.join('・')+'位\n';
      block+='ワイド3辺順位：'+lock.wideRanks.join('・')+'位\n';
      block+='三連複上位10件登場数：'+lock.triCounts.join('・')+'回\n';
      block+='差し替え候補：'+(lock.replacement.length?lock.replacement.map(function(x){return x.h+'番';}).join('・'):'なし')+'\n';
      if(lock.active)block+='補正：偽本命・大荒れ上書きを抑制 / 三強固定 / 穴は1頭差し替えまで\n';
      if(lock.strongBreak)block+='補正：外部穴支持が強いためロック解除\n';
      if(tickets.lockMain&&tickets.lockMain.length){
        block+='三連複・最優先：'+tickets.lockMain.join(' / ')+'\n';
        block+='三連複・1頭差し替え：'+(tickets.lockReplace.length?tickets.lockReplace.join(' / '):'なし')+'\n';
      }
      s=s.replace('\n🔥まっちゃん単勝システム',block+'\n🔥まっちゃん単勝システム');
    }
    return s;

  window.run=function(){

      if(!data.tanfuku.length){

        return;
      }
      var ctx=makeContext(data),diag=makeRaceDiag(ctx),scored=scoreAll(data,ctx),sw=detectBigSwitch(ctx,scored),adv=detectV236(ctx,scored,diag,sw);
      adv.tripleLock=detectTripleLock(ctx,scored);
      diag=applyRaceOverride(diag,ctx,scored,adv);
      adv.falseFavorite=diag.falseFavorite;
      var ms=makeMatchanSystem(ctx,scored,diag,sw),tickets=makeTickets(ctx,ms,scored,sw,adv),moves=detectMoves(ctx,scored,diag);
      var html='';
      html+=renderTop(data,ctx)+renderDiag(diag,ctx)+renderV236(adv)+renderMatchan(ms,diag,ctx,moves)+renderSwitch(sw)+renderHonpyo(ctx,moves)+renderRank(scored)+renderTickets(tickets);
      out.innerHTML=html;
      latestCopyText=makeCopyText(data,diag,ctx,ms,sw,tickets,scored,moves,adv);
    }catch(e){
      document.getElementById('out').innerHTML='<div class="card"><div class="title warn">エラー</div><pre>'+String(e&&e.message?e.message:e)+'</pre></div>';
    }

<script>
(function(){

  var style = document.createElement('style');

  function reasonAny(x,words){
    for(var i=0;i<words.length;i++)if(hasReason(x,words[i]))return true;
    return false;
  }

  function strongTriSupport(ctx,x){
    if(!x)return false;
    return x.sanBest<=5 || countAppearTop(ctx.sanRank,x.h,10)>=3;
  }

  function detectPriorityFlaws(ctx,scored,adv){
    var diagSet={};
    ((adv&&adv.diagBox)||[]).forEach(function(h){diagSet[String(h)]=1;});
    var out=[];

    (scored||[]).forEach(function(x){
      if(!hasReason(x,'欠点あり突出馬'))return;

      var independent=0, tags=[];
      function hit(on,tag){if(on){independent++;tags.push(tag);}}

      hit(x.score>=55,'候補55点以上');
      hit(reasonAny(x,[
        '単勝メジアン','単勝10倍台メジアン','単勝20倍台メジアン',
        '複勝メジアン','複勝12倍以下メジアン','複勝6倍内メジアン',
        '馬連メジアン','ワイドメジアン','三連複メジアン'
      ]),'メジアン');
      hit(reasonAny(x,[
        '複勝6倍壁前','複勝10倍壁前','複勝15倍壁前',
        '複勝15倍断層下2頭','複勝15倍壁末端'
      ]),'壁前・断層');
      hit(reasonAny(x,['馬連メジアン','ワイドメジアン']),'連系メジアン');
      hit(strongTriSupport(ctx,x),'三連複上位支持');
      hit(reasonAny(x,['単複ズレ','単複ズレ大穴']),'単複ズレ');
      hit(!!diagSet[String(x.h)],'診断枠内');

      var tri10=countAppearTop(ctx.sanRank,x.h,10);
      var weight=0;
      if(x.score>=55)weight+=1;
      if(hasReason(x,'単勝10倍台メジアン'))weight+=3;
      else if(hasReason(x,'単勝20倍台メジアン')||hasReason(x,'単勝メジアン'))weight+=1;
      if(hasReason(x,'複勝6倍壁前'))weight+=3;
      else if(reasonAny(x,['複勝10倍壁前','複勝15倍壁前','複勝15倍断層下2頭']))weight+=2;
      if(hasReason(x,'馬連メジアン'))weight+=3;
      if(hasReason(x,'ワイドメジアン'))weight+=2;
      if(hasReason(x,'三連複メジアン'))weight+=3;
      if(x.sanBest<=5)weight+=3;
      else if(tri10>=3)weight+=2;
      if(reasonAny(x,['単複ズレ','単複ズレ大穴']))weight+=1;
      if(diagSet[String(x.h)])weight+=1;

      if(independent>=3){
        out.push({
          h:x.h,
          score:x.score,
          tan:x.tan,
          fuku:x.fuku,
          sanBest:x.sanBest,
          independent:independent,
          weight:weight,
          tags:tags,
          source:x,
          tri10:tri10,
          tri20:countAppearTop(ctx.sanRank,x.h,20)
        });
      }
    });

    out.sort(function(a,b){
      if(b.weight!==a.weight)return b.weight-a.weight;
      if(b.independent!==a.independent)return b.independent-a.independent;
      if(b.score!==a.score)return b.score-a.score;
      if(b.tri10!==a.tri10)return b.tri10-a.tri10;
      return safeNum(a.tan)-safeNum(b.tan);
    });
    return out;
  }
  window.detectPriorityFlaws = detectPriorityFlaws;

  window.applyRaceOverride=function(diag,ctx,scored,adv){
    var ff=detectFalseFavoriteOverride(ctx,scored,adv);

    var flaws=detectPriorityFlaws(ctx,scored,adv);

    if(lock&&lock.on){
      var outsideFlaws=flaws.filter(function(x){return lock.horses.indexOf(String(x.h))<0;});

      });
      var collapse=Number(adv.flags||0)>=5 && String(adv.level||'').indexOf('総崩れ')>=0;
      var axisBreak=!!(ff&&ff.axisSlide&&ff.axisSlide.on&&ff.signal&&ff.signal.on&&Number(adv.flags||0)>=4);
      var flawBreak=!!(strongOutside.length&&(ff.on||Number(adv.flags||0)>=4));

      if(collapse)breakReasons.push('本命/受け皿総崩れ警報');
      if(axisBreak)breakReasons.push('三連複共通軸抜けスライド');
      if(flawBreak)breakReasons.push('三強外の強い欠点あり突出馬 '+strongOutside.map(function(x){return x.h+'番';}).join('・'));

      if(breakReasons.length){
        lock.active=false;
        lock.strongBreak=true;
        lock.mode='ロック解除・大荒れ優先';
        lock.breakReasons=breakReasons.slice();

    adv.priorityFlaws=flaws;
    diag.falseFavorite=ff;
    diag.tripleLock=lock;
    diag.finalSurface=diag.surface;
    diag.finalClass=diag.cls;

    if(lock&&lock.active){
      ff.originalOn=!!ff.on;
      ff.suppressed=!!ff.on;
      ff.on=false;
      diag.finalSurface='本命〜小荒れ戦';
      diag.finalClass='good';
      diag.back='三強三角ロック補正';
      diag.matchanType=lock.replacement.length?'三強ロック＋1頭差し替え':'三強完全ロック';
      diag.wild=false;
      diag.risk=Math.max(0,(diag.risk||0)-2);
      adv.rawLevel=adv.level;
      adv.level='三強三角ロック優先・大荒れ抑制';
      return diag;
    }

    if(ff.on){
      diag.finalSurface=ff.level||'大荒れ警戒';
      diag.finalClass='warn';
      diag.back=ff.name||'偽本命・大荒れ上書き';
      diag.matchanType=ff.level||'大荒れ警戒';
      diag.wild=true;
      diag.risk=(diag.risk||0)+3;
    }
    return diag;
  };

  window.makeWildBox=function(ctx,scored,adv,ms,sw){
    var ff=adv&&adv.falseFavorite?adv.falseFavorite:null;
    var sig=(ff&&ff.signal)?ff.signal:(adv&&adv.signal?adv.signal:null);
    var on=!!(ff&&ff.on&&((sig&&sig.on)||Number(adv.flags||0)>=4));
    var res={
      on:on,horses:[],notes:{},roles:{},tansho:[],wideBox:[],sanBox:[],
      total:0,reason:[],priorityFlaws:(adv&&adv.priorityFlaws)||[]
    };
    if(!on)return res;

    var tr=rankMap(ctx.tanRow);
    var wallCount=0;

    function triCount(h){return countAppearTop(ctx.sanRank,String(h),20);}
    function supportValue(x){
      if(!x)return -9999;
      var v=Number(x.score||0)+triCount(x.h)*3;
      if(x.sanBest<=5)v+=12;
      if(safeNum(x.fuku)<=6)v+=6;
      if((tr[x.h]||99)<=3)v+=5;
      if(hasReason(x,'三連複1位ジャンプ'))v+=18;
      return v;
    }
    function isWallOnly(x){
      if(!x)return false;
      return reasonAny(x,['複勝15倍壁末端','単複ズレ大穴']) &&
             !reasonAny(x,['馬連メジアン','ワイドメジアン','三連複メジアン']) &&
             x.sanBest>5;
    }
    function pick(h,role,why){
      h=String(h||'');
      if(!h||res.horses.indexOf(h)>=0||res.horses.length>=5)return false;
      var x=getScoreObj(scored,h);
      if(isWallOnly(x)&&wallCount>=1)return false;
      res.horses.push(h);
      res.roles[h]=role;
      res.notes[h]=res.notes[h]||[];
      add(res.notes[h],why||role);
      if(isWallOnly(x))wallCount++;
      return true;
    }
    function pickObj(x,role,why){return x?pick(x.h,role,why):false;}

    var ranked=scored.slice().sort(function(a,b){
      var av=supportValue(a),bv=supportValue(b);
      if(bv!==av)return bv-av;
      return safeNum(a.tan)-safeNum(b.tan);
    });

    scored.slice(0,2).forEach(function(x){pickObj(x,'本線核','候補上位2頭');});

    var tri1Obj=adv&&adv.tri1?getScoreObj(scored,adv.tri1):null;
    if(tri1Obj&&triCount(tri1Obj.h)>=8){
      pickObj(tri1Obj,'受け皿','三連複1位ジャンプ保護');
    }
    if(res.horses.length<3){
      ((adv&&adv.receiverPop)||[]).some(function(x){return pickObj(x,'受け皿','大荒れ内の受け皿人気');});
    }
    if(res.horses.length<3){
      ranked.some(function(x){
        if((tr[x.h]||99)<=4&&triCount(x.h)>=7&&safeNum(x.fuku)<=7){
          return pickObj(x,'受け皿','人気側受け皿保護');
        }
        return false;
      });
    }

    var flaws=(adv&&adv.priorityFlaws)||detectPriorityFlaws(ctx,scored,adv);
    flaws.some(function(f){return pick(f.h,'欠点あり突出馬','独立サイン'+f.independent+'種類');});

    ranked.some(function(x){
      if(res.horses.indexOf(String(x.h))>=0)return false;
      if(isWallOnly(x)&&supportValue(x)<60)return false;
      return pickObj(x,'総合支持','三連複登場'+triCount(x.h)+'回・総合支持');
    });

    ranked.forEach(function(x){if(res.horses.length<5)pickObj(x,'補充','候補上位補充');});
    scored.forEach(function(x){if(res.horses.length<5)pickObj(x,'補充','候補上位補充');});

    res.horses=res.horses.slice(0,5);
    res.tansho=res.horses.slice();
    res.wideBox=combo2Box(res.horses);
    res.sanBox=combo3Box(res.horses);
    res.total=res.tansho.length*100+res.wideBox.length*100+res.sanBox.length*100;
    res.reason.push('本線核2頭');
    res.reason.push('受け皿1頭');
    res.reason.push('欠点あり突出馬1頭を強制保護');
    res.reason.push('残り1頭は総合支持優先');
    res.reason.push('壁末端だけの超穴は最大1頭');
    return res;
  };

  window.makeTickets=function(ctx,ms,scored,sw,adv){
    var t=V243_makeTickets(ctx,ms,scored,sw,adv);
    var flaws=(adv&&adv.priorityFlaws)||detectPriorityFlaws(ctx,scored,adv);
    var ff=adv&&adv.falseFavorite?adv.falseFavorite:null;
    t.priorityFlaws=flaws;
    t.flawProtect=[];

    if(ff&&ff.on&&scored.length>=2&&flaws.length){
      var a=scored[0],b=scored[1];
      flaws.slice(0,2).forEach(function(f){
        if(f.h!==a.h&&f.h!==b.h)addT(t.flawProtect,a.h,b.h,f.h);
      });
      t.flawProtect=uniq(t.flawProtect).slice(0,3);
      t.v236=uniq(t.flawProtect.concat(t.v236||[])).slice(0,12);
      t.bomb=uniq(t.flawProtect.concat(t.bomb||[])).slice(0,12);
    }
    return t;
  };

  function renderV244Card(adv){
    var flaws=(adv&&adv.priorityFlaws)||[];
    if(!flaws.length)return'';
    var html='<div class="card v244"><div class="title">🚨V2.44 欠点あり突出馬・強制保護</div>';
    html+='優先順：<span class="v244Strong">'+flaws.map(function(f){return f.h+'番';}).join('・')+'</span><br>';
    flaws.slice(0,5).forEach(function(f){
      html+='<div class="rankLine"><span class="v244Role">'+f.h+'番｜独立'+f.independent+'種類</span> ';
      html+='<span class="small">候補'+f.score+'点 / 保護指数'+f.weight+' / 三連複上位10件'+f.tri10+'回 / '+f.tags.join('・')+'</span></div>';
    });
    html+='<span class="small">大荒れ時は、壁末端だけの超大穴より、複数表にまたがる欠点あり突出馬を5頭BOXへ優先します。</span></div>';
    return html;
  }

  window.renderDiag=function(diag,ctx){
    var html=V243_renderDiag(diag,ctx).replace(/V2\.43/g,'V2.44');
    if(diag.tripleLock&&diag.tripleLock.strongBreak&&diag.tripleLock.breakReasons&&diag.tripleLock.breakReasons.length){
      html+='<div class="card v244"><div class="title">🔓三強ロック解除理由</div>';
      html+='<span class="warn">'+diag.tripleLock.breakReasons.join('<br>')+'</span><br>';
      html+='<span class="small">強い大荒れサインが三強の外側にあるため、ロックによる過剰抑制を解除しました。</span></div>';
    }
    return html;
  };

  window.renderV236=function(adv){
    return V243_renderV236(adv).replace(/V2\.43/g,'V2.44')+renderV244Card(adv);
  };

  window.renderTickets=function(t){
    var extra='';
    if(t.flawProtect&&t.flawProtect.length){
      extra='<div class="card v244"><div class="title">🛡候補上位2頭＋突出穴 強制保護</div><pre>';
      extra+=t.flawProtect.join('\n');
      extra+='\n\n※大荒れ時、候補1位・2位と最優先の欠点あり突出馬を結ぶ三連複。</pre></div>';
    }
    var html=V243_renderTickets(t).replace(/V2\.43/g,'V2.44');
    if(t.wildBox&&t.wildBox.on){
      var roleLine=t.wildBox.horses.map(function(h){return h+'番＝'+(t.wildBox.roles[h]||'候補');}).join(' / ');
      extra+='<div class="card v244"><div class="title">🎯役割別5頭BOX内訳</div>'+roleLine+'<br><span class="small">本線核2頭＋受け皿＋欠点あり突出馬＋総合支持。壁末端だけの穴は最大1頭。</span></div>';
    }
    return extra+html;
  };

  window.makeCopyText=function(data,diag,ctx,ms,sw,tickets,scored,moves,adv){
    var s=V243_makeCopyText(data,diag,ctx,ms,sw,tickets,scored,moves,adv).replace(/V2\.43/g,'V2.44');
    s=s.replace(
      '競馬メジアン V2.44 三強三角ロック補正＋大荒れ過剰判定抑制',
      '競馬メジアン V2.44 欠点あり突出馬強制保護＋役割別5頭BOX'
    );

    var block='\n🚨V2.44 欠点あり突出馬・強制保護\n';
    var flaws=(adv&&adv.priorityFlaws)||[];
    block+='優先順：'+(flaws.length?flaws.map(function(f){return f.h+'番';}).join('・'):'なし')+'\n';
    flaws.slice(0,5).forEach(function(f){
      block+=f.h+'番 独立'+f.independent+'種類 / 候補'+f.score+'点 / 保護指数'+f.weight+' / 三連複上位10件'+f.tri10+'回 / '+f.tags.join('・')+'\n';
    });
    if(diag.tripleLock&&diag.tripleLock.strongBreak&&diag.tripleLock.breakReasons&&diag.tripleLock.breakReasons.length){
      block+='三強ロック解除：'+diag.tripleLock.breakReasons.join(' / ')+'\n';
    }
    if(tickets.flawProtect&&tickets.flawProtect.length){
      block+='候補上位2頭＋突出穴保護：'+tickets.flawProtect.join(' / ')+'\n';
    }
    if(tickets.wildBox&&tickets.wildBox.on){
      block+='役割別5頭BOX：'+tickets.wildBox.horses.map(function(h){return h+'番('+tickets.wildBox.roles[h]+')';}).join(' / ')+'\n';
    }

    s=s.replace('\n🔥まっちゃん単勝システム',block+'\n🔥まっちゃん単勝システム');
    return s;
  };
})();
</script>
<script>
(function(){

  var V244_renderDiag = window.renderDiag;

  document.title = 'チャッピー神予想 競馬 V2.45 青白光・大穴関門ランプ';
  var heading = document.querySelector('h1');
  if(heading){
    heading.innerHTML = 'チャッピー神予想 競馬 V2.45<br>💎青白光・大穴関門ランプ<br>🚨壁・連系・ズレ・荒れを独立判定／同系統の重複加点なし';
  }

  var style = document.createElement('style');
  style.textContent = [
    '.ooanaGate{border:3px solid #60a5fa;background:linear-gradient(135deg,#020b1d,#073a6a,#07152d);box-shadow:0 0 10px rgba(96,165,250,.9),0 0 24px rgba(56,189,248,.52),inset 0 0 14px rgba(255,255,255,.08)}',

    '.gateHorse{margin:10px 0;padding:10px;border-radius:13px;background:rgba(2,6,23,.68);border:1px solid rgba(186,230,253,.62)}',

    '@keyframes v245BlueWhiteGlow{from{filter:brightness(1);transform:scale(1)}to{filter:brightness(1.18);transform:scale(1.006)}}'
  ].join('');
  document.head.appendChild(style);

  function n(v,d){
    v=Number(v);
    return isFinite(v)?v:(d===0?0:(d||9999));
  }
  function containsReason(x,word){
    return ((x&&x.reasons)||[]).join(' / ').indexOf(word)>=0;
  }
  function anyReason(x,words){
    for(var i=0;i<words.length;i++){
      if(containsReason(x,words[i]))return true;
    }
    return false;
  }
  function includesHorse(list,h){
    h=String(h);
    for(var i=0;i<(list||[]).length;i++){
      var x=list[i];
      if(String(x.h||x)===h)return true;
    }
    return false;
  }
  function virtual15Wall(ctx){
    var rank=(ctx&&ctx.fukuRank)||[];
    if(rank.length<2)return{on:false,items:[]};
    var has15=rank.some(function(x){return n(x.fuku)>=15;});
    if(has15)return{on:false,items:[]};
    var tail=rank.slice(-2).map(function(x){return String(x.h);});
    return{
      on:true,
      items:tail,
      reason:'複勝15倍以上の馬がいないため、複勝上限の末尾2頭を仮想15倍壁前2頭として扱う'
    };
  }
  function addNote(arr,v){
    if(v&&arr.indexOf(v)<0)arr.push(v);
  }
  function detectOoanaGate(ctx,scored,adv){
    var virtual=virtual15Wall(ctx);
    var outer={};
    (((adv&&adv.wallOuter15)||{}).items||[]).forEach(function(x){outer[String(x.h)]=1;});
    var falseFav=!!(adv&&adv.falseFavorite&&adv.falseFavorite.on);
    var axisSlide=!!(adv&&adv.falseFavorite&&adv.falseFavorite.axisSlide&&adv.falseFavorite.axisSlide.on);
    var roughRace=falseFav||axisSlide||!!(adv&&/大荒れ|総崩れ|危険/.test(String(adv.level||'')));
    var out=[];

    (scored||[]).forEach(function(x){
      var wall=[],link=[],shift=[],rough=[];
      var h=String(x.h);

      if(anyReason(x,['複勝10倍壁前','複勝15倍壁前','複勝15倍断層下2頭','複勝15倍壁末端'])){
        addNote(wall,'複勝壁・断層');
      }
      if(outer[h])addNote(wall,'複勝15倍壁外1頭目');
      if(virtual.on&&virtual.items.indexOf(h)>=0)addNote(wall,'仮想15倍壁前2頭');

      if(anyReason(x,['馬連メジアン','ワイドメジアン','三連複メジアン','三連複先行支持ジャンプ','三連複1位ジャンプ'])){
        addNote(link,'連系メジアン・ジャンプ');
      }
      var san10=countAppearTop((ctx&&ctx.sanRank)||[],h,10);
      var uma12=countAppearTop((ctx&&ctx.umaRank)||[],h,12);
      var wide12=countAppearTop((ctx&&ctx.wideRank)||[],h,12);
      if(n(x.sanBest)<=5)addNote(link,'三連複5位以内');
      if(san10>=2&&(uma12>=2||wide12>=2))addNote(link,'複数券種の上位接続');

      var topAnchors=((ctx&&ctx.tanRow)||[]).slice(0,4),anchorHit={};
      [((ctx&&ctx.umaRank)||[]),((ctx&&ctx.wideRank)||[])].forEach(function(list){
        list.forEach(function(p){
          var a=String(p.a||''),b=String(p.b||'');
          if(a===h&&topAnchors.indexOf(b)>=0)anchorHit[b]=1;
          if(b===h&&topAnchors.indexOf(a)>=0)anchorHit[a]=1;
        });
      });
      if(Object.keys(anchorHit).length>=2)addNote(link,'上位人気2頭以上と直接接続');

      if(anyReason(x,['単複ズレ','単複ズレ大穴','複勝上昇ジャンプ'])){
        addNote(shift,'単複・複勝順位ズレ');
      }
      if(n(x.tRank,99)-n(x.fRank,99)>=3)addNote(shift,'単勝より複勝順位先行');
      if(n(x.tRank,99)-n(x.sanBest,99)>=3)addNote(shift,'単勝より三連複順位先行');

      if(roughRace)addNote(rough,falseFav?'偽本命・大荒れ上書き':'荒れ警報');
      if(axisSlide)addNote(rough,'軸抜けスライド');
      if(includesHorse((adv&&adv.diagBox)||[],h)&&adv&&adv.level!=='通常')addNote(rough,'診断枠内候補');
      if(anyReason(x,['中穴保護','欠点あり突出馬']))addNote(rough,'荒れ時保護候補');

      var gates=[];
      if(wall.length)gates.push('壁');
      if(link.length)gates.push('連系');
      if(shift.length)gates.push('ズレ');
      if(rough.length)gates.push('荒れ');

      var tan=n(x.tan),eligible=(tan>=8||n(x.tRank,99)>=4||wall.length||shift.length);
      if(!eligible||gates.length<2)return;

      var level=gates.length>=4?'強点灯':(gates.length===3?'点灯':'注意');
      var action='経過観察';
      if(gates.length>=4)action='ワイド・三連複で強制保護';
      else if(gates.length===3&&wall.length&&link.length)action='ワイド・三連複で1点保護';
      else if(gates.length===3&&link.length&&shift.length)action='連系必須馬として保護';
      else if(gates.length===3)action='三連複の2・3着穴で保護';

      out.push({
        h:h,
        count:gates.length,
        level:level,
        gates:gates,
        action:action,
        score:n(x.score,0),
        tan:x.tan,
        fuku:x.fuku,
        notes:{wall:wall,link:link,shift:shift,rough:rough}
      });
    });

    out.sort(function(a,b){
      if(b.count!==a.count)return b.count-a.count;
      if(b.score!==a.score)return b.score-a.score;
      return n(a.tan)-n(b.tan);
    });

    var lit=out.filter(function(x){return x.count>=3;});
    var caution=out.filter(function(x){return x.count===2;}).slice(0,4);
    return{
      on:lit.length>0,
      strong:lit.some(function(x){return x.count===4;}),
      level:lit.some(function(x){return x.count===4;})?'強点灯':(lit.length?'点灯':'消灯'),
      items:lit.slice(0,6),
      caution:caution,
      virtual15:virtual
    };
  }

  function gateClass(level){
    return level==='強点灯'?'gateStrong':(level==='点灯'?'gateOn':'gateCaution');
  }
  function renderGateCard(g){
    g=g||{on:false,strong:false,level:'消灯',items:[],caution:[],virtual15:{on:false,items:[]}};
    var cls='card ooanaGate'+(g.strong?' strong':(g.on?' on':''));
    var html='<div class="'+cls+'"><div class="title">💎V2.45 青白光・大穴関門ランプ</div>';
    html+='判定：<span class="'+gateClass(g.level)+'">'+g.level+'</span><br>';
    html+='<span class="small">壁・連系・ズレ・荒れの4関門を独立判定。同じ系統のサインが複数あっても1関門として数えます。</span>';
    if(g.virtual15&&g.virtual15.on){
      html+='<hr>仮想15倍壁前2頭：<span class="cyan">'+g.virtual15.items.map(function(h){return h+'番';}).join('・')+'</span><br>';
      html+='<span class="small">複勝15倍以上が不在のため、複勝上限の末尾2頭を壁前候補として扱います。</span>';
    }
    if(g.items&&g.items.length){
      html+='<hr>';
      g.items.forEach(function(x){
        html+='<div class="gateHorse"><span class="'+gateClass(x.level)+'">'+x.h+'番　'+x.level+'／'+x.count+'関門</span><br>';
        html+=x.gates.map(function(v){return '<span class="gateBadge">'+v+'</span>';}).join('')+'<br>';
        html+='<span class="small">単'+x.tan+' / 複'+x.fuku+'　扱い：'+x.action+'</span></div>';
      });
    }else{
      html+='<hr>3関門以上の該当馬なし';
    }
    if(g.caution&&g.caution.length){
      html+='<hr><span class="gateCaution">2関門・注意：</span> '+g.caution.map(function(x){return x.h+'番('+x.gates.join('・')+')';}).join(' / ');
    }
    html+='</div>';
    return html;
  }

  window.makeTickets=function(ctx,ms,scored,sw,adv){
    var gate=detectOoanaGate(ctx,scored,adv);
    if(adv)adv.ooanaGate=gate;
    var t=V244_makeTickets(ctx,ms,scored,sw,adv);
    t.ooanaGate=gate;
    return t;
  };

  window.renderDiag=function(diag,ctx){
    return V244_renderDiag(diag,ctx).replace(/V2\.44|V2\.43|V2\.42/g,'V2.45');
  };
  window.renderV236=function(adv){
    return V244_renderV236(adv).replace(/V2\.44|V2\.43|V2\.42/g,'V2.45')+renderGateCard(adv&&adv.ooanaGate);
  };
  window.renderMatchan=function(ms,diag,ctx,moves){
    return V244_renderMatchan(ms,diag,ctx,moves).replace(/V2\.44|V2\.43|V2\.42/g,'V2.45');
  };
  window.renderTickets=function(t){
    return V244_renderTickets(t).replace(/V2\.44|V2\.43|V2\.42/g,'V2.45');
  };

  window.makeCopyText=function(data,diag,ctx,ms,sw,tickets,scored,moves,adv){
    var s=V244_makeCopyText(data,diag,ctx,ms,sw,tickets,scored,moves,adv).replace(/V2\.44|V2\.43|V2\.42/g,'V2.45');
    s=s.replace(
      '競馬メジアン V2.45 欠点あり突出馬強制保護＋役割別5頭BOX',
      '競馬メジアン V2.45 青白光・大穴関門ランプ＋欠点あり突出馬強制保護'
    );

    var g=(adv&&adv.ooanaGate)||tickets.ooanaGate||{level:'消灯',items:[],caution:[],virtual15:{on:false,items:[]}};
    var block='\n💎V2.45 青白光・大穴関門ランプ\n';
    block+='判定：'+g.level+'\n';
    if(g.virtual15&&g.virtual15.on){
      block+='仮想15倍壁前2頭：'+g.virtual15.items.map(function(h){return h+'番';}).join('・')+'\n';
    }
    if(g.items&&g.items.length){
      g.items.forEach(function(x){
        block+=x.h+'番 '+x.level+' / '+x.count+'関門 / 通過：'+x.gates.join('・')+' / 扱い：'+x.action+'\n';
      });
    }else{
      block+='対象：なし\n';
    }
    if(g.caution&&g.caution.length){

<script>
(function(){
  'use strict';

  var V245_renderDiag=window.renderDiag;
  var V245_renderV236=window.renderV236;
  var V245_renderMatchan=window.renderMatchan;
  var V245_renderTickets=window.renderTickets;

  document.title='チャッピー神予想 競馬 V2.46 まっちゃん式オッズ構造予想';
  var heading=document.querySelector('h1');
  if(heading){
    heading.innerHTML='チャッピー神予想 競馬 V2.46<br>📘まっちゃん式オッズ構造予想【検証版】<br>💎既存機能を残して、最下部に独立追加';
  }

  var st=document.createElement('style');
  st.textContent=[
    '.matchanOddsLab{border:3px solid #a78bfa;background:linear-gradient(135deg,#110b28,#312e81,#0f172a);box-shadow:0 0 12px rgba(167,139,250,.65),0 0 28px rgba(59,130,246,.35)}',
    '.matchanOddsLab.strong{border-color:#f5d0fe;box-shadow:0 0 12px #fff,0 0 28px #c084fc,0 0 45px rgba(59,130,246,.6)}',
    '.matchanOddsLab .patternOn{color:#86efac;font-weight:900}',
    '.matchanOddsLab .patternOff{color:#94a3b8;font-weight:900}',
    '.matchanOddsLab .patternSemi{color:#fde047;font-weight:900}',
    '.matchanOddsLab .holeLine{padding:8px 10px;margin:7px 0;background:rgba(2,6,23,.55);border-radius:12px}',
    '.matchanOddsLab .labTicket{background:#020617;border:1px solid #8b5cf6;border-radius:12px;padding:11px;margin-top:10px}',
    '.matchanOddsLab .labTag{display:inline-block;background:#312e81;border:1px solid #818cf8;border-radius:999px;padding:3px 8px;margin:2px;font-size:13px;font-weight:900}'
  ].join('');
  document.head.appendChild(st);

  function n(v,d){v=Number(v);return isFinite(v)?v:(d===0?0:(d||9999));}
  function one(arr,v){v=String(v);if(v&&arr.indexOf(v)<0)arr.push(v);}
  function idxMap(arr){var m={};(arr||[]).forEach(function(x,i){m[String(x.h||x)]=i+1;});return m;}
  function reasonAdd(obj,h,txt,pt){h=String(h);if(!obj[h])obj[h]={h:h,score:0,reasons:[]};obj[h].score+=pt||0;one(obj[h].reasons,txt);}
  function actualPairRank(list,key){for(var i=0;i<(list||[]).length;i++){if(list[i].key===key)return i+1;}return 999;}
  function actualTriRank(list,key){for(var i=0;i<(list||[]).length;i++){if(list[i].key===key)return i+1;}return 999;}

  function ratioWalls(rank,field,limit){
    var out=[];
    for(var i=0;i<(rank||[]).length-1;i++){
      var a=n(rank[i][field]),b=n(rank[i+1][field]);
      if(a>0&&b/a>=1.8){
        out.push({after:i+1,ratio:Number((b/a).toFixed(2)),before:String(rank[i].h),next:String(rank[i+1].h),a:a,b:b});
      }
      if(limit&&out.length>=limit)break;
    }
    return out;
  }

  function thresholdBoundary(rank,field,value){
    var pos=-1;
    for(var i=0;i<(rank||[]).length;i++){
      if(n(rank[i][field])<=value)pos=i;
    }
    var valid=pos>=0&&pos<rank.length-1;
    var before=[];
    if(pos>=0){
      if(rank[pos])one(before,rank[pos].h);
      if(rank[pos-1])one(before,rank[pos-1].h);
    }
    return{
      valid:valid,
      position:pos+1,
      before:before,
      after:valid?String(rank[pos+1].h):null,
      low:pos>=0?n(rank[pos][field]):null,
      high:valid?n(rank[pos+1][field]):null
    };
  }

  function horsePairRank(ctx){
    var tr=idxMap(ctx.tanRank),src=(ctx.otaniRank||[]);
    return src.map(function(x,i){return{h:String(x.h),od:n(x.od,0),pairRank:x.pairRank||i,seq:i+1,tRank:tr[String(x.h)]||99,axis:!!x.axis};});
  }

  function pairHorseWalls(row){
    var out=[];
    for(var i=0;i<row.length-1;i++){
      var a=n(row[i].od),b=n(row[i+1].od);
      if(a>0&&b/a>=1.8){
        out.push({after:i+1,ratio:Number((b/a).toFixed(2)),before:row[i].h,next:row[i+1].h,a:a,b:b});
      }
    }
    return out;
  }

  function anchorRanking(ctx,holeSet){
    var map={},tr=idxMap(ctx.tanRank),fr=idxMap(ctx.fukuRank),pr=idxMap(horsePairRank(ctx));
    function addPt(h,pt,why){h=String(h);if(holeSet[h])return;if(!map[h])map[h]={h:h,score:0,reasons:[]};map[h].score+=pt;one(map[h].reasons,why);}
    (ctx.tanRank||[]).slice(0,5).forEach(function(x,i){addPt(x.h,[14,11,8,5,3][i]||1,'単勝上位');});
    (ctx.fukuRank||[]).slice(0,5).forEach(function(x,i){addPt(x.h,[14,11,8,5,3][i]||1,'複勝上位');});
    horsePairRank(ctx).slice(0,5).forEach(function(x,i){addPt(x.h,[16,12,9,6,3][i]||1,'馬連馬別上位');});
    (ctx.umaRank||[]).slice(0,12).forEach(function(p,i){var pt=Math.max(1,6-Math.floor(i/2));addPt(p.a,pt,'馬連上位接続');addPt(p.b,pt,'馬連上位接続');});
    (ctx.wideRank||[]).slice(0,12).forEach(function(p,i){var pt=Math.max(1,4-Math.floor(i/4));addPt(p.a,pt,'ワイド上位接続');addPt(p.b,pt,'ワイド上位接続');});
    return Object.keys(map).map(function(h){return map[h];}).sort(function(a,b){
      if(b.score!==a.score)return b.score-a.score;
      if((tr[a.h]||99)!==(tr[b.h]||99))return (tr[a.h]||99)-(tr[b.h]||99);
      if((fr[a.h]||99)!==(fr[b.h]||99))return (fr[a.h]||99)-(fr[b.h]||99);
      return Number(a.h)-Number(b.h);
    });
  }

  function detectMatchanOdds(data,ctx){
    var tanWalls=ratioWalls(ctx.tanRank,'tan'),w80=thresholdBoundary(ctx.tanRank,'tan',80),w15=thresholdBoundary(ctx.fukuRank,'fuku',15);
    var pRow=horsePairRank(ctx),pWalls=pairHorseWalls(pRow);
    var field=ctx.tanRank.length;

    var p1={on:false,semi:false,name:'①単勝ランク無壁混戦',detail:''};
    if(tanWalls.length===0){p1.on=true;p1.detail='単勝1.8倍壁なし';}
    else if(tanWalls.length===1&&tanWalls[0].after>=Math.max(1,field-2)){
      p1.on=true;p1.semi=true;p1.detail='単勝壁は最後尾付近のみ（'+tanWalls[0].after+'位後ろ）';
    }else{p1.detail='単勝壁'+tanWalls.length+'か所';}

    var diff=(w80.valid&&w15.valid)?Math.abs(w80.position-w15.position):0;
    var p2={on:!!(w80.valid&&w15.valid&&diff>=1),semi:false,name:'②単勝80倍壁×複勝15倍壁ズレ',detail:''};
    if(w80.valid&&w15.valid){p2.detail='単勝80倍壁 '+w80.position+'位後ろ / 複勝15倍壁 '+w15.position+'位後ろ / 差'+diff+'ランク';}
    else{p2.detail='80倍壁または15倍壁が未成立';}

    var early=pWalls.filter(function(w){return w.after<=3;});
    var p3={on:early.length>0,semi:false,name:'③馬連上位人気集中',detail:early.length?('馬連馬別'+early[0].after+'位後ろに'+early[0].ratio+'倍壁'):'上位3位以内に1.8倍壁なし'};
    var patterns=[p1,p2,p3],count=patterns.filter(function(x){return x.on;}).length;

    var cand={};
    if(w15.valid){
      w15.before.forEach(function(h,i){reasonAdd(cand,h,i===0?'複勝15倍壁の前1頭':'複勝15倍壁の前2頭',i===0?9:8);});
    }
    var holeSet={};Object.keys(cand).forEach(function(h){holeSet[h]=1;});

    var tr=idxMap(ctx.tanRank),fr=idxMap(ctx.fukuRank),pr=idxMap(pRow);
    if(p2.on){
      Object.keys(cand).forEach(function(h){reasonAdd(cand,h,'単複の壁位置ズレ'+diff+'ランク',Math.min(5,2+diff));});
    }
    if(w80.valid){w80.before.forEach(function(h){if(cand[h])reasonAdd(cand,h,'単勝80倍壁前と一致',4);});}

    pWalls.forEach(function(w){
      var idx=w.after-1;
      [pRow[idx],pRow[idx-1]].forEach(function(x){if(x&&cand[x.h])reasonAdd(cand,x.h,'馬連オッズ壁前',4);});
      if(pRow[idx+1]&&cand[pRow[idx+1].h])reasonAdd(cand,pRow[idx+1].h,'馬連オッズ壁直後',3);
    });

    for(var i=0;i<pWalls.length-1;i++){
      var left=pWalls[i].after,right=pWalls[i+1].after;
      var size=right-left;
      if(size>=1&&size<=2){
        for(var k=left;k<right;k++){
          if(pRow[k]&&cand[pRow[k].h])reasonAdd(cand,pRow[k].h,'馬連2壁の囲い穴',6);
        }
      }
    }

    var tanWallH={};
    tanWalls.forEach(function(w){tanWallH[w.before]=1;tanWallH[w.next]=1;});
    Object.keys(cand).forEach(function(h){
      if(tanWallH[h])reasonAdd(cand,h,'単勝1.8倍壁と一致',3);
      if((tr[h]||0)>=Math.max(8,field-2))reasonAdd(cand,h,'最低・下位ランク保護',2);
      if((pr[h]||99)>=Math.max(8,pRow.length-2))reasonAdd(cand,h,'馬連下位ランク保護',2);
      if(field<=12)reasonAdd(cand,h,'少頭数ワイド補助',2);
    });

    var anchors=anchorRanking(ctx,holeSet).slice(0,4);

    Object.keys(cand).forEach(function(h){
      var hit=0,best=999;
      anchors.slice(0,3).forEach(function(a){
        var r=actualPairRank(ctx.wideRank,pairKey(h,a.h));
        if(r<999){hit++;if(r<best)best=r;}
      });
      if(hit>=2)reasonAdd(cand,h,'上位馬2頭以上とワイド接続',4);
      else if(hit===1)reasonAdd(cand,h,'上位馬とワイド接続',2);
      if(best<=8)reasonAdd(cand,h,'ワイド上位支持',2);
    });

    var holes=Object.keys(cand).map(function(h){
      var x=cand[h];x.tRank=tr[h]||99;x.fRank=fr[h]||99;x.pRank=pr[h]||99;return x;
    }).sort(function(a,b){
      if(b.score!==a.score)return b.score-a.score;
      if(b.tRank!==a.tRank)return b.tRank-a.tRank;
      return Number(a.h)-Number(b.h);
    });

    var eligible=count>0&&holes.length>0&&anchors.length>=2;
    var strength=count>=3?'最強発動':(count===2?'強発動':(count===1?'発動':'見送り'));
    if(count>0&&!holes.length)strength='候補不足・見送り';

    var widePool=[];
    function pushWide(a,b,base){
      if(!a||!b||a===b)return;var key=pairKey(a,b);if(widePool.some(function(x){return x.key===key;}))return;
      var r=actualPairRank(ctx.wideRank,key),od=null;
      (ctx.wideRank||[]).forEach(function(x){if(x.key===key)od=x.od;});
      widePool.push({key:key,rank:r,od:od,score:base+(r<999?Math.max(0,25-r):0)});
    }
    if(eligible){
      holes.slice(0,2).forEach(function(h,hi){anchors.slice(0,3).forEach(function(a,ai){pushWide(h.h,a.h,h.score+a.score-hi*2-ai);});});
      if(holes.length>=2)pushWide(holes[0].h,holes[1].h,holes[0].score+holes[1].score+2);
    }
    widePool.sort(function(a,b){if(b.score!==a.score)return b.score-a.score;if(a.rank!==b.rank)return a.rank-b.rank;return a.key.localeCompare(b.key);});
    var wide=[];
    if(eligible&&holes.length>=2){
      holes.slice(0,2).forEach(function(h){var x=widePool.find(function(w){return w.key.split('-').indexOf(h.h)>=0;});if(x&&wide.indexOf(x.key)<0)wide.push(x.key);});
    }
    widePool.forEach(function(x){if(wide.length<4&&wide.indexOf(x.key)<0)wide.push(x.key);});

    var triPool=[];
    function pushTri(arr,base){
      var key=triKey(arr[0],arr[1],arr[2]);if(triPool.some(function(x){return x.key===key;}))return;
      var r=actualTriRank(ctx.sanRank,key),od=null;
      (ctx.sanRank||[]).forEach(function(x){if(x.key===key)od=x.od;});
      triPool.push({key:key,rank:r,od:od,score:base+(r<999?Math.max(0,30-r):0)});
    }
    if(eligible){
      holes.slice(0,2).forEach(function(h){
        for(var a=0;a<Math.min(4,anchors.length);a++)for(var b=a+1;b<Math.min(4,anchors.length);b++){
          pushTri([h.h,anchors[a].h,anchors[b].h],h.score+anchors[a].score+anchors[b].score);
        }
      });
      if(holes.length>=2){anchors.slice(0,3).forEach(function(a){pushTri([holes[0].h,holes[1].h,a.h],holes[0].score+holes[1].score+a.score+3);});}
    }
    triPool.sort(function(a,b){if(b.score!==a.score)return b.score-a.score;if(a.rank!==b.rank)return a.rank-b.rank;return a.key.localeCompare(b.key);});
    var tri=triPool.slice(0,6).map(function(x){return x.key;});

    return{
      patterns:patterns,count:count,strength:strength,eligible:eligible,
      tanWalls:tanWalls,w80:w80,w15:w15,pairRow:pRow,pairWalls:pWalls,
      holes:holes,anchors:anchors,wide:wide.slice(0,4),tri:tri,
      total:wide.slice(0,4).length+tri.length,
      cost:(wide.slice(0,4).length+tri.length)*100
    };
  }

  function wallText(w,label){
    if(!w.valid)return label+'：未成立';
    return label+'：'+w.position+'位後ろ（'+w.low+' → '+w.high+'）';

  function renderMatchanOdds(m){
    m=m||{patterns:[],count:0,strength:'見送り',holes:[],anchors:[],wide:[],tri:[],total:0,cost:0};

    });

  }

      out.innerHTML=html;

  function num(v,d){
    v=Number(v);
    return isFinite(v)?v:(d===0?0:(d||9999));
  }
  function uniquePush(arr,v){
    v=String(v||'');
    if(v&&arr.indexOf(v)<0)arr.push(v);
  }
  function mapRank(arr){
    var m={};
    (arr||[]).forEach(function(x,i){m[String(x.h||x)]=i+1;});
    return m;
  }
  function ratioWalls247(rank,field){
    var out=[];
    for(var i=0;i<(rank||[]).length-1;i++){
      var a=num(rank[i][field]),b=num(rank[i+1][field]);
      if(a>0&&b/a>=1.8){
        out.push({after:i+1,ratio:Number((b/a).toFixed(2)),before:String(rank[i].h),next:String(rank[i+1].h),a:a,b:b});
      }
    }
    return out;
  }
  function horsePairRank247(ctx){
    return (ctx.otaniRank||[]).map(function(x,i){return{h:String(x.h),od:num(x.od,0),pairRank:x.pairRank||i,axis:!!x.axis};});
  }
  function medianHorses(list){
    if(!list||!list.length)return[];
    var n=list.length;
    if(n%2)return[String(list[Math.floor(n/2)].h||list[Math.floor(n/2)])];
    return [String(list[n/2-1].h||list[n/2-1]),String(list[n/2].h||list[n/2])];
  }
  function wallMedian247(rank,field,label){
    var walls=ratioWalls247(rank,field),segment=[];
    if(!walls.length)return{on:false,label:label,walls:[],segment:[],median:[],detail:'1.8倍壁なし'};
    if(walls.length===1){
      segment=(rank||[]).slice(0,walls[0].after);
    }else{
      segment=(rank||[]).slice(walls[0].after,walls[1].after);
      if(!segment.length)segment=(rank||[]).slice(0,walls[0].after);
    }
    return{
      on:segment.length>0,
      label:label,
      walls:walls,
      segment:segment.map(function(x){return String(x.h);}),
      median:medianHorses(segment),
      detail:walls.length===1?'1位〜最初の壁前':'1つ目の壁直後〜2つ目の壁前'
    };
  }
  function independentFamilies(reasons){
    var fam={};
    (reasons||[]).forEach(function(r){
      r=String(r);
      if(/壁前|壁末端|断層|壁外/.test(r))fam.wall=1;
      if(/馬連|ワイド|三連複/.test(r))fam.link=1;
      if(/ズレ|上昇|先行支持/.test(r))fam.shift=1;
      if(/メジアン/.test(r))fam.median=1;
      if(/保護|突出/.test(r))fam.protect=1;
      if(/診断枠|大荒れ|受け皿/.test(r))fam.rough=1;
    });
    return Object.keys(fam).length;
  }
  function buildWallMedian(ctx){
    var pairRank=horsePairRank247(ctx);
    var tan=wallMedian247(ctx.tanRank||[],'tan','単勝');
    var fuku=wallMedian247(ctx.fukuRank||[],'fuku','複勝');
    var uma=wallMedian247(pairRank,'od','馬連馬別');
    var count={};
    [tan,fuku,uma].forEach(function(x){
      (x.median||[]).forEach(function(h){count[h]=(count[h]||0)+1;});
    });
    var overall=Object.keys(count).map(function(h){return{h:h,count:count[h]};}).sort(function(a,b){
      if(b.count!==a.count)return b.count-a.count;
      return Number(a.h)-Number(b.h);
    });
    var best=overall[0]||null;
    return{
      tan:tan,fuku:fuku,uma:uma,overall:overall,
      verdict:best?(best.count>=3?'3市場一致・勝ち切り候補':(best.count===2?'2市場一致・対抗候補':'市場別中央値')):'中央値なし'
    };
  }
  function buildTop4Lock(ctx,scored,adv,matchan){
    var pair=horsePairRank247(ctx),tr=mapRank(ctx.tanRank),fr=mapRank(ctx.fukuRank),pr=mapRank(pair);
    var rows=[];
    (ctx.all||[]).forEach(function(h){
      h=String(h);
      var ranks=[tr[h]||99,fr[h]||99,pr[h]||99];
      var presence=ranks.filter(function(r){return r<=4;}).length;
      var softPresence=ranks.filter(function(r){return r<=6;}).length;
      var finite=ranks.filter(function(r){return r<99;});
      var spread=finite.length?Math.max.apply(null,finite)-Math.min.apply(null,finite):99;
      var points=ranks.reduce(function(s,r){return s+(r<=6?7-r:0);},0)+presence*5;
      rows.push({h:h,ranks:ranks,presence:presence,softPresence:softPresence,spread:spread,points:points,tri:countAppearTop(ctx.sanRank||[],h,10)});
    });
    rows.sort(function(a,b){
      if(b.points!==a.points)return b.points-a.points;
      if(b.presence!==a.presence)return b.presence-a.presence;
      if(b.tri!==a.tri)return b.tri-a.tri;
      return Number(a.h)-Number(b.h);
    });
    var top=rows.slice(0,4),avgSpread=top.length?top.reduce(function(s,x){return s+x.spread;},0)/top.length:99;
    var stable=top.length===4&&top.filter(function(x){return x.softPresence>=2;}).length===4&&top.filter(function(x){return x.presence>=2;}).length>=3&&top.filter(function(x){return x.tri>0;}).length>=3&&avgSpread<=4;
    var topSet={};top.forEach(function(x){topSet[x.h]=1;});
    var gateMap={};
    (((adv||{}).ooanaGate||{}).items||[]).forEach(function(x){gateMap[String(x.h)]=x.count;});
    var holeMap={};
    ((matchan||{}).holes||[]).forEach(function(x){holeMap[String(x.h)]=x.score;});
    var external=(scored||[]).filter(function(x){
      var h=String(x.h);if(topSet[h])return false;
      var fam=independentFamilies(x.reasons||[]);
      return (num(gateMap[h],0)>=4)||(num(holeMap[h],0)>=25&&fam>=3)||(num(x.score,0)>=75&&fam>=4);
    }).slice(0,3);
    return{
      top:top,stable:stable,active:stable&&external.length===0,breakOn:stable&&external.length>0,
      external:external,avgSpread:Number(avgSpread.toFixed(1)),
      mode:stable?(external.length?'ロック解除・外部穴優先':'上位4頭安定ロック'):'非発動'
    };
  }
  function buildWin5(ctx,wallMedian){
    var pair=horsePairRank247(ctx),tr=mapRank(ctx.tanRank),fr=mapRank(ctx.fukuRank),pr=mapRank(pair),medianCount={};
    (wallMedian.overall||[]).forEach(function(x){medianCount[x.h]=x.count;});
    var pool=(ctx.fukuRank||[]).filter(function(x){return num(x.fuku)<=3;}).map(function(x){
      var h=String(x.h),move=(tr[h]||99)-Math.min(fr[h]||99,pr[h]||99),tri=countAppearTop(ctx.sanRank||[],h,10);
      var score=20+(medianCount[h]||0)*10+Math.max(0,move)*3+(pr[h]<=4?6:0)+Math.min(12,tri*2);
      return{h:h,fuku:x.fuku,tan:x.tan,score:score,move:move,tri:tri,median:medianCount[h]||0};
    });
    pool.sort(function(a,b){if(b.score!==a.score)return b.score-a.score;return num(a.tan)-num(b.tan);});
    var selected=pool.length<=3?pool:pool.slice(0,3);
    return{pool:pool,selected:selected,mode:pool.length<=3?'複勝3倍以内を全頭保護':'4頭以上のため壁内中央値・上昇度で3頭へ圧縮'};
  }
  function buildFavoriteTrust(ctx,wallMedian,win5,lock){
    var h=String(ctx.fav1||''),reasons=[],tri=countAppearTop(ctx.sanRank||[],h,10),uma=countAppearTop(ctx.umaRank||[],h,6);
    if(!h)return{level:'判定不可',h:null,reasons:['単勝1番人気なし'],risk:0};
    if(uma<2)reasons.push('馬連上位6件の接続が弱い');
    if(tri<4)reasons.push('三連複上位10件の登場が少ない');
    if(wallMedian.overall[0]&&wallMedian.overall[0].h!==h&&wallMedian.overall[0].count>=2)reasons.push('壁内中央値の中心が別馬');
    if(win5.selected[0]&&win5.selected[0].h!==h)reasons.push('勝ち切り候補1位が別馬');
    if(lock.top.length===4&&lock.top[3].h===h)reasons.push('上位4頭内で総合順位が最下位');
    var risk=reasons.length,level=risk>=3?'低下・頭固定注意':(risk===2?'注意':risk===1?'やや注意':'維持');
    return{level:level,h:h,reasons:reasons,risk:risk,tri:tri,uma:uma};
  }
  function buildFuku15Pattern(ctx,matchan,lock){
    var hole=(matchan&&matchan.holes&&matchan.holes[0])?String(matchan.holes[0].h):null;
    var top4=(lock.top||[]).map(function(x){return x.h;});
    if(top4.length<4){
      top4=[];
      ((matchan||{}).anchors||[]).slice(0,4).forEach(function(x){uniquePush(top4,x.h);});
    }
    var tri=[];
    if(hole&&top4.length>=3){
      for(var i=0;i<top4.length;i++)for(var j=i+1;j<top4.length;j++){
        var k=triKey(hole,top4[i],top4[j]);
        if(tri.indexOf(k)<0)tri.push(k);
      }
    }
    return{on:!!(hole&&top4.length>=3),hole:hole,top4:top4,tri:tri.slice(0,6)};

  function buildObservation(ctx,matchan){
    if(!matchan||matchan.count!==0)return[];
    var tfMap={};(ctx.tanRank||[]).forEach(function(x){tfMap[String(x.h)]=x;});
    return (matchan.holes||[]).filter(function(x){
      var tf=tfMap[String(x.h)]||{},rs=(x.reasons||[]).join('・');
      return num(x.score)>=25&&num(tf.tan)>=30&&(x.reasons||[]).length>=3&&/ワイド接続|ワイド上位支持/.test(rs);
    }).slice(0,2).map(function(x){

  function detectV247(ctx,scored,adv,matchan){

  window.scoreAll=function(data,ctx){
    var scored=V246_scoreAll(data,ctx);
    (scored||[]).forEach(function(x){
      var f15=(x.reasons||[]).filter(function(r){return /複勝15倍|15倍断層/.test(String(r));}).length;
      var penalty=0;
      if(f15>2)penalty=Math.min(16,(f15-2)*4);
      x.v247FamilyPenalty=penalty;
      if(penalty>0){
        x.score=Math.max(0,num(x.score)-penalty);
        x.reasons.push('同系統加点上限補正-'+penalty);
      }
      var tri10=countAppearTop((ctx&&ctx.sanRank)||[],x.h,10);
      x.v247TriTop10=tri10;
      if(num(x.score)>=55&&tri10===0){
        x.score=Math.max(0,num(x.score)-12);
        x.v247ZeroSupport=true;
        x.reasons.push('三連複上位支持0回・本線降格');
      }else{x.v247ZeroSupport=false;}
    });
    scored.sort(function(a,b){
      if(num(b.score)!==num(a.score))return num(b.score)-num(a.score);
      if(num(b.v247TriTop10)!==num(a.v247TriTop10))return num(b.v247TriTop10)-num(a.v247TriTop10);
      return num(a.tan)-num(b.tan);
    });
    return scored;
  };

  function containsHorse(key,set){

  function top4TriKeys(top){
    var h=(top||[]).map(function(x){return x.h;}),out=[];
    if(h.length<4)return out;
    for(var i=0;i<h.length;i++)for(var j=i+1;j<h.length;j++)for(var k=j+1;k<h.length;k++)addUnique(out,triKey(h[i],h[j],h[k]));
    return out;
  }

  window.makeTickets=function(ctx,ms,scored,sw,adv){
    var t=V246_makeTickets(ctx,ms,scored,sw,adv);
    var matchan=window.detectMatchanOdds?window.detectMatchanOdds({},ctx):null;
    var v=detectV247(ctx,scored,adv,matchan);

    var zeroSet={};v.zeroSupport.forEach(function(x){zeroSet[String(x.h)]=1;});
    if(t.main&&Object.keys(zeroSet).length){
      var kept=[],moved=[];
      t.main.forEach(function(k){if(containsHorse(k,zeroSet))moved.push(k);else kept.push(k);});
      t.main=kept;
      t.hole=t.hole||[];
      moved.forEach(function(k){addUnique(t.hole,k);});
    }
    if(t.wildBox&&t.wildBox.on&&t.wildBox.horses){
      t.wildBox.horses=t.wildBox.horses.slice().sort(function(a,b){return (zeroSet[String(a)]?1:0)-(zeroSet[String(b)]?1:0);});
      t.wildBox.roles=t.wildBox.roles||{};

  function addH(arr,h){
    h=String(h||'');
    if(h&&h!=='undefined'&&arr.indexOf(h)<0)arr.push(h);
  }
  function uniqueH(arr){
    var out=[];
    (arr||[]).forEach(function(h){addH(out,h);});
    return out;
  }
  function medianH(list){
    list=(list||[]).map(String);
    if(!list.length)return[];
    var n=list.length;
    if(n%2)return[list[Math.floor(n/2)]];
    return[list[n/2-1],list[n/2]];
  }
  function tfOf(ctx,h){
    h=String(h||'');
    var row=(ctx.tanRank||[]).filter(function(x){return String(x.h)===h;})[0];
    return row||{h:h,tan:9999,fuku:9999};
  }
  function tanRankOf(ctx,h){
    h=String(h||'');
    for(var i=0;i<(ctx.tanRank||[]).length;i++)if(String(ctx.tanRank[i].h)===h)return i+1;
    return 99;
  }
  function scoredOf(scored,h){
    h=String(h||'');

  }
  function medianUnder(rank,field,limit,excludeExactlyTwo){
    var list=(rank||[]).filter(function(x){return Number(x[field])<=limit;}).map(function(x){return String(x.h);});
    if(excludeExactlyTwo&&list.length===2)return[];
    return medianH(list);
  }
  function fuku15to6Median(ctx){
    var r=ctx.fukuRank||[];
    var i6=[],i15=[];

      if(Number(x.fuku)<=6)i6.push(i);
      if(Number(x.fuku)<=15)i15.push(i);
    });
    if(i6.length<2||i15.length<2)return[];
    var start=i6[i6.length-2];
    var end=i15[i15.length-1];
    if(end<start)return[];
    return medianH(r.slice(start,end+1).map(function(x){return String(x.h);}));
  }
  function orderedUnion(groups){
    var out=[];
    (groups||[]).forEach(function(g){(g||[]).forEach(function(h){addH(out,h);});});
    return out;
  }
  function horseText(arr){
    return(arr&&arr.length)?arr.map(function(h){return h+'番';}).join('・'):'なし';

  function pairText(a,b){return String(a)+'-'+String(b);}
  function triText(a,b,c){
    return[String(a),String(b),String(c)].sort(function(x,y){return Number(x)-Number(y);}).join('-');
  }
  function pushUnique(arr,key){if(key&&arr.indexOf(key)<0)arr.push(key);}
  function chooseAlternativeAxis(ctx,ms,scored,v,avoid){
    var c=[];

      h=String(h||'');

      c.push({h:h,source:source});

    if(ms&&ms.top)push(ms.top.h,'既存のまっちゃん単勝本線');
    (((v||{}).win5||{}).selected||[]).forEach(function(x){push(x.h,'WIN5式・勝ち切り候補');});
    push(ctx.fav1,'単勝1番人気');
    push(ctx.fav2,'単勝2番人気');
    (scored||[]).slice(0,6).forEach(function(x){push(x.h,'総合候補上位');});
    return c[0]||null;
  }
  function partnerPool(ctx,scored,v,axis,protect){
    var out=[];
    function push(h){
      h=String(h||'');
      if(!h||h===String(axis))return;
      addH(out,h);
    }
    push(ctx.fav1);push(ctx.fav2);push(ctx.fav3);

    (ctx.umaRow||[]).slice(0,10).forEach(push);
    (scored||[]).slice(0,8).forEach(function(x){push(x.h);});
    if(protect){
      out=out.filter(function(h){return h!==String(protect);});
      out.splice(Math.min(3,out.length),0,String(protect));
    }
    return uniqueH(out).slice(0,5);
  }
  function headAssessment(ctx,scored,adv,v,branch,axis){
    var grade='C',score=0,reasons=[];
    if(!axis)return{grade:'C',on:false,score:0,reasons:['構造軸未確定']};
    var tf=tfOf(ctx,axis),rank=tanRankOf(ctx,axis),sobj=scoredOf(scored,axis);
    var ff=adv&&adv.falseFavorite?adv.falseFavorite:null;
    var favLow=!!(v&&v.favorite&&String(v.favorite.level||'').indexOf('低下')>=0);

    if(branch==='NO_COMMON'){
      score+=2;reasons.push('重複なし型・1番人気軸');
      if(Number(tf.tan)<=4){score+=2;reasons.push('単勝4倍以内');}
      else if(Number(tf.tan)<=6){score+=1;reasons.push('単勝6倍以内');}
      if(!favLow){score+=1;reasons.push('1番人気信頼度低下なし');}
      if(!(ff&&ff.on)){score+=1;reasons.push('偽本命上書きなし');}
      if(triSupport>=4){score+=1;reasons.push('三連複上位支持'+triSupport+'回');}
    }else if(branch==='TWO_COMMON'){
      score+=2;reasons.push('重複2頭型・内側軸');
      if(Number(tf.tan)<10){score+=2;reasons.push('単勝10倍未満');}
      else if(Number(tf.tan)<=15){score+=1;reasons.push('単勝15倍以内');}
      if(rank<=3){score+=1;reasons.push('単勝上位3位以内');}
      if(win5Hit){score+=1;reasons.push('WIN5式勝ち切り候補');}
      if(triSupport>=3){score+=1;reasons.push('三連複上位支持'+triSupport+'回');}
      if(ff&&ff.on&&String(axis)===String(ctx.fav1)){score-=2;reasons.push('偽本命上書きで減点');}

  function buildAxisTickets(ctx,scored,v,branch,axis,protect,head){
    var res={wide:[],uma:[],tri:[],umatan:[],sanrentan:[],partners:[]};
    if(!axis)return res;
    var partners=partnerPool(ctx,scored,v,axis,protect);
    res.partners=partners;
    partners.slice(0,3).forEach(function(h){
      pushUnique(res.wide,pairText(axis,h));
      pushUnique(res.uma,pairText(axis,h));
    });
    for(var i=0;i<Math.min(4,partners.length);i++){
      for(var j=i+1;j<Math.min(4,partners.length);j++){
        pushUnique(res.tri,triText(axis,partners[i],partners[j]));
        if(res.tri.length>=6)break;
      }
      if(res.tri.length>=6)break;
    }
    if(head&&head.on){
      var second=partners.filter(function(h){return branch!=='TWO_COMMON'||String(h)!==String(protect);}).slice(0,3);
      second.forEach(function(h){pushUnique(res.umatan,String(axis)+'→'+String(h));});
      var third=partners.slice(0,4);
      second.forEach(function(s){
        third.forEach(function(t){
          if(String(s)!==String(t)&&res.sanrentan.length<6)pushUnique(res.sanrentan,String(axis)+'→'+String(s)+'→'+String(t));
        });
      });
    }
    return res;
  }
  function buildMatchanAxis(ctx,ms,scored,adv,v){
    var tan20=medianUnder(ctx.tanRank,'tan',20,false);

    var fuku156=fuku15to6Median(ctx);

    var fukuSet=orderedUnion([fuku156,fuku12,fuku6]);
    var common=tanSet.filter(function(h){return fukuSet.indexOf(h)>=0;});
    common=uniqueH(common).sort(function(a,b){return Number(tfOf(ctx,a).tan)-Number(tfOf(ctx,b).tan);});

    var branch='MANY_COMMON',label='重複3頭以上・判定保留',axis=null,protect=null,avoid=null,axisSource='なし',stat='データ不足・買い目連動なし';
    if(common.length===0){
      branch='NO_COMMON';label='重複なし・1番人気軸型';axis=String(ctx.fav1||'');axisSource='単勝1番人気';stat='今回の検証：10例中7例で1番人気が1着（70.0%）';
    }else if(common.length===1){
      branch='ONE_COMMON';label='単独重複・軸回避型';avoid=common[0];

      stat='今回の検証：38例中1着4回・3着内15回。単独重複馬は軸にしない';
    }else if(common.length===2){
      branch='TWO_COMMON';label='重複2頭・内側軸型';axis=common[0];protect=common[1];axisSource='単勝オッズが低い内側重複馬';stat='今回の検証：16例で内側1着8回・3着内12回。重複2頭ワンツーは0回';
    }

    var head=headAssessment(ctx,scored,adv,v,branch,axis);
    if(branch==='ONE_COMMON')head={grade:'C',on:false,score:0,reasons:['単独重複馬は頭固定をしない']};
    if(branch==='MANY_COMMON')head={grade:'C',on:false,score:0,reasons:['3頭以上はデータ不足']};
    var tickets=buildAxisTickets(ctx,scored,v,branch,axis,protect,head);

    return{
      medians:{tan20:tan20,tan10:tan10,fuku156:fuku156,fuku12:fuku12,fuku6:fuku6},
      tanSet:tanSet,fukuSet:fukuSet,common:common,count:common.length,
      branch:branch,label:label,axis:axis,protect:protect,avoid:avoid,axisSource:axisSource,stat:stat,

  function gradeClass(g){return g==='A'?'axisA':(g==='B'?'axisB':'axisC');}

  function renderPseudoCompi(p){if(!p||!p.available)return '';var top=p.top||{},base=p.base||{},diff=p.diff,c1near=top.index===81,c2near=base.available&&base.rank===10,c3near=diff===15;var rows=p.ranked.map(function(x){var width=clamp((x.index-40)/50*100,2,100);return '<div class="pseudoCompiRow"><div class="pseudoCompiRank">'+x.rank+'位</div><div class="pseudoCompiHorse">'+x.h+'番</div><div class="pseudoCompiIndex">'+x.index+'</div><div><div class="pseudoCompiBar"><span style="width:'+width+'%"></span></div><div class="pseudoCompiSupport">市場支持 '+pct(x.support)+'</div></div></div>';}).join('');var active=p.active.map(function(x){return x.key+Math.round(x.w*100)+'%';}).join('・');var baseText=base.available?(base.value+'P＝'+base.rank+'位 '+base.horses.map(function(h){return h+'番';}).join('・')):'46〜40P該当なし';return '<div class="card pseudoCompiCard"><div class="pseudoCompiTitle">📊V2.50 オッズ版・擬似コンピ＋大谷式荒れ計測</div><div class="pseudoCompiLead">本物の日刊コンピ指数ではなく、単勝・複勝・馬連・ワイド・三連複の逆数支持を合成した検証指数です。既存の診断・候補・買い目は変更しません。</div><div class="pseudoCompiJudge '+p.judgeClass+'">判定：'+p.judge+'</div>'+(p.tooWild?'<div class="pseudoCompiAlert">⚠️1位指数69以下：荒れすぎ・軸不安注意。大谷式では人気が割れすぎる別警戒ゾーン。</div>':'')+'<div class="pseudoCompiConditions"><div class="pseudoCompiCond '+condClass(p.c1,c1near)+'"><div class="pseudoCompiCondName">条件① 1位指数</div><div class="pseudoCompiCondValue">'+top.index+'P</div><div class="pseudoCompiCondNote">80以下で合格'+(c1near?'／81は準大穴境界':'')+'</div></div><div class="pseudoCompiCond '+condClass(p.c2,c2near)+'"><div class="pseudoCompiCondName">条件② 基準指数順位</div><div class="pseudoCompiCondValue">'+baseText+'</div><div class="pseudoCompiCondNote">46P不在時は45→44…を採用。11位以下で合格'+(c2near?'／10位は準大穴境界':'')+'</div></div><div class="pseudoCompiCond '+condClass(p.c3,c3near)+'"><div class="pseudoCompiCondName">条件③ 1位－3位差</div><div class="pseudoCompiCondValue">'+(diff===null?'算出不可':diff+'P')+'</div><div class="pseudoCompiCondNote">14以下で合格。15以上は上位集中'+(c3near?'／15は境界注意':'')+'</div></div></div><div class="small <script>
(function(){
  'use strict';

  var V250_buildPseudoCompi = window.buildPseudoCompi;
  var V250_makeCopyText = window.makeCopyText;
  var V250_run = window.run;

  document.title = 'チャッピー神予想 競馬 V2.51 推定コンピ順位補正版';
  var heading = document.querySelector('h1');
  if(heading){
    heading.innerHTML =
      'チャッピー神予想 競馬 V2.51<br>'+
      '📊推定コンピ順位補正版＋大谷式荒れ計測<br>'+
      '5市場の順位合意・同点帯終端順位・欠損市場を補正';
  }

  function n(v,d){v=Number(v);return isFinite(v)?v:(d===0?0:(d||0));}
  function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}
  function pct(v){return (n(v)*100).toFixed(1)+'%';}
  function addOnce(arr,v){v=String(v||'');if(v&&arr.indexOf(v)<0)arr.push(v);}

  function directOrder(rows,field){
    return (rows||[]).filter(function(x){return n(x&&x[field])>0;}).slice().sort(function(a,b){
      return n(a[field])-n(b[field])||Number(a.h)-Number(b.h);
    }).map(function(x){return String(x.h);});
  }

  function connectedOrder(rows,size){
    var list=(rows||[]).filter(function(x){return n(x&&x.od)>0;}).slice().sort(function(a,b){return n(a.od)-n(b.od);});
    var seen={},out=[];
    list.forEach(function(x){
      var hs=size===3?[x.a,x.b,x.c]:[x.a,x.b];
      hs.forEach(function(h){h=String(h||'');if(h&&!seen[h]){seen[h]=1;out.push(h);}});
    });
    return out;
  }

  function rankMap(order,N){
    var m={};(order||[]).forEach(function(h,i){m[String(h)]=i+1;});
    return {map:m,missing:N+2};
  }

  function percentile(rank,N){
    if(N<=1)return 1;
    rank=clamp(n(rank,N+2),1,N+2);
    return clamp(1-(rank-1)/(N+1),0,1);
  }

  function buildConsensus(data,horses){
    var N=horses.length;
    var markets=[
      {key:'単勝',weight:.30,order:directOrder(data.tanfuku,'tan')},
      {key:'複勝',weight:.20,order:directOrder(data.tanfuku,'fuku')},
      {key:'馬連',weight:.20,order:connectedOrder(data.umaren,2)},
      {key:'ワイド',weight:.10,order:connectedOrder(data.wide,2)},
      {key:'三連複',weight:.20,order:connectedOrder(data.sanpuku,3)}
    ].filter(function(x){return x.order.length;});
    var totalW=markets.reduce(function(s,x){return s+x.weight;},0)||1;
    markets.forEach(function(x){x.weight=x.weight/totalW;x.rank=rankMap(x.order,N);});

    var rows=horses.map(function(h){
      var score=0,coverage=0,topZone=0,bottomZone=0,ranks={};
      markets.forEach(function(m){
        var r=m.rank.map.hasOwnProperty(h)?m.rank.map[h]:m.rank.missing;
        ranks[m.key]=r;
        if(r<=N){coverage++;score+=m.weight*percentile(r,N);}
        else score+=m.weight*0;
        if(r<=Math.max(3,Math.ceil(N*.25)))topZone++;
        if(r>=Math.max(7,Math.ceil(N*.70))&&r<=N)bottomZone++;
      });
      return {h:h,score:score,coverage:coverage,topZone:topZone,bottomZone:bottomZone,ranks:ranks};
    });
    rows.sort(function(a,b){return b.score-a.score||b.coverage-a.coverage||Number(a.h)-Number(b.h);});
    rows.forEach(function(x,i){x.rank=i+1;});
    return {rows:rows,markets:markets};
  }

  function correctedBaseBand(ranked){
    var chosen=null;
    for(var target=46;target>=40;target--){
      var group=ranked.filter(function(x){return x.index===target;});
      if(group.length){chosen={value:target,group:group};break;}
    }
    if(!chosen){
      var eligible=ranked.filter(function(x){return x.index<=46;});
      if(eligible.length){
        var best=Math.max.apply(null,eligible.map(function(x){return x.index;}));
        chosen={value:best,group:ranked.filter(function(x){return x.index===best;})};
      }
    }
    if(!chosen)return {available:false,value:null,rank:null,rankStart:null,rankEnd:null,horses:[]};
    var positions=chosen.group.map(function(x){return x.rank;});
    return {
      available:true,value:chosen.value,
      rankStart:Math.min.apply(null,positions),rankEnd:Math.max.apply(null,positions),
      rank:Math.max.apply(null,positions),
      horses:chosen.group.map(function(x){return x.h;})
    };
  }

  function buildPseudoCompi251(data){
    var base=V250_buildPseudoCompi?V250_buildPseudoCompi(data):null;
    if(!base||!base.available)return base||{available:false,reason:'擬似コンピを算出できません',ranked:[]};

    var horses=(data.tanfuku||[]).map(function(x){return String(x.h);}),u=[];
    horses.forEach(function(h){addOnce(u,h);});horses=u;
    var N=horses.length;
    var consensus=buildConsensus(data,horses);
    var cMap={};consensus.rows.forEach(function(x){cMap[x.h]=x;});
    var baseMap={};base.ranked.forEach(function(x){baseMap[x.h]=x;});

    var corrected=horses.map(function(h){
      var b=baseMap[h]||{rank:N,index:40,support:0};
      var c=cMap[h]||{rank:N,score:0,coverage:0,topZone:0,bottomZone:0,ranks:{}};
      var shift=n(b.rank,N)-n(c.rank,N); /* ＋なら市場順位合意が上 */
      var correction=Math.round(clamp(shift,-5,5)*.9);
      if(c.topZone>=3)correction+=1;
      if(c.bottomZone>=3)correction-=1;
      if(c.coverage<=2)correction-=1;
      correction=clamp(correction,-5,5);
      var idx=Math.round(clamp(n(b.index,40)+correction,40,90));
      return {
        h:h,index:idx,baseIndex:n(b.index,40),baseRank:n(b.rank,N),support:n(b.support),
        consensusRank:n(c.rank,N),consensusScore:n(c.score),coverage:n(c.coverage),
        topZone:n(c.topZone),bottomZone:n(c.bottomZone),correction:correction,ranks:c.ranks||{}
      };
    });

    corrected.sort(function(a,b){
      return b.index-a.index||a.consensusRank-b.consensusRank||b.support-a.support||Number(a.h)-Number(b.h);
    });

    /* 指数が逆転しないよう単調性を保ち、順位は合意スコアで厳密に決める。 */
    corrected.forEach(function(x,i){
      if(i>0&&x.index>corrected[i-1].index)x.index=corrected[i-1].index;
      x.rank=i+1;
      x.move=x.baseRank-x.rank;
    });

    var top=corrected[0]||null,third=corrected[2]||null;
    var diff=top&&third?top.index-third.index:null;
    var band=correctedBaseBand(corrected);
    var eligible=N>=14;
    var c1=!!(top&&top.index<=80);
    /* 同点帯の先頭ではなく終端順位を採用し、裾の深さを過小評価しない。 */
    var c2=!!(band.available&&band.rankEnd>=11);
    var c3=diff!==null&&diff<=14;
    var big=eligible&&c1&&c2&&c3;
    var semi=eligible&&!big&&(
      (top&&top.index===81&&c2&&c3)||
      (c1&&band.available&&band.rankEnd===10&&c3)
    );
    var tooWild=!!(top&&top.index<=69);
    var judge='条件外',judgeClass='out',reasons=[];
    if(!eligible){judge='少頭数・大谷式対象外';reasons.push('14頭立て以上が最低条件');}
    else if(big){judge='大穴型レース';judgeClass='big';reasons.push('順位補正後に3条件すべてクリア');}
    else if(semi){judge='準大穴型レース';judgeClass='semi';reasons.push('順位補正後、境界を1ポイントまたは1順位だけ外す');}
    else{
      judgeClass='normal';
      if(top&&top.index>81)reasons.push('1位指数が高く本命寄り');
      if(band.available&&band.rankEnd<10)reasons.push('基準指数帯の終端順位が浅い');
      if(diff!==null&&diff>=15)reasons.push('1位と3位の差が15以上で上位集中');
      if(!band.available)reasons.push('46〜40ポイントの基準指数帯なし');
      if(!reasons.length)reasons.push('大穴型の3条件に届かず');
    }

    return {
      available:true,N:N,ranked:corrected,top:top,third:third,diff:diff,base:band,
      eligible:eligible,c1:c1,c2:c2,c3:c3,big:big,semi:semi,tooWild:tooWild,
      judge:judge,judgeClass:judgeClass,reasons:reasons,markets:consensus.markets,
      baseVersion:base
    };
  }

  function condClass(ok,near){return ok?'ok':(near?'near':'ng');}
  function moveClass(v){return v>0?'pseudoCompi251Up':(v<0?'pseudoCompi251Down':'pseudoCompi251Stay');}
  function moveText(v){return v>0?('↑'+v):v<0?('↓'+Math.abs(v)):'→0';}

  function renderPseudoCompi251(p){
    if(!p||!p.available)return'';
    var top=p.top||{},base=p.base||{},diff=p.diff;
    var c1near=top.index===81,c2near=base.available&&base.rankEnd===10,c3near=diff===15;
    var rows=p.ranked.map(function(x){
      var width=clamp((x.index-40)/50*100,2,100);
      var corr=x.correction>0?('+'+x.correction):String(x.correction);
      return '<div class="pseudoCompi251Row">'+
        '<div class="pseudoCompi251Rank">'+x.rank+'位</div>'+
        '<div class="pseudoCompi251Horse">'+x.h+'番</div>'+
        '<div class="pseudoCompi251Index">'+x.index+'</div>'+
        '<div><div class="pseudoCompi251Move"><span class="'+moveClass(x.move)+'">旧'+x.baseRank+'位→新'+x.rank+'位 '+moveText(x.move)+'</span> / 旧'+x.baseIndex+'P / 補正'+corr+'P / 市場合意'+x.consensusRank+'位 / '+x.coverage+'市場</div><div class="pseudoCompi251Bar"><span style="width:'+width+'%"></span></div></div>'+
      '</div>';
    }).join('');
    var baseText=base.available?(base.value+'P＝'+base.rankStart+'〜'+base.rankEnd+'位 '+base.horses.map(function(h){return h+'番';}).join('・')):'46〜40P該当なし';
    var marketText=(p.markets||[]).map(function(x){return x.key+Math.round(x.weight*100)+'%';}).join('・');
    return '<div class="card pseudoCompi251Card">'+
      '<div class="pseudoCompi251Title">📊V2.51 推定コンピ順位補正版＋大谷式荒れ計測</div>'+
      '<div class="pseudoCompi251Lead">V2.50の逆数支持指数に、単勝・複勝・馬連・ワイド・三連複の馬別順位合意を重ねて順位を補正します。本物の日刊コンピ指数ではなく、締切前オッズを同じ時点で比較する検証指数です。</div>'+
      '<div class="pseudoCompi251Judge '+p.judgeClass+'">判定：'+p.judge+'</div>'+
      (p.tooWild?'<div class="pseudoCompi251Alert">⚠️1位指数69以下：人気が割れすぎる別警戒ゾーン。軸固定を弱めてください。</div>':'')+
      '<div class="pseudoCompi251Rules">順位補正：旧支持順位と5市場の合意順位の差を最大±5Pで反映。3市場以上で上位なら＋1P、3市場以上で下位なら－1P、2市場以下しか確認できない馬は－1P。基準指数は同点帯の最初ではなく<b>終端順位</b>で判定します。</div>'+
      '<div class="pseudoCompi251Conditions">'+
        '<div class="pseudoCompi251Cond '+condClass(p.c1,c1near)+'"><div class="pseudoCompi251CondName">条件① 補正後1位指数</div><div class="pseudoCompi251CondValue">'+top.index+'P</div><div class="pseudoCompi251CondNote">80以下で合格'+(c1near?'／81は準大穴境界':'')+'</div></div>'+
        '<div class="pseudoCompi251Cond '+condClass(p.c2,c2near)+'"><div class="pseudoCompi251CondName">条件② 基準指数帯の終端順位</div><div class="pseudoCompi251CondValue">'+baseText+'</div><div class="pseudoCompi251CondNote">46P不在時は45→44…を採用。同点帯の終端が11位以下で合格'+(c2near?'／10位は準大穴境界':'')+'</div></div>'+
        '<div class="pseudoCompi251Cond '+condClass(p.c3,c3near)+'"><div class="pseudoCompi251CondName">条件③ 補正後1位－3位差</div><div class="pseudoCompi251CondValue">'+(diff===null?'算出不可':diff+'P')+'</div><div class="pseudoCompi251CondNote">14以下で合格。15以上は上位集中'+(c3near?'／15は境界注意':'')+'</div></div>'+
      '</div>'+
      '<div class="small">出走'+p.N+'頭｜'+p.reasons.join(' / ')+'</div>'+
      '<div class="pseudoCompi251Ranks">'+rows+'</div>'+
      '<div class="pseudoCompi251Foot">市場比率：'+marketText+'。矢印はV2.50支持順位からの推定順位移動です。補正幅を限定しているため、1券種だけの極端な並びで全順位が反転しない設計です。</div>'+
    '</div>';
  }

  function copyPseudoCompi251(p){
    if(!p||!p.available)return'';
    var b=p.base||{};
    var baseText=b.available?(b.value+'P / '+b.rankStart+'〜'+b.rankEnd+'位 / '+b.horses.map(function(h){return h+'番';}).join('・')):'該当なし';
    return '\n\n📊V2.51 推定コンピ順位補正版＋大谷式荒れ計測\n'+
      '※本物の日刊コンピ指数ではなく、オッズ支持＋5市場順位合意から作る独立検証指数\n'+
      '補正ルール：旧支持順位と市場合意順位の差を最大±5P / 上位3市場以上＋1P / 下位3市場以上－1P / 確認2市場以下－1P\n'+
      '出走頭数：'+p.N+'頭'+(p.eligible?' / 14頭以上・判定対象':' / 少頭数・判定対象外')+'\n'+
      '推定コンピ順位\n'+p.ranked.map(function(x){
        var corr=x.correction>0?('+'+x.correction):String(x.correction);
        return x.rank+'位 '+x.h+'番 '+x.index+'P / 旧'+x.baseRank+'位→新'+x.rank+'位 '+moveText(x.move)+' / 旧'+x.baseIndex+'P / 補正'+corr+'P / 市場合意'+x.consensusRank+'位 / '+x.coverage+'市場';
      }).join('\n')+'\n'+
      '条件① 補正後1位指数：'+p.top.index+'P / '+(p.c1?'合格':'不合格')+'\n'+
      '条件② 基準指数帯終端順位：'+baseText+' / '+(p.c2?'合格':'不合格')+'\n'+
      '条件③ 補正後1位－3位差：'+p.diff+'P / '+(p.c3?'合格':'不合格')+'\n'+
      '判定：'+p.judge+(p.tooWild?' / 1位69以下・荒れすぎ注意':'')+'\n'+
      '理由：'+p.reasons.join(' / ')+'\n';
  }

  window.makeCopyText=function(data,diag,ctx,ms,sw,tickets,scored,moves,adv){
    var s=V250_makeCopyText(data,diag,ctx,ms,sw,tickets,scored,moves,adv);
    s=s.replace(/\n\n📊V2\.50 オッズ版・擬似コンピ＋大谷式荒れ計測[\s\S]*$/,'');
    s=s.replace(/V2\.50/g,'V2.51');
    var p=buildPseudoCompi251(data);
    window.__pseudoCompi251Latest=p;
    return s+copyPseudoCompi251(p);
  };

  window.run=function(){
    V250_run();
    try{
      var data=parseData(document.getElementById('input').value);
      var p=window.__pseudoCompi251Latest||buildPseudoCompi251(data);
      window.__pseudoCompi251Latest=p;
      var out=document.getElementById('out');
      if(out){
        var old50=out.querySelector('.pseudoCompiCard');
        if(old50&&old50.parentNode)old50.parentNode.removeChild(old50);
        var old51=out.querySelector('.pseudoCompi251Card');
        if(old51&&old51.parentNode)old51.parentNode.removeChild(old51);
        var finalCard=out.querySelector('.finalFourCard');
        if(finalCard)finalCard.insertAdjacentHTML('beforebegin',renderPseudoCompi251(p));
        else out.insertAdjacentHTML('beforeend',renderPseudoCompi251(p));
        out.innerHTML=out.innerHTML.replace(/V2\.50/g,'V2.51');
      }
      if(typeof latestCopyText==='string')latestCopyText=latestCopyText.replace(/V2\.50/g,'V2.51');
    }catch(e){
      var out2=document.getElementById('out');
      if(out2)out2.insertAdjacentHTML('beforeend','<div class="card"><div class="title warn">V2.51順位補正エラー</div><pre>'+String(e&&e.message?e.message:e)+'</pre></div>');
    }
  };

  window.buildPseudoCompi251=buildPseudoCompi251;
  window.buildPseudoCompi=buildPseudoCompi251;
})();
</script>
