<body>

<h1>チャッピー神予想 V1<br>メジアン×大谷式・消しフィルター</h1>

<textarea id="input" placeholder="ここにメジアンアプリコードを貼る

例：
【函館1R】
[TANFUKU]
2 1.8 1.1
3 2.8 2.4
7 7.0 4.9

[UMAREN]
2-3 1.9
2-7 4.9

[WIDE]
2-3 1.2-1.4
2-7 1.7-2.3

[SANPUKU]
2-3-7 3.4"></textarea>

<br>
<button class="go" onclick="run()">診断する</button>
<button class="clear" onclick="document.getElementById('input').value='';document.getElementById('out').innerHTML=''">クリア</button>
<button class="sample" onclick="loadSample()">サンプル</button>

<div id="out"></div>

<script>
function zenToHan(str){
  return String(str)
    .replace(/[０-９]/g,s=>String.fromCharCode(s.charCodeAt(0)-0xFEE0))
    .replace(/[．]/g,'.')
    .replace(/[－ー―−]/g,'-')
    .replace(/[　]/g,' ')
    .replace(/[〜～]/g,'-');
}

function nums(line){
  const m = zenToHan(line).match(/\d+(?:\.\d+)?/g);
  return m ? m.map(Number) : [];
}

function parseOddsFromTail(line){
  const n = nums(line);
  if(!n.length) return null;
  return n[n.length-1];
}

function parseInput(raw){
  const text = zenToHan(raw);
  const lines = text.split(/\n/).map(x=>x.trim()).filter(Boolean);

  let title = "レース";
  let sec = "";
  const tanfuku = [];
  const umaren = [];
  const wide = [];
  const sanpuku = [];

  for(const line of lines){
    if(line.startsWith("【")) title = line;
    if(/^\[TANFUKU\]/i.test(line)){sec="TANFUKU";continue;}
    if(/^\[UMAREN\]/i.test(line)){sec="UMAREN";continue;}
    if(/^\[WIDE\]/i.test(line)){sec="WIDE";continue;}
    if(/^\[SANPUKU\]/i.test(line)){sec="SANPUKU";continue;}

    if(sec==="TANFUKU"){
      const n = nums(line);
      if(n.length>=3){
        tanfuku.push({
          h:String(Math.trunc(n[0])),
          tan:n[1],
          fuku:n[n.length-1]
        });
      }
    }

    if(sec==="UMAREN"){
      const m = line.match(/(\d+)\s*-\s*(\d+)/);
      const o = parseOddsFromTail(line);
      if(m && o){
        umaren.push({a:m[1],b:m[2],od:o,key:m[1]+"-"+m[2]});
      }
    }

    if(sec==="WIDE"){
      const m = line.match(/(\d+)\s*-\s*(\d+)/);
      const o = parseOddsFromTail(line);
      if(m && o){
        wide.push({a:m[1],b:m[2],od:o,key:m[1]+"-"+m[2]});
      }
    }

    if(sec==="SANPUKU"){
      const m = line.match(/(\d+)\s*-\s*(\d+)\s*-\s*(\d+)/);
      const o = parseOddsFromTail(line);
      if(m && o){
        sanpuku.push({a:m[1],b:m[2],c:m[3],od:o,key:m[1]+"-"+m[2]+"-"+m[3]});
      }
    }
  }

  return {title,tanfuku,umaren,wide,sanpuku};
}

function sortByOd(arr){
  return [...arr].sort((x,y)=>x.od-y.od);
}

function sortTanfuku(arr,key){
  return [...arr].sort((x,y)=>x[key]-y[key]);
}

function horseList(data){
  const s = new Set();
  data.tanfuku.forEach(x=>s.add(x.h));
  data.umaren.forEach(x=>{s.add(x.a);s.add(x.b);});
  data.sanpuku.forEach(x=>{s.add(x.a);s.add(x.b);s.add(x.c);});
  return [...s].sort((a,b)=>Number(a)-Number(b));
}

function middleItems(list){
  if(!list.length) return [];
  const n = list.length;
  if(n===1) return [list[0]];
  if(n%2===1) return [list[Math.floor(n/2)]];
  return [list[n/2-1],list[n/2]];
}

function uniqueByOrder(arr){
  const s = new Set();
  const out = [];
  for(const x of arr){
    if(!s.has(x)){
      s.add(x);
      out.push(x);
    }
  }
  return out;
}

function countPairs(pairs, topN){
  const map = {};
  sortByOd(pairs).slice(0,topN).forEach((p,i)=>{
    [p.a,p.b].forEach(h=>{
      if(!map[h]) map[h]={h,count:0,best:9999,rankSum:0};
      map[h].count++;
      map[h].best=Math.min(map[h].best,p.od);
      map[h].rankSum+=i+1;
    });
  });
  return Object.values(map).sort((x,y)=>y.count-x.count || x.best-y.best || x.rankSum-y.rankSum);
}

function countTriples(triples, topN){
  const map = {};
  sortByOd(triples).slice(0,topN).forEach((p,i)=>{
    [p.a,p.b,p.c].forEach(h=>{
      if(!map[h]) map[h]={h,count:0,best:9999,rankSum:0};
      map[h].count++;
      map[h].best=Math.min(map[h].best,p.od);
      map[h].rankSum+=i+1;
    });
  });
  return Object.values(map).sort((x,y)=>y.count-x.count || x.best-y.best || x.rankSum-y.rankSum);
}

function detectWalls(sortedOdds, maxRank, ratioTh, diffTh){
  const arr = sortedOdds.slice(0,Math.min(maxRank,sortedOdds.length));
  const walls = [];
  for(let i=0;i<arr.length-1;i++){
    const now = arr[i].od ?? arr[i].tan ?? arr[i].fuku;
    const next = arr[i+1].od ?? arr[i+1].tan ?? arr[i+1].fuku;
    const ratio = now>0 ? next/now : 0;
    const diff = next-now;
    if(ratio>=ratioTh || diff>=diffTh){
      walls.push({
        beforeRank:i+1,
        afterRank:i+2,
        before:arr[i],
        after:arr[i+1],
        ratio,
        diff
      });
    }
  }
  if(!walls.length && arr.length>=2){
    let best=null;
    for(let i=0;i<arr.length-1;i++){
      const now = arr[i].od ?? arr[i].tan ?? arr[i].fuku;
      const next = arr[i+1].od ?? arr[i+1].tan ?? arr[i+1].fuku;
      const ratio = now>0 ? next/now : 0;
      const diff = next-now;
      if(!best || ratio>best.ratio){
        best={beforeRank:i+1,afterRank:i+2,before:arr[i],after:arr[i+1],ratio,diff};
      }
    }
    if(best && best.ratio>=1.28) walls.push(best);
  }
  return walls;
}

function zoneFromWalls(sortedPairs,walls){
  const top9 = sortedPairs.slice(0,Math.min(9,sortedPairs.length));
  if(!top9.length) return [];

  if(walls.length>=2){
    const s = walls[0].afterRank-1;
    const e = walls[1].beforeRank;
    const z = top9.slice(s,e);
    return z.length ? z : top9.slice(0,walls[0].beforeRank);
  }

  if(walls.length===1){
    return top9.slice(0,walls[0].beforeRank);
  }

  return top9;
}

function pairZoneHorses(pairs){
  const seq=[];
  pairs.forEach(p=>{
    seq.push(p.a);
    seq.push(p.b);
  });
  return uniqueByOrder(seq);
}

function fukuWallFront(tanfuku,limit,count=2){
  const arr = sortTanfuku(tanfuku,"fuku").filter(x=>x.fuku<=limit);
  return arr.slice(Math.max(0,arr.length-count)).map(x=>x.h);
}

function fukuWallAfter(tanfuku,limit,count=2){
  return sortTanfuku(tanfuku,"fuku").filter(x=>x.fuku>limit).slice(0,count).map(x=>x.h);
}

function tanWallFront(tanfuku,limit,count=2){
  const arr = sortTanfuku(tanfuku,"tan").filter(x=>x.tan<=limit);
  return arr.slice(Math.max(0,arr.length-count)).map(x=>x.h);
}

function hname(h){return h+"番";}

function joinH(list){
  return list && list.length ? list.map(h=>h+"番").join("・") : "なし";
}

function rankMap(list,key){
  const m={};
  list.forEach((x,i)=>{m[x.h]=i+1;});
  return m;
}

function oddsOf(tanfuku,h,key){
  const x=tanfuku.find(v=>v.h===h);
  return x ? x[key] : null;
}

function makeTable(title,rows){
  let html = '<div class="sub">'+title+'</div><div class="scroll"><table><tr>';
  Object.keys(rows[0]||{}).forEach(k=>html+='<th>'+k+'</th>');
  html+='</tr>';
  rows.forEach(r=>{
    html+='<tr>';
    Object.values(r).forEach(v=>html+='<td>'+v+'</td>');
    html+='</tr>';
  });
  html+='</table></div>';
  return html;
}

function run(){
  const data = parseInput(document.getElementById("input").value);
  const out = document.getElementById("out");

  if(!data.tanfuku.length || !data.umaren.length){
    out.innerHTML = '<div class="card warn">[TANFUKU] と [UMAREN] が必要です。</div>';
    return;
  }

  const horses = horseList(data);
  const tanRank = sortTanfuku(data.tanfuku,"tan");
  const fukuRank = sortTanfuku(data.tanfuku,"fuku");
  const umaRank = sortByOd(data.umaren);
  const wideRank = sortByOd(data.wide);
  const sanRank = sortByOd(data.sanpuku);

  const tanR = rankMap(tanRank,"tan");
  const fukuR = rankMap(fukuRank,"fuku");

  const topUmaren = umaRank[0] ? umaRank[0].od : 999;
  let raceType = "大荒れ戦";
  if(topUmaren<4) raceType = "本命戦";
  else if(topUmaren<9) raceType = "中荒れ戦";
  else if(topUmaren<15) raceType = "荒れ戦";

  const tanUnder10 = data.tanfuku.filter(x=>x.tan<10).length;
  const tanUnder30 = data.tanfuku.filter(x=>x.tan<30).length;
  const fukuUnder3 = data.tanfuku.filter(x=>x.fuku<3).length;
  const fukuUnder6 = data.tanfuku.filter(x=>x.fuku<6).length;
  const fukuUnder10 = data.tanfuku.filter(x=>x.fuku<10).length;
  const fukuUnder15 = data.tanfuku.filter(x=>x.fuku<15).length;

  const umaWalls = detectWalls(umaRank,9,1.55,8);
  const umaZonePairs = zoneFromWalls(umaRank,umaWalls);
  const umaZoneH = pairZoneHorses(umaZonePairs);
  const umaZoneMedian = middleItems(umaZoneH);

  const tanMedian = middleItems(tanRank.map(x=>x.h));
  const fukuMedian = middleItems(fukuRank.map(x=>x.h));

  const fuku3 = sortTanfuku(data.tanfuku,"fuku").filter(x=>x.fuku<3).map(x=>x.h);
  const fuku6Front = fukuWallFront(data.tanfuku,6,2);
  const fuku10Front = fukuWallFront(data.tanfuku,10,2);
  const fuku15Front = fukuWallFront(data.tanfuku,15,2);
  const fuku15After = fukuWallAfter(data.tanfuku,15,2);
  const tan80Front = tanWallFront(data.tanfuku,80,2);

  const umaCount = countPairs(data.umaren,10);
  const wideCount = countPairs(data.wide,10);
  const sanCount = countTriples(data.sanpuku,10);

  const umaCountTop = umaCount.slice(0,4).map(x=>x.h);
  const sanCountTop = sanCount.slice(0,4).map(x=>x.h);
  const honpyoMap={};
  horses.forEach(h=>honpyoMap[h]=0);
  umaCount.forEach((x,i)=>{honpyoMap[x.h]+=(10-i>0?10-i:1);});
  sanCount.forEach((x,i)=>{honpyoMap[x.h]+=(10-i>0?10-i:1);});
  const honpyo = horses.map(h=>({h,score:honpyoMap[h]})).sort((a,b)=>b.score-a.score);

  const top9Tan = tanRank.slice(0,9).map(x=>x.h);
  const top9Fuku = fukuRank.slice(0,9).map(x=>x.h);
  const top9UmaH = pairZoneHorses(umaRank.slice(0,9));
  const threeRank = horses.filter(h=>top9Tan.includes(h)&&top9Fuku.includes(h)&&top9UmaH.includes(h));

  const favoritePair = umaRank[0] ? [umaRank[0].a, umaRank[0].b] : [];
  const favScore = favoritePair.reduce((s,h)=>s+(honpyoMap[h]||0),0);
  const holeBase = uniqueByOrder([...umaZoneMedian,...fuku6Front,...fuku10Front,...fuku15Front,...tanMedian,...fukuMedian]);
  const holeScore = holeBase.filter(h=>!favoritePair.includes(h)).length * 5;

  const fakeFavorite = topUmaren<4 && holeScore > favScore*0.55 && holeBase.filter(h=>!favoritePair.includes(h)).length>=3;

  const f15Strong = fuku15Front.some(h=>{
    let c=0;
    if(umaZoneH.includes(h)) c++;
    if(umaZoneMedian.includes(h)) c++;
    if(fuku6Front.includes(h)) c++;
    if(fuku10Front.includes(h)) c++;
    if(tanMedian.includes(h)) c++;
    if(fukuMedian.includes(h)) c++;
    if(threeRank.includes(h)) c++;
    if(honpyo.slice(0,5).map(x=>x.h).includes(h)) c++;
    return c>=2;
  });

  const release15 = fakeFavorite || f15Strong || topUmaren>=9;

  const scores = {};
  horses.forEach(h=>{
    const reasons=[];
    let s=0;

    if(honpyo.slice(0,4).map(x=>x.h).includes(h)){s+=8;reasons.push("本表王上位");}
    if(threeRank.includes(h)){s+=8;reasons.push("三ランキング一致");}
    if(umaZoneH.includes(h)){s+=6;reasons.push("馬連壁内");}
    if(umaZoneMedian.includes(h)){s+=8;reasons.push("馬連ゾーンメジアン");}
    if(tanMedian.includes(h)){s+=4;reasons.push("単勝メジアン");}
    if(fukuMedian.includes(h)){s+=4;reasons.push("複勝メジアン");}
    if(fuku6Front.includes(h)){s+=6;reasons.push("複勝6倍壁前");}
    if(fuku10Front.includes(h)){s+=5;reasons.push("複勝10倍壁前");}
    if(fuku15Front.includes(h)){s+= release15 ? 7 : 2; reasons.push(release15?"複勝15倍解放":"複勝15倍参考");}
    if(fuku15After.includes(h)){s+= release15 ? 4 : 0; reasons.push(release15?"複勝15倍直後解放":"15倍直後参考");}
    if(tan80Front.includes(h)){s+=3;reasons.push("単勝80倍壁内");}
    if(umaCountTop.includes(h)){s+=5;reasons.push("馬連出現上位");}
    if(sanCountTop.includes(h)){s+=4;reasons.push("三連複出現上位");}

    const tan = oddsOf(data.tanfuku,h,"tan");
    const fuku = oddsOf(data.tanfuku,h,"fuku");

    if(tan!==null && tan>=80 && !release15){s-=4;reasons.push("単勝80倍超で弱め");}
    if(fuku!==null && fuku>15 && !release15){s-=4;reasons.push("複勝15倍外で弱め");}
    if(!umaZoneH.includes(h) && !threeRank.includes(h) && !umaCountTop.includes(h)){s-=2;reasons.push("馬連壁外寄り");}

    scores[h]={h,score:s,reasons,tan,fuku};
  });

  const ranked = Object.values(scores).sort((a,b)=>b.score-a.score);

  const axis = ranked.filter(x=>x.score>=14).slice(0,2);
  const partners = ranked.filter(x=>x.score>=9 && !axis.map(a=>a.h).includes(x.h)).slice(0,3);
  const holes = ranked.filter(x=>x.score>=7 && !axis.map(a=>a.h).includes(x.h) && !partners.map(a=>a.h).includes(x.h)).slice(0,3);

  let decision = "見送り";
  let decisionClass = "warn";
  if(axis.length && partners.length && ranked[0].score>=16){
    decision = "買う";
    decisionClass = "good";
  }else if(ranked[0] && ranked[0].score>=11){
    decision = "少額";
    decisionClass = "yellow";
  }

  let buyMode = "";
  if(decision==="見送り"){
    buyMode = "根拠が分散。無理に買わない。";
  }else if(fakeFavorite){
    buyMode = "偽本命寄り。本命固定禁止。馬連・ワイドは穴寄せ。";
  }else if(topUmaren<4){
    buyMode = "本命戦。軸＋壁一致穴を少点数。";
  }else if(topUmaren<9){
    buyMode = "中荒れ戦。馬連壁内メジアン＋複勝6倍壁前を重視。";
  }else{
    buyMode = "荒れ戦。複勝15倍解放は有効だが、重複馬だけ。";
  }

  const pickH = uniqueByOrder([...axis.map(x=>x.h),...partners.map(x=>x.h),...holes.map(x=>x.h)]).slice(0,4);

  const bets = makeBets(axis,partners,holes,umaRank,wideRank,sanRank,decision);

  let html = "";
  html += '<div class="card"><div class="title">'+data.title+'</div>';
  html += '<div>🩺 レース診断：<span class="yellow">'+raceType+'</span></div>';
  html += '<div>馬連1番人気：<span class="yellow">'+(umaRank[0]?umaRank[0].key+" "+umaRank[0].od+"倍":"なし")+'</span></div>';
  html += '<div class="small">単勝10倍未満 '+tanUnder10+'頭 ／ 単勝30倍未満 '+tanUnder30+'頭</div>';
  html += '<div class="small">複勝3倍未満 '+fukuUnder3+'頭 ／ 6倍未満 '+fukuUnder6+'頭 ／ 10倍未満 '+fukuUnder10+'頭 ／ 15倍未満 '+fukuUnder15+'頭</div>';
  html += '<hr>';
  html += '<div>🎯 結論：<span class="'+decisionClass+'" style="font-size:22px">'+decision+'</span></div>';
  html += '<div>'+buyMode+'</div>';
  html += '</div>';

  html += '<div class="card"><div class="title">🧱大谷式・馬連オッズの壁</div>';
  html += '<div>馬連9位以内の壁：'+(umaWalls.length?umaWalls.map(w=>w.beforeRank+"位→"+w.afterRank+"位").join(" / "):"明確な壁なし")+'</div>';
  html += '<div>見るゾーン：<span class="yellow">'+(umaZonePairs.length?umaZonePairs.map(p=>p.key+"("+p.od+")").join(" / "):"なし")+'</span></div>';
  html += '<div>壁内馬：'+joinH(umaZoneH)+'</div>';
  html += '<div>馬連ゾーンメジアン：<span class="good">'+joinH(umaZoneMedian)+'</span></div>';
  html += '</div>';

  html += '<div class="card"><div class="title">🧠メジアン×壁</div>';
  html += '<div>単勝メジアン：'+joinH(tanMedian)+'</div>';
  html += '<div>複勝メジアン：'+joinH(fukuMedian)+'</div>';
  html += '<div>複勝3倍未満：'+joinH(fuku3)+' '+(fuku3.length>=4?'<span class="warn">多め＝波乱注意</span>':'')+'</div>';
  html += '<div>複勝6倍壁前：<span class="yellow">'+joinH(fuku6Front)+'</span></div>';
  html += '<div>複勝10倍壁前：'+joinH(fuku10Front)+'</div>';
  html += '<div>複勝15倍壁前：'+joinH(fuku15Front)+'</div>';
  html += '<div>複勝15倍直後：'+joinH(fuku15After)+'</div>';
  html += '<div>単勝80倍壁内：'+joinH(tan80Front)+'</div>';
  html += '</div>';

  html += '<div class="card"><div class="title">🚨ランプ</div>';
  html += '<div>👑三ランキング一致：<span class="good">'+joinH(threeRank)+'</span></div>';
  html += '<div>🚨偽本命ランプ：'+(fakeFavorite?'<span class="warn">発動</span>':'非発動')+'</div>';

function makeBets(axis,partners,holes,umaRank,wideRank,sanRank,decision){
  if(decision==="見送り") return "見送り\n理由：最終候補の重なり不足。";

  const A = axis.map(x=>x.h);
  const B = partners.map(x=>x.h);
  const C = holes.map(x=>x.h);

  let lines=[];

  if(A.length){
    lines.push("◎ 軸："+A.map(h=>h+"番").join("・"));
  }
  if(B.length){
    lines.push("○ 相手："+B.map(h=>h+"番").join("・"));
  }
  if(C.length){
    lines.push("▲ 穴："+C.map(h=>h+"番").join("・"));
  }

  const wide = [];
  const uma = [];
  const tri = [];

  if(A[0] && B[0]) wide.push(sortPair(A[0],B[0]));
  if(A[0] && B[1]) wide.push(sortPair(A[0],B[1]));
  if(A[0] && C[0]) wide.push(sortPair(A[0],C[0]));

  if(A[0] && B[0]) uma.push(sortPair(A[0],B[0]));
  if(A[0] && B[1]) uma.push(sortPair(A[0],B[1]));
  if(A[1] && B[0]) uma.push(sortPair(A[1],B[0]));

  if(A[0] && B[0] && B[1]) tri.push(sortTriple(A[0],B[0],B[1]));
  if(A[0] && B[0] && C[0]) tri.push(sortTriple(A[0],B[0],C[0]));
  if(A[0] && A[1] && B[0]) tri.push(sortTriple(A[0],A[1],B[0]));

  lines.push("");
  lines.push("ワイド：");
  lines.push(uniqueByOrder(wide).slice(0,3).join("\n") || "なし");

  lines.push("");
  lines.push("馬連：");
  lines.push(uniqueByOrder(uma).slice(0,3).join("\n") || "なし");

  lines.push("");
  lines.push("三連複：");
  lines.push(uniqueByOrder(tri).slice(0,3).join("\n") || "なし");

  lines.push("");
  lines.push("※単勝は、軸候補が単勝メジアン・馬連ゾーンメジアン・三ランキング一致のどれか2つ以上なら少額。");

  return lines.join("\n");
}

function sortPair(a,b){
  return [a,b].map(Number).sort((x,y)=>x-y).join("-");
}

function sortTriple(a,b,c){
  return [a,b,c].map(Number).sort((x,y)=>x-y).join("-");
}
