<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>メジアン順位表</title>
<style>
body{
  margin:0;
  padding:16px;
  background:#07101f;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;
  font-size:18px;
}
h1{font-size:26px;color:#ffd66b}
h2{font-size:22px;color:#ffd66b;margin-top:24px}
textarea{
  width:100%;
  height:170px;
  font-size:18px;
  border-radius:10px;
  padding:10px;
  box-sizing:border-box;
}
button{
  width:100%;
  font-size:22px;
  padding:14px;
  margin:16px 0;
  border:0;
  border-radius:12px;
  background:#ffd66b;
  color:#07101f;
  font-weight:bold;
}
.box{
  border-left:6px solid #ffd66b;
  padding:12px;
  margin-top:16px;
  background:#0d1930;
  border-radius:8px;
}
.scroll{
  overflow-x:auto;
  border:1px solid #ffd66b;
  margin-top:8px;
}
table{
  border-collapse:collapse;
  min-width:900px;
  background:#fff;
  color:#111;
}
td,th{
  border:1px solid #333;
  padding:8px 12px;
  text-align:center;
  white-space:nowrap;
  font-size:18px;
}
th{
  background:#eee;
}
.med{
  background:#ffb3d1!important;
  font-weight:bold;
}
.note{
  color:#ffd66b;
  font-weight:bold;
  margin-top:10px;
}
.small{font-size:15px;color:#ccc}
</style>
</head>
<body>

<h1>まっちゃん専用 メジアン順位表</h1>

<div class="small">
入力形式：馬番 オッズ<br>
馬連だけは「2-12 14.7」の形でもOK
</div>

<h2>単勝</h2>
<textarea id="tan" placeholder="例）
4 3.0
15 6.1
10 8.5
11 8.8"></textarea>

<h2>複勝</h2>
<textarea id="fuku" placeholder="例）
16 2.3
15 2.8
10 2.9
4 2.9"></textarea>

<h2>馬連</h2>
<textarea id="umaren" placeholder="例）
4-10 10.1
4-11 13.4
4-16 17.3
4-2 17.4"></textarea>

<button onclick="run()">メジアン順位表を作る</button>

<div id="out"></div>

<script>
function parseSingle(text){
  return text.trim().split(/\n+/).map(line=>{
    const p=line.trim().split(/\s+/);
    if(p.length<2)return null;
    return {horse:p[0], odds:parseFloat(p[1])};
  }).filter(x=>x && !isNaN(x.odds)).sort((a,b)=>a.odds-b.odds);
}

function parseUmaren(text){
  return text.trim().split(/\n+/).map(line=>{
    const p=line.trim().split(/\s+/);
    if(p.length<2)return null;

    const pair=p[0];
    const odds=parseFloat(p[1]);
    if(isNaN(odds))return null;

    let horses=pair.split("-");
    let display=pair;

    return {
      horse: horses.length===2 ? horses[1] : pair,
      pair: display,
      odds: odds
    };
  }).filter(x=>x).sort((a,b)=>a.odds-b.odds);
}

function medianIndexes(n){
  if(n===0)return [];
  if(n%2===1)return [Math.floor(n/2)];
  return [n/2-1,n/2];
}

function rankTable(title, rows, type){
  if(rows.length===0)return "";

  const mids=medianIndexes(rows.length);
  const medHorses=mids.map(i=> type==="umaren" ? rows[i].pair : rows[i].horse);

  let html=`<div class="box"><h2>${title}</h2>`;
  html+=`<div class="scroll"><table>`;

  html+=`<tr><th>${title}</th>`;
  rows.forEach((r,i)=>{
    const cls=mids.includes(i)?"med":"";
    html+=`<td class="${cls}">${type==="umaren" ? r.pair : r.horse}</td>`;
  });
  html+=`</tr>`;

  html+=`<tr><th>オッズ</th>`;
  rows.forEach((r,i)=>{
    const cls=mids.includes(i)?"med":"";
    html+=`<td class="${cls}">${r.odds}</td>`;
  });
  html+=`</tr>`;

  html+=`</table></div>`;
  html+=`<div class="note">メジアン：${medHorses.join("・")}</div>`;
  html+=`</div>`;

  return html;
}

function getMedianHorses(rows,type){
  const mids=medianIndexes(rows.length);
  let list=[];
  mids.forEach(i=>{
    if(type==="umaren"){
      rows[i].pair.split("-").forEach(h=>list.push(h));
    }else{
      list.push(rows[i].horse);
    }
  });
  return list;
}

function overlapBox(tan,fuku,uma){
  const all=[
    ...getMedianHorses(tan,"single"),
    ...getMedianHorses(fuku,"single"),
    ...getMedianHorses(uma,"umaren")
  ];

  const count={};
  all.forEach(h=>count[h]=(count[h]||0)+1);

  const ranked=Object.entries(count)
    .filter(([h,c])=>c>=2)
    .sort((a,b)=>b[1]-a[1]);

  let html=`<div class="box"><h2>重複メジアン</h2>`;

  if(ranked.length===0){
    html+=`重複なし`;
  }else{
    ranked.forEach(([h,c])=>{
      html+=`<div class="note">${h}：${c}回</div>`;
    });
  }

  html+=`</div>`;
  return html;
}

function run(){
  const tan=parseSingle(document.getElementById("tan").value);
  const fuku=parseSingle(document.getElementById("fuku").value);
  const uma=parseUmaren(document.getElementById("umaren").value);

  let html="";

  html+=rankTable("馬連ランク",uma,"umaren");
  html+=rankTable("単勝ランク",tan,"single");
  html+=rankTable("複勝ランク",fuku,"single");
  html+=overlapBox(tan,fuku,uma);

  document.getElementById("out").innerHTML=html;
}
</script>

</body>
</html>
