<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>メジアン理論</title>
<style>
body{font-family:sans-serif;padding:20px;font-size:18px}
textarea{width:100%;height:220px;font-size:20px}
button{font-size:22px;padding:10px 20px;margin-top:15px}
.result{font-size:22px;margin-top:20px;line-height:1.8}
</style>
</head>
<body>

<h1>メジアン理論</h1>

<p>馬番と単勝オッズを入力してください</p>
<p>例：<br>8 1.8<br>5 5.2<br>11 6.3</p>

<textarea id="data"></textarea>

<br>
<button onclick="calc()">計算</button>

<div class="result" id="result"></div>

<script>
function medianPick(list){
  list.sort((a,b)=>a.odds-b.odds);
  const n=list.length;
  const mid=Math.floor(n/2);

  if(n===0) return null;

  if(n%2===1){
    return {
      type:"単独",
      horses:[list[mid]],
      value:list[mid].odds
    };
  }else{
    return {
      type:"2頭",
      horses:[list[mid-1],list[mid]],
      value:(list[mid-1].odds+list[mid].odds)/2
    };
  }
}

function calc(){
  const text=document.getElementById("data").value.trim();
  const rows=text.split(/\n+/).map(line=>{
    const p=line.trim().split(/\s+/);
    return {num:p[0], odds:parseFloat(p[1])};
  }).filter(x=>x.num && !isNaN(x.odds));

  const under20=rows.filter(x=>x.odds<=20);
  const under99=rows.filter(x=>x.odds<=99);
  const over100=rows.filter(x=>x.odds>=100);
  const all=rows;

  const groups=[
    ["単勝全体メジアン", all],
    ["単勝20倍以内メジアン", under20],
    ["単勝99倍以内メジアン", under99],
    ["単勝100倍以上メジアン", over100]
  ];

  let count={};
  let html="<h2>結果</h2>";

  groups.forEach(g=>{
    const r=medianPick(g[1]);
    if(!r){
      html+=`<p>${g[0]}：該当なし</p>`;
      return;
    }
    const nums=r.horses.map(x=>x.num);
    nums.forEach(n=>count[n]=(count[n]||0)+1);

    html+=`<p><b>${g[0]}</b><br>`;
    html+=`馬番：${nums.join("・")}<br>`;
    html+=`メジアン値：${r.value}</p>`;
  });

  const ranking=Object.entries(count).sort((a,b)=>b[1]-a[1]);

  html+="<h2>重複ランキング</h2>";
  ranking.forEach(([num,c])=>{
    html+=`<p>${num}番：${c}回</p>`;
  });

  document.getElementById("result").innerHTML=html;
}
</script>

</body>
</html>
