<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>まっちゃん専用 チャッピー神予想</title>
<style>
body{font-family:sans-serif;background:#07101f;color:#fff;padding:16px;font-size:18px}
h1{font-size:30px}
label{color:#ffd66b;font-weight:bold;font-size:22px}
input,textarea{width:100%;box-sizing:border-box;background:#050912;color:#fff;border:2px solid #33415c;border-radius:14px;padding:14px;font-size:20px;margin:8px 0 18px}
textarea{height:360px;font-family:monospace}
button{width:100%;padding:18px;border:0;border-radius:18px;font-size:24px;font-weight:bold;margin:8px 0}
.main{background:#ffd66b;color:#000}
.sub{background:#2d3748;color:#fff}
.box{background:#111b2e;border:2px solid #33415c;border-radius:18px;padding:16px;margin:16px 0}
.result{background:#0b1324;border:3px solid #ffd66b}
.good{color:#7CFF9B;font-weight:bold}
.warn{color:#ffd66b;font-weight:bold}
.bad{color:#ff8a8a;font-weight:bold}
pre{white-space:pre-wrap;line-height:1.6;font-size:18px}
</style>
</head>
<body>

<h1>🏇 まっちゃん専用<br>チャッピー神予想 V11</h1>

<div class="box">
<label>レース名</label>
<input id="race" placeholder="例：東京11R 安田記念">

<label>オッズ入力<br>【単勝】【複勝】【馬連】【三連複】をまとめて貼る</label>
<textarea id="odds"></textarea>

<button class="main" onclick="analyze()">分析する</button>
<button class="sub" onclick="sample()">サンプル入力</button>
<button class="sub" onclick="clearAll()">クリア</button>
</div>

<div id="out" class="box result">
ここに分析結果が出ます。
</div>

<script>
function num(v){return parseFloat(String(v).replace(/[^\d.]/g,''));}
function horses(s){return String(s).split(/[-－]/).map(x=>x.trim()).filter(Boolean);}
function mid(arr){
  if(!arr.length)return '';
  const a=[...arr].sort((x,y)=>x.odds-y.odds);
  const n=a.length;
  if(n%2===1)return a[Math.floor(n/2)].horse;
  return a[n/2-1].horse+'・'+a[n/2].horse;
}
function parse(){
  const text=document.getElementById('odds').value.replace(/－/g,'-');
  const lines=text.split(/\n/).map(x=>x.trim()).filter(Boolean);
  let sec='';
  const tan=[], fuku=[], umaren=[], san=[];
  for(const line of lines){
    if(line.includes('単勝')){sec='tan';continue}
    if(line.includes('複勝')){sec='fuku';continue}
    if(line.includes('馬連')||line.includes('馬複')){sec='umaren';continue}
    if(line.includes('三連複')){sec='san';continue}
    const parts=line.split(/\s+/);
    if(parts.length<2)continue;
    const key=parts[0], odds=num(parts[1]);
    if(!odds)continue;
    if(sec==='tan')tan.push({horse:key,odds});
    if(sec==='fuku')fuku.push({horse:key,odds});
    if(sec==='umaren')umaren.push({pair:key,odds,hs:horses(key)});
    if(sec==='san')san.push({pair:key,odds,hs:horses(key)});
  }
  tan.sort((a,b)=>a.odds-b.odds);
  fuku.sort((a,b)=>a.odds-b.odds);
  umaren.sort((a,b)=>a.odds-b.odds);
  san.sort((a,b)=>a.odds-b.odds);
  return {tan,fuku,umaren,san};
}
function rankMap(arr){
  const m={};
  arr.forEach((x,i)=>m[x.horse]=i+1);
  return m;
}
function walls(arr, key='odds', threshold=8){
  const res=[];
  for(let i=0;i<arr.length-1;i++){
    const d=arr[i+1][key]-arr[i][key];
    if(d>=threshold)res.push({before:arr[i],after:arr[i+1],diff:d});
  }
  return res;
}
function analyze(){
  const race=document.getElementById('race').value || 'レース名未入力';
  const {tan,fuku,umaren,san}=parse();
  if(!tan.length){document.getElementById('out').innerHTML='単勝データがありません。';return;}

  const axis=tan[0].horse;
  const tan30=tan.filter(x=>x.odds<30).length;
  const fuku3=fuku.filter(x=>x.odds<3).length;
  const fuku6=fuku.filter(x=>x.odds<6).length;
  const fuku15=fuku.filter(x=>x.odds<15).length;
  const umaren1=umaren[0]?.odds || 0;

  let type='中穴';
  let reasons=[];
  if(tan[0].odds<=3 && fuku[0] && fuku[0].odds<=1.5){type='超1番人気型';reasons.push('単勝1人気3倍以下＋複勝1.5倍以下');}
  if(umaren1>=9 && tan30>=10){type='大穴/準大穴';reasons.push('馬連1人気9倍以上＋単勝30倍未満10頭以上');}
  else if(umaren1>=6){type='中荒れ';reasons.push('馬連1人気がやや高い');}
  else reasons.push('馬連1人気は低め');

  const axisPairs=umaren.filter(x=>x.hs.includes(axis));
  const ootani=[axis,...axisPairs.map(x=>x.hs.find(h=>h!==axis))];
  const honmei=ootani.slice(1,5);
  const chuan=ootani.slice(5,9);
  const ooana=ootani.slice(9);

  const tanM=mid(tan);
  const tan10M=mid(tan.filter(x=>x.odds<=10));
  const tan20M=mid(tan.filter(x=>x.odds<=20));
  const fukuM=mid(fuku);
  const fuku6M=mid(fuku.filter(x=>x.odds<6));
  const umarenM=umaren.length?umaren[Math.floor((umaren.length-1)/2)].pair:'';
  const sanM=san.length?san[Math.floor((san.length-1)/2)].pair:'';

  const tw=walls(tan,'odds',8);
  const uw=walls(umaren,'odds',8);
  const f6Index=fuku.findIndex(x=>x.odds>=6);
  const f15Index=fuku.findIndex(x=>x.odds>=15);
  const f6Before=f6Index>=2?fuku.slice(f6Index-2,f6Index).map(x=>x.horse).join('・'):'';
  const f15Before=f15Index>=2?fuku.slice(f15Index-2,f15Index).map(x=>x.horse).join('・'):'';

  const score={};
  function add(h,pt){if(!h)return; score[h]=(score[h]||0)+pt;}
  [tanM,tan10M,tan20M,fukuM,fuku6M].join('・').split('・').forEach(h=>add(h,1));
  honmei.forEach(h=>add(h,1));
  chuan.forEach(h=>add(h,1));
  if(f6Before)f6Before.split('・').forEach(h=>add(h,1));
  if(f15Before)f15Before.split('・').forEach(h=>add(h,1));
  const ranking=Object.entries(score).sort((a,b)=>b[1]-a[1]);
  const tanshoAken=ranking.filter(x=>x[1]>=3).map(x=>x[0]);

  const tanRanks=rankMap(tan), fukuRanks=rankMap(fuku);
  const moves=[];
  ootani.forEach((h,i)=>{
    if(i===0)return;
    const ur=i+1, tr=tanRanks[h]||99, fr=fukuRanks[h]||99;
    if(ur-tr>=4 || ur-fr>=4)moves.push(`${h}：馬連${ur}位→単勝${tr}位/複勝${fr}位`);
  });

  let buy=[];
  const main=tanshoAken[0]||axis;
  const subs=[...new Set([...honmei,...chuan].filter(h=>h!==main))].slice(0,5);
  buy.push('馬連：'+subs.map(h=>main+'-'+h).join(' / '));
  buy.push('ワイド：'+subs.slice(0,3).map(h=>main+'-'+h).join(' / '));
  if(subs.length>=2)buy.push('三連複：'+subs.slice(0,3).map((h,i)=>main+'-'+h+'-'+subs[(i+1)%subs.length]).join(' / '));

  document.getElementById('out').innerHTML =
`<pre>
━━━━━━━━━━━━━━
${race}
━━━━━━━━━━━━━━

【レース判定】
${type}
理由：${reasons.join(' / ')}
馬連1人気：${umaren1 || '-'}倍
単勝30倍未満：${tan30}頭
複勝3倍未満：${fuku3}頭
複勝6倍未満：${fuku6}頭

【単勝案件】
${tanshoAken.length?tanshoAken.join('・'):'なし'}
重複ランキング：
${ranking.map((x,i)=>`${i+1}位 ${x[0]}：${x[1]}回`).join('\n') || 'なし'}

【本家大谷式】
単勝1人気軸：${axis}
馬連ランク：
${ootani.join(' → ')}

本命ゾーン：${honmei.join('・') || '-'}
中穴ゾーン：${chuan.join('・') || '-'}
大穴ゾーン：${ooana.join('・') || '-'}

【メジアン】
単勝全体：${tanM}
単勝10倍以内：${tan10M}
単勝20倍以内：${tan20M}
複勝全体：${fukuM}
複勝6倍未満：${fuku6M}
馬連メジアン：${umarenM}
三連複メジアン：${sanM}

【壁】
単勝壁：
${tw.map(w=>`${w.before.horse}(${w.before.odds}) → ${w.after.horse}(${w.after.odds}) 差${w.diff.toFixed(1)}`).join('\n') || 'なし'}

馬連壁：
${uw.map(w=>`${w.before.pair}(${w.before.odds}) → ${w.after.pair}(${w.after.odds}) 差${w.diff.toFixed(1)}`).join('\n') || 'なし'}

複勝6倍壁前2頭：${f6Before || 'なし'}
複勝15倍壁前2頭：${f15Before || 'なし'}

【突入＆移動馬】
${moves.join('\n') || 'なし'}

【チャッピー推奨】
${buy.join('\n')}

</pre>`;
}
function sample(){
document.getElementById('race').value='テストレース';
document.getElementById('odds').value=`【単勝】
10 2.1
9 2.3
1 8.5
5 11.9
6 13.0
4 24.2
8 34.2
3 73.7
7 130.7

【複勝】
10 1.5
9 1.6
6 2.1
1 2.5
5 2.5
4 6.3
8 8.1
3 9.0
7 20.5

【馬連】
9-10 2.9
1-9 8.2
1-10 9.0
5-9 11.3
5-10 12.5
6-9 15.8
6-10 16.0
4-10 19.4
8-10 19.7
8-9 30.1
4-9 36.1
3-10 37.9
3-9 55.1
7-10 81.4

【三連複】
1-9-10 8.8
5-9-10 12.3
6-9-10 15.7
1-5-10 18.9
1-5-9 22.4
4-9-10 29.8
8-9-10 33.5
3-9-10 58.1
7-9-10 110.2`;
analyze();
}
function clearAll(){
document.getElementById('race').value='';
document.getElementById('odds').value='';
document.getElementById('out').innerHTML='ここに分析結果が出ます。';
}
</script>

</body>
</html>
