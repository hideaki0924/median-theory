function renderSwitch(sw){var html='<div class="card switch"><div class="title">🚨大穴スイッチ</div>判定：<span class="red">'+sw.level+'</span> / 最高 '+sw.score+'<br>';html+='対象：<span class="yellow">'+(sw.target?sw.target.h+'番【候補1位】':'なし')+'</span><hr>';if(!sw.items.length)html+='該当なし';else sw.items.forEach(function(x,i){html+='<div class="rankLine"><span class="badge">'+(i+1)+'位 '+x.h+'番【'+x.score+'】</span> <span class="small">単'+x.tan+' / 複'+x.fuku+'　'+x.reasons.slice(0,9).join('・')+'</span></div>';});html+='</div>';return html;}
function barClassFor(label,i,ctx){if(label==='単勝'&&ctx.w80.idx===i)return' bar80';if(label==='複勝'&&ctx.w6.idx===i)return' bar6';if(label==='複勝'&&ctx.w15.idx===i)return' bar15';if(label==='馬連'&&ctx.umaGap.indexOf(i)>=0)return' barGap';if(label==='三連複'&&ctx.sanGap.indexOf(i)>=0)return' barGap';return'';}
function renderHonRow(label,row,med,ctx,maxLen){var arr=row.slice();while(arr.length<maxLen)arr.push('');var marks={w80:uniq([].concat(ctx.w80.before,ctx.w80.after)),w15:uniq([].concat(ctx.w15.before,ctx.w15.after)),w6:uniq([].concat(ctx.w6.before,ctx.w6.after)),cliff:ctx.fukuCliff15.lower||[]};var html='<div class="honRow"><div class="honLabel">'+label+'</div>';for(var i=0;i<maxLen;i++){var h=arr[i],cls='honNum';if(!h)cls+=' honEmpty';else if(label==='複勝'&&(marks.cliff||[]).indexOf(h)>=0)cls+=' cliff15';else if((marks.w80||[]).indexOf(h)>=0)cls+=' wall80';else if((marks.w15||[]).indexOf(h)>=0)cls+=' wall15';else if((marks.w6||[]).indexOf(h)>=0)cls+=' wall6';else if(med.indexOf(h)>=0)cls+=' honMed';html+='<span class="'+cls+'">'+(h||'')+'</span>';if(i<maxLen-1)html+='<span class="bar'+barClassFor(label,i,ctx)+'"></span>';}html+='</div>';return html;}
function renderMoves(moves){var html='<div class="moveBox"><div class="moveTitle">移動馬・変な動き馬</div>';if(!moves||!moves.length)html+='<div class="moveNo">発動なし</div>';else moves.forEach(function(m){html+='<div class="moveLine"><span class="moveTag">'+m.code+'</span><span class="moveHorse">'+m.h+'番 '+m.name+'</span>｜'+m.why+'</div>';});html+='</div>';return html;}
function renderHonpyo(ctx,moves){var rows=[{l:'馬連',r:ctx.umaRow,m:ctx.umaM},{l:'単勝',r:ctx.tanRow,m:ctx.tanM},{l:'複勝',r:ctx.fukuRow,m:ctx.fukuM},{l:'三連複',r:ctx.sanRow,m:ctx.sanM}];var max=0;rows.forEach(function(x){if(x.r.length>max)max=x.r.length;});var html='<div class="card"><div class="title">本表・壁色つき</div><div class="honWrap">';rows.forEach(function(x){html+=renderHonRow(x.l,x.r,x.m,ctx,max);});html+='</div><div class="legend"><span class="leg"><i class="legLine l6"></i>複勝6倍壁</span><span class="leg"><i class="legLine l15"></i>複勝15倍壁</span><span class="leg"><i class="legLine lcliff"></i>複勝15倍断層下2頭</span><span class="leg"><i class="legLine l80"></i>単勝80倍壁</span><span class="leg"><i class="legLine lgap"></i>急なオッズ差</span></div>'+renderMoves(moves)+'</div>';return html;}
function renderV236(adv){var html='<div class="card v236"><div class="title">🧠V2.37 他馬沈み判定＋欠点あり突出馬</div>';html+='総合：<span class="red">'+adv.level+'</span> / 発動数 '+adv.flags+'<hr>';html+='診断枠内決着候補：<span class="yellow">'+joinH(adv.diagBox)+'</span><br>';if(adv.fuku6&&adv.fuku6.on){html+='複勝6倍内メジアン：<span class="cyan">'+joinH(adv.fuku6.med)+'</span><br>';html+='複勝6倍内メジアン周辺：<span class="cyan">'+joinH(adv.fuku6.around)+'</span><br>';}html+='三連複1位ジャンプ：<span class="yellow">'+(adv.tri1?adv.tri1+'番':'なし')+'</span><br>';html+='複勝上昇ジャンプ：<span class="blue">'+(adv.fukuUp.length?adv.fukuUp.map(function(x){return x.h+'番';}).join('・'):'なし')+'</span><br>';html+='縦揃い本線軸：<span class="yellow">'+(adv.vertical?adv.vertical.h+'番':'なし')+'</span><br>';html+='人気側受け皿の過剰固定警告：<span class="orange">'+(adv.overFixed.length?adv.overFixed.map(function(x){return x.h+'番';}).join('・'):'なし')+'</span><br>';html+='欠点あり突出馬：<span class="red">'+(adv.flawShine&&adv.flawShine.length?adv.flawShine.map(function(x){return x.h+'番';}).join('・'):'なし')+'</span><br>';html+='<span class="small">人気や単勝に弱点があっても、複勝上昇・三連複1位・壁前・診断枠・メジアン周辺の突出点が重なる馬は大穴候補。人気馬は本物人気/受け皿人気/過剰人気に分けて確認。</span></div>';return html;}
function renderRank(scored){var html='<div class="card"><div class="title">候補ランキング</div>';scored.slice(0,10).forEach(function(x,i){html+='<div class="rankLine"><span class="badge">'+(i+1)+'位 '+x.h+'番【'+x.score+'】</span> <span class="small">単'+x.tan+' / 複'+x.fuku+'　'+x.reasons.slice(0,10).join('・')+'</span></div>';});html+='</div>';return html;}
function renderTickets(t){var html='<div class="card tickets"><div class="title">💰圧縮買い目</div><pre>';html+='ワイド\n'+(t.wide.length?t.wide.join('\n'):'なし')+'\n\n馬連\n'+(t.uma.length?t.uma.join('\n'):'なし')+'\n\n三連複・本線\n'+(t.main.length?t.main.join('\n'):'なし')+'\n\n三連複・穴相手\n'+(t.hole.length?t.hole.join('\n'):'なし')+'\n\n三連複・V2.37保護\n'+(t.upgrade.length?t.upgrade.join('\n'):'なし')+'\n\n三連複・V2.37診断枠/突出馬保護\n'+(t.v236.length?t.v236.join('\n'):'なし')+'\n\n三連複・保険\n'+(t.bomb.length?t.bomb.join('\n'):'なし')+'\n\n※V2.37は「欠点あり突出馬」「人気の質判定」を追加。悪い所があっても突出点が強い馬を保護。';html+='</pre></div>';return html;}
function makeCopyText(data,diag,ctx,ms,sw,tickets,scored,moves,adv){var s=data.title+'\n競馬メジアン V2.37 欠点あり突出馬ランプ＋人気の質判定\n\n';s+='🩺レース診断\n表面：'+diag.surface+'\nまっちゃん判定：'+diag.matchanType+'\n単勝10倍未満：'+ctx.counts.tanUnder10+'頭\n単勝30倍未満：'+ctx.counts.tanUnder30+'頭\n複勝6倍以内：'+ctx.counts.fukuUnder6+'頭\n複勝10倍以内：'+ctx.counts.fukuUnder10+'頭\n複勝15倍以内：'+ctx.counts.fukuUnder15+'頭\n';if(ctx.fukuCliff15&&ctx.fukuCliff15.on){s+='\n🚨複勝15倍断層下2頭 要注意\n断層下2頭：'+joinH(ctx.fukuCliff15.lower)+'\n断層上：'+(ctx.fukuCliff15.upper?ctx.fukuCliff15.upper+'番':'なし')+'\n'+ctx.fukuCliff15.reason+'\n';}s+='\n🔥まっちゃん単勝システム\n最終タイプ：'+ms.type+'\n';if(ms.top){s+='単勝候補：'+ms.top.h+'番 単'+ms.top.tan+' 複'+ms.top.fuku+'\n買い目：単勝 '+ms.top.h+' '+(ms.top.amount||'700円')+' / ワイド '+pairKey(ms.top.h,ms.partner)+' 200円 / 三連複 '+(ms.tri||triKey(ctx.fav1,ms.top.h,ms.partner))+' 100円\n';}s+='3連複相手型：'+(ms.place.length?ms.place.map(function(x){return x.h+'番';}).join('・'):'なし')+'\n大穴単勝カット：'+(ms.cut.length?ms.cut.map(function(x){return x.h+'番';}).join('・'):'なし')+'\n\n';s+='移動馬・変な動き馬\n';if(moves&&moves.length){moves.forEach(function(m){s+=m.code+' '+m.h+'番 '+m.name+'｜'+m.why+'\n';});}else{s+='発動なし\n';}s+='\n大穴スイッチ：'+sw.level+' / '+sw.score+' → 対象：'+(sw.target?sw.target.h+'番【候補1位】':'なし')+'\n';s+='\n🧠V2.37 他馬沈み判定＋欠点あり突出馬\n総合：'+adv.level+' / 発動数 '+adv.flags+'\n診断枠内候補：'+joinH(adv.diagBox)+'\n複勝6倍内メジアン：'+joinH(adv.fuku6.med)+'\n複勝6倍内メジアン周辺：'+joinH(adv.fuku6.around)+'\n三連複1位ジャンプ：'+(adv.tri1?adv.tri1+'番':'なし')+'\n複勝上昇ジャンプ：'+(adv.fukuUp.length?adv.fukuUp.map(function(x){return x.h+'番';}).join('・'):'なし')+'\n縦揃い本線軸：'+(adv.vertical?adv.vertical.h+'番':'なし')+'\n人気側受け皿の過剰固定警告：'+(adv.overFixed.length?adv.overFixed.map(function(x){return x.h+'番';}).join('・'):'なし')+'\n欠点あり突出馬：'+(adv.flawShine&&adv.flawShine.length?adv.flawShine.map(function(x){return x.h+'番';}).join('・'):'なし')+'\n';s+='\n圧縮買い目\nワイド\n'+tickets.wide.join('\n')+'\n\n三連複・本線\n'+tickets.main.join('\n')+'\n\n三連複・穴相手\n'+tickets.hole.join('\n')+'\n\n三連複・V2.37保護\n'+tickets.upgrade.join('\n')+'\n\n三連複・V2.37診断枠/突出馬保護\n'+tickets.v236.join('\n')+'\n\n三連複・保険\n'+tickets.bomb.join('\n')+'\n\n候補上位\n';scored.slice(0,8).forEach(function(x,i){s+=(i+1)+'位 '+x.h+'番【'+x.score+'】 単'+x.tan+' 複'+x.fuku+' '+x.reasons.slice(0,12).join('・')+'\n';});return s;}
function run(){try{var data=parseData(document.getElementById('input').value),out=document.getElementById('out');if(!data.tanfuku.length){out.innerHTML='<div class="card"><div class="title warn">入力不足</div>[TANFUKU] が必要です。</div>';return;}var ctx=makeContext(data),diag=makeRaceDiag(ctx),scored=scoreAll(data,ctx),sw=detectBigSwitch(ctx,scored),ms=makeMatchanSystem(ctx,scored,diag,sw),adv=detectV236(ctx,scored,diag,sw),tickets=makeTickets(ctx,ms,scored,sw,adv),moves=detectMoves(ctx,scored,diag);var html='';html+=renderTop(data,ctx)+renderDiag(diag,ctx)+renderV236(adv)+renderMatchan(ms,diag,ctx,moves)+renderSwitch(sw)+renderHonpyo(ctx,moves)+renderRank(scored)+renderTickets(tickets);out.innerHTML=html;latestCopyText=makeCopyText(data,diag,ctx,ms,sw,tickets,scored,moves,adv);}catch(e){document.getElementById('out').innerHTML='<div class="card"><div class="title warn">エラー</div><pre>'+String(e&&e.message?e.message:e)+'</pre></div>';}}

function clearAll(){document.getElementById('input').value='';document.getElementById('out').innerHTML='';latestCopyText='';}
function copyResult(){if(!latestCopyText){alert('先に解析してください');return;}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(latestCopyText).then(function(){alert('結果をコピーしました');}).catch(function(){fallbackCopy(latestCopyText);});}else fallbackCopy(latestCopyText);}
function fallbackCopy(text){var ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);alert('結果をコピーしました');}
