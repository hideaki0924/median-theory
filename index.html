<style>
body{margin:0;background:#07101f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;padding:14px;font-size:17px}
h1{color:#fff;font-size:28px;line-height:1.3}
textarea{width:100%;height:330px;box-sizing:border-box;border-radius:16px;border:2px solid #3b82f6;padding:12px;font-size:16px;line-height:1.45;font-family:monospace;background:#f8fafc;color:#111}
button{font-size:20px;font-weight:900;border:0;border-radius:16px;padding:14px 18px;margin:10px 6px 10px 0}.go{background:#22c55e;color:#052e16}.test{background:#3b82f6;color:#fff}.clear{background:#64748b;color:#fff}.copy{background:#f59e0b;color:#fff}
.card{background:#10224a;border:1px solid #3b82f6;border-radius:18px;padding:14px;margin:14px 0}.title{color:#ffd84d;font-size:24px;font-weight:900;margin-bottom:10px}.sub{color:#93c5fd;font-size:19px;font-weight:900;margin-top:10px}.good{color:#86efac;font-weight:900}.warn{color:#fb7185;font-weight:900}.yellow{color:#fde047;font-weight:900}.red{color:#fb7185;font-weight:900}.small{color:#cbd5e1;font-size:14px}pre{white-space:pre-wrap;word-break:break-word;background:#020617;color:#e5e7eb;padding:12px;border-radius:12px;font-size:18px}.badge{display:inline-block;padding:5px 10px;border-radius:999px;background:#1e293b;margin:4px 2px;font-weight:900}.honWrap{overflow-x:auto;background:#07101f;border-radius:14px;padding:10px;margin-top:10px}.honRow{display:flex;align-items:center;gap:0;min-width:680px;margin:12px 0}.honLabel{width:72px;font-weight:900;font-size:20px}.honNum{display:inline-block;min-width:44px;text-align:center;font-size:27px;font-weight:900;color:#fff}.honMed{color:#fb7185}.bar{display:inline-block;height:38px;width:3px;margin:0 6px;opacity:.95}.barNone{background:#35517a}.barUma{background:#ef4444}.barTan{background:#3b82f6}.barFuku{background:#fde047}.move{color:#ffd84d;font-size:22px;font-weight:900;margin-top:10px}.rankLine{margin:8px 0;line-height:1.55}hr{border:0;border-top:1px solid #94a3b8;margin:14px 0}

<body>
<h1>チャッピー神予想 V1.6<br>超1番人気赤信号・穴救済版</h1>
<textarea id="input" placeholder="【レース名】

[TANFUKU]

[UMAREN]

[WIDE]

[SANPUKU]"></textarea><br>
<button class="go" id="btnRun">解析</button><button class="test" id="btnSample">テスト</button><button class="clear" id="btnClear">リセット</button><button class="copy" id="btnCopy">結果コピー</button>
<div id="out"></div>
<script>
var latestCopyText = "";
function zenToHan(str){return String(str).replace(/[０-９]/g,function(s){return String.fromCharCode(s.charCodeAt(0)-65248);}).replace(/．/g,'.').replace(/[－ー―−]/g,'-').replace(/[　]/g,' ').replace(/[〜～]/g,'-');}
function nums(line){var m=zenToHan(line).match(/\d+(?:\.\d+)?/g);if(!m)return[];return m.map(function(x){return Number(x);});}
function pairKey(a,b){return[a,b].map(Number).sort(function(x,y){return x-y;}).join('-');}
function triKey(a,b,c){return[a,b,c].map(Number).sort(function(x,y){return x-y;}).join('-');}
function sortOdds(arr){return arr.slice().sort(function(a,b){return a.od-b.od;});}
function sortBy(arr,key){return arr.slice().sort(function(a,b){return a[key]-b[key];});}
function uniq(arr){var s={},out=[];for(var i=0;i<arr.length;i++){var v=arr[i];if(v!==undefined&&v!==null&&v!==''&&!s[v]){s[v]=true;out.push(v);}}return out;}
function mid(arr){if(!arr.length)return[];if(arr.length===1)return[arr[0]];var n=arr.length;if(n%2===1)return[arr[Math.floor(n/2)]];return[arr[n/2-1],arr[n/2]];}
function midPair(arr){if(!arr.length)return[];if(arr.length===1)return[arr[0]];var n=arr.length;if(n%2===0)return[arr[n/2-1],arr[n/2]];var m=Math.floor(n/2);return uniq([arr[m],arr[Math.max(0,m-1)]]);}
function joinH(arr){if(!arr||!arr.length)return'なし';return arr.map(function(x){return x+'番';}).join('・');}
function rankMap(row){var m={};for(var i=0;i<row.length;i++)m[row[i]]=i+1;return m;}
function parseData(raw){var text=zenToHan(raw),lines=text.split(/\n/),title='レース',sec='',tanfuku=[],umaren=[],wide=[],sanpuku=[];for(var i=0;i<lines.length;i++){var line=lines[i].trim();if(!line)continue;if(line.indexOf('【')===0)title=line;var up=line.toUpperCase();if(up.indexOf('[TANFUKU]')===0){sec='TANFUKU';continue;}if(up.indexOf('[UMAREN]')===0){sec='UMAREN';continue;}if(up.indexOf('[WIDE]')===0){sec='WIDE';continue;}if(up.indexOf('[SANPUKU]')===0){sec='SANPUKU';continue;}if(sec==='TANFUKU'){var n=nums(line);if(n.length>=3)tanfuku.push({h:String(Math.floor(n[0])),tan:n[1],fuku:n[n.length-1]});}if(sec==='UMAREN'){var m=line.match(/(\d+)\s*-\s*(\d+)/);var o=nums(line);if(m&&o.length)umaren.push({a:m[1],b:m[2],od:o[o.length-1],key:pairKey(m[1],m[2])});}if(sec==='WIDE'){var mw=line.match(/(\d+)\s*-\s*(\d+)/);var ow=nums(line);if(mw&&ow.length)wide.push({a:mw[1],b:mw[2],od:ow[ow.length-1],key:pairKey(mw[1],mw[2])});}if(sec==='SANPUKU'){var ms=line.match(/(\d+)\s*-\s*(\d+)\s*-\s*(\d+)/);var os=nums(line);if(ms&&os.length)sanpuku.push({a:ms[1],b:ms[2],c:ms[3],od:os[os.length-1],key:triKey(ms[1],ms[2],ms[3])});}}return{title:title,tanfuku:tanfuku,umaren:umaren,wide:wide,sanpuku:sanpuku};}
function fukuFront(tanfuku,limit){var arr=sortBy(tanfuku,'fuku').filter(function(x){return x.fuku<=limit;});return arr.slice(Math.max(0,arr.length-2)).map(function(x){return x.h;});}
function fukuAfter(tanfuku,limit){var arr=sortBy(tanfuku,'fuku').filter(function(x){return x.fuku>limit;});return arr.slice(0,2).map(function(x){return x.h;});}
function detectWalls(items){var arr=sortOdds(items).slice(0,12),walls=[];for(var i=0;i<arr.length-1;i++){var now=arr[i].od,next=arr[i+1].od,ratio=next/now,diff=next-now;if(ratio>=1.55||diff>=8)walls.push({before:i+1,after:i+2,ratio:ratio,diff:diff});}return walls;}
function zonePairs(pairs,walls){var top=sortOdds(pairs).slice(0,12);if(!top.length)return[];if(walls.length>=2)return top.slice(walls[0].after-1,walls[1].before);if(walls.length===1)return top.slice(0,walls[0].before);return top.slice(0,5);}
function pairHorses(pairs){var a=[];for(var i=0;i<pairs.length;i++){a.push(pairs[i].a);a.push(pairs[i].b);}return uniq(a);}
function countPair(pairs,topN){var map={},arr=sortOdds(pairs).slice(0,topN);for(var i=0;i<arr.length;i++){[arr[i].a,arr[i].b].forEach(function(h){if(!map[h])map[h]={h:h,count:0};map[h].count++;});}var out=[];for(var k in map)out.push(map[k]);return out.sort(function(a,b){return b.count-a.count;});}
function countTri(tris,topN){var map={},arr=sortOdds(tris).slice(0,topN);for(var i=0;i<arr.length;i++){[arr[i].a,arr[i].b,arr[i].c].forEach(function(h){if(!map[h])map[h]={h:h,count:0};map[h].count++;});}var out=[];for(var k in map)out.push(map[k]);return out.sort(function(a,b){return b.count-a.count;});}
function makeOtaniRow(tanRank,umaRank,allHorses){var axis=tanRank[0]?tanRank[0].h:null,row=[],items=[];if(axis){row.push(axis);items=umaRank.filter(function(p){return p.a===axis||p.b===axis;});for(var i=0;i<items.length;i++){var other=items[i].a===axis?items[i].b:items[i].a;if(row.indexOf(other)<0)row.push(other);}}for(var j=0;j<umaRank.length;j++){if(row.indexOf(umaRank[j].a)<0)row.push(umaRank[j].a);if(row.indexOf(umaRank[j].b)<0)row.push(umaRank[j].b);}for(var k=0;k<allHorses.length;k++){if(row.indexOf(allHorses[k])<0)row.push(allHorses[k]);}return{axis:axis,row:row,items:items};}
function wallPositionsForOtani(items){var walls=detectWalls(items);return walls.map(function(w){return w.before+1;});}
function wallPositionsByOdds(rank,key){var walls=[];for(var i=0;i<rank.length-1;i++){var now=rank[i][key],next=rank[i+1][key];if(!now||!next)continue;var ratio=next/now,diff=next-now;if(ratio>=1.8||diff>=10)walls.push(i+1);}return walls;}
function fukuWallPositions(fukuRank){var pos=[],p6=0,p15=0;for(var i=0;i<fukuRank.length;i++){if(fukuRank[i].fuku<=6)p6=i+1;if(fukuRank[i].fuku<=15)p15=i+1;}if(p6>0)pos.push(p6);if(p15>0&&p15!==p6)pos.push(p15);return pos;}
function renderHonRow(label,row,walls,medians,barClass){var html='<div class="honRow"><div class="honLabel">'+label+'</div>';for(var i=0;i<row.length;i++){var h=row[i];var cls=medians.indexOf(h)>=0?'honNum honMed':'honNum';html+='<span class="'+cls+'">'+h+'</span>';var pos=i+1;var bcls=walls.indexOf(pos)>=0?barClass:'barNone';if(i<row.length-1)html+='<span class="bar '+bcls+'"></span>';}html+='</div>';return html;}
function makeHonpyoCard(otaniRow,tanRow,fukuRow,umaWalls,tanWalls,fukuWalls,zoneM,tanM,fukuM,moves){var html='';html+='<div class="card"><div class="title">本表</div>';html+='<div class="small">大谷式馬連＝単勝1番人気を先頭にして馬連オッズ順<br>馬連の壁＝赤線　単勝の壁＝青線　複勝の壁＝黄色線<br>メジアン候補＝赤文字</div>';html+='<div class="honWrap">';html+=renderHonRow('馬連',otaniRow,umaWalls,zoneM,'barUma');html+=renderHonRow('単勝',tanRow,tanWalls,tanM,'barTan');html+=renderHonRow('複勝',fukuRow,fukuWalls,fukuM,'barFuku');html+='</div>';if(moves.length){html+='<div class="move">🚨 極端移動<br>'+moves.join('　')+'</div>';}else{html+='<div class="small">極端移動：該当なし</div>';}html+='</div>';return html;}
function detectMoves(otaniRow,tanRow,fukuRow){var u=rankMap(otaniRow),t=rankMap(tanRow),f=rankMap(fukuRow),horses=uniq(otaniRow.concat(tanRow).concat(fukuRow)),out=[];for(var i=0;i<horses.length;i++){var h=horses[i];if(u[h]&&t[h]&&t[h]-u[h]>=3)out.push(h+' 単→馬 +'+(t[h]-u[h]));if(u[h]&&f[h]&&f[h]-u[h]>=3)out.push(h+' 複→馬 +'+(f[h]-u[h]));}return out.slice(0,6);}
function getTf(tanfuku,h){for(var i=0;i<tanfuku.length;i++){if(tanfuku[i].h===h)return tanfuku[i];}return null;}
function scoreAll(allHorses,data,ctx,specialOn){var scored=[];for(var i=0;i<allHorses.length;i++){var h=allHorses[i],tf=getTf(data.tanfuku,h),score=0,reasons=[];if(ctx.zoneH.indexOf(h)>=0){score+=6;reasons.push('馬連壁内');}if(ctx.zoneM.indexOf(h)>=0){score+=8;reasons.push('馬連ゾーンメジアン');}if(ctx.tanM.indexOf(h)>=0){score+=4;reasons.push('単勝メジアン');}if(ctx.fukuM.indexOf(h)>=0){score+=4;reasons.push('複勝メジアン');}if(ctx.fuku3.indexOf(h)>=0){score+=3;reasons.push('複勝3倍未満');}if(ctx.fuku6.indexOf(h)>=0){score+=6;reasons.push('複勝6倍壁前');}if(ctx.fuku10.indexOf(h)>=0){score+=5;reasons.push('複勝10倍壁前');}if(ctx.fuku15.indexOf(h)>=0){score+=ctx.release15?6:2;reasons.push(ctx.release15?'複勝15倍解放':'複勝15倍参考');}if(ctx.fuku15a.indexOf(h)>=0){score+=ctx.release15?3:0;reasons.push(ctx.release15?'15倍直後解放':'15倍直後参考');}if(ctx.umaTop.indexOf(h)>=0){score+=5;reasons.push('馬連出現上位');}if(ctx.sanTop.indexOf(h)>=0){score+=4;reasons.push('三連複出現上位');}if(specialOn){if(ctx.heroH.indexOf(h)>=0){score+=20;reasons.push('1倍台本命保護');}if(ctx.semiHeroH&&ctx.semiHeroH.indexOf(h)>=0&&ctx.heroH.indexOf(h)<0){score+=14;reasons.push('準本命保護');}if(ctx.fuku3Lock&&ctx.fuku3.indexOf(h)>=0){score+=6;reasons.push('複勝3倍未満ゾーンロック');}if(ctx.fukuMedianPair&&ctx.fukuM.indexOf(h)>=0){score+=8;reasons.push('複勝メジアンペア保護');}if(ctx.doubleMedian.indexOf(h)>=0){score+=10;reasons.push('単複メジアン重複');}if(ctx.sanRescueH&&ctx.sanRescueH.indexOf(h)>=0){score+=4;reasons.push('三連複出現救済');}}if(tf&&tf.fuku>15&&!ctx.release15){score-=4;reasons.push('複勝15倍外で弱め');}if(tf&&tf.tan>=100){score-=2;reasons.push('単勝100倍超で弱め');}scored.push({h:h,score:score,reasons:reasons,tan:tf?tf.tan:'-',fuku:tf?tf.fuku:'-'});}scored.sort(function(a,b){return b.score-a.score;});return scored;}
function makeBaseAxisPartner(scored){var axis=scored.filter(function(x){return x.score>=14;}).slice(0,2);if(axis.length===0&&scored[0])axis=[scored[0]];var axisH=axis.map(function(x){return x.h;});var partner=scored.filter(function(x){return x.score>=8&&axisH.indexOf(x.h)<0;}).slice(0,3);return{axisH:axisH,partnerH:partner.map(function(x){return x.h;})};}
function firstByScore(list,scored,exclude){exclude=exclude||[];var best=null;for(var i=0;i<list.length;i++){var h=list[i];if(exclude.indexOf(h)>=0)continue;var s=scored.filter(function(x){return x.h===h;})[0];if(s&&(!best||s.score>best.score||(s.score===best.score&&Number(s.fuku)<Number(best.fuku))))best=s;}return best?best.h:null;}
function fillPartners(seed,axisH,lists,limit){var out=seed.slice();for(var i=0;i<lists.length;i++){for(var j=0;j<lists[i].length;j++){var h=lists[i][j];if(axisH.indexOf(h)<0&&out.indexOf(h)<0)out.push(h);if(out.length>=limit)return out;}}return out;}
function chooseFinal(base,scored,rawScored,ctx){var lamps=[],axisH=base.axisH.slice(),partnerH=base.partnerH.slice(),mode='通常';if(ctx.heroH.length){lamps.push('🚨1倍台本命保護：'+joinH(ctx.heroH));}if(ctx.semiHeroH&&ctx.semiHeroH.length){lamps.push('🟧準本命保護：'+joinH(ctx.semiHeroH));}if(ctx.redTriH&&ctx.redTriH.length>=3){lamps.push('🚨超1番人気赤信号：本命なし三連複 '+ctx.redTriKey+'（'+ctx.redTriOdds+'倍）');}
if(ctx.fuku3Lock){lamps.push('🟦複勝3倍未満ゾーンロック：'+joinH(ctx.fuku3));}
if(ctx.fukuMedianPair){lamps.push('🟣複勝メジアンペア保護：'+joinH(ctx.fukuM));}
if(ctx.doubleMedian.length){lamps.push('🔥単複メジアン重複：'+joinH(ctx.doubleMedian));}
var hero=(ctx.heroH[0]||ctx.semiHeroH[0]);
if(hero&&base.axisH.indexOf(hero)<0){mode='本命保護';axisH=[hero];if(ctx.fuku3Lock){var sub=firstByScore(ctx.fuku3,scored,[hero]);if(sub)axisH.push(sub);}partnerH=fillPartners([],axisH,[base.partnerH,base.axisH,ctx.fukuM,scored.map(function(x){return x.h;})],4);}
else if(ctx.doubleMedian.length&&ctx.topUma>=4){mode='複勝メジアンペア';var dm=ctx.doubleMedian[0];var second=null;if(base.partnerH.indexOf(dm)>=0){for(var i=0;i<base.partnerH.length;i++){if(base.partnerH[i]!==dm){second=base.partnerH[i];break;}}}if(!second){for(var j=0;j<base.axisH.length;j++){if(base.axisH[j]!==dm){second=base.axisH[j];break;}}}axisH=uniq(second?[dm,second]:[dm]);partnerH=fillPartners([],axisH,[ctx.fukuM,base.axisH,base.partnerH,scored.map(function(x){return x.h;})],4);}
else{partnerH=sortNormalPartners(partnerH,axisH,ctx,dataForSort);}
if(ctx.fukuMedianPair){var linkedPair=ctx.fukuM.filter(function(h){return axisH.indexOf(h)<0;});if(linkedPair.length){lamps.push('🟣複勝メジアンペア連結ロック：'+joinH(ctx.fukuM));partnerH=uniq(linkedPair.concat(partnerH));if(mode==='通常')mode='複勝メジアン連結';}}
var urameH=[];if(ctx.redTriH&&ctx.redTriH.length>=3){urameH=ctx.redTriH.slice(0,3);if(mode==='通常'||mode==='本命保護')mode='超1番人気赤信号';}else if(hero&&axisH[0]===hero&&axisH.length>=2&&partnerH.length>=3){var secondTf=getTf(dataForSort.tanfuku,axisH[1]);var chk=partnerH.slice(0,4),hole=0,solid=0;for(var ui=0;ui<chk.length;ui++){var tfu=getTf(dataForSort.tanfuku,chk[ui]);if(tfu&&(tfu.tan>=10||tfu.fuku>=5))hole++;if(tfu&&tfu.fuku<3)solid++;}if(secondTf&&secondTf.fuku>3&&hole>=2&&solid>=1){urameH=partnerH.slice(0,3);lamps.push('⚠️1倍台本命過信注意：裏目三連複 '+joinH(urameH));if(mode==='通常'||mode==='本命保護')mode='本命過信注意';}}var rescue=firstByScore(ctx.sanRescueH||[],scored,axisH.concat(partnerH));if(rescue){partnerH=uniq([rescue].concat(partnerH));lamps.push('🕳三連複3着穴救済：'+rescue+'番');if(!urameH.length&&axisH.length>=2){urameH=[axisH[0],axisH[1],rescue];}}
return{axisH:axisH.slice(0,2),partnerH:partnerH.slice(0,4),lamps:lamps,mode:mode,urameH:urameH};}
var dataForSort=null;
function sortNormalPartners(partnerH,axisH,ctx,data){var arr=partnerH.slice();arr.sort(function(a,b){var ta=getTf(data.tanfuku,a),tb=getTf(data.tanfuku,b);function p(h,tf){var pt=0;if(tf&&tf.fuku>3&&tf.fuku<=15)pt+=8;if(ctx.fuku10.indexOf(h)>=0||ctx.fuku15.indexOf(h)>=0)pt+=6;if(ctx.fukuM.indexOf(h)>=0||ctx.tanM.indexOf(h)>=0)pt+=4;if(tf&&tf.fuku<3)pt-=4;return pt;}return p(b,tb)-p(a,ta);});return arr;}
function makeTickets(axisH,partnerH,urameH){var wide=[],umaren=[],sanpuku=[];function add(arr,v){if(v&&arr.indexOf(v)<0)arr.push(v);}if(axisH.length>=2){add(wide,pairKey(axisH[0],axisH[1]));if(partnerH[0]){add(wide,pairKey(axisH[0],partnerH[0]));add(wide,pairKey(axisH[1],partnerH[0]));}add(umaren,pairKey(axisH[0],axisH[1]));if(partnerH[0])add(umaren,pairKey(axisH[0],partnerH[0]));if(partnerH[0])add(sanpuku,triKey(axisH[0],axisH[1],partnerH[0]));if(partnerH[1])add(sanpuku,triKey(axisH[0],axisH[1],partnerH[1]));}else if(axisH.length===1){for(var i=0;i<partnerH.length;i++){add(wide,pairKey(axisH[0],partnerH[i]));if(i<2)add(umaren,pairKey(axisH[0],partnerH[i]));}if(partnerH.length>=2)add(sanpuku,triKey(axisH[0],partnerH[0],partnerH[1]));if(partnerH.length>=3)add(sanpuku,triKey(axisH[0],partnerH[0],partnerH[2]));}if(urameH&&urameH.length>=3){var back=triKey(urameH[0],urameH[1],urameH[2]);sanpuku=uniq([back].concat(sanpuku));}return{wide:wide.slice(0,3),umaren:umaren.slice(0,3),sanpuku:sanpuku.slice(0,3)};}
function safeRun(){try{run();}catch(e){document.getElementById('out').innerHTML='<div class="card"><div class="title warn">エラー</div><pre>'+String(e&&e.message?e.message:e)+'</pre></div>';}}
function run(){var data=parseData(document.getElementById('input').value);dataForSort=data;var out=document.getElementById('out');if(data.tanfuku.length===0||data.umaren.length===0){out.innerHTML='<div class="card"><div class="title warn">入力不足</div>[TANFUKU] と [UMAREN] が必要です。</div>';return;}var tanRank=sortBy(data.tanfuku,'tan'),fukuRank=sortBy(data.tanfuku,'fuku'),umaRank=sortOdds(data.umaren),allHorses=uniq(data.tanfuku.map(function(x){return x.h;}));var topUma=umaRank[0]?umaRank[0].od:999,raceType='大荒れ戦';if(topUma<4)raceType='本命戦';else if(topUma<9)raceType='中荒れ戦';else if(topUma<15)raceType='荒れ戦';var mainWalls=detectWalls(data.umaren),zone=zonePairs(data.umaren,mainWalls),zoneH=pairHorses(zone),zoneM=mid(zoneH),tanM=mid(tanRank.map(function(x){return x.h;})),fukuM=midPair(fukuRank.map(function(x){return x.h;}));var fuku3=fukuRank.filter(function(x){return x.fuku<3;}).map(function(x){return x.h;}),fuku6=fukuFront(data.tanfuku,6),fuku10=fukuFront(data.tanfuku,10),fuku15=fukuFront(data.tanfuku,15),fuku15a=fukuAfter(data.tanfuku,15);var umaTop=countPair(data.umaren,10).slice(0,4).map(function(x){return x.h;}),sanTop=countTri(data.sanpuku,10).slice(0,4).map(function(x){return x.h;});var heroH=data.tanfuku.filter(function(x){return x.tan<=1.8&&x.fuku<=1.2;}).sort(function(a,b){return a.tan-b.tan;}).map(function(x){return x.h;});var semiHeroH=data.tanfuku.filter(function(x){return x.tan<=2.2&&x.fuku<=1.5&&heroH.indexOf(x.h)<0;}).sort(function(a,b){return a.tan-b.tan;}).map(function(x){return x.h;});var protectH=uniq(heroH.concat(semiHeroH));var release15=false;if(topUma>=9)release15=true;for(var r=0;r<fuku15.length;r++){var hh=fuku15[r],c=0;if(zoneH.indexOf(hh)>=0)c++;if(zoneM.indexOf(hh)>=0)c++;if(fuku6.indexOf(hh)>=0)c++;if(fuku10.indexOf(hh)>=0)c++;if(tanM.indexOf(hh)>=0)c++;if(fukuM.indexOf(hh)>=0)c++;if(c>=2)release15=true;}var doubleMedian=tanM.filter(function(h){return fukuM.indexOf(h)>=0;});var mainProtect=protectH[0]||null;var redTri=null,redTriH=[],redTriKey='',redTriOdds='';if(mainProtect&&data.sanpuku.length){var ss=sortOdds(data.sanpuku).slice(0,12);for(var ri=0;ri<ss.length;ri++){var tri=ss[ri];if(tri.od<=40&&[tri.a,tri.b,tri.c].indexOf(mainProtect)<0){redTri=tri;redTriH=[tri.a,tri.b,tri.c];redTriKey=tri.key;redTriOdds=tri.od;break;}}}var sanRescueH=countTri(data.sanpuku,12).map(function(x){return x.h;}).slice(0,8);var ctx={topUma:topUma,zoneH:zoneH,zoneM:zoneM,tanM:tanM,fukuM:fukuM,fuku3:fuku3,fuku6:fuku6,fuku10:fuku10,fuku15:fuku15,fuku15a:fuku15a,umaTop:umaTop,sanTop:sanTop,heroH:heroH,semiHeroH:semiHeroH,protectH:protectH,redTriH:redTriH,redTriKey:redTriKey,redTriOdds:redTriOdds,sanRescueH:sanRescueH,release15:release15,doubleMedian:doubleMedian,fuku3Lock:(protectH.length>0&&fuku3.length>=3&&fuku3.length<=4),fukuMedianPair:(topUma>=4&&fukuM.length>=2)};var rawScored=scoreAll(allHorses,data,ctx,false),rawBase=makeBaseAxisPartner(rawScored),scored=scoreAll(allHorses,data,ctx,true),finalPick=chooseFinal(rawBase,scored,rawScored,ctx);var axisH=finalPick.axisH,partnerH=finalPick.partnerH;var decision='見送り';if(axisH.length&&partnerH.length)decision='買う';else if(scored[0]&&scored[0].score>=10)decision='少額';var otani=makeOtaniRow(tanRank,umaRank,allHorses),otaniRow=otani.row,tanRow=tanRank.map(function(x){return x.h;}),fukuRow=fukuRank.map(function(x){return x.h;});var umaWallPos=wallPositionsForOtani(otani.items),tanWallPos=wallPositionsByOdds(tanRank,'tan'),fukuWallPos=fukuWallPositions(fukuRank),moves=detectMoves(otaniRow,tanRow,fukuRow);var html='';html+='<div class="card"><div class="title">'+data.title+'</div>';html+='🩺 レース診断：<span class="yellow">'+raceType+'</span><br>';html+='馬連1番人気：<span class="yellow">'+umaRank[0].key+' '+umaRank[0].od+'倍</span><br>';html+='結論：<span class="'+(decision==='買う'?'good':decision==='少額'?'yellow':'warn')+'">'+decision+'</span><br>';html+='選択モード：<span class="yellow">'+finalPick.mode+'</span>';html+='</div>';html+='<div class="card"><div class="title">🚨発動ランプ</div>';html+=(finalPick.lamps function makeCopyText(title,raceType,decision,axisH,partnerH,tickets,scored,lamps,mode){var t='';t+=title+'\n';t+='診断：'+raceType+' / '+decision+'\n';t+='選択モード：'+mode+'\n';if(lamps.length)t+='発動：'+lamps.join(' / ')+'\n';t+='◎ '+joinH(axisH)+'\n';t+='○ '+joinH(partnerH)+'\n\n';t+='ワイド\n'+tickets.wide.join('\n')+'\n\n';t+='馬連\n'+tickets.umaren.join('\n')+'\n\n';t+='三連複\n'+tickets.sanpuku.join('\n')+'\n\n';t+='最終候補\n';for(var i=0;i<Math.min(5,scored.length);i++){t+=(i+1)+'位 '+scored[i].h+'番【'+scored[i].score+'】 単'+scored[i].tan+' / 複'+scored[i].fuku+'\n';}return t;}
