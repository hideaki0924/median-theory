function addP(arr,a,b){if(a&&b&&a!==b)add(arr,pairKey(a,b));}
function addT(arr,a,b,c){if(a&&b&&c&&a!==b&&a!==c&&b!==c)add(arr,triKey(a,b,c));}
function makeTickets(ctx,ms,scored){var wide=[],uma=[],main=[],hole=[],bomb=[];if(ms.top){addP(wide,ms.top.h,ms.partner);addP(uma,ms.top.h,ms.partner);if(ms.tri)bomb.push(ms.tri);else addT(bomb,ctx.fav1,ms.top.h,ms.partner);}ctx.sanRank.slice(0,5).forEach(function(t){addT(main,t.a,t.b,t.c);});ms.place.slice(0,3).forEach(function(x){addT(hole,ctx.fav1,ctx.fav2,x.h);addT(hole,ctx.fav1,ctx.fav3,x.h);});ms.cut.slice(0,2).forEach(function(x){addT(bomb,ctx.fav1,ctx.fav2,x.h);});return{wide:uniq(wide).slice(0,4),uma:uniq(uma).slice(0,4),main:uniq(main).slice(0,6),hole:uniq(hole).slice(0,6),bomb:uniq(bomb).slice(0,6)};}
function detectMoveStrange(ctx,scored,diag){var out=[];var rows=[ctx.umaRow,ctx.tanRow,ctx.fukuRow,ctx.sanRow];scored.forEach(function(x){var h=x.h,tan=safeNum(x.tan),fuku=safeNum(x.fuku),r=x.reasons.join(' / '),added={};function push(no,name,reason){var key=no+'-'+h;if(!added[key]){out.push({no:no,h:h,name:name,reason:reason,score:x.score});added[key]=1;}}if(tan>=50&&fuku<=15)push(1,'単複ズレ大穴','単勝'+x.tan+'倍なのに複勝'+x.fuku+'倍で、単勝人気より複勝側が強い');if(fuku>=10&&fuku<=15&&x.tRank>=6)push(2,'複勝15倍壁末端','複勝10〜15倍台で人気下位。15倍壁の末端にいる');if(x.tRank>=5&&x.sanBest<=5)push(3,'三連複先行支持ジャンプ','単勝人気は低いのに三連複'+x.sanBest+'位以内に先に出ている');var samePos=0,top5=0;for(var i=0;i<5;i++){var hit=0;rows.forEach(function(row){if(row[i]===h)hit++;});if(hit>=2)samePos++;}rows.forEach(function(row){if(row.slice(0,5).indexOf(h)>=0)top5++;});if(samePos>=1||top5>=3)push(4,'縦揃い注意馬','本表の同じ位置、または上位5内に複数表で残る');if(h!==ctx.fav1&&ctx.tanRank[0]&&ctx.tanRank[0].tan<=2.0&&(x.sanBest<=8||r.indexOf('複勝6倍壁前')>=0||r.indexOf('複勝15倍壁前')>=0))push(5,'本命飛び時の保護馬','1番人気が強すぎる時の相手・保険候補として残る');});out.sort(function(a,b){if(a.no!==b.no)return a.no-b.no;if(b.score!==a.score)return b.score-a.score;return Number(a.h)-Number(b.h);});var seen={},res=[];out.forEach(function(x){var k=x.no+'-'+x.h;if(!seen[k]){seen[k]=1;res.push(x);}});return res.slice(0,12);}
function renderTop(data,ctx){return '<div class="card"><div class="title">'+data.title+'</div>単勝1人気：<span class="yellow">'+(ctx.tanRank[0]?ctx.tanRank[0].h+'番 '+ctx.tanRank[0].tan+'倍':'なし')+'</span><br>馬連1人気：<span class="yellow">'+(ctx.umaRank[0]?ctx.umaRank[0].key+' '+ctx.umaRank[0].od+'倍':'なし')+'</span><br>三連複1人気：<span class="yellow">'+(ctx.sanRank[0]?ctx.sanRank[0].key+' '+ctx.sanRank[0].od+'倍':'なし')+'</span></div>';}
function renderDiag(diag,ctx){var c=ctx.counts;var html='<div class="card '+(diag.hard||diag.wild?'diagWarn':'diag')+'"><div class="title">🩺レース診断</div>';html+='表面：<span class="'+diag.cls+'">'+diag.surface+'</span><br>裏診断：<span class="yellow">'+diag.back+'</span><br>まっちゃん判定：<span class="red">'+diag.matchanType+'</span><hr>';html+='単勝10倍未満：'+c.tanUnder10+'頭 / 単勝30倍未満：'+c.tanUnder30+'頭<br>';html+='複勝6倍以内：'+c.fukuUnder6+'頭 / 10倍以内：'+c.fukuUnder10+'頭 / 15倍以内：'+c.fukuUnder15+'頭<br>';html+='単勝10倍台メジアン：<span class="yellow">'+joinH(ctx.tan10M)+'</span><br>';html+='単勝20倍台メジアン：<span class="yellow">'+joinH(ctx.tan20M)+'</span><br>';html+='複勝12倍以下メジアン：<span class="blue">'+joinH(ctx.fuku12M)+'</span><br>';html+='複勝6壁前：<span class="yellow">'+joinH(ctx.w6.before)+'</span> / 複勝15壁前：<span class="orange">'+joinH(ctx.w15.before)+'</span></div>';return html;}
function renderMatchan(ms,diag,ctx){var html='<div class="card matchan"><div class="title">🔥まっちゃん単勝システム</div>';html+='最終タイプ：<span class="red">'+ms.type+'</span><br>';html+='<span class="small">上位ズレ単勝・三連複上位保護・複勝6/10/15壁前・馬連6位壁ゾーン・大穴単勝カット・100円保険を残した版です。</span><hr>';if(ms.top){html+='<div class="rankLine"><span class="badge">単勝候補 '+ms.top.h+'番</span> 単'+ms.top.tan+' / 複'+ms.top.fuku+'<br><span class="small">'+ms.top.reason.slice(0,8).join('・')+'</span></div>';html+='<pre>最終買い目\n単勝 '+ms.top.h+'　700円\nワイド '+pairKey(ms.top.h,ms.partner)+'　200円\n三連複 '+(ms.tri||triKey(ctx.fav1,ms.top.h,ms.partner))+'　100円</pre>';}else{html+='単勝厚張り候補なし<br>';}html+='<hr>3連複相手型：'+(ms.place.length?ms.place.map(function(x){return x.h+'番';}).join('・'):'なし')+'<br>';html+='大穴単勝カット：'+(ms.cut.length?ms.cut.map(function(x){return x.h+'番';}).join('・'):'なし')+'</div>';return html;}
function renderSwitch(sw){var html='<div class="card switch"><div class="title">🚨大穴スイッチ</div>判定：<span class="red">'+sw.level+'</span> / 最高 '+sw.score+'<hr>';if(!sw.items.length)html+='該当なし';else sw.items.forEach(function(x,i){html+='<div class="rankLine"><span class="badge">'+(i+1)+'位 '+x.h+'番【'+x.score+'】</span> <span class="small">単'+x.tan+' / 複'+x.fuku+'　'+x.reasons.slice(0,8).join('・')+'</span></div>';});html+='</div>';return html;}
function barClass(label,item,next,i,ctx){if(!item||!next)return 'bar';var od=safeNum(item.od),nod=safeNum(next.od);if(label==='複勝'&&i===ctx.w6.idx)return 'bar bar6';if(label==='複勝'&&i===ctx.w10.idx)return 'bar barGap';if(label==='複勝'&&i===ctx.w15.idx)return 'bar bar15';if(label==='単勝'&&i===ctx.w80.idx)return 'bar bar80';if(nod>=80&&od<80&&label==='単勝')return 'bar bar80';if(nod/Math.max(od,.1)>=2.0||nod-od>=8)return 'bar barGap';return 'bar';}
function renderHonRow(label,items,med,marks,maxLen,ctx){var arr=items.slice();while(arr.length<maxLen)arr.push({h:'',od:null});var html='<div class="honRow"><div class="honLabel">'+label+'</div>';for(var i=0;i<maxLen;i++){var h=arr[i].h,cls='honNum';if(!h)cls+=' honEmpty';else if((marks.w80||[]).indexOf(h)>=0)cls+=' wall80';else if((marks.w15||[]).indexOf(h)>=0)cls+=' wall15';else if((marks.w6||[]).indexOf(h)>=0)cls+=' wall6';else if(med.indexOf(h)>=0)cls+=' honMed';html+='<span class="'+cls+'">'+(h||'')+'</span>';if(i<maxLen-1)html+='<span class="'+barClass(label,arr[i],arr[i+1],i,ctx)+'"></span>';}html+='</div>';return html;}
function renderMoveSmall(moves){var labels={1:'単複ズレ大穴',2:'複勝15倍壁末端',3:'三連複先行支持ジャンプ',4:'縦揃い注意馬',5:'本命飛び時の保護馬'};var html='<div class="moveCard"><div class="small"><b>移動馬・変な動き馬</b></div><div class="legend">';[1,2,3,4,5].forEach(function(n){html+='<span class="leg"><span class="moveNo">'+n+'</span>'+labels[n]+'</span>';});html+='</div>';if(!moves.length){html+='<div class="moveLine"><span class="gray">該当なし</span></div>';}else{moves.forEach(function(x){html+='<div class="moveLine"><span class="moveNo">'+x.no+'</span><span class="moveHorse">'+x.h+'番 '+x.name+'</span>｜<span class="moveReason">'+x.reason+'</span></div>';});}html+='</div>';return html;}
function renderHonpyo(ctx,moves){var rows=[{l:'馬連',it:ctx.umaItems,m:ctx.umaM},{l:'単勝',it:ctx.tanItems,m:ctx.tanM},{l:'複勝',it:ctx.fukuItems,m:ctx.fukuM},{l:'三連複',it:ctx.sanItems,m:ctx.sanM},{l:'ワイド補助',it:ctx.wideItems,m:ctx.wideM}];var max=0;rows.forEach(function(x){if(x.it.length>max)max=x.it.length;});var marks={w80:uniq([].concat(ctx.w80.before,ctx.w80.after)),w15:uniq([].concat(ctx.w15.before,ctx.w15.after)),w6:uniq([].concat(ctx.w6.before,ctx.w6.after))};var html='<div class="card"><div class="title">本表・壁線色つき</div><div class="small">順番：馬連 → 単勝 → 複勝 → 三連複。ワイドは補助として最後に表示。</div><div class="honWrap">';rows.forEach(function(x){html+=renderHonRow(x.l,x.it,x.m,marks,max,ctx);});html+='</div><div class="legend"><span class="leg"><span class="legLine" style="background:#fde047"></span>複勝6倍壁</span><span class="leg"><span class="legLine" style="background:#fb923c"></span>複勝15倍壁</span><span class="leg"><span class="legLine" style="background:#f472b6"></span>単勝80倍壁</span><span class="leg"><span class="legLine" style="background:#67e8f9"></span>急なオッズ差</span></div>'+renderMoveSmall(moves)+'</div>';return html;}
function renderRank(scored){var html='<div class="card"><div class="title">候補ランキング</div>';scored.slice(0,10).forEach(function(x,i){html+='<div class="rankLine"><span class="badge">'+(i+1)+'位 '+x.h+'番【'+x.score+'】</span> <span class="small">単'+x.tan+' / 複'+x.fuku+'　'+x.reasons.slice(0,9).join('・')+'</span></div>';});html+='</div>';return html;}
function renderTickets(t){var html='<div class="card tickets"><div class="title">💰圧縮買い目</div><pre>';html+='ワイド\n'+(t.wide.length?t.wide.join('\n'):'なし')+'\n\n馬連\n'+(t.uma.length?t.uma.join('\n'):'なし')+'\n\n三連複・本線\n'+(t.main.length?t.main.join('\n'):'なし')+'\n\n三連複・穴相手\n'+(t.hole.length?t.hole.join('\n'):'なし')+'\n\n三連複・保険\n'+(t.bomb.length?t.bomb.join('\n'):'なし')+'\n\n※上位ズレ単勝が出た時は、単勝＋ワイド＋三連複1点を優先。3連単多点は原則カット。';html+='</pre></div>';return html;}
function makeCopyText(data,diag,ctx,ms,sw,tickets,scored,moves){var s=data.title+'\n競馬メジアン V2.33 まっちゃん単勝システム＋移動馬\n\n';s+='🩺レース診断\n表面：'+diag.surface+'\nまっちゃん判定：'+diag.matchanType+'\n単勝10倍未満：'+ctx.counts.tanUnder10+'頭\n単勝30倍未満：'+ctx.counts.tanUnder30+'頭\n複勝6倍以内：'+ctx.counts.fukuUnder6+'頭\n複勝10倍以内：'+ctx.counts.fukuUnder10+'頭\n複勝15倍以内：'+ctx.counts.fukuUnder15+'頭\n\n';s+='🔥まっちゃん単勝システム\n最終タイプ：'+ms.type+'\n';if(ms.top){s+='単勝候補：'+ms.top.h+'番 単'+ms.top.tan+' 複'+ms.top.fuku+'\n買い目：単勝 '+ms.top.h+' 700円 / ワイド '+pairKey(ms.top.h,ms.partner)+' 200円 / 三連複 '+(ms.tri||triKey(ctx.fav1,ms.top.h,ms.partner))+' 100円\n';}s+='3連複相手型：'+(ms.place.length?ms.place.map(function(x){return x.h+'番';}).join('・'):'なし')+'\n大穴単勝カット：'+(ms.cut.length?ms.cut.map(function(x){return x.h+'番';}).join('・'):'なし')+'\n\n';s+='移動馬・変な動き馬\n';if(!moves.length)s+='該当なし\n';else moves.forEach(function(x){s+=x.no+' '+x.h+'番 '+x.name+'｜'+x.reason+'\n';});s+='\n大穴スイッチ：'+sw.level+' / '+sw.score+'\n';s+='圧縮買い目\nワイド\n'+tickets.wide.join('\n')+'\n\n三連複・本線\n'+tickets.main.join('\n')+'\n\n三連複・保険\n'+tickets.bomb.join('\n')+'\n\n候補上位\n';scored.slice(0,8).forEach(function(x,i){s+=(i+1)+'位 '+x.h+'番【'+x.score+'】 単'+x.tan+' 複'+x.fuku+' '+x.reasons.slice(0,8).join('・')+'\n';});return s;}
function run(){try{var data=parseData(document.getElementById('input').value),out=document.getElementById('out');if(!data.tanfuku.length){out.innerHTML='<div class="card"><div class="title warn">入力不足</div>[TANFUKU] が必要です。</div>';return;}var ctx=makeContext(data),diag=makeRaceDiag(ctx),scored=scoreAll(data,ctx),sw=detectBigSwitch(ctx,scored),ms=makeMatchanSystem(ctx,scored,diag),tickets=makeTickets(ctx,ms,scored),moves=detectMoveStrange(ctx,scored,diag);var html='';html+=renderTop(data,ctx)+renderDiag(diag,ctx)+renderMatchan(ms,diag,ctx)+renderSwitch(sw)+renderHonpyo(ctx,moves)+renderRank(scored)+renderTickets(tickets);out.innerHTML=html;latestCopyText=makeCopyText(data,diag,ctx,ms,sw,tickets,scored,moves);}catch(e){document.getElementById('out').innerHTML='<div class="card"><div class="title warn">エラー</div><pre>'+String(e&&e.message?e.message:e)+'</pre></div>';}}

function clearAll(){document.getElementById('input').value='';document.getElementById('out').innerHTML='';latestCopyText='';}
function copyResult(){if(!latestCopyText){alert('先に解析してください');return;}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(latestCopyText).then(function(){alert('結果をコピーしました');}).catch(function(){fallbackCopy(latestCopyText);});}else fallbackCopy(latestCopyText);}
function fallbackCopy(text){var ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);alert('結果をコピーしました');}
