<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>チャッピー神予想 V6 復元版</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#07101f;color:#fff;padding:14px;font-size:18px}
textarea{width:100%;height:280px;font-size:17px;border-radius:10px;padding:10px;background:#fff;color:#000;box-sizing:border-box}
button{font-size:20px;padding:10px 14px;margin:6px 4px 6px 0;border-radius:12px;border:0;background:#22c55e;color:#fff}
.btn2{background:#3b82f6}.btn3{background:#64748b}.btn4{background:#f59e0b}
.box{background:#111827;border-radius:14px;padding:14px;margin:12px 0}
h1{font-size:26px}
h2{font-size:22px;border-bottom:1px solid #374151;padding-bottom:6px}
.green{color:#22c55e;font-weight:bold}.yellow{color:#facc15;font-weight:bold}.red{color:#fb7185;font-weight:bold}
.hot{color:#fb7185;font-size:24px;font-weight:bold}.gold{color:#facc15;font-size:24px;font-weight:bold}
.small{font-size:15px;color:#cbd5e1}
.raceTitle{font-size:30px;font-weight:bold;color:#facc15}
.rankWrap{overflow-x:auto;white-space:nowrap}
.row{margin:12px 0;font-size:24px;font-weight:bold}
.label{display:inline-block;width:80px;color:#cbd5e1;font-size:18px}
.cell{display:inline-block;min-width:34px;text-align:center;padding:4px 6px;border-right:1px solid #64748b}
.wallUma{border-right:3px solid #ff3b30}.wallWin{border-right:3px solid #3b82f6}.wallPlace{border-right:3px solid #facc15}
.indexCard{margin:10px 0;padding:10px;border-bottom:1px solid #374151}
.badge{display:inline-block;background:#1f2937;border-radius:8px;padding:4px 8px;margin:3px}
</style>
</head>

<body>

<h1>チャッピー神予想 V6 復元版</h1>

<div class="box">
<textarea id="input" placeholder="【レース名】

[TANFUKU]

[UMAREN]

[SANPUKU]"></textarea>
<br>
<button onclick="analyze()">解析</button>
<button class="btn2" onclick="testData()">テスト</button>
<button class="btn3" onclick="resetInput()">リセット</button>
<button class="btn4" onclick="copyResult()">結果コピー</button>
</div>

<div id="result"></div>

<script>
function norm(s){
  return s
    .replace(/[０-９]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0))
    .replace(/[－ー―–—]/g,"-")
    .replace(/[．]/g,".");
}

function parseInput(text){
  text=norm(text);
  const lines=text.split(/\n/).map(x=>x.trim()).filter(Boolean);
  let mode="";
  let raceName="レース名未入力";
  const tanpuku=[];
  const umaren=[];
  const sanpuku=[];

  for(const line of lines){
    if(line.match(/^【.*】$/)){
      const t=line.replace(/[【】]/g,"");
      if(!t.match(/TANFUKU|UMAREN|SANPUKU|単勝|複勝|馬連|馬複|三連複/i)){
        raceName=t;
      }
    }

    if(line.match(/TANFUKU|単勝|複勝/i)){
      mode="TANFUKU";
      continue;
    }
    if(line.match(/UMAREN|馬連|馬複/i)){
      mode="UMAREN";
      continue;
    }
    if(line.match(/SANPUKU|三連複/i)){
      mode="SANPUKU";
      continue;
    }

    const p=line.split(/\s+/);

    if(mode==="TANFUKU" && p.length>=3){
      const win=parseFloat(p[1]);
      const place=parseFloat(p[2]);
      if(!isNaN(win)&&!isNaN(place)){
        tanpuku.push({horse:p[0],win,place});
      }
    }

    if(mode==="UMAREN" && p.length>=2){
      const odds=parseFloat(p[1]);
      if(p[0].includes("-")&&!isNaN(odds)){
        umaren.push({pair:p[0],odds});
      }
    }

    if(mode==="SANPUKU" && p.length>=2){
      const odds=parseFloat(p[1]);
      if(p[0].includes("-")&&!isNaN(odds)){
        sanpuku.push({trio:p[0],odds});
      }
    }
  }

  return {raceName,tanpuku,umaren,sanpuku};
}

function classify(topOdds){
  if(topOdds<4)return{code:"honmei",cls:"green",title:"本命戦",reason:"馬連1番人気が4倍未満"};
  if(topOdds<9)return{code:"chuare",cls:"yellow",title:"中荒れ戦",reason:"馬連1番人気が4倍以上9倍未満"};
  if(topOdds<15)return{code:"are",cls:"red",title:"荒れ戦",reason:"馬連1番人気が9倍以上15倍未満"};
  return{code:"ooare",cls:"red",title:"大荒れ戦",reason:"馬連1番人気が15倍以上"};
}

function wallIndexes(list,key){
  const walls=new Set();
  for(let i=0;i<list.length-1;i++){
    const a=list[i][key];
    const b=list[i+1][key];
    if(a>0 && b/a>=1.8)walls.add(i);
  }
  return walls;
}

function medianHorses(list){
  if(!list.length)return[];
  const n=list.length;
  if(n%2===1)return [list[Math.floor(n/2)].horse];
  return [list[n/2-1].horse,list[n/2].horse];
}

function beforeWallHorses(list,walls){
  const s=new Set();
  walls.forEach(i=>{
    if(list[i])s.add(list[i].horse);
    if(list[i-1])s.add(list[i-1].horse);
  });
  return [...s];
}

function afterWallHorses(list,walls){
  const s=new Set();
  walls.forEach(i=>{
    if(list[i+1])s.add(list[i+1].horse);
    if(list[i+2])s.add(list[i+2].horse);
  });
  return [...s];
}

function placeWallBefore(placeRank,limit){
  const before=placeRank.filter(x=>x.place<limit);
  if(!before.length)return[];
  return before.slice(-2).map(x=>x.horse);
}

function placeWallAfter(placeRank,limit){
  const after=placeRank.filter(x=>x.place>=limit);
  if(!after.length)return[];
  return after.slice(0,2).map(x=>x.horse);
}
  function addScore(map,h,pt=1){
  if(!h)return;
  map[h]=(map[h]||0)+pt;
}

function topList(map,min=1){
  return Object.entries(map)
    .filter(([h,p])=>p>=min)
    .sort((a,b)=>b[1]-a[1])
    .map(([h,p])=>`${h}(${p})`);
}

function countMapAdd(map,h){
  if(!h)return;
  map[h]=(map[h]||0)+1;
}

function rankLine(label,list,walls,type){
  let wallClass="";
  if(type==="uma")wallClass="wallUma";
  if(type==="win")wallClass="wallWin";
  if(type==="place")wallClass="wallPlace";

  let html=`<div class="row"><span class="label">${label}</span>`;
  list.forEach((x,i)=>{
    const cls=walls.has(i)?`cell ${wallClass}`:"cell";
    html+=`<span class="${cls}">${x.horse}</span>`;
  });
  html+=`</div>`;
  return html;
}
function renderExtremeMoveAlert(umaList,winRank,placeRank){
  const umaRank={};
  const winMap={};
  const placeMap={};

  umaList.forEach((x,i)=>umaRank[x.horse]=i+1);
  winRank.forEach((x,i)=>winMap[x.horse]=i+1);
  placeRank.forEach((x,i)=>placeMap[x.horse]=i+1);

  const alerts=[];

  Object.keys(umaRank).forEach(h=>{
    if(winMap[h]){
      const diff=winMap[h]-umaRank[h];
      if(diff>=3)alerts.push(`${h}　単→馬 +${diff}`);
    }
    if(placeMap[h]){
      const diff=placeMap[h]-umaRank[h];
      if(diff>=3)alerts.push(`${h}　複→馬 +${diff}`);
    }
  });

  Object.keys(placeMap).forEach(h=>{
    if(winMap[h]){
      const diff=winMap[h]-placeMap[h];
      if(diff>=3)alerts.push(`${h}　単→複 +${diff}`);
    }
  });

  if(!alerts.length)return `<div class="small">極端移動：なし</div>`;

  return `<div style="margin-top:14px">
    <div class="hot">🚨極端移動</div>
    <div class="gold">${alerts.join("　")}</div>
  </div>`;
}
function otaniLine(winRank,umaren){
  if(!winRank.length||!umaren.length)return [];
  const axis=winRank[0].horse;
  const line=[axis];

  const sorted=[...umaren].sort((a,b)=>a.odds-b.odds);
  sorted.forEach(x=>{
    const [a,b]=x.pair.split("-");
    if(a===axis && !line.includes(b))line.push(b);
    if(b===axis && !line.includes(a))line.push(a);
  });

  return line;
}

function raceDiagnosis(winRank,placeRank,topUmaren){
  const race=classify(topUmaren.odds);

  const tan10=winRank.filter(x=>x.win<10).length;
  const tan30=winRank.filter(x=>x.win<30).length;
  const fuku3=placeRank.filter(x=>x.place<3).length;
  const fuku6=placeRank.filter(x=>x.place<6).length;
  const fuku10=placeRank.filter(x=>x.place<10).length;
  const fuku15=placeRank.filter(x=>x.place<15).length;

  const warnings=[];
  if(tan10>=6)warnings.push("7・8人気警報");
  if(tan30>=8)warnings.push("単勝30倍未満が多い混戦");
  if(fuku6>=7)warnings.push("複勝6倍未満が多い");
  if(topUmaren.odds>=9)warnings.push("荒れ注意");

  return {race,tan10,tan30,fuku3,fuku6,fuku10,fuku15,warnings};
}

function diagnosisBox(d,topUmaren){
  return `<div class="box">
    <h2>🩺レース診断</h2>
    <div>馬連1番人気：<b>${topUmaren.pair}</b> ${topUmaren.odds}倍</div>
    <div class="${d.race.cls}" style="font-size:28px">${d.race.title}</div>
    <div class="small">${d.race.reason}</div>
    <br>
    <div>単勝10倍未満：<b>${d.tan10}頭</b></div>
    <div>単勝30倍未満：<b>${d.tan30}頭</b></div>
    <div>複勝3倍未満：<b>${d.fuku3}頭</b></div>
    <div>複勝6倍未満：<b>${d.fuku6}頭</b></div>
    <div>複勝10倍未満：<b>${d.fuku10}頭</b></div>
    <div>複勝15倍未満：<b>${d.fuku15}頭</b></div>
    <br>
    <div class="hot">${d.warnings.length?d.warnings.join("・"):"特別警報なし"}</div>
  </div>`;
}

function favoriteTrustBox(winFav,sanpuku){
  if(winFav.win>=2){
    return `<div class="box">
      <h2>🎯単勝1人気信頼度</h2>
      <div class="small">単勝1番人気が1倍台の時だけ発動</div>
      <div>単勝1番人気：${winFav.horse}番（${winFav.win}倍）</div>
      <div class="yellow" style="font-size:24px;margin-top:8px">対象外</div>
    </div>`;
  }

  if(!sanpuku.length){
    return `<div class="box">
      <h2>🎯単勝1人気信頼度</h2>
      <div>単勝1番人気：${winFav.horse}番（${winFav.win}倍）</div>
      <div class="red">三連複データなし</div>
    </div>`;
  }

  const sorted=[...sanpuku].sort((a,b)=>a.odds-b.odds);
  let lastRank=0,lastOdds=0;

  for(let i=0;i<sorted.length;i++){
    const horses=sorted[i].trio.split("-");
    if(horses.includes(winFav.horse)){
      lastRank=i+1;
      lastOdds=sorted[i].odds;
    }else{
      break;
    }
  }

  let judge="危険",cls="red";
  if(lastRank>=10){judge="かなり信頼";cls="green";}
  else if(lastRank>=6){judge="普通〜信頼";cls="yellow";}

  const firstTrio=sorted[0]?sorted[0].trio:"なし";
  const firstOdds=sorted[0]?sorted[0].odds:"-";

  return `<div class="box">
    <h2>🎯単勝1人気信頼度</h2>
    <div>単勝1番人気：${winFav.horse}番（${winFav.win}倍）</div>
    <br>
    <div>三連複上位で残った順位：<b>${lastRank}位まで</b></div>
    <div>残ったオッズ：<b>${lastOdds?lastOdds+"倍まで":"なし"}</b></div>
    <div>三連複1番人気：<b>${firstTrio}</b>（${firstOdds}倍）</div>
    <div class="${cls}" style="font-size:26px;margin-top:10px">${judge}</div>
  </div>`;
}

function simpleBox(title,icon,items,cls="gold"){
  return `<div class="box">
    <h2>${icon}${title}</h2>
    <div class="${cls}">${items.length?items.join("・"):"該当なし"}</div>
  </div>`;
}
  
function renderRanks(sig){
  return `<div class="box">
    <h2>🧠階級判断</h2>
    <div class="hot">S：${sig.sRank.length?sig.sRank.join("・"):"該当なし"}</div>
    <div class="gold">A：${sig.aRank.length?sig.aRank.join("・"):"該当なし"}</div>
    <div class="yellow">B：${sig.bRank.length?sig.bRank.join("・"):"該当なし"}</div>
    <div class="small">C：${sig.cRank.length?sig.cRank.join("・"):"該当なし"}</div>
    <br>
    <div class="small">※点数ではなく、勝負ランプ・単勝案件・馬連壁前・複勝15倍壁前の重なりを優先</div>
  </div>`;
}
function buildSignals(winRank,placeRank,umaren,sanpuku){
  const topUmaren=[...umaren].sort((a,b)=>a.odds-b.odds)[0];
  const axis=winRank[0].horse;

  const otani=otaniLine(winRank,umaren);
  const otaniList=otani.map(h=>({horse:h,odds:0}));

  const winWalls=wallIndexes(winRank,"win");
  const placeWalls=wallIndexes(placeRank,"place");
  const otaniWalls=wallIndexes(
    otani.slice(1).map(h=>{
      const found=umaren.find(x=>x.pair.split("-").includes(axis)&&x.pair.split("-").includes(h));
      return {horse:h,odds:found?found.odds:9999};
    }),
    "odds"
  );

  const adjustedOtaniWalls=new Set([...otaniWalls].map(i=>i+1));

  const winBefore=beforeWallHorses(winRank,winWalls);
  const placeBefore=beforeWallHorses(placeRank,placeWalls);
  const umaBefore=beforeWallHorses(otaniList,adjustedOtaniWalls);

  const fuku10Before=placeWallBefore(placeRank,10);
  const fuku10After=placeWallAfter(placeRank,10);
  const fuku15Before=placeWallBefore(placeRank,15);

  const winMed=medianHorses(winRank);
  const placeMed=medianHorses(placeRank);
  const umaMed=medianHorses(otaniList);

  const tanshoScore={};
  [...winMed,...placeMed,...umaMed].forEach(h=>addScore(tanshoScore,h));
  winBefore.forEach(h=>addScore(tanshoScore,h));
  placeBefore.forEach(h=>addScore(tanshoScore,h));
  umaBefore.forEach(h=>addScore(tanshoScore,h));

  const gekisoScore={};
  fuku10Before.forEach(h=>addScore(gekisoScore,h,2));
  fuku15Before.forEach(h=>addScore(gekisoScore,h,2));
  umaBefore.forEach(h=>addScore(gekisoScore,h,1));
  winRank.filter(x=>x.win>=10&&x.win<=30).forEach(x=>addScore(gekisoScore,x.horse,1));

  const tanshoList=topList(tanshoScore,2);
  const gekisoList=topList(gekisoScore,2);

  const tanshoSet=new Set(tanshoList.map(x=>x.split("(")[0]));
  const gekisoSet=new Set(gekisoList.map(x=>x.split("(")[0]));

  const shobu=[...tanshoSet].filter(h=>gekisoSet.has(h));

  const allHorses=[...new Set(winRank.map(x=>x.horse))];

  const rankScore=[];

allHorses.forEach(h=>{
  let pt=0;
  let memo=[];

  if(shobu.includes(h)){ pt+=5; memo.push("勝負ランプ"); }
  if(tanshoSet.has(h)){ pt+=3; memo.push("単勝案件"); }
  if(gekisoSet.has(h)){ pt+=3; memo.push("超激走"); }
  if(umaBefore.includes(h)){ pt+=2; memo.push("馬連壁前"); }
  if(fuku15Before.includes(h)){ pt+=2; memo.push("複勝15壁前"); }
  if(fuku10Before.includes(h)){ pt+=1; memo.push("複勝10壁前"); }
  if(winBefore.includes(h)){ pt+=1; memo.push("単勝壁前"); }
  if(placeBefore.includes(h)){ pt+=1; memo.push("複勝自然壁前"); }

  rankScore.push({horse:h,pt,memo});
});

rankScore.sort((a,b)=>b.pt-a.pt);

const sRank=rankScore
  .filter(x=>x.pt>=7)
  .slice(0,3)
  .map(x=>x.horse);

const aRank=rankScore
  .filter(x=>x.pt>=4 && !sRank.includes(x.horse))
  .slice(0,4)
  .map(x=>x.horse);

const bRank=rankScore
  .filter(x=>x.pt>=1 && !sRank.includes(x.horse) && !aRank.includes(x.horse))
  .slice(0,2)
  .map(x=>x.horse);

const cRank=rankScore
  .filter(x=>!sRank.includes(x.horse) && !aRank.includes(x.horse) && !bRank.includes(x.horse))
  .map(x=>x.horse);
  const otaniStrong=otani.slice(0,5);
  const otaniWallBefore=umaBefore;

  return {
    topUmaren,
    axis,
    otani,
    otaniList,
    adjustedOtaniWalls,
    wallCount: adjustedOtaniWalls.size,
    rankScore,
    winWalls,
    placeWalls,
    winBefore,
    placeBefore,
    umaBefore,
    fuku10Before,
    fuku10After,
    fuku15Before,
    winMed,
    placeMed,
    umaMed,
    tanshoScore,
    gekisoScore,
    tanshoList,
    gekisoList,
    tanshoSet,
    gekisoSet,
    shobu,
    sRank,
    aRank,
    bRank,
    cRank,
    otaniStrong,
    otaniWallBefore
  };
}

function renderOtani(sig){
  const wallCount=sig.wallCount||0;
  const wallText=wallCount===0 ? "馬連壁：なし" : `馬連壁：${wallCount}枚`;

  return `<div class="box">
    <h2>🏇大谷式</h2>
    <div>${wallText}</div>
    <div>馬連壁前：<b class="gold">${sig.umaBefore.length?sig.umaBefore.join("・"):"なし"}</b></div>
    <div>壁前メジアン：<b class="gold">${wallCount===0?"なし":(sig.umaMed.length?sig.umaMed.join("・"):"なし")}</b></div>
  </div>`;
}
function countCenterIndex(umaren,sanpuku){
  const umaMap={};
  const sanMap={};

  umaren.forEach(x=>{
    x.pair.split("-").forEach(h=>countMapAdd(umaMap,h));
  });

  sanpuku.forEach(x=>{
    x.trio.split("-").forEach(h=>countMapAdd(sanMap,h));
  });

  const all=[...new Set([...Object.keys(umaMap),...Object.keys(sanMap)])];

  const total=all.map(h=>({
    horse:h,
    uma:umaMap[h]||0,
    san:sanMap[h]||0,
    total:(umaMap[h]||0)+(sanMap[h]||0)
  })).sort((a,b)=>b.total-a.total);

  return total;
}

function renderCenterIndex(list){
  return `<div class="box">
    <h2>🏆中心指数</h2>
    <div class="small">馬連上位＋三連複上位に何回出るか</div>
    ${list.slice(0,8).map(x=>`
      <div class="indexCard">
        <div class="${x.total>=10?'hot':x.total>=7?'gold':'green'}" style="font-size:24px">
          ${x.horse}番　${x.total}点
        </div>
        <div class="small">馬連 ${x.uma}回 / 三連複 ${x.san}回</div>
      </div>
    `).join("")}
  </div>`;
}
function renderIntegrated(sig,winRank){
  const main=sig.sRank[0] || sig.aRank[0] || sig.otaniStrong[0] || "-";
  const second=sig.sRank[1] || sig.aRank[1] || sig.otaniStrong[1] || "-";
  const third=sig.aRank[2] || sig.bRank[0] || sig.otaniStrong[2] || "-";

  return `<div class="box">
    <h2>🧠統合判断</h2>
    <div class="hot">◎ 最優先：${main}</div>
    <div class="gold">○ 相手筆頭：${second}</div>
    <div class="yellow">▲ 穴・3着候補：${third}</div>
    <div>△ 単勝1人気：${winRank[0].horse}</div>
    <br>
    <div class="small">優先順：Sランク → Aランク → 大谷式上位 → Bランク</div>
  </div>`;
}
  function analyze(){
  const {raceName,tanpuku,umaren,sanpuku}=parseInput(document.getElementById("input").value);
  const result=document.getElementById("result");

  if(tanpuku.length===0||umaren.length===0){
    result.innerHTML=`<div class="box red">単勝複勝と馬連を入れてください</div>`;
    return;
  }

  const winRank=[...tanpuku].sort((a,b)=>a.win-b.win);
  const placeRank=[...tanpuku].sort((a,b)=>a.place-b.place);
  const topUmaren=[...umaren].sort((a,b)=>a.odds-b.odds)[0];

  const diagnosis=raceDiagnosis(winRank,placeRank,topUmaren);
  const sig=buildSignals(winRank,placeRank,umaren,sanpuku);
　const centerIndex=countCenterIndex(umaren,sanpuku);
  result.innerHTML=`
    <div class="box"><div class="raceTitle">【${raceName}】</div></div>

    ${diagnosisBox(diagnosis,topUmaren)}
    ${favoriteTrustBox(winRank[0],sanpuku)}
    ${renderOtani(sig)}
    ${renderCenterIndex(centerIndex)}
    ${renderRanks(sig)}
    ${renderIntegrated(sig,winRank)}

    <div class="box">
      <h2>🔥勝負ランプ</h2>
      <div class="hot">${sig.shobu.length?sig.shobu.join("・"):"該当なし"}</div>

  if(!text){
    alert("コピーする結果がありません");
    return;
  }
  navigator.clipboard.writeText(text)
    .then(()=>alert("結果をコピーしました"))
    .catch(()=>alert("コピーできませんでした"));
}
