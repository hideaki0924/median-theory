<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>メジアン理論</title>
<style>
body{font-family:sans-serif;padding:18px;font-size:18px}
textarea{width:100%;height:260px;font-size:18px}
button{font-size:22px;padding:10px 20px;margin:15px 0}
.box{background:#fff3cd;border:2px solid #f0c36d;padding:12px;margin:15px 0;font-size:24px}
.result{font-size:20px;line-height:1.7}
b{font-size:22px}
</style>
</head>
<body>

<h1>メジアン理論</h1>

<p>入力形式：馬番 単勝 複勝上限</p>
<p>例：<br>2 1.3 1.2<br>3 8.6 2.9<br>8 9.5 2.6</p>

<textarea id="data"></textarea>
<button onclick="calc()">計算</button>

<div id="result" class="result"></div>

<script>
function medianPick(list){
  list=list.slice().sort((a,b)=>a.odds-b.odds);
  const n=list.length;
  if(n===0)return null;
  const mid=Math.floor(n/2);
  if(n%2===1){
    return {horses:[list[mid]], value:list[mid].odds};
  }else{
    return {horses:[list[mid-1],list[mid]], value:((list[mid-1].odds+list[mid].odds)/2).toFixed(2)};
  }
}

function addCount(count, horses){
  horses.forEach(h=>{
    count[h.num]=(count[h.num]||0)+1;
  });
}

function calc(){
  const rows=document.getElementById("data").value.trim().split(/\n+/).map(line=>{
    const p=line.trim().split(/\s+/);
    return {
      num:p[0],
      win:parseFloat(p[1]),
      place:parseFloat(p[2])
    };
  }).filter(x=>x.num && !isNaN(x.win));

  let count={};
  let html="<h2>結果</h2>";

  const winRows=rows.map(x=>({num:x.num,odds:x.win}));
  const placeRows=rows.filter(x=>!isNaN(x.place)).map(x=>({num:x.num,odds:x.place}));

  const groups=[
    ["単勝全体メジアン", winRows],
    ["単勝20倍以内メジアン", winRows.filter(x=>x.odds<=20)],
    ["単勝99倍以内メジアン", winRows.filter(x=>x.odds<=99)],
    ["単勝100倍以上メジアン", winRows.filter(x=>x.odds>=100)],
    ["複勝全体メジアン", placeRows],
    ["複勝12倍以内メジアン", placeRows.filter(x=>x.odds<=12)],
    ["複勝6倍以上メジアン", placeRows.filter(x=>x.odds>=6)],
    ["複勝15倍以内メジアン", placeRows.filter(x=>x.odds<=15)]
  ];

  groups.forEach(([name,list])=>{
    const r=medianPick(list);
    if(!r){
      html+=`<p>${name}：該当なし</p>`;
      return;
    }
    addCount(count,r.horses);
    html+=`<p><b>${name}</b><br>馬番：${r.horses.map(h=>h.num).join("・")}<br>メジアン値：${r.value}</p>`;
  });

  const ranking=Object.entries(count).sort((a,b)=>b[1]-a[1]);
  const top=ranking.filter(x=>x[1]===ranking[0]?.[1]).map(x=>x[0]);

  html=`<div class="box">★注目馬：${top.join("・")}<br>重複数：${ranking[0]?.[1]||0}回</div>`+html;

  html+="<h2>重複ランキング</h2>";
  ranking.forEach(([num,c])=>{
    html+=`<p>${num}番：${c}回</p>`;
  });

  document.getElementById("result").innerHTML=html;
}
</script>

</body>
</html>
