<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>メジアン理論</title>
<style>
body{font-family:sans-serif;padding:18px;font-size:18px}
textarea{width:100%;height:230px;font-size:18px}
button{font-size:22px;padding:10px 20px;margin:15px 0}
.box{background:#fff3cd;border:2px solid #f0c36d;padding:12px;margin:15px 0;font-size:24px}
.wall{background:#e8f4ff;border:2px solid #5aa9e6;padding:12px;margin:15px 0;font-size:21px}
.break{background:#ffe8e8;border:2px solid #e66;padding:12px;margin:15px 0;font-size:22px}
.umaren{background:#eef9ee;border:2px solid #66aa66;padding:12px;margin:15px 0;font-size:21px}
.result{font-size:20px;line-height:1.7}
b{font-size:22px}
</style>
</head>
<body>

<h1>メジアン理論</h1>

<p>単勝・複勝入力：馬番 単勝 複勝上限</p>
<textarea id="data" placeholder="例
7 2.7 1.7
3 3.2 2.1
4 4.7 1.8"></textarea>

<p>馬連・馬複入力：組み合わせ オッズ</p>
<textarea id="umaren" placeholder="例
3-7 4.5
3-4 4.6
4-7 6.1"></textarea>

<button onclick="calc()">計算</button>

<div id="result" class="result"></div>

<script>
function medianPick(list){
  list=list.slice().sort((a,b)=>a.odds-b.odds);
  const n=list.length;
  if(n===0)return null;
  const mid=Math.floor(n/2);
  if(n%2===1){
    const v=list[mid].odds;
    return {items:list.filter(x=>x.odds===v), value:v};
  }else{
    return {
      items:[list[mid-1],list[mid]],
      value:((list[mid-1].odds+list[mid].odds)/2).toFixed(2)
    };
  }
}

function addCount(count,items){
  items.forEach(h=>{
    if(h.num){
      count[h.num]=(count[h.num]||0)+1;
    }
    if(h.a && h.b){
      count[h.a]=(count[h.a]||0)+1;
      count[h.b]=(count[h.b]||0)+1;
    }
  });
}

function nums(list){
  return list.map(x=>{
    if(x.num)return x.num;
    if(x.a && x.b)return x.a+"-"+x.b;
    return "";
  }).join("・");
}

function pairNums(list){
  let arr=[];
  list.forEach(x=>{
    if(x.a && x.b){
      arr.push(x.a);
      arr.push(x.b);
    }
  });
  return [...new Set(arr)].join("・");
}

function wallAround(list,wall){
  const s=list.slice().sort((a,b)=>a.odds-b.odds);
  const i=s.findIndex(x=>x.odds>=wall);
  if(i<0)return [];
  return s.slice(Math.max(0,i-2),Math.min(s.length,i+2));
}

function wallBreak(list,wall){
  const s=list.slice().sort((a,b)=>a.odds-b.odds);
  const i=s.findIndex(x=>x.odds>=wall);
  if(i<0)return null;
  return {
    before:s[i-1]||null,
    breakHorse:s[i],
    after:s[i+1]||null
  };
}

function parsePairs(text){
  return text.trim().split(/\n+/).map(line=>{
    const p=line.trim().split(/\s+/);
    const pair=p[0].split("-");
    return {
      a:pair[0],
      b:pair[1],
      odds:parseFloat(p[1])
    };
  }).filter(x=>x.a && x.b && !isNaN(x.odds));
}

function calc(){
  const rows=document.getElementById("data").value.trim().split(/\n+/).map(line=>{
    const p=line.trim().split(/\s+/);
    return {num:p[0],win:parseFloat(p[1]),place:parseFloat(p[2])};
  }).filter(x=>x.num && !isNaN(x.win));

  const pairRows=parsePairs(document.getElementById("umaren").value);

  const winRows=rows.map(x=>({num:x.num,odds:x.win}));
  const placeRows=rows.filter(x=>!isNaN(x.place)).map(x=>({num:x.num,odds:x.place}));

  const place6WallFromFavorite=(()=>{
    const s=placeRows.slice().sort((a,b)=>a.odds-b.odds);
    const i=s.findIndex(x=>x.odds>=6);
    if(i<0)return [];
    return s.slice(0,Math.max(0,i-2));
  })();

  const place15Before2To6Over=(()=>{
    const s=placeRows.slice().sort((a,b)=>a.odds-b.odds);
    const i=s.findIndex(x=>x.odds>=15);
    if(i<0)return [];
    const start=Math.max(0,i-2);
    return s.slice(start).filter(x=>x.odds>=6);
  })();

  const groups=[
    ["単勝10倍以上メジアン", winRows.filter(x=>x.odds>=10)],
    ["単勝99倍以内メジアン", winRows.filter(x=>x.odds<=99)],
    ["単勝100倍以上メジアン", winRows.filter(x=>x.odds>=100)],
    ["単勝全体メジアン", winRows],
    ["複勝6倍壁前2頭1番人気からのメジアン", place6WallFromFavorite],
    ["複勝15倍前二頭から6倍以上メジアン", place15Before2To6Over],
    ["複勝12倍以内メジアン", placeRows.filter(x=>x.odds<=12)],
    ["複勝全体メジアン", placeRows]
  ];

  const pairGroups=[
    ["馬連全体メジアン", pairRows],
    ["馬連10倍以上メジアン", pairRows.filter(x=>x.odds>=10)],
    ["馬連30倍以内メジアン", pairRows.filter(x=>x.odds<=30)]
  ];

  let count={};
  let html="<h2>結果</h2>";

  groups.forEach(([name,list])=>{
    const r=medianPick(list);
    if(!r){
      html+=`<p>${name}：該当なし</p>`;
      return;
    }
    addCount(count,r.items);
    html+=`<p><b>${name}</b><br>馬番：${nums(r.items)}<br>メジアン値：${r.value}</p>`;
  });

  let pairHtml="";
  pairGroups.forEach(([name,list])=>{
    const r=medianPick(list);
    if(!r){
      pairHtml+=`<p>${name}：該当なし</p>`;
      return;
    }
    addCount(count,r.items);
    pairHtml+=`<p><b>${name}</b><br>組：${nums(r.items)}<br>構成馬：${pairNums(r.items)}<br>メジアン値：${r.value}</p>`;
  });

  const ranking=Object.entries(count).sort((a,b)=>b[1]-a[1]);
  const topCount=ranking[0]?.[1]||0;
  const top=ranking.filter(x=>x[1]===topCount).map(x=>x[0]);

  const win20Wall=wallAround(winRows,20);
  const place6Wall=wallAround(placeRows,6);
  const place12Wall=wallAround(placeRows,12);
  const place15Wall=wallAround(placeRows,15);

  const p6=wallBreak(placeRows,6);
  const p12=wallBreak(placeRows,12);
  const p15=wallBreak(placeRows,15);
  const w20=wallBreak(winRows,20);

  html=`<div class="box">★注目馬：${top.join("・")}<br>重複数：${topCount}回</div>`+html;

  html+=`<div class="break"><b>★壁突破馬</b><br>
単勝20倍突破馬：${w20 ? w20.breakHorse.num+"番（"+w20.breakHorse.odds+"）" : "該当なし"}<br>
複勝6倍突破馬：${p6 ? p6.breakHorse.num+"番（"+p6.breakHorse.odds+"）" : "該当なし"}<br>
複勝12倍突破馬：${p12 ? p12.breakHorse.num+"番（"+p12.breakHorse.odds+"）" : "該当なし"}<br>
複勝15倍突破馬：${p15 ? p15.breakHorse.num+"番（"+p15.breakHorse.odds+"）" : "該当なし"}
</div>`;

  html+=`<div class="wall"><b>★境目・壁前後</b><br>
単勝20倍壁前後：${nums(win20Wall)||"該当なし"}<br>
複勝6倍壁前後：${nums(place6Wall)||"該当なし"}<br>
複勝12倍壁前後：${nums(place12Wall)||"該当なし"}<br>
複勝15倍壁前後：${nums(place15Wall)||"該当なし"}
</div>`;

  html+=`<div class="umaren"><b>★馬連メジアン</b><br>${pairHtml}</div>`;

  html+="<h2>重複ランキング</h2>";
  ranking.forEach(([num,c])=>{
    html+=`<p>${num}番：${c}回</p>`;
  });

  document.getElementById("result").innerHTML=html;
}
</script>

</body>
</html>
