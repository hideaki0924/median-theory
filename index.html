<html lang="ja">
<head>
<meta charset="UTF-8">

<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;
  background:linear-gradient(180deg,#031225,#08244a,#031225);

.label{
  display:inline-block;

  background:#020617;

}

  font-size:26px;

}

  color:#dbeafe;

<body>

<h1>チャッピー神予想 V8</h1>

<div class="box">
<textarea id="input" placeholder="【レース名】

[TANFUKU]

[UMAREN]

[WIDE]

[SANPUKU]"></textarea>
<br>
<button onclick="analyze()">解析</button>
<button class="btn2" onclick="testData()">テスト</button>
<button class="btn3" onclick="resetInput()">リセット</button>
<button class="btn4" onclick="copyResult()">結果コピー</button>
</div>

<div id="result"></div>

<script>
function norm(s){
  return s
    .replace(/[０-９]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0))
    .replace(/[－ー―–—]/g,"-")
    .replace(/[．]/g,".");
}

function parseInput(text){
  text=norm(text);
  const lines=text.split(/\n/).map(x=>x.trim()).filter(Boolean);

  let mode="";
  let raceName="レース名未入力";

  const tanpuku=[];
  const umaren=[];
  const wide=[];
  const sanpuku=[];

  for(const line of lines){
    if(line.match(/^【.*】$/)){
      const t=line.replace(/[【】]/g,"");
      if(!t.match(/TANFUKU|UMAREN|WIDE|SANPUKU|単勝|複勝|馬連|馬複|ワイド|三連複/i)){
        raceName=t;
      }
      continue;
    }

    if(line.match(/TANFUKU|単勝|複勝/i)){
      mode="TANFUKU";
      continue;
    }
    if(line.match(/UMAREN|馬連|馬複/i)){
      mode="UMAREN";
      continue;
    }
    if(line.match(/WIDE|ワイド/i)){
      mode="WIDE";
      continue;
    }
    if(line.match(/SANPUKU|三連複/i)){
      mode="SANPUKU";
      continue;
    }

    const p=line.split(/\s+/);

    if(mode==="TANFUKU" && p.length>=3){
      const win=parseFloat(p[1]);
      const place=parseFloat(p[2]);
      if(!isNaN(win)&&!isNaN(place)){
        tanpuku.push({horse:p[0],win,place});
      }
    }

    if(mode==="UMAREN" && p.length>=2){
      const odds=parseFloat(p[1]);
      if(p[0].includes("-")&&!isNaN(odds)){
        umaren.push({pair:p[0],odds});
      }
    }

    if(mode==="WIDE" && p.length>=2){
      const odds=parseFloat(p[1]);
      if(p[0].includes("-")&&!isNaN(odds)){
        wide.push({pair:p[0],odds});
      }
    }

    if(mode==="SANPUKU" && p.length>=2){
      const odds=parseFloat(p[1]);
      if(p[0].includes("-")&&!isNaN(odds)){
        sanpuku.push({trio:p[0],odds});
      }
    }
  }

  return {raceName,tanpuku,umaren,wide,sanpuku};
}
  function classify(topOdds){
  if(topOdds<4)return{code:"honmei",cls:"green",title:"本命戦",reason:"馬連1番人気が4倍未満"};
  if(topOdds<9)return{code:"chuare",cls:"yellow",title:"中荒れ戦",reason:"馬連1番人気が4倍以上9倍未満"};
  if(topOdds<15)return{code:"are",cls:"red",title:"荒れ戦",reason:"馬連1番人気が9倍以上15倍未満"};
  return{code:"ooare",cls:"red",title:"大荒れ戦",reason:"馬連1番人気が15倍以上"};
}

function wallIndexes(list,key){
  const walls=new Set();
  for(let i=0;i<list.length-1;i++){
    const a=list[i][key];
    const b=list[i+1][key];
    if(a>0 && b/a>=1.8)walls.add(i);
  }
  return walls;
}

function medianHorses(list){
  if(!list.length)return[];
  const n=list.length;
  if(n%2===1)return [list[Math.floor(n/2)].horse];
  return [list[n/2-1].horse,list[n/2].horse];
}

function addScore(map,h,pt=1){
  if(!h)return;
  map[h]=(map[h]||0)+pt;
}

function countMapAdd(map,h){
  if(!h)return;
  map[h]=(map[h]||0)+1;
}

function topList(map,min=1){
  return Object.entries(map)
    .filter(([h,p])=>p>=min)
    .sort((a,b)=>b[1]-a[1])
    .map(([h,p])=>`${h}(${p})`);
}

function intersect(a,b){
  return [...new Set(a)].filter(x=>new Set(b).has(x));
}

function beforeWallHorses(list,walls){
  const s=new Set();
  walls.forEach(i=>{
    if(list[i])s.add(list[i].horse);
    if(list[i-1])s.add(list[i-1].horse);
  });
  return [...s];
}

function placeWallBefore(placeRank,limit){
  const before=placeRank.filter(x=>x.place<limit);
  if(!before.length)return[];
  return before.slice(-2).map(x=>x.horse);
}

function placeWallAfter(placeRank,limit){
  const after=placeRank.filter(x=>x.place>=limit);
  if(!after.length)return[];
  return after.slice(0,2).map(x=>x.horse);
}

function rankLine(label,list,walls,type,highlight=[]){
  let wallClass="";
  if(type==="uma")wallClass="wallUma";
  if(type==="win")wallClass="wallWin";
  if(type==="place")wallClass="wallPlace";

  let html=`<div class="row"><span class="label">${label}</span>`;
  list.forEach((x,i)=>{
    let cls=walls.has(i)?`cell ${wallClass}`:"cell";
    let style=highlight.includes(x.horse) ? ` style="color:#fb7185;font-weight:900"` : "";
    html+=`<span class="${cls}"${style}>${x.horse}</span>`;
  });
  html+=`</div>`;
  return html;
}

function otaniLine(winRank,umaren){
  if(!winRank.length||!umaren.length)return [];
  const axis=winRank[0].horse;
  const line=[axis];

  const sorted=[...umaren].sort((a,b)=>a.odds-b.odds);
  sorted.forEach(x=>{
    const [a,b]=x.pair.split("-");
    if(a===axis && !line.includes(b))line.push(b);
    if(b===axis && !line.includes(a))line.push(a);
  });

  return line;
}

function raceDiagnosis(winRank,placeRank,topUmaren){
  const race=classify(topUmaren.odds);

  const tan10=winRank.filter(x=>x.win<10).length;
  const tan30=winRank.filter(x=>x.win<30).length;
  const fuku3=placeRank.filter(x=>x.place<3).length;
  const fuku6=placeRank.filter(x=>x.place<6).length;
  const fuku10=placeRank.filter(x=>x.place<10).length;
  const fuku15=placeRank.filter(x=>x.place<15).length;

  const warnings=[];
  if(tan10>=6)warnings.push("7・8人気警報");
  if(tan30>=8)warnings.push("単勝30倍未満が多い混戦");
  if(fuku6>=7)warnings.push("複勝6倍未満が多い");
  if(topUmaren.odds>=9)warnings.push("荒れ注意");

  return {race,tan10,tan30,fuku3,fuku6,fuku10,fuku15,warnings};
}

function diagnosisBox(d,topUmaren){
  return `<div class="box">
    <h2>🩺レース診断</h2>
    <div>馬連1番人気：<b>${topUmaren.pair}</b> ${topUmaren.odds}倍</div>
    <div class="${d.race.cls}" style="font-size:28px">${d.race.title}</div>
    <div class="small">${d.race.reason}</div>
    <br>
    <div>単勝10倍未満：<b>${d.tan10}頭</b></div>
    <div>単勝30倍未満：<b>${d.tan30}頭</b></div>
    <div>複勝3倍未満：<b>${d.fuku3}頭</b></div>
    <div>複勝6倍未満：<b>${d.fuku6}頭</b></div>
    <div>複勝10倍未満：<b>${d.fuku10}頭</b></div>
    <div>複勝15倍未満：<b>${d.fuku15}頭</b></div>
    <br>
    <div class="hot">${d.warnings.length?d.warnings.join("・"):"特別警報なし"}</div>
  </div>`;
}
  function favoriteTrustBox(winFav,sanpuku){
  if(winFav.win>=2){
    return `<div class="box">
      <h2>🎯単勝1人気信頼度</h2>
      <div class="small">単勝1番人気が1倍台の時だけ発動</div>
      <div>単勝1番人気：${winFav.horse}番（${winFav.win}倍）</div>
      <div class="yellow" style="font-size:24px;margin-top:8px">対象外</div>
    </div>`;
  }

  if(!sanpuku.length){
    return `<div class="box">
      <h2>🎯単勝1人気信頼度</h2>
      <div>単勝1番人気：${winFav.horse}番（${winFav.win}倍）</div>
      <div class="red">三連複データなし</div>
    </div>`;
  }

  const sorted=[...sanpuku].sort((a,b)=>a.odds-b.odds);
  let lastRank=0,lastOdds=0;

  for(let i=0;i<sorted.length;i++){
    const horses=sorted[i].trio.split("-");
    if(horses.includes(winFav.horse)){
      lastRank=i+1;
      lastOdds=sorted[i].odds;
    }else{
      break;
    }
  }

  let judge="危険",cls="red";
  if(lastRank>=10){judge="かなり信頼";cls="green";}
  else if(lastRank>=6){judge="普通〜信頼";cls="yellow";}

  const firstTrio=sorted[0]?sorted[0].trio:"なし";
  const firstOdds=sorted[0]?sorted[0].odds:"-";

  return `<div class="box">
    <h2>🎯単勝1人気信頼度</h2>
    <div>単勝1番人気：${winFav.horse}番（${winFav.win}倍）</div>
    <br>
    <div>三連複上位で残った順位：<b>${lastRank}位まで</b></div>
    <div>残ったオッズ：<b>${lastOdds?lastOdds+"倍まで":"なし"}</b></div>
    <div>三連複1番人気：<b>${firstTrio}</b>（${firstOdds}倍）</div>
    <div class="${cls}" style="font-size:26px;margin-top:10px">${judge}</div>
  </div>`;
}

function buildOtaniZone(winRank,umaren){
  const axis=winRank[0].horse;
  const otani=otaniLine(winRank,umaren);

  const oddsList=otani.slice(1).map(h=>{
    const found=umaren.find(x=>{
      const p=x.pair.split("-");
      return p.includes(axis)&&p.includes(h);
    });
    return {horse:h,odds:found?found.odds:9999};
  });

  const otaniList=[{horse:axis,odds:0},...oddsList];
  const rawWalls=wallIndexes(oddsList,"odds");
  const walls=new Set([...rawWalls].map(i=>i+1));
  const wallArr=[...walls].sort((a,b)=>a-b);

  let wallText="馬連壁：なし";
  let zone=[];
  let zoneMed=[];
  let wallBefore=[];
  let firstWallGroup=[];
  let firstWallMed=[];

  if(wallArr.length===0){
    wallText="馬連壁：なし";
  }else{
    const w=wallArr[0];
    firstWallGroup=otaniList.slice(0,w+1);
    firstWallMed=medianHorses(firstWallGroup);
    wallBefore=firstWallGroup.slice(-2).map(x=>x.horse);
    zone=firstWallGroup;
    zoneMed=firstWallMed;
    wallText=`馬連壁：${wallArr.length}枚`;
  }

  return {
    axis,
    otani,
    otaniList,
    walls,
    wallCount:wallArr.length,
    wallText,
    zone,
    zoneMed,
    wallBefore,
    firstWallGroup,
    firstWallMed
  };
}

function buildSignals(winRank,placeRank,umaren,sanpuku){
  const ot=buildOtaniZone(winRank,umaren);

  const winWalls=wallIndexes(winRank,"win");
  const placeWalls=wallIndexes(placeRank,"place");

  const winBefore=beforeWallHorses(winRank,winWalls);
  const placeBefore=beforeWallHorses(placeRank,placeWalls);

  const fuku10Before=placeWallBefore(placeRank,10);
  const fuku10After=placeWallAfter(placeRank,10);
  const fuku15Before=placeWallBefore(placeRank,15);
  const fuku15After=placeWallAfter(placeRank,15);
  const winMed=medianHorses(winRank);
  const placeMed=medianHorses(placeRank);
  const umaMed=ot.zoneMed;

  const tanshoScore={};
  [...winMed,...placeMed,...umaMed].forEach(h=>addScore(tanshoScore,h))
  winBefore.forEach(h=>addScore(tanshoScore,h));
  placeBefore.forEach(h=>addScore(tanshoScore,h));
  ot.wallBefore.forEach(h=>addScore(tanshoScore,h));

  const gekisoScore={};
  fuku10Before.forEach(h=>addScore(gekisoScore,h,2));
  fuku15Before.forEach(h=>addScore(gekisoScore,h,2));
  ot.wallBefore.forEach(h=>addScore(gekisoScore,h,1));
  winRank.filter(x=>x.win>=10&&x.win<=30).forEach(x=>addScore(gekisoScore,x.horse,1));

  const tanshoList=topList(tanshoScore,2);
  const gekisoList=topList(gekisoScore,2);

  const tanshoSet=new Set(tanshoList.map(x=>x.split("(")[0]));
  const gekisoSet=new Set(gekisoList.map(x=>x.split("(")[0]));
  const shobu=[...tanshoSet].filter(h=>gekisoSet.has(h));

  const allHorses=[...new Set(winRank.map(x=>x.horse))];
  const rankScore=[];

  allHorses.forEach(h=>{
    let pt=0;
    let memo=[];

    if(shobu.includes(h)){pt+=5;memo.push("勝負ランプ");}
    if(tanshoSet.has(h)){pt+=3;memo.push("単勝案件");}
    if(gekisoSet.has(h)){pt+=3;memo.push("超激走");}
    if(ot.wallBefore.includes(h)){pt+=2;memo.push("馬連壁前");}
    if(fuku15Before.includes(h)){pt+=2;memo.push("複勝15壁前");}
    if(fuku10Before.includes(h)){pt+=1;memo.push("複勝10壁前");}
    if(winBefore.includes(h)){pt+=1;memo.push("単勝壁前");}
    if(placeBefore.includes(h)){pt+=1;memo.push("複勝自然壁前");}

    rankScore.push({horse:h,pt,memo});
  });

  rankScore.sort((a,b)=>b.pt-a.pt);

  const sRank=rankScore.filter(x=>x.pt>=7).slice(0,3).map(x=>x.horse);
  const aRank=rankScore.filter(x=>x.pt>=4&&!sRank.includes(x.horse)).slice(0,4).map(x=>x.horse);
  const bRank=rankScore.filter(x=>x.pt>=1&&!sRank.includes(x.horse)&&!aRank.includes(x.horse)).slice(0,2).map(x=>x.horse);
  const cRank=rankScore.filter(x=>!sRank.includes(x.horse)&&!aRank.includes(x.horse)&&!bRank.includes(x.horse)).map(x=>x.horse);

  return {
    ot,winWalls,placeWalls,winBefore,placeBefore,
    fuku10Before,fuku10After,fuku15Before,fuku15After,
    winMed,placeMed,umaMed,
    tanshoScore,gekisoScore,tanshoList,gekisoList,
    tanshoSet,gekisoSet,shobu,rankScore,
    sRank,aRank,bRank,cRank
  };
}
  function countCenterIndex(umaren,sanpuku){
  const umaMap={};
  const sanMap={};

  umaren.forEach(x=>{
    x.pair.split("-").forEach(h=>countMapAdd(umaMap,h));
  });

  sanpuku.forEach(x=>{
    x.trio.split("-").forEach(h=>countMapAdd(sanMap,h));
  });

  const all=[...new Set([...Object.keys(umaMap),...Object.keys(sanMap)])];

  return all.map(h=>({
    horse:h,
    uma:umaMap[h]||0,
    san:sanMap[h]||0,
    total:(umaMap[h]||0)+(sanMap[h]||0)
  })).sort((a,b)=>b.total-a.total);
}

function countWideIndex(wide){
  const map={};

  wide.forEach(x=>{
    x.pair.split("-").forEach(h=>countMapAdd(map,h));
  });

  return map;
}

function createTotalKing(centerList,wideMap){
  return centerList.map(x=>({
    horse:x.horse,
    center:x.total,
    wide:wideMap[x.horse]||0,
    total:x.total+(wideMap[x.horse]||0)
  })).sort((a,b)=>b.total-a.total);
}

function renderOtani(sig){
  const ot=sig.ot;
  const firstGroup=ot.firstWallGroup.map(x=>x.horse);

  return `<div class="box">
    <h2>🏇大谷式 馬連壁</h2>
    <div>${ot.wallText}</div>
    <div>壁前：<b class="gold">${ot.wallBefore.length?ot.wallBefore.join("・"):"なし"}</b></div>
    <div>1番人気〜壁前：<b class="gold">${firstGroup.length?firstGroup.join("・"):"なし"}</b></div>
    <div>壁内メジアン：<b class="hot">${ot.firstWallMed.length?ot.firstWallMed.join("・"):"なし"}</b></div>
    <div class="small">※壁前と1番人気までを優先表示</div>
  </div>`;
}

function renderSA(sig){
  const fuku10=sig.fuku10Before||[];
  const fuku15=sig.fuku15Before||[];
  const umaBefore=sig.ot.wallBefore||[];
  const wallMed=sig.ot.firstWallMed||[];

  const tansho=[...sig.tanshoSet];
  const gekiso=[...sig.gekisoSet];

  const superLamp=intersect(gekiso,fuku10);
  const umaFuku=intersect(umaBefore,fuku10);
  const umaTansho=intersect(umaBefore,tansho);
  const umaGekiso=intersect(umaBefore,gekiso);

  const axis=[...new Set([
    ...superLamp,
    ...umaFuku,
    ...umaTansho,
    ...umaGekiso,
    ...wallMed
  ])];

  const mates=[...new Set([
    ...umaBefore,
    ...fuku10,
    ...fuku15,
    ...gekiso,
    ...tansho
  ])].filter(x=>!axis.includes(x));

  return `
  <div class="box sBox">
    <h2>🏆S級・勝負判断</h2>

    <div class="indexCard">
      <div class="hot">🔥超勝負ランプ</div>
      <div>超激走 × 複勝10倍壁前：<b class="hot">${superLamp.length?superLamp.join("・"):"該当なし"}</b></div>
      <div>馬連壁前 × 複勝10倍壁前：<b class="gold">${umaFuku.length?umaFuku.join("・"):"該当なし"}</b></div>
      <div>馬連壁前 × 単勝案件：<b class="gold">${umaTansho.length?umaTansho.join("・"):"該当なし"}</b></div>
      <div>馬連壁前 × 超激走：<b class="gold">${umaGekiso.length?umaGekiso.join("・"):"該当なし"}</b></div>
    </div>

    <div class="indexCard">
      <div class="hot">🚨結論</div>
      <div>◎ 軸候補：<b class="hot">${axis.length?axis.join("・"):"なし"}</b></div>

function renderExtremeMoveAlert(umaList,winRank,placeRank){
  const umaRank={};
  const winMap={};
  const placeMap={};

  umaList.forEach((x,i)=>umaRank[x.horse]=i+1);
  winRank.forEach((x,i)=>winMap[x.horse]=i+1);
  placeRank.forEach((x,i)=>placeMap[x.horse]=i+1);

  const alerts=[];

  Object.keys(umaRank).forEach(h=>{
    if(winMap[h]){
      const diff=winMap[h]-umaRank[h];
      if(diff>=3)alerts.push(`${h}　単→馬 +${diff}`);
    }
    if(placeMap[h]){
      const diff=placeMap[h]-umaRank[h];
      if(diff>=3)alerts.push(`${h}　複→馬 +${diff}`);
    }
  });

  Object.keys(placeMap).forEach(h=>{
    if(winMap[h]){
      const diff=winMap[h]-placeMap[h];
      if(diff>=3)alerts.push(`${h}　単→複 +${diff}`);
    }
  });

  if(!alerts.length)return `<div class="small">極端移動：なし</div>`;

  return `<div style="margin-top:14px">
    <div class="hot">🚨極端移動</div>
    <div class="gold">${alerts.join("　")}</div>
  </div>`;
}
  function renderStrangeMove(sig, winRank, umaren, sanpuku){

  const winRankMap={};
  winRank.forEach((x,i)=>winRankMap[x.horse]=i+1);

  const umaRankMap={};
  [...umaren].sort((a,b)=>a.odds-b.odds).forEach((x,i)=>{
    x.pair.split("-").forEach(h=>{
      if(!umaRankMap[h])umaRankMap[h]=i+1;
    });
  });

  const sanRankMap={};
  [...sanpuku].sort((a,b)=>a.odds-b.odds).forEach((x,i)=>{
    x.trio.split("-").forEach(h=>{
      if(!sanRankMap[h])sanRankMap[h]=i+1;
    });
  });

  const fuku15After=sig.fuku15After||[];
  const alerts=[];

  winRank.forEach(x=>{

    const h=x.horse;
    const wr=winRankMap[h]||99;
    const ur=umaRankMap[h]||99;
    const sr=sanRankMap[h]||99;

    let pt=0;
    let memo=[];

    // 単勝は弱いのに馬連だけ強い
    if(wr>=10 && ur<=12){
      pt+=5;
      memo.push("単勝弱いのに馬連上位");
    }

    // 単勝は弱いのに三連複だけ強い
    if(wr>=10 && sr<=15){
      pt+=4;
      memo.push("単勝弱いのに三連複上位");
    }

    // 複勝15倍壁直後なのに馬連で売れている
    if(fuku15After.includes(h) && ur<=30){
      pt+=5;
      memo.push("複勝15壁直後×馬連");
    }

    // 複勝15倍壁直後なのに三連複で売れている
    if(fuku15After.includes(h) && sr<=30){
      pt+=5;
      memo.push("複勝15壁直後×三連複");
    }

    // 7・8人気警報
    if((wr===7 || wr===8) && (ur<=20 || sr<=20)){
      pt+=3;
      memo.push("7・8人気警報");
    }

    if(pt>=5){
      alerts.push({
        horse:h,
        pt,
        memo
      });
    }
  });

  alerts.sort((a,b)=>b.pt-a.pt);

  if(!alerts.length){
    return `
    <div class="box">
      <h2>🚨異様な動き検知</h2>
      <div class="small">該当なし</div>
    </div>`;
  }

  return `
  <div class="box">
    <h2>🚨異様な動き検知</h2>

    ${alerts.slice(0,5).map(x=>`
      <div class="indexCard">
        <div class="hot">${x.horse}【${x.pt}】</div>
        <div class="small">${x.memo.join("・")}</div>
      </div>
    `).join("")}

  </div>`;
}
  function renderOoana(sig){
  const score={};
  const memo={};
  function add(h,pt,label){
    if(!h)return;
    score[h]=(score[h]||0)+pt;
    if(!memo[h])memo[h]=[];
    if(!memo[h].includes(label))memo[h].push(label);
  }

  // 勝負ランプ
  sig.shobu.forEach(h=>add(h,6,"勝負ランプ"));

  // 超激走
  [...sig.gekisoSet].forEach(h=>add(h,5,"超激走"));

  // 単勝案件
  [...sig.tanshoSet].forEach(h=>add(h,5,"単勝案件"));

  // 複勝15倍壁前
  sig.fuku15Before.forEach(h=>add(h,4,"複勝15倍壁前"));

  // 複勝10倍壁前
  sig.fuku10Before.forEach(h=>add(h,3,"複勝10倍壁前"));

  // 馬連壁前
  sig.ot.wallBefore.forEach(h=>add(h,3,"馬連壁前"));

  // 単勝メジアン
  sig.winMed.forEach(h=>add(h,2,"単勝メジアン"));

  // 複勝メジアン
  sig.placeMed.forEach(h=>add(h,2,"複勝メジアン"));

  const list=Object.entries(score)
    .map(([horse,pt])=>({horse,pt,memo:memo[horse]||[]}))
    .filter(x=>x.pt>=7)
    .sort((a,b)=>b.pt-a.pt)
    .slice(0,5);

  if(!list.length){
    return `<div class="box"><h2>💣大穴一発逆転</h2><div class="small">該当なし</div></div>`;
  }

  let html=`<div class="box ooana"><h2>💣大穴一発逆転</h2>`;

  list.forEach((x,i)=>{
    let mark="⭐";
    let judge="三連複穴";
    if(x.pt>=15){mark="💥";judge="単勝勝負";}
    else if(x.pt>=10){mark="🔥";judge="馬連・ワイド";}

    html+=`
      <div class="ooHit">${mark} ${i+1}位　${x.horse}【${x.pt}】 ${judge}</div>
      <div class="ooMemo">${x.memo.join("・")}</div>
    `;
  });

  html+=`</div>`;
  return html;
}
