<textarea id="input" placeholder="【レース名】

<script>
var latestCopyText="";
function zenToHan(str){return String(str).replace(/[０-９]/g,function(s){return String.fromCharCode(s.charCodeAt(0)-65248);}).replace(/．/g,'.').replace(/[－ー―−]/g,'-').replace(/[　]/g,' ').replace(/[〜～]/g,'-');}
function nums(line){var m=zenToHan(line).match(/\d+(?:\.\d+)?/g);return m?m.map(Number):[];}
function pairKey(a,b){return[a,b].map(String).sort(function(x,y){return Number(x)-Number(y);}).join('-');}
function triKey(a,b,c){return[a,b,c].map(String).sort(function(x,y){return Number(x)-Number(y);}).join('-');}
function uniq(arr){var s={},o=[];for(var i=0;i<arr.length;i++){var v=String(arr[i]);if(v&&v!=='undefined'&&!s[v]){s[v]=true;o.push(v);}}return o;}
function sortOdds(arr){return arr.slice().sort(function(a,b){return Number(a.od)-Number(b.od);});}
function sortBy(arr,key){return arr.slice().sort(function(a,b){return Number(a[key])-Number(b[key]);});}
function joinH(arr){return arr&&arr.length?arr.map(function(x){return x+'番';}).join('・'):'なし';}
function mid(arr){if(!arr.length)return[];if(arr.length===1)return[arr[0]];var n=arr.length;return n%2?[arr[Math.floor(n/2)]]:[arr[n/2-1],arr[n/2]];}
function midPair(arr){if(!arr.length)return[];if(arr.length===1)return[arr[0]];var n=arr.length;if(n%2===0)return[arr[n/2-1],arr[n/2]];var m=Math.floor(n/2);return uniq([arr[m],arr[Math.max(0,m-1)]]);}
function getTf(data,h){h=String(h);for(var i=0;i<data.tanfuku.length;i++){if(data.tanfuku[i].h===h)return data.tanfuku[i];}return null;}
function findPair(arr,a,b){var k=pairKey(a,b);for(var i=0;i<arr.length;i++){if(arr[i].key===k)return arr[i];}return null;}
function findTri(arr,a,b,c){var k=triKey(a,b,c);for(var i=0;i<arr.length;i++){if(arr[i].key===k)return arr[i];}return null;}
function parseData(raw){var text=zenToHan(raw),lines=text.split(/\n/),title='レース',sec='',tanfuku=[],umaren=[],wide=[],sanpuku=[];for(var i=0;i<lines.length;i++){var line=lines[i].trim();if(!line)continue;if(line.indexOf('【')===0)title=line;var up=line.toUpperCase();if(up.indexOf('[TANFUKU]')===0){sec='TANFUKU';continue;}if(up.indexOf('[UMAREN]')===0){sec='UMAREN';continue;}if(up.indexOf('[WIDE]')===0){sec='WIDE';continue;}if(up.indexOf('[SANPUKU]')===0){sec='SANPUKU';continue;}if(sec==='TANFUKU'){var n=nums(line);if(n.length>=3)tanfuku.push({h:String(Math.floor(n[0])),tan:n[1],fuku:n[n.length-1]});}if(sec==='UMAREN'){var m=line.match(/(\d+)\s*-\s*(\d+)/),o=nums(line);if(m&&o.length)umaren.push({a:m[1],b:m[2],od:o[o.length-1],key:pairKey(m[1],m[2])});}if(sec==='WIDE'){var mw=line.match(/(\d+)\s*-\s*(\d+)/),ow=nums(line);if(mw&&ow.length)wide.push({a:mw[1],b:mw[2],od:ow[ow.length-1],key:pairKey(mw[1],mw[2])});}if(sec==='SANPUKU'){var ms=line.match(/(\d+)\s*-\s*(\d+)\s*-\s*(\d+)/),os=nums(line);if(ms&&os.length)sanpuku.push({a:ms[1],b:ms[2],c:ms[3],od:os[os.length-1],key:triKey(ms[1],ms[2],ms[3])});}}
return{title:title,tanfuku:tanfuku,umaren:umaren,wide:wide,sanpuku:sanpuku};}
function countPair(pairs,topN){var map={},arr=sortOdds(pairs).slice(0,topN);for(var i=0;i<arr.length;i++){[arr[i].a,arr[i].b].forEach(function(h){if(!map[h])map[h]={h:h,count:0};map[h].count++;});}var out=[];for(var k in map)out.push(map[k]);return out.sort(function(a,b){return b.count-a.count;});}
function countTri(tris,topN){var map={},arr=sortOdds(tris).slice(0,topN);for(var i=0;i<arr.length;i++){[arr[i].a,arr[i].b,arr[i].c].forEach(function(h){if(!map[h])map[h]={h:h,count:0};map[h].count++;});}var out=[];for(var k in map)out.push(map[k]);return out.sort(function(a,b){return b.count-a.count;});}
function detectWalls(items){var arr=sortOdds(items).slice(0,14),walls=[];for(var i=0;i<arr.length-1;i++){var now=Number(arr[i].od),next=Number(arr[i+1].od),ratio=next/now,diff=next-now;if(ratio>=1.55||diff>=8)walls.push({before:i+1,after:i+2,ratio:ratio,diff:diff});}return walls;}
function zonePairs(pairs,walls){var top=sortOdds(pairs).slice(0,14);if(!top.length)return[];if(walls.length>=2)return top.slice(walls[0].after-1,walls[1].before);if(walls.length===1)return top.slice(0,walls[0].before);return top.slice(0,6);}
function pairHorses(pairs){var a=[];for(var i=0;i<pairs.length;i++){a.push(pairs[i].a);a.push(pairs[i].b);}return uniq(a);}
function fukuFront(tanfuku,limit){var arr=sortBy(tanfuku,'fuku').filter(function(x){return Number(x.fuku)<=limit;});return arr.slice(Math.max(0,arr.length-2)).map(function(x){return x.h;});}
function fukuAfter(tanfuku,limit){var arr=sortBy(tanfuku,'fuku').filter(function(x){return Number(x.fuku)>limit;});return arr.slice(0,2).map(function(x){return x.h;});}
function connectionCount(data,h,topN){h=String(h);var u=sortOdds(data.umaren).slice(0,topN||12).filter(function(p){return p.a===h||p.b===h;}).length;var w=sortOdds(data.wide).slice(0,topN||12).filter(function(p){return p.a===h||p.b===h;}).length;var s=sortOdds(data.sanpuku).slice(0,topN||12).filter(function(t){return t.a===h||t.b===h||t.c===h;}).length;return{umaren:u,wide:w,sanpuku:s,total:u+w+s};}
function makeRankMap(items){var m={},arr=sortOdds(items);for(var i=0;i<arr.length;i++)m[arr[i].key]=i+1;return m;}
function pairRankFromMap(m,a,b){return m[pairKey(a,b)]||999;}
function bestTriWithTwo(data,a,b,limit){var best=null,arr=sortOdds(data.sanpuku);for(var i=0;i<arr.length;i++){var t=arr[i],hs=[t.a,t.b,t.c];if(hs.indexOf(String(a))>=0&&hs.indexOf(String(b))>=0){if(!best||Number(t.od)<Number(best.od))best=t;if(limit&&Number(t.od)<=limit)return t;}}return best;}
function bestPairAmong(data,hs,kind){var arr=sortOdds(kind==='wide'?data.wide:data.umaren),set={};hs.forEach(function(h){set[String(h)]=true;});for(var i=0;i<arr.length;i++){if(set[arr[i].a]&&set[arr[i].b])return arr[i];}return null;}
function detectUpperTriangleLock(data,ctx){if(!data.sanpuku.length||!data.umaren.length||!data.wide.length)return null;var uMap=makeRankMap(data.umaren),wMap=makeRankMap(data.wide),san=sortOdds(data.sanpuku).slice(0,10),best=null;for(var i=0;i<san.length;i++){var t=san[i],hs=[t.a,t.b,t.c],pairs=[[hs[0],hs[1]],[hs[0],hs[2]],[hs[1],hs[2]]],uHit=0,wHit=0,uStrong=0,wStrong=0,uRanks=[],wRanks=[];for(var p=0;p<pairs.length;p++){var ur=pairRankFromMap(uMap,pairs[p][0],pairs[p][1]),wr=pairRankFromMap(wMap,pairs[p][0],pairs[p][1]);uRanks.push(ur);wRanks.push(wr);if(ur<=12)uHit++;if(wr<=12)wHit++;if(ur<=7)uStrong++;if(wr<=7)wStrong++;}var topU=sortOdds(data.umaren)[0],topW=sortOdds(data.wide)[0];var hasTopU=topU&&hs.indexOf(topU.a)>=0&&hs.indexOf(topU.b)>=0;var hasTopW=topW&&hs.indexOf(topW.a)>=0&&hs.indexOf(topW.b)>=0;var rankSum=0;for(var r=0;r<3;r++)rankSum+=Math.min(uRanks[r],30)+Math.min(wRanks[r],30);var score=(10-i)*5+uHit*10+wHit*10+uStrong*6+wStrong*6+(hasTopU?10:0)+(hasTopW?10:0)+Math.max(0,90-rankSum)/3;var ok=i<=7&&uHit>=2&&wHit>=2&&(hasTopU||hasTopW||uStrong+wStrong>=4)&&score>=70;if(!ok)continue;var center=hs[0],centerScore=-999;for(var h=0;h<hs.length;h++){var hh=hs[h],tf=getTf(data,hh),cs=0;if(ctx.umaTop.indexOf(hh)>=0)cs+=10;if(ctx.wideTop.indexOf(hh)>=0)cs+=10;if(ctx.sanTop.indexOf(hh)>=0)cs+=10;for(var q=0;q<hs.length;q++){if(q===h)continue;cs+=Math.max(0,14-pairRankFromMap(uMap,hh,hs[q]));cs+=Math.max(0,14-pairRankFromMap(wMap,hh,hs[q]));}if(tf){cs+=Math.max(0,10-Number(tf.fuku));cs+=Math.max(0,18-Number(tf.tan))/2;}if(cs>centerScore){centerScore=cs;center=hh;}}var item={h:hs,key:triKey(hs[0],hs[1],hs[2]),od:t.od,rank:i+1,score:Math.round(score),uRanks:uRanks,wRanks:wRanks,center:center};if(!best||item.score>best.score)best=item;}return best;}
function detectEdgeHead(data,ctx){if(ctx.topUma<4||ctx.topUma>=9)return null;if(ctx.heroH.length||ctx.semiHeroH.length)return null;var zone=ctx.tanRank.filter(function(x){return Number(x.tan)>=4&&Number(x.tan)<=9.9;});if(zone.length<3)return null;var cand=zone[zone.length-1],con=connectionCount(data,cand.h,12);if(con.umaren>=2||con.wide>=2||con.total>=4)return{h:cand.h,tan:cand.tan,fuku:cand.fuku,zone:zone.map(function(x){return x.h;}),con:con};return null;}
function rankHoleForHead(data,head,holes,ctx){return holes.slice().sort(function(a,b){function pt(h){var tf=getTf(data,h),p=0,u=findPair(data.umaren,head,h),w=findPair(data.wide,head,h);if(u)p+=Math.max(0,40-Number(u.od));if(w)p+=Math.max(0,25-Number(w.od));if(ctx.sanTop.indexOf(h)>=0)p+=8;if(ctx.umaTop.indexOf(h)>=0)p+=6;if(tf){p+=Math.max(0,25-Number(tf.tan))/2;p+=Math.max(0,10-Number(tf.fuku));}return p;}return pt(b)-pt(a);});}
function detectHoleClusterRescue(data,ctx){var hero=(ctx.heroH[0]||ctx.semiHeroH[0]);if(!hero)return[];var anchors=uniq(ctx.fukuM.concat(ctx.doubleMedian).concat(ctx.medianHoleH)).filter(function(h){return h!==hero;}),map={};for(var ai=0;ai<anchors.length;ai++){var a=anchors[ai],atf=getTf(data,a);if(!atf||atf.tan<10||atf.tan>35)continue;for(var i=0;i<data.tanfuku.length;i++){var x=data.tanfuku[i],h=x.h;if(h===hero||h===a)continue;if(x.tan<10||x.tan>35)continue;var tanDiff=Math.abs(Number(x.tan)-Number(atf.tan)),fukuDiff=Math.abs(Number(x.fuku)-Number(atf.fuku));if(tanDiff>2.5||fukuDiff>1.0)continue;var u=findPair(data.umaren,hero,h),w=findPair(data.wide,hero,h),tr=bestTriWithTwo(data,hero,h,60);if(!((w&&w.od<=15)||(u&&u.od<=80)||(tr&&tr.od<=60)))continue;var score=Math.max(0,1.2-fukuDiff)*30+Math.max(0,2.5-tanDiff)*5+(w?Math.max(0,15-w.od):0)+(u?Math.max(0,80-u.od)/12:0)+(tr?Math.max(0,60-tr.od)/4:0)+(ctx.sanTop.indexOf(h)>=0?4:0)+(x.fuku<=6?3:0);if(!map[h]||score>map[h].score)map[h]={h:h,score:score,anchor:a,tan:x.tan,fuku:x.fuku,tri:tr?tr.key:'',triOd:tr?tr.od:''};}}var out=[];for(var k in map)out.push(map[k]);return out.sort(function(a,b){return b.score-a.score;});}
function detectDeepHoleRescue(data,ctx){var anchors=[];if(ctx.triangleLock)anchors=ctx.triangleLock.h.slice();else anchors=ctx.tanRank.slice(0,3).map(function(x){return x.h;}).concat(ctx.fukuRank.slice(0,3).map(function(x){return x.h;}));anchors=uniq(anchors);var out=[];for(var i=0;i<data.tanfuku.length;i++){var x=data.tanfuku[i],h=x.h,tan=Number(x.tan),fuku=Number(x.fuku);if(tan<55||tan>130||fuku>15)continue;if(ctx.triangleLock&&ctx.triangleLock.h.indexOf(h)>=0)continue;var conn=0,score=0,reasons=[];if(fuku<=15){score+=18;reasons.push('複勝15倍内の薄穴');}if(fuku<=12){score+=8;reasons.push('複勝12倍内');}if(tan>=60){score+=8;reasons.push('単勝60倍超');}if(ctx.fukuM.indexOf(h)>=0){score+=10;reasons.push('複勝メジアン');}if(ctx.fuku15.indexOf(h)>=0){score+=8;reasons.push('複勝15倍壁前');}for(var a=0;a<anchors.length;a++){var ax=anchors[a];if(ax===h)continue;var u=findPair(data.umaren,ax,h),w=findPair(data.wide,ax,h),tr=bestTriWithTwo(data,ax,h,90);if(u&&Number(u.od)<=90){score+=10;conn++;reasons.push(ax+'番と馬連'+u.od);}else if(u&&Number(u.od)<=130){score+=4;conn++;}if(w&&Number(w.od)<=30){score+=10;conn++;reasons.push(ax+'番とワイド'+w.od);}if(tr&&Number(tr.od)<=90){score+=8;conn++;}}
if(ctx.triangleLock&&conn>=1)score+=8;if(!ctx.triangleLock&&conn===0)continue;if(score>=28)out.push({h:h,score:Math.round(score),tan:x.tan,fuku:x.fuku,conn:conn,grade:'超穴3着救済',reasons:uniq(reasons).slice(0,6),use:'三連系3着救済'});}out.sort(function(a,b){return b.score-a.score;});return out.slice(0,2);}
function insuranceGrade(score,deep){if(deep)return'超穴3着救済';if(score>=70)return'保険SS';if(score>=55)return'保険S';if(score>=40)return'保険A';return'3着救済';}
function detectBigHoleInsuranceRanking(data,ctx){var axes=uniq(ctx.tanRank.slice(0,3).map(function(x){return x.h;}).concat(ctx.fukuRank.slice(0,3).map(function(x){return x.h;})).concat(ctx.zoneM).concat(ctx.triangleLock?ctx.triangleLock.h:[]));var out=[];for(var i=0;i<data.tanfuku.length;i++){var x=data.tanfuku[i],h=x.h,tan=Number(x.tan),fuku=Number(x.fuku);var deep=(tan>=55&&tan<=130&&fuku<=15);if(tan<8)continue;if(tan>=60&&!deep)continue;if(ctx.heroH.indexOf(h)>=0||ctx.semiHeroH.indexOf(h)>=0)continue;var score=0,reasons=[],conn=0;if(fuku<=15){score+=10;reasons.push('複勝15倍内');}else{score-=8;reasons.push('複勝15倍外');}if(deep){score+=14;reasons.push('単勝60倍超の薄穴');}if(fuku>=3&&fuku<=10){score+=6;reasons.push('中穴複勝帯');}if(tan>=10&&tan<=30){score+=6;reasons.push('単勝10〜30倍');}if(tan>30&&tan<60){score+=2;reasons.push('単勝30〜60倍');}if(ctx.fukuM.indexOf(h)>=0){score+=12;reasons.push('複勝メジアン');}if(ctx.tanM.indexOf(h)>=0){score+=8;reasons.push('単勝メジアン');}if(ctx.doubleMedian.indexOf(h)>=0){score+=14;reasons.push('単複メジアン重複');}if(ctx.edgeHead&&ctx.edgeHead.h===h){score+=16;reasons.push('人気ゾーン端');}if(ctx.holeClusterH&&ctx.holeClusterH.indexOf(h)>=0){score+=14;reasons.push('穴帯クラスター');}if(ctx.fuku10.indexOf(h)>=0){score+=5;reasons.push('複勝10倍壁前');}if(ctx.fuku15.indexOf(h)>=0){score+=7;reasons.push('複勝15倍壁前');}if(ctx.fuku15a&&ctx.fuku15a.indexOf(h)>=0){score+=5;reasons.push('複勝15倍外側すぐ');}if(ctx.umaTop.indexOf(h)>=0){score+=5;reasons.push('馬連出現上位');}if(ctx.wideTop.indexOf(h)>=0){score+=5;reasons.push('ワイド出現上位');}if(ctx.sanTop.indexOf(h)>=0){score+=6;reasons.push('三連複出現上位');}
for(var a=0;a<axes.length;a++){var ax=axes[a];if(ax===h)continue;var u=findPair(data.umaren,ax,h),w=findPair(data.wide,ax,h),tr=bestTriWithTwo(data,ax,h,90);if(u&&Number(u.od)<=50){score+=10;conn++;}else if(u&&Number(u.od)<=90){score+=5;conn++;}if(w&&Number(w.od)<=15){score+=10;conn++;}else if(w&&Number(w.od)<=30){score+=5;conn++;}if(tr&&Number(tr.od)<=45){score+=10;conn++;}else if(tr&&Number(tr.od)<=90){score+=4;conn++;}}
if(conn>=5){score+=18;reasons.push('上位軸強連結');}else if(conn>=3){score+=12;reasons.push('上位軸連結');}else if(conn>=1&&deep){score+=8;reasons.push('上位軸薄連結');}else if(conn>=2){score+=6;reasons.push('上位軸小連結');}

function makeBigHoleCard(ctx){var html='<div class="card"><div class="title">💣大穴保険ランキング</div>';if(!ctx.bigHoleItems||!ctx.bigHoleItems.length){return html+'該当なし<br><span class="small">保険単勝で買うほどの穴サインは弱めです。</span></div>';}html+='<div class="small">1〜3位＝単勝保険候補。超穴3着救済は三連系専用。</div><hr>';for(var i=0;i<ctx.bigHoleItems.length;i++){var x=ctx.bigHoleItems[i];html+='<div class="rankLine"><span class="badge">'+(i+1)+'位 '+x.h+'番【'+x.grade+'】</span> <span class="small">単'+x.tan+' / 複'+x.fuku+'　'+x.reasons.join('・')+'　推奨：'+x.use+'</span></div>';}return html+'</div>';}
function makeCopyText(title,raceType,decision,pick,tickets,scored,ctx){var t='';t+=title+'\n';t+='診断：'+raceType+' / '+decision+'\n';t+='選択モード：'+pick.mode+'\n';if(pick.lamps.length)t+='発動：'+pick.lamps.join(' / ')+'\n';t+='◎ '+joinH(pick.axisH)+'\n';t+='○ '+joinH(pick.partnerH)+'\n\n';t+='ワイド\n'+tickets.wide.join('\n')+'\n\n';t+='馬連\n'+tickets.umaren.join('\n')+'\n\n';t+='三連複\n'+tickets.sanpuku.join('\n')+'\n\n';t+='三連単\n'+tickets.sanrentan.join('\n')+'\n\n';if(ctx&&ctx.bigHoleItems&&ctx.bigHoleItems.length){t+='大穴保険ランキング\n';for(var bh=0;bh<Math.min(6,ctx.bigHoleItems.length);bh++){var bx=ctx.bigHoleItems[bh];t+=(bh+1)+'位 '+bx.h+'番【'+bx.grade+'】 単'+bx.tan+' / 複'+bx.fuku+' '+bx.reasons.join('・')+' 推奨:'+bx.use+'\n';}t+='\n';}t+='最終候補\n';for(var i=0;i<Math.min(6,scored.length);i++)t+=(i+1)+'位 '+scored[i].h+'番【'+scored[i].score+'】 単'+scored[i].tan+' / 複'+scored[i].fuku+'\n';return t;}
function run(){try{var data=parseData(document.getElementById('input').value),out=document.getElementById('out');if(data.tanfuku.length===0||data.umaren.length===0){out.innerHTML='<div class="card"><div class="title warn">入力不足</div>[TANFUKU] と [UMAREN] が必要です。</div>';return;}var ctx=makeContext(data),scored=scoreAll(data,ctx),pick=chooseFinal(data,ctx,scored),tickets=makeTickets(data,ctx,pick,scored);var decision=(pick.axisH.length&&pick.partnerH.length)?'買う':(scored[0]&&scored[0].score>=18?'少額':'見送り');var html='';html+='<div class="card"><div class="title">'+data.title+'</div>';html+='🩺 レース診断：<span class="yellow">'+ctx.raceType+'</span><br>';html+='馬連1番人気：<span class="yellow">'+(ctx.umaRank[0]?ctx.umaRank[0].key+' '+ctx.umaRank[0].od+'倍':'なし')+'</span><br>';html+='結論：<span class="'+(decision==='買う'?'good':decision==='少額'?'yellow':'warn')+'">'+decision+'</span><br>';html+='選択モード：<span class="yellow">'+pick.mode+'</span></div>';html+='<div class="card"><div class="title">🚨発動ランプ</div>'+renderLampList(pick.lamps)+'</div>';html+='<div class="card"><div class="title">🧠メジアン・壁</div>';html+='単勝メジアン：<span class="red">'+joinH(ctx.tanM)+'</span><br>';html+='複勝メジアン：<span class="red">'+joinH(ctx.fukuM)+'</span><br>';html+='馬連壁内メジアン：<span class="red">'+joinH(ctx.zoneM)+'</span><br>';html+='複勝6倍壁前：<span class="yellow">'+joinH(ctx.fuku6)+'</span><br>';html+='複勝10倍壁前：<span class="yellow">'+joinH(ctx.fuku10)+'</span><br>';html+='複勝15倍壁前：<span class="yellow">'+joinH(ctx.fuku15)+'</span><br>';html+='複勝15倍外側すぐ：<span class="yellow">'+joinH(ctx.fuku15a)+'</span><br>';html+='上位三角ロック：<span class="good">'+(ctx.triangleLock?ctx.triangleLock.key+'（中心 '+ctx.triangleLock.center+'番）':'なし')+'</span><br>';html+='超穴複勝15内3着救済：<span class="yellow">'+joinH(ctx.deepHoleH||[])+'</span><br>';html+='偽本命15倍候補：<span class="yellow">'+joinH(ctx.fake15H||[])+'</span><br>';html+='大穴保険候補：<span class="yellow">'+joinH(ctx.bigHoleH||[])+'</span></div>';html+='<div class="card"><div class="title">🧱馬連オッズの壁</div>';html+='壁：'+(ctx.mainWalls.length?ctx.mainWalls.map(function(w){return w.before+'位→'+w.after+'位';}).join(' / '):'明確な壁なし')+'<br>';html+='見るゾーン：'+(ctx.zone.length?ctx.zone.map(function(p){return p.key+'('+p.od+')';}).join(' / '):'なし')+'<br>';html+='壁内馬：'+joinH(ctx.zoneH)+'</div>';html+=makeHonpyo(data,ctx);html+=makeBigHoleCard(ctx);html+='<div class="card"><div class="title">👑最終候補</div>';html+='軸候補：<span class="good">'+joinH(pick.axisH)+'</span><br>';html+='相手候補：<span class="yellow">'+joinH(pick.partnerH)+'</span><hr>';for(var s=0;s<Math.min(8,scored.length);s++){var x=scored[s];html+='<div class="rankLine"><span class="badge">'+(s+1)+'位 '+x.h+'番【'+x.score+'】</span> <span class="small">単'+x.tan+' / 複'+x.fuku+'　'+x.reasons.join('・')+'</span></div>';}html+='</div>';html+='<div class="card"><div class="title">💰買い目</div><pre>';if(decision==='見送り'){html+='見送り\n理由：重なり不足';}else{html+='◎ '+joinH(pick.axisH)+'\n';html+='○ '+joinH(pick.partnerH)+'\n\n';html+='ワイド\n'+(tickets.wide.length?tickets.wide.join('\n'):'なし')+'\n\n';html+='馬連\n'+(tickets.umaren.length?tickets.umaren.join('\n'):'なし')+'\n\n';html+='三連複\n'+(tickets.sanpuku.length?tickets.sanpuku.join('\n'):'なし')+'\n\n';html+='三連単\n'+(tickets.sanrentan.length?tickets.sanrentan.join('\n'):'なし');}html+='</pre></div>';out.innerHTML=html;latestCopyText=makeCopyText(data.title,ctx.raceType,decision,pick,tickets,scored,ctx);}catch(e){document.getElementById('out').innerHTML='<div class="card"><div class="title warn">エラー</div><pre>'+String(e&&e.message?e.message:e)+'</pre></div>';}}
function copyResult(){if(!latestCopyText){alert('先に解析してください');return;}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(latestCopyText).then(function(){alert('結果をコピーしました');}).catch(function(){fallbackCopy(latestCopyText);});}else fallbackCopy(latestCopyText);}
function fallbackCopy(text){var ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);alert('結果をコピーしました');}
