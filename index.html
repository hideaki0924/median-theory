<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>チャッピー神予想 新V1.0</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#07101f;color:#fff;padding:14px;font-size:18px}
textarea{width:100%;height:260px;font-size:17px;border-radius:10px;padding:10px}
button{font-size:22px;padding:12px 18px;margin:10px 0;border-radius:12px;border:0;background:#22c55e;color:#fff}
.box{background:#111827;border-radius:14px;padding:14px;margin:12px 0}
h1{font-size:26px}
h2{font-size:22px;border-bottom:1px solid #374151;padding-bottom:6px}
.green{color:#22c55e;font-weight:bold}
.yellow{color:#facc15;font-weight:bold}
.red{color:#fb7185;font-weight:bold}
.small{font-size:15px;color:#cbd5e1}
pre{white-space:pre-wrap;font-size:16px}
.rankWrap{overflow-x:auto;white-space:nowrap}
.row{margin:12px 0;font-size:24px;font-weight:bold}
.label{display:inline-block;width:70px;color:#cbd5e1;font-size:18px}
.cell{
  display:inline-block;
  min-width:34px;
  text-align:center;
  padding:4px 6px;
  border-right:1px solid #64748b;
}
.wall{
  border-right:8px solid #ff0000;
}
</style>
</head>
<body>

<h1>チャッピー神予想 新V1.0</h1>

<div class="box">
<textarea id="input" placeholder="ここに貼り付け

[TANFUKU]
9 1.8 1.4
6 4.1 1.5
8 4.8 2.1

[UMAREN]
6-9 3.6
8-9 5.1
3-9 11.1"></textarea>
<button onclick="analyze()">解析する</button>
</div>

<div id="result"></div>

<script>
function norm(s){
  return s.replace(/[０-９]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0))
          .replace(/[－ー―–]/g,'-');
}

function parseInput(text){
  text=norm(text);
  const lines=text.split(/\n/).map(x=>x.trim()).filter(Boolean);
  let mode="";
  const tanpuku=[],umaren=[];

  for(const line of lines){
    if(line.match(/TANFUKU|単勝|複勝/i)){mode="TANFUKU";continue;}
    if(line.match(/UMAREN|馬連|馬複/i)){mode="UMAREN";continue;}
    if(line.match(/SANPUKU|三連複/i)){mode="SANPUKU";continue;}

    const p=line.split(/\s+/);

    if(mode==="TANFUKU" && p.length>=3){
      tanpuku.push({
        horse:p[0],
        win:parseFloat(p[1]),
        place:parseFloat(p[2])
      });
    }

    if(mode==="UMAREN" && p.length>=2){
      const pair=p[0];
      const odds=parseFloat(p[1]);
      if(pair.includes("-") && !isNaN(odds)){
        umaren.push({pair,odds});
      }
    }
  }
  return {tanpuku,umaren};
}

function classify(topOdds){
  if(topOdds<4){
    return {
      cls:"green",
      title:"本命戦",
      reason:"馬連1番人気が4倍未満だから",
      text:"馬連1番人気の2頭のどちらかを\n穴馬の相手に入れる\n\n（2頭とも入れる場合あり）"
    };
  }
  if(topOdds<9){
    return {
      cls:"yellow",
      title:"中荒れ戦",
      reason:"馬連1番人気が4倍以上9倍未満だから",
      text:"中穴馬が馬券に絡む可能性が高い\n\n複勝10倍の壁の前の2頭に\n特に注目する"
    };
  }
  return {
    cls:"red",
    title:"荒れ戦",
    reason:"馬連1番人気が9倍以上だから",
    text:"複勝10倍の壁の直後に\nランクされている馬からの\nワイド馬券に注目する"
  };
}

function wallIndexes(list,key){
  const walls=new Set();
  for(let i=0;i<list.length-1;i++){
    const a=list[i][key];
    const b=list[i+1][key];
    if(a>0 && b/a>=1.8){
      walls.add(i);
    }
  }
  return walls;
}

function rankLine(label,list,walls){
  let html=`<div class="row"><span class="label">${label}</span>`;
  list.forEach((x,i)=>{
    const cls=walls.has(i) ? "cell wall" : "cell";
    html+=`<span class="${cls}">${x.horse}</span>`;
  });
  html+=`</div>`;
  return html;
}

function analyze(){
  const {tanpuku,umaren}=parseInput(document.getElementById("input").value);
  const result=document.getElementById("result");

  if(tanpuku.length===0 || umaren.length===0){
    result.innerHTML=`<div class="box red">単勝複勝と馬連を入れてください</div>`;
    return;
  }

  const winRank=[...tanpuku].sort((a,b)=>a.win-b.win);
  const placeRank=[...tanpuku].sort((a,b)=>a.place-b.place);
  const axis=winRank[0].horse;

  const axisUmaren=umaren
    .filter(x=>x.pair.split("-").includes(axis))
    .sort((a,b)=>a.odds-b.odds)
    .map(x=>{
      const [a,b]=x.pair.split("-");
      const other=a===axis?b:a;
      return {horse:other,odds:x.odds,pair:x.pair};
    });

  const topUmaren=[...umaren].sort((a,b)=>a.odds-b.odds)[0];
  const race=classify(topUmaren.odds);

  const umaList=[{horse:axis,odds:0},...axisUmaren];

  const umaWalls=wallIndexes(axisUmaren,"odds");
  const adjustedUmaWalls=new Set([...umaWalls].map(i=>i+1));

  const winWalls=wallIndexes(winRank,"win");
  const placeWalls=wallIndexes(placeRank,"place");

  result.innerHTML=`
    <div class="box">
      <h2>レース分類</h2>
      <div>馬連1番人気：${topUmaren.pair}　${topUmaren.odds}倍</div>
      <p>${race.reason}</p>
      <div class="${race.cls}" style="font-size:28px">${race.title}</div>
    </div>

    <div class="box">
      <h2>本の買い方</h2>
      <pre>${race.text}</pre>
    </div>

    <div class="box">
      <h2>本表</h2>
      <div class="small">細線＝通常区切り　太い赤線＝オッズの壁（乖離率1.8倍以上）</div>
      <div class="rankWrap">
        ${rankLine("馬連",umaList,adjustedUmaWalls)}
        ${rankLine("単勝",winRank,winWalls)}
        ${rankLine("複勝",placeRank,placeWalls)}
      </div>
    </div>
  `;
}
</script>

</body>
</html>
