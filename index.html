<body>
<h1>チャッピー神予想 競馬 V2.2<br>大穴スイッチ搭載版</h1>

<textarea id="input" placeholder="【阪神11R】

[TANFUKU]
馬番 単勝 複勝上限

[UMAREN]
馬番-馬番 オッズ

[WIDE]
馬番-馬番 オッズ

[SANPUKU]
馬番-馬番-馬番 オッズ

※複勝は上限値で入力。1.2-2.4なら 2.4 を使う。"></textarea><br>

<button class="go" id="btnRun">解析</button>
<button class="test" id="btnSample">テスト</button>
<button class="clear" id="btnClear">リセット</button>
<button class="copy" id="btnCopy">結果コピー</button>
<div id="out"></div>

<script>
var latestCopyText="";

function zenToHan(str){return String(str).replace(/[０-９]/g,function(s){return String.fromCharCode(s.charCodeAt(0)-65248);}).replace(/．/g,'.').replace(/[－ー―−]/g,'-').replace(/[　]/g,' ').replace(/[〜～]/g,'-');}
function nums(line){var m=zenToHan(line).match(/\d+(?:\.\d+)?/g);return m?m.map(Number):[];}
function pairKey(a,b){return [a,b].map(String).sort(function(x,y){return Number(x)-Number(y);}).join('-');}
function triKey(a,b,c){return [a,b,c].map(String).sort(function(x,y){return Number(x)-Number(y);}).join('-');}
function add(arr,v){v=String(v);if(v&&v!=='undefined'&&arr.indexOf(v)<0)arr.push(v);}
function uniq(arr){var out=[];(arr||[]).forEach(function(v){add(out,v);});return out;}
function sortOdds(arr){return arr.slice().sort(function(a,b){return Number(a.od)-Number(b.od);});}
function mid(arr){arr=arr||[];if(!arr.length)return[];var n=arr.length;if(n%2)return[arr[Math.floor(n/2)]];return[arr[n/2-1],arr[n/2]];}
function joinH(arr){return (!arr||!arr.length)?'なし':arr.map(function(x){return x+'番';}).join('・');}
function getTF(data,h){h=String(h);for(var i=0;i<data.tanfuku.length;i++){if(data.tanfuku[i].h===h)return data.tanfuku[i];}return null;}
function findPair(arr,a,b){var k=pairKey(a,b);for(var i=0;i<arr.length;i++){if(arr[i].key===k)return arr[i];}return null;}
function findTri(arr,a,b,c){var k=triKey(a,b,c);for(var i=0;i<arr.length;i++){if(arr[i].key===k)return arr[i];}return null;}
function rankOf(list,key){for(var i=0;i<list.length;i++){if(list[i].key===key)return i+1;}return 999;}
function safeNum(x,d){x=Number(x);return isFinite(x)?x:(d||9999);}

function parseData(raw){
  var text=zenToHan(raw),lines=text.split(/\n/),title='レース',sec='';
  var tanfuku=[],umaren=[],wide=[],sanpuku=[];
  for(var i=0;i<lines.length;i++){
    var line=lines[i].trim();if(!line)continue;
    if(line.indexOf('【')===0)title=line;
    var up=line.toUpperCase();
    if(up.indexOf('[')===0){
      if(up.indexOf('TAN')>=0||up.indexOf('単')>=0){sec='TANFUKU';continue;}
      if(up.indexOf('WIDE')>=0||up.indexOf('ワイド')>=0){sec='WIDE';continue;}
      if(up.indexOf('SAN')>=0||up.indexOf('3')>=0||up.indexOf('三')>=0){sec='SANPUKU';continue;}
      if(up.indexOf('UMA')>=0||up.indexOf('馬')>=0||up.indexOf('2')>=0){sec='UMAREN';continue;}
    }
    if(sec==='TANFUKU'){
      var n=nums(line);
      if(n.length>=3)tanfuku.push({h:String(Math.floor(n[0])),tan:n[1],fuku:n[n.length-1]});
      else if(n.length===2)tanfuku.push({h:String(Math.floor(n[0])),tan:n[1],fuku:null});
    }
    if(sec==='UMAREN'){
      var m=line.match(/(\d+)\s*-\s*(\d+)/),o=nums(line);
      if(m&&o.length)umaren.push({a:m[1],b:m[2],od:o[o.length-1],key:pairKey(m[1],m[2])});
    }
    if(sec==='WIDE'){
      var mw=line.match(/(\d+)\s*-\s*(\d+)/),ow=nums(line);
      if(mw&&ow.length)wide.push({a:mw[1],b:mw[2],od:ow[ow.length-1],key:pairKey(mw[1],mw[2])});
    }
    if(sec==='SANPUKU'){
      var ms=line.match(/(\d+)\s*-\s*(\d+)\s*-\s*(\d+)/),os=nums(line);
      if(ms&&os.length)sanpuku.push({a:ms[1],b:ms[2],c:ms[3],od:os[os.length-1],key:triKey(ms[1],ms[2],ms[3])});
    }
  }
  return{title:title,tanfuku:tanfuku,umaren:umaren,wide:wide,sanpuku:sanpuku};
}
function pairRow(pairs){var row=[];sortOdds(pairs).forEach(function(p){add(row,p.a);add(row,p.b);});return row;}
function triRow(tris){var row=[];sortOdds(tris).forEach(function(t){add(row,t.a);add(row,t.b);add(row,t.c);});return row;}
function countAppearTop(list,h,n){h=String(h);var c=0;(list||[]).slice(0,n||20).forEach(function(x){if(x.a===h||x.b===h||x.c===h)c++;});return c;}
function bestRankIn(list,h,n){h=String(h);for(var i=0;i<Math.min(n||20,list.length);i++){var x=list[i];if(x.a===h||x.b===h||x.c===h)return i+1;}return 999;}
function nearWall(sorted,field,wall){
  var before=[],after=[],idx=-1;
  for(var i=0;i<sorted.length;i++){var v=safeNum(sorted[i][field]);if(v<=wall)idx=i;}
  if(idx>=0){if(sorted[idx])before.push(sorted[idx].h);if(sorted[idx-1])before.push(sorted[idx-1].h);}
  if(sorted[idx+1])after.push(sorted[idx+1].h);
  if(sorted[idx+2])after.push(sorted[idx+2].h);
  return{before:uniq(before),after:uniq(after),idx:idx};
}
function oddsWalls(sorted,field,ratio){
  var out=[];
  for(var i=0;i<sorted.length-1;i++){
    var a=safeNum(sorted[i][field],0),b=safeNum(sorted[i+1][field],0);if(!a||!b)continue;
    var r=b/a;if(r>=ratio)out.push({pos:i,a:sorted[i].h,b:sorted[i+1].h,ao:a,bo:b,ratio:r});
  }
  return out;
}

function makeContext(data){
  var tanRank=sortOdds(data.tanfuku.map(function(x){return{h:x.h,od:x.tan,tan:x.tan,fuku:x.fuku};}));
  var fukuRank=data.tanfuku.filter(function(x){return x.fuku!==null;}).map(function(x){return{h:x.h,od:x.fuku,tan:x.tan,fuku:x.fuku};}).sort(function(a,b){return Number(a.fuku)-Number(b.fuku);});
  var umaRank=sortOdds(data.umaren),wideRank=sortOdds(data.wide),sanRank=sortOdds(data.sanpuku);
  var tanRow=tanRank.map(function(x){return x.h;}),fukuRow=fukuRank.map(function(x){return x.h;});
  var umaRow=pairRow(data.umaren),wideRow=pairRow(data.wide),sanRow=triRow(data.sanpuku);
  var fav1=tanRank[0]?tanRank[0].h:null,fav2=tanRank[1]?tanRank[1].h:null,fav3=tanRank[2]?tanRank[2].h:null;
  var w80=nearWall(tanRank,'tan',80),w6=nearWall(fukuRank,'fuku',6),w15=nearWall(fukuRank,'fuku',15);
  var tanWalls=oddsWalls(tanRank,'tan',1.8),fukuWalls=oddsWalls(fukuRank,'fuku',1.55);
  var umaRank6=[];
  [4,5,6].forEach(function(i){if(umaRank[i]){add(umaRank6,umaRank[i].a);add(umaRank6,umaRank[i].b);}});
  var topConcentration=false,concReason=[];
  if(tanRank[0]&&Number(tanRank[0].tan)<=2.0){topConcentration=true;concReason.push('単勝1人気が2倍以下');}
  if(umaRank[0]&&Number(umaRank[0].od)<4){topConcentration=true;concReason.push('馬連1人気が4倍未満');}
  if(sanRank[0]&&Number(sanRank[0].od)<10){topConcentration=true;concReason.push('三連複1人気が10倍未満');}
  var all=[];data.tanfuku.forEach(function(x){add(all,x.h);});[data.umaren,data.wide,data.sanpuku].forEach(function(list){list.forEach(function(x){add(all,x.a);add(all,x.b);if(x.c)add(all,x.c);});});
  return{tanRank:tanRank,fukuRank:fukuRank,umaRank:umaRank,wideRank:wideRank,sanRank:sanRank,tanRow:tanRow,fukuRow:fukuRow,umaRow:umaRow,wideRow:wideRow,sanRow:sanRow,fav1:fav1,fav2:fav2,fav3:fav3,tanM:mid(tanRow),fukuM:mid(fukuRow),umaM:mid(umaRow),wideM:mid(wideRow),sanM:mid(sanRow),w80:w80,w6:w6,w15:w15,tanWalls:tanWalls,fukuWalls:fukuWalls,umaRank6:umaRank6,topConcentration:topConcentration,concReason:concReason,all:all};
}
function rankMap(row){var m={};row.forEach(function(h,i){m[h]=i+1;});return m;}
function scoreAll(data,ctx){
  var tr=rankMap(ctx.tanRow),fr=rankMap(ctx.fukuRow),scored=[];
  ctx.all.forEach(function(h){
    var tf=getTF(data,h)||{tan:null,fuku:null};var score=0,reasons=[];
    function hit(arr,pt,txt){if((arr||[]).indexOf(h)>=0){score+=pt;reasons.push(txt);}}
    hit(ctx.tanM,4,'単勝メジアン');hit(ctx.fukuM,6,'複勝メジアン');hit(ctx.umaM,6,'馬連メジアン');hit(ctx.wideM,6,'ワイドメジアン');hit(ctx.sanM,7,'三連複メジアン');
    hit(ctx.w80.before,12,'単勝80倍壁前');hit(ctx.w80.after,10,'単勝80倍壁後');
    hit(ctx.w6.before,9,'複勝6倍壁前');hit(ctx.w6.after,7,'複勝6倍壁後');
    hit(ctx.w15.before,14,'複勝15倍壁前');hit(ctx.w15.after,9,'複勝15倍壁後');
    hit(ctx.umaRank6,7,'馬連6位壁ゾーン');
    var tRank=tr[h]||99,fRank=fr[h]||99;
    if(tRank>=8&&fRank<=5){score+=16;reasons.push('単複ズレ大：単勝下位×複勝上位');}
    else if(tRank>=6&&fRank<=8){score+=10;reasons.push('単複ズレ：単勝下位×複勝中位');}
    if(ctx.topConcentration&&fRank<=10&&tRank>=6){score+=7;reasons.push('上位人気集中の裏穴');}
    var nc=countAppearTop(ctx.umaRank,h,12),wc=countAppearTop(ctx.wideRank,h,12),sc=countAppearTop(ctx.sanRank,h,20);
    if(nc>=2){score+=4;reasons.push('馬連上位出現'+nc+'回');}
    if(wc>=2){score+=4;reasons.push('ワイド上位出現'+wc+'回');}
    if(sc>=2){score+=6;reasons.push('三連複上位出現'+sc+'回');}
    var br=bestRankIn(ctx.sanRank,h,8);if(br<=5){score+=5;reasons.push('三連複5位以内出現');}
    var overlap=0;
    ['単勝80倍壁前','単勝80倍壁後','複勝15倍壁前','複勝15倍壁後','馬連6位壁ゾーン','単複ズレ大：単勝下位×複勝上位','単複ズレ：単勝下位×複勝中位'].forEach(function(r){if(reasons.indexOf(r)>=0)overlap++;});
    if(overlap>=3){score+=20;reasons.push('🚨大穴スイッチ核：壁3点重複');}
    else if(overlap>=2){score+=10;reasons.push('大穴スイッチ準核：壁2点重複');}
    if(tf.tan&&Number(tf.tan)>120&&score<40){score-=8;reasons.push('単勝120倍超は保険寄り');}
    scored.push({h:h,score:Math.round(score),tan:tf.tan||'-',fuku:tf.fuku||'-',tRank:tRank,fRank:fRank,reasons:reasons});
  });
  scored.sort(function(a,b){if(b.score!==a.score)return b.score-a.score;return safeNum(a.tan)-safeNum(b.tan);});
  return scored;
}
function detectBigSwitch(ctx,scored){
  var cand=scored.filter(function(x){return x.score>=38 && x.h!==ctx.fav1;}).slice(0,6);
  var max=cand[0]?cand[0].score:0;var level='なし';
  if(max>=65)level='SS';else if(max>=52)level='S';else if(max>=42)level='A';else if(max>=34)level='B';
  return{level:level,items:cand,score:max};
}
function makeRaceDiag(ctx){
  var n1=ctx.umaRank[0]?Number(ctx.umaRank[0].od):null,cls='good',surface='判定不可',risk=0,grounds=[];
  if(n1!==null){if(n1<4){surface='本命戦';cls='good';}else if(n1<9){surface='中荒れ戦';cls='yellow';risk+=1;}else if(n1<15){surface='荒れ戦';cls='orange';risk+=2;}else{surface='大荒れ戦';cls='warn';risk+=3;}}
  if(ctx.topConcentration){risk+=1;grounds=grounds.concat(ctx.concReason);}
  if(ctx.w80.before.length||ctx.w80.after.length){risk+=1;grounds.push('単勝80倍壁あり');}
  if(ctx.w15.before.length||ctx.w15.after.length){risk+=1;grounds.push('複勝15倍壁あり');}
  if(ctx.umaRank6.length){risk+=1;grounds.push('馬連6位壁ゾーンあり');}
  var back='通常';var bcls='good';
  if(risk>=5){back='大穴スイッチ注意';bcls='warn';}
  else if(risk>=3){back='穴混入注意';bcls='yellow';}
  else if(risk>=1){back='軽いズレ注意';bcls='blue';}
  return{surface:surface,cls:cls,risk:risk,back:back,bcls:bcls,grounds:uniq(grounds)};
}
function topH(scored,n){return scored.slice(0,n||6).map(function(x){return x.h;});}
function makeTickets(data,ctx,scored,sw){
  var main=[],hole=[],bomb=[],wide=[],uma=[];
  function addP(a,b){if(a&&b&&a!==b){add(wide,pairKey(a,b));add(uma,pairKey(a,b));}}
  function addT(arr,a,b,c){if(a&&b&&c&&a!==b&&a!==c&&b!==c)add(arr,triKey(a,b,c));}
  var favs=uniq([ctx.fav1,ctx.fav2,ctx.fav3]);var holes=topH(scored,8).filter(function(h){return favs.indexOf(h)<0;});
  if(ctx.sanRank[0])addT(main,ctx.sanRank[0].a,ctx.sanRank[0].b,ctx.sanRank[0].c);
  if(ctx.sanRank[1])addT(main,ctx.sanRank[1].a,ctx.sanRank[1].b,ctx.sanRank[1].c);
  holes.slice(0,4).forEach(function(h){addP(ctx.fav1,h);addP(ctx.fav2,h);});
  holes.slice(0,3).forEach(function(h){addT(main,ctx.fav1,ctx.fav2,h);});
  holes.slice(0,4).forEach(function(h){addT(hole,ctx.fav1,ctx.fav3,h);addT(hole,ctx.fav2,ctx.fav3,h);});
  if(sw&&sw.items.length){
    sw.items.slice(0,4).forEach(function(x){
      addT(bomb,ctx.fav1,ctx.fav2,x.h);
      addT(bomb,ctx.fav1,ctx.fav3,x.h);
    });
    for(var i=0;i<Math.min(3,sw.items.length);i++){
      for(var j=i+1;j<Math.min(4,sw.items.length);j++)addT(bomb,ctx.fav1,sw.items[i].h,sw.items[j].h);
    }
  }
  // 複勝15壁前後は3着救済として必ず少し入れる
  uniq([].concat(ctx.w15.before,ctx.w15.after)).forEach(function(h){addT(bomb,ctx.fav1,ctx.fav2,h);addT(bomb,ctx.fav1,ctx.fav3,h);});
  return{wide:wide.slice(0,10),uma:uma.slice(0,10),main:uniq(main).slice(0,10),hole:uniq(hole).slice(0,10),bomb:uniq(bomb).slice(0,12)};
}
function renderDiag(diag,ctx){
  var html='<div class="card '+(diag.risk>=4?'diagWarn':'diag')+'"><div class="title">🩺レース診断</div>';
  html+='表面：<span class="'+diag.cls+'">'+diag.surface+'</span><br>';
  html+='裏診断：<span class="'+diag.bcls+'">'+diag.back+'</span><br>';
  html+='大穴警戒スコア：<span class="yellow">'+diag.risk+'</span><hr>';
  html+='馬連1人気：<span class="yellow">'+(ctx.umaRank[0]?ctx.umaRank[0].key+' '+ctx.umaRank[0].od+'倍':'なし')+'</span><br>';
  html+='単勝1人気：<span class="yellow">'+(ctx.tanRank[0]?ctx.tanRank[0].h+'番 '+ctx.tanRank[0].tan+'倍':'なし')+'</span><br>';
  html+='複勝15倍壁前：<span class="orange">'+joinH(ctx.w15.before)+'</span><br>';
  html+='単勝80倍壁前：<span class="red">'+joinH(ctx.w80.before)+'</span><br>';
  if(diag.grounds.length)html+='<pre>'+diag.grounds.join('\n')+'</pre>';
  html+='</div>';return html;
}
function renderSwitch(sw){
  var html='<div class="card switch"><div class="title">🚨競馬版・大穴スイッチ</div>';
  html+='判定：<span class="red">'+sw.level+'</span> / 最高スコア <span class="yellow">'+sw.score+'</span><hr>';
  if(!sw.items.length)html+='該当なし<br><span class="small">今回は大穴を無理に頭では狙わず、通常の本線寄り。</span>';
  else sw.items.forEach(function(x,i){html+='<div class="rankLine"><span class="badge">'+(i+1)+'位 '+x.h+'番【'+x.score+'】</span> <span class="small">単'+x.tan+' / 複'+x.fuku+'　'+x.reasons.slice(0,8).join('・')+'</span></div>';});
  html+='<hr><span class="small">単勝80倍壁・複勝15倍壁・馬連6位壁・単複ズレが2つ以上重なる馬を検出。基本はワイド/三連複/3着救済です。</span></div>';
  return html;
}
function renderWallCard(ctx){
  var html='<div class="card"><div class="title">🧱3つの壁</div>';
  html+='<b>単勝80倍の壁</b><br>前：<span class="red">'+joinH(ctx.w80.before)+'</span> / 後：<span class="red">'+joinH(ctx.w80.after)+'</span><hr>';
  html+='<b>複勝6倍の壁</b><br>前：<span class="yellow">'+joinH(ctx.w6.before)+'</span> / 後：<span class="yellow">'+joinH(ctx.w6.after)+'</span><hr>';
  html+='<b>複勝15倍の壁</b><br>前：<span class="orange">'+joinH(ctx.w15.before)+'</span> / 後：<span class="orange">'+joinH(ctx.w15.after)+'</span><hr>';
  html+='<b>馬連6位壁ゾーン</b><br><span class="blue">'+joinH(ctx.umaRank6)+'</span>';
  html+='</div>';return html;
}
function renderHonRow(label,row,med,marks,maxLen){
  var arr=row.slice();while(arr.length<maxLen)arr.push('');var html='<div class="honRow"><div class="honLabel">'+label+'</div>';
  for(var i=0;i<maxLen;i++){
    var h=arr[i],cls='honNum';
    if(!h)cls+=' honEmpty';
    else if((marks.w80||[]).indexOf(h)>=0)cls+=' wall80';
    else if((marks.w15||[]).indexOf(h)>=0)cls+=' wall15';
    else if((marks.w6||[]).indexOf(h)>=0)cls+=' wall6';
    else if(med.indexOf(h)>=0)cls+=' honMed';
    html+='<span class="'+cls+'">'+(h||'')+'</span>';
    if(i<maxLen-1)html+='<span class="bar"></span>';
  }
  html+='</div>';return html;
}
function renderHonpyo(ctx){
  var rows=[{l:'単勝',r:ctx.tanRow,m:ctx.tanM},{l:'複勝',r:ctx.fukuRow,m:ctx.fukuM},{l:'馬連',r:ctx.umaRow,m:ctx.umaM},{l:'ワイド',r:ctx.wideRow,m:ctx.wideM},{l:'三連複',r:ctx.sanRow,m:ctx.sanM}];
  var max=0;rows.forEach(function(x){if(x.r.length>max)max=x.r.length;});
  var marks={w80:uniq([].concat(ctx.w80.before,ctx.w80.after)),w15:uniq([].concat(ctx.w15.before,ctx.w15.after)),w6:uniq([].concat(ctx.w6.before,ctx.w6.after))};
  var html='<div class="card"><div class="title">本表・壁色つき</div><div class="small">赤桃＝単勝80壁 / 橙＝複勝15壁 / 黄＝複勝6壁 / 赤文字＝メジアン</div><div class="legend"><span style="color:#f472b6">単80壁</span><span style="color:#fb923c">複15壁</span><span style="color:#fde047">複6壁</span><span style="color:#fb7185">メジアン</span></div><div class="honWrap">';
  rows.forEach(function(x){html+=renderHonRow(x.l,x.r,x.m,marks,max);});
  html+='</div></div>';return html;
}
function renderRank(scored){
  var html='<div class="card"><div class="title">👑大穴候補ランキング</div>';
  scored.slice(0,10).forEach(function(x,i){html+='<div class="rankLine"><span class="badge">'+(i+1)+'位 '+x.h+'番【'+x.score+'】</span> <span class="small">単'+x.tan+' / 複'+x.fuku+'　'+x.reasons.slice(0,9).join('・')+'</span></div>';});
  html+='</div>';return html;
}
function renderTickets(t){
  var html='<div class="card lamp2"><div class="title">💰買い目候補</div><pre>';
  html+='ワイド\n'+(t.wide.length?t.wide.join('\n'):'なし')+'\n\n';
  html+='馬連\n'+(t.uma.length?t.uma.join('\n'):'なし')+'\n\n';
  html+='三連複・本線\n'+(t.main.length?t.main.join('\n'):'なし')+'\n\n';
  html+='三連複・穴本線\n'+(t.hole.length?t.hole.join('\n'):'なし')+'\n\n';
  html+='三連複・大穴保険\n'+(t.bomb.length?t.bomb.join('\n'):'なし')+'\n\n';
  html+='※大穴馬は基本「3着救済・ワイド・三連複」。単勝へ厚張りしない。';
  html+='</pre></div>';return html;
}
function makeCopyText(title,diag,ctx,sw,scored,tickets){
  var s='';s+=title+'\n競馬メジアン V2.2 大穴スイッチ搭載版\n\n';
  s+='🩺レース診断\n表面：'+diag.surface+'\n裏診断：'+diag.back+'\n大穴警戒スコア：'+diag.risk+'\n';
  s+='馬連1人気：'+(ctx.umaRank[0]?ctx.umaRank[0].key+' '+ctx.umaRank[0].od:'なし')+'\n\n';
  s+='🚨大穴スイッチ\n判定：'+sw.level+' / 最高スコア '+sw.score+'\n';
  s+='単勝80壁 前:'+joinH(ctx.w80.before)+' 後:'+joinH(ctx.w80.after)+'\n';
  s+='複勝6壁 前:'+joinH(ctx.w6.before)+' 後:'+joinH(ctx.w6.after)+'\n';
  s+='複勝15壁 前:'+joinH(ctx.w15.before)+' 後:'+joinH(ctx.w15.after)+'\n';
  s+='馬連6位壁:'+joinH(ctx.umaRank6)+'\n\n';
  s+='大穴候補\n';scored.slice(0,8).forEach(function(x,i){s+=(i+1)+'位 '+x.h+'番【'+x.score+'】 単'+x.tan+' 複'+x.fuku+' '+x.reasons.slice(0,8).join('・')+'\n';});
  s+='\n買い目候補\nワイド\n'+tickets.wide.join('\n')+'\n\n馬連\n'+tickets.uma.join('\n')+'\n\n三連複・本線\n'+tickets.main.join('\n')+'\n\n三連複・穴本線\n'+tickets.hole.join('\n')+'\n\n三連複・大穴保険\n'+tickets.bomb.join('\n');
  return s;
}
function run(){
  try{
    var data=parseData(document.getElementById('input').value),out=document.getElementById('out');
    if(!data.tanfuku.length){out.innerHTML='<div class="card"><div class="title warn">入力不足</div>[TANFUKU] が必要です。</div>';return;}
    var ctx=makeContext(data),scored=scoreAll(data,ctx),sw=detectBigSwitch(ctx,scored),diag=makeRaceDiag(ctx),tickets=makeTickets(data,ctx,scored,sw);
    var html='<div class="card"><div class="title">'+data.title+'</div>';
    html+='単勝1人気：<span class="yellow">'+(ctx.tanRank[0]?ctx.tanRank[0].h+'番 '+ctx.tanRank[0].tan+'倍':'なし')+'</span><br>';
    html+='複勝1人気：<span class="yellow">'+(ctx.fukuRank[0]?ctx.fukuRank[0].h+'番 '+ctx.fukuRank[0].fuku+'倍':'なし')+'</span><br>';
    html+='馬連1人気：<span class="yellow">'+(ctx.umaRank[0]?ctx.umaRank[0].key+' '+ctx.umaRank[0].od+'倍':'なし')+'</span><br>';
    html+='三連複1人気：<span class="yellow">'+(ctx.sanRank[0]?ctx.sanRank[0].key+' '+ctx.sanRank[0].od+'倍':'なし')+'</span></div>';
    html+=renderDiag(diag,ctx)+renderSwitch(sw)+renderWallCard(ctx)+renderHonpyo(ctx)+renderRank(scored)+renderTickets(tickets);
    out.innerHTML=html;
    latestCopyText=makeCopyText(data.title,diag,ctx,sw,scored,tickets);
  }catch(e){document.getElementById('out').innerHTML='<div class="card"><div class="title warn">エラー</div><pre>'+String(e&&e.message?e.message:e)+'</pre></div>';}
}

function copyResult(){if(!latestCopyText){alert('先に解析してください');return;}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(latestCopyText).then(function(){alert('結果をコピーしました');}).catch(function(){fallbackCopy(latestCopyText);});}else fallbackCopy(latestCopyText);}
function fallbackCopy(text){var ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);alert('結果をコピーしました');}
document.getElementById('btnRun').addEventListener('click',run);
document.getElementById('btnSample').addEventListener('click',sample);
document.getElementById('btnClear').addEventListener('click',function(){document.getElementById('input').value='';document.getElementById('out').innerHTML='';latestCopyText='';});
document.getElementById('btnCopy').addEventListener('click',copyResult);
</script>
