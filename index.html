<h3>オッズ一括入力</h3>

<textarea id="allOdds" style="width:100%;height:380px;font-size:16px;"
placeholder="[TANFUKU]
4 3.4 1.4
1 3.9 3.1
9 5.1 2.1

[UMAREN]
4-16 6.9
4-9 7.2

[SANPUKU]
4-9-16 7.6
1-4-9 16.3"></textarea>

<br><br>
<button onclick="calc()">計算</button>

<div id="result" style="font-size:18px;line-height:1.7;"></div>

<script>
function parseInput(){
  const txt=document.getElementById("allOdds").value.trim();
  const lines=txt.split(/\n/);
  let mode="";
  let tanfuku=[], umaren=[], sanpuku=[];

  for(let line of lines){
    line=line.trim();
    if(!line) continue;

    if(line==="[TANFUKU]"){mode="tanfuku";continue;}
    if(line==="[UMAREN]"){mode="umaren";continue;}
    if(line==="[SANPUKU]"){mode="sanpuku";continue;}

    const a=line.split(/\s+/);

    if(mode==="tanfuku"){
      tanfuku.push({
        no:a[0],
        tan:parseFloat(a[1]),
        fuku:parseFloat(a[2])
      });
    }

    if(mode==="umaren"){
      umaren.push({
        pair:a[0],
        odds:parseFloat(a[1])
      });
    }

    if(mode==="sanpuku"){
      sanpuku.push({
        pair:a[0],
        odds:parseFloat(a[1])
      });
    }
  }

  return {tanfuku,umaren,sanpuku};
}

function median(arr,key){
  if(arr.length===0) return null;
  let s=[...arr].sort((a,b)=>a[key]-b[key]);
  let n=s.length;
  if(n%2===1){
    let x=s[Math.floor(n/2)];
    return {items:[x], value:x[key]};
  }else{
    let x=s[n/2-1], y=s[n/2];
    return {items:[x,y], value:(x[key]+y[key])/2};
  }
}

function medianOdds(arr){
  if(arr.length===0) return null;
  let s=[...arr].sort((a,b)=>a.odds-b.odds);
  let n=s.length;
  if(n%2===1){
    let x=s[Math.floor(n/2)];
    return {items:[x], value:x.odds};
  }else{
    let x=s[n/2-1], y=s[n/2];
    return {items:[x,y], value:(x.odds+y.odds)/2};
  }
}

function numsFromItems(items){
  let set=new Set();
  items.forEach(x=>{
    if(x.no) set.add(x.no);
    if(x.pair){
      x.pair.split("-").forEach(n=>set.add(n));
    }
  });
  return [...set];
}

function addCount(counts, nums){
  nums.forEach(n=>{
    counts[n]=(counts[n]||0)+1;
  });
}

function showMed(title,m,key,counts){
  if(!m){
    return `<p><b>${title}</b>：該当なし</p>`;
  }
  let nums=numsFromItems(m.items);
  addCount(counts,nums);
  return `
  <p>
  <b>${title}</b><br>
  馬番：${nums.join("・")}<br>
  メジアン値：${m.value.toFixed(2)}
  </p>`;
}

function calc(){
  const {tanfuku,umaren,sanpuku}=parseInput();
  let counts={};
  let out="";

  out+=`<div style="background:#fff3cd;border:1px solid #f0c36d;padding:10px;margin-bottom:15px;">
  ★注目馬：<span id="focus"></span><br>
  重複数：<span id="maxcnt"></span>回
  </div>`;

  out+="<h2>結果</h2>";

  out+=showMed("単勝10倍以内メジアン",
    median(tanfuku.filter(x=>x.tan<=10),"tan"),"tan",counts);

  out+=showMed("単勝10倍以上20倍以内メジアン",
    median(tanfuku.filter(x=>x.tan>=10 && x.tan<=20),"tan"),"tan",counts);

  out+=showMed("単勝10倍以上メジアン",
    median(tanfuku.filter(x=>x.tan>=10),"tan"),"tan",counts);

  out+=showMed("単勝20倍以内メジアン",
    median(tanfuku.filter(x=>x.tan<=20),"tan"),"tan",counts);

  out+=showMed("単勝99倍以内メジアン",
    median(tanfuku.filter(x=>x.tan<=99),"tan"),"tan",counts);

  out+=showMed("単勝100倍以上メジアン",
    median(tanfuku.filter(x=>x.tan>=100),"tan"),"tan",counts);

  out+=showMed("単勝全体メジアン",
    median(tanfuku,"tan"),"tan",counts);

  out+="<hr>";

  out+=showMed("複勝6倍壁前2頭1番人気からのメジアン",
    median(tanfuku.filter(x=>x.fuku<=6),"fuku"),"fuku",counts);

  out+=showMed("複勝15倍前二頭から6倍以上メジアン",
    median(tanfuku.filter(x=>x.fuku>=6 && x.fuku<=15),"fuku"),"fuku",counts);

  out+=showMed("複勝12倍以内メジアン",
    median(tanfuku.filter(x=>x.fuku<=12),"fuku"),"fuku",counts);

  out+=showMed("複勝全体メジアン",
    median(tanfuku,"fuku"),"fuku",counts);

  out+="<hr>";

  out+=showMed("馬連全体メジアン",
    medianOdds(umaren),"odds",counts);

  out+=showMed("馬連10倍以内メジアン",
    medianOdds(umaren.filter(x=>x.odds<=10)),"odds",counts);

  out+=showMed("馬連20倍以内メジアン",
    medianOdds(umaren.filter(x=>x.odds<=20)),"odds",counts);

  out+="<hr>";

  out+=showMed("三連複全体メジアン",
    medianOdds(sanpuku),"odds",counts);

  out+=showMed("三連複20倍以内メジアン",
    medianOdds(sanpuku.filter(x=>x.odds<=20)),"odds",counts);

  out+="<h2>総合重複ランキング</h2>";

  let rank=Object.entries(counts).sort((a,b)=>b[1]-a[1]);

  rank.forEach((r,i)=>{
    out+=`${i===0?"★★★★★ ":""}${r[0]}番：${r[1]}回<br>`;
  });

  document.getElementById("result").innerHTML=out;

  let max=rank.length?rank[0][1]:0;
  let focus=rank.filter(x=>x[1]===max).map(x=>x[0]);

  document.getElementById("focus").textContent=focus.join("・");
  document.getElementById("maxcnt").textContent=max;
}
</script>
