<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>メジアン理論</title>
<style>
body{font-family:sans-serif;padding:18px;font-size:18px}
textarea{width:100%;height:220px;font-size:18px}
button{font-size:22px;padding:10px 20px;margin:15px 0}
.box{background:#fff3cd;border:2px solid #f0c36d;padding:12px;margin:15px 0;font-size:24px}
.wall{background:#e8f4ff;border:2px solid #5aa9e6;padding:12px;margin:15px 0;font-size:21px}
.break{background:#ffe8e8;border:2px solid #e66;padding:12px;margin:15px 0;font-size:22px}
.umaren{background:#eef9ee;border:2px solid #66aa66;padding:12px;margin:15px 0;font-size:21px}
.arare{background:#f3e8ff;border:2px solid #8a5cf6;padding:12px;margin:15px 0;font-size:22px}
.gap{background:#fff0e6;border:2px solid #ff9933;padding:12px;margin:15px 0;font-size:21px}
.summary{background:#fff8dc;border:3px solid #d4a017;padding:14px;margin:15px 0;font-size:24px}
.result{font-size:20px;line-height:1.7}
b{font-size:22px}
</style>
</head>
<body>

<h1>メジアン理論</h1>

<p>単勝・複勝入力：馬番 単勝 複勝上限</p>
<textarea id="data" placeholder="例
7 2.7 1.7
3 3.2 2.1
4 4.7 1.8"></textarea>

<p>馬連・馬複入力：組み合わせ オッズ</p>
<textarea id="umaren" placeholder="例
3-7 4.5
3-4 4.6
4-7 6.1"></textarea>

<button onclick="calc()">計算</button>

<div id="result" class="result"></div>

<script>
function sorted(list){
  return list.slice().sort((a,b)=>a.odds-b.odds);
}

function medianPick(list){
  const s=sorted(list);
  const n=s.length;
  if(n===0)return null;
  const mid=Math.floor(n/2);

  if(n%2===1){
    const v=s[mid].odds;
    return {items:s.filter(x=>x.odds===v), value:v};
  }else{
    return {
      items:[s[mid-1],s[mid]],
      value:((s[mid-1].odds+s[mid].odds)/2).toFixed(2)
    };
  }
}

function addCount(count,items,point=1){
  items.forEach(h=>{
    if(h.num) count[h.num]=(count[h.num]||0)+point;
    if(h.a && h.b){
      count[h.a]=(count[h.a]||0)+point;
      count[h.b]=(count[h.b]||0)+point;
    }
  });
}

function nums(list){
  return list.map(x=>{
    if(x.num)return x.num;
    if(x.a && x.b)return x.a+"-"+x.b;
    return "";
  }).join("・");
}

function pairNums(list){
  let arr=[];
  list.forEach(x=>{
    if(x.a && x.b){
      arr.push(x.a);
      arr.push(x.b);
    }
  });
  return [...new Set(arr)].join("・");
}

function wallAround(list,wall){
  const s=sorted(list);
  const i=s.findIndex(x=>x.odds>=wall);
  if(i<0)return [];
  return s.slice(Math.max(0,i-2),Math.min(s.length,i+2));
}

function wallBreak(list,wall){
  const s=sorted(list);
  const i=s.findIndex(x=>x.odds>=wall);
  if(i<0)return null;
  return s[i];
}

function maxGap(list){
  const s=sorted(list);
  if(s.length<2)return null;
  let best={gap:0,before:null,after:null};
  for(let i=1;i<s.length;i++){
    const gap=s[i].odds-s[i-1].odds;
    if(gap>best.gap){
      best={gap,before:s[i-1],after:s[i]};
    }
  }
  return best;
}

function parsePairs(text){
  if(!text.trim())return [];
  return text.trim().split(/\n+/).map(line=>{
    const p=line.trim().split(/\s+/);
    const pair=p[0].split("-");
    return {a:pair[0],b:pair[1],odds:parseFloat(p[1])};
  }).filter(x=>x.a && x.b && !isNaN(x.odds));
}

function ranking(count){
  return Object.entries(count).sort((a,b)=>b[1]-a[1]);
}

function rankingHtml(title,count){
  const r=ranking(count);
  let html=`<h2>${title}</h2>`;
  r.forEach(([num,c],i)=>{
    const star=i===0 ? "★★★★★" : i===1 ? "★★★★☆" : i===2 ? "★★★☆☆" : "";
    html+=`<p>${star} ${num}番：${c}回</p>`;
  });
  return html;
}

function calc(){
  const rows=document.getElementById("data").value.trim().split(/\n+/).map(line=>{
    const p=line.trim().split(/\s+/);
    return {num:p[0],win:parseFloat(p[1]),place:parseFloat(p[2])};
  }).filter(x=>x.num && !isNaN(x.win));

  const pairRows=parsePairs(document.getElementById("umaren").value);

  const winRows=rows.map(x=>({num:x.num,odds:x.win}));
  const placeRows=rows.filter(x=>!isNaN(x.place)).map(x=>({num:x.num,odds:x.place}));

  const place6WallFromFavorite=(()=>{
    const s=sorted(placeRows);
    const i=s.findIndex(x=>x.odds>=6);
    if(i<0)return [];
    return s.slice(0,Math.max(0,i-2));
  })();

  const place15Before2To6Over=(()=>{
    const s=sorted(placeRows);
    const i=s.findIndex(x=>x.odds>=15);
    if(i<0)return [];
    const start=Math.max(0,i-2);
    return s.slice(start).filter(x=>x.odds>=6);
  })();

  const groups=[
    ["単勝10倍以内メジアン", winRows.filter(x=>x.odds<=10)],
    ["単勝10倍以上20倍以内メジアン", winRows.filter(x=>x.odds>=10 && x.odds<=20)],
    ["単勝10倍以上メジアン", winRows.filter(x=>x.odds>=10)],
    ["単勝99倍以内メジアン", winRows.filter(x=>x.odds<=99)],
    ["単勝100倍以上メジアン", winRows.filter(x=>x.odds>=100)],
    ["単勝全体メジアン", winRows],
    ["複勝6倍壁前2頭1番人気からのメジアン", place6WallFromFavorite],
    ["複勝15倍前二頭から6倍以上メジアン", place15Before2To6Over],
    ["複勝12倍以内メジアン", placeRows.filter(x=>x.odds<=12)],
    ["複勝全体メジアン", placeRows]
  ];

  const pairGroups=[
    ["馬連全体メジアン", pairRows],
    ["馬連10倍以内メジアン", pairRows.filter(x=>x.odds<=10)],
    ["馬連20倍以内メジアン", pairRows.filter(x=>x.odds<=20)]
  ];

  let totalCount={};
  let pairCount={};
  let medianDetailHtml="<h2>結果</h2>";

  groups.forEach(([name,list])=>{
    const r=medianPick(list);
    if(!r){
      medianDetailHtml+=`<p>${name}：該当なし</p>`;
      return;
    }
    addCount(totalCount,r.items);
    medianDetailHtml+=`<p><b>${name}</b><br>馬番：${nums(r.items)}<br>メジアン値：${r.value}</p>`;
  });

  let pairHtml="";
  pairGroups.forEach(([name,list])=>{
    const r=medianPick(list);
    if(!r){
      pairHtml+=`<p>${name}：該当なし</p>`;
      return;
    }
    addCount(totalCount,r.items);
    addCount(pairCount,r.items);
    pairHtml+=`<p><b>${name}</b><br>組：${nums(r.items)}<br>構成馬：${pairNums(r.items)}<br>メジアン値：${r.value}</p>`;
  });

  const totalRanking=ranking(totalCount);
  const topCount=totalRanking[0]?.[1]||0;
  const top=totalRanking.filter(x=>x[1]===topCount).map(x=>x[0]);

  const secondCount=totalRanking.find(x=>x[1]<topCount)?.[1]||0;
  const second=totalRanking.filter(x=>x[1]===secondCount).map(x=>x[0]);

  const thirdCount=totalRanking.find(x=>x[1]<secondCount)?.[1]||0;
  const third=totalRanking.filter(x=>x[1]===thirdCount).map(x=>x[0]);

  const w20=wallBreak(winRows,20);
  const p6=wallBreak(placeRows,6);
  const p12=wallBreak(placeRows,12);
  const p15=wallBreak(placeRows,15);

  const win20Wall=wallAround(winRows,20);
  const place6Wall=wallAround(placeRows,6);
  const place12Wall=wallAround(placeRows,12);
  const place15Wall=wallAround(placeRows,15);

  const winGap=maxGap(winRows);
  const placeGap=maxGap(placeRows);
  const pairGap=maxGap(pairRows);

  let rough=0;
  if(w20)rough++;
  if(p6)rough++;
  if(p12)rough++;
  if(p15)rough++;
  if(pairRows.some(x=>x.odds>=30))rough++;
  if(winRows.some(x=>x.odds>=100))rough++;
  if(winGap && winGap.gap>=10)rough++;
  if(placeGap && placeGap.gap>=3)rough++;

  let roughText="★☆☆☆☆ 低め";
  if(rough>=2)roughText="★★☆☆☆ やや荒れ";
  if(rough>=3)roughText="★★★☆☆ 荒れ注意";
  if(rough>=4)roughText="★★★★☆ 波乱注意";
  if(rough>=5)roughText="★★★★★ 大荒れ警戒";

  const gapHorse=[
    winGap?.after?.num,
    placeGap?.after?.num
  ].filter(Boolean);

  const wallHorse=[
    w20?.num,
    p6?.num,
    p12?.num,
    p15?.num
  ].filter(Boolean);

  let html="";

  html+=`<div class="summary">
<b>★総合判定</b><br>
本命候補：${top.join("・")||"なし"}<br>
対抗候補：${second.join("・")||"なし"}<br>
穴候補：${[...new Set([...third,...wallHorse,...gapHorse])].join("・")||"なし"}<br>
荒れ指数：${roughText}
</div>`;

  html+=`<div class="box">
<b>★メジアン王</b><br>
超注目馬：${top.join("・")||"なし"}<br>
重複数：${topCount}回<br>
対抗：${second.join("・")||"なし"}<br>
3番手：${third.join("・")||"なし"}
</div>`;

  html+=medianDetailHtml;

  html+=`<div class="arare"><b>★荒れ指数</b><br>${roughText}</div>`;

  html+=`<div class="break"><b>★壁突破馬</b><br>
単勝20倍突破馬：${w20 ? w20.num+"番（"+w20.odds+"）" : "該当なし"}<br>
複勝6倍突破馬：${p6 ? p6.num+"番（"+p6.odds+"）" : "該当なし"}<br>
複勝12倍突破馬：${p12 ? p12.num+"番（"+p12.odds+"）" : "該当なし"}<br>
複勝15倍突破馬：${p15 ? p15.num+"番（"+p15.odds+"）" : "該当なし"}
</div>`;

  html+=`<div class="wall"><b>★境目・壁前後</b><br>
単勝20倍壁前後：${nums(win20Wall)||"該当なし"}<br>
複勝6倍壁前後：${nums(place6Wall)||"該当なし"}<br>
複勝12倍壁前後：${nums(place12Wall)||"該当なし"}<br>
複勝15倍壁前後：${nums(place15Wall)||"該当なし"}
</div>`;

  html+=`<div class="gap"><b>★乖離差ポイント</b><br>
単勝最大乖離：${winGap ? winGap.before.num+"番（"+winGap.before.odds+"） → "+winGap.after.num+"番（"+winGap.after.odds+"） / 差 "+winGap.gap.toFixed(1) : "なし"}<br>
複勝最大乖離：${placeGap ? placeGap.before.num+"番（"+placeGap.before.odds+"） → "+placeGap.after.num+"番（"+placeGap.after.odds+"） / 差 "+placeGap.gap.toFixed(1) : "なし"}<br>
馬連最大乖離：${pairGap ? pairGap.before.a+"-"+pairGap.before.b+"（"+pairGap.before.odds+"） → "+pairGap.after.a+"-"+pairGap.after.b+"（"+pairGap.after.odds+"） / 差 "+pairGap.gap.toFixed(1) : "なし"}
</div>`;

  html+=`<div class="umaren"><b>★馬連メジアン</b><br>${pairHtml}</div>`;

  html+=rankingHtml("総合重複ランキング",totalCount);
  html+=rankingHtml("馬連重複ランキング",pairCount);

  document.getElementById("result").innerHTML=html;
}
</script>

</body>
</html>
