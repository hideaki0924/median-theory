function makeMatchanSystem(ctx,scored,diag){var upper=[],place=[],cut=[];scored.forEach(function(x){var tan=safeNum(x.tan),fuku=safeNum(x.fuku),r=x.reasons.join(' / '),rank=x.tRank;var medianHit=(r.indexOf('単勝10倍台メジアン')>=0||r.indexOf('単勝20倍台メジアン')>=0||r.indexOf('単勝メジアン')>=0);var fukuHit=(r.indexOf('複勝12倍以下メジアン')>=0||r.indexOf('複勝6倍壁前')>=0||r.indexOf('複勝15倍壁前')>=0||r.indexOf('複勝15倍断層下2頭')>=0||r.indexOf('複勝メジアン')>=0);var sanHit=(r.indexOf('三連複メジアン')>=0||x.sanBest<=5);var cliffHead=(r.indexOf('断層下＋中穴頭注意')>=0);var upperCond=(x.h!==ctx.fav1&&rank>=2&&rank<=5&&tan>=4&&tan<=20&&fuku>=1.3&&fuku<=6.2&&medianHit&&fukuHit&&sanHit);var cliffCond=(x.h!==ctx.fav1&&cliffHead&&tan>=15&&tan<=45&&(sanHit||r.indexOf('中穴保護')>=0));var holeCond=(x.h!==ctx.fav1&&(rank>=6||tan>20)&&fuku<=15&&(fukuHit||sanHit));if(upperCond||cliffCond){var sc=0;if(medianHit)sc+=25;if(fukuHit)sc+=25;if(sanHit)sc+=25;if(cliffHead)sc+=22;if(diag.suitable)sc+=15;if(diag.hard)sc+=8;if(tan>=10&&tan<=20)sc+=7;if(tan>=20&&tan<=40)sc+=10;if(rank>=2&&rank<=4)sc+=5;upper.push({h:x.h,score:sc,tan:x.tan,fuku:x.fuku,reason:x.reasons});}else if(holeCond){if(diag.hard||diag.wild)cut.push(x);else place.push(x);}else if(x.h!==ctx.fav1&&x.sanBest<=5&&tan<=30){place.push(x);}});upper.sort(function(a,b){return b.score-a.score;});place=uniq(place.map(function(x){return x.h;})).map(function(h){return scored.filter(function(x){return x.h===h;})[0];});cut=uniq(cut.map(function(x){return x.h;})).map(function(h){return scored.filter(function(x){return x.h===h;})[0];});var top=upper[0]||null;var partner=null,tri=null;if(top){for(var i=0;i<ctx.sanRank.length;i++){var t=ctx.sanRank[i];if(t.a===top.h||t.b===top.h||t.c===top.h){var arr=[t.a,t.b,t.c];if(arr.indexOf(ctx.fav1)>=0){tri=t.key;var others=arr.filter(function(h){return h!==top.h&&h!==ctx.fav1;});partner=others[0]||ctx.fav2;break;}}}if(!tri&&ctx.sanRank.length){for(var j=0;j<ctx.sanRank.length;j++){var u=ctx.sanRank[j];if(u.a===top.h||u.b===top.h||u.c===top.h){tri=u.key;var ar=[u.a,u.b,u.c].filter(function(h){return h!==top.h;});partner=ar[0];break;}}}if(!partner)partner=ctx.fav2;}var type='見送り';if(top){var rt=top.reason.join('・');if(rt.indexOf('断層下＋中穴頭注意')>=0)type='複勝15倍断層下・逆転頭型';else if(diag.wild)type='単勝少額型';else type='上位ズレ単勝型';}else if(place.length)type='3連複相手型';return{type:type,upper:upper.slice(0,3),place:place.slice(0,5),cut:cut.slice(0,5),top:top,partner:partner,tri:tri};}
function addP(arr,a,b){if(a&&b&&a!==b)add(arr,pairKey(a,b));}
function addT(arr,a,b,c){if(a&&b&&c&&a!==b&&a!==c&&b!==c)add(arr,triKey(a,b,c));}
function makeTickets(ctx,ms,scored){var wide=[],uma=[],main=[],hole=[],bomb=[];if(ms.top){addP(wide,ms.top.h,ms.partner);addP(uma,ms.top.h,ms.partner);if(ms.tri)bomb.push(ms.tri);else addT(bomb,ctx.fav1,ms.top.h,ms.partner);}ctx.sanRank.slice(0,5).forEach(function(t){addT(main,t.a,t.b,t.c);});ms.place.slice(0,3).forEach(function(x){addT(hole,ctx.fav1,ctx.fav2,x.h);addT(hole,ctx.fav1,ctx.fav3,x.h);});ms.cut.slice(0,2).forEach(function(x){addT(bomb,ctx.fav1,ctx.fav2,x.h);});(ctx.fukuCliff15.lower||[]).forEach(function(h){if(h!==ctx.fav1){addT(bomb,ctx.fav1,ctx.fav2,h);addT(bomb,ctx.fav1,ctx.fav3,h);}});return{wide:uniq(wide).slice(0,4),uma:uniq(uma).slice(0,4),main:uniq(main).slice(0,6),hole:uniq(hole).slice(0,6),bomb:uniq(bomb).slice(0,8)};}
function detectMoves(ctx,scored,diag){var tr=rankMap(ctx.tanRow),fr=rankMap(ctx.fukuRow),sr=rankMap(ctx.sanRow);var out=[];function push(code,h,name,why){var key=code+'-'+h+'-'+name;if(out.some(function(x){return x.key===key;}))return;out.push({key:key,code:code,h:String(h),name:name,why:why});}
  scored.forEach(function(x){var h=x.h,t=safeNum(x.tan),f=safeNum(x.fuku),tRank=tr[h]||99,fRank=fr[h]||99,sBest=x.sanBest;
    if(t>=50&&f<=15){push(1,h,'単複ズレ大穴','単勝50倍以上なのに複勝15倍以内');}
    if(f>=10&&f<=15&&tRank>=7&&(ctx.w15.before.indexOf(h)>=0||ctx.w15.after.indexOf(h)>=0)){push(2,h,'複勝15倍壁末端','複勝10〜15倍台で人気下位。15倍壁の末端にいる');}
    if(tRank>=5&&sBest<=5){push(3,h,'三連複先行支持ジャンプ','単勝人気は低いのに三連複5位以内に先に出ている');}
    if((diag.hard||safeNum(ctx.tanRank[0]&&ctx.tanRank[0].tan)<=2)&&h!==ctx.fav1&&sBest<=5&&tRank>=3){push(5,h,'本命飛び時の保護馬','1番人気が強い時、2〜3着ではなく1着に穴が飛ぶ時の保護候補');}
    if(ctx.fukuCliff15&&ctx.fukuCliff15.on&&(ctx.fukuCliff15.lower||[]).indexOf(h)>=0){push(6,h,'複勝15倍断層下2頭','15倍以上から6〜7倍台以下へ一気に落ちた直下。頭・三連複保護注意');}
  });
  var rows=[ctx.umaRow,ctx.tanRow,ctx.fukuRow,ctx.sanRow];var pos={};ctx.all.forEach(function(h){pos[h]=[];rows.forEach(function(r){var p=r.indexOf(h);pos[h].push(p>=0?p+1:99);});});var vertical=[];ctx.all.forEach(function(h){var p=pos[h];var cntBy={};p.forEach(function(v){if(v<=6)cntBy[v]=(cntBy[v]||0)+1;});var best=0,bestPos=99;Object.keys(cntBy).forEach(function(k){if(cntBy[k]>best){best=cntBy[k];bestPos=Number(k);}});if(best>=3)vertical.push({h:h,best:best,pos:bestPos});});vertical.sort(function(a,b){if(b.best!==a.best)return b.best-a.best;return a.pos-b.pos;});var strict=vertical.filter(function(x){return x.best>=3;});if(strict.length===1){push(4,strict[0].h,'縦揃い注意馬','バラバラな本表の中で、この馬だけ同じ位置に残る');}else if(strict.length>1){var top=strict[0];var onlyTop=strict.filter(function(x){return x.best===top.best&&x.pos===top.pos;});if(top.best===4&&onlyTop.length===1&&strict.length<=2){push(4,top.h,'縦揃い注意馬','バラバラな本表の中で、この馬だけ同じ位置に残る');}}
  out.sort(function(a,b){if(a.code!==b.code)return a.code-b.code;return Number(a.h)-Number(b.h);});return out.slice(0,10);
}
function renderTop(data,ctx){return '<div class="card"><div class="title">'+data.title+'</div>単勝1人気：<span class="yellow">'+(ctx.tanRank[0]?ctx.tanRank[0].h+'番 '+ctx.tanRank[0].tan+'倍':'なし')+'</span><br>馬連1人気：<span class="yellow">'+(ctx.umaRank[0]?ctx.umaRank[0].key+' '+ctx.umaRank[0].od+'倍':'なし')+'</span><br>三連複1人気：<span class="yellow">'+(ctx.sanRank[0]?ctx.sanRank[0].key+' '+ctx.sanRank[0].od+'倍':'なし')+'</span></div>';}
function renderDiag(diag,ctx){var c=ctx.counts;var html='<div class="card '+(diag.hard||diag.wild?'diagWarn':'diag')+'"><div class="title">🩺レース診断</div>';html+='表面：<span class="'+diag.cls+'">'+diag.surface+'</span><br>裏診断：<span class="yellow">'+diag.back+'</span><br>まっちゃん判定：<span class="red">'+diag.matchanType+'</span><hr>';html+='単勝10倍未満：'+c.tanUnder10+'頭 / 単勝30倍未満：'+c.tanUnder30+'頭<br>';html+='複勝6倍以内：'+c.fukuUnder6+'頭 / 10倍以内：'+c.fukuUnder10+'頭 / 15倍以内：'+c.fukuUnder15+'頭<br>';html+='単勝10倍台メジアン：<span class="yellow">'+joinH(ctx.tan10M)+'</span><br>';html+='単勝20倍台メジアン：<span class="yellow">'+joinH(ctx.tan20M)+'</span><br>';html+='複勝12倍以下メジアン：<span class="blue">'+joinH(ctx.fuku12M)+'</span><br>';html+='複勝6壁前：<span class="yellow">'+joinH(ctx.w6.before)+'</span> / 複勝15壁前：<span class="orange">'+joinH(ctx.w15.before)+'</span>';if(ctx.fukuCliff15&&ctx.fukuCliff15.on){html+='<div class="cliffBox"><span class="red">🚨複勝15倍断層下2頭 要注意</span><br>';html+='断層下2頭：<span class="cyan">'+joinH(ctx.fukuCliff15.lower)+'</span><br>';html+='断層上：<span class="orange">'+(ctx.fukuCliff15.upper?ctx.fukuCliff15.upper+'番':'なし')+'</span><br>';html+='<span class="small">'+ctx.fukuCliff15.reason+'</span></div>';}html+='</div>';return html;}
function renderMatchan(ms,diag,ctx,moves){var html='<div class="card matchan"><div class="title">🔥まっちゃん単勝システム</div>';html+='最終タイプ：<span class="red">'+ms.type+'</span><br>';html+='<span class="small">硬すぎ診断でも、単勝2〜5人気・単勝4〜20倍・複勝2〜6倍台・三連複本線絡みの馬は「上位ズレ単勝」として残します。大穴昇格だけの馬は単勝厚張りからカット。V2.34では複勝15倍断層下2頭も要注意。</span><hr>';if(ms.top){html+='<div class="rankLine"><span class="badge">単勝候補 '+ms.top.h+'番</span> 単'+ms.top.tan+' / 複'+ms.top.fuku+'<br><span class="small">'+ms.top.reason.slice(0,9).join('・')+'</span></div>';html+='<pre>最終買い目\n単勝 '+ms.top.h+'　700円\nワイド '+pairKey(ms.top.h,ms.partner)+'　200円\n三連複 '+(ms.tri||triKey(ctx.fav1,ms.top.h,ms.partner))+'　100円</pre>';}else{html+='単勝厚張り候補なし<br>';}html+='<hr>3連複相手型：'+(ms.place.length?ms.place.map(function(x){return x.h+'番';}).join('・'):'なし')+'<br>';html+='大穴単勝カット：'+(ms.cut.length?ms.cut.map(function(x){return x.h+'番';}).join('・'):'なし');if(moves&&moves.length){html+='<hr>移動馬・変な動き馬<br>';moves.forEach(function(m){html+='<span class="small">'+m.code+' '+m.h+'番 '+m.name+'｜'+m.why+'</span><br>';});}html+='</div>';return html;}
function renderSwitch(sw){var html='<div class="card switch"><div class="title">🚨大穴スイッチ</div>判定：<span class="red">'+sw.level+'</span> / 最高 '+sw.score+'<hr>';if(!sw.items.length)html+='該当なし';else sw.items.forEach(function(x,i){html+='<div class="rankLine"><span class="badge">'+(i+1)+'位 '+x.h+'番【'+x.score+'】</span> <span class="small">単'+x.tan+' / 複'+x.fuku+'　'+x.reasons.slice(0,9).join('・')+'</span></div>';});html+='</div>';return html;}
function barClassFor(label,i,ctx){if(label==='単勝'&&ctx.w80.idx===i)return' bar80';if(label==='複勝'&&ctx.w6.idx===i)return' bar6';if(label==='複勝'&&ctx.w15.idx===i)return' bar15';if(label==='馬連'&&ctx.umaGap.indexOf(i)>=0)return' barGap';if(label==='三連複'&&ctx.sanGap.indexOf(i)>=0)return' barGap';return'';}
function renderHonRow(label,row,med,ctx,maxLen){var arr=row.slice();while(arr.length<maxLen)arr.push('');var marks={w80:uniq([].concat(ctx.w80.before,ctx.w80.after)),w15:uniq([].concat(ctx.w15.before,ctx.w15.after)),w6:uniq([].concat(ctx.w6.before,ctx.w6.after)),cliff:ctx.fukuCliff15.lower||[]};var html='<div class="honRow"><div class="honLabel">'+label+'</div>';for(var i=0;i<maxLen;i++){var h=arr[i],cls='honNum';if(!h)cls+=' honEmpty';else if(label==='複勝'&&(marks.cliff||[]).indexOf(h)>=0)cls+=' cliff15';else if((marks.w80||[]).indexOf(h)>=0)cls+=' wall80';else if((marks.w15||[]).indexOf(h)>=0)cls+=' wall15';else if((marks.w6||[]).indexOf(h)>=0)cls+=' wall6';else if(med.indexOf(h)>=0)cls+=' honMed';html+='<span class="'+cls+'">'+(h||'')+'</span>';if(i<maxLen-1)html+='<span class="bar'+barClassFor(label,i,ctx)+'"></span>';}html+='</div>';return html;}

function makeCopyText(data,diag,ctx,ms,sw,tickets,scored,moves){var s=data.title+'\n競馬メジアン V2.34 まっちゃん単勝システム＋移動馬＋複勝15倍断層下2頭\n\n';s+='🩺レース診断\n表面：'+diag.surface+'\nまっちゃん判定：'+diag.matchanType+'\n単勝10倍未満：'+ctx.counts.tanUnder10+'頭\n単勝30倍未満：'+ctx.counts.tanUnder30+'頭\n複勝6倍以内：'+ctx.counts.fukuUnder6+'頭\n複勝10倍以内：'+ctx.counts.fukuUnder10+'頭\n複勝15倍以内：'+ctx.counts.fukuUnder15+'頭\n';if(ctx.fukuCliff15&&ctx.fukuCliff15.on){s+='\n🚨複勝15倍断層下2頭 要注意\n断層下2頭：'+joinH(ctx.fukuCliff15.lower)+'\n断層上：'+(ctx.fukuCliff15.upper?ctx.fukuCliff15.upper+'番':'なし')+'\n'+ctx.fukuCliff15.reason+'\n';}s+='\n🔥まっちゃん単勝システム\n最終タイプ：'+ms.type+'\n';if(ms.top){s+='単勝候補：'+ms.top.h+'番 単'+ms.top.tan+' 複'+ms.top.fuku+'\n買い目：単勝 '+ms.top.h+' 700円 / ワイド '+pairKey(ms.top.h,ms.partner)+' 200円 / 三連複 '+(ms.tri||triKey(ctx.fav1,ms.top.h,ms.partner))+' 100円\n';}s+='3連複相手型：'+(ms.place.length?ms.place.map(function(x){return x.h+'番';}).join('・'):'なし')+'\n大穴単勝カット：'+(ms.cut.length?ms.cut.map(function(x){return x.h+'番';}).join('・'):'なし')+'\n\n';s+='移動馬・変な動き馬\n';if(moves&&moves.length){moves.forEach(function(m){s+=m.code+' '+m.h+'番 '+m.name+'｜'+m.why+'\n';});}else{s+='発動なし\n';}s+='\n大穴スイッチ：'+sw.level+' / '+sw.score+'\n';s+='圧縮買い目\nワイド\n'+tickets.wide.join('\n')+'\n\n三連複・本線\n'+tickets.main.join('\n')+'\n\n三連複・保険\n'+tickets.bomb.join('\n')+'\n\n候補上位\n';scored.slice(0,8).forEach(function(x,i){s+=(i+1)+'位 '+x.h+'番【'+x.score+'】 単'+x.tan+' 複'+x.fuku+' '+x.reasons.slice(0,8).join('・')+'\n';});return s;}
