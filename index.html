<body>

<h1>チャッピー神予想 V10.2<br>偽本命超勝負版</h1>

<div class="box">
<textarea id="input" placeholder="【レース名】

[TANFUKU]

[UMAREN]

[WIDE]

[SANPUKU]"></textarea>
<br>
<button onclick="analyze()">解析</button>
<button class="btn2" onclick="testData()">テスト</button>
<button class="btn3" onclick="resetInput()">リセット</button>
<button class="btn4" onclick="copyResult()">結果コピー</button>
<button class="btn5" onclick="goBottom()">最下部へ</button>
</div>

<div id="result"></div>
<div id="bottomAnchor"></div>

<script>
function norm(s){
  return s
    .replace(/[０-９]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0))
    .replace(/[－ー―–—]/g,"-")
    .replace(/[．]/g,".");
}

function parseInput(text){
  text=norm(text);
  const lines=text.split(/\n/).map(x=>x.trim()).filter(Boolean);

  let mode="";
  let raceName="レース名未入力";

  const tanpuku=[];
  const umaren=[];
  const wide=[];
  const sanpuku=[];

  for(const line of lines){
    if(line.match(/^【.*】$/)){
      const t=line.replace(/[【】]/g,"");
      if(!t.match(/TANFUKU|UMAREN|WIDE|SANPUKU|単勝|複勝|馬連|馬複|ワイド|三連複/i)){
        raceName=t;
      }
      continue;
    }

    if(line.match(/TANFUKU|単勝|複勝/i)){mode="TANFUKU";continue;}
    if(line.match(/UMAREN|馬連|馬複/i)){mode="UMAREN";continue;}
    if(line.match(/WIDE|ワイド/i)){mode="WIDE";continue;}
    if(line.match(/SANPUKU|三連複/i)){mode="SANPUKU";continue;}

    const p=line.split(/\s+/);

    if(mode==="TANFUKU" && p.length>=3){
      const win=parseFloat(p[1]);
      const place=parseFloat(p[2]);
      if(!isNaN(win)&&!isNaN(place)){
        tanpuku.push({horse:p[0],win,place});
      }
    }

    if(mode==="UMAREN" && p.length>=2){
      const odds=parseFloat(p[1]);
      if(p[0].includes("-")&&!isNaN(odds)){
        umaren.push({pair:p[0],odds});
      }
    }

    if(mode==="WIDE" && p.length>=2){
      const odds=parseFloat(p[1]);
      if(p[0].includes("-")&&!isNaN(odds)){
        wide.push({pair:p[0],odds});
      }
    }

    if(mode==="SANPUKU" && p.length>=2){
      const odds=parseFloat(p[1]);
      if(p[0].includes("-")&&!isNaN(odds)){
        sanpuku.push({trio:p[0],odds});
      }
    }
  }

  return {raceName,tanpuku,umaren,wide,sanpuku};
}
  function classify(topOdds){
  if(topOdds<4)return{cls:"green",title:"本命戦",reason:"馬連1番人気が4倍未満"};
  if(topOdds<9)return{cls:"yellow",title:"中荒れ戦",reason:"馬連1番人気が4倍以上9倍未満"};
  if(topOdds<15)return{cls:"red",title:"荒れ戦",reason:"馬連1番人気が9倍以上15倍未満"};
  return{cls:"red",title:"大荒れ戦",reason:"馬連1番人気が15倍以上"};
}

function wallIndexes(list,key){
  const walls=new Set();
  for(let i=0;i<list.length-1;i++){
    const a=list[i][key];
    const b=list[i+1][key];
    if(a>0 && b/a>=1.8)walls.add(i);
  }
  return walls;
}

function medianHorses(list){
  if(!list.length)return[];
  const n=list.length;
  if(n%2===1)return [list[Math.floor(n/2)].horse];
  return [list[n/2-1].horse,list[n/2].horse];
}

function addScore(map,h,pt=1){
  if(!h)return;
  map[h]=(map[h]||0)+pt;
}

function countMapAdd(map,h){
  if(!h)return;
  map[h]=(map[h]||0)+1;
}

function topList(map,min=1){
  return Object.entries(map)
    .filter(([h,p])=>p>=min)
    .sort((a,b)=>b[1]-a[1])
    .map(([h,p])=>`${h}(${p})`);
}

function beforeWallHorses(list,walls){
  const s=new Set();
  walls.forEach(i=>{
    if(list[i])s.add(list[i].horse);
    if(list[i-1])s.add(list[i-1].horse);
  });
  return [...s];
}

function placeWallBefore(placeRank,limit){
  const before=placeRank.filter(x=>x.place<limit);
  if(!before.length)return[];
  return before.slice(-2).map(x=>x.horse);
}

function placeWallAfter(placeRank,limit){
  const after=placeRank.filter(x=>x.place>=limit);
  if(!after.length)return[];
  return after.slice(0,2).map(x=>x.horse);
}

function placeWallOverMedian(placeRank,limit){
  const over=placeRank.filter(x=>x.place>=limit);
  return medianHorses(over);
}

function rankLine(label,list,walls,type,highlight=[]){
  let wallClass="";
  if(type==="uma")wallClass="wallUma";
  if(type==="win")wallClass="wallWin";
  if(type==="place")wallClass="wallPlace";

  let html=`<div class="row"><span class="label">${label}</span>`;
  list.forEach((x,i)=>{
    let cls=walls.has(i)?`cell ${wallClass}`:"cell";
    let style=highlight.includes(x.horse)
      ? `style="color:#fff;background:#00aaff;border:2px solid #60a5fa;border-radius:8px;padding:2px 6px;font-weight:900"`
      : "";
    html+=`<span class="${cls}" ${style}>${x.horse}</span>`;
  });
  html+=`</div>`;
  return html;
}

function otaniLine(winRank,umaren){
  if(!winRank.length||!umaren.length)return [];
  const axis=winRank[0].horse;
  const line=[axis];

  [...umaren].sort((a,b)=>a.odds-b.odds).forEach(x=>{
    const [a,b]=x.pair.split("-");
    if(a===axis && !line.includes(b))line.push(b);
    if(b===axis && !line.includes(a))line.push(a);
  });

  return line;
}

function buildOtaniZone(winRank,umaren){
  const axis=winRank[0].horse;
  const otani=otaniLine(winRank,umaren);

  const oddsList=otani.slice(1).map(h=>{
    const found=umaren.find(x=>{
      const p=x.pair.split("-");
      return p.includes(axis)&&p.includes(h);
    });
    return {horse:h,odds:found?found.odds:9999};
  });

  const otaniList=[{horse:axis,odds:0},...oddsList];
  const rawWalls=wallIndexes(oddsList,"odds");
  const walls=new Set([...rawWalls].map(i=>i+1));
  const wallArr=[...walls].sort((a,b)=>a-b);

  let wallText="馬連壁：なし";
  let wallBefore=[];
  let firstWallGroup=[];
  let firstWallMed=[];

  if(wallArr.length>0){
    const w=wallArr[0];
    firstWallGroup=otaniList.slice(0,w+1);
    firstWallMed=medianHorses(firstWallGroup);
    wallBefore=firstWallGroup.slice(-2).map(x=>x.horse);
    wallText=`馬連壁：${wallArr.length}枚`;
  }

  return {axis,otaniList,walls,wallText,wallBefore,firstWallGroup,firstWallMed,zoneMed:firstWallMed};
}
  function buildSignals(winRank,placeRank,umaren,sanpuku){
  const ot=buildOtaniZone(winRank,umaren);

  const winWalls=wallIndexes(winRank,"win");
  const placeWalls=wallIndexes(placeRank,"place");

  const winBefore=beforeWallHorses(winRank,winWalls);
  const placeBefore=beforeWallHorses(placeRank,placeWalls);

  const fuku10Before=placeWallBefore(placeRank,10);
  const fuku10After=placeWallAfter(placeRank,10);
  const fuku15Before=placeWallBefore(placeRank,15);
  const fuku15After=placeWallAfter(placeRank,15);
  const fuku15OverMed=placeWallOverMedian(placeRank,15);

  const winMed=medianHorses(winRank);
  const placeMed=medianHorses(placeRank);
  const umaMed=ot.zoneMed;

  const tanshoScore={};
  [...winMed,...placeMed,...umaMed].forEach(h=>addScore(tanshoScore,h));
  winBefore.forEach(h=>addScore(tanshoScore,h));
  placeBefore.forEach(h=>addScore(tanshoScore,h));
  ot.wallBefore.forEach(h=>addScore(tanshoScore,h));
  fuku15OverMed.forEach(h=>addScore(tanshoScore,h));

  const gekisoScore={};
  fuku10Before.forEach(h=>addScore(gekisoScore,h,2));
  fuku15Before.forEach(h=>addScore(gekisoScore,h,2));
  fuku15OverMed.forEach(h=>addScore(gekisoScore,h,2));
  ot.wallBefore.forEach(h=>addScore(gekisoScore,h,1));
  winRank.filter(x=>x.win>=10&&x.win<=30).forEach(x=>addScore(gekisoScore,x.horse,1));

  const tanshoList=topList(tanshoScore,2);
  const gekisoList=topList(gekisoScore,2);

  const tanshoSet=new Set(tanshoList.map(x=>x.split("(")[0]));
  const gekisoSet=new Set(gekisoList.map(x=>x.split("(")[0]));
  const shobu=[...tanshoSet].filter(h=>gekisoSet.has(h));

  return {
    ot,winWalls,placeWalls,winBefore,placeBefore,
    fuku10Before,fuku10After,fuku15Before,fuku15After,fuku15OverMed,
    winMed,placeMed,umaMed,
    tanshoScore,gekisoScore,tanshoList,gekisoList,
    tanshoSet,gekisoSet,shobu
  };
}

function countCenterIndex(umaren,sanpuku){
  const umaMap={};
  const sanMap={};

  umaren.forEach(x=>{
    x.pair.split("-").forEach(h=>countMapAdd(umaMap,h));
  });

  sanpuku.forEach(x=>{
    x.trio.split("-").forEach(h=>countMapAdd(sanMap,h));
  });

  const all=[...new Set([...Object.keys(umaMap),...Object.keys(sanMap)])];

  return all.map(h=>({
    horse:h,
    uma:umaMap[h]||0,
    san:sanMap[h]||0,
    total:(umaMap[h]||0)+(sanMap[h]||0)
  })).sort((a,b)=>b.total-a.total);
}

function diagnosis(winRank,placeRank,topUmaren){
  const race=classify(topUmaren.odds);

  const tan10=winRank.filter(x=>x.win<10).length;
  const tan30=winRank.filter(x=>x.win<30).length;
  const fuku6=placeRank.filter(x=>x.place<6).length;
  const fuku10=placeRank.filter(x=>x.place<10).length;
  const fuku15=placeRank.filter(x=>x.place<15).length;

  const warnings=[];
  if(tan10>=6)warnings.push("7・8人気警報");
  if(tan30>=8)warnings.push("単勝30倍未満が多い混戦");
  if(fuku6>=7)warnings.push("複勝6倍未満が多い");
  if(topUmaren.odds>=15)warnings.push("超大荒れ警報");
  else if(topUmaren.odds>=9)warnings.push("荒れ注意");

  return {race,tan10,tan30,fuku6,fuku10,fuku15,warnings};
}

function renderTanpukuLamp(sig,d,winRank,placeRank,topUmaren){
  const score={};
  const memo={};

  function add(h,pt,label){
    if(!h)return;
    score[h]=(score[h]||0)+pt;
    if(!memo[h])memo[h]=[];
    if(!memo[h].includes(label))memo[h].push(label);
  }

  sig.fuku15Before.forEach(h=>add(h,4,"複勝15倍壁前"));
  sig.fuku15After.forEach(h=>add(h,3,"複勝15倍壁直後"));
  sig.fuku15OverMed.forEach(h=>add(h,5,"複勝15倍超メジアン"));
  sig.ot.wallBefore.forEach(h=>add(h,3,"馬連壁前"));
  [...sig.tanshoSet].forEach(h=>add(h,4,"単勝案件"));
  [...sig.gekisoSet].forEach(h=>add(h,4,"超激走"));
  sig.winMed.forEach(h=>add(h,2,"単勝メジアン"));
  sig.placeMed.forEach(h=>add(h,2,"複勝メジアン"));

  if(d.tan10>=6){
    if(winRank[6])add(winRank[6].horse,4,"10倍未満6頭→7人気");
    if(winRank[7])add(winRank[7].horse,4,"10倍未満6頭→8人気");
  }

  if(topUmaren.odds>=15){
    Object.keys(score).forEach(h=>add(h,2,"馬連1人気15倍以上"));
  }

  const list=Object.entries(score)
    .map(([horse,pt])=>({
      horse,
      pt,
      memo:memo[horse]||[],
      win:winRank.find(x=>x.horse===horse)?.win,
      place:placeRank.find(x=>x.horse===horse)?.place
    }))
    .sort((a,b)=>b.pt-a.pt);

  const top=list[0];

  let rank="B";
  let cls="lampB";
  let buy="見送り";
  let comment="条件不足。ここは無理に買わない。";
  let judge="❌ 買わない";

  if(top){
    if(top.pt>=18){
      rank="SSS";
      cls="lampSSS";
      buy="単勝20％・複勝80％";
      comment="超大穴単複勝負。連系より単複で拾う形。";
      judge="⭕ 勝負";
    }else if(top.pt>=13){
      rank="SS";
      cls="lampSS";
      buy="複勝中心";
      comment="かなり怪しい。複勝だけで狙う価値あり。";
      judge="⭕ 買う";
    }else if(top.pt>=9){
      rank="S";
      cls="lampS";
      buy="複勝少額";
      comment="穴警戒。買うなら少額。";
      judge="△ 少額";
    }
  }

  let rows="";
  list.slice(0,5).forEach((x,i)=>{
    rows+=`
      <div style="margin:10px 0;border-top:1px solid #334155;padding-top:8px">
        <div class="gold">${i+1}位　${x.horse}番【${x.pt}】 単${x.win} / 複${x.place}</div>
        <div class="small">${x.memo.join("・")}</div>
      </div>
    `;
  });

  return {
    html:`<div class="tanpukuLamp">
      <h2>🚨超大穴 単複勝負ランプ</h2>
      <div class="${cls}">判定：${rank}</div>
      <div class="hot">
        ${top ? `最注目：${top.horse}番　単勝${top.win} / 複勝${top.place}` : "該当馬なし"}
      </div>
      <p class="gold">推奨：${buy}</p>
      <p>${comment}</p>
      <div class="buyJudge">${judge}</div>
      <div class="small">基本方針：SSS・SSだけ勝負。Sは少額。Bは見送り。</div>
      ${rows}
    </div>`,
    list
  };
}

function renderDiagnosis(d,topUmaren){
  return `<div class="box">
    <h2>🩺レース診断</h2>
    <div>馬連1番人気：<b>${topUmaren.pair}</b> ${topUmaren.odds}倍</div>
    <div class="${d.race.cls}" style="font-size:28px">${d.race.title}</div>
    <div class="small">${d.race.reason}</div>
    <br>
    <div>単勝10倍未満：<b>${d.tan10}頭</b></div>
    <div>単勝30倍未満：<b>${d.tan30}頭</b></div>
    <div>複勝6倍未満：<b>${d.fuku6}頭</b></div>
    <div>複勝10倍未満：<b>${d.fuku10}頭</b></div>
    <div>複勝15倍未満：<b>${d.fuku15}頭</b></div>
    <br>
    <div class="hot">${d.warnings.length?d.warnings.join("・"):"特別警報なし"}</div>
  </div>`;
}
  function renderCenterIndex(list){
  const a=list[0],b=list[1],c=list[2],d=list[3];

  return `<div class="box">
    <h2>👑本表の王様</h2>
    <div class="small">馬連＋三連複の出現数</div>
    ${a?`<div class="hot" style="font-size:34px;margin:8px 0">🥇${a.horse}【${a.total}】</div>`:""}
    ${b?`<div class="gold" style="font-size:30px;margin:8px 0">🥈${b.horse}【${b.total}】</div>`:""}
    <div style="font-size:25px;font-weight:bold;margin:10px 0">
      ${c?`🥉${c.horse}【${c.total}】`:""}
      &nbsp;&nbsp;
      ${d?`④${d.horse}【${d.total}】`:""}
    </div>
  </div>`;
}

function renderTanshoGekiso(sig){
  return `
  <div class="box">
    <h2>🔥単勝案件</h2>
    <div class="gold">${sig.tanshoList.length?sig.tanshoList.join("　"):"該当なし"}</div>
    <div class="small">単勝・複勝・馬連メジアンや壁前が重なった馬</div>
  </div>

  <div class="box">
    <h2>🚨超激走注意馬</h2>

function renderOtani(sig){

function renderOoana(sig){
  const score={};
  const memo={};

  function add(h,pt,label){
    if(!h)return;
    score[h]=(score[h]||0)+pt;
    if(!memo[h])memo[h]=[];
    if(!memo[h].includes(label))memo[h].push(label);
  }

  sig.shobu.forEach(h=>add(h,6,"勝負ランプ"));
  [...sig.gekisoSet].forEach(h=>add(h,5,"超激走"));
  [...sig.tanshoSet].forEach(h=>add(h,5,"単勝案件"));
  sig.fuku15Before.forEach(h=>add(h,4,"複勝15倍壁前"));
  sig.fuku15OverMed.forEach(h=>add(h,4,"複勝15倍超メジアン"));
  sig.fuku10Before.forEach(h=>add(h,3,"複勝10倍壁前"));
  sig.ot.wallBefore.forEach(h=>add(h,3,"馬連壁前"));
  sig.winMed.forEach(h=>add(h,2,"単勝メジアン"));
  sig.placeMed.forEach(h=>add(h,2,"複勝メジアン"));

  const list=Object.entries(score)
    .map(([horse,pt])=>({horse,pt,memo:memo[horse]||[]}))
    .sort((a,b)=>b.pt-a.pt)
    .slice(0,5);

  let html=`<div class="box ooana"><h2>💣大穴一発逆転</h2>`;

  if(!list.length) html+=`<div class="ooMemo">材料不足</div>`;

  list.forEach((x,i)=>{
    let mark="⭐";
    let judge="三連複穴";

    if(x.pt>=15){
      mark="💥";
      judge="単勝勝負";
    }else if(x.pt>=10){
      mark="🔥";
      judge="馬連・ワイド";
    }

    html+=`
      <div class="ooHit">${mark} ${i+1}位　${x.horse}【${x.pt}】 ${judge}</div>
      <div class="ooMemo">${x.memo.join("・")}</div>`;
  });

  html+=`</div>`;
  return html;
}

function renderExtremeMove(otaniList,winRank,placeRank){
  const umaRank={},winMap={},placeMap={};

  otaniList.forEach((x,i)=>umaRank[x.horse]=i+1);
  winRank.forEach((x,i)=>winMap[x.horse]=i+1);
  placeRank.forEach((x,i)=>placeMap[x.horse]=i+1);

  const alerts=[];

  Object.keys(umaRank).forEach(h=>{
    if(winMap[h]){
      const diff=winMap[h]-umaRank[h];
      if(diff>=3)alerts.push(`${h}　単→馬 +${diff}`);
    }

    if(placeMap[h]){
      const diff=placeMap[h]-umaRank[h];
      if(diff>=3)alerts.push(`${h}　複→馬 +${diff}`);
    }
  });

  Object.keys(placeMap).forEach(h=>{
    if(winMap[h]){
      const diff=winMap[h]-placeMap[h];
      if(diff>=3)alerts.push(`${h}　単→複 +${diff}`);
    }
  });

  return `<div class="box studyBox">
    <h2>🔬極端移動</h2>
    <div class="gold">${alerts.length?alerts.join("　"):"該当なし"}</div>
  </div>`;
}

function renderStrangeMove(sig,winRank,umaren,sanpuku){
  const winRankMap={};
  winRank.forEach((x,i)=>winRankMap[x.horse]=i+1);

  const umaRankMap={};
  [...umaren].sort((a,b)=>a.odds-b.odds).forEach((x,i)=>{
    x.pair.split("-").forEach(h=>{
      if(!umaRankMap[h])umaRankMap[h]=i+1;
    });
  });

  const sanRankMap={};
  [...sanpuku].sort((a,b)=>a.odds-b.odds).forEach((x,i)=>{
    x.trio.split("-").forEach(h=>{
      if(!sanRankMap[h])sanRankMap[h]=i+1;
    });
  });

  const alerts=[];

  winRank.forEach(x=>{
    const h=x.horse;
    const wr=winRankMap[h]||99;
    const ur=umaRankMap[h]||99;
    const sr=sanRankMap[h]||99;

    let pt=0;
    let memo=[];

    if(wr>=10 && ur<=12){pt+=5;memo.push("単勝弱いのに馬連上位");}
    if(wr>=10 && sr<=15){pt+=4;memo.push("単勝弱いのに三連複上位");}
    if((sig.fuku15After||[]).includes(h) && ur<=30){pt+=5;memo.push("複勝15壁直後×馬連");}
    if((sig.fuku15After||[]).includes(h) && sr<=30){pt+=5;memo.push("複勝15壁直後×三連複");}
    if((wr===7 || wr===8) && (ur<=20 || sr<=20)){pt+=3;memo.push("7・8人気警報");}

    if(pt>=5) alerts.push({horse:h,pt,memo});
  });

  alerts.sort((a,b)=>b.pt-a.pt);

  if(!alerts.length){
    return `<div class="box studyBox">
      <h2>🔬異様な動き</h2>
      <div class="small">該当なし</div>
    </div>`;
  }

  return `<div class="box studyBox">
    <h2>🔬異様な動き</h2>
    ${alerts.slice(0,5).map(x=>`
      <div style="margin:10px 0;border-top:1px solid #334155;padding-top:8px">
        <div class="hot">${x.horse}【${x.pt}】</div>
        <div class="small">${x.memo.join("・")}</div>
      </div>
    `).join("")}
  </div>`;
}

const otherAna=ana.filter(h=>!medAna.includes(h));

      <div class="fakeBuy">

function renderV101Check(sig,d,centerIndex){
  const topKings=(centerIndex||[]).slice(0,4).map(x=>x.horse);
  let notes=[];

  if(d.race.title==="中荒れ戦" && d.fuku6>=7){
    notes.push("中荒れ戦＋複勝6倍未満多め：超大穴より本表王・複勝6倍壁前も確認");
  }

  if(topKings.length) notes.push("本表王上位："+topKings.join("・"));
  if(sig.winMed.length) notes.push("単勝メジアン："+sig.winMed.join("・"));
  if(sig.placeMed.length) notes.push("複勝メジアン："+sig.placeMed.join("・"));
  if(sig.fuku10Before.length) notes.push("複勝10倍壁前："+sig.fuku10Before.join("・"));
  if(sig.fuku15Before.length) notes.push("複勝15倍壁前："+sig.fuku15Before.join("・"));

  return `<div class="box studyBox">
    <h2>🧭V10.1補助診断</h2>
    <div class="small">※既存の点数・ランプは変更せず、見落とし防止だけ追加</div>
    ${notes.map(x=>`<div style="margin:8px 0">・${x}</div>`).join("")}
  </div>`;
}

function safeRender(fn){
  try{
    return fn();
  }catch(e){
    return `<div class="box red">エラー：${e.message}</div>`;
  }
}

function analyze(){
  const {raceName,tanpuku,umaren,wide,sanpuku}=parseInput(document.getElementById("input").value);
  const result=document.getElementById("result");

  if(tanpuku.length===0||umaren.length===0){
    result.innerHTML=`<div class="box red">単勝複勝と馬連を入れてください</div>`;
    return;
  }

  const winRank=[...tanpuku].sort((a,b)=>a.win-b.win);
  const placeRank=[...tanpuku].sort((a,b)=>a.place-b.place);
  const topUmaren=[...umaren].sort((a,b)=>a.odds-b.odds)[0];

  const sig=buildSignals(winRank,placeRank,umaren,sanpuku);
  const centerIndex=countCenterIndex(umaren,sanpuku);
  const d=diagnosis(winRank,placeRank,topUmaren);
  const lamp=renderTanpukuLamp(sig,d,winRank,placeRank,topUmaren);

  result.innerHTML=`
    <div class="box"><div class="raceTitle">【${raceName}】</div></div>

    ${safeRender(()=>renderDiagnosis(d,topUmaren))}
    ${lamp.html}

    <div class="box">
      <h2>🎯実戦ゾーン</h2>
      <div class="small">まずここだけ見ればOK</div>
    </div>

    ${safeRender(()=>renderCenterIndex(centerIndex))}
    ${safeRender(()=>renderTanshoGekiso(sig))}
    ${safeRender(()=>renderOtani(sig))}
    ${safeRender(()=>renderOoana(sig))}

    <div class="box studyBox">
      <h2>🔬研究ゾーン</h2>
      <div class="small">出た時だけ「もしかしたら」で見る</div>
    </div>

    ${safeRender(()=>renderV101Check(sig,d,centerIndex))}
    ${safeRender(()=>renderExtremeMove(sig.ot.otaniList,winRank,placeRank))}
    ${safeRender(()=>renderStrangeMove(sig,winRank,umaren,sanpuku))}
    ${safeRender(()=>renderBabaTenka(d,sig,centerIndex))}
    ${safeRender(()=>renderBook(sig))}
    ${safeRender(()=>renderTable(sig,winRank,placeRank))}
  `;
}

function resetInput(){
  document.getElementById("input").value="";
  document.getElementById("result").innerHTML="";
}

function copyResult(){
  const text=document.getElementById("result").innerText;
  if(!text){
    alert("コピーする結果がありません");
    return;
  }
  navigator.clipboard.writeText(text)
    .then(()=>alert("結果をコピーしました"))
    .catch(()=>alert("コピーできませんでした"));
}

function goBottom(){
  const el=document.getElementById("bottomHere") || document.getElementById("bottomAnchor");
  if(el){
    el.scrollIntoView({behavior:"smooth",block:"end"});
  }else{
    window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
  }
}
