<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>チャッピー神予想 V1.2 本表復活版</title>
<style>

  background:#07101f;

  width:100%;
  height:330px;
  box-sizing:border-box;
  border-radius:16px;
  border:2px solid #3b82f6;

  color:#111;
}
button{

}

  background:#10224a;

}

  color:#ffd84d;

}
.sub{
  color:#93c5fd;

  font-weight:900;
  margin-top:10px;
}
.good{color:#86efac;font-weight:900}
.warn{color:#fb7185;font-weight:900}

pre{
  white-space:pre-wrap;
  word-break:break-word;

  display:inline-block;

  overflow-x:auto;
  background:#07101f;

}

  color:#ffd84d;

}

  border:0;

}
</style>
</head>
<body>

<h1>チャッピー神予想 V1.2<br>メジアン×大谷式・本表復活版</h1>

<textarea id="input" placeholder="【レース名】

[TANFUKU]

[UMAREN]

[WIDE]

[SANPUKU]"></textarea>

<br>
<button class="go" id="btnRun">解析</button>
<button class="test" id="btnSample">テスト</button>
<button class="clear" id="btnClear">リセット</button>
<button class="copy" id="btnCopy">結果コピー</button>

<div id="out"></div>

<script>
var latestCopyText = "";

function zenToHan(str){
  return String(str)
    .replace(/[０-９]/g,function(s){return String.fromCharCode(s.charCodeAt(0)-65248);})
    .replace(/．/g,'.')
    .replace(/[－ー―−]/g,'-')
    .replace(/[　]/g,' ')
    .replace(/[〜～]/g,'-');
}

function nums(line){
  var m = zenToHan(line).match(/\d+(?:\.\d+)?/g);
  if(!m) return [];
  return m.map(function(x){return Number(x);});
}

function parseData(raw){
  var text = zenToHan(raw);
  var lines = text.split(/\n/);
  var title = "レース";
  var sec = "";
  var tanfuku = [];
  var umaren = [];
  var wide = [];
  var sanpuku = [];

  for(var i=0;i<lines.length;i++){
    var line = lines[i].trim();
    if(!line) continue;

    if(line.indexOf("【")===0) title = line;

    var up = line.toUpperCase();
    if(up.indexOf("[TANFUKU]")===0){sec="TANFUKU";continue;}
    if(up.indexOf("[UMAREN]")===0){sec="UMAREN";continue;}
    if(up.indexOf("[WIDE]")===0){sec="WIDE";continue;}
    if(up.indexOf("[SANPUKU]")===0){sec="SANPUKU";continue;}

    if(sec==="TANFUKU"){
      var n = nums(line);
      if(n.length>=3){
        tanfuku.push({h:String(Math.floor(n[0])),tan:n[1],fuku:n[n.length-1]});
      }
    }

    if(sec==="UMAREN"){
      var m = line.match(/(\d+)\s*-\s*(\d+)/);
      var o = nums(line);
      if(m && o.length){
        umaren.push({a:m[1],b:m[2],od:o[o.length-1],key:pairKey(m[1],m[2])});
      }
    }

    if(sec==="WIDE"){
      var mw = line.match(/(\d+)\s*-\s*(\d+)/);
      var ow = nums(line);
      if(mw && ow.length){
        wide.push({a:mw[1],b:mw[2],od:ow[ow.length-1],key:pairKey(mw[1],mw[2])});
      }
    }

    if(sec==="SANPUKU"){
      var ms = line.match(/(\d+)\s*-\s*(\d+)\s*-\s*(\d+)/);
      var os = nums(line);
      if(ms && os.length){
        sanpuku.push({a:ms[1],b:ms[2],c:ms[3],od:os[os.length-1],key:triKey(ms[1],ms[2],ms[3])});
      }
    }
  }

  return {title:title,tanfuku:tanfuku,umaren:umaren,wide:wide,sanpuku:sanpuku};
}

function pairKey(a,b){
  return [a,b].map(Number).sort(function(x,y){return x-y;}).join("-");
}
function triKey(a,b,c){
  return [a,b,c].map(Number).sort(function(x,y){return x-y;}).join("-");
}
function sortOdds(arr){return arr.slice().sort(function(a,b){return a.od-b.od;});}
function sortBy(arr,key){return arr.slice().sort(function(a,b){return a[key]-b[key];});}
function uniq(arr){
  var s={},out=[];
  for(var i=0;i<arr.length;i++){
    if(arr[i]!==undefined && arr[i]!==null && !s[arr[i]]){
      s[arr[i]]=true;out.push(arr[i]);
    }
  }
  return out;
}
function mid(arr){
  if(!arr.length) return [];
  if(arr.length===1) return [arr[0]];
  var n=arr.length;
  if(n%2===1) return [arr[Math.floor(n/2)]];
  return [arr[n/2-1],arr[n/2]];
}
function joinH(arr){
  if(!arr || !arr.length) return "なし";
  return arr.map(function(x){return x+"番";}).join("・");
}
function rankMap(row){
  var m={};
  for(var i=0;i<row.length;i++) m[row[i]]=i+1;
  return m;
}

function fukuFront(tanfuku,limit){
  var arr = sortBy(tanfuku,"fuku").filter(function(x){return x.fuku<=limit;});
  return arr.slice(Math.max(0,arr.length-2)).map(function(x){return x.h;});
}
function fukuAfter(tanfuku,limit){
  var arr = sortBy(tanfuku,"fuku").filter(function(x){return x.fuku>limit;});
  return arr.slice(0,2).map(function(x){return x.h;});
}

function detectWalls(items){
  var arr = sortOdds(items).slice(0,12);
  var walls=[];
  for(var i=0;i<arr.length-1;i++){
    var now=arr[i].od;
    var next=arr[i+1].od;
    var ratio=next/now;
    var diff=next-now;
    if(ratio>=1.55 || diff>=8){
      walls.push({before:i+1,after:i+2,ratio:ratio,diff:diff});
    }
  }
  return walls;
}

function zonePairs(pairs,walls){
  var top = sortOdds(pairs).slice(0,12);
  if(!top.length) return [];
  if(walls.length>=2){
    return top.slice(walls[0].after-1,walls[1].before);
  }
  if(walls.length===1){
    return top.slice(0,walls[0].before);
  }
  return top.slice(0,5);
}

function pairHorses(pairs){
  var a=[];
  for(var i=0;i<pairs.length;i++){
    a.push(pairs[i].a);a.push(pairs[i].b);
  }
  return uniq(a);
}

function countPair(pairs,topN){
  var map={};
  var arr=sortOdds(pairs).slice(0,topN);
  for(var i=0;i<arr.length;i++){
    [arr[i].a,arr[i].b].forEach(function(h){
      if(!map[h]) map[h]={h:h,count:0};
      map[h].count++;
    });
  }
  var out=[];
  for(var k in map) out.push(map[k]);
  return out.sort(function(a,b){return b.count-a.count;});
}

function countTri(tris,topN){
  var map={};
  var arr=sortOdds(tris).slice(0,topN);
  for(var i=0;i<arr.length;i++){
    [arr[i].a,arr[i].b,arr[i].c].forEach(function(h){
      if(!map[h]) map[h]={h:h,count:0};
      map[h].count++;
    });
  }
  var out=[];
  for(var k in map) out.push(map[k]);
  return out.sort(function(a,b){return b.count-a.count;});
}

function makeOtaniRow(tanRank,umaRank,allHorses){
  var axis = tanRank[0] ? tanRank[0].h : null;
  var row=[];
  var items=[];
  if(axis){
    row.push(axis);
    items = umaRank.filter(function(p){return p.a===axis || p.b===axis;});
    for(var i=0;i<items.length;i++){
      var other = items[i].a===axis ? items[i].b : items[i].a;
      if(row.indexOf(other)<0) row.push(other);
    }
  }
  for(var j=0;j<umaRank.length;j++){
    if(row.indexOf(umaRank[j].a)<0) row.push(umaRank[j].a);
    if(row.indexOf(umaRank[j].b)<0) row.push(umaRank[j].b);
  }
  for(var k=0;k<allHorses.length;k++){
    if(row.indexOf(allHorses[k])<0) row.push(allHorses[k]);
  }
  return {axis:axis,row:row,items:items};
}

function wallPositionsForOtani(items){
  var walls = detectWalls(items);
  return walls.map(function(w){return w.before+1;});
}

function wallPositionsByOdds(rank,key){
  var walls=[];
  for(var i=0;i<rank.length-1;i++){
    var now=rank[i][key];
    var next=rank[i+1][key];
    if(!now || !next) continue;
    var ratio=next/now;
    var diff=next-now;
    if(ratio>=1.8 || diff>=10){
      walls.push(i+1);
    }
  }
  return walls;
}

function fukuWallPositions(fukuRank){
  var pos=[];
  var p6=0,p15=0;
  for(var i=0;i<fukuRank.length;i++){
    if(fukuRank[i].fuku<=6) p6=i+1;
    if(fukuRank[i].fuku<=15) p15=i+1;
  }
  if(p6>0) pos.push(p6);
  if(p15>0 && p15!==p6) pos.push(p15);
  return pos;
}

function renderHonRow(label,row,walls,medians,barClass){
  var html='<div class="honRow"><div class="honLabel">'+label+'</div>';
  for(var i=0;i<row.length;i++){
    var h=row[i];
    var cls = medians.indexOf(h)>=0 ? 'honNum honMed' : 'honNum';
    html += '<span class="'+cls+'">'+h+'</span>';
    var pos=i+1;
    var bcls = walls.indexOf(pos)>=0 ? barClass : 'barNone';
    if(i<row.length-1) html += '<span class="bar '+bcls+'"></span>';
  }
  html+='</div>';
  return html;
}

function makeHonpyoCard(otaniRow,tanRow,fukuRow,umaWalls,tanWalls,fukuWalls,zoneM,tanM,fukuM,moves){
  var html='';
  html+='<div class="card">';
  html+='<div class="title">本表</div>';
  html+='<div class="small">大谷式馬連＝単勝1番人気を先頭にして馬連オッズ順<br>馬連の壁＝赤線　単勝の壁＝青線　複勝の壁＝黄色線<br>メジアン候補＝赤文字</div>';
  html+='<div class="honWrap">';
  html+=renderHonRow("馬連",otaniRow,umaWalls,zoneM,"barUma");
  html+=renderHonRow("単勝",tanRow,tanWalls,tanM,"barTan");
  html+=renderHonRow("複勝",fukuRow,fukuWalls,fukuM,"barFuku");
  html+='</div>';

  if(moves.length){
    html+='<div class="move">🚨 極端移動<br>'+moves.join('　')+'</div>';
  }else{
    html+='<div class="small">極端移動：該当なし</div>';
  }
  html+='</div>';
  return html;
}

function detectMoves(otaniRow,tanRow,fukuRow){
  var u=rankMap(otaniRow),t=rankMap(tanRow),f=rankMap(fukuRow);
  var horses=uniq(otaniRow.concat(tanRow).concat(fukuRow));
  var out=[];
  for(var i=0;i<horses.length;i++){
    var h=horses[i];
    if(u[h] && t[h] && t[h]-u[h]>=3) out.push(h+' 単→馬 +'+(t[h]-u[h]));
    if(u[h] && f[h] && f[h]-u[h]>=3) out.push(h+' 複→馬 +'+(f[h]-u[h]));
  }
  return out.slice(0,6);
}

function safeRun(){
  try{run();}
  catch(e){
    document.getElementById("out").innerHTML =
      '<div class="card"><div class="title warn">エラー</div><pre>'+String(e && e.message ? e.message : e)+'</pre></div>';
  }
}

function run(){
  var data=parseData(document.getElementById("input").value);
  var out=document.getElementById("out");

  if(data.tanfuku.length===0 || data.umaren.length===0){
    out.innerHTML='<div class="card"><div class="title warn">入力不足</div>[TANFUKU] と [UMAREN] が必要です。</div>';
    return;
  }

  var tanRank=sortBy(data.tanfuku,"tan");
  var fukuRank=sortBy(data.tanfuku,"fuku");
  var umaRank=sortOdds(data.umaren);
  var sanRank=sortOdds(data.sanpuku);

  var allHorses=uniq(data.tanfuku.map(function(x){return x.h;}));
  var topUma=umaRank[0] ? umaRank[0].od : 999;
  var raceType="大荒れ戦";
  if(topUma<4) raceType="本命戦";
  else if(topUma<9) raceType="中荒れ戦";
  else if(topUma<15) raceType="荒れ戦";

  var mainWalls=detectWalls(data.umaren);
  var zone=zonePairs(data.umaren,mainWalls);
  var zoneH=pairHorses(zone);
  var zoneM=mid(zoneH);

  var tanM=mid(tanRank.map(function(x){return x.h;}));
  var fukuM=mid(fukuRank.map(function(x){return x.h;}));

  var fuku3=fukuRank.filter(function(x){return x.fuku<3;}).map(function(x){return x.h;});
  var fuku6=fukuFront(data.tanfuku,6);
  var fuku10=fukuFront(data.tanfuku,10);
  var fuku15=fukuFront(data.tanfuku,15);
  var fuku15a=fukuAfter(data.tanfuku,15);

  var umaTop=countPair(data.umaren,10).slice(0,4).map(function(x){return x.h;});
  var sanTop=countTri(data.sanpuku,10).slice(0,4).map(function(x){return x.h;});

  var release15=false;
  if(topUma>=9) release15=true;
  for(var r=0;r<fuku15.length;r++){
    var hh=fuku15[r];
    var c=0;
    if(zoneH.indexOf(hh)>=0)c++;
    if(zoneM.indexOf(hh)>=0)c++;
    if(fuku6.indexOf(hh)>=0)c++;
    if(fuku10.indexOf(hh)>=0)c++;
    if(tanM.indexOf(hh)>=0)c++;
    if(fukuM.indexOf(hh)>=0)c++;
    if(c>=2) release15=true;
  }

  var scored=[];
  for(var i=0;i<allHorses.length;i++){
    var h=allHorses[i];
    var tf=data.tanfuku.filter(function(x){return x.h===h;})[0];
    var score=0;
    var reasons=[];

    if(zoneH.indexOf(h)>=0){score+=6;reasons.push("馬連壁内");}
    if(zoneM.indexOf(h)>=0){score+=8;reasons.push("馬連ゾーンメジアン");}
    if(tanM.indexOf(h)>=0){score+=4;reasons.push("単勝メジアン");}
    if(fukuM.indexOf(h)>=0){score+=4;reasons.push("複勝メジアン");}
    if(fuku3.indexOf(h)>=0){score+=3;reasons.push("複勝3倍未満");}
    if(fuku6.indexOf(h)>=0){score+=6;reasons.push("複勝6倍壁前");}
    if(fuku10.indexOf(h)>=0){score+=5;reasons.push("複勝10倍壁前");}
    if(fuku15.indexOf(h)>=0){score+=release15?6:2;reasons.push(release15?"複勝15倍解放":"複勝15倍参考");}
    if(fuku15a.indexOf(h)>=0){score+=release15?3:0;reasons.push(release15?"15倍直後解放":"15倍直後参考");}
    if(umaTop.indexOf(h)>=0){score+=5;reasons.push("馬連出現上位");}
    if(sanTop.indexOf(h)>=0){score+=4;reasons.push("三連複出現上位");}

    if(tf && tf.fuku>15 && !release15){score-=4;reasons.push("複勝15倍外で弱め");}
    if(tf && tf.tan>=100){score-=2;reasons.push("単勝100倍超で弱め");}

    scored.push({h:h,score:score,reasons:reasons,tan:tf?tf.tan:"-",fuku:tf?tf.fuku:"-"});
  }

  scored.sort(function(a,b){return b.score-a.score;});

  var axis=scored.filter(function(x){return x.score>=14;}).slice(0,2);
  if(axis.length===0 && scored[0]) axis=[scored[0]];

  var axisH=axis.map(function(x){return x.h;});
  var partner=scored.filter(function(x){
    return x.score>=8 && axisH.indexOf(x.h)<0;
  }).slice(0,3);

  var partnerH=partner.map(function(x){return x.h;});
  var decision="見送り";
  if(axis.length && partner.length) decision="買う";
  else if(scored[0] && scored[0].score>=10) decision="少額";

  var otani=makeOtaniRow(tanRank,umaRank,allHorses);
  var otaniRow=otani.row;
  var tanRow=tanRank.map(function(x){return x.h;});
  var fukuRow=fukuRank.map(function(x){return x.h;});

  var umaWallPos=wallPositionsForOtani(otani.items);
  var tanWallPos=wallPositionsByOdds(tanRank,"tan");
  var fukuWallPos=fukuWallPositions(fukuRank);
  var moves=detectMoves(otaniRow,tanRow,fukuRow);

  var html="";
  html+='<div class="card"><div class="title">'+data.title+'</div>';
  html+='🩺 レース診断：<span class="yellow">'+raceType+'</span><br>';
  html+='馬連1番人気：<span class="yellow">'+umaRank[0].key+' '+umaRank[0].od+'倍</span><br>';
  html+='結論：<span class="'+(decision==="買う"?'good':decision==="少額"?'yellow':'warn')+'">'+decision+'</span>';
  html+='</div>';

  html+='<div class="card"><div class="title">🧱馬連オッズの壁</div>';
  html+='壁：'+(mainWalls.length ? mainWalls.map(function(w){return w.before+'位→'+w.after+'位';}).join(' / ') : '明確な壁なし')+'<br>';
  html+='見るゾーン：'+(zone.length ? zone.map(function(p){return p.key+'('+p.od+')';}).join(' / ') : 'なし')+'<br>';
  html+='壁内馬：'+joinH(zoneH)+'<br>';
  html+='壁内メジアン：<span class="red">'+joinH(zoneM)+'</span>';
  html+='</div>';

  html+='<div class="card"><div class="title">🧠メジアン・壁</div>';
  html+='単勝メジアン：<span class="red">'+joinH(tanM)+'</span><br>';
  html+='複勝メジアン：<span class="red">'+joinH(fukuM)+'</span><br>';
  html+='複勝3倍未満：'+joinH(fuku3)+'<br>';
  html+='複勝6倍壁前：<span class="yellow">'+joinH(fuku6)+'</span><br>';
  html+='複勝10倍壁前：<span class="yellow">'+joinH(fuku10)+'</span><br>';
  html+='複勝15倍壁前：<span class="yellow">'+joinH(fuku15)+'</span><br>';
  html+='複勝15倍解放：'+(release15?'<span class="warn">発動</span>':'非発動');
  html+='</div>';

  html+=makeHonpyoCard(otaniRow,tanRow,fukuRow,umaWallPos,tanWallPos,fukuWallPos,zoneM,tanM,fukuM,moves);

  html+='<div class="card"><div class="title">👑最終候補</div>';
  html+='軸候補：<span class="good">'+joinH(axisH)+'</span><br>';
  html+='相手候補：<span class="yellow">'+joinH(partnerH)+'</span><hr>';

  for(var s=0;s<Math.min(8,scored.length);s++){
    var x=scored[s];
    html+='<div class="rankLine"><span class="badge">'+(s+1)+'位 '+x.h+'番【'+x.score+'】</span> ';
    html+='<span class="small">単'+x.tan+' / 複'+x.fuku+'　'+x.reasons.join('・')+'</span></div>';
  }
  html+='</div>';

  var tickets=makeTickets(axisH,partnerH);

  html+='<div class="card"><div class="title">💰買い目 最大3点</div><pre>';
  if(decision==="見送り"){
    html+='見送り\n理由：重なり不足';
  }else{
    html+='◎ '+joinH(axisH)+'\n';
    html+='○ '+joinH(partnerH)+'\n\n';
    html+='ワイド\n'+tickets.wide.join('\n')+'\n\n';
    html+='馬連\n'+tickets.umaren.join('\n')+'\n\n';
    html+='三連複\n'+tickets.sanpuku.join('\n');
  }
  html+='</pre></div>';

  out.innerHTML=html;

  latestCopyText=makeCopyText(data.title,raceType,decision,axisH,partnerH,tickets,scored);
}

function makeTickets(axisH,partnerH){
  var wide=[],umaren=[],sanpuku=[];
  function add(arr,v){if(v && arr.indexOf(v)<0) arr.push(v);}

  if(axisH.length>=2){
    add(wide,pairKey(axisH[0],axisH[1]));
    if(partnerH[0]){
      add(wide,pairKey(axisH[0],partnerH[0]));
      add(wide,pairKey(axisH[1],partnerH[0]));
    }
    add(umaren,pairKey(axisH[0],axisH[1]));
    if(partnerH[0]) add(umaren,pairKey(axisH[0],partnerH[0]));
    if(partnerH[0]) add(sanpuku,triKey(axisH[0],axisH[1],partnerH[0]));
    if(partnerH[1]) add(sanpuku,triKey(axisH[0],axisH[1],partnerH[1]));
  }else if(axisH.length===1){
    for(var i=0;i<partnerH.length;i++){
      add(wide,pairKey(axisH[0],partnerH[i]));
      if(i<2) add(umaren,pairKey(axisH[0],partnerH[i]));
    }
    if(partnerH.length>=2) add(sanpuku,triKey(axisH[0],partnerH[0],partnerH[1]));
    if(partnerH.length>=3) add(sanpuku,triKey(axisH[0],partnerH[0],partnerH[2]));
  }

  return {
    wide:wide.slice(0,3),
    umaren:umaren.slice(0,3),
    sanpuku:sanpuku.slice(0,3)
  };
}

function makeCopyText(title,raceType,decision,axisH,partnerH,tickets,scored){
  var t="";
  t+=title+"\n";
  t+="診断："+raceType+" / "+decision+"\n";
  t+="◎ "+joinH(axisH)+"\n";
  t+="○ "+joinH(partnerH)+"\n\n";
  t+="ワイド\n"+tickets.wide.join("\n")+"\n\n";
  t+="馬連\n"+tickets.umaren.join("\n")+"\n\n";
  t+="三連複\n"+tickets.sanpuku.join("\n")+"\n\n";
  t+="最終候補\n";
  for(var i=0;i<Math.min(5,scored.length);i++){
    t+=(i+1)+"位 "+scored[i].h+"番【"+scored[i].score+"】 単"+scored[i].tan+" / 複"+scored[i].fuku+"\n";
  }
  return t;
}

function copyResult(){
  if(!latestCopyText){
    alert("先に解析してください");
    return;
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(latestCopyText).then(function(){
      alert("結果をコピーしました");
    }).catch(function(){
      fallbackCopy(latestCopyText);
    });
  }else{
    fallbackCopy(latestCopyText);
  }
}
function fallbackCopy(text){
  var ta=document.createElement("textarea");
  ta.value=text;
  document.body.appendChild(ta);
  ta.select();
  document.execCommand("copy");
  document.body.removeChild(ta);
  alert("結果をコピーしました");
}
