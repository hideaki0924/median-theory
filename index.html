<script>
function toNum(v){return parseFloat(String(v).replace(/[０-９]/g,s=>String.fromCharCode(s.charCodeAt(0)-65248)).replace(/[．]/g,'.').replace(/[^\d.]/g,''))}
function splitHorses(s){return String(s).replace(/－/g,'-').split('-').map(x=>x.trim()).filter(Boolean)}

function parseData(){
 const text=document.getElementById('odds').value.replace(/－/g,'-');
 const lines=text.split(/\n/).map(x=>x.trim()).filter(Boolean);
 let sec=''; const tan=[],fuku=[],umaren=[],san=[];
 for(const line of lines){
  const u=line.toUpperCase();
  if(line.includes('単勝')||u.includes('[TAN]')){sec='tan';continue}
  if(line.includes('複勝')||u.includes('[FUKU]')){sec='fuku';continue}
  if(u.includes('[TANFUKU]')){sec='tanfuku';continue}
  if(line.includes('馬連')||line.includes('馬複')||u.includes('[UMAREN]')){sec='umaren';continue}
  if(line.includes('三連複')||u.includes('[SANPUKU]')){sec='san';continue}

  const p=line.split(/\s+/);
  if(sec==='tanfuku' && p.length>=3){
   tan.push({horse:p[0],odds:toNum(p[1])});
   fuku.push({horse:p[0],odds:toNum(p[2])});
   continue;
  }

  if(p.length<2)continue;
  const odds=toNum(p[1]); if(!odds)continue;
  if(sec==='tan')tan.push({horse:p[0],odds});
  if(sec==='fuku')fuku.push({horse:p[0],odds});
  if(sec==='umaren')umaren.push({pair:p[0],odds,hs:splitHorses(p[0])});
  if(sec==='san')san.push({pair:p[0],odds,hs:splitHorses(p[0])});
 }
 tan.sort((a,b)=>a.odds-b.odds);
 fuku.sort((a,b)=>a.odds-b.odds);
 umaren.sort((a,b)=>a.odds-b.odds);
 san.sort((a,b)=>a.odds-b.odds);
 return {tan,fuku,umaren,san};
}

function medianHorse(arr){if(!arr.length)return '-';const n=arr.length;return n%2?arr[Math.floor(n/2)].horse:arr[n/2-1].horse+'・'+arr[n/2].horse}
function medianPair(arr){return arr.length?arr[Math.floor((arr.length-1)/2)].pair:'-'}
function pairOdds(list,a,b){const x=list.find(p=>p.hs.includes(a)&&p.hs.includes(b));return x?x.odds:'-'}
function heat(n){if(n>=5)return '🔥激熱'; if(n>=4)return '⭕熱'; if(n>=3)return '△注意'; return ''}
function stars(n){if(n>=85)return '★★★★★'; if(n>=70)return '★★★★'; if(n>=55)return '★★★'; if(n>=40)return '★★'; return '★'}

function wallList(arr,t){
 const r=[];
 for(let i=0;i<arr.length-1;i++){
  const d=arr[i+1].odds-arr[i].odds;
  if(d>=t)r.push(`${arr[i].horse||arr[i].pair}(${arr[i].odds}) → ${arr[i+1].horse||arr[i+1].pair}(${arr[i+1].odds}) 差${d.toFixed(1)}`);
 }
 return r;
}

function countAppear(list){
 const c={};
 list.forEach((x,i)=>{
  x.hs.forEach(h=>{
   if(!c[h])c[h]={horse:h,count:0,pos:[],pairs:[]};
   c[h].count++;
   c[h].pos.push(i+1);
   c[h].pairs.push(`${x.pair} ${x.odds}`);
  });
 });
 return Object.values(c).sort((a,b)=>b.count-a.count || a.pos[0]-b.pos[0]);
}

function ootaniMark(n){
 if(n>=5)return '↑↑';
 if(n>=3)return '↑';
 if(n==2)return '→';
 return '↓';
}

function ootaniStyle(umaren){
 const a=countAppear(umaren);
 if(!a.length)return 'なし';
 return a.map((x,i)=>{
  return `${i+1}位 ${ootaniMark(x.count)}${x.horse}：${x.count}回　出現順位 ${x.pos.join('・')}位\n   ${x.pairs.join('\n   ')}`;
 }).join('\n\n');
}

function ootaniMainAxis(umaren){
 const a=countAppear(umaren);
 return a.length?a[0].horse:'-';
}

function horsesFromText(s){
 return String(s).split(/[・\s]+/).filter(x=>x && x!=='-');
}

function horizontalTable(axis,tan,fuku,umaren){
 const axisPairs=umaren.filter(x=>x.hs.includes(axis));
 const order=[axis];
 axisPairs.forEach(x=>{const o=x.hs.find(h=>h!==axis); if(o&&!order.includes(o))order.push(o)});
 let html='<div class="scroll"><table>';
 html+='<tr><th></th>'+order.map((h,i)=>`<th>${i+1}位</th>`).join('')+'</tr>';
 html+='<tr><td class="rowhead">馬連ランク</td>'+order.map(h=>`<td>${h}</td>`).join('')+'</tr>';
 html+='<tr><td class="rowhead">馬連オッズ</td>'+order.map(h=>`<td>${h==axis?'―':pairOdds(umaren,axis,h)}</td>`).join('')+'</tr>';
 html+='<tr><td class="rowhead">単勝ランク</td>'+tan.map(x=>`<td>${x.horse}</td>`).join('')+'</tr>';
 html+='<tr><td class="rowhead">単勝オッズ</td>'+tan.map(x=>`<td>${x.odds}</td>`).join('')+'</tr>';
 html+='<tr><td class="rowhead">複勝ランク</td>'+fuku.map(x=>`<td>${x.horse}</td>`).join('')+'</tr>';
 html+='<tr><td class="rowhead">複勝オッズ</td>'+fuku.map(x=>`<td>${x.odds}</td>`).join('')+'</tr>';
 html+='</table></div>';
 return {html,order};
}

function analyze(){
 const race=document.getElementById('race').value||'レース名未入力';
 const {tan,fuku,umaren,san}=parseData();
 if(!tan.length){document.getElementById('out').innerHTML='単勝データがありません。';return}

 const axis=tan[0].horse;
 const tan30=tan.filter(x=>x.odds<30).length;
 const tan10=tan.filter(x=>x.odds<10).length;
 const fuku3=fuku.filter(x=>x.odds<3).length;
 const fuku6=fuku.filter(x=>x.odds<6).length;
 const um1=umaren[0]?umaren[0].odds:0;

 let type='中穴', reason=[];
 if(tan[0].odds<=3&&fuku[0]&&fuku[0].odds<=1.5){type='超1番人気型';reason.push('単勝1人気3倍以下＋複勝1.5倍以下')}
 if(um1>=9&&tan30>=10){type='大穴/準大穴';reason.push('馬連1人気9倍以上＋単勝30倍未満10頭以上')}
 else if(um1>=6){type='中荒れ';reason.push('馬連1人気が6倍以上')}
 if(!reason.length)reason.push('馬連1人気は低め');

 const htab=horizontalTable(axis,tan,fuku,umaren);
 const order=htab.order;
 const honmei=order.slice(1,5), chuana=order.slice(5,9), ooana=order.slice(9);

 const f6i=fuku.findIndex(x=>x.odds>=6);
 const f15i=fuku.findIndex(x=>x.odds>=15);
 const f6pre=f6i>=2?fuku.slice(f6i-2,f6i).map(x=>x.horse):[];
 const f15pre=f15i>=2?fuku.slice(f15i-2,f15i).map(x=>x.horse):[];
 const f15to6=fuku.filter(x=>x.odds>=6&&x.odds<15);
 const f15to6med=medianHorse(f15to6);
 const f6ToFav=[...f6pre,axis].filter((v,i,a)=>v&&a.indexOf(v)===i).join('・');

 const score={};
 function add(h,p){if(h&&h!=='-')score[h]=(score[h]||0)+p}
 [
  medianHorse(tan),
  medianHorse(tan.filter(x=>x.odds<=10)),
  medianHorse(tan.filter(x=>x.odds>=10)),
  medianHorse(tan.filter(x=>x.odds>=10&&x.odds<=20)),
  medianHorse(tan.filter(x=>x.odds<=20)),
  medianHorse(tan.filter(x=>x.odds<=99)),
  medianHorse(tan.filter(x=>x.odds>=100)),
  medianHorse(fuku),
  medianHorse(fuku.filter(x=>x.odds<6)),
  medianHorse(fuku.filter(x=>x.odds<=12)),
  f15to6med
 ].join('・').split('・').forEach(h=>add(h,1));

 honmei.forEach(h=>add(h,1));
 chuana.forEach(h=>add(h,1));
 f6pre.forEach(h=>add(h,1));
 f15pre.forEach(h=>add(h,1));

 const ranking=Object.entries(score).sort((a,b)=>b[1]-a[1]);
 const tansho=ranking.filter(x=>x[1]>=3).map(x=>x[0]);

 const tan20=tan.filter(x=>x.odds<=20);
 let border='-';
 if(tan20.length>=2){
  const n=tan20.length;
  border=n%2===0?tan20[n/2-1].horse+'・'+tan20[n/2].horse:tan20[Math.floor(n/2)].horse;
 }

 let arere=30;
 if(um1>=9)arere+=25;
 if(tan30>=10)arere+=25;
 if(fuku6<=6)arere+=15;
 if(tan10>=6)arere+=10;
 if(arere>100)arere=100;

 const ootaniAxis=ootaniMainAxis(umaren);
 const ootaniTop=countAppear(umaren).filter(x=>x.count>=3).map(x=>x.horse);
 const medianUmarenHorses=horsesFromText(medianPair(umaren).replace(/-/g,'・'));
 const umarenCase=[...new Set([...ootaniTop,...medianUmarenHorses].filter(Boolean))];

 const main=tansho[0]||ootaniAxis||axis;
 const subs=[...new Set([...ootaniTop,...honmei,...chuana,...f6pre,...f15pre].filter(h=>h!==main))].slice(0,7);

 document.getElementById('out').innerHTML=
`${htab.html}<pre>
━━━━━━━━━━━━━━
${race}
━━━━━━━━━━━━━━

【レース判定】
${type}
理由：${reason.join(' / ')}
荒れ度：${arere}点 ${stars(arere)}
馬連1人気：${um1||'-'}倍
単勝30倍未満：${tan30}頭
単勝10倍未満：${tan10}頭
複勝3倍未満：${fuku3}頭
複勝6倍未満：${fuku6}頭

【単勝案件】
${tansho.length?tansho.join('・'):'なし'}

重複ランキング：
${ranking.map((x,i)=>`${i+1}位 ${x[0]}：${x[1]}回 ${heat(x[1])}`).join('\n')||'なし'}

【馬連 大谷式】
大谷式本線軸：${ootaniAxis}

${ootaniStyle(umaren)}

【馬連案件】
${umarenCase.length?umarenCase.join('・'):'なし'}
※大谷式上位出現＋馬連メジアン重複を重視

【馬連ランク移動】
${order.join(' → ')}

本命ゾーン：${honmei.join('・')||'-'}
中穴ゾーン：${chuana.join('・')||'-'}
大穴ゾーン：${ooana.join('・')||'-'}

【メジアン】
単勝全体：${medianHorse(tan)}
単勝10倍以内：${medianHorse(tan.filter(x=>x.odds<=10))}
単勝10倍以上：${medianHorse(tan.filter(x=>x.odds>=10))}
単勝10〜20倍：${medianHorse(tan.filter(x=>x.odds>=10&&x.odds<=20))}
単勝20倍以内：${medianHorse(tan.filter(x=>x.odds<=20))}
単勝99倍以内：${medianHorse(tan.filter(x=>x.odds<=99))}
単勝100倍以上：${medianHorse(tan.filter(x=>x.odds>=100))}

複勝全体：${medianHorse(fuku)}
複勝6倍未満：${medianHorse(fuku.filter(x=>x.odds<6))}
複勝12倍以内：${medianHorse(fuku.filter(x=>x.odds<=12))}

馬連メジアン：${medianPair(umaren)}
三連複メジアン：${medianPair(san)}

【境目ペア警告】
単勝20倍以内中央：${border}
※このペアの1-2着、2-3着に注意

【複勝壁】
複勝6倍壁前2頭：${f6pre.join('・')||'なし'}
複勝15倍壁前2頭：${f15pre.join('・')||'なし'}
15壁→6倍以上メジアン：${f15to6med}
6倍壁前2頭→1人気：${f6ToFav||'なし'}

【壁】
単勝壁：
${wallList(tan,8).join('\n')||'なし'}

馬連壁：
${wallList(umaren,8).join('\n')||'なし'}

【10倍未満6頭警報】
${tan10>=6?'発動：7人気・8人気も注意':'なし'}

【チャッピー推奨】
軸候補：${main}
相手候補：${subs.join('・')||'-'}

馬連 大谷式買い目：
${subs.map(h=>main+'-'+h).join(' / ')||'-'}

ワイド：
${subs.slice(0,4).map(h=>main+'-'+h).join(' / ')||'-'}

馬単：
${subs.slice(0,3).map(h=>main+'→'+h).join(' / ')||'-'}

三連複：
${subs.length>=2?subs.slice(0,5).map((h,i)=>main+'-'+h+'-'+subs[(i+1)%subs.length]).join(' / '):'-'}

三連単：
${subs.length>=2?subs.slice(0,3).map((h,i)=>main+'→'+h+'→'+subs[(i+1)%subs.length]).join(' / '):'-'}
</pre>`;
}

</script>
