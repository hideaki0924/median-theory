<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>チャッピー神予想 V3 指数入り</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#07101f;color:#fff;padding:14px;font-size:18px}
textarea{width:100%;height:280px;font-size:17px;border-radius:10px;padding:10px;background:#fff;color:#000;box-sizing:border-box}
textarea::placeholder{color:#777}
button{font-size:20px;padding:10px 14px;margin:6px 4px 6px 0;border-radius:12px;border:0;background:#22c55e;color:#fff}
.btn2{background:#3b82f6}.btn3{background:#64748b}.btn4{background:#f59e0b}
.box{background:#111827;border-radius:14px;padding:14px;margin:12px 0}
h1{font-size:26px}h2{font-size:22px;border-bottom:1px solid #374151;padding-bottom:6px}
.green{color:#22c55e;font-weight:bold}.yellow{color:#facc15;font-weight:bold}.red{color:#fb7185;font-weight:bold}
.hot{color:#fb7185;font-size:24px;font-weight:bold}.gold{color:#facc15;font-size:24px;font-weight:bold}
.small{font-size:15px;color:#cbd5e1}
pre{white-space:pre-wrap;font-size:16px}
.rankWrap{overflow-x:auto;white-space:nowrap}
.row{margin:12px 0;font-size:24px;font-weight:bold}
.label{display:inline-block;width:70px;color:#cbd5e1;font-size:18px}
.cell{display:inline-block;min-width:34px;text-align:center;padding:4px 6px;border-right:1px solid #64748b}
.wallUma{border-right:3px solid #ff3b30}.wallWin{border-right:3px solid #3b82f6}.wallPlace{border-right:3px solid #facc15}
.raceTitle{font-size:30px;font-weight:bold;color:#facc15}
.indexCard{margin:10px 0;padding:10px;border-bottom:1px solid #374151}
</style>
</head>
<body>

<h1>チャッピー神予想 V3 指数入り</h1>

<div class="box">
<textarea id="input" placeholder="【レース名】

[TANFUKU]

[UMAREN]

[SANPUKU]"></textarea>
<br>
<button onclick="analyze()">解析</button>
<button class="btn2" onclick="testData()">テスト</button>
<button class="btn3" onclick="resetInput()">リセット</button>
<button class="btn4" onclick="copyResult()">結果コピー</button>
</div>

<div id="result"></div>

<script>
function norm(s){
  return s.replace(/[０-９]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0))
          .replace(/[－ー―–—]/g,'-')
          .replace(/[．]/g,'.');
}

function parseInput(text){
  text=norm(text);
  const lines=text.split(/\n/).map(x=>x.trim()).filter(Boolean);
  let mode="";
  let raceName="レース名未入力";
  const tanpuku=[],umaren=[],sanpuku=[];

  for(const line of lines){
    if(line.match(/^【.*】$/)){
      raceName=line.replace(/[【】]/g,"");
      continue;
    }
    if(line.match(/TANFUKU|単勝|複勝/i)){mode="TANFUKU";continue;}
    if(line.match(/UMAREN|馬連|馬複/i)){mode="UMAREN";continue;}
    if(line.match(/SANPUKU|三連複/i)){mode="SANPUKU";continue;}

    const p=line.split(/\s+/);

    if(mode==="TANFUKU" && p.length>=3){
      const win=parseFloat(p[1]);
      const place=parseFloat(p[2]);
      if(!isNaN(win)&&!isNaN(place)) tanpuku.push({horse:p[0],win,place});
    }
    if(mode==="UMAREN" && p.length>=2){
      const odds=parseFloat(p[1]);
      if(p[0].includes("-")&&!isNaN(odds)) umaren.push({pair:p[0],odds});
    }
    if(mode==="SANPUKU" && p.length>=2){
      const odds=parseFloat(p[1]);
      if(p[0].includes("-")&&!isNaN(odds)) sanpuku.push({trio:p[0],odds});
    }
  }
  return {raceName,tanpuku,umaren,sanpuku};
}

function classify(topOdds){
  if(topOdds<4){
    return {cls:"green",title:"本命戦",reason:"馬連1番人気が4倍未満だから",text:"馬連1番人気の2頭のどちらかを穴馬の相手に入れる"};
  }
  if(topOdds<9){
    return {cls:"yellow",title:"中荒れ戦",reason:"馬連1番人気が4倍以上9倍未満だから",text:"中穴馬が馬券に絡む可能性が高い"};
  }
  if(topOdds<15){
    return {cls:"red",title:"荒れ戦",reason:"馬連1番人気が9倍以上15倍未満だから",text:"複勝10倍の壁の直後・壁前メジアンを重視"};
  }
  return {cls:"red",title:"大穴戦",reason:"馬連1番人気が15倍以上だから",text:"馬連壁前・複勝15倍壁前・オッズの谷を重視"};
}

function wallIndexes(list,key){
  const walls=new Set();
  for(let i=0;i<list.length-1;i++){
    const a=list[i][key], b=list[i+1][key];
    if(a>0 && b/a>=1.8) walls.add(i);
  }
  return walls;
}

function medianHorses(list){
  if(list.length===0) return [];
  const n=list.length;
  if(n%2===1) return [list[Math.floor(n/2)].horse];
  return [list[n/2-1].horse,list[n/2].horse];
}

function beforeWallHorses(list,walls){
  const s=new Set();
  walls.forEach(i=>{
    if(list[i]) s.add(list[i].horse);
    if(list[i-1]) s.add(list[i-1].horse);
  });
  return [...s];
}

function placeWallBefore(placeRank,limit){
  const before=placeRank.filter(x=>x.place<limit);
  if(before.length===0) return [];
  return before.slice(-2).map(x=>x.horse);
}

function placeWallAfter(placeRank,limit){
  const after=placeRank.filter(x=>x.place>=limit);
  if(after.length===0) return [];
  return after.slice(0,2).map(x=>x.horse);
}

function addScore(map,h,pt=1){
  if(!h) return;
  map[h]=(map[h]||0)+pt;
}

function topList(map,min=1){
  return Object.entries(map)
    .filter(([h,p])=>p>=min)
    .sort((a,b)=>b[1]-a[1])
    .map(([h,p])=>`${h}(${p})`);
}

function rankLine(label,list,walls,type){
  let wallClass="";
  if(type==="uma") wallClass="wallUma";
  if(type==="win") wallClass="wallWin";
  if(type==="place") wallClass="wallPlace";

  let html=`<div class="row"><span class="label">${label}</span>`;
  list.forEach((x,i)=>{
    const cls=walls.has(i) ? `cell ${wallClass}` : "cell";
    html+=`<span class="${cls}">${x.horse}</span>`;
  });
  html+=`</div>`;
  return html;
}

function favoriteTrustBox(winFav,sanpuku){
  if(winFav.win >= 2){
    return `<div class="box"><h2>🎯単勝1人気信頼度</h2>
      <div class="small">単勝1番人気が1倍台の時だけ発動</div>
      <div>単勝1番人気：${winFav.horse}番（${winFav.win}倍）</div>
      <div class="yellow" style="font-size:24px;margin-top:8px">対象外</div></div>`;
  }

  if(sanpuku.length===0){
    return `<div class="box"><h2>🎯単勝1人気信頼度</h2>
      <div>単勝1番人気：${winFav.horse}番（${winFav.win}倍）</div>
      <div class="red">三連複データなし</div></div>`;
  }

  const sorted=[...sanpuku].sort((a,b)=>a.odds-b.odds);
  let lastRank=0,lastOdds=0;
  for(let i=0;i<sorted.length;i++){
    const horses=sorted[i].trio.split("-");
    if(horses.includes(winFav.horse)){
      lastRank=i+1;
      lastOdds=sorted[i].odds;
    }else break;
  }

  let judge="危険",cls="red";
  if(lastRank>=10){judge="かなり信頼";cls="green";}
  else if(lastRank>=6){judge="普通〜信頼";cls="yellow";}

  const firstTrio=sorted[0] ? sorted[0].trio : "なし";
  const firstOdds=sorted[0] ? sorted[0].odds : "-";

  return `<div class="box"><h2>🎯単勝1人気信頼度</h2>
    <div>単勝1番人気：${winFav.horse}番（${winFav.win}倍）</div><br>
    <div>三連複上位で残った順位：<b>${lastRank}位まで</b></div>
    <div>残ったオッズ：<b>${lastOdds ? lastOdds+"倍まで" : "なし"}</b></div>
    <div>三連複1番人気：<b>${firstTrio}</b>（${firstOdds}倍）</div>
    <div class="${cls}" style="font-size:26px;margin-top:10px">${judge}</div>
  </div>`;
}

function chappyIndexBox(h,tanshoSet,gekisoSet,shobu,fuku10Before,fuku15Before,umaWallBefore,winWallBefore,placeWallBeforeList){
  let score=0;
  let reasons=[];

  function add(cond,pt,label){
    if(cond){
      score+=pt;
      reasons.push(label+" +"+pt);
    }
  }

  const isTansho=tanshoSet.has(h);
  const isGekiso=gekisoSet.has(h);
  const isShobu=shobu.includes(h);

  add(isTansho,20,"単勝案件");
  add(fuku15Before.includes(h),15,"複勝15倍壁前");
  add(fuku10Before.includes(h),10,"複勝10倍壁前");
  add(umaWallBefore.includes(h),10,"馬連壁前");
  add(winWallBefore.includes(h),8,"単勝壁前");
  add(placeWallBeforeList.includes(h),8,"複勝自然壁前");
  add(isGekiso,10,"超激走注意馬");
  add(isShobu,20,"勝負ランプ");

  const cnt=[
    isTansho,
    isGekiso,
    isShobu,
    fuku15Before.includes(h),
    fuku10Before.includes(h),
    umaWallBefore.includes(h),
    winWallBefore.includes(h),
    placeWallBeforeList.includes(h)
  ].filter(Boolean).length;

  if(cnt>=3){
    score+=15;
    reasons.push("3項目以上重複 +15");
  }

  if(isTansho && fuku15Before.includes(h)){
    score+=10;
    reasons.push("単勝案件×複勝15倍壁前 +10");
  }

  if(umaWallBefore.includes(h) && isTansho){
    score+=10;
    reasons.push("馬連壁前×単勝案件 +10");
  }

  if(score>100) score=100;

  let rank="D：様子見",cls="small";
  if(score>=90){rank="S：勝負";cls="hot";}
  else if(score>=75){rank="A：強気";cls="gold";}
  else if(score>=60){rank="B：狙い目";cls="yellow";}
  else if(score>=40){rank="C：注意";cls="green";}

  return {horse:h,score,rank,cls,reasons};
}

function renderChappyIndex(list){
  const sorted=[...list].sort((a,b)=>b.score-a.score);
  return `<div class="box"><h2>🔥チャッピー指数 Ver.1</h2>
    ${sorted.map(x=>`
      <div class="indexCard">
        <div class="${x.cls}" style="font-size:26px">${x.horse}番　${x.score}点　${x.rank}</div>
        <div class="small">${x.reasons.length ? x.reasons.join(" / ") : "加点なし"}</div>
      </div>
    `).join("")}
  </div>`;
}

function analyze(){
  const {raceName,tanpuku,umaren,sanpuku}=parseInput(document.getElementById("input").value);
  const result=document.getElementById("result");

  if(tanpuku.length===0 || umaren.length===0){
    result.innerHTML=`<div class="box red">単勝複勝と馬連を入れてください</div>`;
    return;
  }

  const winRank=[...tanpuku].sort((a,b)=>a.win-b.win);
  const placeRank=[...tanpuku].sort((a,b)=>a.place-b.place);
  const axis=winRank[0].horse;

  const axisUmaren=umaren
    .filter(x=>x.pair.split("-").includes(axis))
    .sort((a,b)=>a.odds-b.odds)
    .map(x=>{
      const [a,b]=x.pair.split("-");
      const other=a===axis?b:a;
      return {horse:other,odds:x.odds,pair:x.pair};
    });

  const topUmaren=[...umaren].sort((a,b)=>a.odds-b.odds)[0];
  const race=classify(topUmaren.odds);
  const umaList=[{horse:axis,odds:0},...axisUmaren];

  const umaWalls=wallIndexes(axisUmaren,"odds");
  const adjustedUmaWalls=new Set([...umaWalls].map(i=>i+1));
  const winWalls=wallIndexes(winRank,"win");
  const placeWalls=wallIndexes(placeRank,"place");

  const fuku10Before=placeWallBefore(placeRank,10);
  const fuku10After=placeWallAfter(placeRank,10);
  const fuku15Before=placeWallBefore(placeRank,15);

  const umaWallBefore=beforeWallHorses(umaList,adjustedUmaWalls);
  const winWallBefore=beforeWallHorses(winRank,winWalls);
  const placeWallBeforeList=beforeWallHorses(placeRank,placeWalls);

  const tanshoScore={};
  [...medianHorses(winRank),...medianHorses(placeRank),...medianHorses(umaList)].forEach(h=>addScore(tanshoScore,h));
  winWallBefore.forEach(h=>addScore(tanshoScore,h));
  placeWallBeforeList.forEach(h=>addScore(tanshoScore,h));
  umaWallBefore.forEach(h=>addScore(tanshoScore,h));

  const gekisoScore={};
  fuku10Before.forEach(h=>addScore(gekisoScore,h,2));
  fuku15Before.forEach(h=>addScore(gekisoScore,h,2));
  umaWallBefore.forEach(h=>addScore(gekisoScore,h,1));
  winRank.filter(x=>x.win>=10 && x.win<=30).forEach(x=>addScore(gekisoScore,x.horse,1));

  const tanshoList=topList(tanshoScore,2);
  const gekisoList=topList(gekisoScore,2);

  const tanshoSet=new Set(tanshoList.map(x=>x.split("(")[0]));
  const gekisoSet=new Set(gekisoList.map(x=>x.split("(")[0]));
  const shobu=[...tanshoSet].filter(h=>gekisoSet.has(h));

  const allHorses=[...new Set(tanpuku.map(x=>x.horse))];
  const chappyList=allHorses.map(h=>chappyIndexBox(
    h,tanshoSet,gekisoSet,shobu,fuku10Before,fuku15Before,umaWallBefore,winWallBefore,placeWallBeforeList
  ));

  result.innerHTML=`
    <div class="box"><div class="raceTitle">【${raceName}】</div></div>

    ${favoriteTrustBox(winRank[0],sanpuku)}

    ${renderChappyIndex(chappyList)}

    <div class="box">
      <h2>🔥勝負ランプ</h2>
      <div class="hot">${shobu.length ? shobu.join("・") : "該当なし"}</div>
      <div class="small">単勝案件と超激走注意馬が重なった馬</div>
    </div>

    <div class="box">
      <h2>🎯単勝案件</h2>
      <div class="gold">${tanshoList.length ? tanshoList.join("　") : "該当なし"}</div>
      <div class="small">重複理論の集合体</div>
    </div>

    <div class="box">
      <h2>🚨超激走注意馬</h2>
      <div class="hot">${gekisoList.length ? gekisoList.join("　") : "該当なし"}</div>
      <div class="small">穴理論の集合体</div>
    </div>

    <div class="box">
      <h2>レース分類</h2>
      <div>馬連1番人気：${topUmaren.pair}　${topUmaren.odds}倍</div>
      <p>${race.reason}</p>
      <div class="${race.cls}" style="font-size:28px">${race.title}</div>
    </div>

    <div class="box">
      <h2>📚本の買い方</h2>
      <p>${race.text}</p>
      <p>複勝10倍壁前2頭：<b class="gold">${fuku10Before.length ? fuku10Before.join("・") : "なし"}</b></p>
      <p>複勝10倍壁直後：<b class="hot">${fuku10After.length ? fuku10After.join("・") : "なし"}</b></p>
      <p>複勝15倍壁前2頭：<b class="gold">${fuku15Before.length ? fuku15Before.join("・") : "なし"}</b></p>
      <p>馬連壁前：<b class="gold">${umaWallBefore.length ? umaWallBefore.join("・") : "なし"}</b></p>
      <p>単勝壁前：<b class="gold">${winWallBefore.length ? winWallBefore.join("・") : "なし"}</b></p>
      <p>単勝案件：<b class="gold">${tanshoList.length ? tanshoList.join("　") : "なし"}</b></p>
      <p>超激走注意馬：<b class="hot">${gekisoList.length ? gekisoList.join("　") : "なし"}</b></p>
    </div>

    <div class="box">
      <h2>本表</h2>
      <div class="small">
        細線＝通常区切り<br>
        馬連の壁＝赤線　単勝の壁＝青線　複勝の壁＝黄色線<br>
        ※壁は乖離率1.8倍以上
      </div>
      <div class="rankWrap">
        ${rankLine("馬連",umaList,adjustedUmaWalls,"uma")}
        ${rankLine("単勝",winRank,winWalls,"win")}
        ${rankLine("複勝",placeRank,placeWalls,"place")}
      </div>
    </div>
  `;
}

function resetInput(){
  document.getElementById("input").value="";
  document.getElementById("result").innerHTML="";
}

function copyResult(){
  const text=document.getElementById("result").innerText;
  if(!text){alert("コピーする結果がありません");return;}
  navigator.clipboard.writeText(text).then(()=>alert("結果をコピーしました"))
  .catch(()=>alert("コピーできませんでした"));
}

</script>

</body>
</html>
