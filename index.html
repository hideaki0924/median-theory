<textarea id="input" placeholder="【園田2R】\n\n[TANFUKU]\n馬番 単勝 複勝上限\n\n[UMAREN]\n馬番-馬番 オッズ\n\n[WIDE]\n馬番-馬番 オッズ\n\n[SANPUKU]\n馬番-馬番-馬番 オッズ\n\n※複勝は上限値で入力。1.2-2.4なら 2.4 を使う。"></textarea><br>

<script>
var latestCopyText='';
function zenToHan(str){return String(str||'').replace(/[０-９]/g,function(s){return String.fromCharCode(s.charCodeAt(0)-65248);}).replace(/．/g,'.').replace(/[－ー―−]/g,'-').replace(/[　]/g,' ').replace(/[〜～]/g,'-');}
function nums(line){var m=zenToHan(line).match(/\d+(?:\.\d+)?/g);return m?m.map(Number):[];}
function pairKey(a,b){return [a,b].map(String).sort(function(x,y){return Number(x)-Number(y);}).join('-');}
function triKey(a,b,c){return [a,b,c].map(String).sort(function(x,y){return Number(x)-Number(y);}).join('-');}
function add(arr,v){v=String(v);if(v&&v!=='undefined'&&arr.indexOf(v)<0)arr.push(v);}
function uniq(arr){var out=[];(arr||[]).forEach(function(v){add(out,v);});return out;}
function sortOdds(arr){return arr.slice().sort(function(a,b){return Number(a.od)-Number(b.od);});}
function mid(arr){arr=arr||[];if(!arr.length)return[];var n=arr.length;if(n%2)return[arr[Math.floor(n/2)]];return[arr[n/2-1],arr[n/2]];}
function joinH(arr){return (!arr||!arr.length)?'なし':arr.map(function(x){return x+'番';}).join('・');}
function safeNum(x,d){x=Number(x);return isFinite(x)?x:(d===0?0:(d||9999));}
function getTF(data,h){h=String(h);for(var i=0;i<data.tanfuku.length;i++){if(data.tanfuku[i].h===h)return data.tanfuku[i];}return null;}
function rankMap(row){var m={};row.forEach(function(h,i){m[h]=i+1;});return m;}
function countAppearTop(list,h,n){h=String(h);var c=0;(list||[]).slice(0,n||20).forEach(function(x){if(x.a===h||x.b===h||x.c===h)c++;});return c;}
function bestRankIn(list,h,n){h=String(h);for(var i=0;i<Math.min(n||20,list.length);i++){var x=list[i];if(x.a===h||x.b===h||x.c===h)return i+1;}return 999;}
function pairRow(pairs){var row=[];sortOdds(pairs).forEach(function(p){add(row,p.a);add(row,p.b);});return row;}
function triRow(tris){var row=[];sortOdds(tris).forEach(function(t){add(row,t.a);add(row,t.b);add(row,t.c);});return row;}
function parseData(raw){var text=zenToHan(raw),lines=text.split(/\n/),title='レース',sec='',tanfuku=[],umaren=[],wide=[],sanpuku=[];for(var i=0;i<lines.length;i++){var line=lines[i].trim();if(!line)continue;if(line.indexOf('【')===0)title=line;var up=line.toUpperCase();if(up.indexOf('[')===0){if(up.indexOf('TAN')>=0||up.indexOf('単')>=0){sec='TANFUKU';continue;}if(up.indexOf('WIDE')>=0||up.indexOf('ワイド')>=0){sec='WIDE';continue;}if(up.indexOf('SAN')>=0||up.indexOf('3')>=0||up.indexOf('三')>=0){sec='SANPUKU';continue;}if(up.indexOf('UMA')>=0||up.indexOf('馬')>=0||up.indexOf('2')>=0){sec='UMAREN';continue;}}if(sec==='TANFUKU'){var n=nums(line);if(n.length>=3)tanfuku.push({h:String(Math.floor(n[0])),tan:n[1],fuku:n[n.length-1]});else if(n.length===2)tanfuku.push({h:String(Math.floor(n[0])),tan:n[1],fuku:null});}else if(sec==='UMAREN'){var m=line.match(/(\d+)\s*-\s*(\d+)/),o=nums(line);if(m&&o.length)umaren.push({a:m[1],b:m[2],od:o[o.length-1],key:pairKey(m[1],m[2])});}else if(sec==='WIDE'){var mw=line.match(/(\d+)\s*-\s*(\d+)/),ow=nums(line);if(mw&&ow.length)wide.push({a:mw[1],b:mw[2],od:ow[ow.length-1],key:pairKey(mw[1],mw[2])});}else if(sec==='SANPUKU'){var ms=line.match(/(\d+)\s*-\s*(\d+)\s*-\s*(\d+)/),os=nums(line);if(ms&&os.length)sanpuku.push({a:ms[1],b:ms[2],c:ms[3],od:os[os.length-1],key:triKey(ms[1],ms[2],ms[3])});}}return{title:title,tanfuku:tanfuku,umaren:umaren,wide:wide,sanpuku:sanpuku};}
function nearWall(sorted,field,wall){var before=[],after=[],idx=-1;for(var i=0;i<sorted.length;i++){var v=safeNum(sorted[i][field]);if(v<=wall)idx=i;}if(idx>=0){if(sorted[idx])before.push(sorted[idx].h);if(sorted[idx-1])before.push(sorted[idx-1].h);}if(sorted[idx+1])after.push(sorted[idx+1].h);if(sorted[idx+2])after.push(sorted[idx+2].h);return{before:uniq(before),after:uniq(after),idx:idx};}
function rangeMed(tanRank,lo,hi){return mid(tanRank.filter(function(x){return x.tan>=lo&&x.tan<hi;}).map(function(x){return x.h;}));}
function makeContext(data){var tanRank=sortOdds(data.tanfuku.map(function(x){return{h:x.h,od:x.tan,tan:x.tan,fuku:x.fuku};}));var fukuRank=data.tanfuku.filter(function(x){return x.fuku!==null;}).map(function(x){return{h:x.h,od:x.fuku,tan:x.tan,fuku:x.fuku};}).sort(function(a,b){return Number(a.fuku)-Number(b.fuku);});var umaRank=sortOdds(data.umaren),wideRank=sortOdds(data.wide),sanRank=sortOdds(data.sanpuku);var tanRow=tanRank.map(function(x){return x.h;}),fukuRow=fukuRank.map(function(x){return x.h;});var umaRow=pairRow(data.umaren),wideRow=pairRow(data.wide),sanRow=triRow(data.sanpuku);var w80=nearWall(tanRank,'tan',80),w6=nearWall(fukuRank,'fuku',6),w15=nearWall(fukuRank,'fuku',15);var umaRank6=[];[4,5,6].forEach(function(i){if(umaRank[i]){add(umaRank6,umaRank[i].a);add(umaRank6,umaRank[i].b);}});var all=[];data.tanfuku.forEach(function(x){add(all,x.h);});[data.umaren,data.wide,data.sanpuku].forEach(function(list){list.forEach(function(x){add(all,x.a);add(all,x.b);if(x.c)add(all,x.c);});});var counts={tanUnder10:tanRank.filter(function(x){return x.tan<10;}).length,tanUnder30:tanRank.filter(function(x){return x.tan<30;}).length,fukuUnder6:fukuRank.filter(function(x){return x.fuku<=6;}).length,fukuUnder10:fukuRank.filter(function(x){return x.fuku<=10;}).length,fukuUnder15:fukuRank.filter(function(x){return x.fuku<=15;}).length};return{tanRank:tanRank,fukuRank:fukuRank,umaRank:umaRank,wideRank:wideRank,sanRank:sanRank,tanRow:tanRow,fukuRow:fukuRow,umaRow:umaRow,wideRow:wideRow,sanRow:sanRow,fav1:tanRank[0]?tanRank[0].h:null,fav2:tanRank[1]?tanRank[1].h:null,fav3:tanRank[2]?tanRank[2].h:null,tanM:mid(tanRow),fukuM:mid(fukuRow),umaM:mid(umaRow),wideM:mid(wideRow),sanM:mid(sanRow),tan10M:rangeMed(tanRank,10,20),tan20M:rangeMed(tanRank,20,30),fuku12M:mid(fukuRank.filter(function(x){return x.fuku<=12;}).map(function(x){return x.h;})),w80:w80,w6:w6,w15:w15,umaRank6:umaRank6,all:all,counts:counts};}
function makeRaceDiag(ctx){var n1=ctx.umaRank[0]?Number(ctx.umaRank[0].od):null,surface='判定不可',risk=0,cls='gray';if(n1!==null){if(n1<4){surface='本命戦';cls='good';}else if(n1<9){surface='中荒れ戦';cls='yellow';risk+=1;}else if(n1<15){surface='荒れ戦';cls='orange';risk+=2;}else{surface='大荒れ戦';cls='warn';risk+=3;}}var top=ctx.tanRank[0],topF=ctx.fukuRank[0];var san1=ctx.sanRank[0]?Number(ctx.sanRank[0].od):999;var hard=false;if(top&&top.tan<=1.4)hard=true;if(topF&&topF.fuku<=1.1&&san1<=8)hard=true;if(n1!==null&&n1<4&&san1<=6)hard=true;var suitable=(ctx.counts.tanUnder10>=3&&ctx.counts.tanUnder10<=5&&ctx.counts.tanUnder30>=5&&ctx.counts.tanUnder30<=8&&ctx.counts.fukuUnder6>=5&&ctx.counts.fukuUnder6<=7&&ctx.counts.fukuUnder10>=6&&ctx.counts.fukuUnder10<=9&&ctx.counts.fukuUnder15>=7&&ctx.counts.fukuUnder15<=10&&n1!==null&&n1>=3&&n1<=6.9);var wild=(ctx.counts.tanUnder10>=6||ctx.counts.fukuUnder10>=10||(n1!==null&&n1>=9));var mType=hard?'硬すぎ':(wild?'荒れすぎ':(suitable?'まっちゃん単勝向き':'通常'));var back=hard?'硬い本命残し':(wild?'単勝厚張り注意':(suitable?'上位ズレ単勝注意':'軽いズレ注意'));return{surface:surface,cls:cls,risk:risk,matchanType:mType,back:back,hard:hard,suitable:suitable,wild:wild,san1:san1};}
function scoreAll(data,ctx){var tr=rankMap(ctx.tanRow),fr=rankMap(ctx.fukuRow),scored=[];ctx.all.forEach(function(h){var tf=getTF(data,h)||{tan:null,fuku:null};var score=0,reasons=[];function hit(arr,pt,txt){if((arr||[]).indexOf(h)>=0){score+=pt;reasons.push(txt);}}hit(ctx.tanM,5,'単勝メジアン');hit(ctx.tan10M,9,'単勝10倍台メジアン');hit(ctx.tan20M,8,'単勝20倍台メジアン');hit(ctx.fukuM,6,'複勝メジアン');hit(ctx.fuku12M,9,'複勝12倍以下メジアン');hit(ctx.w6.before,11,'複勝6倍壁前');hit(ctx.w15.before,12,'複勝15倍壁前');hit(ctx.umaM,5,'馬連メジアン');hit(ctx.wideM,5,'ワイドメジアン');hit(ctx.sanM,7,'三連複メジアン');hit(ctx.umaRank6,6,'馬連6位壁ゾーン');var tRank=tr[h]||99,fRank=fr[h]||99;var nc=countAppearTop(ctx.umaRank,h,12),wc=countAppearTop(ctx.wideRank,h,12),sc=countAppearTop(ctx.sanRank,h,20),br=bestRankIn(ctx.sanRank,h,8);if(nc>=2){score+=3;reasons.push('馬連上位出現'+nc+'回');}if(wc>=2){score+=3;reasons.push('ワイド上位出現'+wc+'回');}if(sc>=2){score+=5;reasons.push('三連複上位出現'+sc+'回');}if(br<=5){score+=9;reasons.push('三連複5位以内出現');}if(br<=4&&safeNum(tf.tan)<=60&&h!==ctx.fav1){score+=10;reasons.push('中穴保護');}if(tRank>=6&&fRank<=8){score+=8;reasons.push('単複ズレ');}scored.push({h:h,score:Math.round(score),tan:tf.tan||'-',fuku:tf.fuku||'-',tRank:tRank,fRank:fRank,sanBest:br,reasons:reasons});});scored.sort(function(a,b){if(b.score!==a.score)return b.score-a.score;return safeNum(a.tan)-safeNum(b.tan);});return scored;}
function detectBigSwitch(ctx,scored){var cand=scored.filter(function(x){return x.score>=38&&x.h!==ctx.fav1;}).slice(0,8);var max=cand[0]?cand[0].score:0,level='なし';if(max>=75)level='SSS';else if(max>=62)level='SS';else if(max>=50)level='S';else if(max>=40)level='A';return{level:level,items:cand,score:max};}
function makeMatchanSystem(ctx,scored,diag){var upper=[],place=[],cut=[];scored.forEach(function(x){var tan=safeNum(x.tan),fuku=safeNum(x.fuku),r=x.reasons.join(' / '),rank=x.tRank;var medianHit=(r.indexOf('単勝10倍台メジアン')>=0||r.indexOf('単勝20倍台メジアン')>=0||r.indexOf('単勝メジアン')>=0);var fukuHit=(r.indexOf('複勝12倍以下メジアン')>=0||r.indexOf('複勝6倍壁前')>=0||r.indexOf('複勝15倍壁前')>=0||r.indexOf('複勝メジアン')>=0);var sanHit=(r.indexOf('三連複メジアン')>=0||x.sanBest<=5);var upperCond=(x.h!==ctx.fav1&&rank>=2&&rank<=5&&tan>=4&&tan<=20&&fuku>=1.3&&fuku<=6.2&&medianHit&&fukuHit&&sanHit);var holeCond=(x.h!==ctx.fav1&&(rank>=6||tan>20)&&fuku<=15&&(fukuHit||sanHit));if(upperCond){var sc=0;if(medianHit)sc+=25;if(fukuHit)sc+=25;if(sanHit)sc+=25;if(diag.suitable)sc+=15;if(diag.hard)sc+=8;if(tan>=10&&tan<=20)sc+=7;if(rank>=2&&rank<=4)sc+=5;upper.push({h:x.h,score:sc,tan:x.tan,fuku:x.fuku,reason:x.reasons});}else if(holeCond){if(diag.hard||diag.wild)cut.push(x);else place.push(x);}else if(x.h!==ctx.fav1&&x.sanBest<=5&&tan<=30){place.push(x);}});upper.sort(function(a,b){return b.score-a.score;});place=uniq(place.map(function(x){return x.h;})).map(function(h){return scored.filter(function(x){return x.h===h;})[0];});cut=uniq(cut.map(function(x){return x.h;})).map(function(h){return scored.filter(function(x){return x.h===h;})[0];});var top=upper[0]||null;var partner=null,tri=null;if(top){for(var i=0;i<ctx.sanRank.length;i++){var t=ctx.sanRank[i];if(t.a===top.h||t.b===top.h||t.c===top.h){var arr=[t.a,t.b,t.c];if(arr.indexOf(ctx.fav1)>=0){tri=t.key;var others=arr.filter(function(h){return h!==top.h&&h!==ctx.fav1;});partner=others[0]||ctx.fav2;break;}}}if(!tri&&ctx.sanRank.length){for(var j=0;j<ctx.sanRank.length;j++){var u=ctx.sanRank[j];if(u.a===top.h||u.b===top.h||u.c===top.h){tri=u.key;var ar=[u.a,u.b,u.c].filter(function(h){return h!==top.h;});partner=ar[0];break;}}}if(!partner)partner=ctx.fav2;}var type='見送り';if(top){if(diag.wild)type='単勝少額型';else type='上位ズレ単勝型';}else if(place.length)type='3連複相手型';return{type:type,upper:upper.slice(0,3),place:place.slice(0,5),cut:cut.slice(0,5),top:top,partner:partner,tri:tri};}
function addP(arr,a,b){if(a&&b&&a!==b)add(arr,pairKey(a,b));}
function addT(arr,a,b,c){if(a&&b&&c&&a!==b&&a!==c&&b!==c)add(arr,triKey(a,b,c));}
function makeTickets(ctx,ms,scored){var wide=[],uma=[],main=[],hole=[],bomb=[];if(ms.top){addP(wide,ms.top.h,ms.partner);addP(uma,ms.top.h,ms.partner);if(ms.tri)bomb.push(ms.tri);else addT(bomb,ctx.fav1,ms.top.h,ms.partner);}ctx.sanRank.slice(0,5).forEach(function(t){addT(main,t.a,t.b,t.c);});ms.place.slice(0,3).forEach(function(x){addT(hole,ctx.fav1,ctx.fav2,x.h);addT(hole,ctx.fav1,ctx.fav3,x.h);});ms.cut.slice(0,2).forEach(function(x){addT(bomb,ctx.fav1,ctx.fav2,x.h);});return{wide:uniq(wide).slice(0,4),uma:uniq(uma).slice(0,4),main:uniq(main).slice(0,6),hole:uniq(hole).slice(0,6),bomb:uniq(bomb).slice(0,6)};}
function renderTop(data,ctx){return '<div class="card"><div class="title">'+data.title+'</div>単勝1人気：<span class="yellow">'+(ctx.tanRank[0]?ctx.tanRank[0].h+'番 '+ctx.tanRank[0].tan+'倍':'なし')+'</span><br>馬連1人気：<span class="yellow">'+(ctx.umaRank[0]?ctx.umaRank[0].key+' '+ctx.umaRank[0].od+'倍':'なし')+'</span><br>三連複1人気：<span class="yellow">'+(ctx.sanRank[0]?ctx.sanRank[0].key+' '+ctx.sanRank[0].od+'倍':'なし')+'</span></div>';}
function renderDiag(diag,ctx){var c=ctx.counts;var html='<div class="card '+(diag.hard||diag.wild?'diagWarn':'diag')+'"><div class="title">🩺レース診断</div>';html+='表面：<span class="'+diag.cls+'">'+diag.surface+'</span><br>裏診断：<span class="yellow">'+diag.back+'</span><br>まっちゃん判定：<span class="red">'+diag.matchanType+'</span><hr>';html+='単勝10倍未満：'+c.tanUnder10+'頭 / 単勝30倍未満：'+c.tanUnder30+'頭<br>';html+='複勝6倍以内：'+c.fukuUnder6+'頭 / 10倍以内：'+c.fukuUnder10+'頭 / 15倍以内：'+c.fukuUnder15+'頭<br>';html+='単勝10倍台メジアン：<span class="yellow">'+joinH(ctx.tan10M)+'</span><br>';html+='単勝20倍台メジアン：<span class="yellow">'+joinH(ctx.tan20M)+'</span><br>';html+='複勝12倍以下メジアン：<span class="blue">'+joinH(ctx.fuku12M)+'</span><br>';html+='複勝6壁前：<span class="yellow">'+joinH(ctx.w6.before)+'</span> / 複勝15壁前：<span class="orange">'+joinH(ctx.w15.before)+'</span></div>';return html;}
function renderMatchan(ms,diag,ctx){var html='<div class="card matchan"><div class="title">🔥まっちゃん単勝システム</div>';html+='最終タイプ：<span class="red">'+ms.type+'</span><br>';html+='<span class="small">硬すぎ診断でも、単勝2〜5人気・単勝4〜20倍・複勝2〜6倍台・三連複本線絡みの馬は「上位ズレ単勝」として残します。大穴昇格だけの馬は単勝厚張りからカット。</span><hr>';if(ms.top){html+='<div class="rankLine"><span class="badge">単勝候補 '+ms.top.h+'番</span> 単'+ms.top.tan+' / 複'+ms.top.fuku+'<br><span class="small">'+ms.top.reason.slice(0,8).join('・')+'</span></div>';html+='<pre>最終買い目\n単勝 '+ms.top.h+'　700円\nワイド '+pairKey(ms.top.h,ms.partner)+'　200円\n三連複 '+(ms.tri||triKey(ctx.fav1,ms.top.h,ms.partner))+'　100円</pre>';}else{html+='単勝厚張り候補なし<br>';}html+='<hr>3連複相手型：'+(ms.place.length?ms.place.map(function(x){return x.h+'番';}).join('・'):'なし')+'<br>';html+='大穴単勝カット：'+(ms.cut.length?ms.cut.map(function(x){return x.h+'番';}).join('・'):'なし')+'</div>';return html;}
function renderSwitch(sw){var html='<div class="card switch"><div class="title">🚨大穴スイッチ</div>判定：<span class="red">'+sw.level+'</span> / 最高 '+sw.score+'<hr>';if(!sw.items.length)html+='該当なし';else sw.items.forEach(function(x,i){html+='<div class="rankLine"><span class="badge">'+(i+1)+'位 '+x.h+'番【'+x.score+'】</span> <span class="small">単'+x.tan+' / 複'+x.fuku+'　'+x.reasons.slice(0,8).join('・')+'</span></div>';});html+='</div>';return html;}
function renderHonRow(label,row,med,marks,maxLen){var arr=row.slice();while(arr.length<maxLen)arr.push('');var html='<div class="honRow"><div class="honLabel">'+label+'</div>';for(var i=0;i<maxLen;i++){var h=arr[i],cls='honNum';if(!h)cls+=' honEmpty';else if((marks.w80||[]).indexOf(h)>=0)cls+=' wall80';else if((marks.w15||[]).indexOf(h)>=0)cls+=' wall15';else if((marks.w6||[]).indexOf(h)>=0)cls+=' wall6';else if(med.indexOf(h)>=0)cls+=' honMed';html+='<span class="'+cls+'">'+(h||'')+'</span>';if(i<maxLen-1)html+='<span class="bar"></span>';}html+='</div>';return html;}
function renderHonpyo(ctx){var rows=[{l:'単勝',r:ctx.tanRow,m:ctx.tanM},{l:'複勝',r:ctx.fukuRow,m:ctx.fukuM},{l:'馬連',r:ctx.umaRow,m:ctx.umaM},{l:'ワイド',r:ctx.wideRow,m:ctx.wideM},{l:'三連複',r:ctx.sanRow,m:ctx.sanM}];var max=0;rows.forEach(function(x){if(x.r.length>max)max=x.r.length;});var marks={w80:uniq([].concat(ctx.w80.before,ctx.w80.after)),w15:uniq([].concat(ctx.w15.before,ctx.w15.after)),w6:uniq([].concat(ctx.w6.before,ctx.w6.after))};var html='<div class="card"><div class="title">本表・壁色つき</div><div class="honWrap">';rows.forEach(function(x){html+=renderHonRow(x.l,x.r,x.m,marks,max);});html+='</div></div>';return html;}
function renderRank(scored){var html='<div class="card"><div class="title">候補ランキング</div>';scored.slice(0,10).forEach(function(x,i){html+='<div class="rankLine"><span class="badge">'+(i+1)+'位 '+x.h+'番【'+x.score+'】</span> <span class="small">単'+x.tan+' / 複'+x.fuku+'　'+x.reasons.slice(0,8).join('・')+'</span></div>';});html+='</div>';return html;}
function renderTickets(t){var html='<div class="card tickets"><div class="title">💰圧縮買い目</div><pre>';html+='ワイド\n'+(t.wide.length?t.wide.join('\n'):'なし')+'\n\n馬連\n'+(t.uma.length?t.uma.join('\n'):'なし')+'\n\n三連複・本線\n'+(t.main.length?t.main.join('\n'):'なし')+'\n\n三連複・穴相手\n'+(t.hole.length?t.hole.join('\n'):'なし')+'\n\n三連複・保険\n'+(t.bomb.length?t.bomb.join('\n'):'なし')+'\n\n※上位ズレ単勝が出た時は、単勝＋ワイド＋三連複1点を優先。3連単多点は原則カット。';html+='</pre></div>';return html;}
function makeCopyText(data,diag,ctx,ms,sw,tickets,scored){var s=data.title+'\n競馬メジアン V2.32 まっちゃん単勝システム\n\n';s+='🩺レース診断\n表面：'+diag.surface+'\nまっちゃん判定：'+diag.matchanType+'\n単勝10倍未満：'+ctx.counts.tanUnder10+'頭\n単勝30倍未満：'+ctx.counts.tanUnder30+'頭\n複勝6倍以内：'+ctx.counts.fukuUnder6+'頭\n複勝10倍以内：'+ctx.counts.fukuUnder10+'頭\n複勝15倍以内：'+ctx.counts.fukuUnder15+'頭\n\n';s+='🔥まっちゃん単勝システム\n最終タイプ：'+ms.type+'\n';if(ms.top){s+='単勝候補：'+ms.top.h+'番 単'+ms.top.tan+' 複'+ms.top.fuku+'\n買い目：単勝 '+ms.top.h+' 700円 / ワイド '+pairKey(ms.top.h,ms.partner)+' 200円 / 三連複 '+(ms.tri||triKey(ctx.fav1,ms.top.h,ms.partner))+' 100円\n';}s+='3連複相手型：'+(ms.place.length?ms.place.map(function(x){return x.h+'番';}).join('・'):'なし')+'\n大穴単勝カット：'+(ms.cut.length?ms.cut.map(function(x){return x.h+'番';}).join('・'):'なし')+'\n\n';s+='大穴スイッチ：'+sw.level+' / '+sw.score+'\n';s+='圧縮買い目\nワイド\n'+tickets.wide.join('\n')+'\n\n三連複・本線\n'+tickets.main.join('\n')+'\n\n三連複・保険\n'+tickets.bomb.join('\n')+'\n\n候補上位\n';scored.slice(0,8).forEach(function(x,i){s+=(i+1)+'位 '+x.h+'番【'+x.score+'】 単'+x.tan+' 複'+x.fuku+' '+x.reasons.slice(0,7).join('・')+'\n';});return s;}
function run(){try{var data=parseData(document.getElementById('input').value),out=document.getElementById('out');if(!data.tanfuku.length){out.innerHTML='<div class="card"><div class="title warn">入力不足</div>[TANFUKU] が必要です。</div>';return;}var ctx=makeContext(data),diag=makeRaceDiag(ctx),scored=scoreAll(data,ctx),sw=detectBigSwitch(ctx,scored),ms=makeMatchanSystem(ctx,scored,diag),tickets=makeTickets(ctx,ms,scored);var html='';html+=renderTop(data,ctx)+renderDiag(diag,ctx)+renderMatchan(ms,diag,ctx)+renderSwitch(sw)+renderHonpyo(ctx)+renderRank(scored)+renderTickets(tickets);out.innerHTML=html;latestCopyText=makeCopyText(data,diag,ctx,ms,sw,tickets,scored);}catch(e){document.getElementById('out').innerHTML='<div class="card"><div class="title warn">エラー</div><pre>'+String(e&&e.message?e.message:e)+'</pre></div>';}}

function clearAll(){document.getElementById('input').value='';document.getElementById('out').innerHTML='';latestCopyText='';}
function copyResult(){if(!latestCopyText){alert('先に解析してください');return;}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(latestCopyText).then(function(){alert('結果をコピーしました');}).catch(function(){fallbackCopy(latestCopyText);});}else fallbackCopy(latestCopyText);}
function fallbackCopy(text){var ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);alert('結果をコピーしました');}
