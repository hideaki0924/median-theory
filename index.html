<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>チャッピー神予想 V22</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#07101f;color:#fff;padding:16px;margin:0;font-size:18px}
h1{font-size:30px;line-height:1.25}
label{color:#ffd66b;font-weight:bold;font-size:22px;display:block;margin-top:12px}
input,textarea{width:100%;box-sizing:border-box;background:#050912;color:#fff;border:2px solid #33415c;border-radius:14px;padding:14px;font-size:20px;margin:8px 0 18px}
textarea{height:360px;font-family:monospace}
button{width:100%;padding:18px;border:0;border-radius:18px;font-size:24px;font-weight:bold;margin:8px 0}
.main{background:#ffd66b;color:#000}.sub{background:#2d3748;color:#fff}
.box{background:#111b2e;border:2px solid #33415c;border-radius:18px;padding:16px;margin:16px 0}
.result{background:#0b1324;border:3px solid #ffd66b}
pre{white-space:pre-wrap;line-height:1.6;font-size:18px}
.scroll{overflow-x:auto;border:2px solid #ffd66b;border-radius:14px;margin:14px 0}
table{border-collapse:collapse;min-width:1200px;background:#07101f}
td,th{border:1px solid #33415c;padding:8px 12px;text-align:center;white-space:nowrap}
.rowhead{background:#152036;color:#ffd66b;font-weight:bold;position:sticky;left:0;text-align:left;padding-left:0;width:110px;min-width:110px}
.rank-red{color:#ff4d4d;font-weight:bold}
.guide{border:3px solid #ffd66b;border-radius:18px;padding:18px;margin:16px 0;background:#101a2d;font-weight:bold;line-height:1.7}
.blue{color:#4da3ff;font-size:24px}
.yellow{color:#ffd66b;font-size:24px}
.red{color:#ff4d4d;font-size:24px}
.green{color:#5ee05e;font-size:24px}
.purple{color:#c063ff;font-size:24px}
</style>
</head>
<body>

<h1>🏇 チャッピー神予想<br>V22 超穴警報</h1>

<div class="box">
<label>レース名</label>
<input id="race" placeholder="例：名古屋12R">
<label>オッズ入力</label>
<textarea id="odds" placeholder="[TANFUKU]
5 3.7 1.8
2 5.8 3.1

[UMAREN]
5-12 8.5
2-5 12.3

[SANPUKU]
5-12-17 14.7"></textarea>
<button class="main" onclick="analyze()">分析する</button>
<button class="sub" onclick="sample()">サンプル入力</button>
<button class="sub" onclick="clearAll()">クリア</button>
</div>

<div id="out" class="box result">ここに分析結果が出ます。</div>

<script>
function toNum(v){
 return parseFloat(String(v).replace(/[０-９]/g,s=>String.fromCharCode(s.charCodeAt(0)-65248)).replace(/[．]/g,'.').replace(/[^\d.]/g,''));
}
function splitHorses(s){return String(s).replace(/－/g,'-').split('-').map(x=>x.trim()).filter(Boolean);}
function parseData(){
 const text=document.getElementById('odds').value.replace(/－/g,'-');
 const lines=text.split(/\n/).map(x=>x.trim()).filter(Boolean);
 let sec='tanfuku';
 const tan=[],fuku=[],umaren=[],san=[];
 for(const line of lines){
  const u=line.toUpperCase();
  if(u.includes('TANFUKU')||line.includes('単複')){sec='tanfuku';continue}
  if(u.includes('UMAREN')||line.includes('馬連')||line.includes('馬複')){sec='umaren';continue}
  if(u.includes('SANPUKU')||line.includes('三連複')){sec='san';continue}
  if(u.includes('TAN')||line.includes('単勝')){sec='tan';continue}
  if(u.includes('FUKU')||line.includes('複勝')){sec='fuku';continue}
  const p=line.split(/\s+/);
  if(sec==='tanfuku' && p.length>=3){
   tan.push({horse:p[0],odds:toNum(p[1])});
   fuku.push({horse:p[0],odds:toNum(p[2])});
   continue;
  }
  if(p.length<2)continue;
  const odds=toNum(p[1]);
  if(!odds)continue;
  if(sec==='tan')tan.push({horse:p[0],odds});
  if(sec==='fuku')fuku.push({horse:p[0],odds});
  if(sec==='umaren')umaren.push({pair:p[0],odds,hs:splitHorses(p[0])});
  if(sec==='san')san.push({pair:p[0],odds,hs:splitHorses(p[0])});
 }
 tan.sort((a,b)=>a.odds-b.odds); fuku.sort((a,b)=>a.odds-b.odds);
 umaren.sort((a,b)=>a.odds-b.odds); san.sort((a,b)=>a.odds-b.odds);
 return {tan,fuku,umaren,san};
}
function medianHorse(arr){
 if(!arr.length)return '-';
 const n=arr.length;
 return n%2 ? arr[Math.floor(n/2)].horse : arr[n/2-1].horse+'・'+arr[n/2].horse;
}
function medianPair(arr){
 if(!arr.length)return '-';
 const n=arr.length;
 return n%2 ? arr[Math.floor(n/2)].pair : arr[n/2-1].pair+'・'+arr[n/2].pair;
}
function stars(n){if(n>=85)return'★★★★★';if(n>=70)return'★★★★';if(n>=55)return'★★★';if(n>=40)return'★★';return'★'}
function heat(n){if(n>=5)return'🔥激熱';if(n>=4)return'⭕熱';if(n>=3)return'△注意';return''}
function wallList(arr,t){
 const r=[];
 for(let i=0;i<arr.length-1;i++){
  const d=arr[i+1].odds-arr[i].odds;
  if(d>=t)r.push((arr[i].horse||arr[i].pair)+'('+arr[i].odds+') → '+(arr[i+1].horse||arr[i+1].pair)+'('+arr[i+1].odds+') 差'+d.toFixed(1));
 }
 return r;
}
function makeUmarenOrder(tan,umaren){
 const axis=tan[0]?tan[0].horse:'';
 const order=[axis],odds=['―'];
 umaren.filter(x=>x.hs.includes(axis)).forEach(x=>{
  const other=x.hs.find(h=>h!==axis);
  if(other&&!order.includes(other)){order.push(other);odds.push(x.odds);}
 });
 return {order,odds};
}
function tableBook(tan,fuku,umaren){
 const u=makeUmarenOrder(tan,umaren);
 const max=Math.max(u.order.length,tan.length,fuku.length);
 let html='<div class="scroll"><table>';
 const rows=[
  ['馬連ランク',u.order,true],['馬連オッズ',u.odds,false],
  ['単勝ランク',tan.map(x=>x.horse),true],['単勝オッズ',tan.map(x=>x.odds),false],
  ['複勝ランク',fuku.map(x=>x.horse),true],['複勝オッズ',fuku.map(x=>x.odds),false]
 ];
 rows.forEach(r=>{
  html+='<tr><td class="rowhead">'+r[0]+'</td>';
  for(let i=0;i<max;i++)html+='<td class="'+(r[2]?'rank-red':'')+'">'+(r[1][i]||'')+'</td>';
  html+='</tr>';
 });
 html+='</table></div>';
 return html;
}
function addMap(map,h,p,label){
 if(!h||h==='-')return;
 String(h).split('・').forEach(x=>{
  if(!x||x==='-')return;
  if(!map[x])map[x]={pt:0,labels:[]};
  map[x].pt+=p;
  map[x].labels.push(label);
 });
}
function analyze(){
 const race=document.getElementById('race').value||'レース名未入力';
 const {tan,fuku,umaren,san}=parseData();
 if(!tan.length){document.getElementById('out').innerHTML='単勝データがありません。';return;}

 const axis=tan[0].horse;
 const tan30=tan.filter(x=>x.odds<30).length;
 const tan10=tan.filter(x=>x.odds<10).length;
 const fuku3=fuku.filter(x=>x.odds<3).length;
 const fuku6=fuku.filter(x=>x.odds<6).length;
 const um1=umaren[0]?umaren[0].odds:0;

 const f6i=fuku.findIndex(x=>x.odds>=6);
 const f15i=fuku.findIndex(x=>x.odds>=15);
 const f10i=fuku.findIndex(x=>x.odds>=10);
 const f6pre=f6i>=2?fuku.slice(f6i-2,f6i).map(x=>x.horse):[];
 const f15pre=f15i>=2?fuku.slice(f15i-2,f15i).map(x=>x.horse):[];
 const f10pre=f10i>=2?fuku.slice(f10i-2,f10i).map(x=>x.horse):[];
 const f6entry=f6i>=0?fuku[f6i].horse:'-';
 const f10after=f10i>=0?fuku[f10i].horse:'-';
 const f15to6=fuku.filter(x=>x.odds>=6 && x.odds<15);
 const f15to6med=medianHorse(f15to6);
 const f6ToFav=[...f6pre,axis].filter((v,i,a)=>v&&a.indexOf(v)===i).join('・');

 let tan20=tan.filter(x=>x.odds<=20);
 let border='-',topValue='-',bottomValue='-';
 if(tan20.length>=2){
  const n=tan20.length;
  if(n%2===0){topValue=tan20[n/2-1].horse;bottomValue=tan20[n/2].horse;border=topValue+'・'+bottomValue;}
  else{topValue=bottomValue=tan20[Math.floor(n/2)].horse;border=topValue;}
 }

 const score={};
 [
  medianHorse(tan),medianHorse(tan.filter(x=>x.odds<=10)),medianHorse(tan.filter(x=>x.odds>=10)),
  medianHorse(tan.filter(x=>x.odds>=10&&x.odds<=20)),medianHorse(tan.filter(x=>x.odds<=20)),
  medianHorse(tan.filter(x=>x.odds<=99)),medianHorse(fuku),medianHorse(fuku.filter(x=>x.odds<6)),
  medianHorse(fuku.filter(x=>x.odds<=12)),f15to6med
 ].join('・').split('・').forEach(h=>addMap(score,h,1,'メジアン'));
 f6pre.forEach(h=>addMap(score,h,1,'6倍壁前2頭'));
 f15pre.forEach(h=>addMap(score,h,1,'15倍壁前2頭'));
 addMap(score,f6entry,1,'6倍入口');
 const ranking=Object.entries(score).sort((a,b)=>b[1].pt-a[1].pt);
 const tansho=ranking.filter(x=>x[1].pt>=3).map(x=>x[0]);

 const ultra={};
 tansho.forEach(h=>addMap(ultra,h,2,'単勝案件'));
 f15pre.forEach(h=>addMap(ultra,h,2,'15倍壁前2頭'));
 f6pre.forEach(h=>addMap(ultra,h,1,'6倍壁前2頭'));
 addMap(ultra,f15to6med,2,'15壁→6以上メジアン');
 addMap(ultra,f6entry,1,'6倍入口馬');
 addMap(ultra,border,1,'境目ペア');
 addMap(ultra,f10after,1,'複勝10倍壁直後');
 ranking.filter(x=>x[1].pt>=4).forEach(x=>addMap(ultra,x[0],2,'重複4回以上'));
 ranking.filter(x=>x[1].pt>=3).forEach(x=>addMap(ultra,x[0],1,'重複3回以上'));

 const ultraRank=Object.entries(ultra).sort((a,b)=>b[1].pt-a[1].pt);
 const ultraMain=ultraRank.filter(x=>x[1].pt>=5).map(x=>x[0]);
 const ultraSub=ultraRank.filter(x=>x[1].pt>=3).map(x=>x[0]);

 let arere=30;
 if(um1>=9)arere+=25;
 if(tan30>=10)arere+=25;
 if(fuku6<=6)arere+=15;
 if(tan10>=6)arere+=10;
 if(arere>100)arere=100;

 let priority='標準';
 let priorityText='標準判定。単勝案件・複勝壁・境目を絡める。';
 if(um1 && um1<4){priority='馬連1人気4倍未満';priorityText='馬連1人気が低い。素直に本線重視。穴馬の相手に馬連1人気の2頭を入れる。';}
 else if(um1 && um1<9){priority='馬連1人気4〜9倍';priorityText='中穴ゾーン。本線を重視しつつ、境目ペア・単勝案件・複勝急上昇馬を絡める。';}
 else if(um1>=9){priority='馬連1人気9倍以上';priorityText='荒れ注意。人気だけで切らない。複勝壁・単勝案件・超穴警報を厚めに確認。';}
 if(tan10>=6)priorityText+=' 10倍未満6頭以上なので7人気・8人気も穴軸候補。';

 const axisA=medianHorse(tan.filter(x=>x.odds<=10));
 const axisB=f6ToFav;
 const targetA=medianHorse(tan.filter(x=>x.odds<=99));
 const targetB=border;
 const buyPairs=[];
 function addBuyPair(a,b){
  if(!a||!b||a==='-'||b==='-'||a===b)return;
  const p=a+'-'+b;
  if(!buyPairs.includes(p))buyPairs.push(p);
 }
 [...axisA.split('・'),...axisB.split('・')].forEach(a=>{
  [...targetA.split('・'),...targetB.split('・'),...ultraSub].forEach(b=>addBuyPair(a,b));
 });

 function formatOtani(pairs){
  const map={};
  pairs.forEach(p=>{
   const hs=p.split('-'); if(hs.length!==2)return;
   if(!map[hs[0]])map[hs[0]]=[];
   if(!map[hs[0]].includes(hs[1]))map[hs[0]].push(hs[1]);
  });
  return Object.entries(map).map(x=>x[0]+' → '+x[1].join('・')).join('\n')||'-';
 }

 const san1=san[0]?san[0].hs:[];
 const triple=[];
 ultraSub.slice(0,3).forEach(h=>{
  san1.forEach(a=>{
   san1.forEach(b=>{
    if(h!==a&&h!==b&&a!==b){
     const arr=[h,a,b];
     const key=arr.join('-');
     if(!triple.includes(key))triple.push(key);
    }
   });
  });
 });

 const guide='<div class="guide">'+
 '<div class="blue">🔵 優先：'+priority+'</div>'+
 '<div>'+priorityText+'</div><hr>'+
 '<div class="red">🔥 超穴警報</div>'+
 '<div>'+(ultraMain.length?ultraMain.join('・'):'なし')+'</div>'+
 '<div>※単勝案件＋複勝壁＋メジアン重複なら頭まで注意。</div><hr>'+
 '<div class="yellow">🟡 境目ペア注意</div>'+
 '<div>単勝20倍以内中央：'+border+'</div><hr>'+
 '<div class="purple">🟣 複勝壁最重要</div>'+
 '<div>6倍壁前2頭：'+(f6pre.join('・')||'なし')+'</div>'+
 '<div>15倍壁前2頭：'+(f15pre.join('・')||'なし')+'</div>'+
 '<div>15壁→6以上メジアン：'+f15to6med+'</div><hr>'+
 '<div class="green">🟢 三連複1人気確認</div>'+
 '<div>三連複1人気：'+(san[0]?san[0].pair:'-')+'</div>'+
 '</div>';

 document.getElementById('out').innerHTML=
 guide+
 tableBook(tan,fuku,umaren)+
 '<pre>'+
'\n━━━━━━━━━━━━━━\n'+race+'\n━━━━━━━━━━━━━━\n\n'+
'【レース判定】\n'+
'中穴\n理由：標準判定\n荒れ度：'+arere+'点 '+stars(arere)+'\n'+
'馬連1人気：'+(um1||'-')+'倍\n'+
'単勝30倍未満：'+tan30+'頭\n'+
'単勝10倍未満：'+tan10+'頭\n'+
'複勝3倍未満：'+fuku3+'頭\n'+
'複勝6倍未満：'+fuku6+'頭\n\n'+
'【単勝案件】\n'+(tansho.length?tansho.join('・'):'なし')+'\n\n'+
'重複ランキング：\n'+(ranking.map((x,i)=>(i+1)+'位 '+x[0]+'：'+x[1].pt+'回 '+heat(x[1].pt)).join('\n')||'なし')+'\n\n'+
'【超穴警報ランキング】\n'+
(ultraRank.map((x,i)=>(i+1)+'位 '+x[0]+'：'+x[1].pt+'点 / '+x[1].labels.join('・')).join('\n')||'なし')+'\n\n'+
'【メジアン】\n'+
'単勝全体：'+medianHorse(tan)+'\n'+
'単勝10倍以内：'+medianHorse(tan.filter(x=>x.odds<=10))+'\n'+
'単勝10倍以上：'+medianHorse(tan.filter(x=>x.odds>=10))+'\n'+
'単勝10〜20倍：'+medianHorse(tan.filter(x=>x.odds>=10&&x.odds<=20))+'\n'+
'単勝20倍以内：'+medianHorse(tan.filter(x=>x.odds<=20))+'\n'+
'単勝99倍以内：'+medianHorse(tan.filter(x=>x.odds<=99))+'\n\n'+
'複勝全体：'+medianHorse(fuku)+'\n'+
'複勝6倍未満：'+medianHorse(fuku.filter(x=>x.odds<6))+'\n'+
'複勝12倍以内：'+medianHorse(fuku.filter(x=>x.odds<=12))+'\n\n'+
'馬連メジアン：'+medianPair(umaren)+'\n'+
'三連複メジアン：'+medianPair(san)+'\n\n'+
'【複勝壁】\n'+
'複勝6倍壁前2頭：'+(f6pre.join('・')||'なし')+'\n'+
'複勝15倍壁前2頭：'+(f15pre.join('・')||'なし')+'\n'+
'6倍以上入口馬：'+f6entry+'\n'+
'15壁→6倍以上メジアン：'+f15to6med+'\n'+
'6倍壁前2頭→1人気：'+(f6ToFav||'なし')+'\n'+
'複勝10倍壁前2頭：'+(f10pre.join('・')||'なし')+'\n'+
'複勝10倍壁直後馬：'+f10after+'\n\n'+
'【乖離差警告】\n'+(wallList(tan,8).join('\n')||'なし')+'\n\n'+
'【チャッピー推奨】\n'+
'軸① 単勝10倍以内メジアン：'+axisA+'\n'+
'軸② 複勝6倍壁前2頭→1人気：'+axisB+'\n'+
'相手① 単勝99倍以内メジアン：'+targetA+'\n'+
'相手② 境目ペア：'+targetB+'\n'+
'穴① 超穴警報：'+(ultraSub.join('・')||'なし')+'\n\n'+
'【推奨 馬連 大谷式】\n'+formatOtani(buyPairs)+'\n\n'+
'【推奨 ワイド 大谷式】\n'+formatOtani(buyPairs)+'\n\n'+
'【三連単10万馬券モード】\n'+
'超穴警報馬を1着候補にする。\n'+
(triple.slice(0,18).join('\n')||'なし')+
'</pre>';
}
function sample(){
document.getElementById('race').value='名古屋最終';
document.getElementById('odds').value='[TANFUKU]\n10 3.7 1.8\n7 4.2 2.3\n2 5.4 2.8\n12 6.9 2.8\n9 7.0 2.4\n5 8.1 3.0\n8 20.7 4.8\n3 29.0 6.5\n6 32.4 5.8\n11 39.8 5.7\n4 71.9 18.9\n\n[UMAREN]\n7-10 8.4\n2-10 8.6\n5-10 11.1\n2-7 12.8\n2-5 13.4\n10-12 13.4\n9-10 13.5\n\n[SANPUKU]\n2-7-10 12.4\n2-5-10 17.6\n2-10-12 18.3\n2-9-10 22.7';
analyze();
}
function clearAll(){
 document.getElementById('race').value='';
 document.getElementById('odds').value='';
 document.getElementById('out').innerHTML='ここに分析結果が出ます。';
}
</script>
</body>
</html>
