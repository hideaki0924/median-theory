<body>
<h1>チャッピー神予想 競馬 V2.33<br>🔥まっちゃん単勝システム</h1>

<textarea id="input" placeholder="【園田2R】

[TANFUKU]
馬番 単勝 複勝上限

[UMAREN]
馬番-馬番 オッズ

[WIDE]
馬番-馬番 オッズ

[SANPUKU]
馬番-馬番-馬番 オッズ

※複勝は上限値で入力。1.2-2.4なら 2.4 を使う。"></textarea><br>

<button class="go" onclick="run()">解析</button>

<div id="out"></div>

<script>
var latestCopyText='';

function zenToHan(str){
  return String(str||'')
    .replace(/[０-９]/g,function(s){return String.fromCharCode(s.charCodeAt(0)-65248);})
    .replace(/．/g,'.')
    .replace(/[－ー―−]/g,'-')
    .replace(/[　]/g,' ')
    .replace(/[〜～]/g,'-');
}
function nums(line){
  var m=zenToHan(line).match(/\d+(?:\.\d+)?/g);
  return m?m.map(Number):[];
}
function pairKey(a,b){
  return [a,b].map(String).sort(function(x,y){return Number(x)-Number(y);}).join('-');
}
function triKey(a,b,c){
  return [a,b,c].map(String).sort(function(x,y){return Number(x)-Number(y);}).join('-');
}
function add(arr,v){
  v=String(v);
  if(v&&v!=='undefined'&&arr.indexOf(v)<0)arr.push(v);
}
function uniq(arr){
  var out=[];
  (arr||[]).forEach(function(v){add(out,v);});
  return out;
}
function sortOdds(arr){
  return arr.slice().sort(function(a,b){return Number(a.od)-Number(b.od);});
}
function mid(arr){
  arr=arr||[];
  if(!arr.length)return[];
  var n=arr.length;
  if(n%2)return[arr[Math.floor(n/2)]];
  return[arr[n/2-1],arr[n/2]];
}
function joinH(arr){
  return (!arr||!arr.length)?'なし':arr.map(function(x){return x+'番';}).join('・');
}
function safeNum(x,d){
  x=Number(x);
  return isFinite(x)?x:(d===0?0:(d||9999));
}
function getTF(data,h){
  h=String(h);
  for(var i=0;i<data.tanfuku.length;i++){
    if(data.tanfuku[i].h===h)return data.tanfuku[i];
  }
  return null;
}
function rankMap(row){
  var m={};
  row.forEach(function(h,i){m[h]=i+1;});
  return m;
}
function countAppearTop(list,h,n){
  h=String(h);
  var c=0;
  (list||[]).slice(0,n||20).forEach(function(x){
    if(x.a===h||x.b===h||x.c===h)c++;
  });
  return c;
}
function bestRankIn(list,h,n){
  h=String(h);
  for(var i=0;i<Math.min(n||20,list.length);i++){
    var x=list[i];
    if(x.a===h||x.b===h||x.c===h)return i+1;
  }
  return 999;
}
function pairRow(pairs){
  var row=[];
  sortOdds(pairs).forEach(function(p){
    add(row,p.a);
    add(row,p.b);
  });
  return row;
}
function triRow(tris){
  var row=[];
  sortOdds(tris).forEach(function(t){
    add(row,t.a);
    add(row,t.b);
    add(row,t.c);
  });
  return row;
}
function nearWall(sorted,field,wall){
  var before=[],after=[],idx=-1;
  for(var i=0;i<sorted.length;i++){
    var v=safeNum(sorted[i][field]);
    if(v<=wall)idx=i;
  }
  if(idx>=0){
    if(sorted[idx])before.push(sorted[idx].h);
    if(sorted[idx-1])before.push(sorted[idx-1].h);
  }
  if(sorted[idx+1])after.push(sorted[idx+1].h);
  if(sorted[idx+2])after.push(sorted[idx+2].h);
  return{before:uniq(before),after:uniq(after),idx:idx};
}
function rangeMed(tanRank,lo,hi){
  return mid(tanRank.filter(function(x){return x.tan>=lo&&x.tan<hi;}).map(function(x){return x.h;}));
}
function itemHorses(x){
  var arr=[];
  if(x.a)add(arr,x.a);
  if(x.b)add(arr,x.b);
  if(x.c)add(arr,x.c);
  return arr;
}
function oddsGapHorses(list,n){
  var best=-1,bScore=0;
  var limit=Math.min(n||12,list.length-1);
  for(var i=0;i<limit;i++){
    var a=safeNum(list[i].od),b=safeNum(list[i+1].od);
    var diff=b-a;
    var ratio=a>0?b/a:0;
    var score=diff*ratio;
    if(diff>=4 && ratio>=1.25 && score>bScore){
      best=i;
      bScore=score;
    }
  }
  var horses=[];
  if(best>=0){
    itemHorses(list[best]).forEach(function(h){add(horses,h);});
    itemHorses(list[best+1]).forEach(function(h){add(horses,h);});
  }
  return{idx:best,horses:horses};
}

function parseData(raw){
  var text=zenToHan(raw),lines=text.split(/\n/),title='レース',sec='',tanfuku=[],umaren=[],wide=[],sanpuku=[];
  for(var i=0;i<lines.length;i++){
    var line=lines[i].trim();
    if(!line)continue;
    if(line.indexOf('【')===0)title=line;
    var up=line.toUpperCase();

    if(up.indexOf('[')===0){
      if(up.indexOf('TAN')>=0||up.indexOf('単')>=0){sec='TANFUKU';continue;}
      if(up.indexOf('WIDE')>=0||up.indexOf('ワイド')>=0){sec='WIDE';continue;}
      if(up.indexOf('SAN')>=0||up.indexOf('3')>=0||up.indexOf('三')>=0){sec='SANPUKU';continue;}
      if(up.indexOf('UMA')>=0||up.indexOf('馬')>=0||up.indexOf('2')>=0){sec='UMAREN';continue;}
    }

    if(sec==='TANFUKU'){
      var n=nums(line);
      if(n.length>=3)tanfuku.push({h:String(Math.floor(n[0])),tan:n[1],fuku:n[n.length-1]});
      else if(n.length===2)tanfuku.push({h:String(Math.floor(n[0])),tan:n[1],fuku:null});
    }else if(sec==='UMAREN'){
      var m=line.match(/(\d+)\s*-\s*(\d+)/),o=nums(line);
      if(m&&o.length)umaren.push({a:m[1],b:m[2],od:o[o.length-1],key:pairKey(m[1],m[2])});
    }else if(sec==='WIDE'){
      var mw=line.match(/(\d+)\s*-\s*(\d+)/),ow=nums(line);
      if(mw&&ow.length)wide.push({a:mw[1],b:mw[2],od:ow[ow.length-1],key:pairKey(mw[1],mw[2])});
    }else if(sec==='SANPUKU'){
      var ms=line.match(/(\d+)\s*-\s*(\d+)\s*-\s*(\d+)/),os=nums(line);
      if(ms&&os.length)sanpuku.push({a:ms[1],b:ms[2],c:ms[3],od:os[os.length-1],key:triKey(ms[1],ms[2],ms[3])});
    }
  }
  return{title:title,tanfuku:tanfuku,umaren:umaren,wide:wide,sanpuku:sanpuku};
}

function makeContext(data){
  var tanRank=sortOdds(data.tanfuku.map(function(x){return{h:x.h,od:x.tan,tan:x.tan,fuku:x.fuku};}));
  var fukuRank=data.tanfuku.filter(function(x){return x.fuku!==null;}).map(function(x){return{h:x.h,od:x.fuku,tan:x.tan,fuku:x.fuku};}).sort(function(a,b){return Number(a.fuku)-Number(b.fuku);});
  var umaRank=sortOdds(data.umaren),wideRank=sortOdds(data.wide),sanRank=sortOdds(data.sanpuku);

  var tanRow=tanRank.map(function(x){return x.h;});
  var fukuRow=fukuRank.map(function(x){return x.h;});
  var umaRow=pairRow(data.umaren);
  var wideRow=pairRow(data.wide);
  var sanRow=triRow(data.sanpuku);

  var w80=nearWall(tanRank,'tan',80);
  var w6=nearWall(fukuRank,'fuku',6);
  var w15=nearWall(fukuRank,'fuku',15);

  var umaRank6=[];
  [4,5,6].forEach(function(i){
    if(umaRank[i]){
      add(umaRank6,umaRank[i].a);
      add(umaRank6,umaRank[i].b);
    }
  });

  var all=[];
  data.tanfuku.forEach(function(x){add(all,x.h);});
  [data.umaren,data.wide,data.sanpuku].forEach(function(list){
    list.forEach(function(x){
      add(all,x.a);
      add(all,x.b);
      if(x.c)add(all,x.c);
    });
  });

  var counts={
    tanUnder10:tanRank.filter(function(x){return x.tan<10;}).length,
    tanUnder30:tanRank.filter(function(x){return x.tan<30;}).length,
    fukuUnder6:fukuRank.filter(function(x){return x.fuku<=6;}).length,
    fukuUnder10:fukuRank.filter(function(x){return x.fuku<=10;}).length,
    fukuUnder15:fukuRank.filter(function(x){return x.fuku<=15;}).length
  };

  var umaGap=oddsGapHorses(umaRank,12);
  var sanGap=oddsGapHorses(sanRank,12);

  return{
    tanRank:tanRank,fukuRank:fukuRank,umaRank:umaRank,wideRank:wideRank,sanRank:sanRank,
    tanRow:tanRow,fukuRow:fukuRow,umaRow:umaRow,wideRow:wideRow,sanRow:sanRow,
    fav1:tanRank[0]?tanRank[0].h:null,
    fav2:tanRank[1]?tanRank[1].h:null,
    fav3:tanRank[2]?tanRank[2].h:null,
    tanM:mid(tanRow),
    fukuM:mid(fukuRow),
    umaM:mid(umaRow),
    wideM:mid(wideRow),
    sanM:mid(sanRow),
    tan10M:rangeMed(tanRank,10,20),
    tan20M:rangeMed(tanRank,20,30),
    fuku12M:mid(fukuRank.filter(function(x){return x.fuku<=12;}).map(function(x){return x.h;})),
    w80:w80,w6:w6,w15:w15,
    umaRank6:umaRank6,
    umaGap:umaGap,
    sanGap:sanGap,
    all:all,
    counts:counts
  };
}

function makeRaceDiag(ctx){
  var n1=ctx.umaRank[0]?Number(ctx.umaRank[0].od):null;
  var surface='判定不可',risk=0,cls='gray';

  if(n1!==null){
    if(n1<4){surface='本命戦';cls='good';}
    else if(n1<9){surface='中荒れ戦';cls='yellow';risk+=1;}
    else if(n1<15){surface='荒れ戦';cls='orange';risk+=2;}
    else{surface='大荒れ戦';cls='warn';risk+=3;}
  }

  var top=ctx.tanRank[0],topF=ctx.fukuRank[0];
  var san1=ctx.sanRank[0]?Number(ctx.sanRank[0].od):999;
  var hard=false;

  if(top&&top.tan<=1.4)hard=true;
  if(topF&&topF.fuku<=1.1&&san1<=8)hard=true;
  if(n1!==null&&n1<4&&san1<=6)hard=true;

  var suitable=(
    ctx.counts.tanUnder10>=3&&ctx.counts.tanUnder10<=5&&
    ctx.counts.tanUnder30>=5&&ctx.counts.tanUnder30<=8&&
    ctx.counts.fukuUnder6>=5&&ctx.counts.fukuUnder6<=7&&
    ctx.counts.fukuUnder10>=6&&ctx.counts.fukuUnder10<=9&&
    ctx.counts.fukuUnder15>=7&&ctx.counts.fukuUnder15<=10&&
    n1!==null&&n1>=3&&n1<=6.9
  );

  var wild=(ctx.counts.tanUnder10>=6||ctx.counts.fukuUnder10>=10||(n1!==null&&n1>=9));
  var mType=hard?'硬すぎ':(wild?'荒れすぎ':(suitable?'まっちゃん単勝向き':'通常'));
  var back=hard?'硬い本命残し':(wild?'単勝厚張り注意':(suitable?'上位ズレ単勝注意':'軽いズレ注意'));

  return{surface:surface,cls:cls,risk:risk,matchanType:mType,back:back,hard:hard,suitable:suitable,wild:wild,san1:san1};
}

function scoreAll(data,ctx){
  var tr=rankMap(ctx.tanRow),fr=rankMap(ctx.fukuRow),scored=[];

  ctx.all.forEach(function(h){
    var tf=getTF(data,h)||{tan:null,fuku:null};
    var score=0,reasons=[];

    function hit(arr,pt,txt){
      if((arr||[]).indexOf(h)>=0){
        score+=pt;
        reasons.push(txt);
      }
    }

    hit(ctx.tanM,5,'単勝メジアン');
    hit(ctx.tan10M,9,'単勝10倍台メジアン');
    hit(ctx.tan20M,8,'単勝20倍台メジアン');
    hit(ctx.fukuM,6,'複勝メジアン');
    hit(ctx.fuku12M,9,'複勝12倍以下メジアン');
    hit(ctx.w6.before,11,'複勝6倍壁前');
    hit(ctx.w15.before,12,'複勝15倍壁前');
    hit(ctx.umaM,5,'馬連メジアン');
    hit(ctx.wideM,5,'ワイドメジアン');
    hit(ctx.sanM,7,'三連複メジアン');
    hit(ctx.umaRank6,6,'馬連6位壁ゾーン');

    var tRank=tr[h]||99,fRank=fr[h]||99;
    var nc=countAppearTop(ctx.umaRank,h,12);
    var wc=countAppearTop(ctx.wideRank,h,12);
    var sc=countAppearTop(ctx.sanRank,h,20);
    var br=bestRankIn(ctx.sanRank,h,8);

    if(nc>=2){score+=3;reasons.push('馬連上位出現'+nc+'回');}
    if(wc>=2){score+=3;reasons.push('ワイド上位出現'+wc+'回');}
    if(sc>=2){score+=5;reasons.push('三連複上位出現'+sc+'回');}
    if(br<=5){score+=9;reasons.push('三連複5位以内出現');}
    if(br<=4&&safeNum(tf.tan)<=60&&h!==ctx.fav1){score+=10;reasons.push('中穴保護');}
    if(tRank>=6&&fRank<=8){score+=8;reasons.push('単複ズレ');}

    scored.push({h:h,score:Math.round(score),tan:tf.tan||'-',fuku:tf.fuku||'-',tRank:tRank,fRank:fRank,sanBest:br,reasons:reasons});
  });

  scored.sort(function(a,b){
    if(b.score!==a.score)return b.score-a.score;
    return safeNum(a.tan)-safeNum(b.tan);
  });
  return scored;
}

function detectBigSwitch(ctx,scored){
  var cand=scored.filter(function(x){return x.score>=38&&x.h!==ctx.fav1;}).slice(0,8);
  var max=cand[0]?cand[0].score:0,level='なし';
  if(max>=75)level='SSS';
  else if(max>=62)level='SS';
  else if(max>=50)level='S';
  else if(max>=40)level='A';
  return{level:level,items:cand,score:max};
}

function makeMatchanSystem(ctx,scored,diag){
  var upper=[],place=[],cut=[];

  scored.forEach(function(x){
    var tan=safeNum(x.tan),fuku=safeNum(x.fuku),r=x.reasons.join(' / '),rank=x.tRank;
    var medianHit=(r.indexOf('単勝10倍台メジアン')>=0||r.indexOf('単勝20倍台メジアン')>=0||r.indexOf('単勝メジアン')>=0);
    var fukuHit=(r.indexOf('複勝12倍以下メジアン')>=0||r.indexOf('複勝6倍壁前')>=0||r.indexOf('複勝15倍壁前')>=0||r.indexOf('複勝メジアン')>=0);
    var sanHit=(r.indexOf('三連複メジアン')>=0||x.sanBest<=5);

    var upperCond=(x.h!==ctx.fav1&&rank>=2&&rank<=5&&tan>=4&&tan<=20&&fuku>=1.3&&fuku<=6.2&&medianHit&&fukuHit&&sanHit);
    var holeCond=(x.h!==ctx.fav1&&(rank>=6||tan>20)&&fuku<=15&&(fukuHit||sanHit));

    if(upperCond){
      var sc=0;
      if(medianHit)sc+=25;
      if(fukuHit)sc+=25;
      if(sanHit)sc+=25;
      if(diag.suitable)sc+=15;
      if(diag.hard)sc+=8;
      if(tan>=10&&tan<=20)sc+=7;
      if(rank>=2&&rank<=4)sc+=5;
      upper.push({h:x.h,score:sc,tan:x.tan,fuku:x.fuku,reason:x.reasons});
    }else if(holeCond){
      if(diag.hard||diag.wild)cut.push(x);
      else place.push(x);
    }else if(x.h!==ctx.fav1&&x.sanBest<=5&&tan<=30){
      place.push(x);
    }
  });

  upper.sort(function(a,b){return b.score-a.score;});

  place=uniq(place.map(function(x){return x.h;})).map(function(h){
    return scored.filter(function(x){return x.h===h;})[0];
  });
  cut=uniq(cut.map(function(x){return x.h;})).map(function(h){
    return scored.filter(function(x){return x.h===h;})[0];
  });

  var top=upper[0]||null;
  var partner=null,tri=null;

  if(top){
    for(var i=0;i<ctx.sanRank.length;i++){
      var t=ctx.sanRank[i];
      if(t.a===top.h||t.b===top.h||t.c===top.h){
        var arr=[t.a,t.b,t.c];
        if(arr.indexOf(ctx.fav1)>=0){
          tri=t.key;
          var others=arr.filter(function(h){return h!==top.h&&h!==ctx.fav1;});
          partner=others[0]||ctx.fav2;
          break;
        }
      }
    }
    if(!tri&&ctx.sanRank.length){
      for(var j=0;j<ctx.sanRank.length;j++){
        var u=ctx.sanRank[j];
        if(u.a===top.h||u.b===top.h||u.c===top.h){
          tri=u.key;
          var ar=[u.a,u.b,u.c].filter(function(h){return h!==top.h;});
          partner=ar[0];
          break;
        }
      }
    }
    if(!partner)partner=ctx.fav2;
  }

  var type='見送り';
  if(top){
    if(diag.wild)type='単勝少額型';
    else type='上位ズレ単勝型';
  }else if(place.length)type='3連複相手型';

  return{type:type,upper:upper.slice(0,3),place:place.slice(0,5),cut:cut.slice(0,5),top:top,partner:partner,tri:tri};
}

function addP(arr,a,b){
  if(a&&b&&a!==b)add(arr,pairKey(a,b));
}
function addT(arr,a,b,c){
  if(a&&b&&c&&a!==b&&a!==c&&b!==c)add(arr,triKey(a,b,c));
}

function makeTickets(ctx,ms,scored){
  var wide=[],uma=[],main=[],hole=[],bomb=[];

  if(ms.top){
    addP(wide,ms.top.h,ms.partner);
    addP(uma,ms.top.h,ms.partner);
    if(ms.tri)bomb.push(ms.tri);
    else addT(bomb,ctx.fav1,ms.top.h,ms.partner);
  }

  ctx.sanRank.slice(0,5).forEach(function(t){
    addT(main,t.a,t.b,t.c);
  });

  ms.place.slice(0,3).forEach(function(x){
    addT(hole,ctx.fav1,ctx.fav2,x.h);
    addT(hole,ctx.fav1,ctx.fav3,x.h);
  });

  ms.cut.slice(0,2).forEach(function(x){
    addT(bomb,ctx.fav1,ctx.fav2,x.h);
  });

  return{
    wide:uniq(wide).slice(0,4),
    uma:uniq(uma).slice(0,4),
    main:uniq(main).slice(0,6),
    hole:uniq(hole).slice(0,6),
    bomb:uniq(bomb).slice(0,6)
  };
}
