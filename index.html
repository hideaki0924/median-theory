<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>チャッピー神予想 V1.1 安定版</title>
<style>
body{
  margin:0;
  background:#07101f;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  padding:14px;
  font-size:17px;
}
h1{
  color:#ffd84d;
  font-size:28px;
  line-height:1.3;
}
textarea{
  width:100%;
  height:330px;
  box-sizing:border-box;
  border-radius:16px;
  border:2px solid #475569;
  padding:12px;
  font-size:16px;
  line-height:1.45;
  font-family:monospace;
  background:#f8fafc;
  color:#111;
}
button{
  font-size:20px;
  font-weight:900;
  border:0;
  border-radius:16px;
  padding:14px 18px;
  margin:10px 6px 10px 0;
}
.go{background:#22c55e;color:#052e16}
.clear{background:#64748b;color:#fff}
.sample{background:#facc15;color:#422006}
.card{
  background:#0f1b33;
  border:1px solid #334155;
  border-radius:16px;
  padding:14px;
  margin:12px 0;
}
.title{
  color:#ffd84d;
  font-size:22px;
  font-weight:900;
  margin-bottom:8px;
}
.sub{
  color:#93c5fd;
  font-size:19px;
  font-weight:900;
  margin-top:10px;
}
.good{color:#86efac;font-weight:900}
.warn{color:#fb7185;font-weight:900}
.yellow{color:#fde68a;font-weight:900}
.small{color:#cbd5e1;font-size:14px}
pre{
  white-space:pre-wrap;
  word-break:break-word;
  background:#020617;
  color:#e5e7eb;
  padding:12px;
  border-radius:12px;
}
.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:999px;
  background:#1e293b;
  margin:3px 2px;
}
</style>
</head>
<body>

<h1>チャッピー神予想 V1.1<br>メジアン×大谷式・安定版</h1>

<textarea id="input" placeholder="ここにコードを貼る"></textarea>

<br>
<button class="go" id="btnRun">診断する</button>
<button class="clear" id="btnClear">クリア</button>
<button class="sample" id="btnSample">サンプル</button>

<div id="out"></div>

<script>
function zenToHan(str){
  return String(str)
    .replace(/[０-９]/g,function(s){return String.fromCharCode(s.charCodeAt(0)-65248);})
    .replace(/．/g,'.')
    .replace(/[－ー―−]/g,'-')
    .replace(/[　]/g,' ')
    .replace(/[〜～]/g,'-');
}

function getNums(line){
  var m = zenToHan(line).match(/\d+(?:\.\d+)?/g);
  if(!m) return [];
  return m.map(function(x){return Number(x);});
}

function parseData(raw){
  var text = zenToHan(raw);
  var lines = text.split(/\n/);
  var title = "レース";
  var sec = "";
  var tanfuku = [];
  var umaren = [];
  var wide = [];
  var sanpuku = [];

  for(var i=0;i<lines.length;i++){
    var line = lines[i].trim();
    if(!line) continue;

    if(line.indexOf("【")===0) title = line;

    if(line.toUpperCase().indexOf("[TANFUKU]")===0){sec="TANFUKU";continue;}
    if(line.toUpperCase().indexOf("[UMAREN]")===0){sec="UMAREN";continue;}
    if(line.toUpperCase().indexOf("[WIDE]")===0){sec="WIDE";continue;}
    if(line.toUpperCase().indexOf("[SANPUKU]")===0){sec="SANPUKU";continue;}

    if(sec==="TANFUKU"){
      var n = getNums(line);
      if(n.length>=3){
        tanfuku.push({
          h:String(Math.floor(n[0])),
          tan:n[1],
          fuku:n[n.length-1]
        });
      }
    }

    if(sec==="UMAREN"){
      var m = line.match(/(\d+)\s*-\s*(\d+)/);
      var o = getNums(line);
      if(m && o.length){
        umaren.push({a:m[1],b:m[2],od:o[o.length-1],key:m[1]+"-"+m[2]});
      }
    }

    if(sec==="WIDE"){
      var mw = line.match(/(\d+)\s*-\s*(\d+)/);
      var ow = getNums(line);
      if(mw && ow.length){
        wide.push({a:mw[1],b:mw[2],od:ow[ow.length-1],key:mw[1]+"-"+mw[2]});
      }
    }

    if(sec==="SANPUKU"){
      var ms = line.match(/(\d+)\s*-\s*(\d+)\s*-\s*(\d+)/);
      var os = getNums(line);
      if(ms && os.length){
        sanpuku.push({a:ms[1],b:ms[2],c:ms[3],od:os[os.length-1],key:ms[1]+"-"+ms[2]+"-"+ms[3]});
      }
    }
  }

  return {title:title,tanfuku:tanfuku,umaren:umaren,wide:wide,sanpuku:sanpuku};
}

function sortOdds(arr){
  return arr.slice().sort(function(a,b){return a.od-b.od;});
}

function sortBy(arr,key){
  return arr.slice().sort(function(a,b){return a[key]-b[key];});
}

function uniq(arr){
  var s = {};
  var out = [];
  for(var i=0;i<arr.length;i++){
    if(!s[arr[i]]){
      s[arr[i]]=true;
      out.push(arr[i]);
    }
  }
  return out;
}

function mid(arr){
  if(!arr.length) return [];
  if(arr.length===1) return [arr[0]];
  var n = arr.length;
  if(n%2===1) return [arr[Math.floor(n/2)]];
  return [arr[n/2-1],arr[n/2]];
}

function joinH(arr){
  if(!arr || !arr.length) return "なし";
  return arr.map(function(x){return x+"番";}).join("・");
}

function pairHorses(pairs){
  var a = [];
  for(var i=0;i<pairs.length;i++){
    a.push(pairs[i].a);
    a.push(pairs[i].b);
  }
  return uniq(a);
}

function detectWalls(pairs){
  var top = sortOdds(pairs).slice(0,9);
  var walls = [];
  for(var i=0;i<top.length-1;i++){
    var now = top[i].od;
    var next = top[i+1].od;
    var ratio = next / now;
    var diff = next - now;
    if(ratio>=1.55 || diff>=8){
      walls.push({before:i+1,after:i+2,ratio:ratio,diff:diff});
    }
  }
  return walls;
}

function zonePairs(pairs,walls){
  var top = sortOdds(pairs).slice(0,9);
  if(!top.length) return [];

  if(walls.length>=2){
    return top.slice(walls[0].after-1,walls[1].before);
  }
  if(walls.length===1){
    return top.slice(0,walls[0].before);
  }
  return top;
}

function fukuFront(tanfuku,limit){
  var arr = sortBy(tanfuku,"fuku").filter(function(x){return x.fuku<=limit;});
  return arr.slice(Math.max(0,arr.length-2)).map(function(x){return x.h;});
}

function fukuAfter(tanfuku,limit){
  var arr = sortBy(tanfuku,"fuku").filter(function(x){return x.fuku>limit;});
  return arr.slice(0,2).map(function(x){return x.h;});
}

function countPair(pairs,topN){
  var map = {};
  var arr = sortOdds(pairs).slice(0,topN);
  for(var i=0;i<arr.length;i++){
    var p = arr[i];
    [p.a,p.b].forEach(function(h){
      if(!map[h]) map[h]={h:h,count:0};
      map[h].count++;
    });
  }
  var out = [];
  for(var k in map) out.push(map[k]);
  return out.sort(function(a,b){return b.count-a.count;});
}

function countTri(tris,topN){
  var map = {};
  var arr = sortOdds(tris).slice(0,topN);
  for(var i=0;i<arr.length;i++){
    var p = arr[i];
    [p.a,p.b,p.c].forEach(function(h){
      if(!map[h]) map[h]={h:h,count:0};
      map[h].count++;
    });
  }
  var out = [];
  for(var k in map) out.push(map[k]);
  return out.sort(function(a,b){return b.count-a.count;});
}

function safeRun(){
  try{
    run();
  }catch(e){
    document.getElementById("out").innerHTML =
      '<div class="card"><div class="title warn">エラー</div><pre>'+String(e && e.message ? e.message : e)+'</pre></div>';
  }
}

function run(){
  var data = parseData(document.getElementById("input").value);
  var out = document.getElementById("out");

  if(data.tanfuku.length===0 || data.umaren.length===0){
    out.innerHTML = '<div class="card"><div class="title warn">入力不足</div>[TANFUKU] と [UMAREN] が必要です。</div>';
    return;
  }

  var tanRank = sortBy(data.tanfuku,"tan");
  var fukuRank = sortBy(data.tanfuku,"fuku");
  var umaRank = sortOdds(data.umaren);
  var sanRank = sortOdds(data.sanpuku);

  var topUma = umaRank.length ? umaRank[0].od : 999;
  var raceType = "大荒れ戦";
  if(topUma<4) raceType = "本命戦";
  else if(topUma<9) raceType = "中荒れ戦";
  else if(topUma<15) raceType = "荒れ戦";

  var walls = detectWalls(data.umaren);
  var zone = zonePairs(data.umaren,walls);
  var zoneH = pairHorses(zone);
  var zoneM = mid(zoneH);

  var tanM = mid(tanRank.map(function(x){return x.h;}));
  var fukuM = mid(fukuRank.map(function(x){return x.h;}));

  var fuku3 = fukuRank.filter(function(x){return x.fuku<3;}).map(function(x){return x.h;});
  var fuku6 = fukuFront(data.tanfuku,6);
  var fuku10 = fukuFront(data.tanfuku,10);
  var fuku15 = fukuFront(data.tanfuku,15);
  var fuku15a = fukuAfter(data.tanfuku,15);

  var umaTop = countPair(data.umaren,10).slice(0,4).map(function(x){return x.h;});
  var sanTop = countTri(data.sanpuku,10).slice(0,4).map(function(x){return x.h;});

  var horses = {};
  data.tanfuku.forEach(function(x){horses[x.h]=true;});
  data.umaren.forEach(function(x){horses[x.a]=true;horses[x.b]=true;});
  data.sanpuku.forEach(function(x){horses[x.a]=true;horses[x.b]=true;horses[x.c]=true;});

  var horseList = Object.keys(horses).sort(function(a,b){return Number(a)-Number(b);});

  var release15 = false;
  if(topUma>=9) release15 = true;
  for(var i=0;i<fuku15.length;i++){
    var h = fuku15[i];
    var c = 0;
    if(zoneH.indexOf(h)>=0) c++;
    if(zoneM.indexOf(h)>=0) c++;
    if(fuku6.indexOf(h)>=0) c++;
    if(fuku10.indexOf(h)>=0) c++;
    if(tanM.indexOf(h)>=0) c++;
    if(fukuM.indexOf(h)>=0) c++;
    if(c>=2) release15 = true;
  }

  var scored = [];
  for(var j=0;j<horseList.length;j++){
    var h2 = horseList[j];
    var score = 0;
    var reasons = [];

    if(zoneH.indexOf(h2)>=0){score+=6;reasons.push("馬連壁内");}
    if(zoneM.indexOf(h2)>=0){score+=8;reasons.push("馬連ゾーンメジアン");}
    if(tanM.indexOf(h2)>=0){score+=4;reasons.push("単勝メジアン");}
    if(fukuM.indexOf(h2)>=0){score+=4;reasons.push("複勝メジアン");}
    if(fuku6.indexOf(h2)>=0){score+=6;reasons.push("複勝6倍壁前");}
    if(fuku10.indexOf(h2)>=0){score+=5;reasons.push("複勝10倍壁前");}
    if(fuku15.indexOf(h2)>=0){score+= release15 ? 6 : 2;reasons.push(release15?"複勝15倍解放":"複勝15倍参考");}
    if(fuku15a.indexOf(h2)>=0){score+= release15 ? 3 : 0;reasons.push(release15?"15倍直後解放":"15倍直後参考");}
    if(umaTop.indexOf(h2)>=0){score+=5;reasons.push("馬連出現上位");}
    if(sanTop.indexOf(h2)>=0){score+=4;reasons.push("三連複出現上位");}

    var tf = data.tanfuku.filter(function(x){return x.h===h2;})[0];
    if(tf && tf.fuku>15 && !release15){score-=4;reasons.push("複勝15倍外で弱め");}

    scored.push({h:h2,score:score,reasons:reasons,tan:tf?tf.tan:"-",fuku:tf?tf.fuku:"-"});
  }

  scored.sort(function(a,b){return b.score-a.score;});

  var axis = scored.filter(function(x){return x.score>=14;}).slice(0,2);
  var partner = scored.filter(function(x){
    return x.score>=9 && axis.map(function(a){return a.h;}).indexOf(x.h)<0;
  }).slice(0,3);

  var decision = "見送り";
  if(axis.length && partner.length) decision = "買う";
  else if(scored[0] && scored[0].score>=10) decision = "少額";

  var html = "";
  html += '<div class="card"><div class="title">'+data.title+'</div>';
  html += '🩺 レース診断：<span class="yellow">'+raceType+'</span><br>';
  html += '馬連1番人気：<span class="yellow">'+umaRank[0].key+' '+umaRank[0].od+'倍</span><br>';
  html += '結論：<span class="'+(decision==="買う"?'good':decision==="少額"?'yellow':'warn')+'">'+decision+'</span>';
  html += '</div>';

  html += '<div class="card"><div class="title">🧱馬連オッズの壁</div>';
  html += '壁：'+(walls.length ? walls.map(function(w){return w.before+'位→'+w.after+'位';}).join(' / ') : '明確な壁なし')+'<br>';
  html += '見るゾーン：'+(zone.length ? zone.map(function(p){return p.key+'('+p.od+')';}).join(' / ') : 'なし')+'<br>';
  html += '壁内馬：'+joinH(zoneH)+'<br>';
  html += 'ゾーンメジアン：<span class="good">'+joinH(zoneM)+'</span>';
  html += '</div>';

  html += '<div class="card"><div class="title">🧠メジアン・壁</div>';
  html += '単勝メジアン：'+joinH(tanM)+'<br>';
  html += '複勝メジアン：'+joinH(fukuM)+'<br>';
  html += '複勝3倍未満：'+joinH(fuku3)+'<br>';
  html += '複勝6倍壁前：'+joinH(fuku6)+'<br>';
  html += '複勝10倍壁前：'+joinH(fuku10)+'<br>';
  html += '複勝15倍壁前：'+joinH(fuku15)+'<br>';
  html += '複勝15倍解放：'+(release15?'<span class="warn">発動</span>':'非発動');
  html += '</div>';

  html += '<div class="card"><div class="title">👑最終候補</div>';
  html += '軸候補：<span class="good">'+joinH(axis.map(function(x){return x.h;}))+'</span><br>';
  html += '相手候補：<span class="yellow">'+joinH(partner.map(function(x){return x.h;}))+'</span><hr>';

  for(var k=0;k<Math.min(8,scored.length);k++){
    var x = scored[k];
    html += '<div><span class="badge">'+(k+1)+'位 '+x.h+'番【'+x.score+'】</span> ';
    html += '<span class="small">単'+x.tan+' / 複'+x.fuku+'　'+x.reasons.join('・')+'</span></div>';
  }
  html += '</div>';

  html += '<div class="card"><div class="title">💰買い目 最大3点</div><pre>';
  if(decision==="見送り"){
    html += '見送り\n理由：重なり不足';
  }else{
    var A = axis.map(function(x){return x.h;});
    var B = partner.map(function(x){return x.h;});
    html += '◎ '+joinH(A)+'\n';
    html += '○ '+joinH(B)+'\n\n';
    html += 'ワイド\n';
    if(A[0] && B[0]) html += makePair(A[0],B[0])+'\n';
    if(A[0] && B[1]) html += makePair(A[0],B[1])+'\n';
    if(A[1] && B[0]) html += makePair(A[1],B[0])+'\n';
    html += '\n馬連\n';
    if(A[0] && B[0]) html += makePair(A[0],B[0])+'\n';
    if(A[0] && B[1]) html += makePair(A[0],B[1])+'\n';
    html += '\n三連複\n';
    if(A[0] && B[0] && B[1]) html += makeTri(A[0],B[0],B[1])+'\n';
    if(A[0] && A[1] && B[0]) html += makeTri(A[0],A[1],B[0])+'\n';
  }
  html += '</pre></div>';

  out.innerHTML = html;
}

function makePair(a,b){
  return [a,b].map(Number).sort(function(x,y){return x-y;}).join("-");
}

function makeTri(a,b,c){
  return [a,b,c].map(Number).sort(function(x,y){return x-y;}).join("-");
}

function sample(){
  document.getElementById("input").value =
'【函館1R】\n[TANFUKU]\n2 1.8 1.1\n3 2.8 2.4\n7 7.0 4.9\n5 10.0 6.7\n4 30.3 17.9\n6 33.5 12.7\n1 46.2 19.8\n9 107.9 55.5\n8 124.1 41.7\n\n[UMAREN]\n2-3 1.9\n2-7 4.9\n2-5 8.1\n3-7 12.0\n3-5 20.1\n2-6 23.0\n5-7 24.5\n2-4 30.1\n3-6 37.1\n1-2 37.4\n\n[WIDE]\n2-3 1.2-1.4\n2-7 1.7-2.3\n2-5 2.8-3.8\n3-7 2.7-4.2\n5-7 4.3-5.3\n3-5 3.7-5.4\n2-6 4.9-6.8\n3-6 5.6-7.9\n2-4 6.3-8.6\n1-2 7.5-10.4\n\n[SANPUKU]\n2-3-7 3.4\n2-3-5 4.6\n2-5-7 8.4\n2-3-6 11.3\n1-2-3 14.9\n2-3-4 17.5\n3-5-7 22.1\n2-4-7 27.5\n2-6-7 28.7\n2-3-8 40.9';
}

document.getElementById("btnRun").addEventListener("click",safeRun);
document.getElementById("btnClear").addEventListener("click",function(){
  document.getElementById("input").value="";
  document.getElementById("out").innerHTML="";
});
document.getElementById("btnSample").addEventListener("click",sample);
</script>

</body>
</html>
