const statusEl = document.getElementById('status');
const spinnerEl = document.getElementById('spinner');
const retryEl = document.getElementById('retry');

function setStatus(text, isError){
  statusEl.textContent = text;
  statusEl.className = isError ? 'status warn' : 'status';
}
function decodePatch(){
  const bin = atob(PATCH_B64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
function integrate(source){
  if(!source || source.length < 100000){
    throw new Error('本体データが短すぎるため、安全のため停止しました。');
  }
  if(source.indexOf('V2.61 OCCUPANCY RESEARCH INTEGRATED PATCH END') < 0){
    throw new Error('V2.61完全統合版を確認できませんでした。');
  }
  if(source.indexOf('V2.62 TECH6') < 0){
    throw new Error('V2.62 TECH6×大谷式を確認できませんでした。');
  }
  if(source.indexOf('V2.63 CHAPPY MISS AUDIT') >= 0) return source;
  const patch = decodePatch();
  const endRe = /<\/body>\s*<\/html>\s*$/i;
  if(endRe.test(source)){
    return source.replace(endRe, patch + '\n</body>\n</html>');
  }
  return source + '\n' + patch;
}
async function fetchSource(){
  let lastError = null;
  for(const url of SOURCE_URLS){
    try{
      setStatus('V2.62本体を読み込んでいます…');
      const res = await fetch(url, {cache:'no-store', mode:'cors'});
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      if(text.length < 100000) throw new Error('取得データ不足');
      return text;
    }catch(err){
      lastError = err;
    }
  }
  throw lastError || new Error('本体を取得できませんでした。');
}
function launch(html){
  try{
    localStorage.setItem(VERSION_KEY, html);
  }catch(e){
    // Safariの保存制限時も、そのまま起動は続行する。
  }
  setStatus('起動します…');
  document.open();
  document.write(html);
  document.close();
}
async function start(forceNetwork){
  retryEl.hidden = true;
  spinnerEl.style.display = 'block';
  try{
    if(!forceNetwork){
      try{
        const cached = localStorage.getItem(VERSION_KEY);
        if(cached && cached.length > 100000){
          setStatus('保存済みのV2.63を起動しています…');
          launch(cached);
          return;
        }
      }catch(e){}
    }
    const source = await fetchSource();
    const integrated = integrate(source);
    launch(integrated);
  }catch(err){
    spinnerEl.style.display = 'none';
    retryEl.hidden = false;
    setStatus(
      '読み込みに失敗しました。\n通信状態を確認して「もう一度読み込む」を押してください。\n\n詳細：' +
      (err && err.message ? err.message : String(err)),
      true
    );
  }
}
retryEl.addEventListener('click', function(){ start(true); });
start(false);
})();
