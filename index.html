<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>チャッピー神予想 V19</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#07101f;color:#fff;padding:16px;margin:0;font-size:18px}
h1{font-size:30px;line-height:1.25}
label{color:#ffd66b;font-weight:bold;font-size:22px;display:block;margin-top:12px}
input,textarea{width:100%;box-sizing:border-box;background:#050912;color:#fff;border:2px solid #33415c;border-radius:14px;padding:14px;font-size:20px;margin:8px 0 18px}
textarea{height:360px;font-family:monospace}
button{width:100%;padding:18px;border:0;border-radius:18px;font-size:24px;font-weight:bold;margin:8px 0}
.main{background:#ffd66b;color:#000}.sub{background:#2d3748;color:#fff}
.box{background:#111b2e;border:2px solid #33415c;border-radius:18px;padding:16px;margin:16px 0}
.result{background:#0b1324;border:3px solid #ffd66b}
pre{white-space:pre-wrap;line-height:1.6;font-size:18px}
.scroll{overflow-x:auto;border:2px solid #ffd66b;border-radius:14px;margin:14px 0}
table{border-collapse:collapse;min-width:1200px;background:#07101f}
td,th{border:1px solid #33415c;padding:8px 12px;text-align:center;white-space:nowrap}
 .rowhead{
 background:#152036;
 color:#ffd66b;
 font-weight:bold;
 position:sticky;
 left:0;

 text-align:left;
 padding-left:0px;

 width:110px;
 min-width:110px;
}
 .rank-red{
 color:#ff4d4d;
 font-weight:bold;
}
</style>
</head>
<body>

<h1>🏇 チャッピー神予想<br>V19 本表方式</h1>

<div class="box">
<label>レース名</label>
<input id="race" placeholder="例：阪神2R">
<label>オッズ入力</label>
<textarea id="odds" placeholder="[TANFUKU]
5 3.7 1.8
2 5.8 3.1

[UMAREN]
5-12 8.5
2-5 12.3

[SANPUKU]
5-12-17 14.7"></textarea>
<button class="main" onclick="analyze()">分析する</button>
<button class="sub" onclick="sample()">サンプル入力</button>
<button class="sub" onclick="clearAll()">クリア</button>
</div>

<div id="out" class="box result">ここに分析結果が出ます。</div>

<script>
function toNum(v){
 return parseFloat(String(v).replace(/[０-９]/g,function(s){return String.fromCharCode(s.charCodeAt(0)-65248)}).replace(/[．]/g,'.').replace(/[^\d.]/g,''));
}

function splitHorses(s){
 return String(s).replace(/－/g,'-').split('-').map(function(x){return x.trim()}).filter(Boolean);
}

function parseData(){
 const text=document.getElementById('odds').value.replace(/－/g,'-');
 const lines=text.split(/\n/).map(function(x){return x.trim()}).filter(Boolean);
 let sec='tanfuku';
 const tan=[],fuku=[],umaren=[],san=[];

 for(const line of lines){
  const u=line.toUpperCase();

  if(u.includes('TANFUKU')||line.includes('単複')){sec='tanfuku';continue}
  if(u.includes('UMAREN')||line.includes('馬連')||line.includes('馬複')){sec='umaren';continue}
  if(u.includes('SANPUKU')||line.includes('三連複')){sec='san';continue}
  if(u.includes('TAN')||line.includes('単勝')){sec='tan';continue}
  if(u.includes('FUKU')||line.includes('複勝')){sec='fuku';continue}

  const p=line.split(/\s+/);

  if(sec==='tanfuku' && p.length>=3){
   tan.push({horse:p[0],odds:toNum(p[1])});
   fuku.push({horse:p[0],odds:toNum(p[2])});
   continue;
  }

  if(p.length<2)continue;
  const odds=toNum(p[1]);
  if(!odds)continue;

  if(sec==='tan')tan.push({horse:p[0],odds:odds});
  if(sec==='fuku')fuku.push({horse:p[0],odds:odds});
  if(sec==='umaren')umaren.push({pair:p[0],odds:odds,hs:splitHorses(p[0])});
  if(sec==='san')san.push({pair:p[0],odds:odds,hs:splitHorses(p[0])});
 }

 tan.sort(function(a,b){return a.odds-b.odds});
 fuku.sort(function(a,b){return a.odds-b.odds});
 umaren.sort(function(a,b){return a.odds-b.odds});
 san.sort(function(a,b){return a.odds-b.odds});

 return {tan:tan,fuku:fuku,umaren:umaren,san:san};
}

function medianHorse(arr){
 if(!arr.length)return '-';
 const n=arr.length;
 if(n%2)return arr[Math.floor(n/2)].horse;
 return arr[n/2-1].horse+'・'+arr[n/2].horse;
}

function medianPair(arr){
 if(!arr.length)return '-';
 const n=arr.length;
 if(n%2)return arr[Math.floor(n/2)].pair;
 return arr[n/2-1].pair+'・'+arr[n/2].pair;
}

function stars(n){
 if(n>=85)return '★★★★★';
 if(n>=70)return '★★★★';
 if(n>=55)return '★★★';
 if(n>=40)return '★★';
 return '★';
}

function heat(n){
 if(n>=5)return '🔥激熱';
 if(n>=4)return '⭕熱';
 if(n>=3)return '△注意';
 return '';
}

function wallList(arr,t){
 const r=[];
 for(let i=0;i<arr.length-1;i++){
  const d=arr[i+1].odds-arr[i].odds;
  if(d>=t){
   r.push((arr[i].horse||arr[i].pair)+'('+arr[i].odds+') → '+(arr[i+1].horse||arr[i+1].pair)+'('+arr[i+1].odds+') 差'+d.toFixed(1));
  }
 }
 return r;
}

function makeUmarenOrder(tan,umaren){
 const axis=tan[0]?tan[0].horse:'';
 const order=[axis];
 const odds=['―'];

 const axisPairs=umaren.filter(function(x){
  return x.hs.includes(axis);
 });

 axisPairs.forEach(function(x){
  const other=x.hs.find(function(h){return h!==axis});
  if(other && !order.includes(other)){
   order.push(other);
   odds.push(x.odds);
  }
 });

 return {order:order,odds:odds};
}

function tableBook(tan,fuku,umaren){
 const u=makeUmarenOrder(tan,umaren);
 const max=Math.max(u.order.length,tan.length,fuku.length);
 let html='<div class="scroll"><table>';

 html+='<tr><td class="rowhead">馬連ランク</td>';
 for(let i=0;i<max;i++){
  html+='<td class="rank-red">'+(u.order[i]||'')+'</td>';
 }
 html+='</tr>';

 html+='<tr><td class="rowhead">馬連オッズ</td>';
 for(let i=0;i<max;i++){
  html+='<td>'+(u.odds[i]||'')+'</td>';
 }
 html+='</tr>';

 html+='<tr><td class="rowhead">単勝ランク</td>';
 for(let i=0;i<max;i++){
  html+='<td class="rank-red">'+(tan[i]?tan[i].horse:'')+'</td>';
 }
 html+='</tr>';

 html+='<tr><td class="rowhead">単勝オッズ</td>';
 for(let i=0;i<max;i++){
  html+='<td>'+(tan[i]?tan[i].odds:'')+'</td>';
 }
 html+='</tr>';

 html+='<tr><td class="rowhead">複勝ランク</td>';
 for(let i=0;i<max;i++){
  html+='<td class="rank-red">'+(fuku[i]?fuku[i].horse:'')+'</td>';
 }
 html+='</tr>';

 html+='<tr><td class="rowhead">複勝オッズ</td>';
 for(let i=0;i<max;i++){
  html+='<td>'+(fuku[i]?fuku[i].odds:'')+'</td>';
 }
 html+='</tr>';

 html+='</table></div>';
 return html;
}

function analyze(){
 const race=document.getElementById('race').value||'レース名未入力';
 const data=parseData();
 const tan=data.tan;
 const fuku=data.fuku;
 const umaren=data.umaren;
 const san=data.san;

 if(!tan.length){
  document.getElementById('out').innerHTML='単勝データがありません。';
  return;
 }

 const axis=tan[0].horse;
 const tan30=tan.filter(function(x){return x.odds<30}).length;
 const tan10=tan.filter(function(x){return x.odds<10}).length;
 const fuku3=fuku.filter(function(x){return x.odds<3}).length;
 const fuku6=fuku.filter(function(x){return x.odds<6}).length;
 const um1=umaren[0]?umaren[0].odds:0;

 let type='中穴';
 let reason=[];
 if(tan[0].odds<=3 && fuku[0] && fuku[0].odds<=1.5){
  type='超1番人気型';
  reason.push('単勝1人気3倍以下＋複勝1.5倍以下');
 }
 const f6i=fuku.findIndex(function(x){return x.odds>=6});
const f15i=fuku.findIndex(function(x){return x.odds>=15});

const f6entry=f6i>=0?fuku[f6i]:null;
const f6entryHorse=f6entry?f6entry.horse:'-';

const f6pre=f6i>=2?fuku.slice(f6i-2,f6i).map(function(x){return x.horse}):[];
const f15pre=f15i>=2?fuku.slice(f15i-2,f15i).map(function(x){return x.horse}):[];
const f15to6=fuku.filter(function(x){return x.odds>=6 && x.odds<15});
const f15to6med=medianHorse(f15to6);
const f6ToFav=[].concat(f6pre,[axis]).filter(function(v,i,a){return v && a.indexOf(v)===i}).join('・');

 const score={};
 function add(h,p){
  if(h && h!=='-')score[h]=(score[h]||0)+p;
 }

 [
  medianHorse(tan),
  medianHorse(tan.filter(function(x){return x.odds<=10})),
  medianHorse(tan.filter(function(x){return x.odds>=10})),
  medianHorse(tan.filter(function(x){return x.odds>=10 && x.odds<=20})),
  medianHorse(tan.filter(function(x){return x.odds<=20})),
  medianHorse(tan.filter(function(x){return x.odds<=99})),
  medianHorse(tan.filter(function(x){return x.odds>=100})),
  medianHorse(fuku),
  medianHorse(fuku.filter(function(x){return x.odds<6})),
  medianHorse(fuku.filter(function(x){return x.odds<=12})),
  f15to6med
 ].join('・').split('・').forEach(function(h){add(h,1)});

 f6pre.forEach(function(h){add(h,1)});
 f15pre.forEach(function(h){add(h,1)});
if(f6entryHorse && f6entryHorse!=='-'){
 add(f6entryHorse,1);
}
 const ranking=Object.entries(score).sort(function(a,b){return b[1]-a[1]});
 const tansho=ranking.filter(function(x){return x[1]>=3}).map(function(x){return x[0]});

 const tan20=tan.filter(function(x){return x.odds<=20});
 let border='-';
 if(tan20.length>=2){
  const n=tan20.length;
  border=n%2===0?tan20[n/2-1].horse+'・'+tan20[n/2].horse:tan20[Math.floor(n/2)].horse;
 }

 let arere=30;
 if(um1>=9)arere+=25;
 if(tan30>=10)arere+=25;
 if(fuku6<=6)arere+=15;
 if(tan10>=6)arere+=10;
 if(arere>100)arere=100;

 const axisA=medianHorse(tan.filter(function(x){return x.odds<=10}));
const axisB=f6ToFav;
const targetA=medianHorse(tan.filter(function(x){return x.odds<=99}));
const targetB=border;

const buyPairs=[];

function addBuyPair(a,b){
 if(!a||!b||a==='-'||b==='-'||a===b)return;
 const p=a+'-'+b;
 if(!buyPairs.includes(p))buyPairs.push(p);
}

axisA.split('・').forEach(function(a){
 targetA.split('・').forEach(function(b){addBuyPair(a,b)});
 targetB.split('・').forEach(function(b){addBuyPair(a,b)});
});

axisB.split('・').forEach(function(a){
 targetA.split('・').forEach(function(b){addBuyPair(a,b)});
 targetB.split('・').forEach(function(b){addBuyPair(a,b)});
});

 document.getElementById('out').innerHTML=
 tableBook(tan,fuku,umaren)+
 '<pre>'+
'\n━━━━━━━━━━━━━━\n'+
race+
'\n━━━━━━━━━━━━━━\n\n'+
'【レース判定】\n'+
type+'\n'+
'理由：'+reason.join(' / ')+'\n'+
'荒れ度：'+arere+'点 '+stars(arere)+'\n'+
'馬連1人気：'+(um1||'-')+'倍\n'+
'単勝30倍未満：'+tan30+'頭\n'+
'単勝10倍未満：'+tan10+'頭\n'+
'複勝3倍未満：'+fuku3+'頭\n'+
'複勝6倍未満：'+fuku6+'頭\n\n'+
'【単勝案件】\n'+
(tansho.length?tansho.join('・'):'なし')+'\n\n'+
'重複ランキング：\n'+
(ranking.map(function(x,i){return (i+1)+'位 '+x[0]+'：'+x[1]+'回 '+heat(x[1])}).join('\n')||'なし')+'\n\n'+
'【メジアン】\n'+
'単勝全体：'+medianHorse(tan)+'\n'+
'単勝10倍以内：'+medianHorse(tan.filter(function(x){return x.odds<=10}))+'\n'+
'単勝10倍以上：'+medianHorse(tan.filter(function(x){return x.odds>=10}))+'\n'+
'単勝10〜20倍：'+medianHorse(tan.filter(function(x){return x.odds>=10 && x.odds<=20}))+'\n'+
'単勝20倍以内：'+medianHorse(tan.filter(function(x){return x.odds<=20}))+'\n'+
'単勝99倍以内：'+medianHorse(tan.filter(function(x){return x.odds<=99}))+'\n'+
'単勝100倍以上：'+medianHorse(tan.filter(function(x){return x.odds>=100}))+'\n\n'+
'複勝全体：'+medianHorse(fuku)+'\n'+
'複勝6倍未満：'+medianHorse(fuku.filter(function(x){return x.odds<6}))+'\n'+
'複勝12倍以内：'+medianHorse(fuku.filter(function(x){return x.odds<=12}))+'\n\n'+
'馬連メジアン：'+medianPair(umaren)+'\n'+
'三連複メジアン：'+medianPair(san)+'\n\n'+
'【境目ペア警告】\n'+
'単勝20倍以内中央：'+border+'\n'+
'※このペアの1-2着、2-3着に注意\n\n'+
'【複勝壁】\n'+
'複勝6倍壁前2頭：'+(f6pre.join('・')||'なし')+'\n'+
'複勝15倍壁前2頭：'+(f15pre.join('・')||'なし')+'\n'+
'6倍以上入口馬：'+f6entryHorse+'\n'+
'15壁→6倍以上メジアン：'+f15to6med+'\n'+
'6倍壁前2頭→1人気：'+(f6ToFav||'なし')+'\n\n'+
'【壁】\n'+
'単勝壁：\n'+(wallList(tan,8).join('\n')||'なし')+'\n\n'+
'馬連壁：\n'+(wallList(umaren,8).join('\n')||'なし')+'\n\n'+
'【10倍未満6頭警報】\n'+
(tan10>=6?'発動：7人気・8人気も注意':'なし')+'\n\n'+
'【チャッピー推奨】\n'+
'軸① 単勝10倍以内メジアン：'+axisA+'\n'+
'軸② 複勝6倍壁前2頭→1人気：'+axisB+'\n'+
'相手① 単勝99倍以内メジアン：'+targetA+'\n'+
'相手② 境目ペア：'+targetB+'\n\n'+
'【推奨 馬連】\n'+
(buyPairs.join(' / ')||'-')+'\n\n'+
'【推奨 ワイド】\n'+
(buyPairs.join(' / ')||'-')+
'</pre>';
}

function sample(){
document.getElementById('race').value='本表方式テスト';
document.getElementById('odds').value='[TANFUKU]\n5 3.7 1.8\n2 5.8 3.1\n12 5.9 2.3\n17 8.5 3.3\n9 9.6 5.3\n8 12.5 3.8\n10 13.7 4.9\n\n[UMAREN]\n5-12 8.5\n5-17 11.2\n2-5 12.3\n5-10 18.2\n5-9 19.8\n5-8 19.9\n5-7 23.5\n\n[SANPUKU]\n5-12-17 14.7\n2-5-12 21.1\n2-5-17 28.0';
analyze();
}

function clearAll(){
 document.getElementById('race').value='';
 document.getElementById('odds').value='';
 document.getElementById('out').innerHTML='ここに分析結果が出ます。';
}
</script>
</body>
</html>
