<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>チャッピー神予想 オートV22.2</title>
<style>
body{margin:0;background:#07101f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;padding:14px}
h1{font-size:30px;color:#ffd84d}
textarea{width:100%;height:310px;font-size:17px;border-radius:16px;padding:12px;box-sizing:border-box}
button{font-size:24px;font-weight:800;border:0;border-radius:16px;padding:14px 22px;margin:10px 6px 14px 0}
.go{background:#2f80ff;color:#fff}.clear{background:#6b7280;color:#fff}
.card{background:#101a2b;border-radius:18px;padding:16px;margin:14px 0;border:1px solid #1e3a5f}
.title{font-size:25px;font-weight:900;margin-bottom:10px}
.big{font-size:38px;font-weight:900;color:#22c55e}
.red{color:#fb7185}.blue{color:#60a5fa}.yellow{color:#facc15}.orange{color:#fb923c}
.badge{display:inline-block;padding:5px 10px;border-radius:9px;font-weight:900;margin:2px;background:#123b7a}
.s{background:#0057ff}.a{background:#f97316}.b{background:#ca8a04}.c{background:#166534}.d{background:#374151}
table{width:100%;border-collapse:collapse;font-size:16px}
td,th{border-bottom:1px solid #334155;padding:7px;text-align:left}
.num{display:inline-block;min-width:25px;text-align:center;border-radius:4px;padding:2px 4px;font-weight:900}
.n1{background:#eee;color:#111}.n2{background:#111;color:#fff}.n3{background:#c91d1d}.n4{background:#1d5fd1}.n5{background:#facc15;color:#111}.n6{background:#2f8f2f}.n7{background:#d86b1d}.n8{background:#e052c9}.n9{background:#c044c8}.n10{background:#d946ef}
.small{font-size:14px;color:#cbd5e1}
hr{border:0;border-top:1px solid #334155}
</style>
</head>
<body>
<h1>🏍️ チャッピー神予想 オートV22.2</h1>

<textarea id="inp" placeholder="例：浜松7R

[TAN]
1 1.9
4 2.6

[NISHA]
4-5 4.9
4-7 5.4

[SANREN]
4-5-7 3.8"></textarea>

<button class="go" onclick="run()">解析</button>
<button class="clear" onclick="inp.value='';out.innerHTML=''">リセット</button>

<div id="out"></div>

<script>
function n(x){return `<span class="num n${x}">${x}</span>`}
function pair(s){return s.split('-').map(Number)}
function med(arr){if(!arr.length)return [];let m=Math.floor((arr.length-1)/2);return arr.length%2?[arr[m]]:[arr[m],arr[m+1]]}
function rankLabel(p){
 if(p>=70)return ['S','s','勝負'];
 if(p>=50)return ['A','a','狙い'];
 if(p>=30)return ['B','b','注意'];
 return ['D','d','様子見'];
}
function parse(){
 let txt=inp.value.replace(/[－ー]/g,'-');
 let sec='',tan=[],nisha=[],san=[];
 txt.split(/\n/).forEach(l=>{
  l=l.trim(); if(!l)return;
  if(/\[TAN\]/i.test(l)){sec='tan';return}
  if(/\[NISHA\]/i.test(l)){sec='nisha';return}
  if(/\[SANREN\]/i.test(l)){sec='san';return}
  let a=l.split(/\s+/);
  if(sec==='tan'&&a.length>=2)tan.push({car:+a[0],od:+a[1]});
  if(sec==='nisha'&&a.length>=2)nisha.push({cars:pair(a[0]),od:+a[1],key:a[0]});
  if(sec==='san'&&a.length>=2)san.push({cars:pair(a[0]),od:+a[1],key:a[0]});
 });
 tan.sort((a,b)=>a.od-b.od); nisha.sort((a,b)=>a.od-b.od); san.sort((a,b)=>a.od-b.od);
 return {tan,nisha,san};
}
function posList(car,list){let r=[];list.forEach((x,i)=>{if(x.cars.includes(car))r.push(i+1)});return r}
 // ===== オート専用：連王ランプ =====
function autoRenOh(tan,nisha,san){
 let score={};
 function add(c,pt){
  if(!score[c])score[c]=0;
  score[c]+=pt;
 }

 nisha.forEach((x,i)=>{
  let pt=i<5?3:i<10?2:1;
  x.cars.forEach(c=>add(c,pt));
 });

 san.forEach((x,i)=>{
  let pt=i<6?4:i<12?2:1;
  x.cars.forEach(c=>add(c,pt));
 });

 return Object.entries(score)
  .map(([c,pt])=>({c:+c,pt}))
  .sort((a,b)=>b.pt-a.pt);
}

function autoRenOhTickets(renOh){
 let cars=renOh.slice(0,4).map(x=>x.c);
 if(cars.length<3)return [];
 let king=cars[0], aite=cars[1], ana=cars[2];
 return [
  `${aite}-${king}-${ana}`,
  `${king}-${aite}-${ana}`,
  `${aite}-${ana}-${king}`,
  `${king}-${ana}-${aite}`
 ];
}
function run(){
 let {tan,nisha,san}=parse();
 let cars=[...new Set(tan.map(x=>x.car))];
 if(!tan.length){out.innerHTML='<div class=card>入力がありません</div>';return}
 let p={}; cars.forEach(c=>p[c]=0);

 // 基本指数
 tan.forEach((x,i)=>{ if(i<3)p[x.car]+=20; if(i<5)p[x.car]+=10; if(x.od<30)p[x.car]+=8; });
 nisha.forEach((x,i)=>{ if(i<5)x.cars.forEach(c=>p[c]+=12); if(i<10)x.cars.forEach(c=>p[c]+=6); });
 san.forEach((x,i)=>{ if(i<5)x.cars.forEach(c=>p[c]+=10); if(i<10)x.cars.forEach(c=>p[c]+=5); });

 // 壁前・区間メジアン
 let tanOdds=tan.map(x=>x.od), wallTan=[10,20,30,50];
 tan.forEach((x,i)=>{
  if(wallTan.some(w=>x.od<w && (tan[i+1]&&tan[i+1].od>=w)))p[x.car]+=15;
 });
 [[0,10],[10,20],[20,50],[50,999]].forEach(([a,b])=>{
  med(tan.filter(x=>x.od>=a&&x.od<b).map(x=>x.car)).forEach(c=>p[c]+=10);
 });

 let nishaOdds=nisha.map(x=>x.od);
 nisha.forEach((x,i)=>{
  if([10,20,50].some(w=>x.od<w && (nisha[i+1]&&nisha[i+1].od>=w)))x.cars.forEach(c=>p[c]+=10);
 });

 // 激走注意
 let gekiso=[];
 cars.forEach(c=>{
  let to=tan.find(x=>x.car===c)?.od||999;
  let np=posList(c,nisha), sp=posList(c,san);
  let cond=[];
  if(to>=20)cond.push(`単勝${to}倍`);
  if(np.some(v=>v<=15))cond.push('2車複上位15位内');
  if(sp.some(v=>v<=8))cond.push('3連系上位8位内');
  if(cond.length>=2){gekiso.push({c,cond}); p[c]+=15}
 });

 let sorted=cars.map(c=>({c,p:p[c]})).sort((a,b)=>b.p-a.p);
 let tan1=tan[0].car;
 let nIn=posList(tan1,nisha), sIn=posList(tan1,san);
 let shihai = (!nIn.length&&!sIn.length) ? 'D：飛び警戒' : (nIn[0]===1&&sIn[0]===1?'A：支配型':'B：半支配型');

 let html='';
 let renOh=autoRenOh(tan,nisha,san);
let renTickets=autoRenOhTickets(renOh);

html+=`<div class=card><div class=title>🏍️ オート専用：連王ランプ</div>`;
renOh.slice(0,5).forEach((r,i)=>{
 let mark=i===0?'👑連王':i===1?'⚔️相手王':i===2?'🔥穴候補':'注意';
 html+=`<div>${mark}：${n(r.c)} <span class=big>${r.pt}点</span></div><hr>`;
});
html+=`<div class=title>🎯 連王3連単候補</div>`;
renTickets.forEach(t=>html+=`<div class=big>${t}</div>`);
html+=`</div>`;
 html+=`<div class=card><div class=title>🏆 単勝1人気支配率</div>
 単勝1人気：${n(tan1)}（${tan[0].od}倍）<br>
 2車複：${nIn.length?nIn[0]+'位':'圏外'}<br>
 3連系：${sIn.length?sIn[0]+'位':'圏外'}<br>
 <div class="big red">${shihai}</div></div>`;

 html+=`<div class=card><div class=title>🔥 勝負ランプ</div>`;
 sorted.forEach(x=>{
  let [r,cls,txt]=rankLabel(x.p);
  html+=`<div>${n(x.c)} <span class=big>${x.p}点</span> <span class="badge ${cls}">${r}：${txt}</span></div><hr>`;
 });
 html+=`</div>`;

 html+=`<div class=card><div class=title>🚨 激走注意ランプ</div>`;
 if(!gekiso.length)html+='該当なし';
 gekiso.forEach(g=>html+=`<div>${n(g.c)} <span class="badge a">激走注意</span><br><span class=small>${g.cond.join(' / ')}</span></div><hr>`);
 html+=`</div>`;

 html+=`<div class=card><div class=title>📊 オッズ一覧</div>
 <table><tr><th>単勝</th><th>2車複</th><th>3連系</th></tr><tr><td>`;
 tan.forEach((x,i)=>html+=`${i+1}. ${n(x.car)} ${x.od}<br>`);
 html+=`</td><td>`;
 nisha.slice(0,15).forEach((x,i)=>html+=`${i+1}. ${x.cars.map(n).join('-')} ${x.od}<br>`);
 html+=`</td><td>`;
 san.slice(0,15).forEach((x,i)=>html+=`${i+1}. ${x.cars.map(n).join('-')} ${x.od}<br>`);
 html+=`</td></tr></table></div>`;

 let main=sorted.slice(0,2).map(x=>x.c);
 let ana=gekiso.map(x=>x.c).filter(c=>!main.includes(c));
 html+=`<div class=card><div class=title>🎯 チャッピー推奨</div>
 <div class=big>本命：${main.map(n).join('・')}</div>
 <div class="big yellow">穴警戒：${ana.length?ana.map(n).join('・'):'なし'}</div>
 <br>2車複：${main.length>=2?nisha.filter(x=>main.every(c=>x.cars.includes(c))).map(x=>x.key).join(' / ')||main.join('-'):''}
 <br>3連系：${san.slice(0,8).map(x=>x.key).join(' / ')}
 </div>`;

 out.innerHTML=html;
}
</script>
</body>
</html>
