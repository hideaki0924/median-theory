<script>
var latestCopyText="";
function zenToHan(str){return String(str).replace(/[０-９]/g,function(s){return String.fromCharCode(s.charCodeAt(0)-65248);}).replace(/．/g,'.').replace(/[－ー―−]/g,'-').replace(/[　]/g,' ').replace(/[〜～]/g,'-');}
function nums(line){var m=zenToHan(line).match(/\d+(?:\.\d+)?/g);return m?m.map(Number):[];}
function pairKey(a,b){return [a,b].map(String).sort(function(x,y){return Number(x)-Number(y);}).join('-');}

function uniq(arr){var s={},out=[];for(var i=0;i<arr.length;i++){var v=String(arr[i]);if(v&&v!=="undefined"&&!s[v]){s[v]=true;out.push(v);}}return out;}
function sortOdds(arr){return arr.slice().sort(function(a,b){return Number(a.od)-Number(b.od);});}
function joinC(arr){return (!arr||!arr.length)?"なし":arr.map(function(x){return x+"号車";}).join("・");}
function mid(arr){arr=arr||[];if(!arr.length)return[];if(arr.length===1)return[arr[0]];var n=arr.length;return n%2?[arr[Math.floor(n/2)]]:[arr[n/2-1],arr[n/2]];}
function add(arr,v){if(v&&arr.indexOf(v)<0)arr.push(v);}
function getTan(data,h){h=String(h);for(var i=0;i<data.tansho.length;i++)if(data.tansho[i].h===h)return data.tansho[i];return null;}
function findPair(arr,a,b){var k=pairKey(a,b);for(var i=0;i<arr.length;i++)if(arr[i].key===k)return arr[i];return null;}
function findTri(arr,a,b,c){var k=triKey(a,b,c);for(var i=0;i<arr.length;i++)if(arr[i].key===k)return arr[i];return null;}
function countAppearTop(list,h,n){h=String(h);var c=0;(list||[]).slice(0,n||20).forEach(function(x){if(x.a===h||x.b===h||x.c===h)c++;});return c;}
function collectAllHorses(data){var out=[];function ah(h){if(h!==undefined&&h!==null)add(out,String(h));}data.tansho.forEach(function(x){ah(x.h)});data.nisha.forEach(function(x){ah(x.a);ah(x.b)});data.wide.forEach(function(x){ah(x.a);ah(x.b)});data.sanren.forEach(function(x){ah(x.a);ah(x.b);ah(x.c)});Object.keys(data.handi||{}).forEach(ah);return out.sort(function(a,b){return Number(a)-Number(b);});}
function knownTanOdds(data,h){var t=getTan(data,h);if(!t)return null;var od=Number(t.od);return (isFinite(od)&&od>0)?od:null;}
function safeTanSortVal(x){var n=Number(x.tan);return (!isFinite(n)||n<=0)?9999:n;}

function parseData(raw){
  var text=zenToHan(raw),lines=text.split(/\n/),title="レース",sec="";
  var tansho=[],nisha=[],wide=[],sanren=[],handi={};
  for(var i=0;i<lines.length;i++){
    var line=lines[i].trim(); if(!line)continue; if(line.indexOf("【")===0)title=line;
    var up=line.toUpperCase();
    if(up.indexOf("[")===0){
      if(up.indexOf("HAND")>=0||up.indexOf("ハンデ")>=0||up.indexOf("試走")>=0){sec="HANDI";continue;}
      if(up.indexOf("TAN")>=0||up.indexOf("単")>=0){sec="TANSHO";continue;}
      if(up.indexOf("WIDE")>=0||up.indexOf("ワイド")>=0){sec="WIDE";continue;}
      if(up.indexOf("SAN")>=0||up.indexOf("3")>=0||up.indexOf("三")>=0){sec="SANREN";continue;}
      if(up.indexOf("NISHA")>=0||up.indexOf("NIREN")>=0||up.indexOf("2")>=0||up.indexOf("馬")>=0){sec="NISHA";continue;}
    }
    if(sec==="TANSHO"){var n=nums(line);if(n.length>=2)tansho.push({h:String(Math.floor(n[0])),od:n[n.length-1]});}
    if(sec==="NISHA"){var m=line.match(/(\d+)\s*-\s*(\d+)/),o=nums(line);if(m&&o.length)nisha.push({a:m[1],b:m[2],od:o[o.length-1],key:pairKey(m[1],m[2])});}
    if(sec==="WIDE"){var mw=line.match(/(\d+)\s*-\s*(\d+)/),ow=nums(line);if(mw&&ow.length)wide.push({a:mw[1],b:mw[2],od:ow[ow.length-1],key:pairKey(mw[1],mw[2])});}
    if(sec==="SANREN"){var ms=line.match(/(\d+)\s*-\s*(\d+)\s*-\s*(\d+)/),os=nums(line);if(ms&&os.length)sanren.push({a:ms[1],b:ms[2],c:ms[3],od:os[os.length-1],key:triKey(ms[1],ms[2],ms[3])});}
    if(sec==="HANDI"){
      var hn=nums(line); if(hn.length>=2){handi[String(Math.floor(hn[0]))]={h:String(Math.floor(hn[0])),handi:Number(hn[1]),trial:hn[2]||null,st:hn[3]||null};}
    }
  }
  return{title:title,tansho:tansho,nisha:nisha,wide:wide,sanren:sanren,handi:handi};
}

function rankRowFromPairs(pairs){var row=[];sortOdds(pairs).forEach(function(p){add(row,p.a);add(row,p.b);});return row;}
function rankRowFromTris(tris){var row=[];sortOdds(tris).forEach(function(t){add(row,t.a);add(row,t.b);add(row,t.c);});return row;}
function pseudoFromAnchor(list,anchor){var arr=sortOdds(list).filter(function(p){return p.a===anchor||p.b===anchor;});var row=[];arr.forEach(function(p){add(row,p.a===anchor?p.b:p.a);});return{anchor:anchor,row:row,pairs:arr};}
function pseudoWideCount(wide,topN){var map={},arr=sortOdds(wide).slice(0,topN||10);arr.forEach(function(p){[p.a,p.b].forEach(function(h){if(!map[h])map[h]={h:h,count:0,best:999};map[h].count++;map[h].best=Math.min(map[h].best,Number(p.od));});});var out=[];for(var k in map)out.push(map[k]);out.sort(function(a,b){return b.count!==a.count?b.count-a.count:a.best-b.best;});return out;}
function wallInfoFromOdds(odds){var walls=[],semis=[];for(var i=0;i<odds.length-1;i++){var now=Number(odds[i]),next=Number(odds[i+1]);if(!now||!next)continue;var ratio=next/now,diff=next-now;if(ratio>=1.8)walls.push({pos:i,ratio:ratio,diff:diff});else if(ratio>=1.55)semis.push({pos:i,ratio:ratio,diff:diff});}return{walls:walls,semis:semis};}
function wallPosList(info,type){return (type==="semi"?info.semis:info.walls).map(function(x){return x.pos;});}
function makeAnchorPairRow(pairs,anchor){var p=pseudoFromAnchor(pairs,anchor);return{anchor:anchor,row:p.row,pairs:p.pairs,odds:p.pairs.map(function(x){return Number(x.od);})};}
function makeWallZones(rowObj){var row=rowObj.row||[],pairs=rowObj.pairs||[],odds=rowObj.odds||[],info=wallInfoFromOdds(odds),w=wallPosList(info,"wall"),zones=[],start=0;for(var i=0;i<=w.length;i++){var end=i<w.length?w[i]+1:row.length;zones.push({idx:i,label:i===0?'本線':i===1?'第1壁後':i===2?'第2壁後':'切り',horses:row.slice(start,end),pairs:pairs.slice(start,end)});start=end;}return{zones:zones,info:info,row:row,odds:odds,pairs:pairs,anchor:rowObj.anchor};}
function zoneIndexOf(zones,h){for(var i=0;i<zones.length;i++)if(zones[i].horses.indexOf(String(h))>=0)return i;return -1;}
function fmtWallDetails(rowObj){var info=rowObj.info||{walls:[],semis:[]},row=rowObj.row||[],odds=rowObj.odds||[],lines=[];function one(w,mark){lines.push(mark+' '+row[w.pos]+'→'+row[w.pos+1]+' / '+odds[w.pos]+'→'+odds[w.pos+1]+' / 倍率'+w.ratio.toFixed(2));}info.walls.forEach(function(w){one(w,'🔥壁')});info.semis.forEach(function(w){one(w,'⚠️準壁')});return lines.length?lines.join('\n'):'壁なし';}

function detectTateAndNoFav(data,ctx){var out={tate:null,tateRatio:null,tatePair:null,noFavSan:null,noFavRank:null,red:false};var fav=ctx.fav1,nr=ctx.nishaRank;if(fav&&nr.length>=2){var fp=[];for(var i=0;i<nr.length;i++){if(nr[i].a===fav||nr[i].b===fav)fp.push(nr[i]);if(fp.length>=2)break;}if(fp.length>=2){var o1=fp[0].a===fav?fp[0].b:fp[0].a,o2=fp[1].a===fav?fp[1].b:fp[1].a,tp=findPair(data.nisha,o1,o2);out.tate=[o1,o2];out.tatePair=tp;if(tp&&nr[0])out.tateRatio=Number(tp.od)/Number(nr[0].od);}}for(var s=0;s<ctx.sanRank.length;s++){var t=ctx.sanRank[s],hs=[t.a,t.b,t.c];if(hs.indexOf(fav)<0){out.noFavSan=t;out.noFavRank=s+1;break;}}var favObj=ctx.tanRank[0];if(favObj&&Number(favObj.od)<=1.2&&out.tateRatio&&out.tateRatio<4&&out.noFavSan&&out.noFavRank<=6&&Number(out.noFavSan.od)<=15)out.red=true;return out;}
function makeAreDiag(data,ctx){var n1=ctx.nishaRank[0]?Number(ctx.nishaRank[0].od):null;var surface=n1===null?'判定不可':n1<4?'本命戦':n1<9?'中荒れ戦':n1<15?'荒れ戦':'大荒れ戦';var favObj=ctx.tanRank[0],favOd=favObj?Number(favObj.od):null;var fav2Obj=ctx.tanRank[1],fav2Od=fav2Obj?Number(fav2Obj.od):null;var t=ctx.tate||{},noFav=t.noFavSan,noFavRank=t.noFavRank||999,noFavOd=noFav?Number(noFav.od):999,tateRatio=t.tateRatio||null;var risk=0,grounds=[];if(n1>=4&&n1<9){risk++;grounds.push('2車複1人気が4倍以上');}else if(n1>=9&&n1<15){risk+=2;grounds.push('2車複1人気が9倍以上');}else if(n1>=15){risk+=3;grounds.push('2車複1人気が15倍以上');}if(favOd!==null&&favOd<=1.2){risk+=2;grounds.push('単勝1人気が1.2倍以下で過剰人気');}else if(favOd!==null&&favOd<=1.7){risk++;grounds.push('単勝1人気が1.7倍以下');}if(tateRatio!==null){if(tateRatio<3){risk+=2;grounds.push('タテ目倍率3倍未満');}else if(tateRatio<4){risk++;grounds.push('タテ目倍率4倍未満');}else if(tateRatio>=7)grounds.push('タテ目倍率が高く二強残し寄り');}if(noFav){if(noFavRank<=3&&noFavOd<=15){risk+=3;grounds.push('本命なし3連系が3位以内かつ15倍以内');}else if(noFavRank<=6&&noFavOd<=15){risk+=2;grounds.push('本命なし3連系が6位以内かつ15倍以内');}else if(noFavRank<=6){risk++;grounds.push('本命なし3連系が6位以内');}else grounds.push('本命なし3連系は下位寄り');}var first=(ctx.baseZones.zones[1]&&ctx.baseZones.zones[1].horses)||[],second=(ctx.baseZones.zones[2]&&ctx.baseZones.zones[2].horses)||[];if(first.length>=2){risk++;grounds.push('第1壁後に複数車');}if(second.length>=1){risk++;grounds.push('第2壁後が存在');}

function renderTan100Card(ctx){var items=ctx.tan100||[],html='<div class="card tan100"><div class="title">💴単勝100円保険</div>';if(!items.length)return html+'該当なし</div>';items.forEach(function(x,i){html+='<div class="rankLine"><span class="badge">'+(i+1)+'位 '+x.h+'号車</span> <span class="yellow">'+x.label+'</span> <span class="small">単'+x.tan+' / 指数'+x.score+' '+x.reasons.join('・')+'</span></div>';});return html+'</div>';}
function renderBigHoleCard(ctx){var b=ctx.bigHole,html='<div class="card '+(b.on?'bigHole':'card')+'"><div class="title">🚨大穴スイッチ：重ハンデ後ろ組浮上</div>';if(!b.on){html+='<span class="small">今回は強い点灯なし。後ろ組の連系浮上が足りません。</span>';return html+'</div>';}html+='判定：<span class="red">'+b.level+'</span> / スコア <span class="yellow">'+b.score+'</span><br>';html+='後ろ組候補：<span class="yellow">'+joinC(b.back)+'</span><br>';html+='注目後ろ組：<br>';b.backScores.forEach(function(x,i){html+='<div class="rankLine"><span class="badge">'+(i+1)+'位 '+x.h+'号車</span> <span class="small">単'+x.tan+' / 大穴指数'+Math.round(x.score)+' / 基礎'+x.base+'</span></div>';});html+='<hr><pre>'+b.grounds.join('\n')+'</pre><span class="small">買い目反映：後ろ組2頭＋本命、後ろ組3頭BOX、最大後ろ候補の1着固定を薄く追加。</span>';return html+'</div>';}
function renderHidden(ctx){if(!ctx.hiddenFloaters||!ctx.hiddenFloaters.length)return'';var html='<div class="card lamp"><div class="title">🫥単勝未表示・連系浮上3着救済</div>';ctx.hiddenFloaters.forEach(function(x,i){html+='<div class="rankLine"><span class="badge">'+(i+1)+'位 '+x.h+'号車</span> <span class="small">2複'+x.nisha+' / ワイド'+x.wide+' / 3連系'+x.san+(x.bestTri?' / 注目 '+x.bestRank+'位 '+x.bestTri.key+' '+x.bestTri.od+'倍':'')+'</span></div>';});return html+'</div>';}
function makePseudoPairsText(p){if(!p||!p.pairs||!p.pairs.length)return'なし';return p.pairs.slice(0,8).map(function(x){return p.anchor+'-'+(x.a===p.anchor?x.b:x.a)+' '+x.od}).join('\n');}
function makeCopyText(title,ctx,scored,tickets,lamps){var t=title+'\nオート擬似複勝テスト版 V24.10 大穴スイッチ搭載版\n発動：'+lamps.join(' / ')+'\n\n';t+='🩺オート荒れ診断\n表面：'+ctx.areDiag.surface+'\n裏診断：'+ctx.areDiag.back+'\n荒れ警戒スコア：'+ctx.areDiag.risk+'\n';if(ctx.areDiag.tateRatio!==null)t+='タテ目倍率：'+ctx.areDiag.tateRatio.toFixed(2)+'\n';if(ctx.areDiag.noFav)t+='本命なし3連系：'+ctx.areDiag.noFavRank+'位 '+ctx.areDiag.noFav.key+' '+ctx.areDiag.noFav.od+'倍\n';t+='\n🚨大穴スイッチ\n判定：'+(ctx.bigHole.on?ctx.bigHole.level:'なし')+' / スコア '+ctx.bigHole.score+'\n後ろ組候補：'+joinC(ctx.bigHole.back)+'\n注目後ろ組：'+ctx.bigHole.backScores.map(function(x){return x.h+'号車 単'+x.tan}).join('・')+'\n\n';var z=ctx.baseZones.zones||[];t+='2複基準壁ゾーン\n基準：'+ctx.fav1+'号車\n';for(var i=0;i<Math.min(4,z.length);i++)t+=z[i].label+'：'+joinC(z[i].horses)+'\n';t+='壁：\n'+fmtWallDetails(ctx.baseZones)+'\n\n';t+='擬似複勝A：単勝1人気 '+ctx.fav1+'号車から\n'+joinC(ctx.pseudoA.row)+'\n擬似複勝Aメジアン：'+joinC(ctx.pseudoAM)+'\n';t+='擬似複勝B：単勝2人気 '+ctx.fav2+'号車から\n'+joinC(ctx.pseudoB.row)+'\n擬似複勝Bメジアン：'+joinC(ctx.pseudoBM)+'\n';t+='擬似複勝C：ワイド出現回数\n'+joinC(ctx.pseudoCRow)+'\n擬似複勝Cメジアン：'+joinC(ctx.pseudoCM)+'\n\n';t+='メジアン\n単勝：'+joinC(ctx.tanM)+'\n2車複：'+joinC(ctx.nishaM)+'\nワイド：'+joinC(ctx.wideM)+'\n3連系：'+joinC(ctx.sanM)+'\n\n';if(ctx.tan100.length){t+='単勝100円保険\n'+ctx.tan100.map(function(x){return x.h+'号車 単'+x.tan+' '+x.label}).join('\n')+'\n\n';}if(ctx.hiddenFloaters.length){t+='単勝未表示・連系浮上3着救済\n'+ctx.hiddenFloaters.map(function(x){return x.h+'号車 '+(x.bestTri?x.bestRank+'位 '+x.bestTri.key+' '+x.bestTri.od+'倍':'連系浮上')}).join('\n')+'\n\n';}t+='検証候補\n';scored.slice(0,5).forEach(function(x,i){t+=(i+1)+'位 '+x.h+'号車【'+x.score+'】 単'+x.tan+' '+x.reasons.join('・')+'\n';});t+='\nテスト買い目候補\nワイド\n'+tickets.wide.join('\n')+'\n\n2車複\n'+tickets.nisha.join('\n')+'\n\n3連系・本線\n'+tickets.sanMain.join('\n')+'\n\n3連系・穴本線\n'+tickets.sanHole.join('\n')+'\n\n3連系・大荒れ保険\n'+tickets.sanBomb.join('\n')+'\n\n3連系・大穴スイッチ\n'+(tickets.sanBig.length?tickets.sanBig.join('\n'):'なし')+'\n\n単勝100円保険\n'+(ctx.tan100.length?ctx.tan100.map(function(x){return x.h+' 単'+x.tan}).join('\n'):'なし')+'\n';return t;}

function run(){try{var data=parseData(document.getElementById('input').value),out=document.getElementById('out');if(!data.tansho.length||!data.wide.length){out.innerHTML='<div class="card"><div class="title warn">入力不足</div>[TANSHO] と [WIDE] が必要です。</div>';return;}var ctx=makeContext(data),scored=scoreAll(data,ctx);ctx.hiddenFloaters=detectHiddenFloaters(data,ctx,scored);ctx.tan100=detectTan100Insurance(data,ctx,scored);ctx.bigHole=detectBackBigHoleSwitch(data,ctx,scored);var tickets=makeTickets(data,ctx,scored);var lamps=[];lamps.push('🧪オート擬似複勝テスト：A='+joinC(ctx.pseudoAM)+' / B='+joinC(ctx.pseudoBM)+' / C='+joinC(ctx.pseudoCM));var overlapA=ctx.tanM.filter(function(h){return ctx.pseudoAM.indexOf(h)>=0});if(overlapA.length)lamps.push('🔥単勝×擬似複勝Aメジアン重複：'+joinC(overlapA));var overlapW=ctx.wideM.filter(function(h){return ctx.pseudoAM.indexOf(h)>=0||ctx.pseudoBM.indexOf(h)>=0});if(overlapW.length)lamps.push('🟣ワイド×擬似複勝メジアン重複：'+joinC(overlapW));if(ctx.baseZones.zones.length>1)lamps.push('🧱2複基準壁ゾーン：本線 '+joinC(ctx.baseZones.zones[0].horses)+' / 第1壁後 '+joinC(ctx.baseZones.zones[1].horses)+' / 第2壁後 '+joinC(ctx.baseZones.zones[2]?ctx.baseZones.zones[2].horses:[]));if(ctx.bigHole.on)lamps.push('🚨大穴スイッチ：重ハンデ後ろ組浮上 '+ctx.bigHole.level+' / '+joinC(ctx.bigHole.backScores.slice(0,3).map(function(x){return x.h})));if(scored[0]&&scored[0].score>=30)lamps.push('🚨擬似複勝テスト強反応：'+scored[0].h+'号車【'+scored[0].score+'】');if(ctx.tan100.length)lamps.push('💴単勝100円保険：'+ctx.tan100.map(function(x){return x.h+'号車 単'+x.tan}).join('・'));if(ctx.hiddenFloaters.length)lamps.push('🫥単勝未表示・連系浮上3着救済：'+ctx.hiddenFloaters.map(function(x){return x.h+'号車'}).join('・'));
var html='<div class="card"><div class="title">'+data.title+'</div>単勝1人気：<span class="yellow">'+(ctx.tanRank[0]?ctx.tanRank[0].h+'号車 '+ctx.tanRank[0].od+'倍':'なし')+'</span><br>単勝2人気：<span class="yellow">'+(ctx.tanRank[1]?ctx.tanRank[1].h+'号車 '+ctx.tanRank[1].od+'倍':'なし')+'</span><br>2車複1人気：<span class="yellow">'+(ctx.nishaRank[0]?ctx.nishaRank[0].key+' '+ctx.nishaRank[0].od+'倍':'なし')+'</span><br>ワイド1人気：<span class="yellow">'+(ctx.wideRank[0]?ctx.wideRank[0].key+' '+ctx.wideRank[0].od+'倍':'なし')+'</span><br>3連系1人気：<span class="yellow">'+(ctx.sanRank[0]?ctx.sanRank[0].key+' '+ctx.sanRank[0].od+'倍':'なし')+'</span></div>';html+=renderAreDiag(ctx);html+='<div class="card lamp"><div class="title">発動・テストランプ</div>'+lamps.join('<br>')+'<hr><span class="small">V24.10：重ハンデ大外頭・後ろ組まとめ差し・後ろ主導＋前1頭残りを大穴スイッチとして追加。</span></div>';html+=renderBigHoleCard(ctx);html+=renderZoneCard(ctx);html+=renderTan100Card(ctx);html+=renderHidden(ctx);html+=makeHonpyo(ctx);html+='<div class="card"><div class="title">🧪擬似複勝の中身</div><b>A：単勝1人気 '+ctx.fav1+'号車からのワイド相手順</b><pre>'+makePseudoPairsText(ctx.pseudoA)+'</pre><b>B：単勝2人気 '+ctx.fav2+'号車からのワイド相手順</b><pre>'+makePseudoPairsText(ctx.pseudoB)+'</pre><b>C：ワイド上位10点の出現回数</b><pre>'+ctx.pseudoC.slice(0,8).map(function(x){return x.h+'号車 出現'+x.count+'回 / 最安'+x.best}).join('\n')+'</pre></div>';html+='<div class="card"><div class="title">👑検証候補ランキング</div>';scored.slice(0,8).forEach(function(x,i){html+='<div class="rankLine"><span class="badge">'+(i+1)+'位 '+x.h+'号車【'+x.score+'】</span> <span class="small">単'+x.tan+'　'+x.reasons.join('・')+'</span></div>';});html+='</div>';html+='<div class="card lamp2"><div class="title">💰テスト買い目候補</div><pre>ワイド\n'+(tickets.wide.length?tickets.wide.join('\n'):'なし')+'\n\n2車複\n'+(tickets.nisha.length?tickets.nisha.join('\n'):'なし')+'\n\n3連系・本線\n'+(tickets.sanMain.length?tickets.sanMain.join('\n'):'なし')+'\n\n3連系・穴本線\n'+(tickets.sanHole.length?tickets.sanHole.join('\n'):'なし')+'\n\n3連系・大荒れ保険\n'+(tickets.sanBomb.length?tickets.sanBomb.join('\n'):'なし')+'\n\n3連系・大穴スイッチ\n'+(tickets.sanBig.length?tickets.sanBig.join('\n'):'なし')+'\n\n単勝100円保険\n'+(ctx.tan100.length?ctx.tan100.map(function(x){return x.h+'　単'+x.tan+'　'+x.label}).join('\n'):'なし')+'</pre></div>';out.innerHTML=html;latestCopyText=makeCopyText(data.title,ctx,scored,tickets,lamps);}catch(e){document.getElementById('out').innerHTML='<div class="card"><div class="title warn">エラー</div><pre>'+String(e&&e.message?e.message:e)+'</pre></div>';}}

function copyResult(){if(!latestCopyText){alert('先に解析してください');return;}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(latestCopyText).then(function(){alert('結果をコピーしました');}).catch(function(){fallbackCopy(latestCopyText);});}else fallbackCopy(latestCopyText);}
function fallbackCopy(text){var ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);alert('結果をコピーしました');}
document.getElementById('btnRun').addEventListener('click',run);document.getElementById('btnSample').addEventListener('click',sample);document.getElementById('btnClear').addEventListener('click',function(){document.getElementById('input').value='';document.getElementById('out').innerHTML='';latestCopyText='';});document.getElementById('btnCopy').addEventListener('click',copyResult);
</script>
