<style>

<body>
<h1>チャッピー神予想 オート V24.21<br>大荒れ5車BOX＋前位置偏差・同ハンデ内枠補正</h1>
<div class="sub">壁色つき＋メジアン祭り＋大荒れ5車BOX＋前位置偏差残り＋同ハンデ内枠穴保険＋結果コピー</div>
<textarea id="input" placeholder="ここに貼り付け&#10;【飯塚8R】&#10;[HANDICAP]&#10;1 0 0.21 3.43 0.085&#10;...&#10;[TANSHO]&#10;2 1.2&#10;...&#10;[NIREN]&#10;2-3 1.5&#10;...&#10;[WIDE]&#10;2-6 1.4&#10;...&#10;[SANREN]&#10;2-3-6 2.5"></textarea>
<div>
  <button class="go" onclick="run()">解析する</button>
  <button class="clear" onclick="document.getElementById('input').value='';document.getElementById('out').innerHTML=''">クリア</button>
  <button class="sample" onclick="sample()">サンプル</button>
  <button class="copybtn" onclick="copyResult()">結果コピー</button>
</div>
<div id="out"></div>
<script>
let latestCopyText='';
const $=id=>document.getElementById(id);
const carSpan=n=>`<span class="car c${Number(n)}">${n}</span>`;
function norm(s){return String(s||'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[．]/g,'.').replace(/[－ー―–—]/g,'-').replace(/[＝]/g,'=').replace(/[〜～]/g,'~');}
function parseNum(x){if(x==null)return NaN; const m=String(x).replace(/,/g,'').match(/\d+(?:\.\d+)?/); return m?parseFloat(m[0]):NaN;}
function secName(line){const m=line.match(/^\s*\[([^\]]+)\]/);return m?m[1].toUpperCase():null;}
function splitCombo(s){return norm(s).split(/[-=]/).map(x=>parseInt(x,10)).filter(n=>!isNaN(n));}
function comboKey(arr){return arr.map(Number).sort((a,b)=>a-b).join('-');}
function parseInput(txt){
  txt=norm(txt); const lines=txt.split(/\n/).map(x=>x.trim()).filter(Boolean); let race='【オート】'; let sec='';
  const data={handicap:{},tansho:[],niren:[],wide:[],sanren:[]};
  for(const line of lines){
    if(line.startsWith('【')){race=line; continue;}
    const sn=secName(line); if(sn){sec=sn; continue;}
    if(/^#/.test(line))continue;
    const parts=line.split(/\s+/);
    if(sec==='HANDICAP'){
      if(parts.length>=4){ const car=parseInt(parts[0],10), han=parseInt(parts[1],10), st=parseNum(parts[2]), trial=parseNum(parts[3]), dev=parseNum(parts[4]); if(car) data.handicap[car]={handicap:han,st,trial,dev}; }
    }else if(sec==='TANSHO'||sec==='TANFUKU'){
      if(parts.length>=2){ const car=parseInt(parts[0],10), odds=parseNum(parts[1]); if(car&&!isNaN(odds)) data.tansho.push({car,odds}); }
    }else if(sec==='NIREN'||sec==='UMAREN'||sec==='2REN'||sec==='NISHA'){
      if(parts.length>=2){ const c=splitCombo(parts[0]); const odds=parseNum(parts[1]); if(c.length===2&&!isNaN(odds)) data.niren.push({cars:c,odds,key:comboKey(c)}); }
    }else if(sec==='WIDE'){
      if(parts.length>=2){ const c=splitCombo(parts[0]); const odds=parseNum(parts.slice(1).join(' ')); if(c.length===2&&!isNaN(odds)) data.wide.push({cars:c,odds,key:comboKey(c)}); }
    }else if(sec==='SANREN'||sec==='SANPUKU'||sec==='3REN'||sec==='SANRENP'){
      if(parts.length>=2){ const c=splitCombo(parts[0]); const odds=parseNum(parts[1]); if(c.length===3&&!isNaN(odds)) data.sanren.push({cars:c,odds,key:comboKey(c)}); }
    }
  }
  for(const k of ['tansho','niren','wide','sanren']) data[k].sort((a,b)=>a.odds-b.odds);
  return {race,data};
}
function medianCars(list, kind){
  if(!list.length)return [];
  const mid=(list.length-1)/2; const idxs=Number.isInteger(mid)?[mid]:[Math.floor(mid),Math.ceil(mid)];
  const set=new Set();
  idxs.forEach(i=>{ const it=list[i]; if(!it)return; if(kind==='tansho')set.add(it.car); else it.cars.forEach(c=>set.add(c)); });
  return [...set];
}
function freqTop(list, topN){const m={}; list.slice(0,topN).forEach(it=>it.cars.forEach(c=>m[c]=(m[c]||0)+1)); return m;}
function rankCars(list, kind, topN=5){
  if(kind==='tansho') return list.slice(0,topN).map(x=>x.car);
  const f=freqTop(list, Math.min(topN,list.length));
  return Object.entries(f).sort((a,b)=>b[1]-a[1] || Number(a[0])-Number(b[0])).map(([c])=>Number(c)).slice(0,topN);
}
function gapWalls(list, kind){
  // returns wall after rank position. rankPos is 1-based after which wall appears
  const odds=list.map(x=>x.odds); const walls=[];
  for(let i=0;i<odds.length-1;i++){
    const a=odds[i], b=odds[i+1]; if(!isFinite(a)||!isFinite(b))continue;
    const diff=b-a, ratio=b/a;
    let level=0;
    if(ratio>=3.2 || diff>=80) level=4;
    else if(ratio>=2.2 || diff>=35) level=3;
    else if(ratio>=1.65 || diff>=16) level=2;
    else if(ratio>=1.35 || diff>=7) level=1;
    if(level) walls.push({pos:i+1,level,from:a,to:b,ratio,diff});
  }
  if(!walls.length && odds.length>=4){
    // always show biggest natural gap as wall1 if meaningful
    let best=null; for(let i=0;i<odds.length-1;i++){const a=odds[i],b=odds[i+1]; const score=(b/a)+(b-a)/10; if(!best||score>best.score)best={pos:i+1,level:1,from:a,to:b,ratio:b/a,diff:b-a,score};}
    if(best && (best.ratio>=1.2||best.diff>=3)) walls.push(best);
  }
  return walls.sort((a,b)=>a.pos-b.pos);
}
function wallClass(pos,walls){ const w=walls.find(w=>w.pos===pos); return w?`wall${w.level}`:''; }
function rankTable(rows,wallsByName){
  const maxLen=Math.max(...Object.values(rows).map(r=>r.length)); let html='<div class="tableWrap"><table class="rankTable"><tr><th>本表</th>';
  for(let i=1;i<=maxLen;i++) html+=`<th>${i}</th>`; html+='</tr>';
  for(const [name,arr] of Object.entries(rows)){
    html+=`<tr><th>${name}</th>`;
    const walls=wallsByName[name]||[];
    for(let i=0;i<maxLen;i++){
      const cls=wallClass(i+1,walls); html+=`<td class="${cls}">${arr[i]?carSpan(arr[i]):''}</td>`;
    }
    html+='</tr>';
  }
  html+='</table></div>';return html;
}
function wallSummary(wallsByName){
  const names=Object.keys(wallsByName); const posMap={};
  names.forEach(n=>wallsByName[n].forEach(w=>{const k=w.pos; (posMap[k]||(posMap[k]=[])).push(n)}));
  const common=Object.entries(posMap).filter(([p,ns])=>ns.length>=2).sort((a,b)=>b[1].length-a[1].length);
  const positions=names.map(n=>wallsByName[n][0]?.pos||null).filter(x=>x!=null);
  const unique=[...new Set(positions)];
  const main=common[0];
  let flags=[];
  if(main && main[1].length>=3) flags.push({name:'共通壁ロック',txt:`${main[1].join('・')} が${main[0]}位後ろで壁。市場の合意が強い。`});
  if(unique.length>=3) flags.push({name:'ズレ壁警報',txt:`壁位置が ${unique.join(' / ')} に分散。単勝評価と連系評価が割れている。`});
  else if(unique.length===2) flags.push({name:'軽いズレ壁',txt:`壁位置が ${unique.join(' / ')} に分かれる。壁またぎ候補を確認。`});
  return {common,flags};
}
function posIn(arr,car){const i=arr.indexOf(Number(car));return i>=0?i+1:999;}
function analyze({race,data}){
  const cars=[...new Set([...data.tansho.map(x=>x.car),...Object.keys(data.handicap).map(Number),...data.niren.flatMap(x=>x.cars),...data.wide.flatMap(x=>x.cars),...data.sanren.flatMap(x=>x.cars)])].sort((a,b)=>a-b);
  const rows={
    '単勝':rankCars(data.tansho,'tansho',Math.min(7,cars.length)),
    '2車複':rankCars(data.niren,'niren',Math.min(7,cars.length)),
    'ワイド':rankCars(data.wide,'wide',Math.min(7,cars.length)),
    '3連系':rankCars(data.sanren,'sanren',Math.min(7,cars.length))
  };
  const wallsByName={
    '単勝':gapWalls(data.tansho,'tansho'),
    '2車複':gapWalls(data.niren,'niren'),
    'ワイド':gapWalls(data.wide,'wide'),
    '3連系':gapWalls(data.sanren,'sanren')
  };
  const med={
    '単勝':medianCars(data.tansho,'tansho'),
    '2車複':medianCars(data.niren,'niren'),
    'ワイド':medianCars(data.wide,'wide'),
    '3連系':medianCars(data.sanren,'sanren')
  };
  const topFreq={niren:freqTop(data.niren,10),wide:freqTop(data.wide,10),sanren:freqTop(data.sanren,20)};
  const hEntries=Object.entries(data.handicap||{}).map(([cc,h])=>({car:Number(cc),...h}));
  const hvals=Object.values(data.handicap);
  const minTrial=Math.min(...hvals.map(x=>x.trial).filter(isFinite));
  const minSt=Math.min(...hvals.map(x=>x.st).filter(isFinite));
  const devVals=hvals.map(x=>x.dev).filter(isFinite);
  const minDev=devVals.length?Math.min(...devVals):Infinity;
  const maxHan=Math.max(...hvals.map(x=>x.handicap).filter(isFinite));
  const favTan=data.tansho&&data.tansho[0]?data.tansho[0]:null;
  const favHp=favTan?data.handicap[favTan.car]:null;
  const wallInfo=wallSummary(wallsByName);
  const candidates=[];
  for(const c of cars){
    let score=0, notes=[];
    const tan=data.tansho.find(x=>x.car===c); const odds=tan?.odds??999;
    const medCount=Object.values(med).filter(a=>a.includes(c)).length;
    if(medCount>=3){score+=35+medCount*8; notes.push(`メジアン祭り${medCount}表`)} else if(medCount){score+=medCount*8; notes.push(`${medCount}表メジアン`)}
    const allRemain=Object.values(rows).every(r=>r.includes(c));
    if(allRemain){score+=26; notes.push('全表残り')}
    const posT=posIn(rows['単勝'],c), posN=posIn(rows['2車複'],c), posW=posIn(rows['ワイド'],c), posS=posIn(rows['3連系'],c);
    const avgPos=[posT,posN,posW,posS].filter(x=>x<999).reduce((a,b)=>a+b,0)/[posT,posN,posW,posS].filter(x=>x<999).length;
    if(posW<=3){score+=12; notes.push('ワイド上位')}
    if(posS<=4){score+=10; notes.push('3連系上位')}
    if(topFreq.sanren[c]>=5){score+=topFreq.sanren[c]*2; notes.push(`3連系上位出現${topFreq.sanren[c]}回`)}
    if(topFreq.wide[c]>=4){score+=8; notes.push(`ワイド上位出現${topFreq.wide[c]}回`)}
    if(topFreq.niren[c]>=4){score+=8; notes.push(`2車複上位出現${topFreq.niren[c]}回`)}
    const hp=data.handicap[c];
    if(hp){
      if(isFinite(hp.trial)&&hp.trial<=minTrial+0.01){score+=16; notes.push('試走最上位級')}
      else if(isFinite(hp.trial)&&hp.trial<=minTrial+0.03){score+=8; notes.push('試走上位')}
      if(isFinite(hp.dev)){
        if(hp.dev<=minDev+0.006){score+=12; notes.push('偏差最上位級')}
        else if(hp.dev<=minDev+0.020){score+=6; notes.push('偏差上位')}
      }
      if(isFinite(hp.st)&&hp.st<=minSt+0.03){score+=10; notes.push('ST上位')}
      if(isFinite(hp.handicap)&&hp.handicap===maxHan && maxHan>0){score+=5; notes.push('重ハンデ実力車')}
      const sameH=hEntries.filter(x=>x.handicap===hp.handicap).sort((a,b)=>a.car-b.car);
      const sameIdx=sameH.findIndex(x=>x.car===c);
      if(sameH.length>=2 && sameIdx===0 && odds>=15 && isFinite(hp.st) && hp.st<=0.17 && (medCount>=1||posN<=6||posW<=10||posS<=12)){score+=16; notes.push('同ハンデ内枠穴')}
      if(favTan && favHp && c!==favTan.car && hp.handicap===favHp.handicap && c<favTan.car){
        const wr=data.wide.findIndex(x=>x.cars.includes(c)&&x.cars.includes(favTan.car))+1;
        const nr=data.niren.findIndex(x=>x.cars.includes(c)&&x.cars.includes(favTan.car))+1;
        const sr=data.sanren.findIndex(x=>x.cars.includes(c)&&x.cars.includes(favTan.car))+1;
        if((wr>0&&wr<=10)||(nr>0&&nr<=12)||(sr>0&&sr<=12)){
          const stOk=!isFinite(favHp.st)||!isFinite(hp.st)||hp.st<=favHp.st+0.03;
          const trOk=!isFinite(favHp.trial)||!isFinite(hp.trial)||hp.trial<=favHp.trial+0.04;
          if(stOk&&trOk){score+=14; notes.push('本命同ハンデ内側相棒')}
        }
      }
    }
    // wall crossing: outside single but inside relation tables
    const tanWall=wallsByName['単勝'][0]?.pos||3; const relWall=Math.max(wallsByName['2車複'][0]?.pos||3,wallsByName['ワイド'][0]?.pos||3,wallsByName['3連系'][0]?.pos||3);
    if(posT>tanWall && (posN<=relWall || posW<=relWall || posS<=relWall)){score+=20; notes.push('壁またぎ受け皿')}
    if(posT<=tanWall && posN>relWall && posW>relWall && posS>relWall){score-=18; notes.push('単勝だけ過剰人気警戒')}
    if(odds>=40 && (posW<=5||posS<=5)){score+=8; notes.push('単勝40倍超は3着穴寄り')}
    if(odds<2 && score<45){notes.push('単勝1人気だが中身確認')}
    candidates.push({car:c,score:Math.round(score),odds,notes,avgPos,posT,posN,posW,posS,hp});
  }
  candidates.sort((a,b)=>b.score-a.score || a.avgPos-b.avgPos || a.car-b.car);
  const medianFestival=candidates.filter(x=>x.notes.some(n=>n.startsWith('メジアン祭り')));
  const allTableStrong=candidates.filter(x=>x.notes.includes('全表残り') && (x.notes.includes('試走最上位級')||x.notes.includes('ST上位')||x.notes.includes('重ハンデ実力車')));
  const wallCross=candidates.filter(x=>x.notes.includes('壁またぎ受け皿'));
  const overPop=candidates.filter(x=>x.notes.includes('単勝だけ過剰人気警戒'));
  const core=medianFestival[0]||candidates[0];
  const receiver=allTableStrong.find(x=>x.car!==core.car)||wallCross.find(x=>x.car!==core.car)||candidates.find(x=>x.car!==core.car && x.score>=35);
  const price=candidates.find(x=>x.car!==core.car && (!receiver||x.car!==receiver.car) && x.odds>=10 && x.score>=30)||candidates.find(x=>x.car!==core.car && (!receiver||x.car!==receiver.car));
  const protect=[];
  function addCombo(a,b,c,reason){if([a,b,c].every(Boolean)){const key=comboKey([a,b,c]); if(!protect.some(x=>x.key===key)) protect.push({key,reason,cars:key.split('-').map(Number)});}}
  addCombo(core?.car,receiver?.car,price?.car,'メジアン祭り×全表残り実力受け皿×配当役');
  if(core&&receiver){
    const rel=[...candidates].filter(x=>x.car!==core.car&&x.car!==receiver.car).slice(0,4);
    rel.forEach(x=>addCombo(core.car,receiver.car,x.car,'核×受け皿×候補上位'));
  }
  if(medianFestival[0]){
    candidates.slice(1,6).forEach(a=>candidates.slice(1,6).forEach(b=>{if(a.car<b.car && (a.notes.includes('全表残り')||b.notes.includes('全表残り'))) addCombo(medianFestival[0].car,a.car,b.car,'メジアン祭り保護');}));
  }
  return {race,data,cars,rows,wallsByName,med,candidates,wallInfo,medianFestival,allTableStrong,wallCross,overPop,protect};
}
function oddsOfSanren(data,key){const it=data.sanren.find(x=>x.key===key); return it?it.odds:null;}

function uniquePush(arr,v){ if(v!=null && !arr.includes(Number(v))) arr.push(Number(v)); }
function predictFormation(res){
  const cs=res.candidates||[];
  if(!cs.length) return null;
  // 1着軸は総合1位を優先。メジアン祭りが上っ面警戒の時は頭固定ではなく2・3着箱へ落とす。
  let head=cs[0].car;
  const medCar=res.medianFestival?.[0]?.car;
  const box=[];
  // 2・3着箱：メジアン祭り、全表残り受け皿、壁またぎ、総合上位から3車
  if(medCar && medCar!==head) uniquePush(box,medCar);
  (res.wallCross||[]).forEach(x=>{ if(x.car!==head) uniquePush(box,x.car); });
  (res.allTableStrong||[]).forEach(x=>{ if(x.car!==head) uniquePush(box,x.car); });
  cs.forEach(x=>{ if(x.car!==head) uniquePush(box,x.car); });
  const box3=box.slice(0,3).sort((a,b)=>a-b);
  const boxStr=box3.join('');
  // 抑え頭：箱に入らなかった上位人気/過剰人気/総合上位を1頭
  let cover=(res.overPop||[]).find(x=>x.car!==head && !box3.includes(x.car))?.car;
  if(!cover) cover=cs.find(x=>x.car!==head && !box3.includes(x.car))?.car;
  if(!cover) cover=box3[0];
  // 厚張り1点：本線フォメ内で3連系オッズが一番前に出ている組を、1着軸から表示
  let one='';
  const combos=[];
  for(let i=0;i<box3.length;i++) for(let j=i+1;j<box3.length;j++) combos.push([head,box3[i],box3[j]]);
  let best=null;
  combos.forEach(c=>{
    const key=comboKey(c);
    const o=oddsOfSanren(res.data,key);
    if(o!=null && (!best || o<best.odds)) best={cars:c,odds:o,key};
  });
  if(best){
    // keyは昇順なので、頭だけ固定して残りはオッズ表の自然順（昇順）で表示
    const rest=best.key.split('-').map(Number).filter(x=>x!==head);
    one=String(head)+rest.join('');
  }else if(box3.length>=2){
    one=String(head)+box3.slice(0,2).join('');
  }
  return {
    head,box:box3,boxStr,cover,one,
    main:`${head}-${boxStr}-${boxStr}`,
    osa:`${cover}-${head}-${boxStr}`,
    note:`1着は総合1位・壁またぎ/連系中心を優先。メジアン祭りや上っ面警戒馬は消さずに2・3着箱へ残す。`
  };
}

function kumi2(a,b){return [a,b].map(Number).sort((x,y)=>x-y).join('-');}
function kumi3(a,b,c){return [a,b,c].map(Number).sort((x,y)=>x-y).join('-');}
function boxPairs(cars){const out=[]; for(let i=0;i<cars.length;i++) for(let j=i+1;j<cars.length;j++) out.push(kumi2(cars[i],cars[j])); return out;}
function boxTris(cars){const out=[]; for(let i=0;i<cars.length;i++) for(let j=i+1;j<cars.length;j++) for(let k=j+1;k<cars.length;k++) out.push(kumi3(cars[i],cars[j],cars[k])); return out;}
function detectAutoWild5Box(res){
  const cs=res.candidates||[], data=res.data||{};
  if(!cs.length) return {on:false,box:[],reason:[],front:null,frontAdded:false,signCount:0,types:0,targetCars:0,pairs:[],tris:[],single:[],frontIns:[]};
  const reason=[], typeSet=new Set(), targetSet=new Set();

  mark('メジアン祭り',res.medianFestival);
  mark('全表残り',res.allTableStrong);
  mark('壁またぎ',res.wallCross);
  mark('過剰人気',res.overPop);
  const sameHanHoles=cs.filter(x=>(x.notes||[]).some(n=>n.includes('同ハンデ内枠穴')||n.includes('本命同ハンデ内側相棒')));
  mark('同ハンデ内枠穴',sameHanHoles);
  mark('3連系メジアン分散',(res.med&&res.med['3連系']||[]).map(c=>({car:c})));
  cs.forEach(x=>{
    const ns=(x.notes||[]).join('・');
    if(ns.includes('単勝40倍超')){typeSet.add('単勝40倍超'); targetSet.add(x.car);}
    if(ns.includes('試走最上位級')||ns.includes('試走上位')){typeSet.add('試走上位'); targetSet.add(x.car);}
    if(ns.includes('ST上位')){typeSet.add('ST上位'); targetSet.add(x.car);}
  });
  const signCount=(res.medianFestival?.length||0)+(res.allTableStrong?.length||0)+(res.wallCross?.length||0)+(res.overPop?.length||0)+cs.filter(x=>(x.notes||[]).some(n=>/試走|偏差|ST|単勝40倍|同ハンデ|内側相棒/.test(n))).length;
  const fav=data.tansho&&data.tansho[0] ? data.tansho[0] : null;
  const favObj=fav ? cs.find(x=>x.car===fav.car) : null;
  const favLowRank = favObj ? (cs.findIndex(x=>x.car===fav.car)+1)>=4 : false;
  const manyMedian=(res.medianFestival?.length||0)>=3;
  const manyRemain=(res.allTableStrong?.length||0)>=4;
  const manyWall=(res.wallCross?.length||0)>=5;
  const sanSpread=((res.med&&res.med['3連系'])||[]).length>=5;
  const favFly=(fav&&fav.odds<=1.5&&(manyWall||sanSpread||favLowRank));
  const trigger = manyMedian || manyRemain || manyWall || sanSpread || favFly || (signCount>=10 && targetSet.size>=5 && typeSet.size>=5);
  if(manyMedian) reason.push('メジアン祭りが3車以上');
  if(manyRemain) reason.push('全表残り実力受け皿が4車以上');
  if(manyWall) reason.push('壁またぎ受け皿が5車以上');
  if(sanSpread) reason.push('3連系メジアンが5車以上に分散');
  if(favFly) reason.push('単勝1人気1.5倍以下でも相手側サインが多く本命飛び警戒');
  if(signCount>=10) reason.push('異常サイン密度が高い');
  if(sameHanHoles.length) reason.push('同ハンデ内枠穴・本命内側相棒を保険表示');
  // 最前位置単騎補正 A=単勝/メジアン型、B=偏差3着残り型
  let front=null, frontAdded=false, frontDev=false;
  const hs=Object.entries(data.handicap||{}).map(([c,h])=>({car:Number(c),...h})).filter(x=>Number.isFinite(x.handicap));
  if(hs.length){
    const minH=Math.min(...hs.map(x=>x.handicap));
    const fronts=hs.filter(x=>x.handicap===minH);
    const devs=hs.map(x=>x.dev).filter(isFinite); const bestDev=devs.length?Math.min(...devs):Infinity;
    if(fronts.length===1){
      const fh=fronts[0]; const fc=fh.car; const fo=(data.tansho||[]).find(x=>x.car===fc)?.odds ?? 999;
      const fObj=cs.find(x=>x.car===fc);
      const medHit=Object.values(res.med||{}).filter(a=>(a||[]).includes(fc)).length;
      const wallHit=(res.wallCross||[]).some(x=>x.car===fc);
      const devGood=isFinite(fh.dev) && (fh.dev<=bestDev+0.010 || fh.dev<=0.075);
      const stOk=!isFinite(fh.st) || fh.st<=0.20;
      const nextH=hs.filter(x=>x.handicap>minH).sort((a,b)=>a.handicap-b.handicap)[0]?.handicap;
      const gapOk=!isFinite(nextH) || nextH-minH>=10;
      const frontA=fo>=8 && fo<=45 && (wallHit || medHit>=1 || (fObj&&fObj.score>=35));
      const frontB=fo>45 && fo<=120 && devGood && stOk && gapOk;
      if(frontA || frontB){

        const devTxt=isFinite(fh.dev)?`・偏差${fh.dev}`:'';

  const pick=[];
  function addCar(c){c=Number(c); if(c && !pick.includes(c)) pick.push(c);}
  cs.slice(0,5).forEach(x=>addCar(x.car));
  (res.medianFestival||[]).forEach(x=>addCar(x.car));
  (res.allTableStrong||[]).slice(0,4).forEach(x=>addCar(x.car));
  (res.wallCross||[]).slice(0,4).forEach(x=>addCar(x.car));
  sameHanHoles.slice(0,3).forEach(x=>addCar(x.car));
  if(frontAdded) addCar(front.car);
  // 5車へ圧縮。前位置単騎は固定、総合上位4頭を優先。残りはスコア順。
  let box=[];
  if(frontAdded) addCar(front.car);
  cs.slice(0,4).forEach(x=>{ if(!(frontAdded&&x.car===front.car)) box.push(x.car); });
  if(frontAdded) box.push(front.car);
  pick.forEach(c=>{ if(!box.includes(c)) box.push(c); });

  box=[...new Set(box.map(Number))];
  if(box.length>5){
    const fixed=new Set(); if(frontAdded) fixed.add(front.car);

    const sorted=box.map(c=>cs.find(x=>x.car===c)||{car:c,score:0,odds:999,notes:[]}).sort((a,b)=>{
      const af=fixed.has(a.car)?1:0, bf=fixed.has(b.car)?1:0; if(af!==bf) return bf-af;
      return b.score-a.score || a.odds-b.odds;
    });
    box=sorted.slice(0,5).map(x=>x.car);
  }
  box=box.sort((a,b)=>a-b);
  const single=box.map(c=>String(c));
  const pairs=boxPairs(box);
  const tris=boxTris(box);
  const frontIns=[];
  if(frontAdded){
    const others=box.filter(c=>c!==front.car);
    for(let i=0;i<others.length;i++) for(let j=i+1;j<others.length;j++) frontIns.push(kumi3(front.car,others[i],others[j]));
  }
  const sameHanIns=[];
  const favCar=(data.tansho&&data.tansho[0])?data.tansho[0].car:null;
  sameHanHoles.slice(0,3).forEach(h=>{
    const partners=[];
    if(favCar && favCar!==h.car) partners.push(favCar);
    cs.forEach(x=>{ if(x.car!==h.car && x.car!==favCar && partners.length<5) partners.push(x.car); });
    for(let i=0;i<partners.length;i++) for(let j=i+1;j<partners.length;j++){
      const tri=kumi3(h.car,partners[i],partners[j]);
      if(!sameHanIns.includes(tri)) sameHanIns.push(tri);
    }
  });
  const extraIns=[...new Set([...frontIns, ...sameHanIns])];
  return {on:true,box,reason,front,frontAdded,frontDev,signCount,types:typeSet.size,targetCars:targetSet.size,pairs,tris,single,frontIns,sameHanIns,extraIns,sameHanHoles};
}

<script>
(function(){
  'use strict';

  const V2421_parseInput = window.parseInput;

  document.title='チャッピー神予想 オート V24.22 BOX主役＋逆転頭＋補正連結＋入力安全';

  const st=document.createElement('style');

  `;

  function uniqNums(arr){return [...new Set((arr||[]).map(Number).filter(Number.isFinite))];}
  function cleanTriKey(key){
    const a=String(key||'').split('-').map(Number).filter(Number.isFinite);
    if(a.length!==3||new Set(a).size!==3)return null;
    return a.sort((x,y)=>x-y).join('-');
  }
  function cleanPairKey(key){
    const a=String(key||'').split('-').map(Number).filter(Number.isFinite);
    if(a.length!==2||new Set(a).size!==2)return null;
    return a.sort((x,y)=>x-y).join('-');
  }
  function candidateOf(res,car){return (res.candidates||[]).find(x=>Number(x.car)===Number(car));}
  function topCount(list,car,n){return (list||[]).slice(0,n).filter(x=>(x.cars||[]).includes(Number(car))).length;}
  function tablePos(res,name,car){return posIn((res.rows&&res.rows[name])||[],car);}

  function validateParsed(p){
    const d=p&&p.data?p.data:{};
    const errors=[];
    const hs=Object.entries(d.handicap||{});
    hs.forEach(([car,h])=>{
      if(Number.isFinite(h.st)&&h.st>=1 && Number.isFinite(h.trial)&&h.trial<1){
        errors.push(`${car}号車：STと試走が逆です。正しい順番は「車番 ハンデ ST 試走 偏差」です。`);
      }
      if(Number.isFinite(h.st)&&(h.st<0||h.st>0.99)) errors.push(`${car}号車：ST ${h.st} は異常値です。`);
      if(Number.isFinite(h.trial)&&(h.trial<2.5||h.trial>5.0)) errors.push(`${car}号車：試走 ${h.trial} は異常値です。`);
    });

      (list||[]).forEach(x=>{
        const a=(x.cars||[]).map(Number);

  }

  function detectReverseHeads(res){
    const d=res.data||{};
    const fav=d.tansho&&d.tansho[0];

    const fh=d.handicap&&d.handicap[fav.car];
    if(!fh)return [];

      if(x.car===fav.car)return;
      const hp=d.handicap&&d.handicap[x.car];
      if(!hp||hp.handicap!==fh.handicap||x.car>fav.car)return;
      const posT=tablePos(res,'単勝',x.car),posN=tablePos(res,'2車複',x.car),posW=tablePos(res,'ワイド',x.car),posS=tablePos(res,'3連系',x.car);
      const stFast=Number.isFinite(hp.st)&&Number.isFinite(fh.st)&&hp.st<=fh.st-0.01;
      const trialNear=!Number.isFinite(hp.trial)||!Number.isFinite(fh.trial)||hp.trial<=fh.trial+0.02;
      const marketTop=(posT<=3&&posN<=3&&posW<=3);
      const triSupport=posS<=4||topCount(d.sanren,x.car,10)>=4;
      if(stFast&&trialNear&&marketTop&&triSupport){
        out.push({car:x.car,fav:fav.car,posT,posN,posW,posS,st:hp.st,favSt:fh.st,trial:hp.trial,favTrial:fh.trial,score:x.score});
      }
    });
    out.sort((a,b)=>b.score-a.score||a.car-b.car);
    return out;
  }

  function detectStrongSameHan(res){
    const d=res.data||{};
    const fav=d.tansho&&d.tansho[0];
    if(!fav)return [];
    const fh=d.handicap&&d.handicap[fav.car];
    if(!fh)return [];
    return (res.candidates||[]).filter(x=>{
      if(x.car===fav.car)return false;
      const hp=d.handicap&&d.handicap[x.car];
      if(!hp||hp.handicap!==fh.handicap||x.car>fav.car)return false;
      const note=(x.notes||[]).join('・');
      const inner=note.includes('同ハンデ内枠穴')||note.includes('本命同ハンデ内側相棒');
      const trialOk=!Number.isFinite(hp.trial)||!Number.isFinite(fh.trial)||hp.trial<=fh.trial+0.03;
      const stOk=!Number.isFinite(hp.st)||!Number.isFinite(fh.st)||hp.st<=fh.st+0.01;
      const support=tablePos(res,'2車複',x.car)<=5||tablePos(res,'ワイド',x.car)<=6||tablePos(res,'3連系',x.car)<=6||topCount(d.sanren,x.car,10)>=3;
      return inner&&trialOk&&stOk&&support;
    }).sort((a,b)=>b.score-a.score||a.car-b.car);
  }

  function detectMarketAxis(res){
    const d=res.data||{}; const map={};
    function add(car,pt){map[car]=(map[car]||0)+pt;}
    (d.niren||[]).slice(0,6).forEach((x,i)=>(x.cars||[]).forEach(c=>add(c,Math.max(1,7-i)*2)));
    (d.wide||[]).slice(0,8).forEach((x,i)=>(x.cars||[]).forEach(c=>add(c,Math.max(1,9-i)*2)));
    (d.sanren||[]).slice(0,10).forEach((x,i)=>(x.cars||[]).forEach(c=>add(c,Math.max(1,11-i)*3)));
    return Object.keys(map).map(Number).sort((a,b)=>map[b]-map[a]||((candidateOf(res,b)?.score||0)-(candidateOf(res,a)?.score||0))||a-b)[0]||null;
  }

  window.analyze=function(p){
    const res=V2421_analyze(p);
    res.reverseHeads=detectReverseHeads(res);
    res.strongSameHan=detectStrongSameHan(res);
    res.marketAxis=detectMarketAxis(res);

    res.reverseHeads.forEach(r=>{
      const x=candidateOf(res,r.car);
      if(x){
        x.score+=34;
        if(!(x.notes||[]).includes('逆転頭ランプ'))x.notes.push('逆転頭ランプ');
      }
    });
    res.strongSameHan.forEach(x=>{
      if(!(x.notes||[]).includes('同ハンデ内枠強制保護')){
        x.score+=18;
        x.notes.push('同ハンデ内枠強制保護');
      }
    });
    res.candidates.sort((a,b)=>b.score-a.score||a.avgPos-b.avgPos||a.car-b.car);

    if(res.reverseHeads.length){
      const h=res.reverseHeads[0].car, axis=res.marketAxis;
      const mate=(res.candidates||[]).find(x=>x.car!==h&&x.car!==axis);
      if(axis&&mate){
        const key=kumi3(h,axis,mate.car);
        if(!res.protect.some(x=>x.key===key))res.protect.unshift({key,reason:'逆転頭ランプ×市場共通軸×総合上位',cars:key.split('-').map(Number)});
      }
    }
    return res;
  };

  window.predictFormation=function(res){
    const base=V2421_predictFormation(res);
    const rh=res.reverseHeads&&res.reverseHeads[0];
    if(!rh)return base;
    const head=rh.car;
    const axis=res.marketAxis;
    const box=[];
    if(axis&&axis!==head)box.push(axis);
    (res.candidates||[]).forEach(x=>{if(x.car!==head&&!box.includes(x.car)&&box.length<3)box.push(x.car);});
    const b3=box.slice(0,3).sort((a,b)=>a-b);
    let one='';
    const best=(res.data.sanren||[]).find(t=>t.cars.includes(head)&&(!axis||t.cars.includes(axis)));
    if(best){const rest=best.cars.filter(c=>c!==head).sort((a,b)=>a-b);one=String(head)+rest.join('');}
    else if(b3.length>=2)one=String(head)+b3.slice(0,2).join('');
    const cover=axis&&axis!==head?axis:(base?base.cover:b3[0]);
    return {head,box:b3,boxStr:b3.join(''),cover,one,main:`${head}-${b3.join('')}-${b3.join('')}`,osa:`${cover}-${head}-${b3.join('')}`,note:'逆転頭ランプを1着へ昇格。大荒れ5車BOXは別に主役として残し、3連単は参考扱い。'};
  };

  window.detectAutoWild5Box=function(res){
    const wild=V2421_detectAutoWild5Box(res);
    const d=res.data||{};
    const hs=Object.entries(d.handicap||{}).map(([c,h])=>({car:Number(c),...h})).filter(x=>Number.isFinite(x.handicap));
    const front=wild.front;
    let frontWeak=false,trialGap=null;
    if(front&&d.handicap&&d.handicap[front.car]){
      const fh=d.handicap[front.car];
      const others=hs.filter(x=>x.handicap>fh.handicap&&Number.isFinite(x.trial));
      if(others.length&&Number.isFinite(fh.trial)){
        const best=Math.min(...others.map(x=>x.trial));
        trialGap=Number((fh.trial-best).toFixed(2));
        const fx=candidateOf(res,front.car);
        const medHit=front.medHit||0;
        const exceptional=(fx&&fx.score>=100)||medHit>=2||((front.wallHit||false)&&(fx&&fx.score>=70));
        frontWeak=trialGap>=0.04&&!exceptional;
      }
    }

    wild.reverseHeads=(res.reverseHeads||[]).slice();
    wild.strongSameHan=(res.strongSameHan||[]).slice();
    wild.marketAxis=res.marketAxis||null;
    wild.frontHeldOnly=!!(front&&frontWeak);
    wild.frontTrialGap=trialGap;

    if(wild.on){
      let box=uniqNums(wild.box);
      if(frontWeak&&front){box=box.filter(c=>c!==front.car);}
      const priority=[];
      (wild.reverseHeads||[]).forEach(x=>priority.push(x.car));
      (wild.strongSameHan||[]).forEach(x=>priority.push(x.car));
      (res.candidates||[]).forEach(x=>priority.push(x.car));
      priority.forEach(c=>{if(!box.includes(c))box.push(c);});
      const fixed=new Set();
      (wild.reverseHeads||[]).forEach(x=>fixed.add(x.car));
      (wild.strongSameHan||[]).slice(0,2).forEach(x=>fixed.add(x.car));
      if(front&&wild.frontAdded&&!frontWeak)fixed.add(front.car);
      box=uniqNums(box).map(c=>candidateOf(res,c)||{car:c,score:0,odds:999}).sort((a,b)=>{
        const af=fixed.has(a.car)?1:0,bf=fixed.has(b.car)?1:0;if(af!==bf)return bf-af;
        return b.score-a.score||a.odds-b.odds;
      }).slice(0,5).map(x=>x.car).sort((a,b)=>a-b);
      wild.box=box;
      wild.single=box.map(String);
      wild.pairs=boxPairs(box).map(cleanPairKey).filter(Boolean);
      wild.tris=boxTris(box).map(cleanTriKey).filter(Boolean);
    }

    const linkIns=[];
    if(front&&wild.marketAxis){
      const linkPool=[];
      (wild.strongSameHan||[]).forEach(x=>{if(!linkPool.some(y=>y.car===x.car))linkPool.push(x);});
      (wild.sameHanHoles||[]).forEach(x=>{if(!linkPool.some(y=>y.car===x.car))linkPool.push(x);});
      linkPool.slice(0,4).forEach(x=>{
        if(new Set([front.car,wild.marketAxis,x.car]).size===3){
          const k=cleanTriKey(kumi3(front.car,wild.marketAxis,x.car));
          if(k&&!linkIns.includes(k))linkIns.push(k);
        }
      });
    }
    wild.linkIns=linkIns;
    const raw=[...(wild.extraIns||[]),...linkIns];
    wild.extraIns=[...new Set(raw.map(cleanTriKey).filter(Boolean))];
    if(frontWeak){
      wild.reason=wild.reason||[];
      wild.reason.push(`前位置単騎は後方最速より試走${trialGap}遅く、5車BOXではなく保険止まり`);

      wild.reason=wild.reason||[];
      wild.reason.push('前位置単騎×同ハンデ内枠穴×市場共通軸を強制連結');
    }
    if(wild.reverseHeads.length){
      wild.reason=wild.reason||[];
      wild.reason.push('逆転頭ランプ車を5車BOXへ強制保護');

      wild.reason=wild.reason||[];

  };

    <pre class="copybox">三連複5車BOX【主役】
${wild.tris.join('\n')}

ワイド5車BOX
${wild.pairs.join('\n')}

単勝5車
${wild.single.join('\n')}

${wild.extraIns&&wild.extraIns.length?'補正保険3連複\n'+wild.extraIns.slice(0,16).join('\n')+'\n\n':''}本体25点。100円なら2500円＋保険候補</pre>
    <div class="mini">理由：${(wild.reason||[]).join(' / ')}</div>
    <div class="mini" style="margin-top:8px;color:#86efac;font-weight:900">大荒れ点灯時は三連複5車BOXが主役。3連単フォーメーションは参考で、BOXの車を手動で削らない。</div></div>`;
  };

  window.autoWildText=function(wild){
    if(!wild||!wild.on)return'なし';
    return `🚨オート大荒れ5車BOX主役モード V24.22：点灯
サイン密度：${wild.signCount}件 / 対象${wild.targetCars}車 / 種類${wild.types}
最終5車BOX：${wild.box.map(c=>c+'号車').join('・')}
${wild.reverseHeads&&wild.reverseHeads.length?'逆転頭強制保護：'+wild.reverseHeads.map(x=>x.car+'号車').join('・')+'\n':''}${wild.strongSameHan&&wild.strongSameHan.length?'同ハンデ内枠強制保護：'+wild.strongSameHan.map(x=>x.car+'号車').join('・')+'\n':''}${wild.front&&wild.frontHeldOnly?'前位置単騎は保険止まり：'+wild.front.car+'号車 / 後方最速との試走差'+wild.frontTrialGap+'\n':(wild.frontAdded?'前位置単騎残り補正：'+wild.front.car+'号車 / '+wild.front.reason+'\n':'')}${wild.linkIns&&wild.linkIns.length?'補正連結保護：'+wild.linkIns.join(' / ')+'\n':''}理由：${(wild.reason||[]).join(' / ')}

三連複5車BOX【主役】
${wild.tris.join('\n')}

ワイド5車BOX
${wild.pairs.join('\n')}

単勝5車
${wild.single.join('\n')}

${wild.extraIns&&wild.extraIns.length?'補正保険3連複\n'+wild.extraIns.slice(0,16).join('\n')+'\n\n':''}本体25点。100円なら2500円＋保険候補
※大荒れ点灯時は三連複5車BOXが主役。3連単は参考。BOX内の車を手動で削らない。`;
  };

  window.render=function(res){
    let html=V2421_render(res).replace(/V24\.21/g,'V24.22');
    html=reverseCard(res)+html;
    return html;
  };

  window.run=function(){
    try{
      const p=V2421_parseInput($('input').value);
      const errors=validateParsed(p);
      if(errors.length){
        $('out').innerHTML=`<div class="card hot"><h2>⛔入力安全チェックで停止</h2><pre>${errors.join('\n')}</pre><div class="mini">[HANDICAP] は「車番 ハンデ ST 試走 偏差」の順です。異常値・重複車番がある間は解析しません。</div></div>`;
        latestCopyText='';
        return;
      }
      const res=window.analyze(p);
      $('out').innerHTML=window.render(res);
    }catch(e){
      $('out').innerHTML=`<div class="card hot"><h2>エラー</h2><pre>${e.stack||e}</pre></div>`;
    }
  };
})();

  function fillBox(res,head,base){

  function detectWideBranch(res,form){
    if(!form)return null;
    const d=res.data||{},head=form.head,partners=uniq([...(form.secondBox||[]),...(form.thirdBox||[])]).filter(c=>c!==head);
    const scored=[];

      scored.push({car,key:item.key,odds:item.odds,wr,nr,score,thirdOnly:(res.thirdOnly||[]).some(t=>t.car===car)});

<script>
(function(){

  document.title='チャッピー神予想 オート V24.24 1着軸信頼度＋四強ロック＋擬似複勝壁';
  const h1=document.querySelector('h1');

  const style=document.createElement('style');

  function uniq(a){return [...new Set((a||[]).map(Number).filter(Number.isFinite))];}

  function candidate(res,car){return (res.candidates||[]).find(x=>Number(x.car)===Number(car));}
  function topCount(list,car,n){return (list||[]).slice(0,n).filter(x=>(x.cars||[]).includes(Number(car))).length;}
  function firstRank(list,car){const i=(list||[]).findIndex(x=>(x.cars||[]).includes(Number(car)));return i<0?999:i+1;}
  function tanRank(d,car){const i=(d.tansho||[]).findIndex(x=>Number(x.car)===Number(car));return i<0?999:i+1;}
  function firstExact18Wall(list){
    for(let i=0;i<(list||[]).length-1;i++){
      const a=Number(list[i].odds),b=Number(list[i+1].odds);
      if(Number.isFinite(a)&&a>0&&Number.isFinite(b)&&b/a>=1.8)return {pos:i+1,from:a,to:b,ratio:b/a};
    }
    return null;
  }
  function medianOfCars(cars){
    const a=uniq(cars); if(!a.length)return [];
    const mid=(a.length-1)/2;
    if(Number.isInteger(mid))return [a[mid]];

  }
  function rankedCarsInside(list,wallPos,kind){
    if(!wallPos||wallPos<1)return [];

    if(kind==='tansho')return cut.map(x=>Number(x.car));
    const map=new Map();
    cut.forEach((x,i)=>(x.cars||[]).forEach(c=>{
      const o=map.get(Number(c))||{car:Number(c),count:0,first:999,sum:0};
      o.count++;o.first=Math.min(o.first,i+1);o.sum+=i+1;map.set(Number(c),o);
    }));
    return [...map.values()].sort((a,b)=>b.count-a.count||a.first-b.first||a.sum-b.sum||a.car-b.car).map(x=>x.car);
  }
  function buildWallInside(res){
    const d=res.data||{};
    const defs=[['単勝',d.tansho,'tansho'],['2車複',d.niren,'pair'],['ワイド',d.wide,'pair'],['3連系',d.sanren,'pair']];
    const out={};
    defs.forEach(([name,list,kind])=>{
      const wall=firstExact18Wall(list);

    });
    return out;
  }
  function pseudoSupport(res){
    const d=res.data||{},cars=allCars(d),rows=[];
    cars.forEach(car=>{
      const nCnt=topCount(d.niren,car,8),wCnt=topCount(d.wide,car,10),sCnt=topCount(d.sanren,car,12);
      const nr=firstRank(d.niren,car),wr=firstRank(d.wide,car),sr=firstRank(d.sanren,car);
      const rankPart=(nr<999?Math.max(0,18-nr):0)+(wr<999?Math.max(0,20-wr):0)+(sr<999?Math.max(0,18-sr):0);
      const score=nCnt*6+wCnt*7+sCnt*5+rankPart;
      rows.push({car,nCnt,wCnt,sCnt,nr,wr,sr,score});
    });
    rows.sort((a,b)=>b.score-a.score||a.wr-b.wr||a.nr-b.nr||a.sr-b.sr||a.car-b.car);
    let wall=null;
    for(let i=0;i<rows.length-1;i++){
      const a=rows[i].score,b=rows[i+1].score;
      if(a>0&&b>0&&a/b>=1.8){wall={pos:i+1,from:a,to:b,ratio:a/b};break;}
    }
    if(!wall&&rows.length>=5){
      let best=null;
      for(let i=1;i<rows.length-1;i++){
        const a=rows[i].score,b=rows[i+1].score;if(a<=0||b<0)continue;
        const diff=a-b,ratio=b>0?a/b:99,metric=ratio+diff/20;
        if(!best||metric>best.metric)best={pos:i+1,from:a,to:b,ratio,metric};
      }
      if(best&&best.ratio>=1.35)wall=best;
    }
    const front=wall?rows.slice(Math.max(0,wall.pos-2),wall.pos):[];
    return {rows,wall,front,label:'擬似複勝15倍壁前（連系支持断層換算）'};
  }
  function noteGroups(notes){
    const set=new Set(),counts={};
    (notes||[]).forEach(n=>{
      let g='other';
      if(/単勝/.test(n))g='単勝';
      else if(/2車複/.test(n))g='2車複';
      else if(/ワイド/.test(n))g='ワイド';
      else if(/3連系|三連/.test(n))g='3連系';
      else if(/試走|偏差|ST|ハンデ|前位置|内枠/.test(n))g='走行位置';
      else if(/メジアン/.test(n))g='メジアン';
      else if(/壁/.test(n))g='壁';
      set.add(g);counts[g]=(counts[g]||0)+1;
    });
    return {set,counts};
  }
  function applySupportCaps(res){
    const d=res.data||{},demoted=[];
    (res.candidates||[]).forEach(x=>{
      const n=topCount(d.niren,x.car,10),w=topCount(d.wide,x.car,10),s=topCount(d.sanren,x.car,10);
      x.v2424Support={n,w,s,total:n+w+s};
      if(n+w+s===0){
        x.score-=30;
        if(!(x.notes||[]).includes('連系支持ゼロ・本線降格'))x.notes.push('連系支持ゼロ・本線降格');
        demoted.push({car:x.car,type:'zero',n,w,s});
      }else if(s===0&&n+w<=1){
        x.score-=14;
        if(!(x.notes||[]).includes('三連系支持ほぼゼロ・5番手保険'))x.notes.push('三連系支持ほぼゼロ・5番手保険');
        demoted.push({car:x.car,type:'weak',n,w,s});
      }
      const g=noteGroups(x.notes);
      x.independentKinds=[...g.set].filter(k=>k!=='other').length;
      const dup=Object.values(g.counts).reduce((z,v)=>z+Math.max(0,v-2),0);
      if(dup>0){
        const cut=Math.min(12,dup*3);x.score-=cut;
        if(!(x.notes||[]).includes('同系統重複加点上限'))x.notes.push('同系統重複加点上限');
      }
    });
    res.supportDemotions=demoted;
  }
  function applyWallMedianBonus(res){
    const wm=res.wallInside||{};
    const hits={};
    Object.entries(wm).forEach(([name,v])=>(v.median||[]).forEach(car=>{
      hits[car]=hits[car]||[];hits[car].push(name);
    }));
    Object.entries(hits).forEach(([car,names])=>{
      const x=candidate(res,Number(car));if(!x)return;
      const bonus=Math.min(18,names.length*5);x.score+=bonus;
      x.wallInsideMedian=names.slice();
      if(!(x.notes||[]).some(n=>n.startsWith('壁内メジアン')))x.notes.push(`壁内メジアン${names.length}表`);
    });
  }
  function applyPseudoBonus(res){
    const p=res.pseudoPlace;if(!p)return;
    (p.front||[]).forEach((r,i)=>{
      const x=candidate(res,r.car);if(!x)return;
      x.score+=i===p.front.length-1?14:10;
      x.pseudoPlaceWall=true;
      if(!(x.notes||[]).includes('擬似複勝15倍壁前'))x.notes.push('擬似複勝15倍壁前');
    });
  }
  function buildFourLock(res){
    const d=res.data||{},cars=allCars(d),arr=[];
    const rowNames=['単勝','2車複','ワイド','3連系'];
    cars.forEach(car=>{
      const ranks=rowNames.map(n=>{const i=(res.rows&&res.rows[n]||[]).indexOf(car);return i<0?999:i+1;});
      const presence=ranks.filter(r=>r<=5).length;
      const rankSum=ranks.reduce((z,r)=>z+(r<999?r:9),0);
      const n=topCount(d.niren,car,8),w=topCount(d.wide,car,10),s=topCount(d.sanren,car,12);
      const stability=presence*30-rankSum+n*4+w*5+s*3;
      arr.push({car,presence,rankSum,n,w,s,stability});
    });
    arr.sort((a,b)=>b.stability-a.stability||b.presence-a.presence||a.rankSum-b.rankSum||a.car-b.car);
    const top4=arr.slice(0,4);
    const on=top4.length===4&&top4.every(x=>x.presence>=3)&&top4[3].stability>=72;
    const topSet=new Set(top4.map(x=>x.car));
    const outside=[];
    arr.slice(4).forEach(z=>{
      const x=candidate(res,z.car),hp=d.handicap&&d.handicap[z.car];
      const minHan=Math.min(...Object.values(d.handicap||{}).map(h=>h.handicap).filter(Number.isFinite));
      const minTrial=Math.min(...Object.values(d.handicap||{}).map(h=>h.trial).filter(Number.isFinite));
      const checks=[];
      if(x&&x.wallInsideMedian&&x.wallInsideMedian.length)checks.push('壁内メジアン');
      if(x&&x.pseudoPlaceWall)checks.push('擬似複勝壁前');
      if(hp&&Number.isFinite(hp.handicap)&&hp.handicap===minHan)checks.push('前位置');
      if(hp&&Number.isFinite(hp.trial)&&hp.trial<=minTrial+0.02)checks.push('試走上位');
      if(firstRank(d.sanren,z.car)<=5)checks.push('三連系先行');
      if(z.n>=2&&z.w>=2)checks.push('2車複・ワイド重複');
      if(x&&x.independentKinds>=5)checks.push('独立5系統');
      if(checks.length>=3)outside.push({car:z.car,checks,score:x?.score||0,stability:z.stability});
    });
    outside.sort((a,b)=>b.checks.length-a.checks.length||b.score-a.score||b.stability-a.stability||a.car-b.car);
    const released=on&&outside.length>0;
    return {on,top4,topSet:[...topSet],released,external:outside,judge:!on?'非発動':released?'解除・外部穴優先':'四強安定ロック'};
  }
  function buildHeadTrust(res){
    const d=res.data||{},cars=allCars(d),missing=new Set((d.tanMissingCars||[]).map(Number)),out=[];
    const trials=Object.entries(d.handicap||{}).map(([car,h])=>({car:Number(car),trial:h.trial})).filter(x=>Number.isFinite(x.trial)).sort((a,b)=>a.trial-b.trial);
    const trialRank=new Map(trials.map((x,i)=>[x.car,i+1]));
    cars.forEach(car=>{
      const tr=tanRank(d,car),tan=(d.tansho||[]).find(x=>x.car===car),n=topCount(d.niren,car,6),w=topCount(d.wide,car,8),s=topCount(d.sanren,car,10);
      let score=0,reasons=[];
      if(tr===1){score+=32;reasons.push('単勝1位');}else if(tr===2){score+=22;reasons.push('単勝2位');}else if(tr===3){score+=14;reasons.push('単勝3位');}else if(tr<=5)score+=7;
      score+=Math.min(20,n*5)+Math.min(20,w*4)+Math.min(24,s*3);
      if(n>=3&&w>=3&&s>=5){score+=14;reasons.push('連系三面支持');}
      const rr=trialRank.get(car)||999;if(rr===1){score+=14;reasons.push('試走最上位');}else if(rr===2){score+=8;reasons.push('試走2位');}
      const x=candidate(res,car);
      if(x&&x.wallInsideMedian&&x.wallInsideMedian.length){score+=8;reasons.push('壁内メジアン');}
      if(x&&x.pseudoPlaceWall){score+=5;reasons.push('擬似複勝壁前');}
      if(x&&x.v2424Support&&x.v2424Support.total===0){score-=40;reasons.push('連系支持ゼロ');}
      if(tan&&tan.odds>=40){score-=16;reasons.push('単勝40倍以上');}
      if(missing.has(car)){score=-999;reasons.push('単勝欠損');}
      const grade=score>=95?'SSS':score>=80?'SS':score>=65?'S':score>=50?'A':'B';
      out.push({car,score,grade,tr,odds:tan?.odds??999,n,w,s,trialRank:rr,reasons});
    });
    return out.sort((a,b)=>b.score-a.score||a.tr-b.tr||a.odds-b.odds||a.car-b.car);
  }
  function addProtectCombos(res){
    const d=res.data||{},existing=new Set((res.protect||[]).map(x=>x.key));
    const add=[];
    function push(cars,reason){
      const u=uniq(cars).sort((a,b)=>a-b);if(u.length!==3)return;
      const key=u.join('-');if(existing.has(key))return;
      const item=(d.sanren||[]).find(x=>x.key===key);if(!item)return;
      existing.add(key);add.push({key,reason,cars:u});
    }
    const lock=res.fourLock;
    if(lock&&lock.on&&!lock.released){
      const a=lock.top4.map(x=>x.car);
      for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++)for(let k=j+1;k<a.length;k++)push([a[i],a[j],a[k]],'四強安定ロック');
    }
    if(lock&&lock.released&&lock.external[0]){
      const h=lock.external[0].car,core=lock.top4.slice(0,3).map(x=>x.car);
      for(let i=0;i<core.length;i++)for(let j=i+1;j<core.length;j++)push([h,core[i],core[j]],'四強ロック解除・外部穴');
    }
    const pf=(res.pseudoPlace&&res.pseudoPlace.front||[]).map(x=>x.car);
    const head=res.headTrust&&res.headTrust[0]?.car;
    if(head&&pf.length>=2)push([head,pf[0],pf[1]],'1着軸信頼度×擬似複勝壁前');
    res.protect=[...add,...(res.protect||[])];
  }

  window.analyze=function(p){
    const res=V2423_analyze(p);

  function reorderBox(res,base){
    const zero=new Set((res.supportDemotions||[]).filter(x=>x.type==='zero').map(x=>x.car));
    const lock=res.fourLock;

    if(lock&&lock.on&&!lock.released)order.push(...lock.top4.map(x=>x.car));
    else if(lock&&lock.released){order.push(...lock.top4.slice(0,3).map(x=>x.car),lock.external[0]?.car);}
    order.push(...(base||[]),...(res.pseudoPlace?.front||[]).map(x=>x.car),...(res.candidates||[]).map(x=>x.car));
    order=uniq(order).filter(c=>!zero.has(c));
    const fallback=uniq([...(base||[]),...(res.candidates||[]).map(x=>x.car)]).filter(c=>zero.has(c));
    return uniq([...order,...fallback]);

  function bestOne(res,head,secondBox,thirdBox){
    const d=res.data||{};let best=null;

      if(!best||s.odds<best.odds)best=s;
    });
    if(best){const rest=best.cars.filter(c=>c!==head);return `${head}${rest.join('')}`;}
    return secondBox.length>=2?`${head}${secondBox[0]}${secondBox[1]}`:String(head);
  }
  window.predictFormation=function(res){
    const base=V2423_predictFormation(res);if(!base)return base;
    const trust=res.headTrust||[],best=trust[0],current=trust.find(x=>x.car===base.head);
    let head=base.head,mode=res.headDecision?.mode||'V24.23';
    const absolute=res.headLock&&res.headLock.type==='absolute';
    if(!absolute&&best&&best.score>=(current?.score??-999)+12&&best.grade!=='B'){
      head=best.car;mode=`1着軸信頼度${best.grade}`;
    }else if(best&&best.car===head){mode=`1着軸信頼度${best.grade}`;}
    const order=reorderBox(res,base.secondBox||base.box||[]).filter(c=>c!==head);
    let secondBox;
    if(res.fourLock&&res.fourLock.on&&!res.fourLock.released){secondBox=res.fourLock.top4.map(x=>x.car).filter(c=>c!==head).slice(0,3);}
    else if(res.fourLock&&res.fourLock.released){
      secondBox=uniq([res.fourLock.external[0]?.car,...res.fourLock.top4.map(x=>x.car),...order]).filter(c=>c!==head).slice(0,3);
    }else secondBox=order.slice(0,3);
    const thirdBox=uniq([...secondBox,...(res.pseudoPlace?.front||[]).map(x=>x.car),...(res.thirdOnly||[]).map(x=>x.car)]).filter(c=>c!==head).slice(0,4).sort((a,b)=>a-b);
    secondBox=secondBox.sort((a,b)=>a-b);
    const cover=uniq([base.cover,res.marketAxis,(res.data.tansho||[])[0]?.car,...secondBox]).find(c=>c&&c!==head)||secondBox[0];
    const one=bestOne(res,head,secondBox,thirdBox);
    const baseHead=res.headDecision?.baseHead||base.head;
    res.headDecision={head,baseHead,mode,headChanged:head!==baseHead,secondBox:secondBox.slice(),thirdBox:thirdBox.slice()};
    return {head,box:secondBox,secondBox,thirdBox,boxStr:secondBox.join(''),cover,one,
      main:`${head}-${secondBox.join('')}-${thirdBox.join('')}`,
      osa:`${cover}-${head}-${thirdBox.join('')}`,
      note:`${mode}。${res.fourLock?.on?(res.fourLock.released?'四強ロック解除で外部穴を相手箱へ追加。':'四強安定ロックを相手箱へ固定。'):'連系支持と壁内メジアンを優先。'} 連系支持ゼロ車は本線から降格。`};
  };

  window.detectAutoWild5Box=function(res){
    const wild=V2423_detectAutoWild5Box(res);if(!wild||!wild.on)return wild;
    const lock=res.fourLock,zero=new Set((res.supportDemotions||[]).filter(x=>x.type==='zero').map(x=>x.car));
    const fixed=[];
    if(lock&&lock.on&&!lock.released)fixed.push(...lock.top4.map(x=>x.car));
    if(lock&&lock.released)fixed.push(...lock.top4.slice(0,3).map(x=>x.car),lock.external[0]?.car);
    fixed.push(...(res.pseudoPlace?.front||[]).map(x=>x.car));
    const pool=uniq([...fixed,...(wild.box||[]),...(res.candidates||[]).map(x=>x.car)]);
    pool.sort((a,b)=>{
      const af=fixed.includes(a)?1:0,bf=fixed.includes(b)?1:0;if(af!==bf)return bf-af;
      const az=zero.has(a)?1:0,bz=zero.has(b)?1:0;if(az!==bz)return az-bz;
      return (candidate(res,b)?.score||0)-(candidate(res,a)?.score||0)||a-b;
    });
    wild.box=pool.slice(0,5).sort((a,b)=>a-b);
    wild.pairs=[];wild.tris=[];
    for(let i=0;i<wild.box.length;i++)for(let j=i+1;j<wild.box.length;j++)wild.pairs.push([wild.box[i],wild.box[j]].join('-'));
    for(let i=0;i<wild.box.length;i++)for(let j=i+1;j<wild.box.length;j++)for(let k=j+1;k<wild.box.length;k++)wild.tris.push([wild.box[i],wild.box[j],wild.box[k]].join('-'));
    wild.single=wild.box.filter(c=>(res.data.tansho||[]).some(x=>x.car===c&&x.odds>0&&x.odds!==999)).map(String);
    wild.v2424Lock=lock;wild.v2424Demoted=[...zero];wild.v2424Pseudo=(res.pseudoPlace?.front||[]).map(x=>x.car);
    wild.reason=wild.reason||[];
    if(lock&&lock.on)wild.reason.push(lock.released?'上位4車ロック解除・外部穴を強制保護':'上位4車安定ロックを5車BOXへ固定');
    if(zero.size)wild.reason.push('連系支持ゼロ車は本線から降格し5番手保険化');
    if(wild.v2424Pseudo.length)wild.reason.push('擬似複勝15倍壁前を3着穴として保護');
    return wild;
  };

  function trustCard(res){
    const a=(res.headTrust||[]).slice(0,4);if(!a.length)return'';
    return `<div class="card v2424 trust"><h2>🔥V24.24 1着軸信頼度</h2>${a.map((x,i)=>`<div class="line"><span class="badge ${i===0?'green':'blue'}">${i+1}位 ${x.car}号車 ${x.grade} / ${x.score}点</span> 単勝${x.tr===999?'欠損':x.tr+'位'}・2車複${x.n}回・ワイド${x.w}回・3連系${x.s}回</div><div class="mini">${x.reasons.join('・')||'総合支持'}</div>`).join('')}<div class="mini" style="margin-top:8px">単勝だけでなく、2車複・ワイド・3連系・試走を合わせて頭固定の強さを判定。</div></div>`;
  }
  function lockCard(res){
    const l=res.fourLock;if(!l)return'';
    return `<div class="card v2424 lock"><h2>🔒V24.24 上位4車安定ロック</h2><div class="big">判定：${l.judge}</div><div style="margin:8px 0">四強：${l.top4.map(x=>carSpan(x.car)).join(' ')}</div>${l.external.length?`<div><span class="badge pink">外部穴</span> ${l.external.map(x=>`${carSpan(x.car)} ${x.checks.join('・')}`).join('<br>')}</div>`:''}<div class="mini">同じ4車が4券種で繰り返し上位なら固定。外部車が独立3条件以上を満たすと解除。</div></div>`;
  }
  function pseudoCard(res){
    const p=res.pseudoPlace;if(!p)return'';
    const front=p.front||[];
    return `<div class="card v2424 pseudo"><h2>🧩V24.24 擬似複勝15倍壁前</h2><div class="big">${p.wall?`支持断層：${p.wall.pos}位後 ${p.wall.from}→${p.wall.to}`:'明確な断層なし'}</div><div style="margin:8px 0">壁前：${front.length?front.map(x=>`${carSpan(x.car)} 支持${x.score}`).join(' '):'なし'}</div><div class="mini">2車複・ワイド・3連系の登場回数と初出順位から擬似複勝支持を作成。単勝穴でも車券内支持が残る車を3着穴として保護。</div></div>`;
  }
  function wallCard(res){
    const w=res.wallInside||{};const names=['単勝','2車複','ワイド','3連系'];
    return `<div class="card v2424"><h2>📊V24.24 券種別・壁内メジアン</h2>${names.map(n=>{const x=w[n]||{};return `<div class="line"><b>${n}</b>：${x.wall?`${x.wall.pos}位後 1.8倍壁 / メジアン ${x.median.map(carSpan).join(' ')||'なし'}`:'1.8倍壁なし'}</div>`}).join('')}<div class="mini">単勝は頭、2車複は連対、ワイドと3連系は車券内の役割として使用。</div></div>`;
  }
  function demotionCard(res){
    const a=res.supportDemotions||[];if(!a.length)return'';
    return `<div class="card v2424 demotion"><h2>⬇️V24.24 連系支持ゼロ降格</h2>${a.map(x=>`<div class="line">${carSpan(x.car)} ${x.type==='zero'?'本線降格':'5番手保険'} / 2車複${x.n}・ワイド${x.w}・3連系${x.s}</div>`).join('')}<div class="mini">候補点が高くても連系市場に出ていない車は、頭・本線核に固定しません。</div></div>`;
  }
  function textSummary(res){
    const l=res.fourLock||{},p=res.pseudoPlace||{},head=(res.headTrust||[])[0];
    const wm=res.wallInside||{};
    return `🔥V24.24 1着軸信頼度\n${head?`${head.car}号車 ${head.grade} / ${head.score}点 / 2車複${head.n}・ワイド${head.w}・3連系${head.s}`:'なし'}\n\n🔒上位4車安定ロック\n判定：${l.judge||'非発動'}\n四強：${(l.top4||[]).map(x=>x.car+'号車').join('・')||'なし'}${l.external&&l.external.length?'\n外部穴：'+l.external.map(x=>x.car+'号車('+x.checks.join('・')+')').join(' / '):''}\n\n📊券種別・壁内メジアン\n${['単勝','2車複','ワイド','3連系'].map(n=>`${n}：${wm[n]?.median?.map(c=>c+'号車').join('・')||'なし'}`).join('\n')}\n\n🧩擬似複勝15倍壁前\n${(p.front||[]).map(x=>x.car+'号車').join('・')||'なし'}${res.supportDemotions&&res.supportDemotions.length?'\n\n⬇️連系支持ゼロ/薄い車\n'+res.supportDemotions.map(x=>x.car+'号車 '+(x.type==='zero'?'本線降格':'5番手保険')).join('\n'):''}`;
  }
  function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

  window.render=function(res){
    let html=V2423_render(res).replace(/V24\.23/g,'V24.24');
    const summary=textSummary(res);
    latestCopyText=(latestCopyText||'').replace(/V24\.23/g,'V24.24')+`\n\n${summary}`;
    const marker='<div class="card"><h2>コピペ用フル結果</h2>';
    const idx=html.lastIndexOf(marker);
    const prefix=idx>=0?html.slice(0,idx):html;
    return trustCard(res)+lockCard(res)+wallCard(res)+pseudoCard(res)+demotionCard(res)+prefix+`<div class="card"><h2>コピペ用フル結果</h2><div class="mini">「結果コピー」でV24.24補正を含む全文をコピーできます。</div><pre class="copybox">${esc(latestCopyText)}</pre></div>`;
  };
})();
</script>
