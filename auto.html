<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>チャッピー神予想 オート版V4</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#07101f;color:#fff;padding:14px;margin:0;font-size:20px}
h1{color:#ffd66b;font-size:32px}
textarea,input{width:100%;box-sizing:border-box;background:#050912;color:#fff;border:2px solid #33415c;border-radius:14px;padding:12px;font-size:20px;margin:8px 0}
textarea{height:310px;font-family:monospace}
button{width:100%;padding:16px;border:0;border-radius:16px;font-size:24px;font-weight:bold;background:#ffd66b;color:#000;margin:8px 0}
.box{background:#111b2e;border:2px solid #33415c;border-radius:18px;padding:14px;margin:14px 0}
.alert{border:3px solid #33415c;border-radius:24px;padding:16px;margin:14px 0}
.scroll{overflow-x:auto;border:3px solid #ffd66b;border-radius:18px;margin:12px 0}
table{border-collapse:collapse;min-width:950px;font-size:22px}
td{border:1px solid #33415c;padding:12px;text-align:center;white-space:nowrap}
.head{background:#152036;color:#ffd66b;font-weight:bold}
.blue{color:#4da3ff;font-size:28px;font-weight:bold}
.red{color:#ff4d4d;font-size:28px;font-weight:bold}
.yellow{color:#ffd966;font-size:28px;font-weight:bold}
pre{white-space:pre-wrap;line-height:1.75;font-size:22px;font-weight:bold}
</style>
</head>
<body>

<h1>🏍️ チャッピー神予想<br>オート版V4</h1>

<div class="box">
<input id="race" placeholder="例：浜松3R">
<textarea id="odds" placeholder="[TAN]
7 2.0
6 2.9
8 3.0

[NISHA]
7-8 3.0
6-7 3.3

[SANREN]
6-7-8 2.2
4-7-8 5.4"></textarea>
<button onclick="analyze()">分析する</button>
<button onclick="sample()">サンプル</button>
</div>

<div id="out" class="box">ここに結果が出ます。</div>

<script>
function norm(s){
  return String(s)
    .replace(/[０-９]/g,x=>String.fromCharCode(x.charCodeAt(0)-65248))
    .replace(/－/g,'-')
    .replace(/=/g,'-');
}
function toNum(v){return parseFloat(norm(v).replace(/[^\d.]/g,''));}
function splitH(s){return norm(s).split('-').map(x=>x.trim()).filter(Boolean);}
function med(arr){
  if(!arr.length)return '-';
  const n=arr.length;
  return n%2 ? arr[Math.floor(n/2)] : arr[n/2-1]+'・'+arr[n/2];
}
function uniq(arr){return arr.filter((v,i,a)=>v&&a.indexOf(v)===i);}

function parseData(){
  const lines=norm(document.getElementById('odds').value).split(/\n/).map(x=>x.trim()).filter(Boolean);
  let sec='tan';
  const tan=[], nisha=[], san=[];
  for(const line of lines){
    const u=line.toUpperCase();
    if(u.includes('TAN')||line.includes('単勝')){sec='tan';continue;}
    if(u.includes('NISHA')||line.includes('2車複')||line.includes('２車複')){sec='nisha';continue;}
    if(u.includes('SANREN')||line.includes('3連複')||line.includes('３連複')){sec='san';continue;}
    const p=line.split(/\s+/);
    if(p.length<2)continue;
    const odds=toNum(p[1]);
    if(!odds)continue;
    if(sec==='tan')tan.push({car:p[0],odds});
    if(sec==='nisha')nisha.push({pair:p[0],odds,hs:splitH(p[0])});
    if(sec==='san')san.push({pair:p[0],odds,hs:splitH(p[0])});
  }
  tan.sort((a,b)=>a.odds-b.odds);
  nisha.sort((a,b)=>a.odds-b.odds);
  san.sort((a,b)=>a.odds-b.odds);
  return {tan,nisha,san};
}

function otani(tan,nisha){
  const axis=tan[0]?.car||'';
  const cars=[axis], odds=['-'];
  nisha.filter(x=>x.hs.includes(axis)).forEach(x=>{
    const other=x.hs.find(h=>h!==axis);
    if(other&&!cars.includes(other)){
      cars.push(other);
      odds.push(x.odds);
    }
  });
  return {axis,cars,odds};
}

function mainTable(tan,o){
  const max=Math.max(tan.length,o.cars.length);
  let h='<div class="scroll"><table>';
  h+='<tr><td class="head">順位</td>';
  for(let i=1;i<=max;i++)h+='<td>'+i+'</td>';
  h+='</tr><tr><td class="head">単勝</td>';
  for(let i=0;i<max;i++)h+='<td>'+(tan[i]?.car||'')+'</td>';
  h+='</tr><tr><td class="head">単勝オッズ</td>';
  for(let i=0;i<max;i++)h+='<td>'+(tan[i]?.odds||'')+'</td>';
  h+='</tr><tr><td class="head">2車複</td>';
  for(let i=0;i<max;i++)h+='<td>'+(o.cars[i]||'')+'</td>';
  h+='</tr><tr><td class="head">2車複オッズ</td>';
  for(let i=0;i<max;i++)h+='<td>'+(o.odds[i]||'')+'</td>';
  h+='</tr></table></div>';
  return h;
}

function analyze(){
  const race=document.getElementById('race').value||'レース名未入力';
  const {tan,nisha,san}=parseData();
  if(!tan.length){out.innerHTML='単勝データがありません';return;}

  const o=otani(tan,nisha);
  const axis=o.axis;

  const under10=tan.filter(x=>x.odds<10).map(x=>x.car);
  const raceType=under10.length<=3?'🔵本命型':under10.length===4?'🟢上位集中型':under10.length===5?'🟡中穴型':'🔴荒れ警戒型';

  const san15=san.filter(x=>x.odds<=15);
  let firstOut='15倍以内すべて入り';
  for(let i=0;i<san15.length;i++){
    if(!san15[i].hs.includes(axis)){
      firstOut=(i+1)+'位で消滅';
      break;
    }
  }

  let safe='🔵超有力';
  if(firstOut!=='15倍以内すべて入り'){
    const n=parseInt(firstOut);
    safe=n<=5?'🔴危険':n<=10?'🟡注意':'🟢有力';
  }

  const isDangerAxis=safe.includes('危険');
  const isCautionAxis=safe.includes('注意');

  const tanRank={};
  tan.forEach((x,i)=>tanRank[x.car]=i+1);
  const niRank={};
  o.cars.forEach((c,i)=>niRank[c]=i+1);

  const moves=Object.keys(tanRank)
    .filter(c=>niRank[c])
    .map(c=>({car:c,m:Math.abs(tanRank[c]-niRank[c])}))
    .sort((a,b)=>b.m-a.m || Number(a.car)-Number(b.car));

  const tanCars=tan.map(x=>x.car);
  const niCars=o.cars;

  const mTanAll=med(tanCars);
  const mTan10=med(tan.filter(x=>x.odds<10).map(x=>x.car));
  const mTanOver=med(tan.filter(x=>x.odds>=10).map(x=>x.car));

  const mNiAll=med(niCars);
  const mNi10=med(o.cars.filter((c,i)=>i===0||Number(o.odds[i])<10));
  const mNiOver=med(o.cars.filter((c,i)=>i>0&&Number(o.odds[i])>=10));

  const medText=[mTanAll,mTan10,mTanOver,mNiAll,mNi10,mNiOver].join('・').split('・');
  const count={};
  medText.forEach(c=>{
    if(c&&c!=='-')count[c]=(count[c]||0)+1;
  });

  const dup=Object.entries(count)
    .filter(x=>x[1]>=2)
    .sort((a,b)=>b[1]-a[1])
    .map(x=>x[0]+'('+x[1]+')');

  const dupCars=dup.map(x=>x.replace(/\(.*/,''));

  const bottom=med(tan.slice(Math.floor(tan.length/2)).map(x=>x.car));
  const bottomCars=String(bottom).split('・').filter(x=>x&&x!=='-');

  const dangerPopular=tan.slice(1,5).filter(x=>{
    const r=niRank[x.car]||99;
    const inMed=count[x.car]||0;
    return r>=5 && inMed===0;
  }).map(x=>x.car);

  let A=dupCars.slice(0,2);
  if(A.length<2){
    under10.forEach(c=>{
      if(!A.includes(c)&&A.length<2)A.push(c);
    });
  }
  if(A.length<2){
    moves.forEach(x=>{
      if(!A.includes(x.car)&&A.length<2)A.push(x.car);
    });
  }

  let C=bottomCars.filter(c=>!A.includes(c)).slice(0,2);
  if(!C.length){
    tan.slice(Math.floor(tan.length/2)).forEach(x=>{
      if(!A.includes(x.car)&&!C.includes(x.car)&&C.length<2)C.push(x.car);
    });
  }

  let firstA=A.slice();

  if(isDangerAxis || isCautionAxis){
    firstA=firstA.filter(c=>c!==axis);
  }

  if(!firstA.length){
    moves.forEach(x=>{
      if(x.car!==axis&&!firstA.includes(x.car))firstA.push(x.car);
    });
  }

  firstA=firstA.slice(0,2);
  const secondA=A.slice();

  const twoMain=[];
  firstA.forEach(a=>{
    secondA.forEach(b=>{
      if(a!==b && twoMain.length<6)twoMain.push(a+'→'+b);
    });
  });

  const twoHole=[];
  firstA.forEach(a=>{
    C.forEach(c=>{
      if(a!==c)twoHole.push(a+'→'+c);
    });
  });

  if(isDangerAxis || isCautionAxis){
    firstA.forEach(a=>{
      if(a!==axis)twoHole.push(a+'→'+axis);
    });
  }

  const triMain=[];
  firstA.forEach(a=>{
    secondA.forEach(b=>{
      C.forEach(c=>{
        if(a!==b && b!==c && a!==c && triMain.length<8){
          triMain.push(a+'-'+b+'-'+c);
        }
      });
    });
  });

  const triHole=[];
  firstA.forEach(a=>{
    C.forEach(c=>{
      secondA.forEach(b=>{
        if(a!==b && b!==c && a!==c && triHole.length<8){
          triHole.push(a+'-'+c+'-'+b);
        }
      });
    });
  });

  if(isDangerAxis || isCautionAxis){
    firstA.forEach(a=>{
      secondA.forEach(b=>{
        if(a!==b && a!==axis && b!==axis){
          triHole.push(a+'-'+b+'-'+axis);
        }
      });
    });
  }

  out.innerHTML=
  '<h2>'+race+'</h2>'+
  '<div class="alert"><div class="yellow">📊 レース判定</div>'+raceType+'<br>単勝10倍以内：'+under10.length+'車<br>'+under10.join('・')+'</div>'+
  '<div class="alert"><div class="blue">🔵 危険な1番人気診断</div>1番人気：'+axis+'<br>3連複15倍以内：'+san15.length+'組<br>初消滅：'+firstOut+'<br>判定：'+safe+'</div>'+
  '<div class="alert"><div class="red">🔴 危険な人気車</div>'+(dangerPopular.length?dangerPopular.join('・'):'なし')+'</div>'+
  '<div class="yellow">📊 本表</div>'+mainTable(tan,o)+
  '<pre>'+
  '🔄【移動数】\n'+moves.map(x=>x.car+'：'+x.m+'移動').join('\n')+
  '\n\n🟡【メジアン】\n単勝全体：'+mTanAll+
  '\n単勝10倍以内：'+mTan10+
  '\n単勝10倍以上：'+mTanOver+
  '\n\n2車複全体：'+mNiAll+
  '\n2車複10倍以内：'+mNi10+
  '\n2車複10倍以上：'+mNiOver+
  '\n\n🔥【メジアン重複】\n'+(dup.join('・')||'なし')+
  '\n\n⚫【ボトム値】\n'+bottom+
  '\n\n🟢【本線車 A】\n'+(A.join('・')||'なし')+
  '\n\n⚫【ボトム穴 C】\n'+(C.join('・')||'なし')+
  '\n\n🏍️【本線2車単】\n'+(twoMain.join('\n')||'なし')+
  '\n\n⚫【穴2車単】\n'+(twoHole.join('\n')||'なし')+
  '\n\n🏍️【本線3連単】\n'+(triMain.join('\n')||'なし')+
  '\n\n⚫【穴3連単】\n'+(triHole.join('\n')||'なし')+
  '</pre>';
}

function sample(){
race.value='浜松3R';
odds.value='[TAN]\n7 2.0\n6 2.9\n8 3.0\n2 9.4\n4 14.1\n1 15.1\n3 32.4\n\n[NISHA]\n7-8 3.0\n6-7 3.3\n6-8 4.0\n4-7 11.6\n4-8 15.2\n4-6 18.3\n2-6 22.1\n2-7 22.9\n3-7 27.8\n2-8 30.5\n3-8 33.7\n1-7 35.6\n3-6 41.3\n1-8 42.7\n2-3 61.0\n3-4 67.4\n2-4 71.2\n1-6 75.4\n1-2 106.8\n1-3 106.8\n\n[SANREN]\n6-7-8 2.2\n4-7-8 5.4\n4-6-7 8.4\n4-6-8 12.0\n2-7-8 16.6\n3-7-8 18.8\n2-6-7 20.3\n3-6-7 21.9\n1-7-8 23.8\n3-6-8 29.9';
analyze();
}
</script>
</body>
</html>
