<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>オート研究所 V1.02 本番蓄積版</title>
<style>
:root{
  --bg:#07111f;--card:#0f1d35;--card2:#122544;--line:#304965;
  --text:#fff;--muted:#a8bad0;--cyan:#67e8f9;--green:#4ade80;
  --red:#fb7185;--yellow:#fde047;--blue:#60a5fa
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;padding:8px 8px calc(26px + env(safe-area-inset-bottom))}
.wrap{max-width:980px;margin:auto}
h1{font-size:21px;margin:4px 0}.sub,.note{color:var(--muted);font-size:12px;line-height:1.65}
.tabs{display:flex;gap:6px;overflow:auto;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:5}
.tab{white-space:nowrap;background:#10223e;color:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 11px}
.tab.active{color:var(--cyan);border-color:var(--cyan)}
.panel{display:none}.panel.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.card h2{color:var(--cyan);font-size:16px;margin:0 0 8px}
textarea{width:100%;min-height:460px;background:#071428;color:#fff;border:1px solid #38526f;border-radius:10px;padding:10px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.55}
input{width:100%;background:#071428;color:#fff;border:1px solid #38526f;border-radius:8px;padding:8px}
button{border:0;border-radius:9px;padding:10px 13px;font-weight:700;color:#fff;background:#2563eb}
button.green{background:#15803d}button.gray{background:#475569}button.red{background:#be123c}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px}.stat b{font-size:18px;color:var(--cyan)}
.item{background:#0a172b;border:1px solid var(--line);border-radius:9px;padding:8px;margin:6px 0}
.good{color:var(--green)}.bad{color:var(--red)}.warn{color:var(--yellow)}
.kpi{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#17375f;color:#dbeafe;font-size:11px}
@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}textarea{min-height:390px}}
</style>
</head>
<body>
<div class="wrap">
<h1>🏁 オート研究所 V1.02</h1>
<div class="sub">入力場所は1か所だけ。チャッピーの1レース分コードを丸ごと貼って保存。</div>

<div class="tabs">
  <button class="tab active" data-tab="paste">一括登録</button>
  <button class="tab" data-tab="players">選手DB</button>
  <button class="tab" data-tab="data">保存・出力</button>
</div>

<section id="paste" class="panel active">
  <div class="card">
    <h2>一括貼り登録</h2>
    <div class="note">
      ここだけ使えばOK。今回情報・出走・結果・前10走・2車複・2車単・3連単を1本のコードで登録します。
      V1.02では <b>湿度</b>、<b>事前ST</b>、<b>実ST</b> を分離して保存します。
    </div>
    <textarea id="bulk" placeholder="【2026年8月11日 浜松1R】

[RACE]
TRACK 湿
WEATHER 曇
TEMP 27.0
HUMIDITY 78
TRACK_TEMP 31.0

[ENTRY]
1 柴本真樹 0 B-135(B-140) 3.79 0.19 0.073 7 3.855
2 伊藤弘幸 30 B-11(B-3) 3.71 0.19 0.089 1 3.732

[RESULT]
2-6-7-4-3-5-1

[PAST]
柴本真樹|2026-08-06,浜松,8,3,0,3.42,0.11,3.552,良
...

[ODDS_2FUKU]
2-4 3.3
2-6 3.7
...

[ODDS_2TAN]
2-6 5.7
...

[ODDS_3TAN]
2-4-7 14.7
..."></textarea>

    <div class="actions">
      <button id="check">解析確認</button>
      <button class="green" id="save">保存</button>
      <button class="gray" id="clearBox">入力欄クリア</button>
    </div>
    <div id="msg" class="note"></div>
  </div>

  <div class="card">
    <h2>解析確認</h2>
    <div id="preview" class="note">まだ解析していません。</div>
  </div>
</section>

<section id="players" class="panel">
  <div class="card">
    <h2>選手DB</h2>
    <input id="search" placeholder="選手名で検索">
    <div id="playerList"></div>
  </div>
</section>

<section id="data" class="panel">
  <div class="card">
    <h2>登録状況</h2>
    <div class="stats">
      <div class="stat">レース<br><b id="nRaces">0</b></div>
      <div class="stat">選手<br><b id="nPlayers">0</b></div>
      <div class="stat">出走記録<br><b id="nEntries">0</b></div>
      <div class="stat">前走記録<br><b id="nPast">0</b></div>
      <div class="stat">オッズ<br><b id="nOdds">0</b></div>
    </div>
  </div>

  <div class="card">
    <h2>バックアップ</h2>
    <div class="actions">
      <button id="csv">CSV書出し</button>
      <button id="json">JSONバックアップ</button>
      <label style="display:inline-block"><span class="tab">JSON読込</span><input id="importJson" type="file" accept=".json" style="display:none"></label>
    </div>
  </div>

  <div class="card">
    <h2>危険操作</h2>
    <button class="red" id="deleteAll">全データ削除</button>
  </div>
</section>
</div>

<script>
const DB='auto_lab_v102',VER=1;
let db=null,lastParsed=null;
const $=id=>document.getElementById(id);
const num=v=>{const x=parseFloat(v);return Number.isFinite(x)?x:null};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function openDB(){
  return new Promise((ok,ng)=>{
    const r=indexedDB.open(DB,VER);
    r.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains('races'))d.createObjectStore('races',{keyPath:'id'});
      if(!d.objectStoreNames.contains('past'))d.createObjectStore('past',{keyPath:'id'});
    };
    r.onsuccess=e=>{db=e.target.result;ok()};
    r.onerror=()=>ng(r.error);
  });
}
function all(s){return new Promise((ok,ng)=>{const r=db.transaction(s).objectStore(s).getAll();r.onsuccess=()=>ok(r.result||[]);r.onerror=()=>ng(r.error)})}
function put(s,o){return new Promise((ok,ng)=>{const r=db.transaction(s,'readwrite').objectStore(s).put(o);r.onsuccess=ok;r.onerror=()=>ng(r.error)})}
function clearStore(s){return new Promise((ok,ng)=>{const r=db.transaction(s,'readwrite').objectStore(s).clear();r.onsuccess=ok;r.onerror=()=>ng(r.error)})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}

function parseEntryLine(line){
  const a=line.split(/\s+/);
  if(a.length<2)return null;
  return {
    car:num(a[0]),
    name:a[1]||'',
    handicap:num(a[2]),
    rank:a[3]||'',
    trial:num(a[4]),
    preST:num(a[5]),
    actualST:num(a[6]),
    finish:num(a[7]),
    raceTime:num(a[8])
  };
}

function parsePastLine(line){
  const p=line.indexOf('|');
  if(p<1)return null;
  const player=line.slice(0,p).trim();
  const a=line.slice(p+1).split(',').map(x=>x.trim());
  if(!player || !a[0])return null;
  return {
    id:uid(), player,
    date:a[0]||'',
    venue:a[1]||'',
    raceNo:num(a[2]),
    finish:num(a[3]),
    handicap:num(a[4]),
    trial:num(a[5]),
    st:num(a[6]),
    raceTime:num(a[7]),
    track:a[8]||'',
    memo:a[9]||'前10走詳細'
  };
}

function parseBulk(text){
  const lines=text.replace(/\r/g,'').split('\n');
  let section='';
  const race={
    entries:[],
    past:[],
    odds:{f2:[],t2:[],t3:[]},
    track:'',weather:'',temp:null,humidity:null,trackTemp:null,wind:null
  };

  for(const raw of lines){
    const line=raw.trim();
    if(!line)continue;

    const head=line.match(/^【(\d{4})年(\d{1,2})月(\d{1,2})日\s+(.+?)(\d+)R】$/);
    if(head){
      race.date=`${head[1]}-${String(head[2]).padStart(2,'0')}-${String(head[3]).padStart(2,'0')}`;
      race.venue=head[4].trim();
      race.raceNo=+head[5];
      continue;
    }

    if(/^\[[A-Z0-9_]+\]$/.test(line)){
      section=line;
      continue;
    }

    if(section==='[RACE]'){
      const m=line.match(/^([A-Z_]+)\s+(.+)$/);
      if(!m)continue;
      const k=m[1],v=m[2].trim();
      if(k==='TRACK')race.track=v;
      else if(k==='WEATHER')race.weather=v;
      else if(k==='TEMP')race.temp=num(v);
      else if(k==='HUMIDITY')race.humidity=num(v);
      else if(k==='TRACK_TEMP')race.trackTemp=num(v);
      else if(k==='WIND')race.wind=num(v);
      continue;
    }

    if(section==='[ENTRY]'){
      const e=parseEntryLine(line);
      if(e)race.entries.push(e);
      continue;
    }

    if(section==='[RESULT]'){
      race.finishOrder=line.replace(/\s+/g,'');
      continue;
    }

    if(section==='[PAST]'){
      const p=parsePastLine(line);
      if(p)race.past.push(p);
      continue;
    }

    if(section==='[ODDS_2FUKU]'){
      const m=line.match(/^([1-8])[-=]([1-8])\s+([0-9.]+)$/);
      if(m)race.odds.f2.push({combo:`${m[1]}-${m[2]}`,odds:num(m[3])});
      continue;
    }

    if(section==='[ODDS_2TAN]'){
      const m=line.match(/^([1-8])[-=]([1-8])\s+([0-9.]+)$/);
      if(m)race.odds.t2.push({combo:`${m[1]}-${m[2]}`,odds:num(m[3])});
      continue;
    }

    if(section==='[ODDS_3TAN]'){
      const m=line.match(/^([1-8])[-=]([1-8])[-=]([1-8])\s+([0-9.]+)$/);
      if(m)race.odds.t3.push({combo:`${m[1]}-${m[2]}-${m[3]}`,odds:num(m[4])});
      continue;
    }
  }

  race.id=[race.date,race.venue,race.raceNo].filter(Boolean).join('_')||uid();
  return race;
}

function previewRace(r){
  if(!r.date||!r.venue||!r.raceNo){
    return '<span class="bad">見出し（日付・場・R）が読み取れていません。</span>';
  }

  const uniquePastPlayers=new Set(r.past.map(x=>x.player)).size;
  const info=`
    <div class="item">
      <b>${esc(r.date)} ${esc(r.venue)}${r.raceNo}R</b>
      <div class="kpi">
        <span class="badge">出走 ${r.entries.length}人</span>
        <span class="badge">前走 ${r.past.length}件</span>
        <span class="badge">前走選手 ${uniquePastPlayers}人</span>
        <span class="badge">2車複 ${r.odds.f2.length}組</span>
        <span class="badge">2車単 ${r.odds.t2.length}組</span>
        <span class="badge">3連単 ${r.odds.t3.length}組</span>
      </div>
      <div class="note" style="margin-top:6px">
        走路:${esc(r.track||'-')} / 天候:${esc(r.weather||'-')} / 気温:${r.temp??'-'}℃ / 湿度:${r.humidity??'-'}% / 走路温度:${r.trackTemp??'-'}℃
      </div>
    </div>`;

  const entries=`
    <div class="item"><b>選手</b><br>
      ${r.entries.map(e=>`${e.car||'-'} ${esc(e.name)} H${e.handicap??'-'} 試走${e.trial??'-'} 事前ST${e.preST??'-'} 実ST${e.actualST??'-'} 着${e.finish??'-'}`).join('<br>')||'なし'}
    </div>`;

  const result=`<div class="item"><b>結果</b><br>${esc(r.finishOrder||'未入力')}</div>`;

  let warn='';
  if(r.past.length===0)warn+='<div class="item warn">⚠ 前10走が0件です。</div>';
  if(r.odds.f2.length<2 || r.odds.t2.length<2 || r.odds.t3.length<2)warn+='<div class="item warn">⚠ オッズが各券種1組しか読めていない場合は、コードの券種ブロックを確認してください。</div>';

  return info+entries+result+warn;
}

async function saveParsed(){
  const r=lastParsed||parseBulk($('bulk').value);
  if(!r.date||!r.venue||!r.raceNo){
    $('msg').innerHTML='<span class="bad">見出しが読み取れないため保存できません。</span>';
    return;
  }
  await put('races',{...r,updatedAt:new Date().toISOString()});
  for(const p of r.past)await put('past',p);
  $('msg').innerHTML='<span class="good">保存しました。</span>';
  await refresh();
}

async function playerMap(){
  const m=new Map(),rs=await all('races'),ps=await all('past');
  const add=(name,row)=>{if(!name)return;if(!m.has(name))m.set(name,[]);m.get(name).push(row)};
  rs.forEach(r=>r.entries.forEach(e=>add(e.name,{
    ...e,date:r.date,venue:r.venue,raceNo:r.raceNo,track:r.track,
    weather:r.weather,temp:r.temp,humidity:r.humidity,trackTemp:r.trackTemp,source:'race'
  })));
  ps.forEach(p=>add(p.player,{...p,source:'past'}));
  return m;
}

async function renderPlayers(){
  const m=await playerMap(),q=$('search').value.trim();
  const arr=[...m.entries()].filter(([n])=>n.includes(q)).sort((a,b)=>b[1].length-a[1].length);
  $('playerList').innerHTML=arr.map(([n,rows])=>{
    const fins=rows.map(x=>x.finish).filter(Number.isFinite);
    const top3=fins.length?(fins.filter(x=>x<=3).length/fins.length*100).toFixed(1):'-';
    return `<div class="item"><b>${esc(n)}</b><br><span class="note">${rows.length}走登録 / 3着内率 ${top3}${top3==='-'?'':'%'}</span></div>`;
  }).join('')||'<div class="note">まだデータがありません。</div>';
}

async function refresh(){
  const rs=await all('races'),ps=await all('past'),pm=await playerMap();
  $('nRaces').textContent=rs.length;
  $('nPlayers').textContent=pm.size;
  $('nEntries').textContent=rs.reduce((s,r)=>s+r.entries.length,0);
  $('nPast').textContent=ps.length;
  $('nOdds').textContent=rs.reduce((s,r)=>s+(r.odds?.f2?.length||0)+(r.odds?.t2?.length||0)+(r.odds?.t3?.length||0),0);
  renderPlayers();
}

function dl(blob,name){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

function csvEsc(v){
  v=String(v??'');
  return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
}

async function exportCSV(){
  const rs=await all('races');
  const head=[
    '日付','場','R','走路','天候','気温','湿度','走路温度',
    '車番','選手名','ハンデ','ランク','試走','事前ST','実ST','着順','競走T',
    '結果','2車複','2車単','3連単'
  ];
  const out=[head];
  rs.forEach(r=>r.entries.forEach(e=>{
    out.push([
      r.date,r.venue,r.raceNo,r.track,r.weather,r.temp,r.humidity,r.trackTemp,
      e.car,e.name,e.handicap,e.rank,e.trial,e.preST,e.actualST,e.finish,e.raceTime,
      r.finishOrder,
      (r.odds?.f2||[]).map(x=>`${x.combo} ${x.odds}`).join('\n'),
      (r.odds?.t2||[]).map(x=>`${x.combo} ${x.odds}`).join('\n'),
      (r.odds?.t3||[]).map(x=>`${x.combo} ${x.odds}`).join('\n')
    ]);
  }));
  dl(new Blob(['\ufeff'+out.map(r=>r.map(csvEsc).join(',')).join('\n')],{type:'text/csv'}),'オート研究所_V1.02.csv');
}

async function exportJSON(){
  dl(new Blob([JSON.stringify({version:'1.02',races:await all('races'),past:await all('past')},null,2)],{type:'application/json'}),'オート研究所_V1.02_backup.json');
}

document.querySelectorAll('.tab[data-tab]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab[data-tab],.panel').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  $(b.dataset.tab).classList.add('active');
});

$('check').onclick=()=>{
  lastParsed=parseBulk($('bulk').value);
  $('preview').innerHTML=previewRace(lastParsed);
  $('msg').textContent='';
};

$('save').onclick=saveParsed;
$('clearBox').onclick=()=>{
  $('bulk').value='';
  $('preview').textContent='まだ解析していません。';
  lastParsed=null;
  $('msg').textContent='';
};
$('search').oninput=renderPlayers;
$('csv').onclick=exportCSV;
$('json').onclick=exportJSON;

$('importJson').onchange=async e=>{
  try{
    const d=JSON.parse(await e.target.files[0].text());
    for(const r of d.races||[])await put('races',r);
    for(const p of d.past||[])await put('past',p);
    await refresh();
    alert('読込完了');
  }catch(err){
    alert('読込失敗：'+err.message);
  }
  e.target.value='';
};

$('deleteAll').onclick=async()=>{
  if(confirm('全データを削除しますか？')&&confirm('本当に削除しますか？')){
    await clearStore('races');
    await clearStore('past');
    await refresh();
  }
};

(async()=>{await openDB();await refresh()})();
</script>
</body>
</html>
