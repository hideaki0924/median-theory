<script>
var latestCopyText="";
function zen(s){return String(s).replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-65248)}).replace(/．/g,'.').replace(/[－ー―−]/g,'-').replace(/[　]/g,' ').replace(/[〜～]/g,'-')}
function ns(l){var m=zen(l).match(/\d+(?:\.\d+)?/g);return m?m.map(Number):[]}
function pk(a,b){return [a,b].map(String).sort(function(x,y){return +x-+y}).join('-')}
function tk(a,b,c){return [a,b,c].map(String).sort(function(x,y){return +x-+y}).join('-')}
function add(a,v){v=String(v);if(v&&v!=='undefined'&&a.indexOf(v)<0)a.push(v)}
function uniq(a){var o=[];(a||[]).forEach(function(v){add(o,v)});return o}
function sortO(a){return (a||[]).slice().sort(function(x,y){return +x.od-+y.od})}
function mid(a){a=a||[];if(!a.length)return[];var n=a.length;return n%2?[a[Math.floor(n/2)]]:[a[n/2-1],a[n/2]]}
function jc(a){return(!a||!a.length)?'なし':a.map(function(x){return x+'号車'}).join('・')}
function parse(raw){var t=zen(raw).split(/\n/),sec='',d={title:'レース',t:[],n:[],w:[],s:[]};t.forEach(function(line){line=line.trim();if(!line)return;if(line.indexOf('【')===0)d.title=line;var u=line.toUpperCase();if(u[0]=='['){if(u.indexOf('TAN')>=0||u.indexOf('単')>=0){sec='t';return}if(u.indexOf('WIDE')>=0||u.indexOf('ワイド')>=0){sec='w';return}if(u.indexOf('SAN')>=0||u.indexOf('3')>=0||u.indexOf('三')>=0){sec='s';return}if(u.indexOf('NISHA')>=0||u.indexOf('NIREN')>=0||u.indexOf('2')>=0||u.indexOf('UMA')>=0||u.indexOf('馬')>=0){sec='n';return}}var m,o;if(sec==='t'){o=ns(line);if(o.length>=2)d.t.push({h:String(Math.floor(o[0])),od:o[o.length-1]})}if(sec==='n'){m=line.match(/(\d+)\s*-\s*(\d+)/);o=ns(line);if(m&&o.length)d.n.push({a:m[1],b:m[2],od:o[o.length-1],key:pk(m[1],m[2])})}if(sec==='w'){m=line.match(/(\d+)\s*-\s*(\d+)/);o=ns(line);if(m&&o.length)d.w.push({a:m[1],b:m[2],od:o[o.length-1],key:pk(m[1],m[2])})}if(sec==='s'){m=line.match(/(\d+)\s*-\s*(\d+)\s*-\s*(\d+)/);o=ns(line);if(m&&o.length)d.s.push({a:m[1],b:m[2],c:m[3],od:o[o.length-1],key:tk(m[1],m[2],m[3])})}});return d}
function rowP(p){var r=[];sortO(p).forEach(function(x){add(r,x.a);add(r,x.b)});return r}
function rowT(p){var r=[];sortO(p).forEach(function(x){add(r,x.a);add(r,x.b);add(r,x.c)});return r}
function pseudo(list,a){var ps=sortO(list).filter(function(x){return x.a===a||x.b===a}),r=[];ps.forEach(function(x){add(r,x.a===a?x.b:x.a)});return{anchor:a,row:r,pairs:ps}}
function wcount(w){var m={},a=sortO(w).slice(0,10);a.forEach(function(x){[x.a,x.b].forEach(function(h){if(!m[h])m[h]={h:h,c:0,b:999};m[h].c++;m[h].b=Math.min(m[h].b,+x.od)})});return Object.keys(m).map(function(k){return m[k]}).sort(function(a,b){return b.c-a.c||a.b-b.b})}
function walls(od){var w=[],s=[];for(var i=0;i<od.length-1;i++){var r=+od[i+1]/+od[i];if(r>=1.8)w.push({p:i,r:r});else if(r>=1.55)s.push({p:i,r:r})}return{w:w,s:s}}
function zones(obj){var r=obj.row,ps=obj.pairs,od=obj.pairs.map(function(x){return+x.od}),wi=walls(od),cuts=wi.w.map(function(x){return x.p}),z=[],st=0;for(var i=0;i<=cuts.length;i++){var en=i<cuts.length?cuts[i]+1:r.length;z.push({label:['本線','第1壁後','第2壁後','切り'][i]||'切り',horses:r.slice(st,en),pairs:ps.slice(st,en)});st=en}return{zones:z,info:wi,row:r,odds:od,pairs:ps}}
function zidx(z,h){for(var i=0;i<z.length;i++)if(z[i].horses.indexOf(String(h))>=0)return i;return-1}
function findTri(a,x,y,z){var k=tk(x,y,z);for(var i=0;i<a.length;i++)if(a[i].key===k)return a[i];return null}
function findPair(a,x,y){var k=pk(x,y);for(var i=0;i<a.length;i++)if(a[i].key===k)return a[i];return null}

function ctx(d){var tr=sortO(d.t),nr=sortO(d.n),wr=sortO(d.w),sr=sortO(d.s),f1=tr[0]&&tr[0].h,f2=tr[1]&&tr[1].h;var pa=pseudo(d.w,f1),pb=pseudo(d.w,f2),wc=wcount(d.w),cr=wc.map(function(x){return x.h});var base=zones(pseudo(d.n,f1));var c={tr:tr,nr:nr,wr:wr,sr:sr,f1:f1,f2:f2,trow:tr.map(function(x){return x.h}),nrow:rowP(d.n),wrow:rowP(d.w),srow:rowT(d.s),pa:pa,pb:pb,crow:cr,base:base};c.tm=mid(c.trow);c.nm=mid(c.nrow);c.wm=mid(c.wrow);c.sm=mid(c.srow);c.am=mid(pa.row);c.bm=mid(pb.row);c.cm=mid(cr);c.noFav=null;c.noFavRank=999;for(var i=0;i<sr.length;i++){var hs=[sr[i].a,sr[i].b,sr[i].c];if(hs.indexOf(f1)<0){c.noFav=sr[i];c.noFavRank=i+1;break}}c.diag=diag(c);return c}
function diag(c){var n1=c.nr[0]?+c.nr[0].od:999,fo=c.tr[0]?+c.tr[0].od:999,f2=c.tr[1]?+c.tr[1].od:999;var surface=n1<4?'本命戦':n1<9?'中荒れ戦':n1<15?'荒れ戦':'大荒れ戦';var risk=0,back='本線寄り';if(fo<=1.7)risk++;if(c.noFav&&c.noFavRank<=6&&+c.noFav.od<=15)risk+=2;var strongTwo=fo<=2&&f2<=3.5;var noFavWeak=(!c.noFav||c.noFavRank>6||+c.noFav.od>15);if(strongTwo&&noFavWeak)back='二強残し＋第1壁後混入';else if(risk>=5)back='本命頭飛び＋3着残し警戒';else if(risk>=3)back='本命頭飛び警戒';else if(risk>=1)back='軽いズレ注意';return{surface:surface,back:back,risk:risk}}
function score(d,c){var all=[];function ah(h){add(all,h)}d.t.forEach(function(x){ah(x.h)});d.n.forEach(function(x){ah(x.a);ah(x.b)});d.w.forEach(function(x){ah(x.a);ah(x.b)});d.s.forEach(function(x){ah(x.a);ah(x.b);ah(x.c)});var out=[];all.forEach(function(h){var sc=0,rs=[],tf=d.t.filter(function(x){return x.h===h})[0];function chk(arr,pt,name){if(arr.indexOf(h)>=0){sc+=pt;rs.push(name)}}chk(c.tm,5,'単勝メジアン');chk(c.nm,7,'2車複メジアン');chk(c.wm,7,'ワイドメジアン');chk(c.sm,8,'3連系メジアン');chk(c.am,12,'擬似複勝Aメジアン');chk(c.bm,8,'擬似複勝Bメジアン');chk(c.cm,8,'擬似複勝Cメジアン');if(c.pa.row.slice(0,3).indexOf(h)>=0){sc+=5;rs.push('1人気連動上位')}if(c.pb.row.slice(0,3).indexOf(h)>=0){sc+=4;rs.push('2人気連動上位')}if(c.crow.slice(0,3).indexOf(h)>=0){sc+=6;rs.push('ワイド出現上位')}var zi=zidx(c.base.zones,h);if(zi===0){sc+=3;rs.push('2複基準本線')}if(zi===1){sc+=10;rs.push('2複基準第1壁後')}if(zi===2){sc+=6;rs.push('2複基準第2壁後')}if(h===c.f1){sc+=6;rs.push('単勝1人気')}if(h===c.f2){sc+=4;rs.push('単勝2人気')}if(tf&&+tf.od>=8&&rs.length>=2){sc+=6;rs.push('穴寄り重複')}out.push({h:h,score:sc,tan:tf?tf.od:'-',reasons:rs,zone:zi})});return out.sort(function(a,b){return b.score-a.score||(+a.tan||999)-(+b.tan||999)})}
function secondBoost(d,c,sc){var second=(c.base.zones[2]&&c.base.zones[2].horses)||[],first=(c.base.zones[1]&&c.base.zones[1].horses)||[],main=(c.base.zones[0]&&c.base.zones[0].horses)||[],out=[];if(!second.length)return out;var weak=(!c.noFav||c.noFavRank>=10||+c.noFav.od>=25);var ok=c.diag.back.indexOf('二強')>=0||c.diag.back.indexOf('軽い')>=0||c.diag.back.indexOf('本線')>=0;if(!weak||!ok)return out;sc.slice(0,5).forEach(function(x,i){var h=x.h;if(second.indexOf(h)<0)return;var sig=0,rs=[];function yes(cond,name,pt){if(cond){sig+=pt;rs.push(name)}}yes(c.nm.indexOf(h)>=0,'2車複メジアン',2);yes(c.sm.indexOf(h)>=0,'3連系メジアン',1);yes(c.am.indexOf(h)>=0||c.bm.indexOf(h)>=0,'擬似複勝A/Bメジアン',2);yes(c.cm.indexOf(h)>=0,'擬似複勝Cメジアン',1);yes(c.pa.row.slice(0,4).indexOf(h)>=0,'1人気連動',1);yes(c.pb.row.slice(0,4).indexOf(h)>=0,'2人気連動',1);if(x.score>=35)sig++;if(i<=2)sig++;if(sig>=5)out.push({h:h,rank:i+1,score:x.score,signal:sig,reasons:rs,first:first[0]||main[0]||c.f2,main:main[0]||c.f2})});return out}
function tan100(d,c,sc){return sc.filter(function(x){var od=+x.tan;return x.h!==c.f1&&x.h!==c.f2&&od>=5&&od<=35&&x.score>=35&&(x.zone===0||x.zone===1)}).slice(0,4)}
function tickets(d,c,sc,boost){var w=[],n=[],sm=[],sh=[],sb=[];function ap(a,b){if(a&&b&&a!==b){add(w,pk(a,b));add(n,pk(a,b))}}function at(ar,a,b,cx){if(a&&b&&cx&&a!==b&&a!==cx&&b!==cx)add(ar,tk(a,b,cx))}var z=c.base.zones,main=z[0]?z[0].horses:[],first=z[1]?z[1].horses:[],second=z[2]?z[2].horses:[],a=c.f1,b=c.f2;var top=sc.slice(0,4).map(function(x){return x.h});c.am.forEach(function(h){ap(a,h)});c.bm.forEach(function(h){ap(b,h)});first.slice(0,3).forEach(function(h){ap(a,h);at(sm,a,b,h)});if(c.sr[0])at(sm,c.sr[0].a,c.sr[0].b,c.sr[0].c);if(c.sr[1])at(sm,c.sr[1].a,c.sr[1].b,c.sr[1].c);if(a&&b&&top[0]&&top[0]!==a&&top[0]!==b)at(sm,a,b,top[0]);if(a&&top[0]&&top[1])at(sh,a,top[0],top[1]);if(main[0]&&first[0])at(sm,a,main[0],first[0]);if(main[0]&&first[1])at(sh,a,main[0],first[1]);if(second[0]){first.slice(0,3).forEach(function(h){at(sb,a,h,second[0])})}if(boost)boost.forEach(function(x){at(sm,a,x.first,x.h);at(sh,a,x.main,x.h);at(sb,b,x.first,x.h)});if(c.noFav&&c.noFavRank<=6)at(sb,c.noFav.a,c.noFav.b,c.noFav.c);return{w:uniq(w).slice(0,8),n:uniq(n).slice(0,8),sm:uniq(sm).slice(0,8),sh:uniq(sh).slice(0,8),sb:uniq(sb).slice(0,8)}}
