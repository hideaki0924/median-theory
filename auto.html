<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>チャッピー神予想 オート版V8</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#07101f;color:#fff;padding:14px;margin:0;font-size:20px}
h1{color:#ffd66b;font-size:32px}
textarea,input{width:100%;box-sizing:border-box;background:#050912;color:#fff;border:2px solid #33415c;border-radius:14px;padding:12px;font-size:20px;margin:8px 0}
textarea{height:330px;font-family:monospace}
button{width:100%;padding:16px;border:0;border-radius:16px;font-size:24px;font-weight:bold;background:#ffd66b;color:#000;margin:8px 0}
.box{background:#111b2e;border:2px solid #33415c;border-radius:18px;padding:14px;margin:14px 0}
.alert{border:3px solid #33415c;border-radius:24px;padding:16px;margin:14px 0}
.scroll{overflow-x:auto;border:3px solid #ffd66b;border-radius:18px;margin:12px 0}
table{border-collapse:collapse;min-width:900px;font-size:22px}
td{border:1px solid #33415c;padding:12px;text-align:center;white-space:nowrap}
.head{background:#152036;color:#ffd66b;font-weight:bold}
.yellow{color:#ffd966;font-size:28px;font-weight:bold}
.green{color:#53d769;font-size:28px;font-weight:bold}
.red{color:#ff4d4d;font-size:28px;font-weight:bold}
.blue{color:#4da3ff;font-size:28px;font-weight:bold}
pre{white-space:pre-wrap;line-height:1.75;font-size:22px;font-weight:bold}
</style>
</head>
<body>

<h1>🏍️ チャッピー神予想<br>オート版V8</h1>

<div class="box">
<input id="race" placeholder="例：浜松1R">
<textarea id="odds" placeholder="[TAN]
3 1.9
6 3.2
8 4.9
4 5.0

[NISHA]
4-6 2.3
3-6 2.3

[SANREN]
3-6-8 3.0
4-6-8 3.7"></textarea>
<button onclick="analyze()">分析する</button>
<button onclick="sample()">サンプル</button>
</div>

<div id="out" class="box">ここに結果が出ます。</div>

<script>
function norm(s){
 return String(s)
 .replace(/[０-９]/g,x=>String.fromCharCode(x.charCodeAt(0)-65248))
 .replace(/[－ー―]/g,'-')
 .replace(/=/g,'-');
}
function toNum(v){return parseFloat(norm(v).replace(/[^\d.]/g,''))}
function splitH(s){return norm(s).split('-').map(x=>x.trim()).filter(Boolean)}
function uniq(a){return a.filter((v,i,x)=>v&&x.indexOf(v)===i)}
function med(a){
 if(!a.length)return '-';
 const n=a.length;
 return n%2?a[Math.floor(n/2)]:a[n/2-1]+'・'+a[n/2];
}
function countCars(items){
 const c={};
 items.forEach(x=>x.hs.forEach(h=>c[h]=(c[h]||0)+1));
 return c;
}
function parseData(){
 const lines=norm(document.getElementById('odds').value).split(/\n/).map(x=>x.trim()).filter(Boolean);
 let sec='';
 const tan=[],nisha=[],san=[];
 for(const line of lines){
  const u=line.toUpperCase();
  if(u.includes('[TAN')||line.includes('単勝')){sec='tan';continue}
  if(u.includes('[NISHA')||line.includes('2車複')||line.includes('２車複')){sec='nisha';continue}
  if(u.includes('[SANREN')||line.includes('3連複')||line.includes('３連複')){sec='san';continue}
  const p=line.split(/\s+/);
  if(p.length<2)continue;
  const od=toNum(p[1]);
  if(!od)continue;
  if(sec==='tan')tan.push({car:p[0],odds:od});
  if(sec==='nisha')nisha.push({pair:p[0],odds:od,hs:splitH(p[0])});
  if(sec==='san')san.push({pair:p[0],odds:od,hs:splitH(p[0])});
 }
 tan.sort((a,b)=>a.odds-b.odds);
 nisha.sort((a,b)=>a.odds-b.odds);
 san.sort((a,b)=>a.odds-b.odds);
 return {tan,nisha,san};
}
function mainTable(tan,nisha,san){
 const max=Math.max(tan.length,nisha.length,san.length);
 let h='<div class="scroll"><table>';
 h+='<tr><td class="head">順位</td>';
 for(let i=1;i<=max;i++)h+='<td>'+i+'</td>';
 h+='</tr><tr><td class="head">単勝</td>';
 for(let i=0;i<max;i++)h+='<td>'+(tan[i]?tan[i].car:'')+'</td>';
 h+='</tr><tr><td class="head">単勝オッズ</td>';
 for(let i=0;i<max;i++)h+='<td>'+(tan[i]?tan[i].odds:'')+'</td>';
 h+='</tr><tr><td class="head">2車複</td>';
 for(let i=0;i<max;i++)h+='<td>'+(nisha[i]?nisha[i].pair:'')+'</td>';
 h+='</tr><tr><td class="head">2車複オッズ</td>';
 for(let i=0;i<max;i++)h+='<td>'+(nisha[i]?nisha[i].odds:'')+'</td>';
 h+='</tr><tr><td class="head">3連複</td>';
 for(let i=0;i<max;i++)h+='<td>'+(san[i]?san[i].pair:'')+'</td>';
 h+='</tr><tr><td class="head">3連複オッズ</td>';
 for(let i=0;i<max;i++)h+='<td>'+(san[i]?san[i].odds:'')+'</td>';
 h+='</tr></table></div>';
 return h;
}
function combos2(axis, cars){
 const r=[];
 cars.forEach(c=>{
  if(c!==axis)r.push(axis+'-'+c);
 });
 return r;
}
function combos3(axis,cars,limit){
 const r=[];
 for(let i=0;i<cars.length;i++){
  for(let j=i+1;j<cars.length;j++){
   const a=cars[i],b=cars[j];
   if(a!==axis&&b!==axis&&r.length<limit)r.push(axis+'-'+a+'-'+b);
  }
 }
 return r;
}
function analyze(){
 const raceName=document.getElementById('race').value||'レース名未入力';
 const {tan,nisha,san}=parseData();
 if(!tan.length){out.innerHTML='[TAN] 単勝データがありません';return}
 const axis=tan[0].car; // ★軸車は必ず単勝1番人気

 const under10=tan.filter(x=>x.odds<10).map(x=>x.car);
 const over10=tan.filter(x=>x.odds>=10).map(x=>x.car);
 const tanAll=tan.map(x=>x.car);

 const mTanAll=med(tanAll);
 const mTan10=med(under10);
 const mTanOver=med(over10);

 const nAll=nisha.map(x=>x.pair);
 const n10=nisha.filter(x=>x.odds<10).map(x=>x.pair);
 const nOver=nisha.filter(x=>x.odds>=10).map(x=>x.pair);
 const mNAll=med(nAll);
 const mN10=med(n10);
 const mNOver=med(nOver);

 const sAll=san.map(x=>x.pair);
 const s15=san.filter(x=>x.odds<=15).map(x=>x.pair);
 const mSAll=med(sAll);
 const mS15=med(s15);

 const medCars=[mTanAll,mTan10,mTanOver,mNAll,mN10,mNOver,mSAll,mS15]
 .join('・').split('・').flatMap(x=>splitH(x)).filter(Boolean);
 const cnt={};
 medCars.forEach(c=>cnt[c]=(cnt[c]||0)+1);
 const dup=Object.entries(cnt).filter(x=>x[1]>=2).sort((a,b)=>b[1]-a[1]).map(x=>x[0]+'('+x[1]+')');

 const bottomTan=med(tan.slice(Math.floor(tan.length/2)).map(x=>x.car));

 // 復活理論：軸は単勝1人気固定。復活車は別表示。
 let reviveCar='';
 let lastCar='';
 let holeCars=[];
 if(nisha.length>=6){
  const top=nisha.slice(0,15);
  const c=countCars(top);
  const most=Object.keys(c).sort((a,b)=>c[b]-c[a])[0]||'';
  let seen=false, vanished=false;
  for(let i=0;i<top.length;i++){
   if(top[i].hs.includes(most)){
    seen=true;
    if(vanished){
     reviveCar=top[i].hs.find(x=>x!==most)||most;
     break;
    }
    lastCar=top[i].hs.find(x=>x!==most)||'';
   }else if(seen){
    vanished=true;
   }
  }
  holeCars=uniq([reviveCar,lastCar].filter(x=>x&&x!==axis));
 }

 const topN=countCars(nisha.slice(0,10));
 const topS=countCars(san.slice(0,10));
 const score={};
 tan.forEach(x=>score[x.car]=0);
 Object.keys(topN).forEach(c=>score[c]=(score[c]||0)+topN[c]*2);
 Object.keys(topS).forEach(c=>score[c]=(score[c]||0)+topS[c]*3);
 const ranked=Object.keys(score).sort((a,b)=>(score[b]||0)-(score[a]||0));

 const mainCars=uniq([axis,...under10,...ranked]).slice(0,5);
 const holeBase=uniq([...holeCars,...String(bottomTan).split('・'),...over10.slice(0,2)]).filter(x=>x&&x!=='-'&&x!==axis);

 const nishaMain=combos2(axis,mainCars).slice(0,8);
 const nishaHole=combos2(axis,holeBase).slice(0,6);
 const sanMain=combos3(axis,mainCars,10);
 const sanHole=holeBase.flatMap(h=>combos3(axis,uniq([h,...mainCars]),10).filter(x=>x.includes(h))).slice(0,10);

 const raceType=under10.length<=2?'🔵本命型':under10.length<=4?'🔥中心車は絞れる型':'🔴荒れ警戒型';

 out.innerHTML=
 '<h2>'+raceName+'</h2>'+
 '<div class="alert"><div class="yellow">📊 レース判定</div>'+raceType+'<br>単勝1番人気 軸車：<span class="red">'+axis+'</span><br>単勝10倍以内：'+under10.join('・')+'</div>'+
 '<div class="yellow">📊 本表</div>'+mainTable(tan,nisha,san)+
 '<pre>'+
 '🟡【メジアン】\n'+
 '単勝全体：'+mTanAll+'\n'+
 '単勝10倍以内：'+mTan10+'\n'+
 '単勝10倍以上：'+mTanOver+'\n\n'+
 '2車複全体：'+mNAll+'\n'+
 '2車複10倍以内：'+mN10+'\n'+
 '2車複10倍以上：'+mNOver+'\n\n'+
 '3連複全体：'+mSAll+'\n'+
 '3連複15倍以内：'+mS15+'\n\n'+
 '🔥【メジアン重複】\n'+(dup.join('・')||'なし')+'\n\n'+
 '🔥【復活穴理論】\n'+
 '軸車：'+axis+'\n'+
 '最後車：'+(lastCar||'なし')+'\n'+
 '復活車：'+(reviveCar||'なし')+'\n'+
 '穴候補：'+(holeCars.join('・')||'なし')+'\n\n'+
 '⚫【ボトム値】\n'+bottomTan+'\n\n'+
 '🟢【本線車】\n'+mainCars.join('・')+'\n\n'+
 '🏍️【本線2車複】\n'+(nishaMain.join('\n')||'なし')+'\n\n'+
 '⚫【穴2車複】\n'+(nishaHole.join('\n')||'なし')+'\n\n'+
 '🏍️【本線3連複】\n'+(sanMain.join('\n')||'なし')+'\n\n'+
 '⚫【穴3連複】\n'+(sanHole.join('\n')||'なし')+
 '</pre>';
}
function sample(){
 race.value='浜松1R';
 odds.value='[TAN]\n3 1.9\n6 3.2\n8 4.9\n4 5.0\n5 17.1\n7 17.1\n1 19.6\n2 34.3\n\n[NISHA]\n4-6 2.3\n3-6 2.3\n6-8 9.3\n3-8 10.1\n3-4 11.7\n1-3 16.7\n7-8 26.0\n1-8 29.3\n5-8 33.5\n4-8 46.9\n1-4 58.6\n1-6 58.6\n5-6 58.6\n2-8 78.1\n3-5 117.2\n4-7 117.2\n6-7 117.2\n1-2 234.5\n2-3 234.5\n2-6 234.5\n\n[SANREN]\n3-6-8 3.0\n4-6-8 3.7\n3-4-6 9.2\n1-3-6 13.9\n3-4-8 16.7\n6-7-8 23.0\n1-3-8 33.5\n1-4-6 33.5\n1-6-8 36.8\n1-3-4 38.8';
 analyze();
}
</script>
</body>
</html>
