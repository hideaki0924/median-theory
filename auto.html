<body>
<h1>チャッピー神予想 オート V24.11<br>大谷式3壁スイッチ版</h1>

<textarea id="input" placeholder="【飯塚12R】

[TANSHO]
車番 単勝オッズ

[NISHA]
車番-車番 2車複オッズ

[WIDE]
車番-車番 ワイドオッズ

[SANREN]
車番-車番-車番 3連系オッズ

[HANDI]
車番 ハンデm

※[HANDI]は任意。入れるとハンデ補正も追加判定します。
※V24.11は大谷式3壁スイッチを搭載。単勝80壁・ワイド6壁・ワイド15壁・2車複/3連系急壁を見ます。"></textarea><br>

<button class="go" id="btnRun">解析</button>
<button class="test" id="btnSample">テスト</button>
<button class="clear" id="btnClear">リセット</button>
<button class="copy" id="btnCopy">結果コピー</button>
<div id="out"></div>

<script>
var latestCopyText="";

function zenToHan(str){return String(str).replace(/[０-９]/g,function(s){return String.fromCharCode(s.charCodeAt(0)-65248);}).replace(/．/g,'.').replace(/[－ー―−]/g,'-').replace(/[　]/g,' ').replace(/[〜～]/g,'-');}
function nums(line){var m=zenToHan(line).match(/\d+(?:\.\d+)?/g);return m?m.map(function(x){return Number(x);}):[];}
function pairKey(a,b){return [a,b].map(String).sort(function(x,y){return Number(x)-Number(y);}).join('-');}
function triKey(a,b,c){return [a,b,c].map(String).sort(function(x,y){return Number(x)-Number(y);}).join('-');}
function uniq(arr){var s={},out=[];(arr||[]).forEach(function(v){v=String(v);if(v&&v!=="undefined"&&!s[v]){s[v]=true;out.push(v);}});return out;}
function add(arr,v){if(v&&arr.indexOf(v)<0)arr.push(v);}
function sortOdds(arr){return (arr||[]).slice().sort(function(a,b){return Number(a.od)-Number(b.od);});}
function joinC(arr){return (!arr||!arr.length)?"なし":arr.map(function(x){return x+"号車";}).join("・");}
function mid(arr){arr=arr||[];if(!arr.length)return[];if(arr.length===1)return[arr[0]];var n=arr.length;return n%2?[arr[Math.floor(n/2)]]:[arr[n/2-1],arr[n/2]];}
function getTan(data,h){h=String(h);for(var i=0;i<data.tansho.length;i++){if(data.tansho[i].h===h)return data.tansho[i];}return null;}
function findPair(arr,a,b){var k=pairKey(a,b);for(var i=0;i<(arr||[]).length;i++){if(arr[i].key===k)return arr[i];}return null;}
function findTri(arr,a,b,c){var k=triKey(a,b,c);for(var i=0;i<(arr||[]).length;i++){if(arr[i].key===k)return arr[i];}return null;}
function rankOfKey(arr,key){for(var i=0;i<(arr||[]).length;i++){if(arr[i].key===key)return i+1;}return 999;}
function countAppearTop(list,h,n){h=String(h);var c=0;(list||[]).slice(0,n||20).forEach(function(x){if(x.a===h||x.b===h||x.c===h)c++;});return c;}
function knownTanOdds(data,h){var tf=getTan(data,h);if(!tf)return null;var od=Number(tf.od);return (isFinite(od)&&od>0)?od:null;}
function safeTanSortVal(x){var n=Number(x.tan);return (isFinite(n)&&n>0)?n:9999;}

function parseData(raw){
  var text=zenToHan(raw),lines=text.split(/\n/),title="レース",sec="";
  var tansho=[],nisha=[],wide=[],sanren=[],handi=[];
  for(var i=0;i<lines.length;i++){
    var line=lines[i].trim();if(!line)continue;
    if(line.indexOf("【")===0)title=line;
    var up=line.toUpperCase();
    if(up.indexOf("[")===0){
      if(up.indexOf("HANDI")>=0||up.indexOf("HANDE")>=0||up.indexOf("H]")>=0||up.indexOf("ハンデ")>=0){sec="HANDI";continue;}
      if(up.indexOf("TAN")>=0||up.indexOf("単")>=0){sec="TANSHO";continue;}
      if(up.indexOf("WIDE")>=0||up.indexOf("ワイド")>=0){sec="WIDE";continue;}
      if(up.indexOf("SAN")>=0||up.indexOf("3")>=0||up.indexOf("三")>=0){sec="SANREN";continue;}
      if(up.indexOf("NISHA")>=0||up.indexOf("NIREN")>=0||up.indexOf("2")>=0||up.indexOf("UMA")>=0||up.indexOf("馬")>=0){sec="NISHA";continue;}
    }
    if(sec==="TANSHO"){
      var n=nums(line);if(n.length>=2)tansho.push({h:String(Math.floor(n[0])),od:n[n.length-1]});
    }else if(sec==="NISHA"){
      var m=line.match(/(\d+)\s*-\s*(\d+)/),o=nums(line);if(m&&o.length)nisha.push({a:m[1],b:m[2],od:o[o.length-1],key:pairKey(m[1],m[2])});
    }else if(sec==="WIDE"){
      var mw=line.match(/(\d+)\s*-\s*(\d+)/),ow=nums(line);if(mw&&ow.length)wide.push({a:mw[1],b:mw[2],od:ow[ow.length-1],key:pairKey(mw[1],mw[2])});
    }else if(sec==="SANREN"){
      var ms=line.match(/(\d+)\s*-\s*(\d+)\s*-\s*(\d+)/),os=nums(line);if(ms&&os.length)sanren.push({a:ms[1],b:ms[2],c:ms[3],od:os[os.length-1],key:triKey(ms[1],ms[2],ms[3])});
    }else if(sec==="HANDI"){
      var hn=nums(line);if(hn.length>=2)handi.push({h:String(Math.floor(hn[0])),v:Number(hn[1])});
    }
  }
  return{title:title,tansho:tansho,nisha:nisha,wide:wide,sanren:sanren,handi:handi};
}

function rankRowFromPairs(pairs){var row=[];sortOdds(pairs).forEach(function(p){add(row,p.a);add(row,p.b);});return row;}
function rankRowFromTris(tris){var row=[];sortOdds(tris).forEach(function(t){add(row,t.a);add(row,t.b);add(row,t.c);});return row;}
function pseudoFromAnchor(list,anchor){var arr=sortOdds(list).filter(function(p){return p.a===anchor||p.b===anchor;}),row=[];arr.forEach(function(p){add(row,p.a===anchor?p.b:p.a);});return{anchor:anchor,row:row,pairs:arr};}
function pseudoWideCount(wide,topN){var map={},arr=sortOdds(wide).slice(0,topN||10);arr.forEach(function(p){[p.a,p.b].forEach(function(h){if(!map[h])map[h]={h:h,count:0,best:999};map[h].count++;if(Number(p.od)<map[h].best)map[h].best=Number(p.od);});});var out=[];for(var k in map)out.push(map[k]);out.sort(function(a,b){return b.count!==a.count?b.count-a.count:a.best-b.best;});return out;}
function wallInfoFromOdds(odds){var walls=[],semis=[];for(var i=0;i<odds.length-1;i++){var now=Number(odds[i]),next=Number(odds[i+1]);if(!now||!next)continue;var ratio=next/now,diff=next-now;if(ratio>=1.8)walls.push({pos:i,ratio:ratio,diff:diff});else if(ratio>=1.55)semis.push({pos:i,ratio:ratio,diff:diff});}return{walls:walls,semis:semis};}
function wallPosList(info,type){return ((type==="semi"?info.semis:info.walls)||[]).map(function(x){return x.pos;});}
function makeAnchorPairRow(pairs,anchor){var p=pseudoFromAnchor(pairs,anchor);return{anchor:anchor,row:p.row,pairs:p.pairs,odds:p.pairs.map(function(x){return Number(x.od);})};}
function makeWallZones(rowObj){var row=rowObj.row||[],pairs=rowObj.pairs||[],odds=rowObj.odds||[],info=wallInfoFromOdds(odds),wallPos=wallPosList(info,"wall"),zones=[],start=0,labels=["本線","第1壁後","第2壁後","切り"];for(var i=0;i<=wallPos.length;i++){var end=(i<wallPos.length?wallPos[i]+1:row.length),horses=row.slice(start,end).filter(Boolean),pairSlice=pairs.slice(start,end);zones.push({idx:i,label:(i<3?labels[i]:"切り"),horses:horses,pairs:pairSlice});start=end;}return{zones:zones,info:info,row:row,odds:odds,pairs:pairs,anchor:rowObj.anchor};}
function zoneIndexOf(zones,h){h=String(h);for(var i=0;i<(zones||[]).length;i++){if(zones[i].horses.indexOf(h)>=0)return i;}return -1;}
function fmtWallDetails(rowObj){var info=rowObj.info||{walls:[],semis:[]},row=rowObj.row||[],odds=rowObj.odds||[];if(!info.walls.length&&!info.semis.length)return"壁なし";var lines=[];function one(w,mark){lines.push(mark+" "+row[w.pos]+"→"+row[w.pos+1]+" / "+odds[w.pos]+"→"+odds[w.pos+1]+" / 倍率"+w.ratio.toFixed(2));}info.walls.forEach(function(w){one(w,"🔥壁");});info.semis.forEach(function(w){one(w,"⚠️準壁");});return lines.join("\n");}
function pairInTop(row,h,n){return (row||[]).slice(0,n||4).indexOf(String(h))>=0;}
function collectAllHorses(data){var out=[];function ah(h){if(h!==undefined&&h!==null)add(out,String(h));}data.tansho.forEach(function(x){ah(x.h);});data.nisha.forEach(function(x){ah(x.a);ah(x.b);});data.wide.forEach(function(x){ah(x.a);ah(x.b);});data.sanren.forEach(function(x){ah(x.a);ah(x.b);ah(x.c);});(data.handi||[]).forEach(function(x){ah(x.h);});return out;}

function makeHandiGroups(data){
  var map={},list=[];(data.handi||[]).forEach(function(x){map[String(x.h)]=Number(x.v);list.push({h:String(x.h),v:Number(x.v)});});
  list.sort(function(a,b){return a.v!==b.v?a.v-b.v:Number(a.h)-Number(b.h);});
  var vals=[];list.forEach(function(x){if(vals.indexOf(x.v)<0)vals.push(x.v);});vals.sort(function(a,b){return a-b;});
  var min=vals.length?vals[0]:null,max=vals.length?vals[vals.length-1]:null,front=[],mid=[],heavy=[];
  list.forEach(function(x){if(x.v===min)front.push(x.h);else if(x.v===max)heavy.push(x.h);else mid.push(x.h);});
  return{has:list.length>0,map:map,list:list,vals:vals,min:min,max:max,front:front,mid:mid,heavy:heavy};
}
function topScoredIn(scored,horses,limit){var set={},out=[];(horses||[]).forEach(function(h){set[String(h)]=true;});scored.forEach(function(x){if(set[String(x.h)]&&out.indexOf(String(x.h))<0)out.push(String(x.h));});return out.slice(0,limit||3);}
function detectHandiSwitch(ctx,scored){
  var g=ctx.handi;if(!g||!g.has||g.min===null||g.max===null)return{on:false,triples:[],text:""};
  var spread=g.max-g.min;if(spread<20)return{on:false,triples:[],text:""};
  var frontTop=topScoredIn(scored,g.front,3),midTop=topScoredIn(scored,g.mid,4),heavyTop=topScoredIn(scored,g.heavy,4),triples=[];
  function push(a,b,c){if(!a||!b||!c||a===b||a===c||b===c)return;add(triples,triKey(a,b,c));}
  push(heavyTop[0],midTop[0],frontTop[0]);
  push(heavyTop[0],frontTop[0],frontTop[1]);
  push(heavyTop[0],heavyTop[1],frontTop[0]);
  push(heavyTop[0],midTop[0],midTop[1]);
  push(heavyTop[0],heavyTop[1],heavyTop[2]);
  push(midTop[0],frontTop[0],frontTop[1]);
  return{on:triples.length>0,spread:spread,frontTop:frontTop,midTop:midTop,heavyTop:heavyTop,triples:triples,text:"前="+joinC(frontTop)+" / 中="+joinC(midTop)+" / 重="+joinC(heavyTop)};
}


function entryHorses(e){if(!e)return[];var out=[];if(e.h)add(out,String(e.h));if(e.a)add(out,String(e.a));if(e.b)add(out,String(e.b));if(e.c)add(out,String(e.c));return out;}
function thresholdWindow(list,threshold,label){var arr=sortOdds(list||[]),before=[],after=[];for(var i=0;i<arr.length;i++){var od=Number(arr[i].od);if(od<=threshold)before.push(arr[i]);else after.push(arr[i]);}before=before.slice(Math.max(0,before.length-2));after=after.slice(0,2);return{label:label,threshold:threshold,before:before,after:after};}
function collectThresholdHorses(win){var out=[];(win.before||[]).forEach(function(e){entryHorses(e).forEach(function(h){add(out,h);});});(win.after||[]).forEach(function(e){entryHorses(e).forEach(function(h){add(out,h);});});return out;}
function suddenWallEntries(list,label,limit){var arr=sortOdds(list||[]).slice(0,limit||20),out=[];for(var i=0;i<arr.length-1;i++){var now=Number(arr[i].od),next=Number(arr[i+1].od);if(!now||!next)continue;var ratio=next/now;if(ratio>=1.8)out.push({label:label,ratio:ratio,before:arr[i],after:arr[i+1],pos:i});}return out;}
function detectOtani3WallSwitch(data,ctx,scored){
  var map={},triples=[];
  function ensure(h){h=String(h);if(!map[h])map[h]={h:h,score:0,reasons:[],wallKeys:{},wallCount:0,tan:knownTanOdds(data,h)||'-'};return map[h];}
  function addReason(h,pt,reason,key){var x=ensure(h);x.score+=pt;if(x.reasons.indexOf(reason)<0)x.reasons.push(reason);if(key&&!x.wallKeys[key]){x.wallKeys[key]=true;x.wallCount++;}}
  var tan80=thresholdWindow(ctx.tanRank,80,'単勝80壁'),wide6=thresholdWindow(ctx.wideRank,6,'ワイド6壁'),wide15=thresholdWindow(ctx.wideRank,15,'ワイド15壁');
  tan80.before.forEach(function(e){entryHorses(e).forEach(function(h){addReason(h,14,'単勝80倍壁前','tan80');});});
  tan80.after.forEach(function(e){entryHorses(e).forEach(function(h){addReason(h,8,'単勝80倍壁後','tan80');});});
  wide6.before.forEach(function(e){entryHorses(e).forEach(function(h){addReason(h,12,'ワイド6倍壁前','wide6');});});
  wide6.after.forEach(function(e){entryHorses(e).forEach(function(h){addReason(h,7,'ワイド6倍壁後','wide6');});});
  wide15.before.forEach(function(e){entryHorses(e).forEach(function(h){addReason(h,15,'ワイド15倍壁前','wide15');});});
  wide15.after.forEach(function(e){entryHorses(e).forEach(function(h){addReason(h,8,'ワイド15倍壁後','wide15');});});
  var nishaWalls=suddenWallEntries(ctx.nishaRank,'2車複急壁',16),sanWalls=suddenWallEntries(ctx.sanRank,'3連系急壁',16);
  nishaWalls.slice(0,3).forEach(function(w){entryHorses(w.before).concat(entryHorses(w.after)).forEach(function(h){addReason(h,10,'2車複急壁前後','nishaWall');});});
  sanWalls.slice(0,3).forEach(function(w){entryHorses(w.before).concat(entryHorses(w.after)).forEach(function(h){addReason(h,11,'3連系急壁前後','sanWall');});});
  collectAllHorses(data).forEach(function(h){var x=ensure(h),extra=0;if(ctx.tanM.indexOf(h)>=0){extra+=5;x.reasons.push('単勝メジアン');}if(ctx.nishaM.indexOf(h)>=0){extra+=6;x.reasons.push('2車複メジアン');}if(ctx.wideM.indexOf(h)>=0){extra+=6;x.reasons.push('ワイドメジアン');}if(ctx.sanM.indexOf(h)>=0){extra+=7;x.reasons.push('3連系メジアン');}if(ctx.pseudoAM.indexOf(h)>=0||ctx.pseudoBM.indexOf(h)>=0||ctx.pseudoCM.indexOf(h)>=0){extra+=7;x.reasons.push('擬似複勝メジアン');}if(pairInTop(ctx.pseudoA.row,h,4)||pairInTop(ctx.pseudoB.row,h,4)){extra+=5;x.reasons.push('1人気/2人気連動');}if(countAppearTop(ctx.sanRank,h,8)>=2){extra+=5;x.reasons.push('3連系上位出現');}if(countAppearTop(ctx.wideRank,h,10)>=2){extra+=4;x.reasons.push('ワイド上位出現');}var zi=zoneIndexOf(ctx.baseZones.zones,h);if(zi===1){extra+=6;x.reasons.push('第1壁後');}if(zi===2){extra+=5;x.reasons.push('第2壁後');}if(ctx.handi&&ctx.handi.has){var hv=ctx.handi.map[String(h)];if(hv!==undefined&&ctx.handi.max!==null&&Number(hv)===ctx.handi.max){extra+=4;x.reasons.push('重ハンデ組');}}if((ctx.tanRank[0]&&Number(ctx.tanRank[0].od)<=1.6)||(ctx.nishaRank[0]&&Number(ctx.nishaRank[0].od)<4)){extra+=5;x.reasons.push('上位人気集中の裏穴');}x.score+=extra;});
  var cand=[];for(var k in map){var x=map[k];x.reasons=uniq(x.reasons);if(x.score>=28&&x.wallCount>=1)cand.push(x);}cand.sort(function(a,b){return b.score!==a.score?b.score-a.score:b.wallCount-a.wallCount;});cand=cand.slice(0,8);

  if(ctx.hiddenFloaters&&ctx.hiddenFloaters.length){ctx.hiddenFloaters.forEach(function(x){if(x.bestTri)addBomb(x.bestTri.a,x.bestTri.b,x.bestTri.c);else{if(a&&strong[0])addBomb(a,strong[0],x.h);if(b&&strong[0])addBomb(b,strong[0],x.h);}});}
  if(ctx.handiSwitch&&ctx.handiSwitch.on&&ctx.handiSwitch.triples.length){ctx.handiSwitch.triples.forEach(function(k){add(sanBomb,k);});}
  if(ctx.otaniSwitch&&ctx.otaniSwitch.on&&ctx.otaniSwitch.triples.length){ctx.otaniSwitch.triples.forEach(function(k){add(sanBomb,k);});}
  return{wide:wide.slice(0,8),nisha:nisha.slice(0,8),sanMain:sanMain.slice(0,8),sanHole:sanHole.slice(0,8),sanBomb:sanBomb.slice(0,10)};
}

function renderAreDiag(ctx){var d=ctx.areDiag,html='<div class="card '+(d.risk>=5?'diagWarn':'diag')+'"><div class="title">🩺オート荒れ診断</div>';html+='表面：<span class="'+d.surfaceClass+'">'+d.surface+'</span><br>';html+='裏診断：<span class="'+d.backClass+'">'+d.back+'</span><br>';html+='荒れ警戒スコア：<span class="'+d.backClass+'">'+d.risk+'</span><br><hr>';html+='2車複1人気：<span class="yellow">'+(ctx.nishaRank[0]?ctx.nishaRank[0].key+' '+ctx.nishaRank[0].od+'倍':'なし')+'</span><br>';html+='単勝1人気：<span class="yellow">'+(ctx.tanRank[0]?ctx.tanRank[0].h+'号車 '+ctx.tanRank[0].od+'倍':'なし')+'</span><br>';if(d.tateRatio!==null){html+='タテ目倍率：<span class="yellow">'+d.tateRatio.toFixed(2)+'</span>';if(ctx.tate.tatePair)html+='（'+ctx.tate.tate.join('-')+' '+ctx.tate.tatePair.od+'倍）';html+='<br>';}if(d.noFav)html+='本命なし3連系：<span class="yellow">'+d.noFavRank+'位 '+d.noFav.key+' '+d.noFav.od+'倍</span><br>';if(d.grounds.length)html+='<pre>'+d.grounds.join('\n')+'</pre>';html+='</div>';return html;}
function baseZoneMap(ctx){var m={};(ctx.baseZones.zones||[]).forEach(function(z,i){z.horses.forEach(function(h){m[h]=i;});});return m;}
function renderHonRow(label,row,medians,maxLen,wallInfo,zoneMap){var arr=row.slice();while(arr.length<maxLen)arr.push('');wallInfo=wallInfo||{walls:[],semis:[]};zoneMap=zoneMap||{};var wallPos=wallPosList(wallInfo,'wall'),semiPos=wallPosList(wallInfo,'semi'),html='<div class="honRow"><div class="honLabel">'+label+'</div>';for(var i=0;i<maxLen;i++){var h=arr[i],cls='honNum';if(!h)cls+=' honEmpty';else{if(zoneMap[h]===0)cls+=' zoneMain';else if(zoneMap[h]===1)cls+=' zoneFirst';else if(zoneMap[h]===2)cls+=' zoneSecond';else if(zoneMap[h]>=3)cls+=' zoneCut';else if(medians.indexOf(h)>=0)cls+=' honMed';}html+='<span class="'+cls+'">'+(h||'')+'</span>';if(i<maxLen-1){var bcls='bar';if(wallPos.indexOf(i)>=0)bcls+=' barWall';else if(semiPos.indexOf(i)>=0)bcls+=' barSemiWall';html+='<span class="'+bcls+'"></span>';}}return html+'</div>';}
function makeHonpyo(ctx){var rows=[{label:'単勝',row:ctx.tanRow,m:ctx.tanM,info:wallInfoFromOdds(ctx.tanRank.map(function(x){return Number(x.od);})),zm:{}},{label:'2複基準',row:ctx.baseNisha.row,m:ctx.baseNishaM,info:ctx.baseZones.info,zm:baseZoneMap(ctx)},{label:'ワイド',row:ctx.wideRow,m:ctx.wideM,info:{walls:[],semis:[]},zm:{}},{label:'擬複A',row:ctx.pseudoA.row,m:ctx.pseudoAM,info:wallInfoFromOdds(ctx.pseudoA.pairs.map(function(x){return Number(x.od);})),zm:{}},{label:'擬複B',row:ctx.pseudoB.row,m:ctx.pseudoBM,info:wallInfoFromOdds(ctx.pseudoB.pairs.map(function(x){return Number(x.od);})),zm:{}},{label:'擬複C',row:ctx.pseudoCRow,m:ctx.pseudoCM,info:{walls:[],semis:[]},zm:{}},{label:'3連系',row:ctx.sanRow,m:ctx.sanM,info:{walls:[],semis:[]},zm:{}}],maxLen=0;rows.forEach(function(r){if(r.row.length>maxLen)maxLen=r.row.length;});var html='<div class="card"><div class="title">本表・擬似複勝表</div><div class="small">赤文字＝通常メジアン。2複基準だけは、白＝本線 / 黄＝第1壁後 / 橙＝第2壁後 / 灰＝切り。</div><div class="honWrap">';rows.forEach(function(r){html+=renderHonRow(r.label,r.row,r.m,maxLen,r.info,r.zm);});return html+'</div></div>';}
function makeZoneCard(ctx){var z=ctx.baseZones.zones||[],html='<div class="card"><div class="title">🧱2複基準壁ゾーン</div>基準：<span class="yellow">'+ctx.fav1+'号車</span><br><div class="zoneBox">';for(var i=0;i<Math.min(4,z.length);i++){var cls=(i===0?'good':i===1?'yellow':i===2?'orange':'gray');html+='<div class="zoneLine"><span class="'+cls+'">'+z[i].label+'：</span>'+joinC(z[i].horses)+'</div>';}return html+'</div><pre>'+fmtWallDetails(ctx.baseZones)+'</pre></div>';}
function renderTan100Card(ctx){var items=ctx.tan100||[],html='<div class="card tan100"><div class="title">💴単勝100円保険</div>';if(!items.length)return html+'該当なし</div>';items.forEach(function(x,i){html+='<div class="rankLine"><span class="badge">'+(i+1)+'位 '+x.h+'号車</span> <span class="yellow">'+x.label+'</span> <span class="small">単'+x.tan+' / 指数'+x.score+'　'+x.reasons.join('・')+'</span></div>';});return html+'</div>';}
function renderHandiCard(ctx){if(!ctx.handi||!ctx.handi.has)return'';var html='<div class="card handi"><div class="title">🏁ハンデ大穴3連スイッチ</div>';html+='前：<span class="yellow">'+joinC(ctx.handi.front)+'</span><br>';html+='中：<span class="yellow">'+joinC(ctx.handi.mid)+'</span><br>';html+='重：<span class="yellow">'+joinC(ctx.handi.heavy)+'</span><br>';if(ctx.handiSwitch&&ctx.handiSwitch.on){html+='<hr><span class="warn">💣発動</span><br><span class="small">'+ctx.handiSwitch.text+'</span><pre>'+ctx.handiSwitch.triples.join('\n')+'</pre>';}else{html+='<hr><span class="small">今回はハンデ大穴3連スイッチは弱めです。</span>';}return html+'</div>';}
function makePseudoPairsText(p){if(!p||!p.pairs||!p.pairs.length)return'なし';return p.pairs.slice(0,8).map(function(x){var other=x.a===p.anchor?x.b:x.a;return p.anchor+'-'+other+' '+x.od;}).join('\n');}

function run(){try{var data=parseData(document.getElementById('input').value),out=document.getElementById('out');if(!data.tansho.length||!data.wide.length){out.innerHTML='<div class="card"><div class="title warn">入力不足</div>[TANSHO] と [WIDE] が必要です。</div>';return;}var ctx=makeContext(data),scored=scoreAll(data,ctx);ctx.hiddenFloaters=detectHiddenFloaters(data,ctx,scored);ctx.tan100=detectTan100Insurance(data,ctx,scored);ctx.handiSwitch=detectHandiSwitch(ctx,scored);ctx.otaniSwitch=detectOtani3WallSwitch(data,ctx,scored);var tickets=makeTickets(data,ctx,scored),lamps=[];
lamps.push('🧪オート擬似複勝テスト：A='+joinC(ctx.pseudoAM)+' / B='+joinC(ctx.pseudoBM)+' / C='+joinC(ctx.pseudoCM));var overlapA=ctx.tanM.filter(function(h){return ctx.pseudoAM.indexOf(h)>=0;});if(overlapA.length)lamps.push('🔥単勝×擬似複勝Aメジアン重複：'+joinC(overlapA));var overlapW=ctx.wideM.filter(function(h){return ctx.pseudoAM.indexOf(h)>=0||ctx.pseudoBM.indexOf(h)>=0;});if(overlapW.length)lamps.push('🟣ワイド×擬似複勝メジアン重複：'+joinC(overlapW));if(ctx.baseZones&&ctx.baseZones.zones&&ctx.baseZones.zones.length>1)lamps.push('🧱2複基準壁ゾーン：本線 '+joinC(ctx.baseZones.zones[0].horses)+' / 第1壁後 '+joinC(ctx.baseZones.zones[1].horses)+' / 第2壁後 '+joinC(ctx.baseZones.zones[2]?ctx.baseZones.zones[2].horses:[]));if(ctx.tate&&ctx.tate.red)lamps.push('🚨オート本命飛び壁ランプ：タテ目倍率 '+ctx.tate.tateRatio.toFixed(2)+' / 本命なし3連系 '+ctx.tate.noFavSan.key+' '+ctx.tate.noFavSan.od+'倍');if(scored[0]&&scored[0].score>=30)lamps.push('🚨擬似複勝テスト強反応：'+scored[0].h+'号車【'+scored[0].score+'】');if(ctx.tan100&&ctx.tan100.length)lamps.push('💴単勝100円保険：'+ctx.tan100.map(function(x){return x.h+'号車 単'+x.tan;}).join('・'));if(ctx.hiddenFloaters&&ctx.hiddenFloaters.length)lamps.push('🫥単勝未表示・連系浮上3着救済：'+ctx.hiddenFloaters.map(function(x){return x.h+'号車'+(x.bestTri?'（'+x.bestTri.key+'）':'');}).join('・'));if(ctx.handi&&ctx.handi.has)lamps.push('🏁ハンデ補正：前 '+joinC(ctx.handi.front)+' / 中 '+joinC(ctx.handi.mid)+' / 重 '+joinC(ctx.handi.heavy));if(ctx.handiSwitch&&ctx.handiSwitch.on)lamps.push('💣ハンデ大穴3連スイッチ：'+ctx.handiSwitch.text+' / 候補 '+ctx.handiSwitch.triples.join('・'));if(ctx.otaniSwitch&&ctx.otaniSwitch.on)lamps.push('📚大谷式3壁スイッチ '+ctx.otaniSwitch.grade+'：候補 '+ctx.otaniSwitch.candidates.slice(0,4).map(function(x){return x.h+'号車【'+x.score+'】';}).join('・'));
var html='<div class="card"><div class="title">'+data.title+'</div>';html+='単勝1人気：<span class="yellow">'+(ctx.tanRank[0]?ctx.tanRank[0].h+'号車 '+ctx.tanRank[0].od+'倍':'なし')+'</span><br>';html+='単勝2人気：<span class="yellow">'+(ctx.tanRank[1]?ctx.tanRank[1].h+'号車 '+ctx.tanRank[1].od+'倍':'なし')+'</span><br>';html+='2車複1人気：<span class="yellow">'+(ctx.nishaRank[0]?ctx.nishaRank[0].key+' '+ctx.nishaRank[0].od+'倍':'なし')+'</span><br>';html+='ワイド1人気：<span class="yellow">'+(ctx.wideRank[0]?ctx.wideRank[0].key+' '+ctx.wideRank[0].od+'倍':'なし')+'</span><br>';html+='3連系1人気：<span class="yellow">'+(ctx.sanRank[0]?ctx.sanRank[0].key+' '+ctx.sanRank[0].od+'倍':'なし')+'</span></div>';html+=renderAreDiag(ctx);html+='<div class="card lamp"><div class="title">発動・テストランプ</div>'+lamps.join('<br>')+'<hr><span class="small">V24.11：ハンデ大穴3連スイッチ＋大谷式3壁スイッチを搭載。単勝80壁・ワイド6壁・ワイド15壁・2車複/3連系急壁を大荒れ保険へ入れます。</span></div>';html+=makeZoneCard(ctx);html+=renderTan100Card(ctx);html+=renderHandiCard(ctx);html+=renderOtaniCard(ctx);if(ctx.hiddenFloaters&&ctx.hiddenFloaters.length){html+='<div class="card lamp"><div class="title">🫥単勝未表示・連系浮上3着救済</div>';ctx.hiddenFloaters.forEach(function(x,i){html+='<div class="rankLine"><span class="badge">'+(i+1)+'位 '+x.h+'号車</span> <span class="small">2車複出現'+x.nisha+' / ワイド出現'+x.wide+' / 3連系出現'+x.san+(x.bestTri?' / 注目3連系 '+x.bestRank+'位 '+x.bestTri.key+' '+x.bestTri.od+'倍':'')+'</span></div>';});html+='</div>';}html+=makeHonpyo(ctx);html+='<div class="card"><div class="title">🧪擬似複勝の中身</div><b>A：単勝1人気 '+ctx.fav1+'号車から</b><pre>'+makePseudoPairsText(ctx.pseudoA)+'</pre><b>B：単勝2人気 '+ctx.fav2+'号車から</b><pre>'+makePseudoPairsText(ctx.pseudoB)+'</pre><b>C：ワイド上位10点の出現回数</b><pre>'+ctx.pseudoC.slice(0,8).map(function(x){return x.h+'号車 出現'+x.count+'回 / 最安'+x.best;}).join('\n')+'</pre></div>';html+='<div class="card"><div class="title">👑検証候補ランキング</div>';for(var i=0;i<Math.min(8,scored.length);i++){var x=scored[i];html+='<div class="rankLine"><span class="badge">'+(i+1)+'位 '+x.h+'号車【'+x.score+'】</span> <span class="small">単'+x.tan+'　'+x.reasons.join('・')+'</span></div>';}html+='</div>';html+='<div class="card lamp2"><div class="title">💰テスト買い目候補</div><pre>';html+='ワイド\n'+(tickets.wide.length?tickets.wide.join('\n'):'なし')+'\n\n';html+='2車複\n'+(tickets.nisha.length?tickets.nisha.join('\n'):'なし')+'\n\n';html+='3連系・本線\n'+(tickets.sanMain.length?tickets.sanMain.join('\n'):'なし')+'\n\n';html+='3連系・穴本線\n'+(tickets.sanHole.length?tickets.sanHole.join('\n'):'なし')+'\n\n';html+='3連系・大荒れ保険\n'+(tickets.sanBomb.length?tickets.sanBomb.join('\n'):'なし')+'\n\n';html+='単勝100円保険\n'+(ctx.tan100&&ctx.tan100.length?ctx.tan100.map(function(x){return x.h+'　単'+x.tan+'　'+x.label;}).join('\n'):'なし');html+='</pre></div>';out.innerHTML=html;latestCopyText=makeCopyText(data.title,ctx,scored,tickets,lamps);}catch(e){document.getElementById('out').innerHTML='<div class="card"><div class="title warn">エラー</div><pre>'+String(e&&e.message?e.message:e)+'</pre></div>';}}

function makeCopyText(title,ctx,scored,tickets,lamps){var t='';t+=title+'\nオート擬似複勝テスト版 V24.11 大谷式3壁スイッチ\n';t+='発動：'+lamps.join(' / ')+'\n\n';t+='🩺オート荒れ診断\n表面：'+ctx.areDiag.surface+'\n裏診断：'+ctx.areDiag.back+'\n';if(ctx.areDiag.back.indexOf('本命固定')>=0)t+='👑本命固定×本線×第1壁後補正 発動\n';t+='荒れ警戒スコア：'+ctx.areDiag.risk+'\n';if(ctx.areDiag.tateRatio!==null)t+='タテ目倍率：'+ctx.areDiag.tateRatio.toFixed(2)+'\n';if(ctx.areDiag.noFav)t+='本命なし3連系：'+ctx.areDiag.noFavRank+'位 '+ctx.areDiag.noFav.key+' '+ctx.areDiag.noFav.od+'倍\n';t+='\n2複基準壁ゾーン\n基準：'+ctx.fav1+'号車\n';var z=ctx.baseZones.zones||[];for(var i=0;i<Math.min(4,z.length);i++)t+=z[i].label+'：'+joinC(z[i].horses)+'\n';t+='壁：\n'+fmtWallDetails(ctx.baseZones)+'\n\n';t+='擬似複勝A：単勝1人気 '+ctx.fav1+'号車から\n'+joinC(ctx.pseudoA.row)+'\n擬似複勝Aメジアン：'+joinC(ctx.pseudoAM)+'\n';t+='擬似複勝B：単勝2人気 '+ctx.fav2+'号車から\n'+joinC(ctx.pseudoB.row)+'\n擬似複勝Bメジアン：'+joinC(ctx.pseudoBM)+'\n';t+='擬似複勝C：ワイド出現回数\n'+joinC(ctx.pseudoCRow)+'\n擬似複勝Cメジアン：'+joinC(ctx.pseudoCM)+'\n\n';t+='メジアン\n単勝：'+joinC(ctx.tanM)+'\n2車複：'+joinC(ctx.nishaM)+'\nワイド：'+joinC(ctx.wideM)+'\n3連系：'+joinC(ctx.sanM)+'\n\n';if(ctx.handi&&ctx.handi.has){t+='ハンデ補正\n前：'+joinC(ctx.handi.front)+'\n中：'+joinC(ctx.handi.mid)+'\n重：'+joinC(ctx.handi.heavy)+'\n';if(ctx.handiSwitch&&ctx.handiSwitch.on)t+='ハンデ大穴3連スイッチ：'+ctx.handiSwitch.triples.join(' / ')+'\n';t+='\n';}if(ctx.otaniSwitch&&ctx.otaniSwitch.on){t+='大谷式3壁スイッチ：'+ctx.otaniSwitch.grade+' / 最高'+ctx.otaniSwitch.top+'\n';ctx.otaniSwitch.candidates.slice(0,6).forEach(function(x,i){t+=(i+1)+'位 '+x.h+'号車【'+x.score+'】 壁'+x.wallCount+'点 '+x.reasons.join('・')+'\n';});if(ctx.otaniSwitch.triples.length)t+='大谷式大穴保険：'+ctx.otaniSwitch.triples.join(' / ')+'\n';t+='\n';}if(ctx.tan100&&ctx.tan100.length){t+='単勝100円保険\n';ctx.tan100.forEach(function(x){t+=x.h+'号車 単'+x.tan+' '+x.label+' '+x.reasons.join('・')+'\n';});t+='\n';}if(ctx.hiddenFloaters&&ctx.hiddenFloaters.length){t+='単勝未表示・連系浮上3着救済\n';ctx.hiddenFloaters.forEach(function(x){t+=x.h+'号車 '+(x.bestTri?x.bestRank+'位 '+x.bestTri.key+' '+x.bestTri.od+'倍':'連系浮上')+'\n';});t+='\n';}t+='検証候補\n';for(var i=0;i<Math.min(5,scored.length);i++)t+=(i+1)+'位 '+scored[i].h+'号車【'+scored[i].score+'】 単'+scored[i].tan+' '+scored[i].reasons.join('・')+'\n';t+='\nテスト買い目候補\nワイド\n'+tickets.wide.join('\n')+'\n\n2車複\n'+tickets.nisha.join('\n')+'\n\n3連系・本線\n'+tickets.sanMain.join('\n')+'\n\n3連系・穴本線\n'+tickets.sanHole.join('\n')+'\n\n3連系・大荒れ保険\n'+tickets.sanBomb.join('\n')+'\n\n単勝100円保険\n'+((ctx.tan100&&ctx.tan100.length)?ctx.tan100.map(function(x){return x.h+' 単'+x.tan;}).join('\n'):'なし')+'\n';return t;}

function copyResult(){if(!latestCopyText){alert('先に解析してください');return;}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(latestCopyText).then(function(){alert('結果をコピーしました');}).catch(function(){fallbackCopy(latestCopyText);});}else fallbackCopy(latestCopyText);}
function fallbackCopy(text){var ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);alert('結果をコピーしました');}
