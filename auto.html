<style>

}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#06101f,#08182e 45%,#040914);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;padding:14px;font-size:17px;line-height:1.48}

.badge{display:inline-block;border-radius:999px;padding:7px 10px;margin:3px 4px 3px 0;font-weight:900;background:#172a49;color:#fff;border:1px solid #335b92}
.badge.blue{background:#123765;color:#bfe0ff}.badge.yellow{background:#3b3104;color:#fff1a8}.badge.orange{background:#4a2208;color:#ffd0aa}.badge.pink{background:#4d1233;color:#ffc6e5}.badge.green{background:#06361d;color:#baf7d0}.badge.red{background:#4b0614;color:#ffc1cc}

.tableWrap{overflow-x:auto;border-radius:18px;background:#050b16;border:1px solid #263b5f;padding:10px}.rankTable{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-weight:900}.rankTable th,.rankTable td{padding:9px 12px;text-align:center;border-right:3px solid var(--line);border-bottom:1px solid #1e3557;min-width:62px}.rankTable th:first-child,.rankTable td:first-child{position:sticky;left:0;background:#071529;text-align:left;min-width:86px;z-index:2}.rankTable th{color:#cfe3ff;background:#0c1b33}.rankTable .wall1{border-right-color:var(--wall1);box-shadow:inset -3px 0 0 rgba(253,224,71,.65)}.rankTable .wall2{border-right-color:var(--wall2);box-shadow:inset -3px 0 0 rgba(251,146,60,.72)}.rankTable .wall3{border-right-color:var(--wall3);box-shadow:inset -4px 0 0 rgba(244,114,182,.80)}.rankTable .wall4{border-right-color:var(--wall4);box-shadow:inset -4px 0 0 rgba(251,113,133,.85)}
.car{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;font-size:22px;font-weight:1000;margin:1px 2px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.c1{background:#e5e7eb;color:#111}.c2{background:#111827}.c3{background:#dc2626}.c4{background:#2563eb}.c5{background:#facc15;color:#111}.c6{background:#16a34a}.c7{background:#ea580c}.c8{background:#d946ef}.c9{background:#ec4899}.c10{background:#f97316}.c11{background:#fb7185}.c12{background:#a855f7}.c13{background:#e879f9}.c14{background:#94a3b8;color:#111}

<body>
<h1>チャッピー神予想 オート V24.20<br>大荒れ5車BOX＋前位置単騎残り補正</h1>
<div class="sub">壁色つき＋メジアン祭り＋オート大荒れ5車BOX＋前位置単騎残り補正＋結果コピー</div>
<textarea id="input" placeholder="ここに貼り付け&#10;【飯塚8R】&#10;[HANDICAP]&#10;1 0 0.21 3.43&#10;...&#10;[TANSHO]&#10;2 1.2&#10;...&#10;[NIREN]&#10;2-3 1.5&#10;...&#10;[WIDE]&#10;2-6 1.4&#10;...&#10;[SANREN]&#10;2-3-6 2.5"></textarea>
<div>
  <button class="go" onclick="run()">解析する</button>
  <button class="clear" onclick="document.getElementById('input').value='';document.getElementById('out').innerHTML=''">クリア</button>
  <button class="sample" onclick="sample()">サンプル</button>
  <button class="copybtn" onclick="copyResult()">結果コピー</button>
</div>
<div id="out"></div>
<script>
let latestCopyText='';
const $=id=>document.getElementById(id);
const carSpan=n=>`<span class="car c${Number(n)}">${n}</span>`;
function norm(s){return String(s||'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[．]/g,'.').replace(/[－ー―–—]/g,'-').replace(/[＝]/g,'=').replace(/[〜～]/g,'~');}
function parseNum(x){if(x==null)return NaN; const m=String(x).replace(/,/g,'').match(/\d+(?:\.\d+)?/); return m?parseFloat(m[0]):NaN;}
function secName(line){const m=line.match(/^\s*\[([^\]]+)\]/);return m?m[1].toUpperCase():null;}
function splitCombo(s){return norm(s).split(/[-=]/).map(x=>parseInt(x,10)).filter(n=>!isNaN(n));}
function comboKey(arr){return arr.map(Number).sort((a,b)=>a-b).join('-');}
function parseInput(txt){
  txt=norm(txt); const lines=txt.split(/\n/).map(x=>x.trim()).filter(Boolean); let race='【オート】'; let sec='';
  const data={handicap:{},tansho:[],niren:[],wide:[],sanren:[]};
  for(const line of lines){
    if(line.startsWith('【')){race=line; continue;}
    const sn=secName(line); if(sn){sec=sn; continue;}
    if(/^#/.test(line))continue;
    const parts=line.split(/\s+/);
    if(sec==='HANDICAP'){
      if(parts.length>=4){ const car=parseInt(parts[0],10), han=parseInt(parts[1],10), st=parseNum(parts[2]), trial=parseNum(parts[3]); if(car) data.handicap[car]={handicap:han,st,trial}; }
    }else if(sec==='TANSHO'||sec==='TANFUKU'){
      if(parts.length>=2){ const car=parseInt(parts[0],10), odds=parseNum(parts[1]); if(car&&!isNaN(odds)) data.tansho.push({car,odds}); }
    }else if(sec==='NIREN'||sec==='UMAREN'||sec==='2REN'||sec==='NISHA'){
      if(parts.length>=2){ const c=splitCombo(parts[0]); const odds=parseNum(parts[1]); if(c.length===2&&!isNaN(odds)) data.niren.push({cars:c,odds,key:comboKey(c)}); }
    }else if(sec==='WIDE'){
      if(parts.length>=2){ const c=splitCombo(parts[0]); const odds=parseNum(parts.slice(1).join(' ')); if(c.length===2&&!isNaN(odds)) data.wide.push({cars:c,odds,key:comboKey(c)}); }
    }else if(sec==='SANREN'||sec==='SANPUKU'||sec==='3REN'||sec==='SANRENP'){
      if(parts.length>=2){ const c=splitCombo(parts[0]); const odds=parseNum(parts[1]); if(c.length===3&&!isNaN(odds)) data.sanren.push({cars:c,odds,key:comboKey(c)}); }
    }
  }
  for(const k of ['tansho','niren','wide','sanren']) data[k].sort((a,b)=>a.odds-b.odds);
  return {race,data};
}
function medianCars(list, kind){
  if(!list.length)return [];
  const mid=(list.length-1)/2; const idxs=Number.isInteger(mid)?[mid]:[Math.floor(mid),Math.ceil(mid)];
  const set=new Set();
  idxs.forEach(i=>{ const it=list[i]; if(!it)return; if(kind==='tansho')set.add(it.car); else it.cars.forEach(c=>set.add(c)); });
  return [...set];
}
function freqTop(list, topN){const m={}; list.slice(0,topN).forEach(it=>it.cars.forEach(c=>m[c]=(m[c]||0)+1)); return m;}
function rankCars(list, kind, topN=5){
  if(kind==='tansho') return list.slice(0,topN).map(x=>x.car);
  const f=freqTop(list, Math.min(topN,list.length));
  return Object.entries(f).sort((a,b)=>b[1]-a[1] || Number(a[0])-Number(b[0])).map(([c])=>Number(c)).slice(0,topN);
}
function gapWalls(list, kind){
  // returns wall after rank position. rankPos is 1-based after which wall appears
  const odds=list.map(x=>x.odds); const walls=[];
  for(let i=0;i<odds.length-1;i++){
    const a=odds[i], b=odds[i+1]; if(!isFinite(a)||!isFinite(b))continue;
    const diff=b-a, ratio=b/a;
    let level=0;
    if(ratio>=3.2 || diff>=80) level=4;
    else if(ratio>=2.2 || diff>=35) level=3;
    else if(ratio>=1.65 || diff>=16) level=2;
    else if(ratio>=1.35 || diff>=7) level=1;
    if(level) walls.push({pos:i+1,level,from:a,to:b,ratio,diff});
  }
  if(!walls.length && odds.length>=4){
    // always show biggest natural gap as wall1 if meaningful
    let best=null; for(let i=0;i<odds.length-1;i++){const a=odds[i],b=odds[i+1]; const score=(b/a)+(b-a)/10; if(!best||score>best.score)best={pos:i+1,level:1,from:a,to:b,ratio:b/a,diff:b-a,score};}
    if(best && (best.ratio>=1.2||best.diff>=3)) walls.push(best);
  }
  return walls.sort((a,b)=>a.pos-b.pos);
}
function wallClass(pos,walls){ const w=walls.find(w=>w.pos===pos); return w?`wall${w.level}`:''; }
function rankTable(rows,wallsByName){
  const maxLen=Math.max(...Object.values(rows).map(r=>r.length)); let html='<div class="tableWrap"><table class="rankTable"><tr><th>本表</th>';
  for(let i=1;i<=maxLen;i++) html+=`<th>${i}</th>`; html+='</tr>';
  for(const [name,arr] of Object.entries(rows)){
    html+=`<tr><th>${name}</th>`;
    const walls=wallsByName[name]||[];
    for(let i=0;i<maxLen;i++){
      const cls=wallClass(i+1,walls); html+=`<td class="${cls}">${arr[i]?carSpan(arr[i]):''}</td>`;
    }
    html+='</tr>';
  }
  html+='</table></div>';return html;
}
function wallSummary(wallsByName){
  const names=Object.keys(wallsByName); const posMap={};
  names.forEach(n=>wallsByName[n].forEach(w=>{const k=w.pos; (posMap[k]||(posMap[k]=[])).push(n)}));
  const common=Object.entries(posMap).filter(([p,ns])=>ns.length>=2).sort((a,b)=>b[1].length-a[1].length);
  const positions=names.map(n=>wallsByName[n][0]?.pos||null).filter(x=>x!=null);
  const unique=[...new Set(positions)];
  const main=common[0];
  let flags=[];
  if(main && main[1].length>=3) flags.push({name:'共通壁ロック',txt:`${main[1].join('・')} が${main[0]}位後ろで壁。市場の合意が強い。`});
  if(unique.length>=3) flags.push({name:'ズレ壁警報',txt:`壁位置が ${unique.join(' / ')} に分散。単勝評価と連系評価が割れている。`});
  else if(unique.length===2) flags.push({name:'軽いズレ壁',txt:`壁位置が ${unique.join(' / ')} に分かれる。壁またぎ候補を確認。`});
  return {common,flags};
}
function posIn(arr,car){const i=arr.indexOf(Number(car));return i>=0?i+1:999;}
function analyze({race,data}){
  const cars=[...new Set([...data.tansho.map(x=>x.car),...Object.keys(data.handicap).map(Number),...data.niren.flatMap(x=>x.cars),...data.wide.flatMap(x=>x.cars),...data.sanren.flatMap(x=>x.cars)])].sort((a,b)=>a-b);
  const rows={
    '単勝':rankCars(data.tansho,'tansho',Math.min(7,cars.length)),
    '2車複':rankCars(data.niren,'niren',Math.min(7,cars.length)),
    'ワイド':rankCars(data.wide,'wide',Math.min(7,cars.length)),
    '3連系':rankCars(data.sanren,'sanren',Math.min(7,cars.length))
  };
  const wallsByName={
    '単勝':gapWalls(data.tansho,'tansho'),
    '2車複':gapWalls(data.niren,'niren'),
    'ワイド':gapWalls(data.wide,'wide'),
    '3連系':gapWalls(data.sanren,'sanren')
  };
  const med={
    '単勝':medianCars(data.tansho,'tansho'),
    '2車複':medianCars(data.niren,'niren'),
    'ワイド':medianCars(data.wide,'wide'),
    '3連系':medianCars(data.sanren,'sanren')
  };
  const topFreq={niren:freqTop(data.niren,10),wide:freqTop(data.wide,10),sanren:freqTop(data.sanren,20)};
  const hvals=Object.values(data.handicap); const minTrial=Math.min(...hvals.map(x=>x.trial).filter(isFinite)); const minSt=Math.min(...hvals.map(x=>x.st).filter(isFinite)); const maxHan=Math.max(...hvals.map(x=>x.handicap).filter(isFinite));
  const wallInfo=wallSummary(wallsByName);
  const candidates=[];
  for(const c of cars){
    let score=0, notes=[];
    const tan=data.tansho.find(x=>x.car===c); const odds=tan?.odds??999;
    const medCount=Object.values(med).filter(a=>a.includes(c)).length;
    if(medCount>=3){score+=35+medCount*8; notes.push(`メジアン祭り${medCount}表`)} else if(medCount){score+=medCount*8; notes.push(`${medCount}表メジアン`)}
    const allRemain=Object.values(rows).every(r=>r.includes(c));
    if(allRemain){score+=26; notes.push('全表残り')}
    const posT=posIn(rows['単勝'],c), posN=posIn(rows['2車複'],c), posW=posIn(rows['ワイド'],c), posS=posIn(rows['3連系'],c);
    const avgPos=[posT,posN,posW,posS].filter(x=>x<999).reduce((a,b)=>a+b,0)/[posT,posN,posW,posS].filter(x=>x<999).length;
    if(posW<=3){score+=12; notes.push('ワイド上位')}
    if(posS<=4){score+=10; notes.push('3連系上位')}
    if(topFreq.sanren[c]>=5){score+=topFreq.sanren[c]*2; notes.push(`3連系上位出現${topFreq.sanren[c]}回`)}
    if(topFreq.wide[c]>=4){score+=8; notes.push(`ワイド上位出現${topFreq.wide[c]}回`)}
    if(topFreq.niren[c]>=4){score+=8; notes.push(`2車複上位出現${topFreq.niren[c]}回`)}
    const hp=data.handicap[c];
    if(hp){
      if(isFinite(hp.trial)&&hp.trial<=minTrial+0.01){score+=16; notes.push('試走最上位級')}
      else if(isFinite(hp.trial)&&hp.trial<=minTrial+0.03){score+=8; notes.push('試走上位')}
      if(isFinite(hp.st)&&hp.st<=minSt+0.03){score+=10; notes.push('ST上位')}
      if(isFinite(hp.handicap)&&hp.handicap===maxHan && maxHan>0){score+=5; notes.push('重ハンデ実力車')}
    }
    // wall crossing: outside single but inside relation tables
    const tanWall=wallsByName['単勝'][0]?.pos||3; const relWall=Math.max(wallsByName['2車複'][0]?.pos||3,wallsByName['ワイド'][0]?.pos||3,wallsByName['3連系'][0]?.pos||3);
    if(posT>tanWall && (posN<=relWall || posW<=relWall || posS<=relWall)){score+=20; notes.push('壁またぎ受け皿')}
    if(posT<=tanWall && posN>relWall && posW>relWall && posS>relWall){score-=18; notes.push('単勝だけ過剰人気警戒')}
    if(odds>=40 && (posW<=5||posS<=5)){score+=8; notes.push('単勝40倍超は3着穴寄り')}
    if(odds<2 && score<45){notes.push('単勝1人気だが中身確認')}
    candidates.push({car:c,score:Math.round(score),odds,notes,avgPos,posT,posN,posW,posS,hp});
  }
  candidates.sort((a,b)=>b.score-a.score || a.avgPos-b.avgPos || a.car-b.car);
  const medianFestival=candidates.filter(x=>x.notes.some(n=>n.startsWith('メジアン祭り')));
  const allTableStrong=candidates.filter(x=>x.notes.includes('全表残り') && (x.notes.includes('試走最上位級')||x.notes.includes('ST上位')||x.notes.includes('重ハンデ実力車')));
  const wallCross=candidates.filter(x=>x.notes.includes('壁またぎ受け皿'));
  const overPop=candidates.filter(x=>x.notes.includes('単勝だけ過剰人気警戒'));
  const core=medianFestival[0]||candidates[0];
  const receiver=allTableStrong.find(x=>x.car!==core.car)||wallCross.find(x=>x.car!==core.car)||candidates.find(x=>x.car!==core.car && x.score>=35);
  const price=candidates.find(x=>x.car!==core.car && (!receiver||x.car!==receiver.car) && x.odds>=10 && x.score>=30)||candidates.find(x=>x.car!==core.car && (!receiver||x.car!==receiver.car));
  const protect=[];
  function addCombo(a,b,c,reason){if([a,b,c].every(Boolean)){const key=comboKey([a,b,c]); if(!protect.some(x=>x.key===key)) protect.push({key,reason,cars:key.split('-').map(Number)});}}
  addCombo(core?.car,receiver?.car,price?.car,'メジアン祭り×全表残り実力受け皿×配当役');
  if(core&&receiver){
    const rel=[...candidates].filter(x=>x.car!==core.car&&x.car!==receiver.car).slice(0,4);
    rel.forEach(x=>addCombo(core.car,receiver.car,x.car,'核×受け皿×候補上位'));
  }
  if(medianFestival[0]){
    candidates.slice(1,6).forEach(a=>candidates.slice(1,6).forEach(b=>{if(a.car<b.car && (a.notes.includes('全表残り')||b.notes.includes('全表残り'))) addCombo(medianFestival[0].car,a.car,b.car,'メジアン祭り保護');}));
  }
  return {race,data,cars,rows,wallsByName,med,candidates,wallInfo,medianFestival,allTableStrong,wallCross,overPop,protect};
}
function oddsOfSanren(data,key){const it=data.sanren.find(x=>x.key===key); return it?it.odds:null;}

function uniquePush(arr,v){ if(v!=null && !arr.includes(Number(v))) arr.push(Number(v)); }
function predictFormation(res){
  const cs=res.candidates||[];
  if(!cs.length) return null;
  // 1着軸は総合1位を優先。メジアン祭りが上っ面警戒の時は頭固定ではなく2・3着箱へ落とす。
  let head=cs[0].car;
  const medCar=res.medianFestival?.[0]?.car;
  const box=[];
  // 2・3着箱：メジアン祭り、全表残り受け皿、壁またぎ、総合上位から3車
  if(medCar && medCar!==head) uniquePush(box,medCar);
  (res.wallCross||[]).forEach(x=>{ if(x.car!==head) uniquePush(box,x.car); });
  (res.allTableStrong||[]).forEach(x=>{ if(x.car!==head) uniquePush(box,x.car); });
  cs.forEach(x=>{ if(x.car!==head) uniquePush(box,x.car); });
  const box3=box.slice(0,3).sort((a,b)=>a-b);
  const boxStr=box3.join('');
  // 抑え頭：箱に入らなかった上位人気/過剰人気/総合上位を1頭
  let cover=(res.overPop||[]).find(x=>x.car!==head && !box3.includes(x.car))?.car;
  if(!cover) cover=cs.find(x=>x.car!==head && !box3.includes(x.car))?.car;
  if(!cover) cover=box3[0];
  // 厚張り1点：本線フォメ内で3連系オッズが一番前に出ている組を、1着軸から表示
  let one='';
  const combos=[];
  for(let i=0;i<box3.length;i++) for(let j=i+1;j<box3.length;j++) combos.push([head,box3[i],box3[j]]);
  let best=null;
  combos.forEach(c=>{
    const key=comboKey(c);
    const o=oddsOfSanren(res.data,key);
    if(o!=null && (!best || o<best.odds)) best={cars:c,odds:o,key};
  });
  if(best){
    // keyは昇順なので、頭だけ固定して残りはオッズ表の自然順（昇順）で表示
    const rest=best.key.split('-').map(Number).filter(x=>x!==head);
    one=String(head)+rest.join('');
  }else if(box3.length>=2){
    one=String(head)+box3.slice(0,2).join('');
  }
  return {
    head,box:box3,boxStr,cover,one,
    main:`${head}-${boxStr}-${boxStr}`,
    osa:`${cover}-${head}-${boxStr}`,
    note:`1着は総合1位・壁またぎ/連系中心を優先。メジアン祭りや上っ面警戒馬は消さずに2・3着箱へ残す。`
  };
}

function kumi2(a,b){return [a,b].map(Number).sort((x,y)=>x-y).join('-');}
function kumi3(a,b,c){return [a,b,c].map(Number).sort((x,y)=>x-y).join('-');}
function boxPairs(cars){const out=[]; for(let i=0;i<cars.length;i++) for(let j=i+1;j<cars.length;j++) out.push(kumi2(cars[i],cars[j])); return out;}
function boxTris(cars){const out=[]; for(let i=0;i<cars.length;i++) for(let j=i+1;j<cars.length;j++) for(let k=j+1;k<cars.length;k++) out.push(kumi3(cars[i],cars[j],cars[k])); return out;}
function detectAutoWild5Box(res){
  const cs=res.candidates||[], data=res.data||{};
  if(!cs.length) return {on:false,box:[],reason:[],front:null,frontAdded:false,signCount:0,types:0,targetCars:0,pairs:[],tris:[],single:[],frontIns:[]};
  const reason=[], typeSet=new Set(), targetSet=new Set();
  function mark(type, arr){ if(arr&&arr.length){typeSet.add(type); arr.forEach(x=>targetSet.add(Number(x.car||x)));} }
  mark('メジアン祭り',res.medianFestival);
  mark('全表残り',res.allTableStrong);
  mark('壁またぎ',res.wallCross);
  mark('過剰人気',res.overPop);
  mark('3連系メジアン分散',(res.med&&res.med['3連系']||[]).map(c=>({car:c})));
  cs.forEach(x=>{
    const ns=(x.notes||[]).join('・');
    if(ns.includes('単勝40倍超')){typeSet.add('単勝40倍超'); targetSet.add(x.car);}
    if(ns.includes('試走最上位級')||ns.includes('試走上位')){typeSet.add('試走上位'); targetSet.add(x.car);}
    if(ns.includes('ST上位')){typeSet.add('ST上位'); targetSet.add(x.car);}
  });
  const signCount=(res.medianFestival?.length||0)+(res.allTableStrong?.length||0)+(res.wallCross?.length||0)+(res.overPop?.length||0)+cs.filter(x=>(x.notes||[]).some(n=>/試走|ST|単勝40倍/.test(n))).length;
  const fav=data.tansho&&data.tansho[0] ? data.tansho[0] : null;
  const favObj=fav ? cs.find(x=>x.car===fav.car) : null;
  const favLowRank = favObj ? (cs.findIndex(x=>x.car===fav.car)+1)>=4 : false;
  const manyMedian=(res.medianFestival?.length||0)>=3;
  const manyRemain=(res.allTableStrong?.length||0)>=4;
  const manyWall=(res.wallCross?.length||0)>=5;
  const sanSpread=((res.med&&res.med['3連系'])||[]).length>=5;
  const favFly=(fav&&fav.odds<=1.5&&(manyWall||sanSpread||favLowRank));
  const trigger = manyMedian || manyRemain || manyWall || sanSpread || favFly || (signCount>=10 && targetSet.size>=5 && typeSet.size>=5);
  if(manyMedian) reason.push('メジアン祭りが3車以上');
  if(manyRemain) reason.push('全表残り実力受け皿が4車以上');
  if(manyWall) reason.push('壁またぎ受け皿が5車以上');
  if(sanSpread) reason.push('3連系メジアンが5車以上に分散');
  if(favFly) reason.push('単勝1人気1.5倍以下でも相手側サインが多く本命飛び警戒');
  if(signCount>=10) reason.push('異常サイン密度が高い');
  // 最前位置単騎補正
  let front=null, frontAdded=false;
  const hs=Object.entries(data.handicap||{}).map(([c,h])=>({car:Number(c),...h})).filter(x=>Number.isFinite(x.handicap));
  if(hs.length){
    const minH=Math.min(...hs.map(x=>x.handicap));
    const fronts=hs.filter(x=>x.handicap===minH);
    if(fronts.length===1){
      const fc=fronts[0].car; const fo=(data.tansho||[]).find(x=>x.car===fc)?.odds ?? 999;
      const fObj=cs.find(x=>x.car===fc);
      const medHit=Object.values(res.med||{}).filter(a=>(a||[]).includes(fc)).length;
      const wallHit=(res.wallCross||[]).some(x=>x.car===fc);
      if(fo>=8 && fo<=45 && (wallHit || medHit>=1 || (fObj&&fObj.score>=35))){
        front={car:fc,odds:fo,medHit,wallHit,score:fObj?fObj.score:0,reason:`最前位置${minH}m単騎・単勝${fo}・${medHit}表メジアン${wallHit?'・壁またぎ受け皿':''}`};
        typeSet.add('前位置単騎残り'); targetSet.add(fc);
        if(trigger || favFly || manyWall || manyMedian){ frontAdded=true; reason.push('前位置単騎残り補正'); }
      }
    }
  }
  if(!trigger && !frontAdded) return {on:false,box:[],reason,front,frontAdded:false,signCount,types:typeSet.size,targetCars:targetSet.size,pairs:[],tris:[],single:[],frontIns:[]};
  // 基本候補：総合上位＋メジアン祭り＋全表残り＋壁またぎ＋配当穴
  const pick=[];
  function addCar(c){c=Number(c); if(c && !pick.includes(c)) pick.push(c);}
  cs.slice(0,5).forEach(x=>addCar(x.car));
  (res.medianFestival||[]).forEach(x=>addCar(x.car));
  (res.allTableStrong||[]).slice(0,4).forEach(x=>addCar(x.car));
  (res.wallCross||[]).slice(0,4).forEach(x=>addCar(x.car));
  if(frontAdded) addCar(front.car);
  // 5車へ圧縮。前位置単騎は固定、総合上位4頭を優先。残りはスコア順。
  let box=[];
  if(frontAdded) addCar(front.car);
  cs.slice(0,4).forEach(x=>{ if(!(frontAdded&&x.car===front.car)) box.push(x.car); });
  if(frontAdded) box.push(front.car);
  pick.forEach(c=>{ if(!box.includes(c)) box.push(c); });
  // 重複除去
  box=[...new Set(box.map(Number))];
  if(box.length>5){
    const fixed=new Set(); if(frontAdded) fixed.add(front.car);
    // 超本命がいる時は完全には消さず上位なら残すが、前位置単騎を優先して一番弱い非固定を落とす
    const sorted=box.map(c=>cs.find(x=>x.car===c)||{car:c,score:0,odds:999,notes:[]}).sort((a,b)=>{
      const af=fixed.has(a.car)?1:0, bf=fixed.has(b.car)?1:0; if(af!==bf) return bf-af;
      return b.score-a.score || a.odds-b.odds;
    });
    box=sorted.slice(0,5).map(x=>x.car);
  }
  box=box.sort((a,b)=>a-b);
  const single=box.map(c=>String(c));
  const pairs=boxPairs(box);
  const tris=boxTris(box);
  const frontIns=[];
  if(frontAdded){
    const others=box.filter(c=>c!==front.car);
    for(let i=0;i<others.length;i++) for(let j=i+1;j<others.length;j++) frontIns.push(kumi3(front.car,others[i],others[j]));
  }
  return {on:true,box,reason,front,frontAdded,signCount,types:typeSet.size,targetCars:targetSet.size,pairs,tris,single,frontIns};
}

  return html;
}
