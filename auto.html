<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>チャッピー神予想 オートV20</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#07101f;color:white;padding:14px;font-size:18px}
textarea{width:100%;height:280px;font-size:17px;border-radius:10px;padding:10px}
button{font-size:20px;padding:10px 14px;margin:6px 4px;border:0;border-radius:12px;background:#22c55e;color:white}
.btn2{background:#3b82f6}.btn3{background:#64748b}
.box{background:#111827;border-radius:14px;padding:14px;margin:12px 0}
h1{font-size:26px}h2{font-size:22px;border-bottom:1px solid #374151;padding-bottom:6px}
.hot{color:#fb7185;font-size:24px;font-weight:bold}.gold{color:#facc15;font-size:24px;font-weight:bold}
.green{color:#22c55e;font-weight:bold}.yellow{color:#facc15;font-weight:bold}.red{color:#fb7185;font-weight:bold}
.small{font-size:15px;color:#cbd5e1}
.rankWrap{overflow-x:auto;white-space:nowrap}
.row{margin:12px 0;font-size:24px;font-weight:bold}
.label{display:inline-block;width:110px;color:#cbd5e1;font-size:18px}
.cell{display:inline-block;min-width:34px;text-align:center;padding:4px 6px;border-right:1px solid #64748b}
.wallTan{border-right:3px solid #3b82f6}
.wallNisha{border-right:3px solid #ff3b30}
pre{white-space:pre-wrap}
</style>
</head>
<body>

<h1>チャッピー神予想 オートV20</h1>

<div class="box">
<textarea id="input">伊勢崎〇R

[TAN]

[NISHA]

[SANREN]
</textarea><br>
<button onclick="analyze()">解析</button>
<button class="btn2" onclick="testData()">テスト</button>
<button class="btn3" onclick="resetInput()">リセット</button>
</div>

<div id="result"></div>

<script>
function norm(s){
  return s.replace(/[０-９]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0)).replace(/[－ー―–]/g,"-");
}

function parseInput(text){
  text=norm(text);
  const lines=text.split(/\n/).map(x=>x.trim()).filter(Boolean);
  let mode="", race="レース名未入力";
  const tan=[],nisha=[],sanren=[];
  for(const line of lines){
    if(line.match(/^\[TAN\]|単勝/i)){mode="TAN";continue;}
    if(line.match(/^\[NISHA\]|2車|二車/i)){mode="NISHA";continue;}
    if(line.match(/^\[SANREN\]|3連|三連/i)){mode="SANREN";continue;}
    if(!line.includes(" ")&&!line.includes("-")&&!line.startsWith("[")){race=line;continue;}

    const p=line.split(/\s+/);
    if(mode==="TAN"&&p.length>=2) tan.push({car:p[0],odds:parseFloat(p[1])});
    if(mode==="NISHA"&&p.length>=2&&p[0].includes("-")) nisha.push({pair:p[0],odds:parseFloat(p[1])});
    if(mode==="SANREN"&&p.length>=2&&p[0].includes("-")) sanren.push({tri:p[0],odds:parseFloat(p[1])});
  }
  return {race,tan,nisha,sanren};
}

function wallIndexes(list){
  const s=new Set();
  for(let i=0;i<list.length-1;i++){
    if(list[i].odds>0 && list[i+1].odds/list[i].odds>=1.8)s.add(i);
  }
  return s;
}

function rankLine(label,list,walls,type){
  const wallClass=type==="tan"?"wallTan":"wallNisha";
  let html=`<div class="row"><span class="label">${label}</span>`;
  list.forEach((x,i)=>{
    html+=`<span class="cell ${walls.has(i)?wallClass:""}">${x.car}</span>`;
  });
  html+=`</div>`;
  return html;
}

function medianCars(list){
  if(!list.length)return [];
  const n=list.length;
  if(n%2===1)return [list[Math.floor(n/2)].car];
  return [list[n/2-1].car,list[n/2].car];
}

function add(map,c,pt,reason){
  if(!c)return;
  if(!map[c])map[c]={pt:0,rs:[]};
  map[c].pt+=pt;
  map[c].rs.push(reason);
}

function top(map){
  return Object.entries(map).sort((a,b)=>b[1].pt-a[1].pt).map(([c,v])=>`${c}(${v.pt})`);
}

function shihaiBox(fav,sanren,nisha){
  const sortedS=[...sanren].sort((a,b)=>a.odds-b.odds);
  const sortedN=[...nisha].sort((a,b)=>a.odds-b.odds);
  function remain(list,key){
    let last=0,od=0;
    for(let i=0;i<list.length;i++){
      const cars=list[i][key].split("-");
      if(cars.includes(fav.car)){last=i+1;od=list[i].odds;}
      else break;
    }
    return {last,od};
  }
  const n=remain(sortedN,"pair"), s=remain(sortedS,"tri");
  const rate=Math.round(((n.last/Math.max(sortedN.length,1))+(s.last/Math.max(sortedS.length,1)))/2*100);
  let judge="C：過信注意",cls="yellow";
  if(rate>=60){judge="S：支配強い";cls="green";}
  else if(rate>=40){judge="A：そこそこ強い";cls="green";}
  else if(rate<25){judge="D：飛び警戒";cls="red";}
  return `<div class="box"><h2>🏆単勝1人気支配率</h2>
  <div>単勝1人気：${fav.car}（${fav.odds}倍）</div>
  <div>2車複：${n.last}位まで / ${n.od? n.od+"倍まで":"なし"}</div>
  <div>3連系：${s.last}位まで / ${s.od? s.od+"倍まで":"なし"}</div>
  <div class="${cls}" style="font-size:26px;margin-top:8px">${judge}</div></div>`;
}

function analyze(){
  const {race,tan,nisha,sanren}=parseInput(document.getElementById("input").value);
  const result=document.getElementById("result");
  if(!tan.length||!nisha.length){result.innerHTML='<div class="box red">単勝と2車複を入れてください</div>';return;}

  const tanRank=[...tan].sort((a,b)=>a.odds-b.odds);
  const axis=tanRank[0].car;

  const axisNisha=nisha.filter(x=>x.pair.split("-").includes(axis))
    .sort((a,b)=>a.odds-b.odds)
    .map(x=>{const [a,b]=x.pair.split("-");return {car:a===axis?b:a,odds:x.odds,pair:x.pair};});

  const nishaRank=[{car:axis,odds:0},...axisNisha];

  const tanWalls=wallIndexes(tanRank);
  const nishaWalls=new Set([...wallIndexes(axisNisha)].map(i=>i+1));

  const score={};

  medianCars(tanRank).forEach(c=>add(score,c,30,"単勝メジアン"));
  medianCars(nishaRank).forEach(c=>add(score,c,30,"2車複メジアン"));

  // メジアン重複
  const tanMed=new Set(medianCars(tanRank));
  const niMed=new Set(medianCars(nishaRank));
  [...tanMed].filter(c=>niMed.has(c)).forEach(c=>add(score,c,30,"メジアン重複"));

  // ボトム値：下位2車
  const bottom=[...new Set([...tanRank.slice(-2).map(x=>x.car),...nishaRank.slice(-2).map(x=>x.car)])];
  bottom.forEach(c=>add(score,c,15,"ボトム値"));

  // 順位上昇
  const tanPos={}, niPos={};
  tanRank.forEach((x,i)=>tanPos[x.car]=i+1);
  nishaRank.forEach((x,i)=>niPos[x.car]=i+1);
  const up=[];
  Object.keys(tanPos).forEach(c=>{
    if(niPos[c]&&tanPos[c]-niPos[c]>=2){up.push(c);add(score,c,15,"順位上昇");}
  });

  // 復活穴：単勝下位なのに2車複上位
  const revival=[];
  Object.keys(tanPos).forEach(c=>{
    if(tanPos[c]>=5&&niPos[c]&&niPos[c]<=4){revival.push(c);add(score,c,20,"復活車");}
  });

  // 連携崩れ警報
  const topNisha=[...nisha].sort((a,b)=>a.odds-b.odds)[0];
  const collapse=!topNisha.pair.split("-").includes(axis);
  if(collapse) topNisha.pair.split("-").forEach(c=>add(score,c,10,"連携崩れ対象"));

  const sorted=Object.entries(score).sort((a,b)=>b[1].pt-a[1].pt);
  const sRank=sorted.filter(x=>x[1].pt>=60).map(x=>x[0]);
  const aRank=sorted.filter(x=>x[1].pt>=40&&x[1].pt<60).map(x=>x[0]);
  const bRank=sorted.filter(x=>x[1].pt>=25&&x[1].pt<40).map(x=>x[0]);

  result.innerHTML=`
  <div class="box"><div class="gold">【${race}】</div></div>

  ${shihaiBox(tanRank[0],sanren,nisha)}

  <div class="box">
    <h2>🚨連携崩れ警報</h2>
    <div>単勝1人気：${axis}</div>
    <div>2車複1人気：${topNisha.pair}（${topNisha.odds}倍）</div>
    <div class="${collapse?'red':'green'}" style="font-size:24px">${collapse?'単勝1人気が不在：荒れ警戒':'正常：単勝1人気が含まれています'}</div>
  </div>

  <div class="box">
    <h2>🔥勝負ランプ</h2>
    <div class="hot">S：${sRank.length?sRank.join("・"):"なし"}</div>
    <div class="gold">A：${aRank.length?aRank.join("・"):"なし"}</div>
    <div>B：${bRank.length?bRank.join("・"):"なし"}</div>
  </div>

  <div class="box">
    <h2>📊本表</h2>
    <div class="small">青線＝単勝壁　赤線＝2車複壁　※乖離率1.8倍以上</div>
    <div class="rankWrap">
      ${rankLine("単勝",tanRank,tanWalls,"tan")}
      ${rankLine("2車複("+axis+"軸)",nishaRank,nishaWalls,"nisha")}
    </div>
  </div>

  <div class="box">
    <h2>⬆️順位移動</h2>
    <div>上昇車：<b>${up.length?up.join("・"):"なし"}</b></div>
    <div>復活車：<b>${revival.length?revival.join("・"):"なし"}</b></div>
    <div>ボトム値：<b>${bottom.join("・")}</b></div>
  </div>

  <div class="box">
    <h2>🏍️勝負指数</h2>
    <pre>${sorted.map(([c,v])=>`${c}　${v.pt}点　${v.rs.join(" / ")}`).join("\n")}</pre>
  </div>
  `;
}

function resetInput(){
  document.getElementById("input").value=`伊勢崎〇R

[TAN]

[NISHA]

[SANREN]`;
  document.getElementById("result").innerHTML="";
}

</script>
