<style>
:root{
  --bg:#07101f;--panel:#0d1d38;--panel2:#10264a;--ink:#fff;--muted:#b8c5da;
  --blue:#38bdf8;--yellow:#fde047;--orange:#fb923c;--pink:#f472b6;--red:#fb7185;
  --green:#4ade80;--cyan:#67e8f9;--line:#35517a;
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#06101f,#08182e 48%,#040914);color:#fff;
font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;padding:16px;line-height:1.55}
main{max-width:760px;margin:auto}

textarea{width:100%;height:360px;border-radius:13px;border:2px solid #3b82f6;padding:12px;

box-shadow:0 0 22px rgba(37,99,235,.18)}

.orangeCard{border-color:#fb923c;background:linear-gradient(135deg,#241000,#4a2107,#120700)}
.small{font-size:14px;color:#cbd5e1}.strong{font-weight:1000;color:#fde047}.ok{font-weight:1000;color:#86efac}
.warn{font-weight:1000;color:#fda4af}
.badge{display:inline-block;padding:4px 7px;border-radius:999px;background:#172a49;border:1px solid #355b8e;
font-weight:1000;margin:2px}.badge.cyan{background:#003746;color:#a5f3fc}.badge.pink{background:#4d1233;color:#fbcfe8}
.badge.yellow{background:#3b3104;color:#fff6a5}.badge.green{background:#073b22;color:#bbf7d0}
.tableWrap{overflow-x:auto;border:1px solid #334b70;border-radius:13px;background:#050b16;padding:6px}

.marketTable th,.marketTable td{height:44px;min-width:42px;padding:3px 5px;text-align:center;border-bottom:1px solid #21395d;border-right:2px solid #29466d}

.marketTable th:first-child,.marketTable td:first-child{position:sticky;left:0;z-index:2;min-width:74px;background:#071529;text-align:left;padding-left:8px}
.marketTable .w1{border-right:5px solid var(--yellow);box-shadow:inset -3px 0 0 rgba(253,224,71,.35)}
.marketTable .w2{border-right:5px solid var(--orange);box-shadow:inset -3px 0 0 rgba(251,146,60,.4)}

.car{display:inline-flex;align-items:center;justify-content:center;width:31px;height:31px;border-radius:9px;font-size:20px;font-weight:1000}
.c1{background:#e5e7eb;color:#111}.c2{background:#16181f}.c3{background:#c52222}.c4{background:#2448c7}.c5{background:#f5c62a;color:#111}.c6{background:#2c8d28}.c7{background:#f97316}.c8{background:#d946ef;color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}.leg{font-size:11px;background:#111827;border:1px solid #334155;border-radius:999px;padding:4px 7px;font-weight:900}
.line{display:inline-block;width:22px;height:4px;border-radius:9px;margin-right:5px;vertical-align:middle}
pre{white-space:pre-wrap;word-break:break-word;background:#030914;border:1px solid #263b5f;border-radius:13px;padding:12px;font-size:15px;color:#e5edff}
.rank{padding:6px 0;border-bottom:1px solid #2b4268}
.grid{display:grid;grid-template-columns:1fr;gap:9px}@media(min-width:680px){.grid{grid-template-columns:1fr 1fr}}

<body><main>
<h1>オートメジアン V24.26<br>競馬式本表コンパクト・四市場壁・移動車・ステルス統合版</h1>
<div class="sub">本表をiPhone向けコンパクト表示／四市場1.8壁／移動車／市場逆行／占有コア／👻ステルス車</div>
<textarea id="input" placeholder="【飯塚8R】

[HANDICAP]
1 0m 0.14 3.33 0.111

[TAN]
5 1.2

[NISHA]
5-6 2.1

[WIDE]
5-6 1.1-1.3

[SANREN]
2-5-6 2.1"></textarea>
<div>
<button class="go" onclick="run()">解析する</button>
<button class="sample" onclick="loadSample()">サンプル</button>
<button class="clear" onclick="clearAll()">クリア</button>
<button class="copy" onclick="copyResult()">結果コピー</button>
</div>
<div id="out"></div>
</main>
<script>
let latestCopyText="";
const $=id=>document.getElementById(id);
function norm(s){return String(s||"").replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
.replace(/[．]/g,".").replace(/[－ー―–—]/g,"-").replace(/[＝]/g,"=").replace(/[〜～]/g,"-");}
function num(x){const m=String(x||"").replace(/,/g,"").match(/\d+(?:\.\d+)?/);return m?Number(m[0]):NaN}
function key(a){return a.map(Number).sort((x,y)=>x-y).join("-")}
function splitCombo(s){return norm(s).split(/[-=]/).map(x=>parseInt(x,10)).filter(Number.isFinite)}
function parse(raw){
 const lines=norm(raw).split(/\n/).map(x=>x.trim()).filter(Boolean);let title="【オート】",sec="";
 const d={hp:{},tan:[],nisha:[],wide:[],san:[]};
 for(const line of lines){
  if(line.startsWith("【")){title=line;continue}
  const sm=line.match(/^\[([^\]]+)\]/);if(sm){sec=sm[1].toUpperCase();continue}
  const p=line.split(/\s+/);
  if(sec==="HANDICAP"&&p.length>=4){
   const c=parseInt(p[0]),han=parseInt(p[1]),st=num(p[2]),trial=num(p[3]),dev=num(p[4]);
   if(c)d.hp[c]={han,st,trial,dev};
  }else if((sec==="TAN"||sec==="TANSHO")&&p.length>=2){
   const c=parseInt(p[0]),od=num(p[1]);if(c&&Number.isFinite(od)&&od>0)d.tan.push({car:c,od});
  }else if((sec==="NISHA"||sec==="NIREN"||sec==="2REN")&&p.length>=2){
   const cs=splitCombo(p[0]),od=num(p[1]);if(cs.length===2&&Number.isFinite(od)&&od>0)d.nisha.push({cars:cs,od,key:key(cs)});
  }else if(sec==="WIDE"&&p.length>=2){
   const cs=splitCombo(p[0]);const ns=p.slice(1).join(" ").match(/\d+(?:\.\d+)?/g)||[];
   const lo=ns.length?Number(ns[0]):NaN,hi=ns.length>1?Number(ns[1]):lo;
   if(cs.length===2&&Number.isFinite(lo)&&lo>0)d.wide.push({cars:cs,od:lo,hi,key:key(cs)});
  }else if((sec==="SANREN"||sec==="SANPUKU"||sec==="3REN")&&p.length>=2){
   const cs=splitCombo(p[0]),od=num(p[1]);if(cs.length===3&&Number.isFinite(od)&&od>0)d.san.push({cars:cs,od,key:key(cs)});
  }
 }
 ["tan","nisha","wide","san"].forEach(k=>d[k].sort((a,b)=>a.od-b.od));
 return {title,d};
}
function carSpan(c){return `<span class="car c${c}">${c}</span>`}
function allCars(d){return [...new Set([...Object.keys(d.hp).map(Number),...d.tan.map(x=>x.car),...d.nisha.flatMap(x=>x.cars),...d.wide.flatMap(x=>x.cars),...d.san.flatMap(x=>x.cars)])].sort((a,b)=>a-b)}
function marketRow(list,isTan=false){
 const row=[],trigger=[],seen=new Set();
 if(isTan){list.forEach(x=>{if(!seen.has(x.car)){seen.add(x.car);row.push(x.car);trigger.push(x.od)}})}
 else list.forEach(x=>x.cars.forEach(c=>{if(!seen.has(c)){seen.add(c);row.push(c);trigger.push(x.od)}}));
 return {row,trigger};
}
function walls(trigger){
 const out=[];
 for(let i=0;i<trigger.length-1;i++){
  const a=trigger[i],b=trigger[i+1];if(!(a>0&&b>0))continue;
  const r=b/a;if(r>=1.8){
   let level=r>=4?4:r>=3?3:r>=2.2?2:1;
   out.push({pos:i+1,level,from:a,to:b,ratio:r});
  }
 }
 return out;
}
function wallCls(pos,ws){const w=ws.find(x=>x.pos===pos);return w?"w"+w.level:""}
function tableHtml(rows){
 const max=Math.max(...Object.values(rows).map(x=>x.row.length),1);
 let h='<div class="tableWrap"><table class="marketTable"><tr><th>本表</th>';
 for(let i=1;i<=max;i++)h+=`<th>${i}</th>`;h+='</tr>';
 for(const [name,o] of Object.entries(rows)){
  h+=`<tr><th>${name}</th>`;
  for(let i=0;i<max;i++)h+=`<td class="${wallCls(i+1,o.walls)}">${o.row[i]?carSpan(o.row[i]):""}</td>`;
  h+='</tr>';
 }
 return h+'</table></div><div class="legend"><span class="leg"><i class="line" style="background:#fde047"></i>第1壁</span><span class="leg"><i class="line" style="background:#fb923c"></i>第2壁</span><span class="leg"><i class="line" style="background:#f472b6"></i>急断層</span><span class="leg"><i class="line" style="background:#fb7185"></i>特大壁</span></div>';
}
function rankMap(row){const m={};row.forEach((c,i)=>m[c]=i+1);return m}
function count(list,c,n){return list.slice(0,n).filter(x=>x.cars.includes(c)).length}
function bestRank(list,c){const i=list.findIndex(x=>x.cars.includes(c));return i<0?99:i+1}
function topPartners(list,c,n){const m={};list.slice(0,n).forEach(x=>{if(x.cars.includes(c))x.cars.forEach(z=>{if(z!==c)m[z]=(m[z]||0)+1})});return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(x=>Number(x[0]))}
function analyze(pack){
 const {title,d}=pack,cars=allCars(d);
 const rTan=marketRow(d.tan,true),rNi=marketRow(d.nisha),rWi=marketRow(d.wide),rSa=marketRow(d.san);
 const rows={単勝:{...rTan,walls:walls(rTan.trigger)},"2車複":{...rNi,walls:walls(rNi.trigger)},ワイド:{...rWi,walls:walls(rWi.trigger)},"3連系":{...rSa,walls:walls(rSa.trigger)}};
 const maps={tan:rankMap(rTan.row),ni:rankMap(rNi.row),wi:rankMap(rWi.row),sa:rankMap(rSa.row)};
 const tanOdds={};d.tan.forEach(x=>tanOdds[x.car]=x.od);
 const tri1=d.san[0]?.cars||[], pair1=d.nisha[0]?.cars||[];
 const scores=[],movers=[],stealth=[],reverse=[],cores=[];
 for(const c of cars){
  const tr=maps.tan[c]||99,nr=maps.ni[c]||99,wr=maps.wi[c]||99,sr=maps.sa[c]||99;
  const nc=count(d.nisha,c,10),wc=count(d.wide,c,10),sc=count(d.san,c,20);
  const markets=[nc>0,wc>0,sc>0].filter(Boolean).length;
  let score=0,reasons=[];
  if(tr<=3){score+=16;reasons.push("単勝上位")}
  if(nr<=3){score+=18;reasons.push("2車複本表上位")}
  if(wr<=3){score+=16;reasons.push("ワイド本表上位")}
  if(sr<=3){score+=18;reasons.push("3連系本表上位")}
  if(pair1.includes(c)){score+=16;reasons.push("2車複1番人気構成車")}
  if(tri1.includes(c)){score+=22;reasons.push("3連系1番人気構成車")}
  score+=Math.min(15,nc*3)+Math.min(15,wc*3)+Math.min(20,sc*2);
  const hp=d.hp[c];if(hp){if(hp.trial<=Math.min(...Object.values(d.hp).map(x=>x.trial).filter(Number.isFinite))+.02){score+=10;reasons.push("試走上位")}
   if(hp.st<=.13){score+=7;reasons.push("ST上位")}if(hp.dev<=.09){score+=7;reasons.push("偏差上位")}}
  if((tr>=3&&nr===1)||(tr-nr>=2&&nr<=3)||(tri1.includes(c)&&tr>=3)){movers.push({c,why:`単勝${tr===99?"圏外":tr+"位"}→2車複${nr===99?"圏外":nr+"位"}／3連1番人気${tri1.includes(c)?"入り":"外"}`});score+=18;reasons.push("移動車")}
  if(tr>=4&&(nr<=3||sr<=3)){reverse.push({c,why:`単勝${tr}位に対し連系${Math.min(nr,sr)}位`});score+=12;reasons.push("市場逆行")}
  if(markets===3&&tr>=4&&nc>=2&&wc>=2&&sc>=3){
   const sscore=nc+wc+sc+(tri1.includes(c)?3:0)+(pair1.includes(c)?2:0);
   stealth.push({c,level:sscore>=14?"S":sscore>=10?"A":"B",score:sscore,why:`単勝${tr}位／2車複${nc}回・ワイド${wc}回・3連系${sc}回`});
   score+=sscore>=14?22:sscore>=10?16:10;reasons.push("ステルス"+(sscore>=14?"S":sscore>=10?"A":"B"))
  }
  const occ=nc+wc+sc;cores.push({c,occ,nc,wc,sc});
  scores.push({c,score,tr,nr,wr,sr,od:tanOdds[c],reasons});
 }
 scores.sort((a,b)=>b.score-a.score||a.c-b.c);cores.sort((a,b)=>b.occ-a.occ||a.c-b.c);
 const headCandidates=[...new Set([...movers.map(x=>x.c),...(tri1||[]),...(pair1||[])])].filter(c=>cars.includes(c)).slice(0,4);
 const wallLines=Object.entries(rows).map(([n,o])=>`${n}：${o.walls.length?o.walls.map(w=>`${w.pos}位後 ${w.from}→${w.to}（${w.ratio.toFixed(2)}倍）`).join(" / "):"1.8壁なし"}`);
 const common={};Object.entries(rows).forEach(([n,o])=>o.walls.forEach(w=>(common[w.pos]||(common[w.pos]=[])).push(n)));
 const commonTop=Object.entries(common).sort((a,b)=>b[1].length-a[1].length)[0];
 const diagnosis=commonTop&&commonTop[1].length>=3?`共通壁ロック：${commonTop[1].join("・")}が${commonTop[0]}位後で一致`:
  movers.length?`券種移動型：${movers.map(x=>x.c+"号車").join("・")}が単勝評価より連系で浮上`:"通常市場型";
 const copy=`${title}
オートメジアン V24.26 競馬式本表・移動車・ステルス統合版

【診断】
${diagnosis}

【四市場1.8壁】
${wallLines.join("\n")}

【移動車】
${movers.length?movers.map(x=>x.c+"号車 "+x.why).join("\n"):"なし"}

【市場逆行】
${reverse.length?reverse.map(x=>x.c+"号車 "+x.why).join("\n"):"なし"}

【占有コア】
${cores.slice(0,4).map((x,i)=>`${i+1}位 ${x.c}号車 合計${x.occ}（2車複${x.nc}・ワイド${x.wc}・3連系${x.sc}）`).join("\n")}

【ステルス車】
${stealth.length?stealth.map(x=>`${x.c}号車[${x.level}] ${x.why}`).join("\n"):"なし"}

【頭候補監査】
${headCandidates.length?headCandidates.map(c=>c+"号車").join("・"):"なし"}

【総合候補】
${scores.slice(0,6).map((x,i)=>`${i+1}位 ${x.c}号車【${x.score}】 ${x.reasons.join("・")}`).join("\n")}`;
 latestCopyText=copy;
 return {title,d,rows,movers,reverse,cores,stealth,scores,headCandidates,diagnosis,wallLines};
}
function run(){
 try{
  const raw=$("input").value.trim();if(!raw)throw new Error("入力データがありません");
  const a=analyze(parse(raw));
  let h=`<div class="card"><h2>📊本表・競馬版サイズ</h2>${tableHtml(a.rows)}</div>`;
  h+=`<div class="card orangeCard"><h2>🧱競馬式・四市場1.8壁</h2><div class="strong">${a.diagnosis}</div><pre>${a.wallLines.join("\n")}</pre></div>`;
  h+=`<div class="grid"><div class="card cyanCard"><h2>🚄移動車</h2>${a.movers.length?a.movers.map(x=>`<div class="rank">${carSpan(x.c)} <b>${x.why}</b><br><span class="small">頭候補へ強制昇格・単勝固定馬の頭信頼度を1段下げる</span></div>`).join(""):"<div>なし</div>"}</div>`;
  h+=`<div class="card"><h2>↕️市場逆行</h2>${a.reverse.length?a.reverse.map(x=>`<div class="rank">${carSpan(x.c)} ${x.why}</div>`).join(""):"<div>なし</div>"}</div></div>`;
  h+=`<div class="card"><h2>📈市場占有コア</h2>${a.cores.slice(0,6).map((x,i)=>`<div class="rank"><span class="badge ${i<2?"green":""}">${i+1}位</span> ${carSpan(x.c)} 合計<b>${x.occ}</b>回　<span class="small">2車複${x.nc}・ワイド${x.wc}・3連系${x.sc}</span></div>`).join("")}</div>`;
  h+=`<div class="card hot"><h2>👻ステルス車</h2>${a.stealth.length?a.stealth.map(x=>`<div class="rank">${carSpan(x.c)} <span class="badge pink">ステルス${x.level}</span> ${x.why}<br><span class="small">${x.level==="S"?"3連系削除禁止・3着以上保護":x.level==="A"?"相手保護":"注意表示"}</span></div>`).join(""):"<div>該当なし</div>"}</div>`;
  h+=`<div class="card"><h2>🔒頭候補監査</h2><div>${a.headCandidates.length?a.headCandidates.map(carSpan).join(" "):"なし"}</div><div class="small">三連系1番人気構成車・2車複1番人気構成車・移動車を頭候補として監査。後方の単勝1倍台だけを自動固定しない。</div></div>`;
  h+=`<div class="card"><h2>🏁総合候補</h2>${a.scores.slice(0,6).map((x,i)=>`<div class="rank"><span class="badge ${i<3?"yellow":""}">${i+1}位 ${x.c}号車【${x.score}】</span><br><span class="small">${x.reasons.join("・")||"通常"}</span></div>`).join("")}</div>`;
  h+=`<div class="card"><h2>📋コピー用</h2><pre>${latestCopyText}</pre></div>`;
  $("out").innerHTML=h;
 }catch(e){$("out").innerHTML=`<div class="card hot"><h2>入力エラー</h2><pre>${e.message||e}</pre></div>`}
}
function copyResult(){if(!latestCopyText){alert("先に解析してください");return}navigator.clipboard?.writeText(latestCopyText).then(()=>alert("コピーしました")).catch(()=>fallback())}
function fallback(){const t=document.createElement("textarea");t.value=latestCopyText;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove();alert("コピーしました")}
function clearAll(){$("input").value="";$("out").innerHTML="";latestCopyText=""}

</script></body></html>
