<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>チャッピー神予想 オート V24 擬似複勝テスト版</title>
<style>
body{margin:0;background:#07101f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;padding:14px;font-size:17px}
h1{font-size:27px;line-height:1.3;margin:4px 0 12px;color:#fff}
textarea{width:100%;height:330px;box-sizing:border-box;border-radius:16px;border:2px solid #3b82f6;padding:12px;font-size:16px;line-height:1.45;font-family:monospace;background:#f8fafc;color:#111}
button{font-size:20px;font-weight:900;border:0;border-radius:16px;padding:14px 18px;margin:10px 6px 10px 0}
.go{background:#22c55e;color:#052e16}.test{background:#3b82f6;color:#fff}.clear{background:#64748b;color:#fff}.copy{background:#f59e0b;color:#fff}
.card{background:#10224a;border:1px solid #3b82f6;border-radius:18px;padding:14px;margin:14px 0}
.title{color:#ffd84d;font-size:23px;font-weight:900;margin-bottom:10px}
.good{color:#86efac;font-weight:900}.warn{color:#fb7185;font-weight:900}.yellow{color:#fde047;font-weight:900}.red{color:#fb7185;font-weight:900}.blue{color:#93c5fd;font-weight:900}
.small{color:#cbd5e1;font-size:14px;line-height:1.45}
pre{white-space:pre-wrap;word-break:break-word;background:#020617;color:#e5e7eb;padding:12px;border-radius:12px;font-size:16px;line-height:1.45}
.badge{display:inline-block;padding:5px 10px;border-radius:999px;background:#1e293b;margin:4px 2px;font-weight:900}
.rankLine{margin:8px 0;line-height:1.55}
hr{border:0;border-top:1px solid #94a3b8;margin:14px 0}
.honWrap{overflow-x:auto;background:#07101f;border-radius:14px;padding:8px 6px;margin-top:10px}
.honRow{display:flex;align-items:center;gap:0;min-width:max-content;margin:8px 0}
.honLabel{width:86px;min-width:86px;max-width:86px;font-weight:900;font-size:18px;line-height:1.05;white-space:nowrap}
.honNum{display:inline-block;width:34px;min-width:34px;max-width:34px;text-align:center;font-size:23px;font-weight:900;color:#fff;line-height:1;box-sizing:border-box;white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.honMed{color:#fb7185}
.honEmpty{color:transparent}
.bar{display:inline-block;height:30px;width:2px;min-width:2px;max-width:2px;margin:0 3px;opacity:.95;border-radius:2px;background:#35517a}
.lamp{border:3px solid #a855f7;background:linear-gradient(135deg,#16002c,#2b075f,#16002c);box-shadow:0 0 24px rgba(168,85,247,.55)}
.lamp2{border:3px solid #f97316;background:linear-gradient(135deg,#2b1000,#5a2500,#2b1000);box-shadow:0 0 24px rgba(249,115,22,.55)}
</style>
</head>
<body>
<h1>チャッピー神予想 オート V24<br>擬似複勝テスト版</h1>

<textarea id="input" placeholder="【山陽10R】

[TANSHO]
車番 単勝オッズ

[NISHA]
車番-車番 2車複オッズ

[WIDE]
車番-車番 ワイドオッズ

[SANREN]
車番-車番-車番 3連系オッズ

※見出しはある程度ゆるく対応
[TANFUKU] / [UMAREN] / [SANPUKU] でも可"></textarea><br>

<button class="go" id="btnRun">解析</button>
<button class="test" id="btnSample">テスト</button>
<button class="clear" id="btnClear">リセット</button>
<button class="copy" id="btnCopy">結果コピー</button>
<div id="out"></div>

<script>
var latestCopyText="";

function zenToHan(str){
  return String(str)
    .replace(/[０-９]/g,function(s){return String.fromCharCode(s.charCodeAt(0)-65248);})
    .replace(/．/g,'.').replace(/[－ー―−]/g,'-').replace(/[　]/g,' ').replace(/[〜～]/g,'-');
}
function nums(line){
  var m=zenToHan(line).match(/\d+(?:\.\d+)?/g);
  if(!m)return[];
  return m.map(function(x){return Number(x);});
}
function pairKey(a,b){return [a,b].map(String).sort(function(x,y){return Number(x)-Number(y);}).join('-');}
function triKey(a,b,c){return [a,b,c].map(String).sort(function(x,y){return Number(x)-Number(y);}).join('-');}
function uniq(arr){
  var s={},out=[];
  for(var i=0;i<arr.length;i++){
    var v=String(arr[i]);
    if(v&&v!=="undefined"&&!s[v]){s[v]=true;out.push(v);}
  }
  return out;
}
function sortOdds(arr){return arr.slice().sort(function(a,b){return Number(a.od)-Number(b.od);});}
function sortBy(arr,key){return arr.slice().sort(function(a,b){return Number(a[key])-Number(b[key]);});}
function joinC(arr){return (!arr||!arr.length)?"なし":arr.map(function(x){return x+"号車";}).join("・");}
function mid(arr){
  arr=arr||[];
  if(!arr.length)return[];
  if(arr.length===1)return[arr[0]];
  var n=arr.length;
  if(n%2===1)return[arr[Math.floor(n/2)]];
  return[arr[n/2-1],arr[n/2]];
}
function getTan(data,h){
  h=String(h);
  for(var i=0;i<data.tansho.length;i++){if(data.tansho[i].h===h)return data.tansho[i];}
  return null;
}
function findPair(arr,a,b){
  var k=pairKey(a,b);
  for(var i=0;i<arr.length;i++){if(arr[i].key===k)return arr[i];}
  return null;
}
function add(arr,v){if(v&&arr.indexOf(v)<0)arr.push(v);}

function parseData(raw){
  var text=zenToHan(raw),lines=text.split(/\n/),title="レース",sec="";
  var tansho=[],nisha=[],wide=[],sanren=[];
  for(var i=0;i<lines.length;i++){
    var line=lines[i].trim();
    if(!line)continue;
    if(line.indexOf("【")===0)title=line;
    var up=line.toUpperCase();

    if(up.indexOf("[")===0){
      if(up.indexOf("TAN")>=0 || up.indexOf("単")>=0){sec="TANSHO";continue;}
      if(up.indexOf("WIDE")>=0 || up.indexOf("ワイド")>=0){sec="WIDE";continue;}
      if(up.indexOf("SAN")>=0 || up.indexOf("3")>=0 || up.indexOf("三")>=0){sec="SANREN";continue;}
      if(up.indexOf("NISHA")>=0 || up.indexOf("NIREN")>=0 || up.indexOf("2")>=0 || up.indexOf("UMA")>=0 || up.indexOf("馬")>=0){sec="NISHA";continue;}
    }

    if(sec==="TANSHO"){
      var n=nums(line);
      if(n.length>=2)tansho.push({h:String(Math.floor(n[0])),od:n[n.length-1]});
    }
    if(sec==="NISHA"){
      var m=line.match(/(\d+)\s*-\s*(\d+)/),o=nums(line);
      if(m&&o.length)nisha.push({a:m[1],b:m[2],od:o[o.length-1],key:pairKey(m[1],m[2])});
    }
    if(sec==="WIDE"){
      var mw=line.match(/(\d+)\s*-\s*(\d+)/),ow=nums(line);
      if(mw&&ow.length)wide.push({a:mw[1],b:mw[2],od:ow[ow.length-1],key:pairKey(mw[1],mw[2])});
    }
    if(sec==="SANREN"){
      var ms=line.match(/(\d+)\s*-\s*(\d+)\s*-\s*(\d+)/),os=nums(line);
      if(ms&&os.length)sanren.push({a:ms[1],b:ms[2],c:ms[3],od:os[os.length-1],key:triKey(ms[1],ms[2],ms[3])});
    }
  }
  return{title:title,tansho:tansho,nisha:nisha,wide:wide,sanren:sanren};
}

function rankRowFromPairs(pairs){
  var row=[];
  var arr=sortOdds(pairs);
  for(var i=0;i<arr.length;i++){
    add(row,arr[i].a);
    add(row,arr[i].b);
  }
  return row;
}
function rankRowFromTris(tris){
  var row=[];
  var arr=sortOdds(tris);
  for(var i=0;i<arr.length;i++){
    add(row,arr[i].a);
    add(row,arr[i].b);
    add(row,arr[i].c);
  }
  return row;
}
function pseudoFromAnchor(wide,anchor){
  var arr=sortOdds(wide).filter(function(p){return p.a===anchor||p.b===anchor;});
  var row=[];
  for(var i=0;i<arr.length;i++){
    var other=arr[i].a===anchor?arr[i].b:arr[i].a;
    add(row,other);
  }
  return{anchor:anchor,row:row,pairs:arr};
}
function pseudoWideCount(wide,topN){
  var map={},arr=sortOdds(wide).slice(0,topN||10);
  for(var i=0;i<arr.length;i++){
    [arr[i].a,arr[i].b].forEach(function(h){
      if(!map[h])map[h]={h:h,count:0,best:999};
      map[h].count++;
      if(Number(arr[i].od)<map[h].best)map[h].best=Number(arr[i].od);
    });
  }
  var out=[];
  for(var k in map)out.push(map[k]);
  out.sort(function(a,b){
    if(b.count!==a.count)return b.count-a.count;
    return a.best-b.best;
  });
  return out;
}
function detectWalls(items){
  var arr=sortOdds(items).slice(0,14),walls=[];
  for(var i=0;i<arr.length-1;i++){
    var now=Number(arr[i].od),next=Number(arr[i+1].od),ratio=next/now,diff=next-now;
    if(ratio>=1.55||diff>=8)walls.push({before:i+1,after:i+2,ratio:ratio,diff:diff});
  }
  return walls;
}

function makeContext(data){
  var tanRank=sortOdds(data.tansho);
  var nishaRank=sortOdds(data.nisha);
  var wideRank=sortOdds(data.wide);
  var sanRank=sortOdds(data.sanren);

  var tanRow=tanRank.map(function(x){return x.h;});
  var nishaRow=rankRowFromPairs(data.nisha);
  var wideRow=rankRowFromPairs(data.wide);
  var sanRow=rankRowFromTris(data.sanren);

  var fav1=tanRank[0]?tanRank[0].h:null;
  var fav2=tanRank[1]?tanRank[1].h:null;

  var pseudoA=fav1?pseudoFromAnchor(data.wide,fav1):{anchor:null,row:[],pairs:[]};
  var pseudoB=fav2?pseudoFromAnchor(data.wide,fav2):{anchor:null,row:[],pairs:[]};
  var pseudoC=pseudoWideCount(data.wide,10);
  var pseudoCRow=pseudoC.map(function(x){return x.h;});

  return{
    tanRank:tanRank,nishaRank:nishaRank,wideRank:wideRank,sanRank:sanRank,
    tanRow:tanRow,nishaRow:nishaRow,wideRow:wideRow,sanRow:sanRow,
    tanM:mid(tanRow),nishaM:mid(nishaRow),wideM:mid(wideRow),sanM:mid(sanRow),
    fav1:fav1,fav2:fav2,
    pseudoA:pseudoA,pseudoB:pseudoB,pseudoC:pseudoC,pseudoCRow:pseudoCRow,
    pseudoAM:mid(pseudoA.row),pseudoBM:mid(pseudoB.row),pseudoCM:mid(pseudoCRow),
    nishaWalls:detectWalls(data.nisha),wideWalls:detectWalls(data.wide),sanWalls:detectWalls(data.sanren)
  };
}

function scoreAll(data,ctx){
  var all=uniq(data.tansho.map(function(x){return x.h;})
    .concat(ctx.nishaRow).concat(ctx.wideRow).concat(ctx.sanRow));
  var scored=[];
  for(var i=0;i<all.length;i++){
    var h=all[i],tf=getTan(data,h),score=0,reasons=[];
    if(ctx.tanM.indexOf(h)>=0){score+=8;reasons.push("単勝メジアン");}
    if(ctx.nishaM.indexOf(h)>=0){score+=8;reasons.push("2車複メジアン");}
    if(ctx.wideM.indexOf(h)>=0){score+=8;reasons.push("ワイドメジアン");}
    if(ctx.sanM.indexOf(h)>=0){score+=8;reasons.push("3連系メジアン");}
    if(ctx.pseudoAM.indexOf(h)>=0){score+=12;reasons.push("擬似複勝Aメジアン");}
    if(ctx.pseudoBM.indexOf(h)>=0){score+=8;reasons.push("擬似複勝Bメジアン");}
    if(ctx.pseudoCM.indexOf(h)>=0){score+=8;reasons.push("擬似複勝Cメジアン");}
    if(ctx.pseudoCRow.slice(0,3).indexOf(h)>=0){score+=6;reasons.push("ワイド出現上位");}
    if(ctx.pseudoA.row.slice(0,3).indexOf(h)>=0){score+=5;reasons.push("1人気連動上位");}
    if(ctx.pseudoB.row.slice(0,3).indexOf(h)>=0){score+=4;reasons.push("2人気連動上位");}
    if(ctx.fav1===h){score+=6;reasons.push("単勝1人気");}
    if(ctx.fav2===h){score+=4;reasons.push("単勝2人気");}

    // 穴寄り補正：単勝人気が少し高い車にメジアンが重なったら検証候補
    if(tf&&Number(tf.od)>=8&&reasons.length>=2){score+=6;reasons.push("穴寄り重複");}
    if(tf&&Number(tf.od)>=20&&score<24){score-=3;reasons.push("単勝20倍以上で弱め");}

    scored.push({h:h,score:score,tan:tf?tf.od:"-",reasons:reasons});
  }
  scored.sort(function(a,b){
    if(b.score!==a.score)return b.score-a.score;
    return Number(a.tan)-Number(b.tan);
  });
  return scored;
}

function renderHonRow(label,row,medians,maxLen){
  var arr=row.slice();
  while(arr.length<maxLen)arr.push("");
  var html='<div class="honRow"><div class="honLabel">'+label+'</div>';
  for(var i=0;i<maxLen;i++){
    var h=arr[i],cls='honNum';
    if(!h)cls+=' honEmpty';
    else if(medians.indexOf(h)>=0)cls+=' honMed';
    html+='<span class="'+cls+'">'+(h||'')+'</span>';
    if(i<maxLen-1)html+='<span class="bar"></span>';
  }
  html+='</div>';
  return html;
}
function makeHonpyo(ctx){
  var rows=[
    {label:"単勝",row:ctx.tanRow,m:ctx.tanM},
    {label:"2車複",row:ctx.nishaRow,m:ctx.nishaM},
    {label:"ワイド",row:ctx.wideRow,m:ctx.wideM},
    {label:"擬複A",row:ctx.pseudoA.row,m:ctx.pseudoAM},
    {label:"擬複B",row:ctx.pseudoB.row,m:ctx.pseudoBM},
    {label:"擬複C",row:ctx.pseudoCRow,m:ctx.pseudoCM},
    {label:"3連系",row:ctx.sanRow,m:ctx.sanM}
  ];
  var maxLen=0;
  rows.forEach(function(r){if(r.row.length>maxLen)maxLen=r.row.length;});
  var html='<div class="card"><div class="title">本表・擬似複勝表</div>';
  html+='<div class="small">赤文字＝メジアン。擬複Aは単勝1人気からのワイド相手順、擬複Bは単勝2人気からのワイド相手順、擬複Cはワイド上位10点の出現回数順。</div>';
  html+='<div class="honWrap">';
  rows.forEach(function(r){html+=renderHonRow(r.label,r.row,r.m,maxLen);});
  html+='</div></div>';
  return html;
}

function makeTickets(data,ctx,scored){
  var wide=[],nisha=[],san=[];
  function addPairTicket(a,b){
    if(!a||!b||a===b)return;
    add(wide,pairKey(a,b));
    add(nisha,pairKey(a,b));
  }
  function addTriTicket(a,b,c){
    if(!a||!b||!c||a===b||a===c||b===c)return;
    add(san,triKey(a,b,c));
  }

  var a=ctx.fav1,b=ctx.fav2;
  var pa=ctx.pseudoAM.slice();
  var pb=ctx.pseudoBM.slice();
  var top=scored.map(function(x){return x.h;}).filter(function(h){return h!==a&&h!==b;});

  pa.forEach(function(h){addPairTicket(a,h);});
  pb.forEach(function(h){addPairTicket(b,h);});

  if(a&&pa[0]&&top[0])addTriTicket(a,pa[0],top[0]);
  if(a&&pa[1]&&top[0])addTriTicket(a,pa[1],top[0]);
  if(a&&pa[0]&&b)addTriTicket(a,b,pa[0]);
  if(b&&pb[0]&&a)addTriTicket(a,b,pb[0]);

  // 3連系1番人気は検証用に保護
  if(ctx.sanRank[0])add(san,ctx.sanRank[0].key);

  return{wide:wide.slice(0,6),nisha:nisha.slice(0,6),san:san.slice(0,8)};
}

function makePseudoPairsText(p){
  if(!p||!p.pairs||!p.pairs.length)return "なし";
  return p.pairs.slice(0,8).map(function(x){
    var other=x.a===p.anchor?x.b:x.a;
    return p.anchor+"-"+other+" "+x.od;
  }).join("\n");
}

function run(){
  try{
    var data=parseData(document.getElementById("input").value);
    var out=document.getElementById("out");
    if(!data.tansho.length||!data.wide.length){
      out.innerHTML='<div class="card"><div class="title warn">入力不足</div>[TANSHO] と [WIDE] が必要です。2車複・3連系はあれば精度が上がります。</div>';
      return;
    }
    var ctx=makeContext(data);
    var scored=scoreAll(data,ctx);
    var tickets=makeTickets(data,ctx,scored);

    var lamps=[];
    lamps.push("🧪オート擬似複勝テスト：A="+joinC(ctx.pseudoAM)+" / B="+joinC(ctx.pseudoBM)+" / C="+joinC(ctx.pseudoCM));
    var overlapA=ctx.tanM.filter(function(h){return ctx.pseudoAM.indexOf(h)>=0;});
    if(overlapA.length)lamps.push("🔥単勝×擬似複勝Aメジアン重複："+joinC(overlapA));
    var overlapW=ctx.wideM.filter(function(h){return ctx.pseudoAM.indexOf(h)>=0||ctx.pseudoBM.indexOf(h)>=0;});
    if(overlapW.length)lamps.push("🟣ワイド×擬似複勝メジアン重複："+joinC(overlapW));
    if(scored[0]&&scored[0].score>=30)lamps.push("🚨擬似複勝テスト強反応："+scored[0].h+"号車【"+scored[0].score+"】");

    var html='';
    html+='<div class="card"><div class="title">'+data.title+'</div>';
    html+='単勝1人気：<span class="yellow">'+(ctx.tanRank[0]?ctx.tanRank[0].h+"号車 "+ctx.tanRank[0].od+"倍":"なし")+'</span><br>';
    html+='単勝2人気：<span class="yellow">'+(ctx.tanRank[1]?ctx.tanRank[1].h+"号車 "+ctx.tanRank[1].od+"倍":"なし")+'</span><br>';
    html+='2車複1人気：<span class="yellow">'+(ctx.nishaRank[0]?ctx.nishaRank[0].key+" "+ctx.nishaRank[0].od+"倍":"なし")+'</span><br>';
    html+='ワイド1人気：<span class="yellow">'+(ctx.wideRank[0]?ctx.wideRank[0].key+" "+ctx.wideRank[0].od+"倍":"なし")+'</span><br>';
    html+='3連系1人気：<span class="yellow">'+(ctx.sanRank[0]?ctx.sanRank[0].key+" "+ctx.sanRank[0].od+"倍":"なし")+'</span>';
    html+='</div>';

    html+='<div class="card lamp"><div class="title">発動・テストランプ</div>'+lamps.join('<br>')+'<hr>';
    html+='<span class="small">これは検証用です。まだ買い目へ強制反映しすぎない設定です。</span></div>';

    html+=makeHonpyo(ctx);

    html+='<div class="card"><div class="title">🧪擬似複勝の中身</div>';
    html+='<b>A：単勝1人気 '+ctx.fav1+'号車からのワイド相手順</b><pre>'+makePseudoPairsText(ctx.pseudoA)+'</pre>';
    html+='<b>B：単勝2人気 '+ctx.fav2+'号車からのワイド相手順</b><pre>'+makePseudoPairsText(ctx.pseudoB)+'</pre>';
    html+='<b>C：ワイド上位10点の出現回数</b><pre>'+ctx.pseudoC.slice(0,8).map(function(x){return x.h+"号車 出現"+x.count+"回 / 最安"+x.best;}).join("\n")+'</pre>';
    html+='</div>';

    html+='<div class="card"><div class="title">👑検証候補ランキング</div>';
    for(var i=0;i<Math.min(8,scored.length);i++){
      var x=scored[i];
      html+='<div class="rankLine"><span class="badge">'+(i+1)+'位 '+x.h+'号車【'+x.score+'】</span> ';
      html+='<span class="small">単'+x.tan+'　'+x.reasons.join('・')+'</span></div>';
    }
    html+='</div>';

    html+='<div class="card lamp2"><div class="title">💰テスト買い目候補</div><pre>';
    html+='※擬似複勝テスト用。まだ強制購入ロジックではありません。\n\n';
    html+='ワイド\n'+(tickets.wide.length?tickets.wide.join('\n'):'なし')+'\n\n';
    html+='2車複\n'+(tickets.nisha.length?tickets.nisha.join('\n'):'なし')+'\n\n';
    html+='3連系\n'+(tickets.san.length?tickets.san.join('\n'):'なし');
    html+='</pre></div>';

    out.innerHTML=html;
    latestCopyText=makeCopyText(data.title,ctx,scored,tickets,lamps);
  }catch(e){
    document.getElementById("out").innerHTML='<div class="card"><div class="title warn">エラー</div><pre>'+String(e&&e.message?e.message:e)+'</pre></div>';
  }
}

function makeCopyText(title,ctx,scored,tickets,lamps){
  var t='';
  t+=title+'\n';
  t+='オート擬似複勝テスト版\n';
  t+='発動：'+lamps.join(' / ')+'\n\n';
  t+='擬似複勝A：単勝1人気 '+ctx.fav1+'号車から\n'+joinC(ctx.pseudoA.row)+'\n';
  t+='擬似複勝Aメジアン：'+joinC(ctx.pseudoAM)+'\n';
  t+='擬似複勝B：単勝2人気 '+ctx.fav2+'号車から\n'+joinC(ctx.pseudoB.row)+'\n';
  t+='擬似複勝Bメジアン：'+joinC(ctx.pseudoBM)+'\n';
  t+='擬似複勝C：ワイド出現回数\n'+joinC(ctx.pseudoCRow)+'\n';
  t+='擬似複勝Cメジアン：'+joinC(ctx.pseudoCM)+'\n\n';
  t+='メジアン\n';
  t+='単勝：'+joinC(ctx.tanM)+'\n';
  t+='2車複：'+joinC(ctx.nishaM)+'\n';
  t+='ワイド：'+joinC(ctx.wideM)+'\n';
  t+='3連系：'+joinC(ctx.sanM)+'\n\n';
  t+='検証候補\n';
  for(var i=0;i<Math.min(5,scored.length);i++){
    t+=(i+1)+'位 '+scored[i].h+'号車【'+scored[i].score+'】 単'+scored[i].tan+' '+scored[i].reasons.join('・')+'\n';
  }
  t+='\nテスト買い目候補\n';
  t+='ワイド\n'+tickets.wide.join('\n')+'\n\n';
  t+='2車複\n'+tickets.nisha.join('\n')+'\n\n';
  t+='3連系\n'+tickets.san.join('\n')+'\n';
  return t;
}

function copyResult(){
  if(!latestCopyText){alert("先に解析してください");return;}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(latestCopyText).then(function(){alert("結果をコピーしました");}).catch(function(){fallbackCopy(latestCopyText);});
  }else{fallbackCopy(latestCopyText);}
}
function fallbackCopy(text){
  var ta=document.createElement("textarea");
  ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);
  alert("結果をコピーしました");
}
