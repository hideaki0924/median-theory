<script>
var latestCopyText='';
function zenToHan(str){return String(str||'').replace(/[０-９]/g,function(s){return String.fromCharCode(s.charCodeAt(0)-65248);}).replace(/．/g,'.').replace(/[－ー―−]/g,'-').replace(/[　]/g,' ').replace(/[〜～]/g,'-');}
function nums(line){var m=zenToHan(line).match(/\d+(?:\.\d+)?/g);return m?m.map(Number):[];}
function pairKey(a,b){return [a,b].map(String).sort(function(x,y){return Number(x)-Number(y);}).join('-');}
function triKey(a,b,c){return [a,b,c].map(String).sort(function(x,y){return Number(x)-Number(y);}).join('-');}
function add(arr,v){v=String(v);if(v&&v!=='undefined'&&arr.indexOf(v)<0)arr.push(v);}
function uniq(arr){var out=[];(arr||[]).forEach(function(v){add(out,v);});return out;}
function sortOdds(arr){return arr.slice().sort(function(a,b){return Number(a.od)-Number(b.od);});}
function safeNum(x,d){x=Number(x);return isFinite(x)?x:(d===0?0:(d||9999));}
function mid(arr){arr=arr||[];if(!arr.length)return[];var n=arr.length;if(n%2)return[arr[Math.floor(n/2)]];return[arr[n/2-1],arr[n/2]];}
function joinCars(arr){return (!arr||!arr.length)?'なし':arr.map(function(x){return x+'号車';}).join('・');}
function rankMap(row){var m={};row.forEach(function(h,i){m[h]=i+1;});return m;}
function getTan(data,h){h=String(h);for(var i=0;i<data.tan.length;i++){if(data.tan[i].h===h)return data.tan[i].od;}return null;}
function addP(arr,a,b){if(a&&b&&a!==b)add(arr,pairKey(a,b));}
function addT(arr,a,b,c){if(a&&b&&c&&a!==b&&a!==c&&b!==c)add(arr,triKey(a,b,c));}
function containsPair(p,h){return p.a===h||p.b===h;}
function otherInPair(p,h){return p.a===h?p.b:(p.b===h?p.a:null);}
function countTop(list,h,n){h=String(h);var c=0;(list||[]).slice(0,n||20).forEach(function(x){if(x.a===h||x.b===h||x.c===h)c++;});return c;}
function bestRank(list,h,n){h=String(h);for(var i=0;i<Math.min(n||20,list.length);i++){var x=list[i];if(x.a===h||x.b===h||x.c===h)return i+1;}return 999;}
function pairRow(pairs){var row=[];sortOdds(pairs).forEach(function(p){add(row,p.a);add(row,p.b);});return row;}
function triRow(tris){var row=[];sortOdds(tris).forEach(function(t){add(row,t.a);add(row,t.b);add(row,t.c);});return row;}
function findTri(list,key){for(var i=0;i<list.length;i++){if(list[i].key===key)return list[i];}return null;}
function parseData(raw){
  var text=zenToHan(raw),lines=text.split(/\n/),title='レース',sec='';
  var info=[],handi=[],tan=[],nisha=[],wide=[],san=[];
  for(var i=0;i<lines.length;i++){
    var line=lines[i].trim();if(!line)continue;
    if(line.indexOf('【')===0)title=line;
    var up=line.toUpperCase();
    if(up.indexOf('[')===0){
      if(up.indexOf('INFO')>=0){sec='INFO';continue;}
      if(up.indexOf('HAND')>=0||up.indexOf('HND')>=0){sec='HANDI';continue;}
      if(up.indexOf('TAN')>=0||up.indexOf('単')>=0){sec='TAN';continue;}
      if(up.indexOf('NIS')>=0||up.indexOf('NIR')>=0||up.indexOf('NIF')>=0||up.indexOf('2')>=0||up.indexOf('二')>=0){sec='NISHA';continue;}
      if(up.indexOf('WIDE')>=0||up.indexOf('ワイド')>=0){sec='WIDE';continue;}
      if(up.indexOf('SAN')>=0||up.indexOf('3')>=0||up.indexOf('三')>=0){sec='SAN';continue;}
    }
    if(sec==='INFO'){
      var n=nums(line);if(n.length>=2)info.push({h:String(Math.floor(n[0])),handi:n[1],test:n.length>=3?n[2]:null,st:n.length>=4?n[3]:null});
    }else if(sec==='HANDI'){
      var nh=nums(line);if(nh.length>=2)handi.push({h:String(Math.floor(nh[0])),handi:nh[1],test:null,st:null});
    }else if(sec==='TAN'){
      var nt=nums(line);if(nt.length>=2)tan.push({h:String(Math.floor(nt[0])),od:nt[1]});
    }else if(sec==='NISHA'){
      var m=line.match(/(\d+)\s*-\s*(\d+)/),o=nums(line);if(m&&o.length)nisha.push({a:m[1],b:m[2],od:o[o.length-1],key:pairKey(m[1],m[2])});
    }else if(sec==='WIDE'){
      var mw=line.match(/(\d+)\s*-\s*(\d+)/),ow=nums(line);if(mw&&ow.length)wide.push({a:mw[1],b:mw[2],od:ow[ow.length-1],key:pairKey(mw[1],mw[2])});
    }else if(sec==='SAN'){
      var ms=line.match(/(\d+)\s*-\s*(\d+)\s*-\s*(\d+)/),os=nums(line);if(ms&&os.length)san.push({a:ms[1],b:ms[2],c:ms[3],od:os[os.length-1],key:triKey(ms[1],ms[2],ms[3])});
    }
  }
  var map={};handi.forEach(function(x){map[x.h]=x;});info.forEach(function(x){map[x.h]=x;});
  var inf=[];Object.keys(map).sort(function(a,b){return Number(a)-Number(b);}).forEach(function(h){inf.push(map[h]);});
  return{title:title,info:inf,tan:tan,nisha:nisha,wide:wide,san:san};
}
function validateCars(data){
  var valid={};data.tan.forEach(function(x){valid[x.h]=true;});if(!Object.keys(valid).length)data.info.forEach(function(x){valid[x.h]=true;});
  var bad=[];function ck(h,src){if(!valid[h])bad.push(src+'に存在しない車番 '+h+'号車');}
  data.nisha.forEach(function(p){ck(p.a,'2車複');ck(p.b,'2車複');});data.wide.forEach(function(p){ck(p.a,'ワイド');ck(p.b,'ワイド');});data.san.forEach(function(t){ck(t.a,'3連系');ck(t.b,'3連系');ck(t.c,'3連系');});
  return uniq(bad);
}
function makeHandiGroups(data){
  var info=data.info.slice();if(!info.length)return{front:[],mid:[],heavy:[],bestFront:[],desc:'ハンデ情報なし'};
  var vals=info.map(function(x){return x.handi;}).sort(function(a,b){return a-b;});var min=vals[0],max=vals[vals.length-1];var front=[],mid=[],heavy=[];
  info.forEach(function(x){if(x.handi===min)add(front,x.h);else if(x.handi===max)add(heavy,x.h);else add(mid,x.h);});
  return{front:front,mid:mid,heavy:heavy,desc:'前 '+joinCars(front)+' / 中 '+joinCars(mid)+' / 重 '+joinCars(heavy)};
}
function partnerRowFor(car,pairs){var out=[];sortOdds(pairs).forEach(function(p){if(containsPair(p,car))add(out,otherInPair(p,car));});return out;}
function wideCountRow(data){
  var counts={},best={};sortOdds(data.wide).slice(0,20).forEach(function(p,i){[p.a,p.b].forEach(function(h){counts[h]=(counts[h]||0)+1;if(best[h]===undefined)best[h]=i+1;});});
  var hs=Object.keys(counts).sort(function(a,b){if(counts[b]!==counts[a])return counts[b]-counts[a];return (best[a]||99)-(best[b]||99);});return hs;
}
function wallZones(ctx){
  var fav=ctx.fav1,row=[],items=[];sortOdds(ctx.data.nisha).forEach(function(p){if(containsPair(p,fav)){items.push({h:otherInPair(p,fav),od:p.od,key:p.key});}});
  items.forEach(function(x){add(row,x.h);});
  var walls=[];for(var i=0;i<items.length-1;i++){var r=safeNum(items[i+1].od)/safeNum(items[i].od);if(r>=1.8)walls.push({idx:i,from:items[i],to:items[i+1],ratio:r});}
  var line=[],w1=[],w2=[],cut=[];
  if(!items.length){return{base:fav,line:[],w1:[],w2:[],cut:[],walls:[]};}
  if(!walls.length){line=row.slice(0,Math.min(4,row.length));w1=row.slice(4,6);w2=row.slice(6,8);cut=row.slice(8);}
  else{
    var a=walls[0].idx+1,b=walls[1]?walls[1].idx+1:Math.min(a+1,row.length),c=walls[2]?walls[2].idx+1:Math.min(b+2,row.length);
    line=row.slice(0,a);w1=row.slice(a,b);w2=row.slice(b,c);cut=row.slice(c);
  }
  return{base:fav,line:line,w1:w1,w2:w2,cut:cut,walls:walls,items:items};
}
function makeContext(data){
  var tanRank=sortOdds(data.tan),nishaRank=sortOdds(data.nisha),wideRank=sortOdds(data.wide),sanRank=sortOdds(data.san);
  var tanRow=tanRank.map(function(x){return x.h;}),nishaRow=pairRow(data.nisha),wideRow=pairRow(data.wide),sanRow=triRow(data.san);
  var fav1=tanRank[0]?tanRank[0].h:null,fav2=tanRank[1]?tanRank[1].h:null;
  var ctx={data:data,tanRank:tanRank,nishaRank:nishaRank,wideRank:wideRank,sanRank:sanRank,tanRow:tanRow,nishaRow:nishaRow,wideRow:wideRow,sanRow:sanRow,fav1:fav1,fav2:fav2,tanM:mid(tanRow),nishaM:mid(nishaRow),wideM:mid(wideRow),sanM:mid(sanRow),handi:makeHandiGroups(data)};
  ctx.pseudoA=partnerRowFor(fav1,data.nisha);ctx.pseudoB=partnerRowFor(fav2,data.nisha);ctx.pseudoC=wideCountRow(data);
  ctx.pseudoAM=mid(ctx.pseudoA);ctx.pseudoBM=mid(ctx.pseudoB);ctx.pseudoCM=mid(ctx.pseudoC);ctx.wall=wallZones(ctx);
  return ctx;
}
function scoreAll(ctx){
  var tr=rankMap(ctx.tanRow),nr=rankMap(ctx.nishaRow),wr=rankMap(ctx.wideRow),sr=rankMap(ctx.sanRow);var all=[];
  ctx.tanRow.forEach(function(h){add(all,h);});ctx.nishaRow.forEach(function(h){add(all,h);});ctx.wideRow.forEach(function(h){add(all,h);});ctx.sanRow.forEach(function(h){add(all,h);});
  var out=[];all.forEach(function(h){var score=0,re=[];function hit(arr,pt,txt){if((arr||[]).indexOf(h)>=0){score+=pt;re.push(txt);}}
    hit(ctx.tanM,10,'単勝メジアン');hit(ctx.nishaM,11,'2車複メジアン');hit(ctx.wideM,10,'ワイドメジアン');hit(ctx.sanM,10,'3連系メジアン');
    hit(ctx.pseudoAM,9,'擬似複勝Aメジアン');hit(ctx.pseudoBM,9,'擬似複勝Bメジアン');hit(ctx.pseudoCM,8,'擬似複勝Cメジアン');
    hit(ctx.wall.line,8,'2複基準本線');hit(ctx.wall.w1,8,'第1壁後');hit(ctx.wall.w2,6,'第2壁後');
    if((ctx.handi.front||[]).indexOf(h)>=0){score+=8;re.push('前ハンデ候補');}
    if((ctx.handi.heavy||[]).indexOf(h)>=0){score+=5;re.push('重ハンデ候補');}
    if(h===ctx.fav1){score+=8;re.push('単勝1人気');} if(h===ctx.fav2){score+=8;re.push('単勝2人気');}
    var topS=countTop(ctx.sanRank,h,10),topW=countTop(ctx.wideRank,h,12),topN=countTop(ctx.nishaRank,h,10);
    if(topS>=2){score+=8;re.push('3連系上位出現'+topS+'回');} if(topW>=2){score+=7;re.push('ワイド上位出現'+topW+'回');} if(topN>=2){score+=6;re.push('2車複上位出現'+topN+'回');}
    var od=safeNum(getTan(ctx.data,h));
    if(od>=5&&od<=25&&score>=38){score+=8;re.push('単勝100円保険候補');}
    if(od>40&&score<50){score-=5;re.push('単勝40倍超は3着穴寄り');}
    out.push({h:h,score:Math.round(score),tan:od,reason:re,sanBest:bestRank(ctx.sanRank,h,12)});
  });
  out.sort(function(a,b){if(b.score!==a.score)return b.score-a.score;return safeNum(a.tan)-safeNum(b.tan);});return out;
}
function makeDiag(ctx,score){
  var fav=safeNum(ctx.tanRank[0]?ctx.tanRank[0].od:null),top2=safeNum(ctx.tanRank[1]?ctx.tanRank[1].od:null);var surface='判定不可',risk=0,back='通常';
  if(fav<=1.8){surface='本命戦';risk+=1;}else if(fav<=3.0){surface='中荒れ戦';risk+=2;}else{surface='荒れ戦';risk+=3;}
  if(top2/fav>=3){risk+=2;back='本命頭飛び警戒';}
  if(ctx.wall.w1.length>=2){risk+=1;back=back==='通常'?'本命残し＋第1壁後混入':back;}
  var noFavTri=ctx.sanRank.filter(function(t){return t.a!==ctx.fav1&&t.b!==ctx.fav1&&t.c!==ctx.fav1;})[0]||null;
  if(noFavTri&&safeNum(noFavTri.od)<=25){risk+=1;back='本命頭飛び警戒';}
  return{surface:surface,risk:risk,back:back,noFavTri:noFavTri};
}
function makeProtections(ctx,score){
  var p=[];function push(name,key,why){addT(p,key.split('-')[0],key.split('-')[1],key.split('-')[2]);}
  // V24.13: 検証候補1位×三連系20倍以内保護
  var top=score[0]?score[0].h:null;ctx.sanRank.forEach(function(t){if(top&&(t.a===top||t.b===top||t.c===top)&&safeNum(t.od)<=20)addT(p,t.a,t.b,t.c);});
  // ① 本命＋単勝2人気/2複本線＋前ハンデ重複の三角保護
  var fav=ctx.fav1,sec=ctx.fav2;
  ctx.handi.front.forEach(function(fh){if(fh!==fav&&fh!==sec){addT(p,fav,sec,fh);}});
  // ② 本線車＋前ハンデ重複車＋本命の逃げ道保護
  ctx.wall.line.forEach(function(lh){ctx.handi.front.forEach(function(fh){if(lh!==fh)addT(p,fav,lh,fh);});});
  // ③ 重ハンデ隣接三角 4-5-6 / 5-6-7 等
  var hs=ctx.handi.heavy.map(Number).sort(function(a,b){return a-b;});for(var i=0;i<hs.length-2;i++){if(hs[i+2]-hs[i]===2)addT(p,String(hs[i]),String(hs[i+1]),String(hs[i+2]));}
  // ④ ハンデ大穴3連スイッチ：前・中・重から強い順に混ぜる
  var front=ctx.handi.front.slice(0,2),mid=ctx.handi.mid.slice(0,2),heavy=ctx.handi.heavy.slice(0,4);
  front.forEach(function(a){mid.forEach(function(b){heavy.forEach(function(c){if(p.length<18)addT(p,a,b,c);});});});
  // ⑤ 本命飛び保険：前2頭＋中/重メジアン核
  var meds=uniq([].concat(ctx.pseudoAM,ctx.pseudoBM,ctx.pseudoCM,ctx.tanM,ctx.nishaM,ctx.wideM,ctx.sanM));
  if(front.length>=2){meds.forEach(function(m){if(m!==front[0]&&m!==front[1])addT(p,front[0],front[1],m);});}
  return uniq(p).slice(0,20);
}
function makeTickets(ctx,score,prot){
  var wide=[],nisha=[],main=[],hole=[],bomb=[];
  function addBoth(a,b){addP(wide,a,b);addP(nisha,a,b);}
  var fav=ctx.fav1,sec=ctx.fav2;
  // 既存上位三連系
  ctx.sanRank.slice(0,4).forEach(function(t){addT(main,t.a,t.b,t.c);});
  // V24.13 保護は本線〜穴本線に昇格
  prot.slice(0,6).forEach(function(k){var a=k.split('-');addT(main,a[0],a[1],a[2]);});
  prot.slice(6,14).forEach(function(k){var a=k.split('-');addT(hole,a[0],a[1],a[2]);});
  prot.slice(14).forEach(function(k){var a=k.split('-');addT(bomb,a[0],a[1],a[2]);});
  score.slice(0,5).forEach(function(x){addBoth(fav,x.h);addBoth(sec,x.h);});
  // 強反応1位に寄せすぎないため、本命＋2人気＋前ハンデを明示追加
  ctx.handi.front.forEach(function(fh){addT(hole,fav,sec,fh);});
  // 重ハンデ三角は候補止まりにしない
  var hs=ctx.handi.heavy.map(Number).sort(function(a,b){return a-b;});for(var i=0;i<hs.length-2;i++){if(hs[i+2]-hs[i]===2)addT(hole,String(hs[i]),String(hs[i+1]),String(hs[i+2]));}
  return{wide:uniq(wide).slice(0,10),nisha:uniq(nisha).slice(0,10),main:uniq(main).slice(0,10),hole:uniq(hole).slice(0,12),bomb:uniq(bomb).slice(0,12)};
}

function hasCar(arr,h){return (arr||[]).indexOf(String(h))>=0;}

}
function tan100(score){return score.filter(function(x){return x.reason.join(' ').indexOf('単勝100円保険候補')>=0&&x.h!==undefined;}).slice(0,3);}
function renderTop(data,ctx){return '<div class="card"><div class="title">'+data.title+'</div>単勝1人気：<span class="yellow">'+(ctx.tanRank[0]?ctx.tanRank[0].h+'号車 '+ctx.tanRank[0].od:'なし')+'</span><br>単勝2人気：<span class="yellow">'+(ctx.tanRank[1]?ctx.tanRank[1].h+'号車 '+ctx.tanRank[1].od:'なし')+'</span><br>'+ctx.handi.desc+'</div>';}
function renderDiag(diag,ctx,prot){var html='<div class="card '+(diag.risk>=4?'diagWarn':'diag')+'"><div class="title">🩺オート荒れ診断</div>';html+='表面：<span class="yellow">'+diag.surface+'</span><br>裏診断：<span class="orange">'+diag.back+'</span><br>荒れ警戒スコア：<span class="yellow">'+diag.risk+'</span><br>';if(diag.noFavTri)html+='本命なし3連系：'+diag.noFavTri.key+' '+diag.noFavTri.od+'倍<br>';html+='<hr>V24.15保護：<br><pre>'+((prot.length?prot.join('\n'):'なし'))+'</pre></div>';return html;}
function renderWall(ctx){var html='<div class="card"><div class="title">🧱2複基準壁ゾーン</div>';html+='基準：'+ctx.wall.base+'号車<br>本線：<span class="yellow">'+joinCars(ctx.wall.line)+'</span><br>第1壁後：<span class="orange">'+joinCars(ctx.wall.w1)+'</span><br>第2壁後：<span class="red">'+joinCars(ctx.wall.w2)+'</span><br>切り：'+joinCars(ctx.wall.cut)+'<hr>壁：<br>';if(!ctx.wall.walls.length)html+='壁なし';else ctx.wall.walls.forEach(function(w){html+='🔥壁 '+w.from.h+'→'+w.to.h+' / '+w.from.od+'→'+w.to.od+' / 倍率'+w.ratio.toFixed(2)+'<br>';});html+='</div>';return html;}
function renderPseudo(ctx){var html='<div class="card"><div class="title">🧪擬似複勝・メジアン</div><pre>';html+='擬似複勝A：単勝1人気 '+ctx.fav1+'号車から\n'+joinCars(ctx.pseudoA)+'\nAメジアン：'+joinCars(ctx.pseudoAM)+'\n\n';html+='擬似複勝B：単勝2人気 '+ctx.fav2+'号車から\n'+joinCars(ctx.pseudoB)+'\nBメジアン：'+joinCars(ctx.pseudoBM)+'\n\n';html+='擬似複勝C：ワイド出現回数\n'+joinCars(ctx.pseudoC)+'\nCメジアン：'+joinCars(ctx.pseudoCM)+'\n\n';html+='メジアン\n単勝：'+joinCars(ctx.tanM)+'\n2車複：'+joinCars(ctx.nishaM)+'\nワイド：'+joinCars(ctx.wideM)+'\n3連系：'+joinCars(ctx.sanM);html+='</pre></div>';return html;}
function renderRank(score){var html='<div class="card switch"><div class="title">📚大谷式3壁スイッチ・検証候補</div>';score.slice(0,8).forEach(function(x,i){html+='<div class="rankLine"><span class="badge">'+(i+1)+'位 '+x.h+'号車【'+x.score+'】</span> 単'+(isFinite(x.tan)?x.tan:'-')+' <span class="small">'+x.reason.slice(0,10).join('・')+'</span></div>';});html+='</div>';return html;}
function renderTan100(list){var html='<div class="card tan100"><div class="title">💴単勝候補・1着ありチェック</div>';if(!list.length)html+='なし';else list.forEach(function(x){html+='<div class="rankLine"><span class="badge">'+x.h+'号車</span> 単'+x.tan+' <span class="small">'+x.reason.slice(0,8).join('・')+'</span></div>';});html+='<hr><span class="small">V24.15：SS級だけ単勝800円。S級/第1壁後型はワイド＋保護3連複へ降格。弱い候補は100円まで。</span></div>';return html;}
function renderHonRow(label,row,med,marks,max){var arr=row.slice();while(arr.length<max)arr.push('');var html='<div class="honRow"><div class="honLabel">'+label+'</div>';for(var i=0;i<max;i++){var h=arr[i],cls='honNum';if(!h)cls+=' honEmpty';else if((marks.fav||[]).indexOf(h)>=0)cls+=' favc';else if((marks.w1||[]).indexOf(h)>=0)cls+=' wall1';else if((marks.w2||[]).indexOf(h)>=0)cls+=' wall2';else if((med||[]).indexOf(h)>=0)cls+=' honMed';html+='<span class="'+cls+'">'+(h||'')+'</span>';if(i<max-1)html+='<span class="bar"></span>';}return html+'</div>';}
function renderHonpyo(ctx){var rows=[{l:'単勝',r:ctx.tanRow,m:ctx.tanM},{l:'2車複',r:ctx.nishaRow,m:ctx.nishaM},{l:'ワイド',r:ctx.wideRow,m:ctx.wideM},{l:'3連系',r:ctx.sanRow,m:ctx.sanM}];var max=0;rows.forEach(function(x){if(x.r.length>max)max=x.r.length;});var marks={fav:[ctx.fav1,ctx.fav2],w1:ctx.wall.w1,w2:ctx.wall.w2};var html='<div class="card"><div class="title">本表・壁色つき</div><div class="small">青=単勝1/2人気 黄=第1壁後 橙=第2壁後 赤=メジアン</div><div class="honWrap">';rows.forEach(function(x){html+=renderHonRow(x.l,x.r,x.m,marks,max);});html+='</div></div>';return html;}
function renderBuy(t){var html='<div class="card buy"><div class="title">🎯検証用候補 V24.15</div><pre>';html+='ワイド候補\n'+(t.wide.length?t.wide.join('\n'):'なし')+'\n\n';html+='2車複候補\n'+(t.nisha.length?t.nisha.join('\n'):'なし')+'\n\n';html+='3連系・本線候補\n'+(t.main.length?t.main.join('\n'):'なし')+'\n\n';html+='3連系・穴本線候補\n'+(t.hole.length?t.hole.join('\n'):'なし')+'\n\n';html+='3連系・大荒れ保険候補\n'+(t.bomb.length?t.bomb.join('\n'):'なし')+'\n\n';html+='※ここは検証用。実際に買うのは上の「最終勝負タイプ」だけ。通常時は最大3点まで。';html+='</pre></div>';return html;}
function makeCopy(title,ctx,diag,score,prot,t100,t,plan){
  var lines=[];
  lines.push(title);
  lines.push('オート擬似複勝テスト版 V24.15 回収率フィルター＋穴連れ相棒');
  lines.push('');
  lines.push('🩺オート荒れ診断');
  lines.push('表面：'+diag.surface);
  lines.push('裏診断：'+diag.back);
  lines.push('荒れ警戒スコア：'+diag.risk);
  lines.push('ハンデ補正：'+ctx.handi.desc);
  lines.push('V24.15保護：'+(prot.length?prot.join(' / '):'なし'));
  lines.push('');
  lines.push('🔥最終勝負タイプ');
  lines.push(plan.type);
  if(plan.memo&&plan.memo.length){plan.memo.forEach(function(m){lines.push(m);});}
  lines.push('');
  lines.push('最終買い目');
  if(plan.lines&&plan.lines.length){
    var total=0;
    plan.lines.forEach(function(l){
      total+=l.stake||0;var ret=lineReturn(l);var row=l.kind+' '+l.key+' '+yen(l.stake);
      if(l.od!==null&&l.od!==undefined)row+=' オッズ'+l.od;
      if(ret!==null)row+=' 想定戻り'+yen(ret);
      if(l.reason)row+=' / '+l.reason;
      lines.push(row);
    });
    lines.push('合計 '+yen(total));
  }else{lines.push('なし');}
  if(plan.skip&&plan.skip.length){lines.push('');lines.push('見送り/カット');plan.skip.forEach(function(x){lines.push(x);});}
  lines.push('');
  lines.push('2複基準壁ゾーン');
  lines.push('基準：'+ctx.wall.base+'号車');
  lines.push('本線：'+joinCars(ctx.wall.line));
  lines.push('第1壁後：'+joinCars(ctx.wall.w1));
  lines.push('第2壁後：'+joinCars(ctx.wall.w2));
  lines.push('');
  lines.push('メジアン');
  lines.push('単勝：'+joinCars(ctx.tanM));
  lines.push('2車複：'+joinCars(ctx.nishaM));
  lines.push('ワイド：'+joinCars(ctx.wideM));
  lines.push('3連系：'+joinCars(ctx.sanM));
  lines.push('');
  lines.push('単勝候補');
  if(t100.length)t100.forEach(function(x){lines.push(x.h+' 単'+x.tan);});else lines.push('なし');
  lines.push('');
  lines.push('検証候補');
  score.slice(0,8).forEach(function(x,i){lines.push((i+1)+'位 '+x.h+'号車【'+x.score+'】 単'+(isFinite(x.tan)?x.tan:'-')+' '+x.reason.slice(0,9).join('・'));});
  lines.push('');
  lines.push('検証用候補');
  lines.push('ワイド');
  (t.wide.length?t.wide:['なし']).forEach(function(x){lines.push(x);});
  lines.push('');lines.push('2車複');
  (t.nisha.length?t.nisha:['なし']).forEach(function(x){lines.push(x);});
  lines.push('');lines.push('3連系・本線候補');
  (t.main.length?t.main:['なし']).forEach(function(x){lines.push(x);});
  lines.push('');lines.push('3連系・穴本線候補');
  (t.hole.length?t.hole:['なし']).forEach(function(x){lines.push(x);});
  lines.push('');lines.push('3連系・大荒れ保険候補');
  (t.bomb.length?t.bomb:['なし']).forEach(function(x){lines.push(x);});
  return lines.join(String.fromCharCode(10));
}
function run(){try{var data=parseData(document.getElementById('input').value),out=document.getElementById('out');if(!data.tan.length){out.innerHTML='<div class="card err"><div class="title">入力不足</div>[TANSHO] が必要です。</div>';return;}var bad=validateCars(data);if(bad.length){out.innerHTML='<div class="card err"><div class="title">車番エラー</div><pre>'+bad.join(String.fromCharCode(10))+'</pre><span class="small">V24.15では存在しない車番が混入したら解析を止めます。</span></div>';return;}var ctx=makeContext(data),score=scoreAll(ctx),diag=makeDiag(ctx,score),prot=makeProtections(ctx,score),t100=tan100(score),tickets=makeTickets(ctx,score,prot),plan=makeFinalPlan(ctx,score,diag,tickets);var html='';html+=renderTop(data,ctx)+renderDiag(diag,ctx,prot)+renderFinalPlan(plan)+renderWall(ctx)+renderPseudo(ctx)+renderTan100(t100)+renderRank(score)+renderHonpyo(ctx)+renderBuy(tickets);out.innerHTML=html;latestCopyText=makeCopy(data.title,ctx,diag,score,prot,t100,tickets,plan);}catch(e){document.getElementById('out').innerHTML='<div class="card err"><div class="title">エラー</div><pre>'+String(e&&e.message?e.message:e)+'</pre></div>';}}
function clearAll(){document.getElementById('input').value='';document.getElementById('out').innerHTML='';latestCopyText='';}
function copyResult(){if(!latestCopyText){alert('先に解析してください');return;}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(latestCopyText).then(function(){alert('結果をコピーしました');}).catch(function(){fallbackCopy(latestCopyText);});}else fallbackCopy(latestCopyText);}function fallbackCopy(text){var ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);alert('結果をコピーしました');}
