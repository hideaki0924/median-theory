<style>

.lamp{border:3px solid #a855f7;background:linear-gradient(135deg,#16002c,#2b075f,#16002c);box-shadow:0 0 24px rgba(168,85,247,.55)}

</style>

<body>
<h1>チャッピー神予想 オート V24.8<br>上位三連系保護＋単勝未表示救済版</h1>

<textarea id="input" placeholder="【伊勢崎4R】

[TANSHO]
車番 単勝オッズ

[NISHA]
車番-車番 2車複オッズ

[WIDE]
車番-車番 ワイドオッズ

[SANREN]
車番-車番-車番 3連系オッズ

※見出しはある程度ゆるく対応
[TANFUKU] / [UMAREN] / [SANPUKU] でも可"></textarea><br>

<button class="go" id="btnRun">解析</button>
<button class="test" id="btnSample">テスト</button>
<button class="clear" id="btnClear">リセット</button>
<button class="copy" id="btnCopy">結果コピー</button>
<div id="out"></div>

<script>
var latestCopyText="";

function zenToHan(str){
  return String(str)
    .replace(/[０-９]/g,function(s){return String.fromCharCode(s.charCodeAt(0)-65248);})
    .replace(/．/g,'.').replace(/[－ー―−]/g,'-').replace(/[　]/g,' ').replace(/[〜～]/g,'-');
}
function nums(line){
  var m=zenToHan(line).match(/\d+(?:\.\d+)?/g);
  if(!m)return[];
  return m.map(function(x){return Number(x);});
}
function pairKey(a,b){return [a,b].map(String).sort(function(x,y){return Number(x)-Number(y);}).join('-');}
function triKey(a,b,c){return [a,b,c].map(String).sort(function(x,y){return Number(x)-Number(y);}).join('-');}
function uniq(arr){
  var s={},out=[];
  for(var i=0;i<arr.length;i++){
    var v=String(arr[i]);
    if(v&&v!=="undefined"&&!s[v]){s[v]=true;out.push(v);}
  }
  return out;
}
function sortOdds(arr){return arr.slice().sort(function(a,b){return Number(a.od)-Number(b.od);});}
function joinC(arr){return (!arr||!arr.length)?"なし":arr.map(function(x){return x+"号車";}).join("・");}
function mid(arr){
  arr=arr||[];
  if(!arr.length)return[];
  if(arr.length===1)return[arr[0]];
  var n=arr.length;
  if(n%2===1)return[arr[Math.floor(n/2)]];
  return[arr[n/2-1],arr[n/2]];
}
function getTan(data,h){
  h=String(h);
  for(var i=0;i<data.tansho.length;i++){if(data.tansho[i].h===h)return data.tansho[i];}
  return null;
}
function findPair(arr,a,b){
  var k=pairKey(a,b);
  for(var i=0;i<arr.length;i++){if(arr[i].key===k)return arr[i];}
  return null;
}
function findTri(arr,a,b,c){
  var k=triKey(a,b,c);
  for(var i=0;i<arr.length;i++){if(arr[i].key===k)return arr[i];}
  return null;
}
function add(arr,v){if(v&&arr.indexOf(v)<0)arr.push(v);}

function parseData(raw){
  var text=zenToHan(raw),lines=text.split(/\n/),title="レース",sec="";
  var tansho=[],nisha=[],wide=[],sanren=[];
  for(var i=0;i<lines.length;i++){
    var line=lines[i].trim();
    if(!line)continue;
    if(line.indexOf("【")===0)title=line;
    var up=line.toUpperCase();

    if(up.indexOf("[")===0){
      if(up.indexOf("TAN")>=0 || up.indexOf("単")>=0){sec="TANSHO";continue;}
      if(up.indexOf("WIDE")>=0 || up.indexOf("ワイド")>=0){sec="WIDE";continue;}
      if(up.indexOf("SAN")>=0 || up.indexOf("3")>=0 || up.indexOf("三")>=0){sec="SANREN";continue;}
      if(up.indexOf("NISHA")>=0 || up.indexOf("NIREN")>=0 || up.indexOf("2")>=0 || up.indexOf("UMA")>=0 || up.indexOf("馬")>=0){sec="NISHA";continue;}
    }

    if(sec==="TANSHO"){
      var n=nums(line);
      if(n.length>=2)tansho.push({h:String(Math.floor(n[0])),od:n[n.length-1]});
    }
    if(sec==="NISHA"){
      var m=line.match(/(\d+)\s*-\s*(\d+)/),o=nums(line);
      if(m&&o.length)nisha.push({a:m[1],b:m[2],od:o[o.length-1],key:pairKey(m[1],m[2])});
    }
    if(sec==="WIDE"){
      var mw=line.match(/(\d+)\s*-\s*(\d+)/),ow=nums(line);
      if(mw&&ow.length)wide.push({a:mw[1],b:mw[2],od:ow[ow.length-1],key:pairKey(mw[1],mw[2])});
    }
    if(sec==="SANREN"){
      var ms=line.match(/(\d+)\s*-\s*(\d+)\s*-\s*(\d+)/),os=nums(line);
      if(ms&&os.length)sanren.push({a:ms[1],b:ms[2],c:ms[3],od:os[os.length-1],key:triKey(ms[1],ms[2],ms[3])});
    }
  }
  return{title:title,tansho:tansho,nisha:nisha,wide:wide,sanren:sanren};
}

function rankRowFromPairs(pairs){
  var row=[],arr=sortOdds(pairs);
  for(var i=0;i<arr.length;i++){
    add(row,arr[i].a);
    add(row,arr[i].b);
  }
  return row;
}
function rankRowFromTris(tris){
  var row=[],arr=sortOdds(tris);
  for(var i=0;i<arr.length;i++){
    add(row,arr[i].a);
    add(row,arr[i].b);
    add(row,arr[i].c);
  }
  return row;
}
function pseudoFromAnchor(list,anchor){
  var arr=sortOdds(list).filter(function(p){return p.a===anchor||p.b===anchor;});
  var row=[];
  for(var i=0;i<arr.length;i++){
    var other=arr[i].a===anchor?arr[i].b:arr[i].a;
    add(row,other);
  }
  return{anchor:anchor,row:row,pairs:arr};
}
function pseudoWideCount(wide,topN){
  var map={},arr=sortOdds(wide).slice(0,topN||10);
  for(var i=0;i<arr.length;i++){
    [arr[i].a,arr[i].b].forEach(function(h){
      if(!map[h])map[h]={h:h,count:0,best:999};
      map[h].count++;
      if(Number(arr[i].od)<map[h].best)map[h].best=Number(arr[i].od);
    });
  }
  var out=[];
  for(var k in map)out.push(map[k]);
  out.sort(function(a,b){
    if(b.count!==a.count)return b.count-a.count;
    return a.best-b.best;
  });
  return out;
}
function wallInfoFromOdds(odds){
  var walls=[],semis=[];
  for(var i=0;i<odds.length-1;i++){
    var now=Number(odds[i]),next=Number(odds[i+1]);
    if(!now||!next)continue;
    var ratio=next/now,diff=next-now;
    if(ratio>=1.8)walls.push({pos:i,ratio:ratio,diff:diff});
    else if(ratio>=1.55)semis.push({pos:i,ratio:ratio,diff:diff});
  }
  return{walls:walls,semis:semis};
}
function wallPosList(info,type){
  var arr=(type==="semi"?info.semis:info.walls),out=[];
  for(var i=0;i<arr.length;i++)out.push(arr[i].pos);
  return out;
}
function makeAnchorPairRow(pairs,anchor){
  var p=pseudoFromAnchor(pairs,anchor);
  return{anchor:anchor,row:p.row,pairs:p.pairs,odds:p.pairs.map(function(x){return Number(x.od);})};
}
function makeWallZones(rowObj){
  var row=rowObj.row||[],pairs=rowObj.pairs||[],odds=rowObj.odds||[];
  var info=wallInfoFromOdds(odds);
  var wallPos=wallPosList(info,"wall");
  var zones=[],start=0;
  for(var i=0;i<=wallPos.length;i++){
    var end=(i<wallPos.length?wallPos[i]+1:row.length);
    var horses=row.slice(start,end).filter(function(h){return !!h;});
    var pairSlice=pairs.slice(start,end);
    zones.push({idx:i,horses:horses,pairs:pairSlice});
    start=end;
  }
  var labels=["本線","第1壁後","第2壁後","切り"];
  for(var z=0;z<zones.length;z++){
    zones[z].label=(z<3?labels[z]:"切り");
  }
  return{zones:zones,info:info,row:row,odds:odds,pairs:pairs,anchor:rowObj.anchor};
}
function zoneIndexOf(zones,h){
  for(var i=0;i<zones.length;i++){
    if(zones[i].horses.indexOf(String(h))>=0)return i;
  }
  return -1;
}
function zoneLabel(idx){
  if(idx===0)return "2複基準本線";
  if(idx===1)return "2複基準第1壁後";
  if(idx===2)return "2複基準第2壁後";
  if(idx>=3)return "2複基準切り";
  return "";
}
function fmtWallDetails(rowObj){
  var info=rowObj.info||{walls:[],semis:[]},row=rowObj.row||[],odds=rowObj.odds||[];
  if(!info.walls.length&&!info.semis.length)return "壁なし";
  var lines=[];
  function one(w,mark){
    var before=row[w.pos],after=row[w.pos+1],bOd=odds[w.pos],aOd=odds[w.pos+1];
    lines.push(mark+" "+before+"→"+after+" / "+bOd+"→"+aOd+" / 倍率"+w.ratio.toFixed(2));
  }
  for(var i=0;i<info.walls.length;i++)one(info.walls[i],"🔥壁");
  for(var j=0;j<info.semis.length;j++)one(info.semis[j],"⚠️準壁");
  return lines.join("\n");
}

function pairInTop(row,h,n){
  h=String(h);
  return (row||[]).slice(0,n||4).indexOf(h)>=0;
}
function collectAllHorses(data){
  var out=[];
  function addH(h){if(h!==undefined&&h!==null)add(out,String(h));}
  (data.tansho||[]).forEach(function(x){addH(x.h);});
  (data.nisha||[]).forEach(function(x){addH(x.a);addH(x.b);});
  (data.wide||[]).forEach(function(x){addH(x.a);addH(x.b);});
  (data.sanren||[]).forEach(function(x){addH(x.a);addH(x.b);addH(x.c);});
  return out;
}
function knownTanOdds(data,h){
  var tf=getTan(data,String(h));
  if(!tf)return null;
  var od=Number(tf.od);
  if(!isFinite(od)||od<=0)return null;
  return od;
}
function safeTanSortVal(x){
  var n=Number(x.tan);
  if(!isFinite(n)||n<=0)return 9999;
  return n;
}
function rankOfKey(arr,key){
  for(var i=0;i<arr.length;i++){if(arr[i].key===key)return i+1;}
  return 999;
}
function countAppearTop(list,h,n){
  h=String(h);
  var c=0;
  (list||[]).slice(0,n||20).forEach(function(x){
    if(x.a===h||x.b===h||x.c===h)c++;
  });
  return c;
}
function detectHiddenFloaters(data,ctx,scored){
  // 飯塚5Rの1号車型。単勝が未入力/0.0でも、連系で浮いている車を3着救済へ。
  var all=collectAllHorses(data), out=[];
  var strong=scored.slice(0,4).map(function(x){return x.h;});
  for(var i=0;i<all.length;i++){
    var h=all[i];
    if(knownTanOdds(data,h)!==null)continue;
    var nCnt=countAppearTop(ctx.nishaRank,h,20);
    var wCnt=countAppearTop(ctx.wideRank,h,20);
    var sCnt=countAppearTop(ctx.sanRank,h,20);
    var bestTri=null,bestRank=999;
    for(var j=0;j<ctx.sanRank.length;j++){
      var t=ctx.sanRank[j],hs=[t.a,t.b,t.c];
      if(hs.indexOf(h)<0)continue;
      var hasFav=(hs.indexOf(ctx.fav1)>=0||hs.indexOf(ctx.fav2)>=0);
      var hasStrong=strong.some(function(x){return x!==h&&hs.indexOf(x)>=0;});
      if(hasFav&&hasStrong){bestTri=t;bestRank=j+1;break;}
    }
    var pt=nCnt*2+wCnt*2+sCnt*3+(bestTri?18:0);
    if(bestRank<=15)pt+=10;
    if(pt>=22){
      out.push({h:h,score:pt,nisha:nCnt,wide:wCnt,san:sCnt,bestTri:bestTri,bestRank:bestRank});
    }
  }
  out.sort(function(a,b){return b.score-a.score;});
  return out.slice(0,4);
}
function signalCountForTan100(data,ctx,h){
  h=String(h);
  var c=0,rs=[];
  if(ctx.tanM.indexOf(h)>=0){c++;rs.push("単勝メジアン");}
  if(ctx.nishaM.indexOf(h)>=0){c++;rs.push("2車複メジアン");}
  if(ctx.wideM.indexOf(h)>=0){c++;rs.push("ワイドメジアン");}
  if(ctx.sanM.indexOf(h)>=0){c++;rs.push("3連系メジアン");}
  if(ctx.pseudoAM.indexOf(h)>=0){c++;rs.push("擬似複勝Aメジアン");}
  if(ctx.pseudoBM.indexOf(h)>=0){c++;rs.push("擬似複勝Bメジアン");}
  if(ctx.pseudoCM.indexOf(h)>=0){c++;rs.push("擬似複勝Cメジアン");}
  if(pairInTop(ctx.pseudoA.row,h,4)){c++;rs.push("1人気連動上位");}
  if(pairInTop(ctx.pseudoB.row,h,4)){c++;rs.push("2人気連動上位");}
  if(pairInTop(ctx.pseudoCRow,h,5)){c++;rs.push("ワイド出現上位");}
  var zi=zoneIndexOf(ctx.baseZones.zones,h);
  if(zi===1){c+=2;rs.push("2複基準第1壁後");}
  else if(zi===0){c++;rs.push("2複基準本線");}
  else if(zi===2){c++;rs.push("2複基準第2壁後");}
  return{count:c,reasons:uniq(rs),zone:zi};
}
function detectTan100Insurance(data,ctx,scored){
  // 浜松1Rの1号車、浜松9Rの5号車型。
  // 単勝を100円だけ置いておくと、単勝910円/1870円のように全体を黒字化する狙い。
  var map={},out=[];
  for(var i=0;i<scored.length;i++)map[scored[i].h]=scored[i];
  for(var j=0;j<data.tansho.length;j++){
    var tf=data.tansho[j],h=tf.h,od=Number(tf.od);
    if(h===ctx.fav1||h===ctx.fav2)continue;
    if(od<5||od>35)continue; // 100円保険はここまで。35倍超は単勝ではなく3連系末席。
    var sc=map[h]?map[h].score:0;
    var sig=signalCountForTan100(data,ctx,h);

    var hasMedian=(ctx.tanM.indexOf(h)>=0||ctx.nishaM.indexOf(h)>=0||ctx.wideM.indexOf(h)>=0||ctx.sanM.indexOf(h)>=0||ctx.pseudoAM.indexOf(h)>=0||ctx.pseudoBM.indexOf(h)>=0||ctx.pseudoCM.indexOf(h)>=0);
    var hasPseudo=(ctx.pseudoAM.indexOf(h)>=0||ctx.pseudoBM.indexOf(h)>=0||ctx.pseudoCM.indexOf(h)>=0||pairInTop(ctx.pseudoA.row,h,4)||pairInTop(ctx.pseudoB.row,h,4));
    var hasWide=(ctx.wideM.indexOf(h)>=0||pairInTop(ctx.pseudoCRow,h,5));
    var wallOK=(sig.zone===1||sig.zone===0);

    if(!hasMedian||!hasPseudo||!hasWide||!wallOK)continue;
    if(sc<35 && sig.count<6)continue;

    var pt=sc + sig.count*3;
    if(sig.zone===1)pt+=12;
    if(od>=8&&od<=15)pt+=8;
    if(od>15&&od<=30)pt+=10;
    if(od>30)pt-=4;

    var label=(od<=15?"🔥オート単勝案件":"🚀オート単勝保険案件");
    out.push({h:h,tan:od,score:Math.round(pt),baseScore:sc,label:label,zone:sig.zone,reasons:sig.reasons.slice(0,8)});
  }
  out.sort(function(a,b){
    if(b.score!==a.score)return b.score-a.score;
    return Number(a.tan)-Number(b.tan);
  });
  return out.slice(0,4);
}
function renderTan100Card(ctx){
  var items=ctx.tan100||[];
  var html='<div class="card tan100"><div class="title">💴単勝100円保険</div>';
  if(!items.length){
    html+='該当なし<br><span class="small">単勝だけで黒字化を狙うほどの重なりは弱めです。</span></div>';
    return html;
  }
  html+='<span class="small">単勝は厚張りではなく100円置き。的中時に浜松1R・浜松9Rみたいに全体を黒字化する保険です。</span><hr>';
  for(var i=0;i<items.length;i++){
    var x=items[i];
    html+='<div class="rankLine"><span class="badge">'+(i+1)+'位 '+x.h+'号車</span> ';
    html+='<span class="yellow">'+x.label+'</span> <span class="small">単'+x.tan+' / 指数'+x.score+'　'+x.reasons.join('・')+'</span></div>';
  }
  html+='</div>';
  return html;
}

function detectTateAndNoFav(data,ctx){
  var out={tate:null,tateRatio:null,tatePair:null,noFavSan:null,noFavRank:null,red:false};
  var fav=ctx.fav1;
  var nr=ctx.nishaRank;
  if(fav&&nr.length>=2){
    var favPairs=[];
    for(var i=0;i<nr.length;i++){
      if(nr[i].a===fav||nr[i].b===fav)favPairs.push(nr[i]);
      if(favPairs.length>=2)break;
    }
    if(favPairs.length>=2){
      var o1=favPairs[0].a===fav?favPairs[0].b:favPairs[0].a;
      var o2=favPairs[1].a===fav?favPairs[1].b:favPairs[1].a;
      var tp=findPair(data.nisha,o1,o2);
      out.tate=[o1,o2];
      out.tatePair=tp;
      if(tp&&nr[0])out.tateRatio=Number(tp.od)/Number(nr[0].od);
    }
  }
  for(var s=0;s<ctx.sanRank.length;s++){
    var t=ctx.sanRank[s],hs=[t.a,t.b,t.c];
    if(hs.indexOf(fav)<0){
      out.noFavSan=t;
      out.noFavRank=s+1;
      break;
    }
  }
  var favObj=ctx.tanRank[0];
  if(favObj && Number(favObj.od)<=1.2 && out.tateRatio && out.tateRatio<4 && out.noFavSan && out.noFavRank<=6 && Number(out.noFavSan.od)<=15){
    out.red=true;
  }
  return out;
}


function makeAreDiag(data,ctx){
  var n1=ctx.nishaRank[0]?Number(ctx.nishaRank[0].od):null;
  var surface="判定不可",surfaceClass="good";
  if(n1!==null){
    if(n1<4){surface="本命戦";surfaceClass="good";}
    else if(n1<9){surface="中荒れ戦";surfaceClass="yellow";}
    else if(n1<15){surface="荒れ戦";surfaceClass="orange";}
    else{surface="大荒れ戦";surfaceClass="warn";}
  }

  var favObj=ctx.tanRank[0],favOd=favObj?Number(favObj.od):null;
  var fav2Obj=ctx.tanRank[1],fav2Od=fav2Obj?Number(fav2Obj.od):null;
  var t=ctx.tate||{};
  var noFav=t.noFavSan||null;
  var noFavRank=t.noFavRank||null;
  var noFavOd=noFav?Number(noFav.od):null;
  var tateRatio=t.tateRatio||null;

  var risk=0,grounds=[];
  if(n1!==null){
    if(n1>=4&&n1<9){risk+=1;grounds.push("2車複1人気が4倍以上で中荒れ");}
    else if(n1>=9&&n1<15){risk+=2;grounds.push("2車複1人気が9倍以上で荒れ");}
    else if(n1>=15){risk+=3;grounds.push("2車複1人気が15倍以上で大荒れ");}
  }
  if(favOd!==null){
    if(favOd<=1.2){risk+=2;grounds.push("単勝1人気が1.2倍以下で過剰人気");}
    else if(favOd<=1.7){risk+=1;grounds.push("単勝1人気が1.7倍以下で頭固定危険");}
  }
  if(tateRatio!==null){
    if(tateRatio<3){risk+=2;grounds.push("タテ目倍率が3倍未満");}
    else if(tateRatio<4){risk+=1;grounds.push("タテ目倍率が4倍未満");}
    else if(tateRatio>=7){grounds.push("タテ目倍率が高く、二強残し寄り");}
  }
  if(noFav){
    if(noFavRank<=3 && noFavOd<=15){risk+=3;grounds.push("本命なし3連系が3位以内かつ15倍以内");}
    else if(noFavRank<=6 && noFavOd<=15){risk+=2;grounds.push("本命なし3連系が6位以内かつ15倍以内");}
    else if(noFavRank<=6){risk+=1;grounds.push("本命なし3連系が6位以内");}
    else{grounds.push("本命なし3連系は下位寄り");}
  }

  var first=(ctx.baseZones.zones[1]&&ctx.baseZones.zones[1].horses)||[];
  var second=(ctx.baseZones.zones[2]&&ctx.baseZones.zones[2].horses)||[];
  if(first.length>=2){risk+=1;grounds.push("第1壁後に複数車");}
  if(second.length>=1){risk+=1;grounds.push("第2壁後が存在");}

  var strongTwo = (ctx.fav1 && ctx.fav2 && favOd!==null && fav2Od!==null && favOd<=2.0 && fav2Od<=3.5);
  var noFavWeak = (!noFav || noFavRank>6 || noFavOd>15);
  var noFavVeryWeak = (!noFav || noFavRank>10 || noFavOd>=50);
  var noFavVeryStrong = (noFav && noFavRank<=3 && noFavOd<=15);
  var noFavStrong = (noFav && noFavRank<=6 && noFavOd<=15);
  var favFixedHoleMix = (favOd!==null && favOd<=1.3 && tateRatio!==null && tateRatio>=7 && noFavVeryWeak);

  var back="本線寄り";
  var backClass="good";

  if(favFixedHoleMix){
    back="本命固定＋本線×第1壁後混入";
    backClass="good";
    risk=Math.min(risk,2);
    grounds.unshift("本命1.3倍以下＋タテ目倍率7倍以上＋本命なし3連系下位 → 本命固定優先");
  }else if(strongTwo && tateRatio!==null && tateRatio>=4 && noFavWeak){
    back="二強残し＋第1壁後混入";
    backClass="yellow";
  }else if(strongTwo && first.length>=1 && !noFavVeryStrong){
    back="本命残し＋第1壁後強反応";
    backClass="yellow";
  }else if(noFavVeryStrong && tateRatio!==null && tateRatio<3){
    back="本命完全消しまで警戒";
    backClass="warn";
  }else if(noFavStrong && tateRatio!==null && tateRatio<4){
    back="本命頭飛び＋3着残し警戒";
    backClass="orange";
  }else if(risk>=7){
    back="本命完全消しまで警戒";
    backClass="warn";
  }else if(risk>=5){
    back="本命頭飛び＋3着残し警戒";
    backClass="orange";
  }else if(risk>=3){
    back="本命頭飛び警戒";
    backClass="yellow";
  }else if(risk>=1){
    back="軽いズレ注意";
    backClass="blue";
  }

  return{
    surface:surface,
    surfaceClass:surfaceClass,
    back:back,
    backClass:backClass,
    risk:risk,
    nisha1:n1,
    favOd:favOd,
    tateRatio:tateRatio,
    noFav:noFav,
    noFavRank:noFavRank,
    grounds:grounds
  };
}

  var wideRow=rankRowFromPairs(data.wide);

    baseNisha:baseNisha,baseNishaM:mid(baseNisha.row),baseZones:baseZones
  };
  ctx.tate=detectTateAndNoFav(data,ctx);

function scoreAll(data,ctx){
  var all=collectAllHorses(data),scored=[];
  var noFavHs=[];
  if(ctx.tate&&ctx.tate.noFavSan){
    noFavHs=[ctx.tate.noFavSan.a,ctx.tate.noFavSan.b,ctx.tate.noFavSan.c];
  }
  for(var i=0;i<all.length;i++){
    var h=all[i],tf=getTan(data,h),score=0,reasons=[];

    if(ctx.tanM.indexOf(h)>=0){score+=5;reasons.push("単勝メジアン");}
    if(ctx.nishaM.indexOf(h)>=0){score+=7;reasons.push("2車複メジアン");}
    if(ctx.wideM.indexOf(h)>=0){score+=7;reasons.push("ワイドメジアン");}
    if(ctx.sanM.indexOf(h)>=0){score+=8;reasons.push("3連系メジアン");}
    if(ctx.pseudoAM.indexOf(h)>=0){score+=12;reasons.push("擬似複勝Aメジアン");}
    if(ctx.pseudoBM.indexOf(h)>=0){score+=8;reasons.push("擬似複勝Bメジアン");}
    if(ctx.pseudoCM.indexOf(h)>=0){score+=8;reasons.push("擬似複勝Cメジアン");}
    if(ctx.pseudoCRow.slice(0,3).indexOf(h)>=0){score+=6;reasons.push("ワイド出現上位");}
    if(ctx.pseudoA.row.slice(0,3).indexOf(h)>=0){score+=5;reasons.push("1人気連動上位");}
    if(ctx.pseudoB.row.slice(0,3).indexOf(h)>=0){score+=4;reasons.push("2人気連動上位");}
    if(ctx.fav1===h){score+=6;reasons.push("単勝1人気");}
    if(ctx.fav2===h){score+=4;reasons.push("単勝2人気");}

    var zi=zoneIndexOf(ctx.baseZones.zones,h);
    if(zi===0){score+=3;reasons.push("2複基準本線");}
    if(zi===1){score+=10;reasons.push("2複基準第1壁後");}
    if(zi===2){score+=6;reasons.push("2複基準第2壁後");}
    if(zi>=3){reasons.push("2複基準切り寄り");}

    if(ctx.tate&&ctx.tate.red&&zi>=1&&zi<=2){score+=5;reasons.push("本命飛び壁ランプ連動");}

    if(noFavHs.indexOf(h)>=0){
      if(ctx.tate.noFavRank<=3){score+=10;reasons.push("本命なし3連系上位構成");}
      else if(ctx.tate.noFavRank<=6){score+=5;reasons.push("本命なし3連系構成");}
    }

    if(tf&&Number(tf.od)>=8&&reasons.length>=2){score+=6;reasons.push("穴寄り重複");}
    if(!tf||!isFinite(Number(tf.od))||Number(tf.od)<=0){
      var nc=countAppearTop(ctx.nishaRank,h,20), wc=countAppearTop(ctx.wideRank,h,20), sc=countAppearTop(ctx.sanRank,h,20);
      if(nc+wc+sc>=3){score+=8;reasons.push("単勝未表示・連系浮上");}
      if(sc>=2){score+=5;reasons.push("3連系複数出現");}
    }
    if(tf&&Number(tf.od)>=20&&score<24){score-=3;reasons.push("単勝20倍以上で弱め");}

    scored.push({h:h,score:score,tan:tf?tf.od:"-",reasons:reasons,zone:zi});
  }
  scored.sort(function(a,b){
    if(b.score!==a.score)return b.score-a.score;
    return safeTanSortVal(a)-safeTanSortVal(b);
  });
  return scored;
}

function makeTickets(data,ctx,scored){
  var wide=[],nisha=[],sanMain=[],sanHole=[],sanBomb=[];
  function addPairTicket(a,b){
    if(!a||!b||a===b)return;
    add(wide,pairKey(a,b));
    add(nisha,pairKey(a,b));
  }
  function addTriTo(arr,a,b,c){
    if(!a||!b||!c||a===b||a===c||b===c)return;
    add(arr,triKey(a,b,c));
  }
  function addMain(a,b,c){addTriTo(sanMain,a,b,c);}
  function addHole(a,b,c){addTriTo(sanHole,a,b,c);}
  function addBomb(a,b,c){addTriTo(sanBomb,a,b,c);}
  function zoneTop(horses,limit){
    var out=[];
    scored.forEach(function(x){
      if(horses.indexOf(x.h)>=0 && out.indexOf(x.h)<0)out.push(x.h);
    });
    return out.slice(0,limit||10);
  }
  function medianishInZone(horses,limit){
    var ms=uniq([].concat(ctx.tanM,ctx.nishaM,ctx.wideM,ctx.sanM,ctx.pseudoAM,ctx.pseudoBM,ctx.pseudoCM));
    var out=[];
    scored.forEach(function(x){
      if(horses.indexOf(x.h)>=0 && ms.indexOf(x.h)>=0 && out.indexOf(x.h)<0)out.push(x.h);
    });
    if(!out.length)out=zoneTop(horses,limit||3);
    return out.slice(0,limit||3);
  }

  var a=ctx.fav1,b=ctx.fav2;
  var z=ctx.baseZones.zones||[];
  var main=z[0]?z[0].horses:[];
  var first=z[1]?z[1].horses:[];
  var second=z[2]?z[2].horses:[];
  var mainTop=zoneTop(main,4), firstTop=zoneTop(first,5), secondTop=zoneTop(second,3);
  var firstMed=medianishInZone(first,4);
  var secondMed=medianishInZone(second,3);
  var pa=ctx.pseudoAM.slice(),pb=ctx.pseudoBM.slice();

  pa.forEach(function(h){addPairTicket(a,h);});
  pb.forEach(function(h){addPairTicket(b,h);});
  firstTop.slice(0,3).forEach(function(h){addPairTicket(a,h);});
  firstTop.slice(0,2).forEach(function(h){addPairTicket(b,h);});

  // 既存本線・二強残し
  if(ctx.sanRank[0])addMain(ctx.sanRank[0].a,ctx.sanRank[0].b,ctx.sanRank[0].c);
  // V24.8：三連系上位2点は絶対保護。飯塚6Rの4-5-7型対策。
  if(ctx.sanRank[1])addMain(ctx.sanRank[1].a,ctx.sanRank[1].b,ctx.sanRank[1].c);

  // V24.7：本命固定 × 本線1頭 × 第1壁後1頭
  // 単勝1人気が強烈で、タテ目倍率が高く、本命なし3連系が下位なら
  // 本命飛びではなく「本命固定＋本線穴＋第1壁後穴」を先に追加する。
  var favObj=getTan(data,a), favOd=favObj?Number(favObj.od):null;
  var tateRatio=(ctx.tate&&ctx.tate.tateRatio)?ctx.tate.tateRatio:null;
  var noFavRank=(ctx.tate&&ctx.tate.noFavRank)?ctx.tate.noFavRank:999;
  var noFavOd=(ctx.tate&&ctx.tate.noFavSan)?Number(ctx.tate.noFavSan.od):999;
  var favFixedMode=(favOd!==null && favOd<=1.3 && tateRatio!==null && tateRatio>=7 && (noFavRank>10 || noFavOd>=50));
  if(favFixedMode && a && main.length && first.length){
    var mf=[];
    for(var mi=0;mi<main.length;mi++){
      for(var fi=0;fi<first.length;fi++){
        var tr=findTri(data.sanren,a,main[mi],first[fi]);
        if(!tr)continue;
        var rank=999;
        for(var rr=0;rr<ctx.sanRank.length;rr++){if(ctx.sanRank[rr].key===tr.key){rank=rr+1;break;}}
        var wo=findPair(data.wide,a,first[fi]);
        var no=findPair(data.nisha,a,first[fi]);
        if(rank<=10 || Number(tr.od)<=25 || (wo&&Number(wo.od)<=10) || (no&&Number(no.od)<=20)){
          mf.push({m:main[mi],f:first[fi],od:Number(tr.od),rank:rank,key:tr.key});
        }
      }
    }
    mf.sort(function(x,y){
      if(x.rank!==y.rank)return x.rank-y.rank;
      return x.od-y.od;
    });
    mf.slice(0,5).forEach(function(x,i){
      if(i<3)addMain(a,x.m,x.f);
      else addHole(a,x.m,x.f);
    });
  }

  if(a&&b&&firstTop[0])addMain(a,b,firstTop[0]);
  if(a&&b&&firstTop[1])addMain(a,b,firstTop[1]);
  if(a&&b&&firstTop[2])addHole(a,b,firstTop[2]);

  // 第1壁後上位 × 単勝1人気 × 単勝2人気
  firstTop.slice(0,3).forEach(function(h){
    addMain(a,b,h);
  });

  // 本線ゾーン2頭 × 第1壁後1位・2位
  if(mainTop[0]&&mainTop[1]&&firstTop[0])addHole(mainTop[0],mainTop[1],firstTop[0]);
  if(mainTop[0]&&mainTop[1]&&firstTop[1])addHole(mainTop[0],mainTop[1],firstTop[1]);

  // 基準車 × 本線 × 第1壁後
  if(a&&mainTop[0]&&firstTop[0])addMain(a,mainTop[0],firstTop[0]);
  if(a&&mainTop[0]&&firstTop[1])addHole(a,mainTop[0],firstTop[1]);
  if(a&&mainTop[1]&&firstTop[0])addHole(a,mainTop[1],firstTop[0]);

  // 第2壁後保険：基準 × 第1壁後メジアン持ち × 第2壁後
  if(secondTop[0]){
    firstMed.slice(0,3).forEach(function(h){addBomb(a,h,secondTop[0]);});
    if(mainTop[0])addBomb(mainTop[0],firstMed[0],secondTop[0]);
  }

  // 危険本命3着残し：基準車 + 第1壁後2頭
  if(ctx.areDiag && (ctx.areDiag.risk>=5 || (ctx.tate&&ctx.tate.noFavRank<=3))){
    for(var i=0;i<Math.min(4,firstTop.length);i++){
      for(var j=i+1;j<Math.min(4,firstTop.length);j++){
        addBomb(a,firstTop[i],firstTop[j]);
      }
    }
  }

  // 本命なし3連系が上位なら保険で追加
  if(ctx.tate&&ctx.tate.noFavSan){
    if(ctx.tate.noFavRank<=3)addHole(ctx.tate.noFavSan.a,ctx.tate.noFavSan.b,ctx.tate.noFavSan.c);
    else if(ctx.tate.noFavRank<=6)addBomb(ctx.tate.noFavSan.a,ctx.tate.noFavSan.b,ctx.tate.noFavSan.c);
  }

  // タテ目相手2頭＋基準車
  if(ctx.tate&&ctx.tate.tate&&a)addHole(a,ctx.tate.tate[0],ctx.tate.tate[1]);

  // 1〜2位候補の強制合成
  var strong=scored.slice(0,3).map(function(x){return x.h;});
  // V24.8：検証候補1位×単勝1人気×単勝2人気を本線保護。
  // 飯塚6R 7-4-5の4-5-7を落とさない。
  if(a&&b&&strong[0]&&strong[0]!==a&&strong[0]!==b)addMain(a,b,strong[0]);
  if(a&&strong[0]&&strong[1])addHole(a,strong[0],strong[1]);
  if(b&&strong[0]&&strong[1])addBomb(b,strong[0],strong[1]);

  // V24.8：単勝未表示・連系浮上車を3着救済。
  if(ctx.hiddenFloaters&&ctx.hiddenFloaters.length){
    ctx.hiddenFloaters.forEach(function(x){
      if(x.bestTri)addBomb(x.bestTri.a,x.bestTri.b,x.bestTri.c);
      else{
        if(a&&strong[0])addBomb(a,strong[0],x.h);
        if(b&&strong[0])addBomb(b,strong[0],x.h);
      }
    });
  }

  var san=uniq([].concat(sanMain,sanHole,sanBomb)).slice(0,22);
  return{
    wide:wide.slice(0,8),
    nisha:nisha.slice(0,8),
    sanMain:sanMain.slice(0,8),
    sanHole:sanHole.slice(0,8),
    sanBomb:sanBomb.slice(0,8),
    san:san
  };
}


function makePseudoPairsText(p){
  if(!p||!p.pairs||!p.pairs.length)return "なし";
  return p.pairs.slice(0,8).map(function(x){
    var other=x.a===p.anchor?x.b:x.a;
    return p.anchor+"-"+other+" "+x.od;
  }).join("\n");
}

function run(){
  try{
    var data=parseData(document.getElementById("input").value);
    var out=document.getElementById("out");
    if(!data.tansho.length||!data.wide.length){
      out.innerHTML='<div class="card"><div class="title warn">入力不足</div>[TANSHO] と [WIDE] が必要です。2車複・3連系はあれば精度が上がります。</div>';
      return;
    }
    var ctx=makeContext(data);
    var scored=scoreAll(data,ctx);
    ctx.hiddenFloaters=detectHiddenFloaters(data,ctx,scored);
    ctx.tan100=detectTan100Insurance(data,ctx,scored);
    var tickets=makeTickets(data,ctx,scored);

    var lamps=[];
    lamps.push("🧪オート擬似複勝テスト：A="+joinC(ctx.pseudoAM)+" / B="+joinC(ctx.pseudoBM)+" / C="+joinC(ctx.pseudoCM));
    var overlapA=ctx.tanM.filter(function(h){return ctx.pseudoAM.indexOf(h)>=0;});
    if(overlapA.length)lamps.push("🔥単勝×擬似複勝Aメジアン重複："+joinC(overlapA));
    var overlapW=ctx.wideM.filter(function(h){return ctx.pseudoAM.indexOf(h)>=0||ctx.pseudoBM.indexOf(h)>=0;});
    if(overlapW.length)lamps.push("🟣ワイド×擬似複勝メジアン重複："+joinC(overlapW));
    if(ctx.baseZones&&ctx.baseZones.zones&&ctx.baseZones.zones.length>1)lamps.push("🧱2複基準壁ゾーン：本線 "+joinC(ctx.baseZones.zones[0].horses)+" / 第1壁後 "+joinC(ctx.baseZones.zones[1].horses)+" / 第2壁後 "+joinC(ctx.baseZones.zones[2]?ctx.baseZones.zones[2].horses:[]));
    if(ctx.tate&&ctx.tate.red)lamps.push("🚨オート本命飛び壁ランプ：タテ目倍率 "+ctx.tate.tateRatio.toFixed(2)+" / 本命なし3連系 "+ctx.tate.noFavSan.key+" "+ctx.tate.noFavSan.od+"倍");
    if(scored[0]&&scored[0].score>=30)lamps.push("🚨擬似複勝テスト強反応："+scored[0].h+"号車【"+scored[0].score+"】");
    if(ctx.tan100&&ctx.tan100.length)lamps.push("💴単勝100円保険："+ctx.tan100.map(function(x){return x.h+"号車 単"+x.tan;}).join("・"));
    if(ctx.hiddenFloaters&&ctx.hiddenFloaters.length)lamps.push("🫥単勝未表示・連系浮上3着救済："+ctx.hiddenFloaters.map(function(x){return x.h+"号車"+(x.bestTri?"（"+x.bestTri.key+"）":"");}).join("・"));

    var html='';
    html+='<div class="card"><div class="title">'+data.title+'</div>';
    html+='単勝1人気：<span class="yellow">'+(ctx.tanRank[0]?ctx.tanRank[0].h+"号車 "+ctx.tanRank[0].od+"倍":"なし")+'</span><br>';
    html+='単勝2人気：<span class="yellow">'+(ctx.tanRank[1]?ctx.tanRank[1].h+"号車 "+ctx.tanRank[1].od+"倍":"なし")+'</span><br>';
    html+='2車複1人気：<span class="yellow">'+(ctx.nishaRank[0]?ctx.nishaRank[0].key+" "+ctx.nishaRank[0].od+"倍":"なし")+'</span><br>';
    html+='ワイド1人気：<span class="yellow">'+(ctx.wideRank[0]?ctx.wideRank[0].key+" "+ctx.wideRank[0].od+"倍":"なし")+'</span><br>';
    html+='3連系1人気：<span class="yellow">'+(ctx.sanRank[0]?ctx.sanRank[0].key+" "+ctx.sanRank[0].od+"倍":"なし")+'</span>';
    html+='</div>';

    html+=renderAreDiag(ctx);

    html+='<div class="card lamp"><div class="title">発動・テストランプ</div>'+lamps.join('<br>')+'<hr>';
    html+='<span class="small">V24.8では、三連系上位2点保護、検証候補1位×単勝1・2人気合成、単勝未表示の連系浮上3着救済を追加しています。</span></div>';

    if(ctx.tate&&ctx.tate.red){
      html+='<div class="card lampRed"><div class="title">🚨本命飛び壁ランプ</div>';
      html+='タテ目：<span class="yellow">'+ctx.tate.tate.join('-')+'</span> / 倍率 <span class="yellow">'+ctx.tate.tateRatio.toFixed(2)+'</span><br>';
      html+='本命なし3連系：<span class="yellow">'+ctx.tate.noFavRank+'位 '+ctx.tate.noFavSan.key+' '+ctx.tate.noFavSan.od+'倍</span>';
      html+='</div>';
    }

    html+=makeZoneCard(ctx);
    html+=renderTan100Card(ctx);
    if(ctx.hiddenFloaters&&ctx.hiddenFloaters.length){
      html+='<div class="card lamp"><div class="title">🫥単勝未表示・連系浮上3着救済</div>';
      ctx.hiddenFloaters.forEach(function(x,i){
        html+='<div class="rankLine"><span class="badge">'+(i+1)+'位 '+x.h+'号車</span> <span class="small">2車複出現'+x.nisha+' / ワイド出現'+x.wide+' / 3連系出現'+x.san+(x.bestTri?' / 注目3連系 '+x.bestRank+'位 '+x.bestTri.key+' '+x.bestTri.od+'倍':'')+'</span></div>';
      });
      html+='</div>';
    }
    html+=makeHonpyo(ctx);

    html+='<div class="card"><div class="title">🧪擬似複勝の中身</div>';
    html+='<b>A：単勝1人気 '+ctx.fav1+'号車からのワイド相手順</b><pre>'+makePseudoPairsText(ctx.pseudoA)+'</pre>';
    html+='<b>B：単勝2人気 '+ctx.fav2+'号車からのワイド相手順</b><pre>'+makePseudoPairsText(ctx.pseudoB)+'</pre>';
    html+='<b>C：ワイド上位10点の出現回数</b><pre>'+ctx.pseudoC.slice(0,8).map(function(x){return x.h+"号車 出現"+x.count+"回 / 最安"+x.best;}).join("\n")+'</pre>';
    html+='</div>';

    html+='<div class="card"><div class="title">👑検証候補ランキング</div>';
    for(var i=0;i<Math.min(8,scored.length);i++){
      var x=scored[i];
      html+='<div class="rankLine"><span class="badge">'+(i+1)+'位 '+x.h+'号車【'+x.score+'】</span> ';
      html+='<span class="small">単'+x.tan+'　'+x.reasons.join('・')+'</span></div>';
    }
    html+='</div>';

    html+='<div class="card lamp2"><div class="title">💰テスト買い目候補</div><pre>';
    html+='※V24.8：本線 / 穴本線 / 大荒れ保険 / 単勝100円保険に分けて表示します。\n\n';
    html+='ワイド\n'+(tickets.wide.length?tickets.wide.join('\n'):'なし')+'\n\n';
    html+='2車複\n'+(tickets.nisha.length?tickets.nisha.join('\n'):'なし')+'\n\n';
    html+='3連系・本線\n'+(tickets.sanMain.length?tickets.sanMain.join('\n'):'なし')+'\n\n';
    html+='3連系・穴本線\n'+(tickets.sanHole.length?tickets.sanHole.join('\n'):'なし')+'\n\n';
    html+='3連系・大荒れ保険\n'+(tickets.sanBomb.length?tickets.sanBomb.join('\n'):'なし')+'\n\n';
    html+='単勝100円保険\n'+(ctx.tan100&&ctx.tan100.length?ctx.tan100.map(function(x){return x.h+'　単'+x.tan+'　'+x.label;}).join('\n'):'なし');
    html+='</pre></div>';

    out.innerHTML=html;
    latestCopyText=makeCopyText(data.title,ctx,scored,tickets,lamps);
  }catch(e){
    document.getElementById("out").innerHTML='<div class="card"><div class="title warn">エラー</div><pre>'+String(e&&e.message?e.message:e)+'</pre></div>';
  }
}

function makeCopyText(title,ctx,scored,tickets,lamps){
  var t='';
  t+=title+'\n';
  t+='オート擬似複勝テスト版 V24.8\n';
  t+='発動：'+lamps.join(' / ')+'\n\n';

  var z=ctx.baseZones.zones||[];
  t+='🩺オート荒れ診断\n';
  t+='表面：'+ctx.areDiag.surface+'\n';
  t+='裏診断：'+ctx.areDiag.back+'\n';
  if(ctx.areDiag.back.indexOf('本命固定')>=0)t+='👑本命固定×本線×第1壁後補正 発動\n';
  t+='荒れ警戒スコア：'+ctx.areDiag.risk+'\n';
  if(ctx.areDiag.tateRatio!==null)t+='タテ目倍率：'+ctx.areDiag.tateRatio.toFixed(2)+'\n';
  if(ctx.areDiag.noFav)t+='本命なし3連系：'+ctx.areDiag.noFavRank+'位 '+ctx.areDiag.noFav.key+' '+ctx.areDiag.noFav.od+'倍\n';
  t+='\n';

  t+='2複基準壁ゾーン\n';
  t+='基準：'+ctx.fav1+'号車\n';
  for(var i=0;i<Math.min(4,z.length);i++)t+=z[i].label+'：'+joinC(z[i].horses)+'\n';
  t+='壁：\n'+fmtWallDetails(ctx.baseZones)+'\n\n';

  t+='擬似複勝A：単勝1人気 '+ctx.fav1+'号車から\n'+joinC(ctx.pseudoA.row)+'\n';
  t+='擬似複勝Aメジアン：'+joinC(ctx.pseudoAM)+'\n';
  t+='擬似複勝B：単勝2人気 '+ctx.fav2+'号車から\n'+joinC(ctx.pseudoB.row)+'\n';
  t+='擬似複勝Bメジアン：'+joinC(ctx.pseudoBM)+'\n';
  t+='擬似複勝C：ワイド出現回数\n'+joinC(ctx.pseudoCRow)+'\n';
  t+='擬似複勝Cメジアン：'+joinC(ctx.pseudoCM)+'\n\n';

  t+='メジアン\n';
  t+='単勝：'+joinC(ctx.tanM)+'\n';
  t+='2車複：'+joinC(ctx.nishaM)+'\n';
  t+='ワイド：'+joinC(ctx.wideM)+'\n';
  t+='3連系：'+joinC(ctx.sanM)+'\n\n';

  if(ctx.tan100&&ctx.tan100.length){
    t+='単勝100円保険\n';
    for(var ti=0;ti<ctx.tan100.length;ti++){
      var tx=ctx.tan100[ti];
      t+=tx.h+'号車 単'+tx.tan+' '+tx.label+' '+tx.reasons.join('・')+'\n';
    }
    t+='\n';
  }
  if(ctx.hiddenFloaters&&ctx.hiddenFloaters.length){
    t+='単勝未表示・連系浮上3着救済\n';
    for(var hi=0;hi<ctx.hiddenFloaters.length;hi++){
      var hx=ctx.hiddenFloaters[hi];
      t+=hx.h+'号車 '+(hx.bestTri?hx.bestRank+'位 '+hx.bestTri.key+' '+hx.bestTri.od+'倍':'連系浮上')+'\n';
    }
    t+='\n';
  }

  t+='検証候補\n';
  for(var i=0;i<Math.min(5,scored.length);i++){
    t+=(i+1)+'位 '+scored[i].h+'号車【'+scored[i].score+'】 単'+scored[i].tan+' '+scored[i].reasons.join('・')+'\n';
  }
  t+='\nテスト買い目候補\n';
  t+='ワイド\n'+tickets.wide.join('\n')+'\n\n';
  t+='2車複\n'+tickets.nisha.join('\n')+'\n\n';
  t+='3連系・本線\n'+tickets.sanMain.join('\n')+'\n\n';
  t+='3連系・穴本線\n'+tickets.sanHole.join('\n')+'\n\n';
  t+='3連系・大荒れ保険\n'+tickets.sanBomb.join('\n')+'\n\n';
  t+='単勝100円保険\n'+((ctx.tan100&&ctx.tan100.length)?ctx.tan100.map(function(x){return x.h+' 単'+x.tan;}).join('\n'):'なし')+'\n';
  return t;
}

function copyResult(){
  if(!latestCopyText){alert("先に解析してください");return;}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(latestCopyText).then(function(){alert("結果をコピーしました");}).catch(function(){fallbackCopy(latestCopyText);});
  }else{fallbackCopy(latestCopyText);}
}
function fallbackCopy(text){
  var ta=document.createElement("textarea");
  ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);
  alert("結果をコピーしました");
}
