<script>
var latestCopyText='';
function zenToHan(str){return String(str||'').replace(/[０-９]/g,function(s){return String.fromCharCode(s.charCodeAt(0)-65248);}).replace(/．/g,'.').replace(/[－ー―−]/g,'-').replace(/[　]/g,' ').replace(/[〜～]/g,'-');}
function nums(line){var m=zenToHan(line).match(/\d+(?:\.\d+)?/g);return m?m.map(Number):[];}
function pairKey(a,b){return [a,b].map(String).sort(function(x,y){return Number(x)-Number(y);}).join('-');}
function triKey(a,b,c){return [a,b,c].map(String).sort(function(x,y){return Number(x)-Number(y);}).join('-');}
function add(arr,v){v=String(v);if(v&&v!=='undefined'&&arr.indexOf(v)<0)arr.push(v);}
function uniq(arr){var out=[];(arr||[]).forEach(function(v){add(out,v);});return out;}
function sortOdds(arr){return arr.slice().sort(function(a,b){return Number(a.od)-Number(b.od);});}
function safeNum(x,d){x=Number(x);return isFinite(x)?x:(d===0?0:(d||9999));}
function mid(arr){arr=arr||[];if(!arr.length)return[];var n=arr.length;if(n%2)return[arr[Math.floor(n/2)]];return[arr[n/2-1],arr[n/2]];}
function joinCars(arr){return (!arr||!arr.length)?'なし':arr.map(function(x){return x+'号車';}).join('・');}
function rankMap(row){var m={};row.forEach(function(h,i){m[h]=i+1;});return m;}
function getTan(data,h){h=String(h);for(var i=0;i<data.tan.length;i++){if(data.tan[i].h===h)return data.tan[i].od;}return null;}
function addP(arr,a,b){if(a&&b&&a!==b)add(arr,pairKey(a,b));}
function addT(arr,a,b,c){if(a&&b&&c&&a!==b&&a!==c&&b!==c)add(arr,triKey(a,b,c));}
function containsPair(p,h){return p.a===h||p.b===h;}
function otherInPair(p,h){return p.a===h?p.b:(p.b===h?p.a:null);}
function countTop(list,h,n){h=String(h);var c=0;(list||[]).slice(0,n||20).forEach(function(x){if(x.a===h||x.b===h||x.c===h)c++;});return c;}
function bestRank(list,h,n){h=String(h);for(var i=0;i<Math.min(n||20,list.length);i++){var x=list[i];if(x.a===h||x.b===h||x.c===h)return i+1;}return 999;}
function pairRow(pairs){var row=[];sortOdds(pairs).forEach(function(p){add(row,p.a);add(row,p.b);});return row;}
function triRow(tris){var row=[];sortOdds(tris).forEach(function(t){add(row,t.a);add(row,t.b);add(row,t.c);});return row;}
function findTri(list,key){for(var i=0;i<list.length;i++){if(list[i].key===key)return list[i];}return null;}
function parseData(raw){
  var text=zenToHan(raw),lines=text.split(/\n/),title='レース',sec='';
  var info=[],handi=[],tan=[],nisha=[],wide=[],san=[];
  for(var i=0;i<lines.length;i++){
    var line=lines[i].trim();if(!line)continue;if(line.indexOf('【')===0)title=line;var up=line.toUpperCase();
    if(up.indexOf('[')===0){
      if(up.indexOf('INFO')>=0){sec='INFO';continue;} if(up.indexOf('HAND')>=0||up.indexOf('HND')>=0){sec='HANDI';continue;} if(up.indexOf('TAN')>=0||up.indexOf('単')>=0){sec='TAN';continue;}
      if(up.indexOf('NIS')>=0||up.indexOf('NIR')>=0||up.indexOf('2')>=0||up.indexOf('二')>=0){sec='NISHA';continue;} if(up.indexOf('WIDE')>=0||up.indexOf('ワイド')>=0){sec='WIDE';continue;} if(up.indexOf('SAN')>=0||up.indexOf('3')>=0||up.indexOf('三')>=0){sec='SAN';continue;}
    }
    if(sec==='INFO'||sec==='HANDI'){var n=nums(line);if(n.length>=2)(sec==='INFO'?info:handi).push({h:String(Math.floor(n[0])),handi:n[1],test:n.length>=3?n[2]:null,st:n.length>=4?n[3]:null,rank:n.length>=5?n[4]:null});}
    else if(sec==='TAN'){var nt=nums(line);if(nt.length>=2)tan.push({h:String(Math.floor(nt[0])),od:nt[1]});}
    else if(sec==='NISHA'){var m=line.match(/(\d+)\s*-\s*(\d+)/),o=nums(line);if(m&&o.length)nisha.push({a:m[1],b:m[2],od:o[o.length-1],key:pairKey(m[1],m[2])});}
    else if(sec==='WIDE'){var mw=line.match(/(\d+)\s*-\s*(\d+)/),ow=nums(line);if(mw&&ow.length&&ow[ow.length-1]>0)wide.push({a:mw[1],b:mw[2],od:ow[ow.length-1],key:pairKey(mw[1],mw[2])});}
    else if(sec==='SAN'){var ms=line.match(/(\d+)\s*-\s*(\d+)\s*-\s*(\d+)/),os=nums(line);if(ms&&os.length)san.push({a:ms[1],b:ms[2],c:ms[3],od:os[os.length-1],key:triKey(ms[1],ms[2],ms[3])});}
  }
  var map={};handi.forEach(function(x){map[x.h]=x;});info.forEach(function(x){map[x.h]=x;});var inf=[];Object.keys(map).sort(function(a,b){return Number(a)-Number(b);}).forEach(function(h){inf.push(map[h]);});
  return{title:title,info:inf,tan:tan,nisha:nisha,wide:wide,san:san};
}
function validateCars(data){var valid={};data.tan.forEach(function(x){valid[x.h]=true;});if(!Object.keys(valid).length)data.info.forEach(function(x){valid[x.h]=true;});var bad=[];function ck(h,src){if(!valid[h])bad.push(src+'に存在しない車番 '+h+'号車');}data.nisha.forEach(function(p){ck(p.a,'2車複');ck(p.b,'2車複');});data.wide.forEach(function(p){ck(p.a,'ワイド');ck(p.b,'ワイド');});data.san.forEach(function(t){ck(t.a,'3連系');ck(t.b,'3連系');ck(t.c,'3連系');});return uniq(bad);}
function makeHandiGroups(data){var info=data.info.slice();if(!info.length)return{front:[],mid:[],heavy:[],desc:'ハンデ情報なし'};var vals=info.map(function(x){return x.handi;}).sort(function(a,b){return a-b;});var min=vals[0],max=vals[vals.length-1],front=[],mid=[],heavy=[];info.forEach(function(x){if(x.handi===min)add(front,x.h);else if(x.handi===max)add(heavy,x.h);else add(mid,x.h);});return{front:front,mid:mid,heavy:heavy,desc:'前 '+joinCars(front)+' / 中 '+joinCars(mid)+' / 重 '+joinCars(heavy)};}
function partnerRowFor(car,pairs){var out=[];sortOdds(pairs).forEach(function(p){if(containsPair(p,car))add(out,otherInPair(p,car));});return out;}
function wideCountRow(data){var counts={},best={};sortOdds(data.wide).slice(0,20).forEach(function(p,i){[p.a,p.b].forEach(function(h){counts[h]=(counts[h]||0)+1;if(best[h]===undefined)best[h]=i+1;});});return Object.keys(counts).sort(function(a,b){if(counts[b]!==counts[a])return counts[b]-counts[a];return (best[a]||99)-(best[b]||99);});}
function wallZones(ctx){var fav=ctx.fav1,row=[],items=[];sortOdds(ctx.data.nisha).forEach(function(p){if(containsPair(p,fav))items.push({h:otherInPair(p,fav),od:p.od,key:p.key});});items.forEach(function(x){add(row,x.h);});var walls=[];for(var i=0;i<items.length-1;i++){var r=safeNum(items[i+1].od)/safeNum(items[i].od);if(r>=1.8)walls.push({idx:i,from:items[i],to:items[i+1],ratio:r});}var line=[],w1=[],w2=[],cut=[];if(!items.length)return{base:fav,line:[],w1:[],w2:[],cut:[],walls:[]};if(!walls.length){line=row.slice(0,4);w1=row.slice(4,6);w2=row.slice(6,8);cut=row.slice(8);}else{var a=walls[0].idx+1,b=walls[1]?walls[1].idx+1:Math.min(a+1,row.length),c=walls[2]?walls[2].idx+1:Math.min(b+2,row.length);line=row.slice(0,a);w1=row.slice(a,b);w2=row.slice(b,c);cut=row.slice(c);}return{base:fav,line:line,w1:w1,w2:w2,cut:cut,walls:walls,items:items};}
function makeContext(data){var tanRank=sortOdds(data.tan),nishaRank=sortOdds(data.nisha),wideRank=sortOdds(data.wide),sanRank=sortOdds(data.san);var tanRow=tanRank.map(function(x){return x.h;}),nishaRow=pairRow(data.nisha),wideRow=pairRow(data.wide),sanRow=triRow(data.san);var fav1=tanRank[0]?tanRank[0].h:null,fav2=tanRank[1]?tanRank[1].h:null;var ctx={data:data,tanRank:tanRank,nishaRank:nishaRank,wideRank:wideRank,sanRank:sanRank,tanRow:tanRow,nishaRow:nishaRow,wideRow:wideRow,sanRow:sanRow,fav1:fav1,fav2:fav2,tanM:mid(tanRow),nishaM:mid(nishaRow),wideM:mid(wideRow),sanM:mid(sanRow),handi:makeHandiGroups(data)};ctx.pseudoA=partnerRowFor(fav1,data.nisha);ctx.pseudoB=partnerRowFor(fav2,data.nisha);ctx.pseudoC=wideCountRow(data);ctx.pseudoAM=mid(ctx.pseudoA);ctx.pseudoBM=mid(ctx.pseudoB);ctx.pseudoCM=mid(ctx.pseudoC);ctx.wall=wallZones(ctx);return ctx;}
function pairOdd(list,a,b){var k=pairKey(a,b);for(var i=0;i<(list||[]).length;i++){if(list[i].key===k)return list[i].od;}return null;}
function pairRank(list,a,b){var k=pairKey(a,b),s=sortOdds(list||[]);for(var i=0;i<s.length;i++){if(s[i].key===k)return i+1;}return 999;}
function triOdd(ctx,key){var t=findTri(ctx.sanRank,key);return t?t.od:null;}
function hasCar(arr,h){return (arr||[]).indexOf(String(h))>=0;}
function isPseudoMedian(ctx,h){return hasCar(ctx.pseudoAM,h)||hasCar(ctx.pseudoBM,h)||hasCar(ctx.pseudoCM,h);}
function pseudoCount(ctx,h){var c=0;if(hasCar(ctx.pseudoAM,h))c++;if(hasCar(ctx.pseudoBM,h))c++;if(hasCar(ctx.pseudoCM,h))c++;return c;}
function medianCount(ctx,h){var c=0;if(hasCar(ctx.tanM,h))c++;if(hasCar(ctx.nishaM,h))c++;if(hasCar(ctx.wideM,h))c++;if(hasCar(ctx.sanM,h))c++;if(isPseudoMedian(ctx,h))c++;return c;}
function isAnyMedian(ctx,h){return medianCount(ctx,h)>0;}
function scoreAll(ctx){var all=[];ctx.tanRow.forEach(function(h){add(all,h);});ctx.nishaRow.forEach(function(h){add(all,h);});ctx.wideRow.forEach(function(h){add(all,h);});ctx.sanRow.forEach(function(h){add(all,h);});var out=[];all.forEach(function(h){var score=0,re=[];function hit(arr,pt,txt){if(hasCar(arr,h)){score+=pt;re.push(txt);}}hit(ctx.tanM,10,'単勝メジアン');hit(ctx.nishaM,11,'2車複メジアン');hit(ctx.wideM,10,'ワイドメジアン');hit(ctx.sanM,10,'3連系メジアン');hit(ctx.pseudoAM,9,'擬似複勝Aメジアン');hit(ctx.pseudoBM,9,'擬似複勝Bメジアン');hit(ctx.pseudoCM,8,'擬似複勝Cメジアン');hit(ctx.wall.line,8,'2複基準本線');hit(ctx.wall.w1,8,'第1壁後');hit(ctx.wall.w2,6,'第2壁後');if(hasCar(ctx.handi.front,h)){score+=8;re.push('前ハンデ候補');}if(hasCar(ctx.handi.heavy,h)){score+=5;re.push('重ハンデ候補');}if(h===ctx.fav1){score+=8;re.push('単勝1人気');}if(h===ctx.fav2){score+=8;re.push('単勝2人気');}var topS=countTop(ctx.sanRank,h,10),topW=countTop(ctx.wideRank,h,12),topN=countTop(ctx.nishaRank,h,10);if(topS>=2){score+=8;re.push('3連系上位出現'+topS+'回');}if(topW>=2){score+=7;re.push('ワイド上位出現'+topW+'回');}if(topN>=2){score+=6;re.push('2車複上位出現'+topN+'回');}var od=safeNum(getTan(ctx.data,h));if(od>=5&&od<=25&&score>=38){score+=8;re.push('単勝100円保険候補');}if(od>40&&pairRank(ctx.nishaRank,ctx.fav1,h)<=2){score+=22;re.push('V24.16単勝40倍超でも本命2車複2位以内で格上げ');}else if(od>40&&score<50){score-=5;re.push('単勝40倍超は3着穴寄り');}out.push({h:h,score:Math.round(score),tan:od,reason:re,sanBest:bestRank(ctx.sanRank,h,12)});});out.sort(function(a,b){if(b.score!==a.score)return b.score-a.score;return safeNum(a.tan)-safeNum(b.tan);});return out;}
function makeDiag(ctx){var fav=safeNum(ctx.tanRank[0]?ctx.tanRank[0].od:null),top2=safeNum(ctx.tanRank[1]?ctx.tanRank[1].od:null);var surface='判定不可',risk=0,back='通常';if(fav<=1.8){surface='本命戦';risk+=1;}else if(fav<=3){surface='中荒れ戦';risk+=2;}else{surface='荒れ戦';risk+=3;}if(top2/fav>=3){risk+=2;back='本命頭飛び警戒';}if(ctx.wall.w1.length>=2){risk+=1;if(back==='通常')back='本命残し＋第1壁後混入';}var noFavTri=ctx.sanRank.filter(function(t){return t.a!==ctx.fav1&&t.b!==ctx.fav1&&t.c!==ctx.fav1;})[0]||null;if(noFavTri&&safeNum(noFavTri.od)<=25){risk+=1;back='本命頭飛び警戒';}return{surface:surface,risk:risk,back:back,noFavTri:noFavTri};}
function makeProtections(ctx,score){var p=[];var top=score[0]?score[0].h:null;ctx.sanRank.forEach(function(t){if(top&&(t.a===top||t.b===top||t.c===top)&&safeNum(t.od)<=25)addT(p,t.a,t.b,t.c);});ctx.handi.front.forEach(function(fh){addT(p,ctx.fav1,ctx.fav2,fh);});ctx.wall.line.forEach(function(lh){ctx.handi.front.forEach(function(fh){addT(p,ctx.fav1,lh,fh);});});var hs=ctx.handi.heavy.map(Number).sort(function(a,b){return a-b;});for(var i=0;i<hs.length-2;i++){if(hs[i+2]-hs[i]===2)addT(p,String(hs[i]),String(hs[i+1]),String(hs[i+2]));}ctx.wall.line.forEach(function(h){addT(p,ctx.fav1,h,top);});return uniq(p).slice(0,20);}
function makeTickets(ctx,score,prot){var wide=[],nisha=[],main=[],hole=[],bomb=[];function addBoth(a,b){addP(wide,a,b);addP(nisha,a,b);}ctx.sanRank.slice(0,7).forEach(function(t){addT(main,t.a,t.b,t.c);});prot.slice(0,7).forEach(function(k){var a=k.split('-');addT(main,a[0],a[1],a[2]);});prot.slice(7,15).forEach(function(k){var a=k.split('-');addT(hole,a[0],a[1],a[2]);});score.slice(0,6).forEach(function(x){addBoth(ctx.fav1,x.h);addBoth(ctx.fav2,x.h);});return{wide:uniq(wide).slice(0,10),nisha:uniq(nisha).slice(0,10),main:uniq(main).slice(0,12),hole:uniq(hole).slice(0,12),bomb:uniq(bomb).slice(0,12)};}
function reasonText(x){return (x&&x.reason)?x.reason.join(' '):'';}function reasonHas(x,w){return reasonText(x).indexOf(w)>=0;}function ultraFav(ctx){return ctx.fav1&&safeNum(ctx.tanRank[0]?ctx.tanRank[0].od:null,999)<=1.2;}function scoreObj(score,h){h=String(h);for(var i=0;i<score.length;i++){if(score[i].h===h)return score[i];}return{h:h,score:0,tan:safeNum(getTan({tan:[]},h)),reason:[]};}
function completeTan1000(ctx,score,diag){var A=score[0];if(!A)return null;var h=A.h,od=safeNum(A.tan);if(h===ctx.fav1)return null;if(A.score<70)return null;if(od<6||od>18)return null;if(diag.back.indexOf('本命頭飛び警戒')<0)return null;if(!reasonHas(A,'単勝メジアン'))return null;if(!reasonHas(A,'2車複メジアン'))return null;if(!reasonHas(A,'擬似複勝'))return null;if(!reasonHas(A,'2複基準本線'))return null;if(!reasonHas(A,'前ハンデ候補'))return null;return A;}

// ===== V24.17 川口1R 4-8-5対応：前位置対抗頭昇格＋中穴頭過大評価カット =====
function infoObj(ctx,h){h=String(h);for(var i=0;i<(ctx.data.info||[]).length;i++){if(ctx.data.info[i].h===h)return ctx.data.info[i];}return null;}
function tanRankNo(ctx,h){h=String(h);for(var i=0;i<ctx.tanRank.length;i++){if(ctx.tanRank[i].h===h)return i+1;}return 999;}
function isAheadOf(ctx,h,target){var a=infoObj(ctx,h),b=infoObj(ctx,target);if(!a||!b)return false;return safeNum(a.handi,999)<safeNum(b.handi,999);}
function isGoodTrialSameGroup(ctx,h){var o=infoObj(ctx,h);if(!o||o.test===null||o.test===undefined)return false;var same=(ctx.data.info||[]).filter(function(x){return x.test!==null&&x.test!==undefined&&safeNum(x.handi)===safeNum(o.handi);});if(!same.length)return false;var mn=9999;same.forEach(function(x){mn=Math.min(mn,safeNum(x.test,9999));});return safeNum(o.test,9999)<=mn+0.03;}

function findUltraLongPair(ctx,score){if(!ultraFav(ctx))return null;var arr=[];score.forEach(function(x){var h=x.h,od=safeNum(x.tan);if(h===ctx.fav1)return;var pr=pairRank(ctx.nishaRank,ctx.fav1,h);if(od>=40&&pr<=2){var s=80-pr*10+x.score;if(hasCar(ctx.wall.line,h))s+=20;if(countTop(ctx.sanRank,h,12)>=2)s+=10;arr.push({h:h,score:s,rank:pr,tan:od,reason:x.reason});}});arr.sort(function(a,b){return b.score-a.score;});return arr[0]||null;}

function bestPartner(ctx,score,used,preferTanMed){used=(used||[]).map(String);var pool=uniq([].concat(ctx.wall.line,ctx.wall.w1,ctx.sanM,ctx.nishaM,ctx.wideM,score.map(function(x){return x.h;})));var arr=[];pool.forEach(function(h){h=String(h);if(!h||used.indexOf(h)>=0)return;var so=scoreObj(score,h),s=Math.round(so.score/3),why=[];var pr=pairRank(ctx.nishaRank,ctx.fav1,h);if(pr===1){s+=32;why.push('本命との2車複1位');}else if(pr===2){s+=28;why.push('本命との2車複2位');}else if(pr<=4){s+=18;why.push('本命との2車複上位');}if(hasCar(ctx.wall.line,h)){s+=18;why.push('2複基準本線');}if(hasCar(ctx.tanM,h)){s+=28;why.push('単勝メジアン');}if(hasCar(ctx.nishaM,h)){s+=16;why.push('2車複メジアン');}if(hasCar(ctx.wideM,h)){s+=16;why.push('ワイドメジアン');}if(hasCar(ctx.sanM,h)){s+=18;why.push('3連系メジアン');}if(isPseudoMedian(ctx,h)){s+=12;why.push('擬似複勝メジアン');}if(hasCar(ctx.handi.front,h)){s+=10;why.push('前ハンデ');}if(hasCar(ctx.handi.heavy,h)){s+=6;why.push('重ハンデ');}if(preferTanMed&&!hasCar(ctx.tanM,h))s-=8;arr.push({h:h,score:s,why:why});});arr.sort(function(a,b){return b.score-a.score;});return arr[0]||null;}
function triScore(ctx,score,key){var a=key.split('-'),sc=0,why=[];var od=triOdd(ctx,key);if(od!==null){if(od>=4&&od<=25){sc+=16;why.push('配当効率');}else if(od<=60){sc+=8;why.push('中穴');}}if(a.indexOf(ctx.fav1)>=0){sc+=10;why.push('本命残り');}if(a.indexOf(ctx.fav2)>=0){sc+=9;why.push('単勝2人気');}var med=0;a.forEach(function(h){if(isAnyMedian(ctx,h))med++;});sc+=med*7;if(med>=2)why.push('メジアン複数');var sum=0;a.forEach(function(h){sum+=scoreObj(score,h).score;});sc+=Math.round(sum/8);return{key:key,score:sc,od:od,why:why};}
function pickTriFinal(ctx,score,tickets,limit){var pool=uniq([].concat(tickets.main,tickets.hole,tickets.bomb,ctx.sanRank.slice(0,12).map(function(t){return t.key;})));var arr=pool.map(function(k){return triScore(ctx,score,k);}).sort(function(a,b){if(b.score!==a.score)return b.score-a.score;return safeNum(a.od)-safeNum(b.od);});return arr.slice(0,limit||3);}

function makeFinalPlan(ctx,score,diag,tickets){var plan={type:'通常少点数型',lines:[],skip:[],memo:[],rawTri:pickTriFinal(ctx,score,tickets,3)};var tan1000=completeTan1000(ctx,score,diag);if(tan1000){plan.type='💴単勝1000円勝負型 V24.17';plan.memo.push('単勝回収型SS＋候補1位＋単勝/2車複/擬似複勝メジアン＋2複基準本線＋前ハンデ。');plan.memo.push('この形だけ単勝1000円。ワイド・3連複に散らさない。');addLine(plan,'単勝',tan1000.h,1000,tan1000.tan,tan1000.reason.slice(0,7).join('・'));plan.skip.push('ワイド/3連複：完全形なので買わない');return plan;}var win=score.filter(function(x){return isWinHole(ctx,x);});var place=score.filter(function(x){return isPlaceHole(ctx,x);});if(ultraFav(ctx)){var longHole=findUltraLongPair(ctx,score);if(longHole){var B=bestPartner(ctx,score,[ctx.fav1,longHole.h],true);plan.type='🕳️本命2車複上位穴格上げ型 V24.17';plan.memo.push('単勝40倍超でも、本命との2車複が2位以内なら3連複相手に格上げ。');if(B){var k=triKey(ctx.fav1,longHole.h,B.h);addLine(plan,'3連複',k,700,triOdd(ctx,k),'超本命＋2車複上位穴＋'+B.why.slice(0,3).join('・'));}var C=bestPartner(ctx,score,[ctx.fav1,longHole.h,B?B.h:null],false);if(C){var k2=triKey(ctx.fav1,longHole.h,C.h);addLine(plan,'3連複',k2,300,triOdd(ctx,k2),'超本命＋2車複上位穴＋第2相棒');}plan.skip.push('穴単勝：単勝40倍超なので単勝では買わない');return plan;}if(win.length){var A=win[0],P=bestPartner(ctx,score,[ctx.fav1,A.h],false);plan.type='🛡️単勝1.0級本命保護型 V24.17';plan.memo.push('単勝1.0級本命がいる時は、穴を頭固定しすぎず三連複で保護。');if(P){var k3=triKey(ctx.fav1,A.h,P.h);addLine(plan,'3連複',k3,700,triOdd(ctx,k3),'超本命＋穴候補＋2複基準本線');}var P2=bestPartner(ctx,score,[ctx.fav1,A.h,P?P.h:null],false);if(P2){var k4=triKey(ctx.fav1,A.h,P2.h);addLine(plan,'3連複',k4,300,triOdd(ctx,k4),'超本命＋穴候補＋第2相棒');}plan.skip.push('穴の単勝厚張り：単勝1.0級本命がいるためカット');return plan;}if(place.length){place.sort(function(a,b){return b.score-a.score;});var H=place[0],B1=bestPartner(ctx,score,[ctx.fav1,H.h],false),B2=bestPartner(ctx,score,[ctx.fav1,H.h,B1?B1.h:null],false);plan.type='🧱3連複厚張り型 V24.17';plan.memo.push('単勝1.0級本命＋候補1位穴核。穴の単勝ではなく3連複1〜2点厚張り。');if(B1){var k5=triKey(ctx.fav1,H.h,B1.h);addLine(plan,'3連複',k5,600,triOdd(ctx,k5),'超本命＋穴核＋相棒1');}if(B2){var k6=triKey(ctx.fav1,H.h,B2.h);addLine(plan,'3連複',k6,300,triOdd(ctx,k6),'超本命＋穴核＋相棒2');}if(B1)addLine(plan,'ワイド',pairKey(H.h,B1.h),100,pairOdd(ctx.wideRank,H.h,B1.h),'穴連れ相棒の確認');plan.skip.push('穴の単勝厚張り：頭より2〜3着寄り');return plan;}}

function renderHonpyo(ctx){var rows=[{l:'単勝',r:ctx.tanRow,m:ctx.tanM},{l:'2車複',r:ctx.nishaRow,m:ctx.nishaM},{l:'ワイド',r:ctx.wideRow,m:ctx.wideM},{l:'3連系',r:ctx.sanRow,m:ctx.sanM}],max=0;rows.forEach(function(x){if(x.r.length>max)max=x.r.length;});var marks={fav:[ctx.fav1,ctx.fav2],w1:ctx.wall.w1,w2:ctx.wall.w2};var html='<div class="card"><div class="title">本表・壁色つき</div><div class="small">青=単勝1/2人気 黄=第1壁後 橙=第2壁後 赤=メジアン</div><div class="honWrap">';rows.forEach(function(x){html+=renderHonRow(x.l,x.r,x.m,marks,max);});html+='</div></div>';return html;}
function renderBuy(t){var html='<div class="card buy"><div class="title">🎯検証用候補 V24.17</div><pre>';html+='ワイド候補\n'+(t.wide.length?t.wide.join('\n'):'なし')+'\n\n2車複候補\n'+(t.nisha.length?t.nisha.join('\n'):'なし')+'\n\n3連系・本線候補\n'+(t.main.length?t.main.join('\n'):'なし')+'\n\n3連系・穴本線候補\n'+(t.hole.length?t.hole.join('\n'):'なし')+'\n\n3連系・大荒れ保険候補\n'+(t.bomb.length?t.bomb.join('\n'):'なし')+'\n\n※実際に買うのは上の「最終勝負タイプ」だけ。';html+='</pre></div>';return html;}
function makeCopy(title,ctx,diag,score,prot,t100,t,plan){var lines=[];lines.push(title);lines.push('オート擬似複勝テスト版 V24.17 前位置対抗頭昇格＋中穴頭過大評価カット');lines.push('');lines.push('🩺オート荒れ診断');lines.push('表面：'+diag.surface);lines.push('裏診断：'+diag.back);lines.push('荒れ警戒スコア：'+diag.risk);lines.push('ハンデ補正：'+ctx.handi.desc);lines.push('V24.17保護：'+(prot.length?prot.join(' / '):'なし'));lines.push('');lines.push('🔥最終勝負タイプ');lines.push(plan.type);(plan.memo||[]).forEach(function(m){lines.push(m);});lines.push('');lines.push('最終買い目');if(plan.lines&&plan.lines.length){var total=0;plan.lines.forEach(function(l){total+=l.stake||0;var ret=lineReturn(l);var row=l.kind+' '+l.key+' '+yen(l.stake);if(l.od!==null&&l.od!==undefined)row+=' オッズ'+l.od;if(ret!==null)row+=' 想定戻り'+yen(ret);if(l.reason)row+=' / '+l.reason;lines.push(row);});lines.push('合計 '+yen(total));}else lines.push('なし');if(plan.skip&&plan.skip.length){lines.push('');lines.push('見送り/カット');plan.skip.forEach(function(x){lines.push(x);});}lines.push('');lines.push('2複基準壁ゾーン');lines.push('基準：'+ctx.wall.base+'号車');lines.push('本線：'+joinCars(ctx.wall.line));lines.push('第1壁後：'+joinCars(ctx.wall.w1));lines.push('第2壁後：'+joinCars(ctx.wall.w2));lines.push('');lines.push('メジアン');lines.push('単勝：'+joinCars(ctx.tanM));lines.push('2車複：'+joinCars(ctx.nishaM));lines.push('ワイド：'+joinCars(ctx.wideM));lines.push('3連系：'+joinCars(ctx.sanM));lines.push('');lines.push('単勝候補');if(t100.length)t100.forEach(function(x){lines.push(x.h+' 単'+x.tan);});else lines.push('なし');lines.push('');lines.push('検証候補');score.slice(0,8).forEach(function(x,i){lines.push((i+1)+'位 '+x.h+'号車【'+x.score+'】 単'+(isFinite(x.tan)?x.tan:'-')+' '+x.reason.slice(0,9).join('・'));});return lines.join(String.fromCharCode(10));}
function run(){try{var data=parseData(document.getElementById('input').value),out=document.getElementById('out');if(!data.tan.length){out.innerHTML='<div class="card err"><div class="title">入力不足</div>[TAN] が必要です。</div>';return;}var bad=validateCars(data);if(bad.length){out.innerHTML='<div class="card err"><div class="title">車番エラー</div><pre>'+bad.join('\n')+'</pre></div>';return;}var ctx=makeContext(data),score=scoreAll(ctx),diag=makeDiag(ctx),prot=makeProtections(ctx,score),t100=tan100(score),tickets=makeTickets(ctx,score,prot),plan=makeFinalPlan(ctx,score,diag,tickets);var html='';html+=renderTop(data,ctx)+renderDiag(diag,ctx,prot)+renderFinalPlan(plan)+renderWall(ctx)+renderPseudo(ctx)+renderTan100(t100)+renderRank(score)+renderHonpyo(ctx)+renderBuy(tickets);out.innerHTML=html;latestCopyText=makeCopy(data.title,ctx,diag,score,prot,t100,tickets,plan);}catch(e){document.getElementById('out').innerHTML='<div class="card err"><div class="title">エラー</div><pre>'+String(e&&e.message?e.message:e)+'</pre></div>';}}
function clearAll(){document.getElementById('input').value='';document.getElementById('out').innerHTML='';latestCopyText='';}
function copyResult(){if(!latestCopyText){alert('先に解析してください');return;}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(latestCopyText).then(function(){alert('結果をコピーしました');}).catch(function(){fallbackCopy(latestCopyText);});}else fallbackCopy(latestCopyText);}function fallbackCopy(text){var ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);alert('結果をコピーしました');}
