<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>オート研究所 V1.01 一括貼り版</title>
<style>
:root{--bg:#07111f;--card:#0f1d35;--line:#304965;--text:#fff;--muted:#a8bad0;--cyan:#67e8f9;--green:#4ade80;--red:#fb7185;--yellow:#fde047}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;padding:8px 8px 30px}
.wrap{max-width:980px;margin:auto}
h1{font-size:21px;margin:4px 0}.sub,.note{color:var(--muted);font-size:12px;line-height:1.65}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.card h2{color:var(--cyan);font-size:16px;margin:0 0 8px}
textarea{width:100%;min-height:430px;background:#071428;color:#fff;border:1px solid #38526f;border-radius:10px;padding:10px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.55}
button{border:0;border-radius:9px;padding:10px 13px;font-weight:700;color:#fff;background:#2563eb}
button.green{background:#15803d}button.gray{background:#475569}button.red{background:#be123c}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.stat{background:#132641;border:1px solid var(--line);border-radius:10px;padding:9px}.stat b{font-size:18px;color:var(--cyan)}
.item{background:#0a172b;border:1px solid var(--line);border-radius:9px;padding:8px;margin:6px 0}
.good{color:var(--green)}.bad{color:var(--red)}.warn{color:var(--yellow)}
.tabs{display:flex;gap:6px;overflow:auto;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:5}
.tab{white-space:nowrap;background:#10223e;color:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 11px}.tab.active{color:var(--cyan);border-color:var(--cyan)}
.panel{display:none}.panel.active{display:block}
input{width:100%;background:#071428;color:#fff;border:1px solid #38526f;border-radius:8px;padding:8px}
@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}textarea{min-height:380px}}
</style>
</head>
<body>
<div class="wrap">
<h1>🏁 オート研究所 V1.01</h1>
<div class="sub">チャッピーが出した1レース分コードを、ここへ丸ごと1回貼るだけ。</div>

<div class="tabs">
<button class="tab active" data-tab="paste">一括登録</button>
<button class="tab" data-tab="players">選手DB</button>
<button class="tab" data-tab="data">保存・出力</button>
</div>

<section id="paste" class="panel active">
<div class="card">
<h2>一括貼り登録</h2>
<div class="note">入力場所はここ1か所だけ。スクショを送ってもらったら、チャッピーがこの形式のコードを出します。それを全部コピーして貼って「解析確認」→「保存」。</div>
<textarea id="bulk" placeholder="【2026年8月11日 川口1R】

[RACE]
TRACK 良
WEATHER 晴
TEMP 32.0
TRACK_TEMP 48.0

[ENTRY]
1 選手A 0 A1 3.40 0.12
2 選手B 10 A2 3.36 0.09

[RESULT]
2-1-...

[PAST]
選手A|2026-08-10,川口,8,1,0,3.38,0.11,3.410,良
選手B|2026-08-09,川口,7,3,10,3.39,0.13,3.425,良

[ODDS_2FUKU]
1-2 4.3

[ODDS_2TAN]
2-1 6.8

[ODDS_3TAN]
2-1-3 15.4"></textarea>
<div class="actions">
<button id="check">解析確認</button>
<button class="green" id="save">保存</button>
<button class="gray" id="clearBox">入力欄クリア</button>
</div>
<div id="msg" class="note"></div>
</div>

<div class="card">
<h2>解析確認</h2>
<div id="preview" class="note">まだ解析していません。</div>
</div>
</section>

<section id="players" class="panel">
<div class="card">
<h2>選手DB</h2>
<input id="search" placeholder="選手名で検索">
<div id="playerList"></div>
</div>
</section>

<section id="data" class="panel">
<div class="card">
<h2>登録状況</h2>
<div class="stats">
<div class="stat">レース<br><b id="nRaces">0</b></div>
<div class="stat">選手<br><b id="nPlayers">0</b></div>
<div class="stat">出走記録<br><b id="nEntries">0</b></div>
<div class="stat">前走記録<br><b id="nPast">0</b></div>
</div>
</div>

<div class="card">
<h2>バックアップ</h2>
<div class="actions">
<button id="csv">CSV書出し</button>
<button id="json">JSONバックアップ</button>
<label style="display:inline-block"><span class="tab">JSON読込</span><input id="importJson" type="file" accept=".json" style="display:none"></label>
</div>
</div>

<div class="card">
<h2>危険操作</h2>
<button class="red" id="deleteAll">全データ削除</button>
</div>
</section>
</div>

<script>
const DB='auto_lab_v101',VER=1;
let db=null,lastParsed=null;
const $=id=>document.getElementById(id);
const num=v=>{const x=parseFloat(v);return Number.isFinite(x)?x:null};

function openDB(){
 return new Promise((ok,ng)=>{
  const r=indexedDB.open(DB,VER);
  r.onupgradeneeded=e=>{
   const d=e.target.result;
   if(!d.objectStoreNames.contains('races'))d.createObjectStore('races',{keyPath:'id'});
   if(!d.objectStoreNames.contains('past'))d.createObjectStore('past',{keyPath:'id'});
  };
  r.onsuccess=e=>{db=e.target.result;ok()};
  r.onerror=()=>ng(r.error);
 });
}
function all(s){return new Promise((ok,ng)=>{const r=db.transaction(s).objectStore(s).getAll();r.onsuccess=()=>ok(r.result||[]);r.onerror=()=>ng(r.error)})}
function put(s,o){return new Promise((ok,ng)=>{const r=db.transaction(s,'readwrite').objectStore(s).put(o);r.onsuccess=ok;r.onerror=()=>ng(r.error)})}
function clearStore(s){return new Promise((ok,ng)=>{const r=db.transaction(s,'readwrite').objectStore(s).clear();r.onsuccess=ok;r.onerror=()=>ng(r.error)})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}

function parseBulk(text){
 const lines=text.split(/\r?\n/);
 let section='', race={entries:[],odds:{f2:'',t2:'',t3:''},past:[]}, oddsBuf={f2:[],t2:[],t3:[]};
 for(let raw of lines){
  const line=raw.trim();
  if(!line)continue;

  const head=line.match(/^【(\d{4})年(\d{1,2})月(\d{1,2})日\s+(.+?)(\d+)R】$/);
  if(head){
    race.date=`${head[1]}-${String(head[2]).padStart(2,'0')}-${String(head[3]).padStart(2,'0')}`;
    race.venue=head[4].trim(); race.raceNo=+head[5];
    continue;
  }
  if(/^\[.+\]$/.test(line)){section=line;continue}

  if(section==='[RACE]'){
    const [k,...rest]=line.split(/\s+/); const v=rest.join(' ');
    if(k==='TRACK')race.track=v;
    if(k==='WEATHER')race.weather=v;
    if(k==='TEMP')race.temp=num(v);
    if(k==='TRACK_TEMP')race.trackTemp=num(v);
    if(k==='WIND')race.wind=num(v);
    continue;
  }

  if(section==='[ENTRY]'){
    const a=line.split(/\s+/);
    if(a.length>=2)race.entries.push({
      car:num(a[0]),name:a[1]||'',handicap:num(a[2]),rank:a[3]||'',
      trial:num(a[4]),st:num(a[5]),trialDev:num(a[6]),finish:num(a[7]),raceTime:num(a[8])
    });
    continue;
  }

  if(section==='[RESULT]'){race.finishOrder=line;continue}

  if(section==='[PAST]'){
    const p=line.indexOf('|');
    if(p>0){
      const player=line.slice(0,p).trim();
      const a=line.slice(p+1).split(',').map(x=>x.trim());
      race.past.push({id:uid(),player,date:a[0]||'',venue:a[1]||'',raceNo:num(a[2]),finish:num(a[3]),handicap:num(a[4]),trial:num(a[5]),st:num(a[6]),raceTime:num(a[7]),track:a[8]||''});
    }
    continue;
  }

  if(section==='[ODDS_2FUKU]'){oddsBuf.f2.push(line);continue}
  if(section==='[ODDS_2TAN]'){oddsBuf.t2.push(line);continue}
  if(section==='[ODDS_3TAN]'){oddsBuf.t3.push(line);continue}
 }
 race.odds.f2=oddsBuf.f2.join('\n');
 race.odds.t2=oddsBuf.t2.join('\n');
 race.odds.t3=oddsBuf.t3.join('\n');
 race.id=[race.date,race.venue,race.raceNo].filter(Boolean).join('_')||uid();
 return race;
}

function previewRace(r){
 if(!r.date||!r.venue||!r.raceNo)return '<span class="bad">見出し（日付・場・R）が読み取れていません。</span>';
 return `
 <div class="item"><b>${r.date} ${r.venue}${r.raceNo}R</b><br>
 出走 ${r.entries.length}人 / 前走 ${r.past.length}件 / 2車複 ${r.odds.f2? r.odds.f2.split('\\n').length:0}組 /
 2車単 ${r.odds.t2? r.odds.t2.split('\\n').length:0}組 / 3連単 ${r.odds.t3? r.odds.t3.split('\\n').length:0}組</div>
 <div class="item"><b>選手</b><br>${r.entries.map(e=>`${e.car||'-'} ${e.name} H${e.handicap??'-'} 試走${e.trial??'-'} ST${e.st??'-'}`).join('<br>')||'なし'}</div>
 <div class="item"><b>結果</b><br>${r.finishOrder||'未入力'}</div>`;
}

async function saveParsed(){
 const r=lastParsed||parseBulk($('bulk').value);
 if(!r.date||!r.venue||!r.raceNo){$('msg').innerHTML='<span class="bad">見出しが読み取れないため保存できません。</span>';return}
 await put('races',{...r,updatedAt:new Date().toISOString()});
 for(const p of r.past)await put('past',p);
 $('msg').innerHTML='<span class="good">保存しました。入力は1か所だけでOKです。</span>';
 refresh();
}

async function playerMap(){
 const m=new Map(),rs=await all('races'),ps=await all('past');
 const add=(n,o)=>{if(!n)return;if(!m.has(n))m.set(n,[]);m.get(n).push(o)};
 rs.forEach(r=>r.entries.forEach(e=>add(e.name,{...e,date:r.date,venue:r.venue,raceNo:r.raceNo,track:r.track,source:'race'})));
 ps.forEach(p=>add(p.player,p));
 return m;
}
async function renderPlayers(){
 const m=await playerMap(),q=$('search').value.trim();
 const arr=[...m.entries()].filter(([n])=>n.includes(q)).sort((a,b)=>b[1].length-a[1].length);
 $('playerList').innerHTML=arr.map(([n,rows])=>`<div class="item"><b>${n}</b><br><span class="note">${rows.length}走登録</span></div>`).join('')||'<div class="note">まだデータがありません。</div>';
}
async function refresh(){
 const rs=await all('races'),ps=await all('past'),pm=await playerMap();
 $('nRaces').textContent=rs.length;$('nPlayers').textContent=pm.size;
 $('nEntries').textContent=rs.reduce((s,r)=>s+r.entries.length,0);$('nPast').textContent=ps.length;
 renderPlayers();
}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function exportCSV(){
 const rs=await all('races');
 const head=['日付','場','R','車番','選手名','ハンデ','ランク','試走','ST','着順','競走T','走路','結果','2車複','2車単','3連単'];
 const out=[head];
 rs.forEach(r=>r.entries.forEach(e=>out.push([r.date,r.venue,r.raceNo,e.car,e.name,e.handicap,e.rank,e.trial,e.st,e.finish,e.raceTime,r.track,r.finishOrder,r.odds.f2,r.odds.t2,r.odds.t3])));
 const esc=v=>{v=String(v??'');return/[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
 dl(new Blob(['\ufeff'+out.map(r=>r.map(esc).join(',')).join('\n')],{type:'text/csv'}),'オート研究所_V1.01.csv');
}
async function exportJSON(){
 dl(new Blob([JSON.stringify({version:'1.01',races:await all('races'),past:await all('past')},null,2)],{type:'application/json'}),'オート研究所_V1.01_backup.json');
}

document.querySelectorAll('.tab[data-tab]').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.tab[data-tab],.panel').forEach(x=>x.classList.remove('active'));
 b.classList.add('active');$(b.dataset.tab).classList.add('active');
});
$('check').onclick=()=>{lastParsed=parseBulk($('bulk').value);$('preview').innerHTML=previewRace(lastParsed);$('msg').textContent=''};
$('save').onclick=saveParsed;
$('clearBox').onclick=()=>{$('bulk').value='';$('preview').textContent='まだ解析していません。';lastParsed=null;$('msg').textContent=''};
$('search').oninput=renderPlayers;
$('csv').onclick=exportCSV;$('json').onclick=exportJSON;
$('importJson').onchange=async e=>{const d=JSON.parse(await e.target.files[0].text());for(const r of d.races||[])await put('races',r);for(const p of d.past||[])await put('past',p);refresh();alert('読込完了')};
$('deleteAll').onclick=async()=>{if(confirm('全データを削除しますか？')&&confirm('本当に削除しますか？')){await clearStore('races');await clearStore('past');refresh()}};

(async()=>{await openDB();await refresh()})();
</script>
</body>
</html>
