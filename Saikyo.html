<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>競馬4エンジン統合アプリ V0.26</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#d9dee8;--accent:#2563eb;--good:#047857;--warn:#b45309;--bad:#b91c1c;--info:#1d4ed8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
header{position:sticky;top:0;z-index:10;background:rgba(246,247,251,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.wrap{max-width:1180px;margin:auto;padding:14px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.span12{grid-column:span 12}.span6{grid-column:span 6}@media(max-width:800px){.span6{grid-column:span 12}}
h1{font-size:20px;margin:0 0 4px}h2{font-size:17px}.small{font-size:12px;color:var(--muted)}textarea,button{font:inherit}
textarea{width:100%;min-height:260px;border:1px solid var(--line);border-radius:10px;padding:9px}button{border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:#fff;font-weight:700}
.alt{background:#4b5563}.light{background:#e5e7eb;color:#111827}.row{display:flex;gap:8px;flex-wrap:wrap}
.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:11px;background:#eef2ff;margin:2px}.good{background:#ecfdf5;color:var(--good)}.warn{background:#fffbeb;color:var(--warn)}.bad{background:#fef2f2;color:var(--bad)}.info{background:#eff6ff;color:var(--info)}
.engine{border-left:4px solid var(--accent)}.result{font-size:14px;line-height:1.75}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border-bottom:1px solid var(--line);padding:7px 5px;text-align:center;white-space:nowrap}th{background:#f9fafb}
</style>
</head>
<body>
<header><div class="wrap"><h1>競馬4エンジン統合アプリ V0.26</h1><div class="small">市場監査を表示・返却コードへ出力。HEAD-SPLIT / HEAD-LIFT / RESCUE / 6・10・15倍壁対応。</div></div></header>
<main class="wrap"><div class="grid">
<section class="card span12"><h2>1. チャッピーコード</h2><textarea id="masterCode"></textarea><div class="row"><button onclick="importCode()">コード読込</button><button class="alt" onclick="analyze()">4エンジン解析</button><button class="light" onclick="resetAll()">リセット</button></div><div id="status" class="small"></div></section>
<section class="card span12"><h2>2. レース</h2><div id="raceBox" class="result"></div></section>
<section class="card span6 engine"><h2>3. 安井式</h2><div id="yasuiBox" class="result"></div></section>
<section class="card span6 engine"><h2>4. 見える男</h2><div id="mieruBox" class="result"></div></section>
<section class="card span6 engine"><h2>5. ICHIGEKI</h2><div id="ichiBox" class="result"></div></section>
<section class="card span6 engine"><h2>6. スレイプニル</h2><div id="sleiBox" class="result"></div></section>
<section class="card span12"><h2>7. 市場監査</h2><div id="marketBox" class="result"></div></section>
<section class="card span12"><h2>8. 最終統合</h2><div id="finalBox" class="result"></div><div style="overflow:auto"><table id="tbl"></table></div></section>
<section class="card span12"><h2>9. チャッピーへ返すデータ</h2><div class="row"><button onclick="copyResult()">結果データをコピー</button><button class="light" onclick="copyInput()">入力コードをコピー</button></div><textarea id="returnData" readonly></textarea><div id="copyStatus" class="small"></div></section>
</div></main>

<script>
let APP={race:{},horses:[],compi:[],market:{},ichigekiHorses:[],sleipnir:[],yasuiHistory:[],newp:{}}, LAST={};
function sec(t){let o={},c="";t.split(/\r?\n/).forEach(r=>{let l=r.trim();if(!l)return;let m=l.match(/^\[([A-Z0-9_]+)\]$/i);if(m){c=m[1].toUpperCase();o[c]=[];return}if(c)o[c].push(r)});return o}
function kv(a){let o={};(a||[]).forEach(l=>{let i=l.indexOf("=");if(i>=0)o[l.slice(0,i).trim()]=l.slice(i+1).trim()});return o}
function csv(a){a=(a||[]).filter(x=>x.trim());if(!a.length)return[];let h=a[0].split(",").map(x=>x.trim());return a.slice(1).map(l=>{let v=l.split(",").map(x=>x.trim()),o={};h.forEach((k,i)=>o[k]=v[i]??"");return o})}
function filled(v){return v!==undefined&&v!==null&&String(v).trim()!==""}
function num(v){if(!filled(v))return null;let x=Number(v);return Number.isFinite(x)?x:null}
function badge(t,c=""){return `<span class="badge ${c}">${t}</span>`}
function importCode(){
 let s=sec(masterCode.value);APP.race=kv(s.RACE);APP.market=kv(s.MARKET);APP.newp=kv(s.NEWP);APP.horses=csv(s.HORSES);APP.ichigekiHorses=csv(s.ICHIGEKI_HORSES);APP.sleipnir=csv(s.SLEIPNIR);APP.yasuiHistory=csv(s.YASUI_HISTORY);
 APP.compi=(s.COMPI||[]).map(l=>{let [n,v]=l.split(",");return {num:n?.trim(),value:num(v)}}).filter(x=>x.num&&x.value!==null);
 let cm={};APP.compi.forEach(x=>cm[x.num]=x.value);APP.horses.forEach(h=>{if(cm[String(h["馬番"])]!=null)h.COMPI=cm[String(h["馬番"])]});
 status.innerHTML=badge("読込成功","good");showRace();
}
function showRace(){let r=APP.race,top=[...APP.compi].sort((a,b)=>b.value-a.value).slice(0,3);raceBox.innerHTML=`${r.date||""} ${r.venue||""} ${r.race||""}R ${r.surface||""}${r.distance||""}m / ${r.field_size||APP.horses.length}頭<br>COMPI ${top.map(x=>`#${x.num}=${x.value}`).join(" / ")}`}

function marketAudit(){
 let m=APP.market;
 if(!Object.values(m).some(filled))return {status:"UNJUDGED",tags:[],rescue:[]};
 let tags=[];
 if(m.favorite_confidence)tags.push(`安心度:${m.favorite_confidence}`);
 if(m.head_split)tags.push(`HEAD-SPLIT:#${m.head_split}`);
 if(m.head_lift)tags.push(`HEAD-LIFT:${m.head_lift.split("|").map(x=>"#"+x).join(" ")}`);
 if(m.place_6wall)tags.push(`6倍壁:${m.place_6wall.split("|").map(x=>"#"+x).join(" ")}`);
 if(m.place_10wall)tags.push(`10倍壁:${m.place_10wall.split("|").map(x=>"#"+x).join(" ")}`);
 if(m.place_15wall)tags.push(`15倍壁:${m.place_15wall.split("|").map(x=>"#"+x).join(" ")}`);
 let qr=num(m.quinella_vertical_ratio);
 if(qr!==null)tags.push(`馬連縦目:${qr.toFixed(3)}倍`);
 let rescue=(m.market_rescue||"").split("|").filter(Boolean);
 return {status:"OK",tags,rescue};
}
function analyze(){
 let rows=APP.horses.map(x=>({...x}));
 let keys=["timeScore","classHold","paceFit","memory","conditionGap","body","jockey","trainer","blood"];
 let mieruOK=rows.some(r=>keys.some(k=>num(r[k])!==null));
 if(mieruOK){rows.forEach(r=>{let v=k=>num(r[k])??0;r.ms=v("timeScore")*3+v("classHold")*3+v("paceFit")*2+v("memory")*3+v("conditionGap")*2+v("body")+v("jockey")*.8+v("trainer")*.8+v("blood")*.7});rows.sort((a,b)=>b.ms-a.ms);rows.forEach((r,i)=>r.mo=i+1)}
 let ichi={status:APP.compi.length>=3?"OK":"UNJUDGED",roles:{},tags:[]};
 APP.ichigekiHorses.forEach(r=>ichi.roles[String(r["馬番"])]=r.ROLE||"");
 if(ichi.status==="OK"){let s=[...APP.compi].sort((a,b)=>b.value-a.value);ichi.sum=s[0].value+s[1].value+s[2].value;ichi.g12=s[0].value-s[1].value;ichi.g23=s[1].value-s[2].value;ichi.g13=s[0].value-s[2].value;if(ichi.g23>=6)ichi.tags.push("X2-S")}
 let slei={status:APP.sleipnir.length?"OK":"UNJUDGED",map:{}};APP.sleipnir.forEach(r=>{let a=num(r.LATE_A),s=num(r.LATE_S),re=num(r.LATE_REST),bc=num(r.BODY_CHANGE),lv="NONE";if(re===1&&bc!==null&&Math.abs(bc)>=2)lv="BUY-SS";else if(re===1)lv="REST";else if(s===1)lv="S";else if(a===1)lv="A";slei.map[String(r["馬番"])]=lv});
 let market=marketAudit(), yasuiStatus=APP.yasuiHistory.length?"DATA_PRESENT":"UNJUDGED";
 LAST={rows,market,ichi,slei,mieruOK,yasuiStatus};
 yasuiBox.innerHTML=yasuiStatus==="UNJUDGED"?badge("未判定","warn")+" YASUI_HISTORY未入力":badge("履歴あり","info")+" V0.25安井計算用データあり";
 mieruBox.innerHTML=mieruOK?rows.slice(0,8).map(r=>`${r.mo}位 #${r["馬番"]} ${r["馬名"]} ${r.ms.toFixed(1)}`).join("<br>"):badge("未判定","warn");
 ichiBox.innerHTML=ichi.status==="OK"?`上位3合計 ${ichi.sum} / 差 ${ichi.g12}-${ichi.g23}-${ichi.g13}<br>${ichi.tags.map(x=>badge(x,"warn")).join(" ")}<br>${Object.entries(ichi.roles).map(([n,r])=>`#${n} ${badge(r,"info")}`).join("<br>")}`:badge("未判定","warn");
 sleiBox.innerHTML=slei.status==="OK"?Object.entries(slei.map).map(([n,v])=>`#${n} ${badge(v,v==="BUY-SS"?"good":"warn")}`).join("<br>"):badge("未判定","warn");
 marketBox.innerHTML=market.status==="OK"?market.tags.map(x=>badge(x,x.includes("LOW")||x.includes("SPLIT")?"warn":"info")).join("<br>")+"<br>"+(market.rescue.length?`RESCUE ${market.rescue.map(x=>"#"+x).join(" ")}`:""):badge("未判定","warn");
 finalBox.innerHTML=badge("最終統合 保留","warn")+" 安井式が未判定のため印はまだ出しません。";
 tbl.innerHTML=`<tr><th>馬</th><th>COMPI</th><th>見える</th><th>ICHIGEKI</th><th>スレイプニル</th><th>市場</th></tr>`+APP.horses.map(h=>{let n=String(h["馬番"]),r=rows.find(x=>String(x["馬番"])===n);return `<tr><td>${n} ${h["馬名"]}</td><td>${h.COMPI??"-"}</td><td>${r?.mo??"-"}</td><td>${ichi.roles[n]||"-"}</td><td>${slei.map[n]||"-"}</td><td>${market.rescue.includes(n)?"RESCUE":(mktTag(n))}</td></tr>`}).join("");
 buildReturn();
}
function mktTag(n){let m=APP.market;if(String(m.head_split)===n)return"HEAD-SPLIT";if((m.head_lift||"").split("|").includes(n))return"HEAD-LIFT";return"-"}
function buildReturn(){
 let m=APP.market, t=`CHATPY_APP_RESULT_V4\n[RACE]\n${APP.race.date||""},${APP.race.venue||""},${APP.race.race||""}R,${APP.race.surface||""},${APP.race.distance||""}m,${APP.race.field_size||APP.horses.length}頭\n\n[ENGINE_STATUS]\nYASUI=${LAST.yasuiStatus==="UNJUDGED"?"UNJUDGED":"DATA_PRESENT"}\nMIERU=${LAST.mieruOK?"OK":"UNJUDGED"}\nICHIGEKI=${LAST.ichi.status}\nSLEIPNIR=${LAST.slei.status}\nMARKET=${LAST.market.status}\n\n[MARKET_AUDIT]\nFAVORITE_CONFIDENCE=${m.favorite_confidence||""}\nHEAD_SPLIT=${m.head_split||""}\nHEAD_LIFT=${m.head_lift||""}\nMARKET_RESCUE=${m.market_rescue||""}\nPLACE_6WALL=${m.place_6wall||""}\nPLACE_10WALL=${m.place_10wall||""}\nPLACE_15WALL=${m.place_15wall||""}\nQUINELLA_VERTICAL_RATIO=${m.quinella_vertical_ratio||""}\n\n[HORSE_RESULT]\n馬番,馬名,COMPI,見える順位,ICHIGEKI,スレイプニル,市場\n`;
 APP.horses.forEach(h=>{let n=String(h["馬番"]),r=LAST.rows.find(x=>String(x["馬番"])===n);t+=`${n},${h["馬名"]},${h.COMPI??""},${r?.mo??""},${LAST.ichi.roles[n]||""},${LAST.slei.map[n]||""},${mktTag(n)}${LAST.market.rescue.includes(n)?"|RESCUE":""}\n`});
 returnData.value=t;
}
async function copyResult(){if(!returnData.value.trim())analyze();try{await navigator.clipboard.writeText(returnData.value);copyStatus.textContent="結果データをコピーしました"}catch(e){returnData.select();document.execCommand("copy")}}
async function copyInput(){try{await navigator.clipboard.writeText(masterCode.value);copyStatus.textContent="入力コードをコピーしました"}catch(e){masterCode.select();document.execCommand("copy")}}
function resetAll(){location.reload()}
</script>
</body></html>
