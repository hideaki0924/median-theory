<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>競馬予想 主軸固定アプリ V1.00</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#1f2937;--muted:#667085;--line:#d7dce3;--blue:#2563eb;--green:#067647;--amber:#b54708;--red:#b42318;--soft:#f8fafc}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
header{position:sticky;top:0;z-index:10;background:rgba(245,246,248,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.wrap{max-width:1180px;margin:auto;padding:14px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.s12{grid-column:span 12}
.s6{grid-column:span 6}
@media(max-width:820px){.s6{grid-column:span 12}}
h1{font-size:20px;margin:0 0 4px}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:15px;margin:12px 0 6px}
.small{font-size:12px;color:var(--muted)}
.note{padding:10px;border-radius:10px;background:#f8fafc;border:1px solid var(--line);font-size:13px;line-height:1.6}
textarea{width:100%;min-height:300px;border:1px solid var(--line);border-radius:10px;padding:10px;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}
button{border:0;border-radius:10px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:700;font-size:14px}
.secondary{background:#475467}
.light{background:#e4e7ec;color:#111827}
.row{display:flex;gap:8px;flex-wrap:wrap}
.badge{display:inline-block;padding:3px 8px;margin:2px;border-radius:999px;font-size:11px;background:#eef2ff}
.ok{background:#ecfdf3;color:var(--green)}
.warn{background:#fffaeb;color:var(--amber)}
.bad{background:#fef3f2;color:var(--red)}
.info{background:#eff8ff;color:#175cd3}
.engine{border-left:5px solid var(--blue)}
.marks{font-size:19px;font-weight:800;line-height:1.85}
.result{font-size:14px;line-height:1.7}
.horseLine{padding:8px 0;border-bottom:1px dashed var(--line)}
.horseLine:last-child{border-bottom:0}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{border-bottom:1px solid var(--line);padding:7px 5px;text-align:center;white-space:nowrap}
th{background:#f9fafb;position:sticky;top:0}
.scroll{overflow:auto;max-height:520px}
details{margin-top:10px}
summary{cursor:pointer;font-weight:700}
.stop{border:2px solid #fda29b;background:#fff6f5}
.ready{border:2px solid #75e0a7;background:#f6fef9}
</style>
</head>

<body>

<header>
<div class="wrap">
<h1>競馬予想 主軸固定アプリ V1.00</h1>
<div class="small">安井式（上がりXハロン3軸）＋見える男を主軸固定。データ不足なら予想を止める。</div>
</div>
</header>

<main class="wrap">
<div class="grid">

<section class="card s12">
<h2>1. レースデータコード</h2>
<textarea id="code"></textarea>

<div class="row">
<button onclick="loadCode()">コード読込</button>
<button class="secondary" onclick="analyze()">解析</button>
<button class="light" onclick="fillTemplate()">入力テンプレート</button>
<button class="light" onclick="resetAll()">リセット</button>
</div>

<div id="loadStatus" class="small"></div>
</section>

<section class="card s12">
<h2>2. 入力検査</h2>
<div id="gateBox" class="result"></div>
</section>

<section class="card s6 engine">
<h2>3. 安井式・上がりXハロン V1.0</h2>
<div id="yasuiBox" class="result"></div>
</section>

<section class="card s6 engine">
<h2>4. 見える男 実戦版 V1.0</h2>
<div id="mieruBox" class="result"></div>
</section>

<section class="card s6 engine">
<h2>5. ICHIGEKI</h2>
<div id="ichiBox" class="result"></div>
</section>

<section class="card s6 engine">
<h2>6. スレイプニル監査 V0.90</h2>
<div id="sleiBox" class="result"></div>
</section>

<section class="card s12">
<h2>7. 市場監査</h2>
<div id="marketBox" class="result"></div>
</section>

<section class="card s12">
<h2>8. 最終統合</h2>
<div id="finalBox" class="result"></div>
</section>

<section class="card s12">
<h2>9. 詳細データ</h2>

<details>
<summary>安井式3軸 詳細</summary>
<div class="scroll">
<table id="yasuiTable"></table>
</div>
</details>

<details>
<summary>見える男 監査詳細</summary>
<div class="scroll">
<table id="mieruTable"></table>
</div>
</details>

<details>
<summary>入力した過去走の件数</summary>
<div class="scroll">
<table id="coverageTable"></table>
</div>
</details>

</section>

<section class="card s12">
<h2>10. チャッピーへ返す結果</h2>

<div class="row">
<button onclick="copyResult()">結果をコピー</button>
</div>

<textarea id="returnData" readonly></textarea>
<div id="copyStatus" class="small"></div>
</section>

</div>
</main>

<script>

const VERSION="1.00";

let APP={
  race:{},
  horses:[],
  past:[],
  mieru:[],
  compi:[],
  ichiRoles:[],
  market:{},
  yasuiCourse:{}
};

let LAST={};

const CLASS_CORR={
  "新馬":0,
  "未勝利":0,
  "1勝":0.1,
  "1勝クラス":0.1,
  "2勝":0.2,
  "2勝クラス":0.2,
  "3勝":0.3,
  "3勝クラス":0.3,
  "OP特別":0.4,
  "OP":0.4,
  "L":0.4,
  "リステッド":0.4,
  "GIII":0.5,
  "G3":0.5,
  "GII":0.6,
  "G2":0.6,
  "GI":0.7,
  "G1":0.7
};

const AGE_CORR={
  "2歳限定":-0.2,
  "3歳限定":-0.1,
  "その他":0
};

const TRACK_CORR={
  芝:{
    良:0,
    稍重:0.4,
    重:0.8,
    不良:1.2
  },
  ダート:{
    良:0,
    稍重:-0.4,
    重:-0.8,
    不良:-1.2
  }
};

const POWER_BASE={
  芝:{
    1000:43.8,
    1200:45.8,
    1400:46.8,
    1500:47.7,
    1600:47.6,
    1800:48.8,
    2000:49.2,
    2200:49.2,
    2300:49.9,
    2400:49.9,
    2500:49.6,
    2600:50.1,
    3000:50.4,
    3200:50.0,
    3400:50.5,
    3600:50.5
  },

  ダート:{
    1000:47.5,
    1150:48.1,
    1200:48.8,
    1300:49.3,
    1400:49.4,
    1600:49.9,
    1700:50.5,
    1800:50.8,
    1900:50.7,
    2000:50.6,
    2100:51.1,
    2400:51.4,
    2500:51.1
  }
};

const MIERU_WEIGHTS={
  LOAD:1.5,
  PACE_FIT:4,
  MEMORY:5,
  TIME:5,
  CLASS:5,
  BODY:2,
  JOCKEY:1.5,
  TRAINER:1,
  JT:1,
  BLOOD:1.5,
  COURSE:4,
  BIAS:1,
  CONDITION_GAP:4,
  TIME_HOLE:4.5,
  CLASS_HOLD:5
};

const GRADE={
  SS:5,
  S:4,
  A:3,
  B:2,
  C:1,
  "0":0,
  NG:-2,
  NA:0,
  "":0
};

const MARKS=["◎","○","▲","★","☆","△"];
const RANK_POINTS=[12,10,8,6,4,2];

function filled(v){
  return v!==undefined &&
         v!==null &&
         String(v).trim()!=="";
}

function num(v){
  if(!filled(v)) return null;

  let x=Number(v);

  return Number.isFinite(x)
    ? x
    : null;
}

function fmt(v,d=1){
  let x=num(v);

  return x===null
    ? ""
    : x.toFixed(d);
}

function badge(t,c=""){
  return `<span class="badge ${c}">${t}</span>`;
}

function esc(s){
  return String(s??"").replace(
    /[&<>"']/g,
    m=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[m])
  );
}

function sections(t){

  let o={};
  let cur="";

  t.split(/\r?\n/).forEach(raw=>{

    let s=raw.trim();

    if(!s) return;

    let m=s.match(/^\[([A-Z0-9_]+)\]$/i);

    if(m){
      cur=m[1].toUpperCase();
      o[cur]=[];
      return;
    }

    if(cur){
      o[cur].push(raw);
    }

  });

  return o;
}

function kv(a){

  let o={};

  (a||[]).forEach(l=>{

    let i=l.indexOf("=");

    if(i>=0){

      o[l.slice(0,i).trim()]
        =
      l.slice(i+1).trim();

    }

  });

  return o;
}

function csv(a){

  a=(a||[])
    .filter(x=>x.trim());

  if(!a.length) return [];

  let h=a[0]
    .split(",")
    .map(x=>x.trim());

  return a.slice(1).map(l=>{

    let v=l
      .split(",")
      .map(x=>x.trim());

    let o={};

    h.forEach((k,i)=>{
      o[k]=v[i]??"";
    });

    return o;

  });
}

function byHorse(rows){

  let o={};

  rows.forEach(r=>{

    let n=String(
      r["馬番"]||""
    ).trim();

    if(n){
      (o[n]??=[]).push(r);
    }

  });

  return o;
}

function parseDate(s){

  if(!filled(s)) return null;

  let d=new Date(
    String(s).replace(/\//g,"-")
    +"T00:00:00"
  );

  return isNaN(d)
    ? null
    : d;
}

function daysBetween(a,b){

  let x=parseDate(a);
  let y=parseDate(b);

  if(!x||!y) return null;

  return Math.round(
    (x-y)/86400000
  );
}

function fillTemplate(){

  code.value=`CHATPY_APP_CODE_V1_FULL

[RACE]
date=
venue=
race=
surface=
distance=
field_size=
track=
race_name=
course_shape=

[YASUI_COURSE]
speed=
stamina=
power=
source=書籍

[HORSES]
馬番,馬名,年齢,キャリア走数,人気,単勝,斤量,前走斤量,馬体重増減,脚質

[PAST_RUNS]
馬番,走順,date,surface,distance,track,class,age_limit,finish,gap,last1F,last2F,last4F,run_time,closing_rank,position_type,course_same,near_distance,same_class,jockey,trainer,body_weight

[MIERU_AUDIT]
馬番,LOAD,PACE_FIT,MEMORY,TIME,CLASS,BODY,JOCKEY,TRAINER,JT,BLOOD,COURSE,BIAS,CONDITION_GAP,TIME_HOLE,CLASS_HOLD,ROLE,REASON

[COMPI]
馬番,指数

[ICHIGEKI_ROLES]
馬番,ROLE

[MARKET]
favorite_confidence=
head_split=
head_lift=
market_rescue=
quinella_vertical_ratio=
`;

}

function loadCode(){

  let s=sections(code.value);

  APP.race=kv(s.RACE);
  APP.yasuiCourse=kv(s.YASUI_COURSE);
  APP.market=kv(s.MARKET);

  APP.horses=csv(s.HORSES);
  APP.past=csv(s.PAST_RUNS);
  APP.mieru=csv(s.MIERU_AUDIT);

  APP.compi=csv(s.COMPI)
    .map(r=>({
      num:String(r["馬番"]||"").trim(),
      value:num(r["指数"])
    }))
    .filter(x=>
      x.num &&
      x.value!==null
    );

  APP.ichiRoles=
    csv(s.ICHIGEKI_ROLES);

  let cm={};

  APP.compi.forEach(x=>{
    cm[x.num]=x.value;
  });

  APP.horses.forEach(h=>{
    h.COMPI=
      cm[String(h["馬番"])]
      ?? null;
  });

  loadStatus.innerHTML=
    badge("読込完了","ok")
    +` ${APP.horses.length}頭 / 過去走${APP.past.length}行`;

  analyze();
}

function validation(){

  let errors=[];
  let warnings=[];

  let p=byHorse(APP.past);
  let m=byHorse(APP.mieru);

  if(!APP.horses.length){
    errors.push(
      "HORSESがありません"
    );
  }

  if(
    !filled(APP.race.date) ||
    !filled(APP.race.surface) ||
    !filled(APP.race.distance)
  ){
    errors.push(
      "RACEのdate / surface / distanceが不足"
    );
  }

  let ws=num(APP.yasuiCourse.speed);
  let wt=num(APP.yasuiCourse.stamina);
  let wp=num(APP.yasuiCourse.power);

  if(
    [ws,wt,wp]
      .some(x=>x===null)
  ){
    errors.push(
      "安井式のコース★重要度が未入力"
    );
  }

  APP.horses.forEach(h=>{

    let n=String(h["馬番"]);

    let career=
      num(h["キャリア走数"]);

    let cnt=
      (p[n]||[]).length;

    if(career===null){

      errors.push(
        `#${n} ${h["馬名"]}: キャリア走数が未入力`
      );

    }

    else if(cnt<career){

      errors.push(
        `#${n} ${h["馬名"]}: 過去走 ${cnt}/${career}走しか入力されていない`
      );

    }

    if(!(m[n]||[]).length){

      errors.push(
        `#${n} ${h["馬名"]}: 見える男監査が未入力`
      );

    }

  });

  APP.mieru.forEach(r=>{

    let n=String(r["馬番"]);

    Object
      .keys(MIERU_WEIGHTS)
      .forEach(k=>{

        if(!filled(r[k])){

          errors.push(
            `#${n}: 見える男 ${k} が空欄`
          );

        }

      });

    if(!filled(r.ROLE)){

      errors.push(
        `#${n}: 見える男 ROLE が空欄`
      );

    }

    if(!filled(r.REASON)){

      warnings.push(
        `#${n}: 見える男 REASON が空欄`
      );

    }

  });

  return {
    errors:[...new Set(errors)],
    warnings:[...new Set(warnings)]
  };

}

function classCorr(s){

  return CLASS_CORR[
    String(s||"").trim()
  ] ?? 0;
}

function ageCorr(s){

  let k=
    String(s||"その他").trim();

  return AGE_CORR[k] ?? 0;
}

function powerValue(r){

  let surf=r.surface;

  let dist=num(r.distance);

  let base=
    POWER_BASE[surf]?.[dist];

  let l4=
    num(r.last4F);

  let fin=
    num(r.finish);

  let gap=
    num(r.gap) ?? 0;

  let tc=
    TRACK_CORR[surf]?.[r.track];

  if(
    base===undefined ||
    l4===null ||
    fin===null ||
    tc===undefined
  ){
    return null;
  }

  return 48
    +(l4+(fin===1?0:gap)-tc)
    -base;
}

function rankRows(
  rows,
  key,
  better
){

  let a=
    rows.filter(
      x=>x[key]!==null
    );

  a.sort((x,y)=>
    better==="low"
      ? x[key]-y[key]
      : y[key]-x[key]
  );

  let last=null;
  let rank=0;

  a.forEach((x,i)=>{

    if(
      last===null ||
      x[key]!==last
    ){
      rank=i+1;
    }

    x[key+"Rank"]=rank;

    last=x[key];

  });
}

function calcYasui(){

  let p=byHorse(APP.past);

  let rows=[];

  APP.horses.forEach(h=>{

    let n=String(h["馬番"]);

    let age=
      num(h["年齢"]);

    let all=
      (p[n]||[])
      .slice()
      .sort(
        (a,b)=>
        (num(a["走順"])??999)
        -
        (num(b["走順"])??999)
      );

    let same=
      all.filter(
        r=>
        r.surface
        ===
        APP.race.surface
      );

    let speedRuns=
      (
        age!==null &&
        age>=4
      )
      ? same.slice(0,4)
      : same;

    let sv=
      speedRuns
      .map(r=>{

        let l=num(r.last2F);
        let f=num(r.finish);
        let g=num(r.gap)??0;

        return(
          l===null ||
          f===null
        )
        ? null
        : l+(f===1?0:g);

      })
      .filter(
        x=>x!==null
      );

    let staminaRuns=
      same.filter(
        r=>
        [1,2]
        .includes(
          num(r.finish)
        )
      );

    let tv=
      staminaRuns
      .map(r=>{

        let l=
          num(r.last1F);

        return l===null
          ? null
          : l
            +classCorr(r.class)
            +ageCorr(r.age_limit);

      })
      .filter(
        x=>x!==null
      );

    let pv=
      same
      .map(powerValue)
      .filter(
        x=>x!==null
      );

    rows.push({

      num:n,
      name:h["馬名"],
      pop:num(h["人気"]),

      speed:
        sv.length
        ? Math.min(...sv)
        : null,

      stamina:
        tv.length
        ? Math.max(...tv)
        : null,

      power:
        pv.length
        ? Math.min(...pv)
        : null,

      speedSource:
        sv.length
        ? speedRuns.length
        : 0,

      staminaSource:
        tv.length
        ? staminaRuns.length
        : 0,

      powerSource:
        pv.length
        ? same.length
        : 0,

      staminaState:
        tv.length
        ? "算出"
        : "対象歴なし"

    });

  });

  rankRows(
    rows,
    "speed",
    "low"
  );

  rankRows(
    rows,
    "stamina",
    "high"
  );

  rankRows(
    rows,
    "power",
    "low"
  );

  let ws=
    num(APP.yasuiCourse.speed);

  let wt=
    num(APP.yasuiCourse.stamina);

  let wp=
    num(APP.yasuiCourse.power);

  let weightsReady=
    [ws,wt,wp]
      .every(
        x=>x!==null
      );

  rows.forEach(r=>{

    let parts=[];

    if(
      r.speedRank!==undefined
    ){
      parts.push({
        r:r.speedRank,
        w:ws
      });
    }

    if(
      r.staminaRank!==undefined
    ){
      parts.push({
        r:r.staminaRank,
        w:wt
      });
    }

    if(
      r.powerRank!==undefined
    ){
      parts.push({
        r:r.powerRank,
        w:wp
      });
    }

    r.multi=
      [
        r.speedRank,
        r.staminaRank,
        r.powerRank
      ]
      .filter(
        x=>
        x!==undefined &&
        x<=3
      )
      .length>=2;

    if(
      weightsReady &&
      parts.length>=2
    ){

      r.appScore=
        parts.reduce(
          (s,x)=>
          s+x.r*x.w,
          0
        )
        /
        parts.reduce(
          (s,x)=>
          s+x.w,
          0
        );

    }

    else{

      r.appScore=null;

    }

  });

  let ranked=
    rows
    .filter(
      r=>
      r.appScore!==null
    )
    .sort(
      (a,b)=>
      a.appScore-b.appScore
    );

  ranked.forEach(
    (r,i)=>{
      r.appRank=i+1;
      r.mark=
        i<6
        ? MARKS[i]
        : "";
    }
  );

  rows.forEach(r=>{

    if(
      r.pop!==null &&
      r.appRank
    ){

      r.popGap=
        r.pop-r.appRank;

    }

    else{

      r.popGap=null;

    }

  });

  let complete=
    weightsReady
    &&
    rows.every(
      r=>
      r.speed!==null &&
      r.power!==null
    )
    &&
    APP.horses.every(
      h=>
      (
        byHorse(APP.past)
        [String(h["馬番"])]
        ||[]
      ).length>0
    );

  return{
    rows,
    ranked,
    weightsReady,
    complete,
    status:
      weightsReady
      ?(
        complete
        ?"OK"
        :"PARTIAL_OK"
      )
      :"UNJUDGED"
  };

}

function calcMieru(){

  let audit=
    byHorse(APP.mieru);

  let p=
    byHorse(APP.past);

  let rows=[];

  APP.horses.forEach(h=>{

    let n=
      String(h["馬番"]);

    let a=
      (audit[n]||[])[0];

    if(!a){

      rows.push({
        num:n,
        name:h["馬名"],
        status:"UNJUDGED",
        score:null
      });

      return;

    }

    let score=0;
    let strong=[];

    Object.entries(
      MIERU_WEIGHTS
    )
    .forEach(
      ([k,w])=>{

        let g=
          String(
            a[k]??""
          )
          .trim()
          .toUpperCase();

        let v=
          GRADE[g];

        if(v===undefined){
          v=0;
        }

        score+=v*w;

        if(
          ["SS","S"]
          .includes(g)
        ){
          strong.push(k);
        }

      }
    );

    let career=
      num(
        h["キャリア走数"]
      )??999;

    let need=
      Math.min(
        10,
        career
      );

    let actual=
      (p[n]||[]).length;

    let coverage=
      Math.min(
        actual,
        10
      );

    rows.push({
      num:n,
      name:h["馬名"],
      score,
      role:a.ROLE||"",
      reason:a.REASON||"",
      strong,
      coverage,
      need,
      status:
        coverage>=need
        ?"OK"
        :"PARTIAL"
    });

  });

  let ranked=
    rows
    .filter(
      x=>
      x.score!==null
    )
    .sort(
      (a,b)=>
      b.score-a.score
    );

  ranked.forEach(
    (r,i)=>{
      r.rank=i+1;
      r.mark=
        i<6
        ? MARKS[i]
        : "";
    }
  );

  let complete=
    rows.length
    ===
    APP.horses.length
    &&
    rows.every(
      x=>
      x.status==="OK"
    );

  return{
    rows,
    ranked,
    complete,
    status:
      complete
      ?"OK"
      :"PARTIAL_OK"
  };

}

function calcIchi(){

  if(
    APP.compi.length<3
  ){

    return{
      status:"UNJUDGED",
      tags:[],
      roles:{}
    };

  }

  let s=
    [...APP.compi]
    .sort(
      (a,b)=>
      b.value-a.value
    );

  let top=
    s.slice(0,3);

  let sum=
    top.reduce(
      (a,x)=>
      a+x.value,
      0
    );

  let g12=
    top[0].value
    -top[1].value;

  let g23=
    top[1].value
    -top[2].value;

  let g13=
    top[0].value
    -top[2].value;

  let tags=[];

  let field=
    num(APP.race.field_size)
    ??
    APP.horses.length;

  if(
    field>=14 &&
    sum<=202
  ){

    tags.push("X2-SS");

  }

  if(g23>=6){

    tags.push("X2-S");

  }

  let roles={};

  APP.ichiRoles.forEach(
    r=>{

      roles[
        String(r["馬番"])
      ]
      =
      r.ROLE||"";

    }
  );

  return{
    status:"OK",
    sum,
    g12,
    g23,
    g13,
    tags,
    roles
  };

}

function calcSleipnir(){

  let p=
    byHorse(APP.past);

  let map={};

  let candidates=
    APP.horses.filter(
      h=>{

        let pop=
          num(h["人気"]);

        return(
          pop!==null &&
          pop>=7 &&
          pop<=9
        );

      }
    );

  let checked=0;

  candidates.forEach(h=>{

    let n=
      String(h["馬番"]);

    let runs=
      (p[n]||[])
      .slice()
      .sort(
        (a,b)=>
        (num(a["走順"])??999)
        -
        (num(b["走順"])??999)
      );

    let prev=
      runs[0];

    if(
      !prev ||
      num(prev.finish)===null ||
      num(prev.gap)===null ||
      num(prev.closing_rank)===null
    ){

      map[n]={
        label:"未判定",
        reason:"前走データ不足"
      };

      return;

    }

    checked++;

    let A=
      num(prev.finish)>=8
      &&
      num(prev.gap)<=1.0
      &&
      num(prev.closing_rank)>=1
      &&
      num(prev.closing_rank)<=3;

    let S=false;
    let R=false;

    if(
      A &&
      APP.race.surface==="芝"
    ){

      let same5=
        runs
        .slice(0,5)
        .some(
          r=>
          String(r.same_class)==="1"
          &&
          num(r.gap)!==null
          &&
          num(r.gap)<=0.5
        );

      let back=
        String(
          prev.position_type||""
        )
        .toLowerCase()
        ===
        "back"
        ||
        String(
          prev.position_type||""
        )
        ===
        "後方";

      S=
        same5&&back;

      let rest=
        daysBetween(
          APP.race.date,
          prev.date
        );

      R=
        S
        &&
        rest!==null
        &&
        (
          rest<=21
          ||
          (
            rest>=36 &&
            rest<=70
          )
        );

    }

    let bc=
      num(
        h["馬体重増減"]
      );

    let label=
      "該当なし";

    if(
      R &&
      bc!==null &&
      Math.abs(bc)>=2
    ){

      label="買うSS";

    }

    else if(R){

      label="LATE-REST";

    }

    else if(S){

      label="LATE-S";

    }

    else if(A){

      label="LATE-A";

    }

    map[n]={
      label,
      reason:
        `前走${prev.finish}着 / ${prev.gap}秒差 / 上がり順位${prev.closing_rank}`
    };

  });

  APP.horses.forEach(
    h=>{

      let n=
        String(h["馬番"]);

      if(!map[n]){

        map[n]={
          label:"対象外",
          reason:"今回7〜9人気ではない"
        };

      }

    }
  );

  return{
    status:
      candidates.length===0
      ?"OK"
      :(
        checked===candidates.length
        ?"OK"
        :"PARTIAL_OK"
      ),

    map,

    candidates:
      candidates.map(
        h=>
        String(h["馬番"])
      )
  };

}

function calcMarket(){

  let m=
    APP.market;

  if(

      .values(m)
      .some(filled)
  ){

    return{
      status:"UNJUDGED",
      headLift:[],
      rescue:[],
      headSplit:""
    };

  }

  return{

    headSplit:
      String(
        m.head_split||""

      String(

      .split("|")
      .filter(Boolean),

      )
      .split("|")
      .filter(Boolean),

    ratio:

        m.quinella_vertical_ratio
      )
  };

}

function integration(
  y,
  m,
  i,
  s,
  mk,
  mainReady
){

  let map={};

  APP.horses.forEach(
    h=>{

      map[
        String(h["馬番"])
      ]={
        num:String(h["馬番"]),
        name:h["馬名"],
        score:0,
        reasons:[]
      };

    }
  );

  y.ranked
    .slice(0,6)
    .forEach(
      (r,k)=>{

        map[r.num].score+=
          RANK_POINTS[k]||0;

        map[r.num]
          .reasons
          .push(
            `安井${r.mark}`
          );

      }
    );

  m.ranked
    .slice(0,6)
    .forEach(
      (r,k)=>{

        map[r.num].score+=
          RANK_POINTS[k]||0;

        map[r.num]
          .reasons
          .push(
            `見える${r.mark}`
          );

      }
    );

  Object.entries(
    i.roles||{}
  )
  .forEach(
    ([n,role])=>{

      let pt={
        HEAD:3,
        REVERSE:2,
        SECOND:1.2,
        THIRD:.6,
        "HOLE-WIN":2.5
      }[role]||0;

      if(
        map[n] &&
        pt
      ){

        map[n].score+=pt;

        map[n]
          .reasons
          .push(
            `一撃:${role}`
          );

      }

    }
  );

  Object.entries(
    s.map||{}
  )
  .forEach(
    ([n,v])=>{

      let pt={
        "買うSS":1.5,
        "LATE-REST":1.2,
        "LATE-S":.8,
        "LATE-A":.5
      }[v.label]||0;

      if(
        map[n] &&
        pt
      ){

        map[n].score+=pt;

        map[n]
          .reasons
          .push(
            `スレ:${v.label}`
          );

      }

    }
  );

  (mk.headLift||[])
    .forEach(
      n=>{

        if(map[n]){

          map[n].score+=1.2;

          map[n]
            .reasons
            .push(
              "市場:頭支持"
            );

        }

      }
    );

  (mk.rescue||[])
    .forEach(
      n=>{

        if(map[n]){

          map[n].score+=.6;

          map[n]
            .reasons
            .push(
              "市場:救済"
            );

        }

      }
    );

  if(
    mk.headSplit &&
    map[mk.headSplit]
  ){

    map[
      mk.headSplit
    ].score-=1;

    map[
      mk.headSplit
    ]
    .reasons
    .push(
      "市場:頭割れ"
    );

  }

  let ranked=
    Object
    .values(map)
    .sort(
      (a,b)=>
      b.score-a.score
    );

  ranked.forEach(
    (r,k)=>
      r.mark=
        mainReady &&
        k<6
        ? MARKS[k]
        : ""
  );

  return ranked;

}
