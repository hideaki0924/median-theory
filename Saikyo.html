<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>競馬4エンジン統合アプリ V0.29</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#d9dee8;--accent:#2563eb;--good:#047857;--warn:#b45309;--bad:#b91c1c;--info:#1d4ed8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
header{position:sticky;top:0;z-index:10;background:rgba(246,247,251,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.wrap{max-width:1180px;margin:auto;padding:14px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.span12{grid-column:span 12}.span6{grid-column:span 6}@media(max-width:800px){.span6{grid-column:span 12}}
h1{font-size:20px;margin:0 0 4px}h2{font-size:17px}.small{font-size:12px;color:var(--muted)}textarea,button{font:inherit}
textarea{width:100%;min-height:250px;border:1px solid var(--line);border-radius:10px;padding:9px}button{border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:#fff;font-weight:700}.alt{background:#4b5563}.light{background:#e5e7eb;color:#111827}
.row{display:flex;gap:8px;flex-wrap:wrap}.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:11px;background:#eef2ff;margin:2px}.good{background:#ecfdf5;color:var(--good)}.warn{background:#fffbeb;color:var(--warn)}.info{background:#eff6ff;color:var(--info)}
.engine{border-left:4px solid var(--accent)}.result{font-size:14px;line-height:1.75}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{border-bottom:1px solid var(--line);padding:7px 5px;text-align:center;white-space:nowrap}th{background:#f9fafb}
</style>
</head>
<body>
<header><div class="wrap"><h1>競馬4エンジン統合アプリ V0.29</h1><div class="small">表示を日本語化・小数第1位に統一。最終予想は◎○▲★☆△で表示。</div></div></header>
<main class="wrap"><div class="grid">

<section class="card span12">
<h2>1. チャッピーコード</h2>
<textarea id="masterCode"></textarea>
<div class="row"><button onclick="importCode()">コード読込</button><button class="alt" onclick="analyze()">4エンジン解析</button><button class="light" onclick="resetAll()">リセット</button></div>
<div id="status" class="small"></div>
</section>

<section class="card span12"><h2>2. レース</h2><div id="raceBox" class="result"></div></section>
<section class="card span6 engine"><h2>3. 安井式 V1.0</h2><div id="yasuiBox" class="result"></div></section>
<section class="card span6 engine"><h2>4. 見える男</h2><div id="mieruBox" class="result"></div></section>
<section class="card span6 engine"><h2>5. ICHIGEKI</h2><div id="ichiBox" class="result"></div></section>
<section class="card span6 engine"><h2>6. スレイプニル</h2><div id="sleiBox" class="result"></div></section>
<section class="card span12"><h2>7. 市場監査</h2><div id="marketBox" class="result"></div></section>

<section class="card span12">
<h2>8. 安井式 詳細</h2>
<div style="overflow:auto"><table id="yasuiTable"></table></div>
</section>

<section class="card span12">
<h2>9. 最終予想</h2>
<div id="finalBox" class="result"></div>
<div style="overflow:auto"><table id="mainTable"></table></div>
</section>

<section class="card span12">
<h2>10. チャッピーへ返すデータ</h2>
<div class="row"><button onclick="copyResult()">結果データをコピー</button><button class="light" onclick="copyInput()">入力コードをコピー</button></div>
<textarea id="returnData" readonly></textarea><div id="copyStatus" class="small"></div>
</section>
</div></main>

<script>
let APP={race:{},horses:[],compi:[],market:{},ichigekiHorses:[],sleipnir:[],yasuiHistory:[],newp:{}},LAST={};

const COURSE_WEIGHTS={"札幌|ダート|1700":{speed:4,stamina:3,power:4}};
const POWER_BASE={芝:{1200:45.8,1300:46.3,1400:46.8,1500:47.3,1600:47.6,1800:48.8,2000:49.2,2200:49.9,2300:49.9,2400:49.9,2500:49.6,2600:50.1,2800:50.4,3000:50.4,3200:50.5,3400:50.5,3600:50.5},
ダート:{1000:47.5,1150:48.1,1200:48.8,1300:49.3,1400:49.4,1600:49.9,1700:50.5,1800:50.8,1900:50.7,2000:50.6,2100:51.1,2400:51.4,2500:51.1}};
const TRACK_CORR={芝:{良:0,稍重:0.4,重:0.8,不良:1.2},ダート:{良:0,稍重:-0.4,重:-0.8,不良:-1.2}};

function sec(t){let o={},c="";t.split(/\r?\n/).forEach(r=>{let l=r.trim();if(!l)return;let m=l.match(/^\[([A-Z0-9_]+)\]$/i);if(m){c=m[1].toUpperCase();o[c]=[];return}if(c)o[c].push(r)});return o}
function kv(a){let o={};(a||[]).forEach(l=>{let i=l.indexOf("=");if(i>=0)o[l.slice(0,i).trim()]=l.slice(i+1).trim()});return o}
function csv(a){a=(a||[]).filter(x=>x.trim());if(!a.length)return[];let h=a[0].split(",").map(x=>x.trim());return a.slice(1).map(l=>{let v=l.split(",").map(x=>x.trim()),o={};h.forEach((k,i)=>o[k]=v[i]??"");return o})}
function filled(v){return v!==undefined&&v!==null&&String(v).trim()!==""}
function num(v){if(!filled(v))return null;let x=Number(v);return Number.isFinite(x)?x:null}
function badge(t,c=""){return `<span class="badge ${c}">${t}</span>`}
function fmt1(v){
  if(v===null||v===undefined||v==="") return "";
  let x=Number(v);
  return Number.isFinite(x)?x.toFixed(1):String(v);
}
function jpRole(v){
  const m={
    "HEAD":"頭候補",
    "REVERSE":"逆転候補",
    "SECOND":"2着候補",
    "THIRD":"3着候補",
    "HOLE-WIN":"穴1着候補",
    "NONE":"該当なし",
    "BUY-SS":"買いSS",
    "REST":"休養注目",
    "S":"S候補",
    "A":"A候補",
    "X2-S":"上位崩れ警戒 S",
    "X2-SS":"上位崩れ警戒 SS"
  };
  return m[v]||v;
}

function importCode(){
 let s=sec(masterCode.value);APP.race=kv(s.RACE);APP.market=kv(s.MARKET);APP.newp=kv(s.NEWP);APP.horses=csv(s.HORSES);APP.ichigekiHorses=csv(s.ICHIGEKI_HORSES);APP.sleipnir=csv(s.SLEIPNIR);APP.yasuiHistory=csv(s.YASUI_HISTORY);
 APP.compi=(s.COMPI||[]).map(l=>{let [n,v]=l.split(",");return {num:n?.trim(),value:num(v)}}).filter(x=>x.num&&x.value!==null);
 let cm={};APP.compi.forEach(x=>cm[x.num]=x.value);APP.horses.forEach(h=>{if(cm[String(h["馬番"])]!=null)h.COMPI=cm[String(h["馬番"])]});
 status.innerHTML=badge("読込成功","good");showRace();
}
function showRace(){let r=APP.race;raceBox.innerHTML=`${r.date||""} ${r.venue||""} ${r.race||""}R ${r.surface||""}${r.distance||""}m / ${r.field_size||APP.horses.length}頭`}

function powerVal(r){
 let surf=r.surface||APP.race.surface,dist=num(r.distance)??num(APP.race.distance),base=POWER_BASE[surf]?.[dist],l4=num(r.last4F);
 if(base===undefined||l4===null)return null;
 let fin=num(r["着順"]),margin=num(r["着差"])??0,track=r["馬場"]||"良",corr=TRACK_CORR[surf]?.[track];
 if(corr===undefined)return null;
 return 48+(l4+(fin===1?0:margin)-corr)-base;
}
function calcYasui(){
 let by={};APP.yasuiHistory.forEach(r=>(by[String(r["馬番"])]??=[]).push(r));
 let all=APP.horses.map(h=>({num:String(h["馬番"]),name:h["馬名"],speed:null,stamina:null,power:null,speedRank:null,staminaRank:null,powerRank:null,overallRank:null,overallScore:null}));
 Object.entries(by).forEach(([n,rr])=>{
   let target=APP.race.surface||"";rr=rr.filter(x=>!filled(x.surface)||x.surface===target);
   let age=num(rr[0]?.["年齢"]); if(age!==null&&age>=4)rr=[...rr].sort((a,b)=>(num(a.history_order)??999)-(num(b.history_order)??999)).slice(0,4);
   let sc=rr.filter(x=>num(x.last2F)!==null).map(x=>num(x.last2F)+(num(x["着順"])===1?0:(num(x["着差"])??0)));
   let tc=rr.filter(x=>[1,2].includes(num(x["着順"]))&&num(x.last1F)!==null).map(x=>num(x.last1F)+(num(x.class_corr)??0)+(num(x.age_corr)??0));
   let pc=rr.map(powerVal).filter(x=>x!==null);
   let o=all.find(x=>x.num===n);if(o){o.speed=sc.length?Math.min(...sc):null;o.stamina=tc.length?Math.max(...tc):null;o.power=pc.length?Math.min(...pc):null}
 });
 function rank(key,asc){
   let a=all.filter(x=>x[key]!==null).sort((x,y)=>asc?x[key]-y[key]:y[key]-x[key]);a.forEach((x,i)=>x[key+"Rank"]=i+1);
 }
 rank("speed",true);rank("stamina",false);rank("power",true);
 let w=COURSE_WEIGHTS[`${APP.race.venue||""}|${APP.race.surface||""}|${APP.race.distance||""}`];
 let complete=all.filter(x=>x.speed!==null&&x.stamina!==null&&x.power!==null);
 if(w){complete.forEach(x=>x.overallScore=(w.speed*x.speedRank+w.stamina*x.staminaRank+w.power*x.powerRank)/(w.speed+w.stamina+w.power));complete.sort((a,b)=>a.overallScore-b.overallScore);complete.forEach((x,i)=>x.overallRank=i+1)}
 let any=all.some(x=>x.speed!==null||x.stamina!==null||x.power!==null);
 return {status:any?"PARTIAL_OK":"UNJUDGED",all,complete,weights:w};
}

function calcMieru(rows){
 let keys=["timeScore","classHold","paceFit","memory","conditionGap","body","jockey","trainer","blood"];
 if(!rows.some(r=>keys.some(k=>num(r[k])!==null)))return {status:"UNJUDGED",rows:[]};
 rows.forEach(r=>{let v=k=>num(r[k])??0;r.ms=v("timeScore")*3+v("classHold")*3+v("paceFit")*2+v("memory")*3+v("conditionGap")*2+v("body")+v("jockey")*.8+v("trainer")*.8+v("blood")*.7});
 let s=[...rows].sort((a,b)=>b.ms-a.ms);s.forEach((r,i)=>r.mo=i+1);return {status:"OK",rows:s};
}
function calcIchi(){
 let roles={};APP.ichigekiHorses.forEach(r=>roles[String(r["馬番"])]=r.ROLE||"");
 if(APP.compi.length<3)return {status:"UNJUDGED",roles,tags:[]};
 let s=[...APP.compi].sort((a,b)=>b.value-a.value),sum=s[0].value+s[1].value+s[2].value,g12=s[0].value-s[1].value,g23=s[1].value-s[2].value,g13=s[0].value-s[2].value,t=[];if(g23>=6)t.push("X2-S");
 return {status:"OK",roles,tags:t,sum,g12,g23,g13};
}
function calcSlei(){
 if(!APP.sleipnir.length)return {status:"UNJUDGED",map:{}};
 let map={};APP.sleipnir.forEach(r=>{let a=num(r.LATE_A),s=num(r.LATE_S),re=num(r.LATE_REST),bc=num(r.BODY_CHANGE),lv="NONE";if(re===1&&bc!==null&&Math.abs(bc)>=2)lv="BUY-SS";else if(re===1)lv="REST";else if(s===1)lv="S";else if(a===1)lv="A";map[String(r["馬番"])]=lv});return {status:"OK",map};
}
function calcMarket(){
 let m=APP.market;if(!Object.values(m).some(filled))return {status:"UNJUDGED",rescue:[]};
 return {status:"OK",rescue:(m.market_rescue||"").split("|").filter(Boolean),headSplit:m.head_split||"",headLift:(m.head_lift||"").split("|").filter(Boolean),confidence:m.favorite_confidence||""};
}

function analyze(){
 let rows=APP.horses.map(x=>({...x})),y=calcYasui(),m=calcMieru(rows),i=calcIchi(),s=calcSlei(),mk=calcMarket();LAST={y,m,i,s,mk,rows};

 yasuiBox.innerHTML=y.status==="UNJUDGED"?badge("未判定","warn")+" 履歴なし":
 `${badge("軸別判定OK","good")} SPEED/STAMINA/POWERを個別評価<br>`+
 y.complete.length?`総合順位対象 ${y.complete.length}頭`:`総合順位対象なし（3軸揃い待ち）`;

 yasuiTable.innerHTML=`<tr><th>馬</th><th>SPEED</th><th>S順位</th><th>STAMINA</th><th>T順位</th><th>POWER</th><th>P順位</th><th>総合</th></tr>`+
 y.all.map(x=>`<tr><td>${x.num} ${x.name}</td><td>${x.speed===null?"N/A":fmt1(x.speed)}</td><td>${x.speedRank??"-"}</td><td>${x.stamina===null?"N/A":fmt1(x.stamina)}</td><td>${x.staminaRank??"-"}</td><td>${x.power===null?"N/A":fmt1(x.power)}</td><td>${x.powerRank??"-"}</td><td>${x.overallRank??"N/A"}</td></tr>`).join("");

 mieruBox.innerHTML=m.status==="OK"?m.rows.slice(0,8).map(r=>`${r.mo}位 #${r["馬番"]} ${r["馬名"]} ${r.ms.toFixed(1)}`).join("<br>"):badge("未判定","warn");
 ichiBox.innerHTML=i.status==="OK"?`上位3合計 ${i.sum} / 差 ${i.g12}-${i.g23}-${i.g13}<br>${i.tags.map(t=>badge(jpRole(t),"warn")).join(" ")}<br>${Object.entries(i.roles).map(([n,r])=>`#${n} ${badge(jpRole(r),"info")}`).join("<br>")}`:badge("未判定","warn");
 sleiBox.innerHTML=s.status==="OK"?Object.entries(s.map).map(([n,v])=>`#${n} ${badge(jpRole(v),v==="NONE"?"info":"warn")}`).join("<br>"):badge("未判定","warn");
 marketBox.innerHTML=mk.status==="OK"?`${badge("市場OK","good")} ${mk.confidence?`安心度 ${mk.confidence}`:""}<br>${mk.headSplit?`HEAD-SPLIT #${mk.headSplit}<br>`:""}${mk.headLift.length?`HEAD-LIFT ${mk.headLift.map(x=>"#"+x).join(" ")}<br>`:""}${mk.rescue.length?`RESCUE ${mk.rescue.map(x=>"#"+x).join(" ")}`:""}`:badge("未判定","warn");

 // V0.28 最終予想：途中ラベルを人間向けの印に変換
 let horseMap={};
 APP.horses.forEach(h=>{
   let n=String(h["馬番"]), yy=y.all.find(x=>x.num===n), mm=m.rows.find(x=>String(x["馬番"])===n);
   let score=0, reasons=[];
   // COMPI
   let compi=h.COMPI??null;
   if(compi!==null){ if(compi>=75){score+=3;reasons.push("COMPI上位");} else if(compi>=65){score+=2;} else if(compi>=55){score+=1;} }
   // 安井：総合がなくても各軸上位を使う
   if(yy){
     if(yy.overallRank===1){score+=4;reasons.push("安井総合1位");}
     else if(yy.overallRank&&yy.overallRank<=3){score+=3;reasons.push("安井総合上位");}
     let axisTop=[yy.speedRank,yy.staminaRank,yy.powerRank].filter(v=>v&&v<=3).length;
     if(axisTop>=2){score+=3;reasons.push("安井MULTI");}
     else if(axisTop===1){score+=1.5;reasons.push("安井1軸上位");}
   }
   // 見える男
   if(mm){
     if(mm.mo===1){score+=4;reasons.push("見える1位");}
     else if(mm.mo<=3){score+=3;reasons.push("見える上位");}
     else if(mm.mo<=6){score+=1.5;}
   }
   // ICHIGEKI
   let role=i.roles[n]||"";
   if(role==="HEAD"){score+=4;reasons.push("ICHIGEKI HEAD");}
   else if(role==="REVERSE"){score+=3;reasons.push("ICHIGEKI逆転");}
   else if(role==="HOLE-WIN"){score+=3;reasons.push("ICHIGEKI穴1着");}
   else if(role==="SECOND"){score+=1.5;}
   else if(role==="THIRD"){score+=0.8;}
   // スレイプニル
   let sl=s.map[n]||"";
   if(sl==="BUY-SS"){score+=3;reasons.push("SLEIPNIR BUY-SS");}
   else if(sl==="REST"){score+=2;}
   else if(sl==="S"){score+=1.5;}
   else if(sl==="A"){score+=1;}
   // 市場
   if(mk.headLift.includes(n)){score+=2.5;reasons.push("市場HEAD-LIFT");}
   if(mk.rescue.includes(n)){score+=1.5;reasons.push("市場RESCUE");}
   if(mk.headSplit===n){score-=2;reasons.push("市場HEAD-SPLIT");}
   horseMap[n]={h,yy,mm,score,reasons,role,sl};
 });
 let ranked=Object.values(horseMap).sort((a,b)=>b.score-a.score || (b.h.COMPI??0)-(a.h.COMPI??0));
 const marks=["◎","○","▲","★","☆","△"];
 ranked.forEach((x,k)=>x.mark=k<marks.length?marks[k]:"");
 let yasuiComplete=y.complete.length===APP.horses.length;
 let mode=y.status==="UNJUDGED"?"安井未入力・暫定統合":(yasuiComplete?"正式統合":"安井部分判定・暫定統合");
 let top=ranked.slice(0,6);
 let head=ranked.filter(x=>["HEAD","REVERSE","HOLE-WIN"].includes(x.role)||x.mark==="◎").slice(0,4);
 let second=ranked.filter(x=>["HEAD","REVERSE","SECOND","HOLE-WIN"].includes(x.role)||x.score>=ranked[4]?.score).slice(0,6);
 let third=ranked.filter(x=>x.score>=ranked[Math.min(7,ranked.length-1)]?.score || ["THIRD","SECOND"].includes(x.role)).slice(0,8);
 finalBox.innerHTML=
   `${badge(mode,yasuiComplete?"good":"warn")}<br>`+
   `<div style="font-size:22px;font-weight:800;margin:10px 0">${top.map(x=>`${x.mark}${x.h["馬番"]} ${x.h["馬名"]}`).join("　")}</div>`+
   `<b>1着候補</b> ${head.map(x=>"#"+x.h["馬番"]).join("・")}<br>`+
   `<b>2着候補</b> ${second.map(x=>"#"+x.h["馬番"]).join("・")}<br>`+
   `<b>3着候補</b> ${third.map(x=>"#"+x.h["馬番"]).join("・")}<br>`+
   `<span class="small">※HEAD/REVERSE等は内部材料。表では最終印に変換して表示します。</span>`;
 mainTable.innerHTML=`<tr><th>印</th><th>馬</th><th>統合点</th><th>COMPI</th><th>安井</th><th>見える</th><th>主な根拠</th></tr>`+
 ranked.map(x=>`<tr><td>${x.mark}</td><td>${x.h["馬番"]} ${x.h["馬名"]}</td><td>${x.score.toFixed(1)}</td><td>${x.h.COMPI??"-"}</td><td>${x.yy?.overallRank??"部分"}</td><td>${x.mm?.mo??"-"}</td><td style="text-align:left;white-space:normal">${x.reasons.join(" / ")}</td></tr>`).join("");
 LAST.ranked=ranked; LAST.mode=mode;
 buildReturn();
}
function buildReturn(){
 let t=`CHATPY_APP_RESULT_V5\n[RACE]\n${APP.race.date||""},${APP.race.venue||""},${APP.race.race||""}R,${APP.race.surface||""},${APP.race.distance||""}m,${APP.race.field_size||APP.horses.length}頭\n\n[ENGINE_STATUS]\nYASUI=${LAST.y.status}\nMIERU=${LAST.m.status}\nICHIGEKI=${LAST.i.status}\nSLEIPNIR=${LAST.s.status}\nMARKET=${LAST.mk.status}\n\n[YASUI]\n馬番,SPEED,S順位,STAMINA,T順位,POWER,P順位,総合順位\n`;
 LAST.y.all.forEach(x=>t+=`${x.num},${x.speed===null?"":fmt1(x.speed)},${x.speedRank??""},${x.stamina===null?"":fmt1(x.stamina)},${x.staminaRank??""},${x.power===null?"":fmt1(x.power)},${x.powerRank??""},${x.overallRank??""}\n`);
 t+=`\n[FINAL_PREDICTION]\nMODE=${LAST.mode||""}\n印,馬番,馬名,統合点\n`;
 (LAST.ranked||[]).slice(0,6).forEach(x=>t+=`${x.mark},${x.h["馬番"]},${x.h["馬名"]},${x.score.toFixed(1)}\n`);
 t+=`\n[HORSE_RESULT]\n馬番,馬名,COMPI,見える順位,ICHIGEKI,スレイプニル,市場\n`;
 APP.horses.forEach(h=>{let n=String(h["馬番"]),mm=LAST.m.rows.find(x=>String(x["馬番"])===n),mkTag=LAST.mk.rescue.includes(n)?"RESCUE":LAST.mk.headLift.includes(n)?"HEAD-LIFT":LAST.mk.headSplit===n?"HEAD-SPLIT":"";t+=`${n},${h["馬名"]},${h.COMPI??""},${mm?.mo??""},${LAST.i.roles[n]||""},${LAST.s.map[n]||""},${mkTag}\n`});
 returnData.value=t;
}
async function copyResult(){if(!returnData.value.trim())analyze();try{await navigator.clipboard.writeText(returnData.value);copyStatus.textContent="結果データをコピーしました"}catch(e){returnData.select();document.execCommand("copy")}}
async function copyInput(){try{await navigator.clipboard.writeText(masterCode.value);copyStatus.textContent="入力コードをコピーしました"}catch(e){masterCode.select();document.execCommand("copy")}}
function resetAll(){location.reload()}
</script>
</body></html>
