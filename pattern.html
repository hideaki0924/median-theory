<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>競馬メジアン V5.36 馬連順位復元・完成版作成</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07101f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;padding:16px;line-height:1.6}
main{max-width:720px;margin:auto}
.card{background:#10224a;border:2px solid #22d3ee;border-radius:18px;padding:16px;margin:12px 0}
h1{font-size:24px;line-height:1.35;margin:0 0 14px}
label,button{display:block;width:100%;border:0;border-radius:14px;padding:14px;margin-top:12px;font-size:17px;font-weight:900;text-align:center}
label{background:#3b82f6;cursor:pointer}
button{background:#22c55e;color:#052e16;cursor:pointer}
button:disabled{background:#475569;color:#cbd5e1;cursor:not-allowed}
input{display:none}
pre{white-space:pre-wrap;background:#020617;padding:12px;border-radius:12px;color:#cbd5e1;font-size:13px}
.ok{color:#86efac;font-weight:900}
.warn{color:#fb7185;font-weight:900}
.small{font-size:13px;color:#cbd5e1}
</style>
</head>
<body><main>
<h1>競馬メジアン V5.36<br>馬連順位だけ復元</h1>

<div class="card">
  <b>手作業の継ぎ足しは不要です。</b><br>
  今使っているV5.36完成版HTMLを選び、緑のボタンを押すだけです。
  <label for="file">今使っているV5.36 HTMLを選ぶ</label>
  <input id="file" type="file" accept=".html,text/html">
  <div id="name" class="small" style="margin-top:9px">まだ選択されていません</div>
  <button id="go" disabled>修正版の完成HTMLを作成</button>
</div>

<div class="card">
<b>変更するのは馬連順位の土台だけ</b>
<pre>・馬連表の先頭は必ず単勝1番人気
・単勝1番人気を含む馬連だけをオッズ順に並べる
・馬連1.8倍壁も同じ軸列で計算
・書籍原型のタテ目計算は従来どおり
・全馬タテ目倍率は従来どおり
・表の大きさ、色、配置、その他ロジックは変更しない</pre>
</div>

<div id="status" class="card">待機中</div>

<script>
'use strict';

const fileEl=document.getElementById('file');
const goEl=document.getElementById('go');
const nameEl=document.getElementById('name');
const statusEl=document.getElementById('status');
let selected=null;

fileEl.addEventListener('change',()=>{
  selected=fileEl.files&&fileEl.files[0];
  nameEl.textContent=selected?selected.name:'まだ選択されていません';
  goEl.disabled=!selected;
});

function fail(msg){throw new Error(msg)}

goEl.addEventListener('click',async()=>{
  try{
    if(!selected)fail('先にV5.36のHTMLを選んでください。');
    let src=await selected.text();

    if(!/競馬メジアン/.test(src))fail('競馬メジアンのHTMLとして確認できません。');
    if(!/function\s+build\s*\(/.test(src))fail('本体のbuild関数が見つかりません。');
    if(!/V5\.36/.test(src))fail('V5.36の完成版HTMLを選んでください。');

    const helper = `
/* V5.36.1 馬連順位復元
   馬連表は必ず単勝1番人気を軸にし、
   その馬を含む馬連の相手をオッズ昇順で並べる。
*/
function rankUmaByTanFav(list,fav,fallback=[]){
  fav=String(fav||'');
  if(!fav)return rankPairs(list);

  const rows=sorted(list)
    .filter(p=>String(p.a)===fav||String(p.b)===fav);

  if(!rows.length)return rankPairs(list);

  const mates=uniq(rows.map(p=>
    String(p.a)===fav?String(p.b):String(p.a)
  ));

  const allHorses=uniq([
    ...list.flatMap(p=>[String(p.a),String(p.b)]),
    ...fallback.map(String)
  ]);

  return uniq([
    fav,
    ...mates,
    ...allHorses.filter(h=>h!==fav&&!mates.includes(h))
  ]);
}
`;

    if(!src.includes('function rankUmaByTanFav(')){
      const rankPairsRe=/function rankPairs\(list\)\{[\s\S]*?\n\}/;
      const m=src.match(rankPairsRe);
      if(!m)fail('rankPairs関数が見つからないため、安全に修正できません。');
      src=src.replace(rankPairsRe,m[0]+helper);
    }

    const oldRankLine='const tr=tan.map(x=>x.h),fr=fuku.map(x=>x.h),ur=rankPairs(d.uma),wr=rankPairs(d.wide),sr=rankTri(d.san);';
    const newRankLine=`const tr=tan.map(x=>x.h),fr=fuku.map(x=>x.h);
  const ur=rankUmaByTanFav(d.uma,tr[0],cr);
  const wr=rankPairs(d.wide),sr=rankTri(d.san);`;

    if(src.includes(oldRankLine)){
      src=src.replace(oldRankLine,newRankLine);
    }else if(!src.includes('const ur=rankUmaByTanFav(d.uma,tr[0],cr);')){
      fail('馬連順位の元コードが想定と違うため、変更を中止しました。');
    }

    const oldUv='const uv={};sorted(d.uma).forEach(p=>[p.a,p.b].forEach(h=>{if(uv[h]==null)uv[h]=p.od}));';
    const newUv=`const uv={};
  if(tr[0]){
    const fav=String(tr[0]);
    sorted(d.uma)
      .filter(p=>String(p.a)===fav||String(p.b)===fav)
      .forEach(p=>{
        const mate=String(p.a)===fav?String(p.b):String(p.a);
        if(uv[fav]==null)uv[fav]=p.od;
        if(uv[mate]==null)uv[mate]=p.od;
      });
  }`;

    if(src.includes(oldUv)){
      src=src.replace(oldUv,newUv);
    }else if(!src.includes("const fav=String(tr[0]);")){
      fail('馬連壁の元コードが想定と違うため、変更を中止しました。');
    }

    src=src.replace(/<meta name="app-build" content="[^"]*">/,
      '<meta name="app-build" content="V5.36.1-umaren-tanfav-axis-restored">');
    src=src.replace(/<title>[^<]*<\/title>/,
      '<title>競馬メジアン V5.36.1 馬連順位復元版</title>');

    src=src.replace(/V5\.36解析/g,'V5.36.1解析');
    src=src.replace(/<span class="tag">V5\.36<\/span>/g,'<span class="tag">V5.36.1</span>');
    src=src.replace(/競馬メジアン V5\.36 中央統合/g,'競馬メジアン V5.36.1 中央統合');
    src=src.replace(/競馬メジアン V5\.36(?=[^.\d])/g,'競馬メジアン V5.36.1');

    const checks=[
      src.includes('function rankUmaByTanFav('),
      src.includes('const ur=rankUmaByTanFav(d.uma,tr[0],cr);'),
      src.includes("const fav=String(tr[0]);"),
      src.includes('V5.36.1-umaren-tanfav-axis-restored')
    ];
    if(checks.some(x=>!x))fail('最終確認に失敗したため、ファイルは作成していません。');

    const blob=new Blob([src],{type:'text/html;charset=utf-8'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='競馬メジアン_V5.36.1_馬連順位復元_完成版.html';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1500);

    statusEl.innerHTML=
      '<span class="ok">修正版の完成HTMLを保存しました。</span><br>'+
      'ファイル名：競馬メジアン_V5.36.1_馬連順位復元_完成版.html<br>'+
      '<span class="small">元のV5.36ファイルは変更していません。</span>';
  }catch(e){
    statusEl.innerHTML='<span class="warn">'+String(e.message||e)+'</span>';
  }
});
</script>
</main></body></html>
