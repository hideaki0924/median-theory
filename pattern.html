<main>
<h1>競馬メジアン <span class="tag">V5.33</span><br>中央統合・五市場順位壁完全復旧・コンパクト版</h1>

<div class="card pipeline">
  <div class="title">🔁 V5.28の判定工程</div>
  <div class="step"><span class="stepNo">1</span><b>コンピだけで原型予想</b><div class="small">固定1着候補・馬券内軸・頭替わり・上位本線・3着侵入候補を先に保存。</div></div>
  <div class="step"><span class="stepNo">2</span><b>上位4頭密集／一強・相手横並び／壁直後侵入</b><div class="small">今日の検証を正式ロジック化。上位で1・2着、壁直後～6位を3着監査。</div></div>
  <div class="step"><span class="stepNo">3</span><b>市場は順位ではなく役割を変更</b><div class="small">コンピ順位は保存したまま、軸・頭候補・相手・保険・3着穴の役割だけを変更する。</div></div>
  <div class="step"><span class="stepNo">4</span><b>コンピ型の順位帯をガードレール化</b><div class="small">型ごとの1着・連対・3着許容順位を先に固定し、市場はその範囲内で役割だけ変更する。</div></div>
</div>

<script>
'use strict';
let latest=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const zen=s=>String(s||'').replace(/[０-９]/g,x=>String.fromCharCode(x.charCodeAt(0)-65248)).replace(/．/g,'.').replace(/[－ー―−]/g,'-').replace(/　/g,' ');
const nums=s=>(zen(s).match(/\d+(?:\.\d+)?/g)||[]).map(Number);
const uniq=a=>[...new Set((a||[]).filter(Boolean).map(String))];
const sorted=(a,k='od')=>a.slice().sort((x,y)=>Number(x[k])-Number(y[k]));
const pairKey=(a,b)=>[String(a),String(b)].sort((x,y)=>+x-+y).join('-');
const triKey=(a,b,c)=>[String(a),String(b),String(c)].sort((x,y)=>+x-+y).join('-');
const fmt=a=>a&&a.length?a.map(x=>x+'番').join('・'):'なし';

function parse(raw){
  const lines=zen(raw).split(/\r?\n/),d={title:'レース',tf:[],uma:[],wide:[],san:[],compi:[]};let sec='';
  for(let line of lines){
    line=line.trim();if(!line)continue;
    if(line.startsWith('【'))d.title=line.replace(/[【】]/g,'');
    const up=line.toUpperCase();
    if(up.startsWith('[')){
      if(up.includes('COMPI'))sec='C';
      else if(up.includes('TAN')||up.includes('単'))sec='TF';
      else if(up.includes('WIDE')||up.includes('ワイド'))sec='W';
      else if(up.includes('SAN')||up.includes('三')||up.includes('3'))sec='S';
      else if(up.includes('UMA')||up.includes('馬')||up.includes('2'))sec='U';
      continue;
    }
    const n=nums(line);
    if(sec==='TF'&&n.length>=2)d.tf.push({h:String(Math.floor(n[0])),tan:n[1],fuku:n.length>=3?n[n.length-1]:null});
    if(sec==='C'&&n.length>=2)d.compi.push({h:String(Math.floor(n[0])),pt:n[1],rec:/(推奨|推薦|推\b|赤|★|◎)/.test(line)});
    if(sec==='U'){const m=line.match(/(\d+)\s*-\s*(\d+)/);if(m&&n.length)d.uma.push({a:m[1],b:m[2],od:n[n.length-1]})}
    if(sec==='W'){const m=line.match(/(\d+)\s*-\s*(\d+)/);if(m&&n.length)d.wide.push({a:m[1],b:m[2],od:n[n.length-1]})}
    if(sec==='S'){const m=line.match(/(\d+)\s*-\s*(\d+)\s*-\s*(\d+)/);if(m&&n.length)d.san.push({a:m[1],b:m[2],c:m[3],od:n[n.length-1]})}
  }
  return d;
}
function pClass(sum){return sum<=205?'P1':sum<=209?'P2':sum<=213?'P3':sum<=216?'P4':sum<=219?'P5':'P6'}
function pDetail(p,type,ctx){
  const {g13,firstMajor,g56,top1}=ctx;
  let code=p+'-S',name='標準構造型',feature='上位構造と壁位置を併用して判断';
  if(type==='上位4頭密集・頭替わり型'){
    code=p+'-A';name='上位4頭密集・頭替わり型';
    feature='1着固定なし／上位4頭の頭替わり／5～6位と壁直後を3着監査';
  }else if(type==='一強・相手横並び型'){
    code=p+'-B';name='一強・相手横並び型';
    feature='コンピ1位を馬券内軸／2・3着の横並びと壁穴を重視';
  }else if(type==='一強・相手入替型'){
    code=p+'-C';name='一強・相手入替型';
    feature='1位の固定性は高め／相手順位は市場で役割変更';
  }else if(type==='上位核＋壁直後侵入型'){
    code=p+'-D';name='上位核＋壁直後侵入型';
    feature='壁前を上位核／壁直後を3着侵入候補として強制監査';
  }else if(type==='大谷式大穴型'){
    code=p+'-E';name='大谷式・大穴警戒型';
    feature='大谷3条件成立／上位固定を弱め中位・壁前後を保護';
  }else if(type==='低P・上位崩れ警戒型'){
    code=p+'-F';name='低P・上位崩れ警戒型';
    feature='上位合計が低い／固定軸を作らず下位侵入まで監査';
  }else if(type==='上位5頭ロック型'){
    code=p+'-G';name='上位5頭ロック型';
    feature='5位後の壁を境に上位5頭内決着を優先';
  }else if(top1>=85&&g13>=18){
    code=p+'-B';name='一強・相手荒れ型';
    feature='1位能力抜け／相手だけ崩れる形を優先';
  }else if(firstMajor&&firstMajor.after<=4){
    code=p+'-D';name='前半壁・侵入監査型';
    feature='前半の強い壁前後で役割を分離';
  }else if(g56!=null&&g56>=8){
    code=p+'-G';name='上位5頭境界型';
    feature='5位－6位の境界を決着圏の目安にする';
  }
  return {code,name,feature};
}
function medianHorses(arr){if(!arr.length)return[];return arr.length%2?[arr[Math.floor(arr.length/2)]]:[arr[arr.length/2-1],arr[arr.length/2]]}
function rankMap(arr){return Object.fromEntries(arr.map((h,i)=>[h,i+1]))}
function rankPairs(list){
  const s={};sorted(list).forEach((p,i)=>[p.a,p.b].forEach(h=>{s[h]=s[h]||{h,c:0,b:999,z:0};s[h].c++;s[h].b=Math.min(s[h].b,i+1);s[h].z+=i+1}));
  return Object.values(s).sort((x,y)=>y.c-x.c||x.b-y.b||x.z-y.z||+x.h-+y.h).map(x=>x.h);
}
function rankTri(list){
  const s={};sorted(list).forEach((p,i)=>[p.a,p.b,p.c].forEach(h=>{s[h]=s[h]||{h,c:0,b:999,z:0};s[h].c++;s[h].b=Math.min(s[h].b,i+1);s[h].z+=i+1}));
  return Object.values(s).sort((x,y)=>y.c-x.c||x.b-y.b||x.z-y.z||+x.h-+y.h).map(x=>x.h);
}
function ratioWalls(rank,values,ratio=1.8){
  const out=[];
  for(let i=0;i<rank.length-1;i++){
    const a=Number(values[rank[i]]),b=Number(values[rank[i+1]]);
    if(a>0&&b/a>=ratio)out.push({idx:i,before:rank[i],next:rank[i+1],ratio:+(b/a).toFixed(2)});
  }
  return out;
}
function thresholdWall(rank,values,limit){
  let idx=-1;rank.forEach((h,i)=>{if(Number(values[h])<=limit)idx=i});
  return idx>=0&&idx<rank.length-1?{idx,before:rank[idx],next:rank[idx+1]}:null;
}
function addTri(arr,a,b,c){if(a&&b&&c&&new Set([a,b,c]).size===3){const k=triKey(a,b,c);if(!arr.includes(k))arr.push(k)}}
function addPair(arr,a,b){if(a&&b&&a!==b){const k=pairKey(a,b);if(!arr.includes(k))arr.push(k)}}

function typeRankRange(type,p,ctx){
  const n=ctx.n||18;
  let head=[1,2,3], place=[1,2,3,4,5], third=[1,2,3,4,5,6,7], note='標準型：上位中心';
  if(type==='一強・相手横並び型'){
    head=[1,2,3]; place=[1,2,3,4,5,6]; third=[1,2,3,4,5,6,7,8];
    note='コンピ1位を残し、相手は2～6位、3着は8位まで監査';
  }else if(type==='一強・相手入替型'){
    head=[1,2,3]; place=[1,2,3,4,5]; third=[1,2,3,4,5,6,7];
    note='頭は原則1～3位。5位以下の市場人気馬は相手止まり';
  }else if(type==='上位4頭密集・頭替わり型'){
    head=[1,2,3,4]; place=[1,2,3,4,5,6]; third=[1,2,3,4,5,6,7,8];
    note='上位4頭は全頭頭候補。壁直後～8位を3着監査';
  }else if(type==='上位核＋壁直後侵入型'){
    const wallAfter=Math.max(1,Math.min(n,ctx.firstMajor?.after||3));
    head=Array.from({length:Math.min(4,wallAfter)},(_,i)=>i+1);
    place=Array.from({length:Math.min(n,wallAfter+2)},(_,i)=>i+1);
    third=Array.from({length:Math.min(n,wallAfter+4)},(_,i)=>i+1);
    note=`壁前${wallAfter}位までを頭核、壁直後から${Math.min(n,wallAfter+4)}位を侵入監査`;
  }else if(type==='上位5頭ロック型'){
    head=[1,2,3,4,5]; place=[1,2,3,4,5]; third=[1,2,3,4,5,6];
    note='1～5位を主戦場。6位は3着侵入まで';
  }else if(type==='大谷式大穴型'||type==='低P・上位崩れ警戒型'){
    head=Array.from({length:Math.min(n,7)},(_,i)=>i+1);
    place=Array.from({length:Math.min(n,9)},(_,i)=>i+1);
    third=Array.from({length:Math.min(n,12)},(_,i)=>i+1);
    note='上位崩れ型。頭7位・連対9位・3着12位まで拡張';
  }
  if((p==='P1'||p==='P2')&&!type.includes('一強')){
    head=Array.from({length:Math.max(head.length,Math.min(n,6))},(_,i)=>i+1);
    place=Array.from({length:Math.max(place.length,Math.min(n,8))},(_,i)=>i+1);
    third=Array.from({length:Math.max(third.length,Math.min(n,10))},(_,i)=>i+1);
    note+='／低P補正で下位レンジ拡張';
  }
  return {head,place,third,note,headMax:Math.max(...head),placeMax:Math.max(...place),thirdMax:Math.max(...third)};
}

function build(d){
  const compi=d.compi.slice().sort((a,b)=>b.pt-a.pt||+a.h-+b.h),cr=compi.map(x=>x.h),n=compi.length;
  const sum=compi.slice(0,3).reduce((s,x)=>s+x.pt,0),p=pClass(sum);
  const gaps=[],compiWalls=[];
  for(let i=0;i<n-1;i++){
    const gap=compi[i].pt-compi[i+1].pt;
    const w={after:i+1,gap,before:compi[i].h,next:compi[i+1].h,level:gap>=10?'大壁':gap>=7?'中壁':gap>=4?'小壁':'平坦'};
    gaps.push(w);compiWalls.push(w);
  }
  const maxGap=gaps.slice().sort((a,b)=>b.gap-a.gap||a.after-b.after)[0]||{after:0,gap:0,before:'',next:''};
  const strongCompiWalls=compiWalls.filter(w=>w.gap>=7).sort((a,b)=>b.gap-a.gap||a.after-b.after);
  const firstMajor=compiWalls.find(x=>x.gap>=10)||compiWalls.find(x=>x.gap>=7)||null;
  const compiTiers=[];let tier=[];
  compi.forEach((x,i)=>{tier.push(x.h);if(i===n-1||(compiWalls[i]&&compiWalls[i].gap>=7)){compiTiers.push(tier);tier=[]}});
  const g12=n>1?compi[0].pt-compi[1].pt:null,g23=n>2?compi[1].pt-compi[2].pt:null,g13=n>2?compi[0].pt-compi[2].pt:null;

  const groups={A1:cr.slice(0,2),A2:cr.slice(2,5),B:cr.slice(5,10),C:cr.slice(10)};

  const linePos=Math.max(1,Math.min(n,Math.ceil(n*0.75))),lineHorse=compi[linePos-1];
  const otaniRules=[
    {name:'コンピ1位78以下',ok:!!compi[0]&&compi[0].pt<=78},

  let type='標準上位型',fixed='中',place='2～3着',why=[];

  }

  // A群メジアン補正
  const aMedianSupport=aMedian.filter(h=>support(h)>=2||(rm.san[h]||99)<=8||(rm.uma[h]||99)<=7);
  const pMedianMode=(p==='P1'||p==='P2')&&otani<=1?'A群内組替え優先':(otani===3?'下位侵入優先':'上下併用');
  const aDecisionPressure=(a2Density==='強'&&aMedianSupport.length)?'強':(a2Density!=='弱'||aMedianSupport.length)?'中':'弱';
  const aNo1Candidates=[];
  const sanOdds={};sorted(d.san).forEach(x=>sanOdds[triKey(x.a,x.b,x.c)]=x.od);
  for(let i=0;i<groupA.length;i++)for(let j=i+1;j<groupA.length;j++)for(let k=j+1;k<groupA.length;k++){
    const hs=[groupA[i],groupA[j],groupA[k]],key=triKey(...hs);

  }
  aNo1Candidates.sort((a,b)=>a.market-b.market||b.support-a.support);
  const aNo1Insurance=aNo1Candidates[0]?.key||'';
  const no1InsuranceOn=!!aNo1Insurance&&aMedianSupport.length>0&&((p==='P1'||p==='P2')||a2Density==='強'||fixed==='高');

  // ステルス
  const appearCount=(list,h,limit)=>sorted(list).slice(0,limit).reduce((n,x)=>n+([x.a,x.b,x.c].filter(Boolean).includes(h)?1:0),0);
  const stealth=cr.map(h=>{

  const win5Main=win5.slice(0,fixed==='高'?2:3),win5Hole=win5.filter(h=>(rm.compi[h]||99)>=5||(rm.tan[h]||99)>=5).slice(0,2);

  const matchanHole=uniq([...bSupport,walls.f15?.before,walls.t80?.before,...all.filter(x=>(rm.tan[x.h]||99)>=4&&(rm.tan[x.h]||99)<=9&&support(x.h)>=2).map(x=>x.h)]).filter(h=>h&&!matchanMain.includes(h)).slice(0,3);

  const protect=uniq([...stealthProtect,...marketMain,...marketThird,...groups.A2,...third,...win5,...strongCompiWalls.flatMap(w=>[w.before,w.next]),...aMedianSupport,...high85]).filter(h=>h&&h!==structureAxis).slice(0,14);

    if((rm.compi[h]||99)>=6&&support(h)>=2)gates.push('市場逆行');
    if(x.reasons.includes('メジアン'))gates.push('メジアン');
    if(Number(tfMap[h]?.fuku)<=3)gates.push('WIN5');
    return {h,gates:uniq(gates)};
  }).filter(x=>x.gates.length>=3).sort((a,b)=>b.gates.length-a.gates.length||(score[b.h]?.score||0)-(score[a.h]?.score||0));

  const bigHoleWin=uniq([ooareHead,...matchanHole,...bSupport]).slice(0,3);
  const bigHolePlace=uniq([...matchanHole,...marketThird,walls.f15?.before]).slice(0,4);
  const bigHoleThird=uniq([...stealthProtect,...marketThird,walls.f15?.next,walls.f6?.next,...groups.A2]).slice(0,6);

  const auditPairs=[],auditSan=[];
  const auditAxis=structureAxis||axis[0]||cr[0];
  groups.A2.slice(0,3).forEach(h=>addPair(auditPairs,auditAxis,h));
  for(let i=0;i<groups.A2.length;i++)for(let j=i+1;j<groups.A2.length;j++)addTri(auditSan,auditAxis,groups.A2[i],groups.A2[j]);
  matchanHole.slice(0,2).forEach(h=>marketMain.slice(0,2).forEach(m=>addTri(auditSan,auditAxis,m,h)));
  if(aNo1Insurance){const q=aNo1Insurance.split('-');addTri(auditSan,q[0],q[1],q[2])}
  const auditHorses=uniq([auditAxis,...high85,...aMedianSupport,...stealthProtect,...groups.A2,...matchanHole,...third,...marketThird,...protect,...strongCompiWalls.flatMap(w=>[w.before,w.next]),cr[5]]).slice(0,15);

  // 型専用買い目
  const tanBet=uniq(fixed==='高'?[first[0]]:first.slice(0,2));
  const wide=[],umaren=[],san=[];
  const betAxis=marketAxis[0]||axis[0]||cr[0],betMain=(hasOdds?marketMain:main);
  betMain.slice(0,3).forEach(h=>{addPair(wide,betAxis,h);addPair(umaren,betAxis,h)});
  (hasOdds?marketSan:compiSan).slice(0,7).forEach(k=>{if(!san.includes(k))san.push(k)});
  if(no1InsuranceOn&&!san.includes(aNo1Insurance))san.push(aNo1Insurance);
  const popularFadeSan=[];
  if(concentrationAudit.horse&&(concentrationAudit.level.includes('乖離')||concentrationAudit.level.includes('早期消滅'))){
    const fadeAxis=marketAxis[0]||axis[0]||cr[0];
    const fadePool=uniq([...marketMain,...marketInsurance,...marketThird,...main,...third]).filter(h=>h!==concentrationAudit.horse&&h!==fadeAxis);
    for(let i=0;i<fadePool.length;i++)for(let j=i+1;j<fadePool.length;j++){
      addTri(popularFadeSan,fadeAxis,fadePool[i],fadePool[j]);
      if(popularFadeSan.length>=4)break;
    }
  }
  const bestOne=san[0]||wide[0]||umaren[0]||tanBet[0]||'なし';

  return {
    d,compi,cr,sum,p,pDetailInfo,g12,g23,g13,g35,g56,g67,top4Spread,rec,gaps,maxGap,strongCompiWalls,firstMajor,compiTiers,
    groups,groupA,aMedian,aMedianSupport,a2Spread,a2Density,aDecisionPressure,pMedianMode,high85,linePos,lineHorse,otaniRules,otani,
    type,fixed,place,why,rankRange,first,axis,headAlt,main,third,compiSan,hasOdds,tr,fr,ur,wr,sr,walls,marketAxis,marketHead,marketMain,marketInsurance,marketThird,marketRole,marketMove,marketSan,marketType,
    all,bSupport,cSupport,stealth,stealthProtect,win5Main,win5Hole,matchanMain,matchanHole,structureAxis,ooareHead,axisAvoid,protect,blueWhite,bigHoleWin,bigHolePlace,bigHoleThird,
    aNo1Insurance,no1InsuranceOn,concentrationAudit,popularFadeSan,auditPairs,auditSan,auditHorses,tickets:{tan:tanBet,wide,umaren,san:san.slice(0,8),bestOne}
  };
}

function compiRow(v){
  let s='<div class="row"><div class="label">コンピ</div>';
  v.compi.forEach((x,i)=>{
    let c='sep';
    if(i<v.gaps.length){const g=v.gaps[i].gap;c+=g>=10?' big':g>=7?' mid':g>=4?' small':''}
    s+=`<div class="cell">${x.h}${x.rec?'★':''}<span class="pt">${x.pt}P</span></div>${i<v.compi.length-1?`<i class="${c}"></i>`:''}`;
  });
  return s+'</div>';
}
function simpleRow(label,arr){if(!arr.length)return'';return `<div class="row"><div class="label">${label}</div>${arr.map(h=>`<div class="cell">${h}</div>`).join('<i class="sep"></i>')}</div>`}
function marketRow(label,arr,ratioList=[],baseList=[],market='uma'){
  if(!arr.length)return'';
  const ratioPairs=new Set((ratioList||[]).map(w=>`${w.before}>${w.next}`));
  const basePairs=new Set((baseList||[]).filter(Boolean).map(w=>`${w.before}>${w.next}`));
  let s=`<div class="row"><div class="label">${label}</div>`;
  arr.forEach((h,i)=>{
    s+=`<div class="cell">${h}</div>`;
    if(i<arr.length-1){
      const pair=`${h}>${arr[i+1]}`;
      const r=ratioPairs.has(pair),b=basePairs.has(pair);
      const cls=r&&b?`doubleWall ${market}`:r?`marketWall ${market}`:b?`baseWall ${market}`:'';
      s+=`<i class="sep ${cls}"></i>`;
    }
  });
  return s+'</div>';
}
function wallText(list){
  return list&&list.length?list.map(w=>`${w.before}番→${w.next}番 ${w.ratio}倍`).join(' ／ '):'明確な比率壁なし';
}
function thresholdText(w,label){
  return w?`${label}壁前 ${w.before}番 ／ 直後 ${w.next}番`:`${label}壁なし`;
}
