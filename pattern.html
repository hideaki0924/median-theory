<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101f"><title>競馬メジアン V5.25</title><style>
:root{--bg:#07101f;--card:#10224a;--line:#475569;--y:#fde047;--c:#67e8f9;--r:#fb7185;--o:#fb923c}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:#fff}body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;padding:10px;font-size:17px;line-height:1.55}main{max-width:800px;margin:auto}h1{font-size:clamp(23px,6vw,30px);line-height:1.3}.tag{background:#be123c;border-radius:999px;padding:3px 10px;font-size:.7em}.card{background:var(--card);border:1px solid #3b82f6;border-radius:18px;padding:13px;margin:12px 0;overflow-wrap:anywhere}.title{font-size:clamp(20px,5vw,26px);font-weight:950;color:var(--y);margin-bottom:9px}textarea{width:100%;height:330px;border-radius:16px;border:2px solid #3b82f6;padding:12px;background:#f8fafc;color:#111;font:16px/1.45 monospace}button{border:0;border-radius:15px;padding:13px 16px;margin:8px 5px 3px 0;font-size:17px;font-weight:950}.go{background:#22c55e;color:#052e16}.sample{background:#3b82f6;color:#fff}.clear{background:#64748b;color:#fff}.copy{background:#8b5cf6;color:#fff}.save{background:#0891b2;color:#fff}.compi{border:3px solid #22d3ee;background:linear-gradient(145deg,#00212b,#0c4a6e,#07101f)}.market{border:3px solid #60a5fa;background:linear-gradient(145deg,#061326,#10285b,#07101f)}.audit{border:3px solid #fb7185;background:linear-gradient(145deg,#3b0a16,#881337,#07101f)}.ticket{border:3px solid #facc15;background:linear-gradient(145deg,#2b2000,#713f12,#07101f)}.type{font-size:clamp(25px,7vw,34px);font-weight:950;color:var(--y)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.meta,.role,.ticketBox,.note{background:#020617;border:1px solid var(--line);border-radius:12px;padding:9px;margin:8px 0}.metaL,.roleL,.ticketL{font-size:12px;color:#93c5fd;font-weight:950}.metaV{font-size:19px;font-weight:950}.roleV{font-size:24px;font-weight:950}.ticketV{font-size:21px;font-weight:950;line-height:1.7}.small{font-size:13px;color:#cbd5e1}.badge{display:inline-block;margin:3px;padding:4px 8px;border-radius:999px;background:#1e293b;font-weight:900}.row{display:flex;align-items:center;min-width:max-content}.scroll{overflow-x:auto;background:#061326;border-radius:13px;padding:7px}.label{width:58px;min-width:58px;font-weight:950}.cell{width:42px;min-width:42px;text-align:center;font-size:20px;font-weight:950}.pt{display:block;font-size:10px;color:#d8b4fe}.sep{width:3px;min-width:3px;height:28px;background:#35517a;border-radius:5px;margin:0 3px}.sep.big{background:var(--r);box-shadow:0 0 8px var(--r)}.sep.mid{background:#f59e0b}.sep.small{background:#22d3ee}.safe{color:#fef08a;font-weight:950}pre{white-space:pre-wrap;background:#020617;padding:10px;border-radius:12px}@media(max-width:520px){body{padding:8px}.card{padding:10px}.roleV{font-size:21px}}
</style></head><body><main><h1>競馬メジアン <span class="tag">V5.25</span><br>コンピ単独予想＋市場入替検証版</h1>
<div class="card"><div class="title">レースデータ入力</div><textarea id="input" placeholder="【川崎2R】\n\n[COMPI]\n10 73\n7 70\n3 68 推奨\n4 67\n2 54\n6 50\n\n※コンピだけでも解析できます。"></textarea><button class="go" onclick="run()">V5.25解析</button><button class="sample" onclick="sample()">サンプル</button><button class="clear" onclick="clearAll()">リセット</button><button class="copy" onclick="copyForChat()">チャッピー用コピー</button><button class="save" onclick="saveCsv()">研究CSV</button></div><div id="out"></div></main>
<script>
'use strict';let latest=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const zen=s=>String(s||'').replace(/[０-９]/g,x=>String.fromCharCode(x.charCodeAt(0)-65248)).replace(/．/g,'.').replace(/[－ー―−]/g,'-').replace(/　/g,' ');const nums=s=>(zen(s).match(/\d+(?:\.\d+)?/g)||[]).map(Number);const uniq=a=>[...new Set((a||[]).filter(Boolean).map(String))];const sorted=(a,k='od')=>a.slice().sort((x,y)=>Number(x[k])-Number(y[k]));const triKey=(a,b,c)=>[String(a),String(b),String(c)].sort((x,y)=>+x-+y).join('-');const fmt=a=>a&&a.length?a.map(x=>x+'番').join('・'):'なし';
function parse(raw){const d={title:'レース',tf:[],uma:[],wide:[],san:[],compi:[]};let sec='';for(let line of zen(raw).split(/\r?\n/)){line=line.trim();if(!line)continue;if(line.startsWith('【'))d.title=line.replace(/[【】]/g,'');const up=line.toUpperCase();if(up.startsWith('[')){if(up.includes('COMPI'))sec='C';else if(up.includes('TAN')||up.includes('単'))sec='TF';else if(up.includes('WIDE')||up.includes('ワイド'))sec='W';else if(up.includes('SAN')||up.includes('三')||up.includes('3'))sec='S';else if(up.includes('UMA')||up.includes('馬')||up.includes('2'))sec='U';continue}const n=nums(line);if(sec==='C'&&n.length>=2)d.compi.push({h:String(Math.floor(n[0])),pt:n[1],rec:/(推奨|推薦|推\b|赤|★|◎)/.test(line)});if(sec==='TF'&&n.length>=2)d.tf.push({h:String(Math.floor(n[0])),tan:n[1],fuku:n.length>=3?n[n.length-1]:null});if(sec==='U'){const m=line.match(/(\d+)\s*-\s*(\d+)/);if(m&&n.length)d.uma.push({a:m[1],b:m[2],od:n[n.length-1]})}if(sec==='W'){const m=line.match(/(\d+)\s*-\s*(\d+)/);if(m&&n.length)d.wide.push({a:m[1],b:m[2],od:n[n.length-1]})}if(sec==='S'){const m=line.match(/(\d+)\s*-\s*(\d+)\s*-\s*(\d+)/);if(m&&n.length)d.san.push({a:m[1],b:m[2],c:m[3],od:n[n.length-1]})}}return d}
function pClass(s){return s<=205?'P1':s<=209?'P2':s<=213?'P3':s<=216?'P4':s<=219?'P5':'P6'}function rankPairs(list){const s={};sorted(list).forEach((p,i)=>[p.a,p.b].forEach(h=>{s[h]=s[h]||{h,c:0,b:999,z:0};s[h].c++;s[h].b=Math.min(s[h].b,i+1);s[h].z+=i+1}));return Object.values(s).sort((x,y)=>y.c-x.c||x.b-y.b||x.z-y.z||+x.h-+y.h).map(x=>x.h)}function rankTri(list){const s={};sorted(list).forEach((p,i)=>[p.a,p.b,p.c].forEach(h=>{s[h]=s[h]||{h,c:0,b:999,z:0};s[h].c++;s[h].b=Math.min(s[h].b,i+1);s[h].z+=i+1}));return Object.values(s).sort((x,y)=>y.c-x.c||x.b-y.b||x.z-y.z||+x.h-+y.h).map(x=>x.h)}function rmap(a){return Object.fromEntries(a.map((h,i)=>[h,i+1]))}function addTri(a,x,y,z){if(x&&y&&z&&new Set([x,y,z]).size===3){const k=triKey(x,y,z);if(!a.includes(k))a.push(k)}}
function build(d){const compi=d.compi.slice().sort((a,b)=>b.pt-a.pt||+a.h-+b.h),cr=compi.map(x=>x.h),n=compi.length,sum=compi.slice(0,3).reduce((s,x)=>s+x.pt,0),p=pClass(sum);const gaps=[];for(let i=0;i<n-1;i++)gaps.push({after:i+1,gap:compi[i].pt-compi[i+1].pt,before:compi[i].h,next:compi[i+1].h});const maxGap=gaps.slice().sort((a,b)=>b.gap-a.gap||a.after-b.after)[0]||{after:0,gap:0,before:'',next:''};const firstWall=gaps.find(x=>x.gap>=10)||gaps.find(x=>x.gap>=7)||null;const g12=n>1?compi[0].pt-compi[1].pt:null,g13=n>2?compi[0].pt-compi[2].pt:null,top4=n>=4?compi[0].pt-compi[3].pt:null,rec=compi.find(x=>x.rec)?.h||'';let type='標準上位型',fixed='中',reason=[];if(n>=4&&top4<=7){type='上位4頭密集・頭替わり型';fixed='低';reason.push('上位4頭が7P以内')}else if(compi[0].pt>=85&&g13>=18){type='一強・相手横並び型';fixed='高';reason.push('1位85以上','1-3差18P以上')}else if(compi[0].pt>=80&&g13>=14){type='一強・相手入替型';fixed='中～高';reason.push('1位80以上','1-3差14P以上')}else if(firstWall&&firstWall.after<=3){type='上位核＋壁直後侵入型';fixed='中';reason.push(firstWall.after+'位後'+firstWall.gap+'P壁')}else if(p==='P1'||p==='P2'){type='低P・上位崩れ警戒型';fixed='低';reason.push('P1/P2')}else reason.push('決定的な固定条件なし');let first=[],axis=[],head=[],main=[],third=[];if(type.includes('上位4頭密集')){first=uniq([rec,...cr.slice(0,4)]).slice(0,4);axis=uniq([rec,cr[0]]).slice(0,2);head=uniq(cr.slice(0,4).filter(h=>!axis.includes(h))).slice(0,3);main=cr.slice(0,4);third=uniq([cr[4],cr[5],firstWall?.next]).slice(0,3)}else if(type.includes('一強')){first=[cr[0]];axis=[cr[0]];head=uniq([rec,cr[1],cr[2]]).filter(h=>h!==cr[0]).slice(0,2);const flat=n>=5&&compi[2].pt-compi[4].pt<=7;main=flat?uniq([cr[2],cr[3],cr[4],cr[1]]):cr.slice(1,5);third=uniq([cr[3],cr[4],firstWall?.next,cr[5]]).slice(0,4)}else{first=uniq([rec,cr[0],cr[1],cr[2]]).slice(0,3);axis=uniq([cr[0],rec]).slice(0,2);head=uniq([cr[1],cr[2],cr[3]]).filter(h=>!axis.includes(h)).slice(0,3);main=cr.slice(0,5);third=uniq([firstWall?.next,cr[3],cr[4],cr[5]]).slice(0,4)}const compiSan=[];if(type.includes('上位4頭密集')){addTri(compiSan,cr[0],cr[1],cr[2]);addTri(compiSan,cr[0],cr[1],cr[3]);addTri(compiSan,cr[0],cr[2],cr[3]);addTri(compiSan,cr[1],cr[2],cr[3]);if(cr[4])addTri(compiSan,rec||cr[0],cr[0]===rec?cr[1]:cr[0],cr[4]);if(cr[5])addTri(compiSan,rec||cr[0],cr[0]===rec?cr[1]:cr[0],cr[5])}else{const ax=cr[0],a=main[0],b=main[1],c=main[2];addTri(compiSan,ax,a,b);addTri(compiSan,ax,a,c);if(third[0])addTri(compiSan,ax,a,third[0]);if(third[1])addTri(compiSan,ax,a,third[1])}const hasOdds=d.tf.length||d.uma.length||d.wide.length||d.san.length,tr=sorted(d.tf.map(x=>({...x,od:x.tan})),'tan').map(x=>x.h),fr=sorted(d.tf.filter(x=>x.fuku!=null).map(x=>({...x,od:x.fuku})),'fuku').map(x=>x.h),ur=rankPairs(d.uma),wr=rankPairs(d.wide),sr=rankTri(d.san),rm={c:rmap(cr),t:rmap(tr),f:rmap(fr),u:rmap(ur),w:rmap(wr),s:rmap(sr)};const support=h=>[(rm.t[h]||99)<=6,(rm.f[h]||99)<=7,(rm.u[h]||99)<=7,(rm.w[h]||99)<=7,(rm.s[h]||99)<=8].filter(Boolean).length;let marketAxis=axis.slice(),marketMain=main.slice(),marketThird=third.slice(),moves=[],marketSan=compiSan.slice();if(hasOdds){const anchor=cr[0],cand=uniq([...ur.slice(0,5),...sr.slice(0,6),...wr.slice(0,5),...tr.slice(0,5)]),scored=cand.map(h=>({h,s:support(h)*10+(rm.u[h]?8-rm.u[h]:0)+(rm.s[h]?9-rm.s[h]:0)+(rm.w[h]?8-rm.w[h]:0)+(rm.c[h]?Math.max(0,7-rm.c[h]):0)})).sort((a,b)=>b.s-a.s||+a.h-+b.h);marketMain=uniq(scored.filter(x=>x.h!==anchor).map(x=>x.h)).slice(0,5);marketAxis=uniq([anchor,scored[0]?.h]).slice(0,2);const quiet=cr.filter(h=>(rm.c[h]||99)>=4&&support(h)>=2).sort((a,b)=>support(b)-support(a)||(rm.s[a]||99)-(rm.s[b]||99));marketThird=uniq([...quiet,...third,...marketMain.slice(2)]).slice(0,5);if(marketMain[0]&&marketMain[0]!==cr[1])moves.push('コンピ2位'+cr[1]+'番より市場相手'+marketMain[0]+'番を上位化');quiet.slice(0,3).forEach(h=>moves.push(h+'番を市場逆行・3着保護'));marketSan=[];addTri(marketSan,anchor,marketMain[0],marketMain[1]);addTri(marketSan,anchor,marketMain[0],marketMain[2]);if(marketThird[0])addTri(marketSan,anchor,marketMain[0],marketThird[0]);if(marketThird[1])addTri(marketSan,anchor,marketMain[0],marketThird[1]);sorted(d.san).slice(0,3).forEach(x=>addTri(marketSan,x.a,x.b,x.c))}const audit=uniq([...cr.slice(0,4),...third,...marketThird,cr[5]]).slice(0,9),best=(hasOdds?marketSan[0]:compiSan[0])||'なし';return{d,compi,cr,sum,p,g12,g13,top4,gaps,maxGap,firstWall,type,fixed,reason,rec,first,axis,head,main,third,compiSan,hasOdds,tr,fr,ur,wr,sr,marketAxis,marketMain,marketThird,moves,marketSan,audit,best}}
function cRow(v){let s='<div class="row"><div class="label">コンピ</div>';v.compi.forEach((x,i)=>{let c='sep';if(i<v.gaps.length){const g=v.gaps[i].gap;c+=g>=10?' big':g>=7?' mid':g>=4?' small':''}s+=`<div class="cell">${x.h}${x.rec?'★':''}<span class="pt">${x.pt}P</span></div>${i<v.compi.length-1?`<i class="${c}"></i>`:''}`});return s+'</div>'}function sRow(l,a){return a.length?`<div class="row"><div class="label">${l}</div>${a.map(h=>`<div class="cell">${h}</div>`).join('<i class="sep"></i>')}</div>`:''}
function render(v){return `<div class="card market"><div class="title">📊 コンピ${v.hasOdds?'＋市場':''}順位</div><div class="scroll">${cRow(v)}${sRow('馬連',v.ur)}${sRow('単勝',v.tr)}${sRow('複勝',v.fr)}${sRow('ワイド',v.wr)}${sRow('三連複',v.sr)}</div><div class="note"><b>最大壁：</b>${v.maxGap.after}位後 ${v.maxGap.gap}P（${v.maxGap.before}→${v.maxGap.next}）<br><b>最初の強い壁：</b>${v.firstWall?`${v.firstWall.after}位後 ${v.firstWall.gap}P（${v.firstWall.before}→${v.firstWall.next}）`:'7P以上なし'}</div></div><div class="card"><div class="title">🩺 コンピ一次診断</div><div class="type">${esc(v.type)}</div><div class="grid"><div class="meta"><div class="metaL">P判定</div><div class="metaV">${v.p}（${v.sum}）</div></div><div class="meta"><div class="metaL">1着固定性</div><div class="metaV">${v.fixed}</div></div><div class="meta"><div class="metaL">1-2差</div><div class="metaV">${v.g12??'-'}P</div></div><div class="meta"><div class="metaL">1-3差</div><div class="metaV">${v.g13??'-'}P</div></div><div class="meta"><div class="metaL">上位4頭幅</div><div class="metaV">${v.top4??'-'}P</div></div><div class="meta"><div class="metaL">コンピ推奨</div><div class="metaV">${v.rec?v.rec+'番':'なし'}</div></div></div>${v.reason.map(x=>`<span class="badge">${esc(x)}</span>`).join('')}</div><div class="card compi"><div class="title">🧠 コンピ単独予想（保存）</div><div class="role"><div class="roleL">固定1着候補</div><div class="roleV">${fmt(v.first)}</div></div><div class="role"><div class="roleL">馬券内軸</div><div class="roleV">${fmt(v.axis)}</div></div><div class="role"><div class="roleL">頭替わり候補</div><div class="roleV">${fmt(v.head)}</div></div><div class="role"><div class="roleL">上位本線</div><div class="roleV">${fmt(v.main)}</div></div><div class="role"><div class="roleL">3着侵入候補</div><div class="roleV">${fmt(v.third)}</div></div><div class="ticketBox"><div class="ticketL">コンピ単独三連複</div><div class="ticketV">${v.compiSan.join(' ／ ')||'なし'}</div></div><div class="small">オッズを入れても原型を消さず、壁直後～6位を3着監査します。</div></div><div class="card market"><div class="title">🎯 市場補正後</div>${v.hasOdds?`<div class="role"><div class="roleL">補正後軸</div><div class="roleV">${fmt(v.marketAxis)}</div></div><div class="role"><div class="roleL">実質相手順位</div><div class="roleV">${fmt(v.marketMain)}</div></div><div class="role"><div class="roleL">市場逆行・3着保護</div><div class="roleV">${fmt(v.marketThird)}</div></div><div class="note">${v.moves.length?v.moves.map(x=>'・'+esc(x)).join('<br>'):'大きな順位入替なし'}</div>`:'<div class="small">オッズ未入力のため補正なし。</div>'}</div><div class="card audit"><div class="title">🛡️ 削除禁止・3着侵入監査</div><b class="safe">${fmt(v.audit)}</b><div class="small">上位4頭だけで切らず、壁直後・5位・6位を3列目に残します。</div></div><div class="card ticket"><div class="title">🧾 最終買い目</div><div class="ticketBox"><div class="ticketL">コンピ原型</div><div class="ticketV">${v.compiSan.join(' ／ ')||'なし'}</div></div><div class="ticketBox"><div class="ticketL">市場補正後</div><div class="ticketV">${v.hasOdds?(v.marketSan.join(' ／ ')||'なし'):'オッズ未入力'}</div></div><div class="ticketBox"><div class="ticketL">研究用・最重要1点</div><div class="ticketV">${v.best}</div></div></div>`}
function run(){try{const d=parse(document.getElementById('input').value);if(d.compi.length<3)throw new Error('COMPIを3頭以上入力してください');latest=build(d);document.getElementById('out').innerHTML=render(latest);document.title=d.title+'｜競馬メジアン V5.25'}catch(e){document.getElementById('out').innerHTML='<div class="card"><div class="title">入力エラー</div><pre>'+esc(e.message||e)+'</pre></div>'}}function clearAll(){input.value='';out.innerHTML='';latest=null}function sample(){input.value=`【川崎2R】\n\n[COMPI]\n10 73\n7 70\n3 68 推奨\n4 67\n2 54\n6 50\n1 46\n5 43\n8 40\n9 39`;run()}
function chatText(){if(!latest)throw new Error('先に解析してください');const v=latest;return `【${v.d.title}】\n競馬メジアン V5.25\n\nレース型：${v.type}\nP判定：${v.p}（${v.sum}）\n1-2差：${v.g12}P\n1-3差：${v.g13}P\n上位4頭幅：${v.top4}P\n最大壁：${v.maxGap.after}位後${v.maxGap.gap}P（${v.maxGap.before}→${v.maxGap.next}）\n\n【コンピ単独】\n固定1着：${fmt(v.first)}\n馬券内軸：${fmt(v.axis)}\n頭替わり：${fmt(v.head)}\n上位本線：${fmt(v.main)}\n3着侵入：${fmt(v.third)}\n三連複：${v.compiSan.join(' / ')||'なし'}\n\n【市場補正】\n補正後軸：${fmt(v.marketAxis)}\n実質相手：${fmt(v.marketMain)}\n市場3着：${fmt(v.marketThird)}\n補正内容：${v.moves.join(' / ')||'なし'}\n補正後三連複：${v.marketSan.join(' / ')||'なし'}\n\n削除禁止：${fmt(v.audit)}\n最重要1点：${v.best}`}
async function copyForChat(){try{const t=chatText();if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(t);else{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}alert('コピーしました')}catch(e){alert(e.message||e)}}function csvEsc(v){v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}function saveCsv(){if(!latest){alert('先に解析してください');return}const v=latest,row={日時:new Date().toISOString(),レース:v.d.title,解析:'V5.25',レース型:v.type,P:v.p,上位3合計:v.sum,差1_2:v.g12,差1_3:v.g13,上位4頭幅:v.top4,最大壁差:v.maxGap.gap,固定一着:v.first.join('|'),馬券内軸:v.axis.join('|'),頭替わり:v.head.join('|'),上位本線:v.main.join('|'),三着侵入:v.third.join('|'),コンピ三連複:v.compiSan.join('|'),市場軸:v.marketAxis.join('|'),市場相手:v.marketMain.join('|'),市場三着:v.marketThird.join('|'),市場三連複:v.marketSan.join('|'),削除禁止:v.audit.join('|'),最重要一点:v.best};const keys=Object.keys(row),csv='\ufeff'+keys.map(csvEsc).join(',')+'\n'+keys.map(k=>csvEsc(row[k])).join(','),blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='競馬メジアン_V5.25研究_'+new Date().toISOString().slice(0,10)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
</script></body></html>
