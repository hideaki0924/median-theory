<style>

<body>
<main>
<h1>競馬メジアン <span class="tag">V5.20</span><br>V4候補保存＋WIN5式＋コンピ司令塔</h1>

<div class="card">
  <div class="title">レースデータ入力</div>
  <textarea id="input" placeholder="【園田4R】

[TANFUKU]
馬番 単勝 複勝上限

[UMAREN]
馬番-馬番 オッズ

[WIDE]
馬番-馬番 オッズ

[SANPUKU]
馬番-馬番-馬番 オッズ

[COMPI]
馬番 指数 推奨"></textarea>
  <button class="go" onclick="run()">V5.20解析</button>
  <button class="sample" onclick="sample()">サンプル</button>
  <button class="clear" onclick="clearAll()">リセット</button>
  <button class="copy" onclick="copyForChat()">チャッピー用コピー</button>
  <button class="save" onclick="saveResearchCsv()">研究CSV</button>
</div>

<div class="card pipeline">
  <div class="title">🔁 V5の判定工程</div>
  <div class="step"><span class="stepNo">1</span><b>コンピ一次診断＋コンピ壁</b><div class="small">全順位間の指数差を壁として表示し、壁前・壁直後・壁内グループを保存してレース型を決める。</div></div>
  <div class="step"><span class="stepNo">2</span><b>オッズで役割を確定</b><div class="small">単勝・複勝・馬連・三連複・壁・メジアン・中位残存から、頭・連対・3着侵入を分離。</div></div>
  <div class="step"><span class="stepNo">3</span><b>型専用の買い目生成</b><div class="small">全レース同じ点数方式ではなく、判定されたレース型に合う券種と組み合わせだけを出す。</div></div>
  <div class="step"><span class="stepNo">4</span><b>V4候補を削除せず保存</b><div class="small">まっちゃん単勝・大荒れ頭・構造軸・青白光・WIN5式・監査買い目を別枠で必ず残す。</div></div>
</div>

<div id="out"></div>
</main>

<script>
'use strict';
let latest=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const zen=s=>String(s||'').replace(/[０-９]/g,x=>String.fromCharCode(x.charCodeAt(0)-65248)).replace(/．/g,'.').replace(/[－ー―−]/g,'-').replace(/　/g,' ');
const nums=s=>(zen(s).match(/\d+(?:\.\d+)?/g)||[]).map(Number);
const uniq=a=>[...new Set((a||[]).filter(Boolean).map(String))];
const sorted=(a,k='od')=>a.slice().sort((x,y)=>Number(x[k])-Number(y[k]));
const pairKey=(a,b)=>[String(a),String(b)].sort((x,y)=>+x-+y).join('-');
const triKey=(a,b,c)=>[String(a),String(b),String(c)].sort((x,y)=>+x-+y).join('-');

function parse(raw){
  const lines=zen(raw).split(/\r?\n/),d={title:'レース',tf:[],uma:[],wide:[],san:[],compi:[]};let sec='';
  for(let line of lines){
    line=line.trim();if(!line)continue;
    if(line.startsWith('【'))d.title=line.replace(/[【】]/g,'');
    const up=line.toUpperCase();
    if(up.startsWith('[')){
      if(up.includes('COMPI'))sec='C';
      else if(up.includes('TAN')||up.includes('単'))sec='TF';
      else if(up.includes('WIDE')||up.includes('ワイド'))sec='W';
      else if(up.includes('SAN')||up.includes('三')||up.includes('3'))sec='S';
      else if(up.includes('UMA')||up.includes('馬')||up.includes('2'))sec='U';
      continue;
    }
    const n=nums(line);
    if(sec==='TF'&&n.length>=2)d.tf.push({h:String(Math.floor(n[0])),tan:n[1],fuku:n.length>=3?n[n.length-1]:null});
    if(sec==='C'&&n.length>=2)d.compi.push({h:String(Math.floor(n[0])),pt:n[1],rec:/(推奨|推薦|推\b|赤|★|◎)/.test(line)});
    if(sec==='U'){const m=line.match(/(\d+)\s*-\s*(\d+)/);if(m&&n.length)d.uma.push({a:m[1],b:m[2],od:n[n.length-1]})}
    if(sec==='W'){const m=line.match(/(\d+)\s*-\s*(\d+)/);if(m&&n.length)d.wide.push({a:m[1],b:m[2],od:n[n.length-1]})}
    if(sec==='S'){const m=line.match(/(\d+)\s*-\s*(\d+)\s*-\s*(\d+)/);if(m&&n.length)d.san.push({a:m[1],b:m[2],c:m[3],od:n[n.length-1]})}
  }
  return d;
}

function rankPairs(list){
  const score={};
  sorted(list).forEach((p,i)=>[p.a,p.b].forEach(h=>{
    score[h]=score[h]||{h,count:0,best:999,sum:0};
    score[h].count++;score[h].best=Math.min(score[h].best,i+1);score[h].sum+=i+1;
  }));
  return Object.values(score).sort((x,y)=>y.count-x.count||x.best-y.best||x.sum-y.sum||+x.h-+y.h).map(x=>x.h);
}
function rankTri(list){
  const score={};
  sorted(list).forEach((p,i)=>[p.a,p.b,p.c].forEach(h=>{
    score[h]=score[h]||{h,count:0,best:999,sum:0};
    score[h].count++;score[h].best=Math.min(score[h].best,i+1);score[h].sum+=i+1;
  }));
  return Object.values(score).sort((x,y)=>y.count-x.count||x.best-y.best||x.sum-y.sum||+x.h-+y.h).map(x=>x.h);
}
function ratioWalls(rank,values,ratio=1.8){
  const out=[];
  for(let i=0;i<rank.length-1;i++){
    const a=Number(values[rank[i]]),b=Number(values[rank[i+1]]);
    if(a>0&&b/a>=ratio)out.push({idx:i,before:rank[i],next:rank[i+1],ratio:+(b/a).toFixed(2)});
  }
  return out;
}
function thresholdWall(rank,values,limit){
  let idx=-1;rank.forEach((h,i)=>{if(Number(values[h])<=limit)idx=i});
  return idx>=0&&idx<rank.length-1?{idx,before:rank[idx],next:rank[idx+1]}:null;
}
function medianHorses(arr){if(!arr.length)return[];return arr.length%2?[arr[Math.floor(arr.length/2)]]:[arr[arr.length/2-1],arr[arr.length/2]]}
function pClass(sum){return sum<=205?'P1':sum<=209?'P2':sum<=213?'P3':sum<=216?'P4':sum<=219?'P5':'P6'}

function build(d){
  const compi=d.compi.slice().sort((a,b)=>b.pt-a.pt||+a.h-+b.h),cr=compi.map(x=>x.h),n=compi.length;
  const tan=sorted(d.tf.map(x=>({...x,od:x.tan})),'tan'),fuku=sorted(d.tf.filter(x=>x.fuku!=null).map(x=>({...x,od:x.fuku})),'fuku');
  const tr=tan.map(x=>x.h),fr=fuku.map(x=>x.h),ur=rankPairs(d.uma),sr=rankTri(d.san);
  const tv=Object.fromEntries(tan.map(x=>[x.h,x.tan])),fv=Object.fromEntries(fuku.map(x=>[x.h,x.fuku]));
  const uv={};sorted(d.uma).forEach(p=>[p.a,p.b].forEach(h=>{if(uv[h]==null)uv[h]=p.od}));
  const sv={};sorted(d.san).forEach(p=>[p.a,p.b,p.c].forEach(h=>{if(sv[h]==null)sv[h]=p.od}));
  const walls={tan:ratioWalls(tr,tv),fuku:ratioWalls(fr,fv),uma:ratioWalls(ur,uv),san:ratioWalls(sr,sv),f6:thresholdWall(fr,fv,6),f15:thresholdWall(fr,fv,15),t80:thresholdWall(tr,tv,80)};
  const top3=compi.slice(0,3),sum=top3.reduce((s,x)=>s+x.pt,0),p=pClass(sum);
  const gaps={
    g12:n>1?compi[0].pt-compi[1].pt:null,g23:n>2?compi[1].pt-compi[2].pt:null,
    g13:n>2?compi[0].pt-compi[2].pt:null,g35:n>4?compi[2].pt-compi[4].pt:null,
    g56:n>5?compi[4].pt-compi[5].pt:null,g67:n>6?compi[5].pt-compi[6].pt:null
  };
  let maxGap={gap:-1,after:0};
  const compiWalls=[];
  for(let i=0;i<n-1;i++){
    const g=compi[i].pt-compi[i+1].pt;
    const level=g>=10?'大壁':g>=7?'中壁':g>=4?'小壁':'平坦';
    const w={gap:g,after:i+1,before:compi[i].h,next:compi[i+1].h,beforePt:compi[i].pt,nextPt:compi[i+1].pt,level};
    compiWalls.push(w);
    if(g>maxGap.gap)maxGap=w;
  }
  const strongCompiWalls=compiWalls.filter(w=>w.gap>=7).sort((a,b)=>b.gap-a.gap||a.after-b.after);
  const compiTiers=[];let tier=[];
  compi.forEach((x,i)=>{
    tier.push(x.h);
    if(i===n-1 || (compiWalls[i]&&compiWalls[i].gap>=7)){compiTiers.push(tier);tier=[]}
  });
  const groups={A1:cr.slice(0,2),A2:cr.slice(2,5),B:cr.slice(5,10),C:cr.slice(10)};
  const linePos=Math.max(1,Math.min(n,Math.ceil(n*0.75)));
  const lineHorse=compi[linePos-1];
  const otaniRules=[
    {name:'コンピ1位78以下',ok:!!compi[0]&&compi[0].pt<=78},
    {name:'1位－3位差12以下',ok:gaps.g13!=null&&gaps.g13<=12},
    {name:'75%地点が40台',ok:!!lineHorse&&lineHorse.pt>=40&&lineHorse.pt<=49}
  ];
  const otani=otaniRules.filter(x=>x.ok).length;

  const rankMap=arr=>Object.fromEntries(arr.map((h,i)=>[h,i+1]));
  const rm={tan:rankMap(tr),fuku:rankMap(fr),uma:rankMap(ur),san:rankMap(sr),compi:rankMap(cr)};
  const score={};
  const add=(h,pts,reason)=>{if(!h)return;score[h]=score[h]||{h,score:0,reasons:[]};score[h].score+=pts;if(!score[h].reasons.includes(reason))score[h].reasons.push(reason)};
  compi.forEach((x,i)=>add(x.h,Math.max(0,12-i),'コンピ'+(i+1)+'位'));
  tr.slice(0,6).forEach((h,i)=>add(h,8-i,'単勝上位'));
  fr.slice(0,7).forEach((h,i)=>add(h,8-i,'複勝上位'));
  ur.slice(0,7).forEach((h,i)=>add(h,8-i,'馬連支持'));
  sr.slice(0,8).forEach((h,i)=>add(h,8-i,'三連複支持'));
  [walls.f6,walls.f15,walls.t80].forEach((w,i)=>{if(w){add(w.before,5-i,'壁前');add(w.next,2,'壁直後')}});
  strongCompiWalls.forEach(w=>{
    add(w.before,w.gap>=10?5:3,'コンピ壁前'+w.gap+'P');
    add(w.next,w.gap>=10?2:1,'コンピ壁直後'+w.gap+'P');
  });
  const med=[...medianHorses(tr),...medianHorses(fr),...medianHorses(ur),...medianHorses(sr)];
  med.forEach(h=>add(h,3,'メジアン'));
  const triTopCounts={};sorted(d.san).slice(0,10).forEach((x,i)=>[x.a,x.b,x.c].forEach(h=>{triTopCounts[h]=(triTopCounts[h]||0)+1}));
  Object.entries(triTopCounts).forEach(([h,c])=>{if(c>=2)add(h,c,'三連複上位残存'+c+'回')});

  const all=Object.values(score).sort((a,b)=>b.score-a.score||+a.h-+b.h);
  const oddsTop=h=>(rm.tan[h]||99)<=5&&(rm.fuku[h]||99)<=6;
  const connected=h=>(rm.uma[h]||99)<=6||(rm.san[h]||99)<=7;
  const bSupport=groups.B.filter(h=>oddsTop(h)||connected(h)).sort((a,b)=>(score[b]?.score||0)-(score[a]?.score||0));
  const cSupport=groups.C.filter(h=>connected(h)&&(rm.fuku[h]||99)<=8).sort((a,b)=>(score[b]?.score||0)-(score[a]?.score||0));

  let type='標準順当型',fixed='中',place='2～3着',why=[];
  if(n<=7&&gaps.g23!=null&&gaps.g23>=12){type='少頭数・二強固定型';fixed='高';place='3着';why.push('上位2頭後に大壁')}
  else if(compi[0]?.pt>=85&&gaps.g13>=18){type='一強・相手荒れ型';fixed='高';place='2～3着';why.push('コンピ1位85以上','1位－3位差18以上')}
  else if(otani===3&&(p==='P1'||p==='P2'||p==='P3')){type='大谷式大穴型';fixed='低';place='1～3着';why.push('大谷式3条件','低P帯')}
  else if((p==='P1'||p==='P2')&&gaps.g13<=10&&bSupport.length){type='B群頭侵入型';fixed='低';place='1着';why.push('上位拮抗','B群に市場支持')}
  else if((p==='P4'||p==='P5'||p==='P6')&&gaps.g13>=14&&bSupport.length){type='順当軸＋B群3着侵入型';fixed='高';place='3着';why.push('上位軸が明確','B群に連系支持')}
  else if((p==='P1'||p==='P2')&&gaps.g13<=10){type='コンピ上位総崩れ警戒型';fixed='低';place='1～3着';why.push('低P帯','上位差が小さい')}
  else if(compi[0]?.pt>=80&&gaps.g13>=14){type='順当軸・相手入替型';fixed='高';place='2～3着';why.push('コンピ1位80以上','1位－3位差14以上')}
  else if(gaps.g56!=null&&gaps.g56>=8){type='上位5頭ロック型';fixed='中';place='上位5頭内';why.push('5位－6位に大壁')}
  else {type='中穴混戦型';fixed='中';place='1～3着';why.push('決定的な固定条件なし')}

  let first=[],headAlt=[],axis=[],placeCand=[],third=[];
  const c1=cr[0],c2=cr[1],c3=cr[2];
  if(type==='少頭数・二強固定型'){
    first=uniq([c1,c2]);axis=uniq([c1,c2]);placeCand=uniq([c1,c2,c3,...all.slice(0,4).map(x=>x.h)]);third=uniq([c3,...bSupport,...cSupport]).slice(0,4);
  }else if(type==='一強・相手荒れ型'||type==='順当軸・相手入替型'||type==='順当軸＋B群3着侵入型'){
    first=[c1];headAlt=uniq([tr[1],all.find(x=>x.h!==c1&&oddsTop(x.h))?.h]).slice(0,2);
    axis=[c1];placeCand=uniq(all.filter(x=>x.h!==c1).slice(0,5).map(x=>x.h));
    third=uniq([...bSupport,walls.f15?.before,walls.f15?.next,...cSupport]).slice(0,4);
  }else if(type==='B群頭侵入型'||type==='大谷式大穴型'||type==='コンピ上位総崩れ警戒型'){
    first=uniq([...bSupport.slice(0,2),...all.filter(x=>connected(x.h)&&oddsTop(x.h)).slice(0,3).map(x=>x.h),c1,c2]).slice(0,4);
    headAlt=uniq([c1,c2,c3]);axis=uniq(all.filter(x=>connected(x.h)).slice(0,3).map(x=>x.h));
    placeCand=uniq(all.slice(0,7).map(x=>x.h));third=uniq([...bSupport,...cSupport,walls.f15?.before,walls.f15?.next]).slice(0,5);
  }else{
    first=uniq([c1,all[0]?.h,tr[0]]).slice(0,3);headAlt=uniq([c2,c3,tr[1]]).slice(0,3);
    axis=uniq([all[0]?.h,c1]);placeCand=uniq(all.slice(0,6).map(x=>x.h));third=uniq([...bSupport,walls.f15?.before,walls.f15?.next]).slice(0,4);
  }

  // role safety
  first=uniq(first);headAlt=uniq(headAlt.filter(h=>!first.includes(h)));axis=uniq(axis);
  placeCand=uniq(placeCand.filter(h=>!axis.includes(h)));third=uniq(third.filter(h=>h&&!axis.includes(h)));

  // V4機能復活：候補は最終買い目と分離して残す
  const tfMap=Object.fromEntries(d.tf.map(x=>[x.h,x]));
  const hasReason=(h,r)=>!!score[h]&&score[h].reasons.includes(r);
  const supportCount=h=>[
    (rm.tan[h]||99)<=6,(rm.fuku[h]||99)<=7,(rm.uma[h]||99)<=7,(rm.san[h]||99)<=8
  ].filter(Boolean).length;

  // WIN5式：複勝3.0以内を強制保護し、複数市場接続とコンピを加味
  const win5=uniq([
    ...fr.filter(h=>Number(tfMap[h]?.fuku)<=3.0),
    ...all.filter(x=>supportCount(x.h)>=3&&(rm.compi[x.h]||99)<=5).map(x=>x.h),
    ...first
  ]).sort((a,b)=>{
    const af=Number(tfMap[a]?.fuku??999),bf=Number(tfMap[b]?.fuku??999);
    return af-bf||(score[b]?.score||0)-(score[a]?.score||0);
  }).slice(0,5);
  const win5Main=win5.slice(0,fixed==='高'?2:3);
  const win5Hole=win5.filter(h=>(rm.compi[h]||99)>=5||(rm.tan[h]||99)>=5).slice(0,2);

  // まっちゃん単勝：本線と穴単を分離
  const matchanMain=uniq([
    ...win5Main,
    ...first,
    all.find(x=>hasReason(x.h,'単勝上位')&&hasReason(x.h,'馬連支持'))?.h
  ]).slice(0,2);
  const matchanHole=uniq([
    ...bSupport.filter(h=>supportCount(h)>=2),
    walls.f15?.before,
    walls.t80?.before,
    ...all.filter(x=>(rm.tan[x.h]||99)>=4&&(rm.tan[x.h]||99)<=9&&supportCount(x.h)>=2).map(x=>x.h)
  ]).filter(h=>h&&!matchanMain.includes(h)).slice(0,3);

  // 構造軸・大荒れ頭・軸回避・相手保護
  const structureAxis=uniq([
    axis[0],
    all.find(x=>hasReason(x.h,'馬連支持')&&hasReason(x.h,'三連複支持')&&supportCount(x.h)>=3)?.h,
    cr[0]
  ]).filter(Boolean)[0]||'';
  const ooareHead=uniq([
    ...matchanHole,
    ...bSupport.filter(h=>hasReason(h,'三連複支持')||hasReason(h,'壁前')),
    walls.f15?.before
  ]).filter(Boolean)[0]||'';
  const axisAvoid=(fixed==='低'||type.includes('総崩れ')||type.includes('大穴'))?structureAxis:'';
  const protect=uniq([
    ...placeCand.slice(0,5),
    ...groups.A2,
    ...third,
    ...win5,
    ...strongCompiWalls.flatMap(w=>[w.before,w.next])
  ]).filter(h=>h&&h!==structureAxis).slice(0,9);

  // 青白光：壁・連系・市場逆行・メジアンの複数関門
  const blueWhite=all.map(x=>{
    const h=x.h,gates=[];
    if(hasReason(h,'壁前')||hasReason(h,'壁直後'))gates.push('オッズ壁');
    if((score[h]?.reasons||[]).some(r=>r.startsWith('コンピ壁')))gates.push('コンピ壁');
    if((rm.uma[h]||99)<=7)gates.push('馬連');
    if((rm.san[h]||99)<=8)gates.push('三連複');
    if((rm.compi[h]||99)>=6&&supportCount(h)>=2)gates.push('市場逆行');
    if(hasReason(h,'メジアン'))gates.push('メジアン');
    if(Number(tfMap[h]?.fuku)<=3)gates.push('WIN5');
    return {h,gates:uniq(gates)};
  }).filter(x=>x.gates.length>=3).sort((a,b)=>b.gates.length-a.gates.length||(score[b.h]?.score||0)-(score[a.h]?.score||0));

  // 大穴の役割分離
  const bigHoleWin=uniq([ooareHead,...matchanHole,...bSupport]).filter(Boolean).slice(0,3);
  const bigHolePlace=uniq([...matchanHole,...third,walls.f15?.before]).filter(Boolean).slice(0,4);
  const bigHoleThird=uniq([...third,walls.f15?.next,walls.f6?.next,...groups.A2]).filter(Boolean).slice(0,5);

  // 削除禁止監査候補。A1片方飛び＋A2二頭侵入も残す
  const auditPairs=[],auditSan=[];
  const pushAuditPair=(a,b)=>{if(a&&b&&a!==b){const k=pairKey(a,b);if(!auditPairs.includes(k))auditPairs.push(k)}};
  const pushAuditTri=(a,b,c)=>{if(a&&b&&c&&new Set([a,b,c]).size===3){const k=triKey(a,b,c);if(!auditSan.includes(k))auditSan.push(k)}};
  const auditAxis=structureAxis||axis[0]||cr[0];
  groups.A2.slice(0,3).forEach(h=>pushAuditPair(auditAxis,h));
  for(let i=0;i<groups.A2.length;i++)for(let j=i+1;j<groups.A2.length;j++)pushAuditTri(auditAxis,groups.A2[i],groups.A2[j]);
  matchanHole.slice(0,2).forEach(h=>{placeCand.slice(0,2).forEach(p=>pushAuditTri(auditAxis,p,h))});
  const auditHorses=uniq([auditAxis,...groups.A2,...matchanHole,...third,...protect,...strongCompiWalls.flatMap(w=>[w.before,w.next])]).slice(0,12);

  // tickets
  const wide=[],umaren=[],san=[],tanBet=[];
  const pushPair=(arr,a,b)=>{if(a&&b&&a!==b){const k=pairKey(a,b);if(!arr.includes(k))arr.push(k)}};
  const pushTri=(a,b,c)=>{if(a&&b&&c&&new Set([a,b,c]).size===3){const k=triKey(a,b,c);if(!san.includes(k))san.push(k)}};

  if(fixed==='高'&&axis[0]){
    tanBet.push(first[0]);
    placeCand.slice(0,3).forEach(h=>pushPair(wide,axis[0],h));
    placeCand.slice(0,3).forEach(h=>pushPair(umaren,axis[0],h));
    const core=placeCand.slice(0,3),holes=third.slice(0,2);
    if(core.length>=2)pushTri(axis[0],core[0],core[1]);
    if(core.length>=3)pushTri(axis[0],core[0],core[2]);
    holes.forEach(h=>{if(core[0])pushTri(axis[0],core[0],h)});
  }else{
    first.slice(0,2).forEach(h=>tanBet.push(h));
    const ax=axis[0]||first[0];
    placeCand.slice(0,3).forEach(h=>pushPair(wide,ax,h));
    first.slice(0,2).forEach(a=>placeCand.slice(0,3).forEach(b=>pushPair(umaren,a,b)));
    const pool=uniq([...axis,...first,...placeCand,...third]).slice(0,6);
    for(let i=0;i<pool.length&&san.length<5;i++)for(let j=i+1;j<pool.length&&san.length<5;j++)for(let k=j+1;k<pool.length&&san.length<5;k++)pushTri(pool[i],pool[j],pool[k]);
  }
  const bestOne=san[0]||wide[0]||umaren[0]||tanBet[0]||'なし';

  return {d,compi,cr,tr,fr,ur,sr,walls,sum,p,gaps,maxGap,compiWalls,strongCompiWalls,compiTiers,groups,linePos,lineHorse,otaniRules,otani,type,fixed,place,why,all,bSupport,cSupport,first,headAlt,axis,placeCand,third,
    win5,win5Main,win5Hole,matchanMain,matchanHole,structureAxis,ooareHead,axisAvoid,protect,blueWhite,bigHoleWin,bigHolePlace,bigHoleThird,auditPairs,auditSan,auditHorses,
    tickets:{tan:uniq(tanBet).slice(0,2),wide:wide.slice(0,4),umaren:umaren.slice(0,4),san:san.slice(0,5),bestOne}};
}

function row(label,rank,compi=[]){

  return s+'</div>';
}

}
