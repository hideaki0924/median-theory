<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07101f">
<title>競馬メジアン V3.00 型別司令塔・自己完結版</title>
<style>
:root{
  --bg:#07101f;--card:#10224a;--card2:#08152d;--line:#334155;
  --cyan:#67e8f9;--blue:#60a5fa;--yellow:#fde047;--orange:#fb923c;
  --red:#fb7185;--pink:#f472b6;--green:#4ade80;--purple:#a78bfa;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;max-width:100%;overflow-x:hidden;background:var(--bg);color:#fff}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;padding:10px;padding-bottom:calc(30px + env(safe-area-inset-bottom));font-size:17px;line-height:1.55}
main{width:100%;max-width:760px;margin:0 auto;min-width:0}
h1{font-size:clamp(23px,6vw,29px);line-height:1.3;margin:4px 0 12px}
.tag{display:inline-block;border-radius:999px;padding:3px 10px;background:#be123c;font-size:.72em}
.card{width:100%;max-width:100%;min-width:0;overflow:hidden;overflow-wrap:anywhere;word-break:break-word;background:var(--card);border:1px solid #3b82f6;border-radius:18px;padding:13px;margin:12px 0}
.title{font-size:clamp(21px,5.4vw,26px);font-weight:950;color:var(--yellow);margin-bottom:9px}
.small{font-size:13px;color:#cbd5e1;line-height:1.5}
textarea{width:100%;height:300px;border-radius:16px;border:2px solid #3b82f6;padding:12px;background:#f8fafc;color:#111;font-family:monospace;font-size:16px;line-height:1.45}
button{border:0;border-radius:15px;padding:13px 16px;margin:8px 5px 3px 0;font-size:18px;font-weight:950}
.go{background:#22c55e;color:#052e16}.sample{background:#3b82f6;color:#fff}.clear{background:#64748b;color:#fff}.save{background:#0891b2;color:#ecfeff}.result{background:#f59e0b;color:#fff}
.marketCard{border:3px solid var(--blue);background:linear-gradient(145deg,#061326,#10285b,#07101f);box-shadow:0 0 22px rgba(59,130,246,.35)}
.marketScroll{width:100%;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:14px;background:#061326;padding:8px 5px}
.marketRow{display:flex;align-items:center;min-width:max-content;margin:9px 0}
.marketLabel{width:72px;min-width:72px;max-width:72px;font-size:18px;font-weight:950;white-space:nowrap}
.cell{width:47px;min-width:47px;max-width:47px;text-align:center;font-size:24px;font-weight:950;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums}
.compiCell{display:flex;flex-direction:column;align-items:center}
.compiCell .pt{font-size:15px;color:#d8b4fe;margin-top:4px}
.compiRec{color:#ff3b5c;text-shadow:0 0 9px rgba(255,59,92,.75)}
.bar{width:2px;min-width:2px;height:34px;margin:0 3px;border-radius:4px;background:#35517a}
.barUma{width:5px;min-width:5px;background:var(--red);box-shadow:0 0 10px var(--red)}
.barTan{width:5px;min-width:5px;background:#38bdf8;box-shadow:0 0 10px #38bdf8}
.barFuku{width:5px;min-width:5px;background:var(--yellow);box-shadow:0 0 10px var(--yellow)}
.barSan{width:5px;min-width:5px;background:var(--green);box-shadow:0 0 10px var(--green)}
.bar6{width:5px;min-width:5px;background:var(--yellow);box-shadow:0 0 10px var(--yellow)}
.bar15{width:5px;min-width:5px;background:var(--orange);box-shadow:0 0 10px var(--orange)}
.bar80{width:5px;min-width:5px;background:var(--pink);box-shadow:0 0 10px var(--pink)}
.legend{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.leg{display:inline-flex;align-items:center;gap:6px;border:1px solid #475569;background:#111827;border-radius:999px;padding:6px 9px;font-size:13px;font-weight:900}
.legLine{width:25px;height:5px;border-radius:99px}
.wallBox{margin-top:10px;border:1px solid #475569;border-radius:12px;background:#020617;padding:10px}
.wallLine{margin:5px 0}
.commander{border:3px solid var(--purple);background:linear-gradient(145deg,#160b2e,#312e81,#07101f);box-shadow:0 0 24px rgba(167,139,250,.42)}
.typeName{font-size:clamp(25px,7vw,34px);font-weight:950;color:var(--yellow);margin:7px 0}
.metaGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.meta{background:rgba(2,6,23,.75);border:1px solid #475569;border-radius:12px;padding:9px}
.metaL{font-size:12px;color:#93c5fd;font-weight:900}.metaV{font-size:19px;font-weight:950;margin-top:2px}
.candidates{border:3px solid #22d3ee;background:linear-gradient(145deg,#00212b,#0c4a6e,#07101f)}
.cand{background:#020617;border:1px solid #155e75;border-radius:12px;padding:10px;margin:8px 0}
.candL{font-size:13px;color:var(--cyan);font-weight:950}.candV{font-size:25px;font-weight:950}
.theory{border:2px solid #475569;background:linear-gradient(145deg,#0b1730,#172554,#07101f)}
.theory h3{margin:0 0 8px;color:var(--yellow);font-size:21px}
.badge{display:inline-block;margin:3px;padding:4px 8px;border-radius:999px;background:#1e293b;font-weight:900}
.good{color:#86efac;font-weight:950}.warn{color:#fb7185;font-weight:950}.yellow{color:var(--yellow);font-weight:950}.cyan{color:var(--cyan);font-weight:950}.orange{color:var(--orange);font-weight:950}
pre{white-space:pre-wrap;word-break:break-word;background:#020617;padding:11px;border-radius:12px;font-size:15px}
details summary{cursor:pointer;font-weight:950;color:#c4b5fd;padding:10px;background:#111827;border:1px solid #6d28d9;border-radius:12px}
@media(max-width:520px){
  body{padding:8px;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
  .card{padding:10px;border-radius:15px}
  .marketLabel{width:64px;min-width:64px;max-width:64px;font-size:16px}
  .cell{width:42px;min-width:42px;max-width:42px;font-size:22px}
  .compiCell .pt{font-size:13px}
}

.recordCard{border:3px solid #14b8a6;background:linear-gradient(145deg,#032f2f,#134e4a,#07101f)}
.formGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.formGrid input{width:100%;min-width:0;border:1px solid #64748b;border-radius:11px;padding:10px;font-size:17px;background:#f8fafc;color:#111}
.copyBtn{background:#8b5cf6;color:#fff}.recordBtn{background:#14b8a6;color:#042f2e}.appendBtn{background:#f97316;color:#fff}.allCsvBtn{background:#0e7490;color:#ecfeff}
.logBox{margin-top:10px;background:#020617;border:1px solid #0f766e;border-radius:12px;padding:10px;font-size:14px}
@media(max-width:520px){.formGrid{grid-template-columns:1fr 1fr 1fr}.formGrid input{font-size:16px;padding:9px 6px}}

</style>
</head>
<body>
<main>
<h1>競馬メジアン <span class="tag">V3.00</span><br>型別司令塔・自己完結版</h1>

<div class="card">
  <div class="title">レースデータ入力</div>
  <textarea id="input" placeholder="【高知11R】

[TANFUKU]
馬番 単勝 複勝上限

[UMAREN]
馬番-馬番 オッズ

[WIDE]
馬番-馬番 オッズ

[SANPUKU]
馬番-馬番-馬番 オッズ

[COMPI]
馬番 指数 推奨
※推奨馬は行末に「推」「推奨」「赤」「★」「◎」"></textarea>
  <button class="go" onclick="run()">レース解析</button>
  <button class="sample" onclick="sample()">サンプル</button>
  <button class="clear" onclick="clearAll()">リセット</button>
  <button class="save" onclick="saveCsv()">V3検証CSV</button>
  <button class="copyBtn" onclick="copyForChat()">チャッピー用コピー</button>
  <button class="recordBtn" onclick="savePreRace()">事前解析を記録</button>
  <button class="allCsvBtn" onclick="saveAllRecordsCsv()">全記録CSV</button>
</div>

<div id="out"></div>
<div class="card recordCard">
  <div class="title">📝 結果追記・検証ログ</div>
  <div class="small">レース前は「事前解析を記録」。結果確定後に着順を入れて「結果を追記」。同じレース記録へ追加します。</div>
  <div class="formGrid">
    <input id="r1" inputmode="numeric" placeholder="1着">
    <input id="r2" inputmode="numeric" placeholder="2着">
    <input id="r3" inputmode="numeric" placeholder="3着">
  </div>
  <div class="formGrid">
    <input id="payTan" inputmode="numeric" placeholder="単勝払戻">
    <input id="payUma" inputmode="numeric" placeholder="馬連払戻">
    <input id="paySan" inputmode="numeric" placeholder="三連複払戻">
  </div>
  <button class="appendBtn" onclick="appendResult()">結果を追記</button>
  <button class="clear" onclick="showRecordCount()">記録件数確認</button>
  <div class="logBox" id="recordStatus">保存済み記録：0件</div>
</div>
</main>

<script>
'use strict';
let latest=null;

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const zen=s=>String(s||'').replace(/[０-９]/g,x=>String.fromCharCode(x.charCodeAt(0)-65248)).replace(/．/g,'.').replace(/[－ー―−]/g,'-').replace(/　/g,' ');
const nums=s=>(zen(s).match(/\d+(?:\.\d+)?/g)||[]).map(Number);
const uniq=a=>[...new Set((a||[]).map(String).filter(Boolean))];
const mid=a=>!a.length?[]:(a.length%2?[a[Math.floor(a.length/2)]]:[a[a.length/2-1],a[a.length/2]]);
const pairKey=(a,b)=>[String(a),String(b)].sort((x,y)=>+x-+y).join('-');
const triKey=(a,b,c)=>[String(a),String(b),String(c)].sort((x,y)=>+x-+y).join('-');

function parse(raw){
  const lines=zen(raw).split(/\r?\n/),d={title:'レース',tf:[],uma:[],wide:[],san:[],compi:[]};let sec='';
  for(let line of lines){
    line=line.trim(); if(!line)continue;
    if(line.startsWith('【'))d.title=line.replace(/[【】]/g,'');
    const up=line.toUpperCase();
    if(up.startsWith('[')){
      if(up.includes('COMPI'))sec='C';
      else if(up.includes('TAN')||up.includes('単'))sec='TF';
      else if(up.includes('WIDE')||up.includes('ワイド'))sec='W';
      else if(up.includes('SAN')||up.includes('三')||up.includes('3'))sec='S';
      else if(up.includes('UMA')||up.includes('馬')||up.includes('2'))sec='U';
      continue;
    }
    const n=nums(line);
    if(sec==='TF'&&n.length>=2)d.tf.push({h:String(Math.floor(n[0])),tan:n[1],fuku:n.length>=3?n[n.length-1]:null});
    if(sec==='C'&&n.length>=2)d.compi.push({h:String(Math.floor(n[0])),pt:n[1],rec:/(推奨|推薦|推\b|赤|★|◎)/.test(line)});
    if(sec==='U'){const m=line.match(/(\d+)\s*-\s*(\d+)/);if(m&&n.length)d.uma.push({a:m[1],b:m[2],od:n[n.length-1]})}
    if(sec==='W'){const m=line.match(/(\d+)\s*-\s*(\d+)/);if(m&&n.length)d.wide.push({a:m[1],b:m[2],od:n[n.length-1]})}
    if(sec==='S'){const m=line.match(/(\d+)\s*-\s*(\d+)\s*-\s*(\d+)/);if(m&&n.length)d.san.push({a:m[1],b:m[2],c:m[3],od:n[n.length-1]})}
  }
  return d;
}
function sorted(a,k='od'){return a.slice().sort((x,y)=>Number(x[k])-Number(y[k]))}
function rankPairs(list){
  const score={};
  sorted(list).forEach((p,i)=>{
    [p.a,p.b].forEach(h=>{
      score[h]=score[h]||{h,count:0,best:999,sumRank:0,sumOdds:0};
      score[h].count++;score[h].best=Math.min(score[h].best,i+1);score[h].sumRank+=i+1;score[h].sumOdds+=Number(p.od);
    });
  });
  return Object.values(score).sort((x,y)=>y.count-x.count||x.best-y.best||x.sumRank-y.sumRank||x.sumOdds-y.sumOdds||+x.h-+y.h).map(x=>x.h);
}
function rankTri(list){
  const score={};
  sorted(list).forEach((p,i)=>[p.a,p.b,p.c].forEach(h=>{
    score[h]=score[h]||{h,count:0,best:999,sumRank:0};
    score[h].count++;score[h].best=Math.min(score[h].best,i+1);score[h].sumRank+=i+1;
  }));
  return Object.values(score).sort((x,y)=>y.count-x.count||x.best-y.best||x.sumRank-y.sumRank||+x.h-+y.h).map(x=>x.h);
}
function ratioWalls(rank,values,ratio=1.8){
  const walls=[];
  for(let i=0;i<rank.length-1;i++){
    const a=Number(values[rank[i]]),b=Number(values[rank[i+1]]);
    if(a>0&&b/a>=ratio)walls.push({idx:i,before:rank[i],next:rank[i+1],low:a,high:b,ratio:+(b/a).toFixed(2)});
  }
  return walls;
}
function thresholdWall(rank,values,limit){
  let idx=-1;rank.forEach((h,i)=>{if(Number(values[h])<=limit)idx=i});
  return idx>=0&&idx<rank.length-1?{idx,before:rank[idx],next:rank[idx+1],low:values[rank[idx]],high:values[rank[idx+1]]}:null;
}
function build(data){
  const tan=sorted(data.tf.map(x=>({...x,od:x.tan})),'tan'),fuku=sorted(data.tf.filter(x=>x.fuku!=null).map(x=>({...x,od:x.fuku})),'fuku');
  const tanRow=tan.map(x=>x.h),fukuRow=fuku.map(x=>x.h),umaRow=rankPairs(data.uma),sanRow=rankTri(data.san);
  const compi=data.compi.slice().sort((a,b)=>b.pt-a.pt||+a.h-+b.h),compiRow=compi.map(x=>x.h);
  const tanVal=Object.fromEntries(tan.map(x=>[x.h,x.tan])),fukuVal=Object.fromEntries(fuku.map(x=>[x.h,x.fuku]));
  const umaVal={}; sorted(data.uma).forEach(p=>{[p.a,p.b].forEach(h=>{if(umaVal[h]==null)umaVal[h]=p.od})});
  const sanVal={}; sorted(data.san).forEach(p=>{[p.a,p.b,p.c].forEach(h=>{if(sanVal[h]==null)sanVal[h]=p.od})});
  const walls={
    uma:ratioWalls(umaRow,umaVal),tan:ratioWalls(tanRow,tanVal),fuku:ratioWalls(fukuRow,fukuVal),san:ratioWalls(sanRow,sanVal),
    f6:thresholdWall(fukuRow,fukuVal,6),f15:thresholdWall(fukuRow,fukuVal,15),t80:thresholdWall(tanRow,tanVal,80)
  };
  const top3=compi.slice(0,3),sum=top3.reduce((s,x)=>s+x.pt,0),gap=top3.length===3?top3[0].pt-top3[2].pt:null;
  const p=sum<=205?'P1':sum<=208?'P2':sum<=211?'P3':sum<=215?'P4':sum<=219?'P5':'P6';
  let otani=0;
  if(compi.length){
    if(compi[0].pt<=80)otani++;
    if(gap!=null&&gap<=14)otani++;
    const low=compi.filter(x=>x.pt>=40&&x.pt<=46); if(low.length&&compi.findIndex(x=>x.h===low[low.length-1].h)+1>=Math.min(9,compi.length-1))otani++;
  }
  const counts={tan10:tan.filter(x=>x.tan<10).length,tan30:tan.filter(x=>x.tan<30).length,f6:fuku.filter(x=>x.fuku<=6).length,f10:fuku.filter(x=>x.fuku<=10).length,f15:fuku.filter(x=>x.fuku<=15).length};
  let type='順当型',fixed='高',place='2～3着';
  if(compi.length<=9){type='少頭数型';fixed='中';place='2～3着'}
  else if(p==='P1'||(compi[0]?.pt<=72&&gap<=10)){type='コンピ上位総崩れ型';fixed='低';place='1～3着'}
  else if(otani===3&&(p==='P1'||p==='P2'||p==='P3')){type='大谷式大穴型';fixed='低';place='1～3着'}
  else if(compi[0]?.pt>=85&&gap>=18){type='一強・相手荒れ型';fixed='高';place='2～3着'}
  else if(p==='P2'||p==='P3'||counts.tan10>=5){type='中穴混戦型';fixed='中';place='1～3着'}
  const marketScore={};
  const add=(h,n,why)=>{if(!h)return;marketScore[h]=marketScore[h]||{h,score:0,why:[]};marketScore[h].score+=n;if(!marketScore[h].why.includes(why))marketScore[h].why.push(why)};
  compi.slice(0,5).forEach((x,i)=>add(x.h,8-i,'コンピ上位'));
  tanRow.slice(0,5).forEach((h,i)=>add(h,7-i,'単勝上位'));
  umaRow.slice(0,6).forEach((h,i)=>add(h,7-i,'馬連支持'));
  fukuRow.slice(0,6).forEach((h,i)=>add(h,6-i,'複勝支持'));
  sanRow.slice(0,7).forEach((h,i)=>add(h,7-i,'三連複支持'));
  [walls.f6,walls.f15,walls.t80].forEach((w,i)=>{if(w){add(w.before,6-i,'壁前');add(w.next,2,'壁直後')}});
  const all=Object.values(marketScore).sort((a,b)=>b.score-a.score||+a.h-+b.h);
  let first=[],second=[],third=[];
  if(type==='一強・相手荒れ型'||type==='順当型'||type==='少頭数型'){
    first=uniq([compi[0]?.h,all[0]?.h]).slice(0,2);second=uniq(all.slice(1,5).map(x=>x.h));third=uniq([walls.f6?.next,walls.f15?.before,walls.f15?.next].filter(Boolean));
  }else{
    first=uniq(all.filter(x=>x.why.includes('馬連支持')&&x.why.includes('複勝支持')).slice(0,3).map(x=>x.h));
    if(!first.length)first=all.slice(0,3).map(x=>x.h);
    second=uniq(all.slice(0,6).map(x=>x.h));third=uniq([walls.f6?.before,walls.f15?.before,walls.f15?.next,walls.t80?.before].filter(Boolean));
  }
  const win5=all.filter(x=>{const tf=data.tf.find(v=>v.h===x.h);return tf&&tf.fuku!=null&&tf.fuku<=3}).slice(0,3);

  const scoreOf=h=>all.find(x=>x.h===String(h));
  const topBy=(fn,n=3)=>all.filter(fn).slice(0,n).map(x=>x.h);

  // まっちゃん単勝
  let matchanMain=uniq([
    win5[0]?.h,
    type==='一強・相手荒れ型'||type==='順当型'?compi[0]?.h:null,
    all.find(x=>x.why.includes('単勝上位')&&x.why.includes('馬連支持'))?.h
  ]).filter(Boolean).slice(0,2);

  let matchanHole=uniq([
    all.find(x=>x.why.includes('壁前')&&x.why.includes('馬連支持')&&!matchanMain.includes(x.h))?.h,
    all.find(x=>x.why.includes('三連複支持')&&x.why.includes('複勝支持')&&!matchanMain.includes(x.h))?.h,
    walls.f15?.before,
    walls.t80?.before
  ]).filter(Boolean).slice(0,2);

  // 大荒れ頭・構造軸同期
  const structureAxis=uniq([
    all.find(x=>x.why.includes('馬連支持')&&x.why.includes('三連複支持'))?.h,
    compi[0]?.h
  ]).filter(Boolean)[0]||'';
  const ooareHead=uniq([
    all.find(x=>x.why.includes('壁前')&&x.why.includes('複勝支持'))?.h,
    all.find(x=>x.score>=22&&!matchanMain.includes(x.h))?.h,
    walls.f15?.before
  ]).filter(Boolean)[0]||'';
  const axisAvoid=type==='コンピ上位総崩れ型'||type==='大谷式大穴型'?structureAxis:'';
  const protect=uniq([all[0]?.h,all[1]?.h,walls.f6?.before,walls.f15?.before]).filter(Boolean).slice(0,3);

  // まっちゃん式・オッズ構造予想
  let oddsPattern='通常';
  if(!walls.tan.length)oddsPattern='単勝ランク無壁混戦';
  if(walls.t80&&walls.f15&&walls.t80.idx!==walls.f15.idx)oddsPattern='単勝80倍壁×複勝15倍壁ズレ';
  if(walls.uma[0]&&walls.uma[0].idx<=2)oddsPattern='馬連上位人気集中';
  const oddsHoles=uniq([
    walls.f15?.before,walls.f15?.next,
    all.find(x=>x.why.includes('壁前')&&x.why.includes('三連複支持'))?.h,
    all.find(x=>x.why.includes('壁直後')&&x.why.includes('馬連支持'))?.h
  ]).filter(Boolean).slice(0,2);
  const oddsOpponents=uniq(all.slice(0,6).map(x=>x.h).filter(h=>!oddsHoles.includes(h))).slice(0,4);

  // 大穴役割
  const bigHoleWin=uniq([ooareHead,matchanHole[0],oddsHoles[0]]).filter(Boolean).slice(0,2);
  const bigHolePlace=uniq([oddsHoles[0],oddsHoles[1],walls.f15?.before]).filter(Boolean).slice(0,3);
  const bigHoleThird=uniq([walls.f15?.next,walls.f6?.next,walls.t80?.before]).filter(Boolean).slice(0,3);


  const gates=all.map(x=>{
    let g=[];if(x.why.includes('壁前')||x.why.includes('壁直後'))g.push('壁');if(x.why.includes('馬連支持')||x.why.includes('三連複支持'))g.push('連系');if(x.why.includes('単勝上位')&&x.why.includes('複勝支持'))g.push('単複');if(x.score>=20)g.push('密集');

  const race=latest&&latest.data&&latest.data.title;

  a[idx].result=r;

function saveAllRecordsCsv(){
  const a=getRecords();if(!a.length){alert('記録がありません');return}
  const rows=a.map(flattenRecord),keys=Object.keys(rows[0]);
  const csv='\ufeff'+keys.map(csvEsc).join(',')+'\n'+rows.map(r=>keys.map(k=>csvEsc(r[k])).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),el=document.createElement('a');
  el.href=URL.createObjectURL(blob);el.download='競馬メジアン_V3全記録_'+new Date().toISOString().slice(0,10)+'.csv';el.click();
  setTimeout(()=>URL.revokeObjectURL(el.href),1000);
}
