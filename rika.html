<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小3理科 チョウのかんさつ</title>
<style>
:root{--bg:#f3fbff;--card:#fff;--ink:#263238;--blue:#4f8cff;--green:#43b66a;--red:#ef6461}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:linear-gradient(#eaf8ff,#fff7e8);color:var(--ink);min-height:100vh}.wrap{max-width:820px;margin:auto;padding:16px 14px 40px}.hero{text-align:center}.hero h1{margin:4px 0;font-size:clamp(28px,7vw,44px)}.hero p{margin:4px 0 10px;font-size:18px}.progressWrap{background:#d9ebff;border-radius:999px;overflow:hidden;height:18px;margin:12px 0 8px}.progress{height:100%;width:0;background:linear-gradient(90deg,#59c173,#4f8cff);transition:.3s}.counter{text-align:center;font-weight:800;font-size:18px;margin-bottom:10px}.card{background:#fff;border-radius:26px;box-shadow:0 10px 30px rgba(35,75,120,.12);padding:24px 18px;min-height:420px;display:flex;flex-direction:column;justify-content:center}.icon{font-size:72px;text-align:center;margin-bottom:8px}.q{font-size:clamp(24px,5.5vw,34px);line-height:1.55;font-weight:900;text-align:center;margin:8px 0 18px}.choices{display:grid;gap:12px}.choice{width:100%;border:3px solid #cfe2ff;background:#f7fbff;border-radius:20px;padding:17px 16px;font-size:clamp(21px,4.6vw,28px);font-weight:800;text-align:left;color:#1f2937}.choice.selected{border-color:var(--blue);background:#e9f2ff}.choice.correct{border-color:var(--green);background:#eaf9ef}.choice.wrong{border-color:var(--red);background:#fff0ef}.textAnswer{width:100%;font-size:28px;padding:18px;border:3px solid #cfe2ff;border-radius:18px;outline:none}.feedback{min-height:48px;text-align:center;font-size:23px;font-weight:900;margin-top:14px}.ok{color:#23894b}.ng{color:#cf3f3f}.actions{display:flex;gap:10px;margin-top:16px}.btn{flex:1;border:0;border-radius:18px;padding:17px;font-size:22px;font-weight:900;color:white;background:var(--blue)}.btn.secondary{background:#6c7a89}.result{display:none;background:white;border-radius:28px;padding:28px 20px;text-align:center;box-shadow:0 10px 30px rgba(35,75,120,.12)}.score{font-size:54px;font-weight:1000;margin:8px 0}.stars{font-size:52px;margin:8px 0}.resultMsg{font-size:25px;font-weight:900;line-height:1.5}.review{text-align:left;margin-top:20px;background:#fff9db;border-radius:18px;padding:14px;font-size:18px;line-height:1.7}.small{font-size:14px;color:#667085;text-align:center;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
<div class="hero"><div style="font-size:52px">🦋</div><h1>チョウのかんさつ</h1><p>小学校3年生 理科</p></div>
<div id="quizArea"><div class="progressWrap"><div id="progress" class="progress"></div></div><div id="counter" class="counter"></div><div class="card"><div id="icon" class="icon"></div><div id="question" class="q"></div><div id="answerArea"></div><div id="feedback" class="feedback"></div><div class="actions"><button id="checkBtn" class="btn">こたえる</button><button id="nextBtn" class="btn" style="display:none">つぎへ ▶</button></div></div><div class="small">大きなボタンをタップして答えてね</div></div>
<div id="result" class="result"><div style="font-size:64px">🏆</div><div class="score" id="scoreText"></div><div class="stars" id="stars"></div><div class="resultMsg" id="resultMsg"></div><div class="review" id="review"></div><div class="actions" style="margin-top:18px"><button class="btn" id="retryWrong">まちがえた問題だけ</button><button class="btn secondary" id="restart">もういちど全部</button></div></div>
</div>
<script>
const allQuestions=[
{icon:"🥚",q:"モンシロチョウが いちばん はじめの すがたは どれ？",type:"choice",choices:["たまご","よう虫","さなぎ","成虫"],answer:"たまご"},
{icon:"🐛",q:"たまごから かえった あとの すがたを なんと いう？",type:"choice",choices:["よう虫","さなぎ","成虫"],answer:"よう虫"},
{icon:"🟤",q:"よう虫の つぎの すがたは どれ？",type:"choice",choices:["たまご","さなぎ","成虫"],answer:"さなぎ"},
{icon:"🦋",q:"チョウに なった すがたを なんと いう？",type:"choice",choices:["よう虫","さなぎ","成虫"],answer:"成虫"},
{icon:"🔁",q:"そだつ じゅんばんで ただしいのは どれ？",type:"choice",choices:["たまご → よう虫 → さなぎ → 成虫","たまご → さなぎ → よう虫 → 成虫","よう虫 → たまご → さなぎ → 成虫"],answer:"たまご → よう虫 → さなぎ → 成虫"},
{icon:"🥬",q:"モンシロチョウの よう虫には、なんの はを あたえる？",type:"choice",choices:["キャベツ","パセリ","ホウセンカ"],answer:"キャベツ"},
{icon:"🧩",q:"チョウの からだは、いくつの ぶぶんに わかれている？",type:"choice",choices:["2つ","3つ","4つ"],answer:"3つ"},
{icon:"🧠",q:"チョウの からだの 3つの ぶぶんは？",type:"choice",choices:["あたま・むね・はら","あたま・せなか・おなか","かお・むね・しっぽ"],answer:"あたま・むね・はら"},
{icon:"🦵",q:"チョウの あしは、からだの どこに ついている？",type:"choice",choices:["あたま","むね","はら"],answer:"むね"},
{icon:"6️⃣",q:"チョウの あしは ぜんぶで なんぼん？",type:"choice",choices:["4本","6本","8本"],answer:"6本"},
{icon:"🐞",q:"チョウのように、からだが『あたま・むね・はら』に わかれ、あしが6本ある なかまを なんという？",type:"choice",choices:["こん虫","魚","鳥"],answer:"こん虫"},
{icon:"🌿",q:"キアゲハの よう虫が たべる はは どれ？",type:"choice",choices:["パセリ","キャベツ","ホウセンカ"],answer:"パセリ"},
{icon:"🍽️",q:"チョウが きまった しょくぶつの はに たまごを うむのは、よう虫が その はを どうするから？",type:"choice",choices:["たべるから","ねるから","かくれるから"],answer:"たべるから"},
{icon:"🦋🦋",q:"キアゲハと モンシロチョウの そだつ じゅんばんは？",type:"choice",choices:["おなじ","ちがう"],answer:"おなじ"},
{icon:"📝",q:"『よう虫』の つぎに なる すがたを ひらがなで かこう。",type:"text",answer:"さなぎ"}
];
let questions=[...allQuestions],index=0,selected=null,checked=false,wrongItems=[];
const questionEl=document.getElementById('question'),iconEl=document.getElementById('icon'),answerArea=document.getElementById('answerArea'),counter=document.getElementById('counter'),progress=document.getElementById('progress'),feedback=document.getElementById('feedback'),checkBtn=document.getElementById('checkBtn'),nextBtn=document.getElementById('nextBtn');
function render(){checked=false;selected=null;feedback.textContent='';feedback.className='feedback';checkBtn.style.display='';nextBtn.style.display='none';const item=questions[index];counter.textContent=`${index+1} / ${questions.length} もん`;progress.style.width=`${(index/questions.length)*100}%`;iconEl.textContent=item.icon;questionEl.textContent=item.q;answerArea.innerHTML='';if(item.type==='choice'){const box=document.createElement('div');box.className='choices';item.choices.forEach((c,i)=>{const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=`${['①','②','③','④'][i]||''} ${c}`;b.dataset.value=c;b.onclick=()=>{if(checked)return;[...box.children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selected=c};box.appendChild(b)});answerArea.appendChild(box)}else{const inp=document.createElement('input');inp.id='textInput';inp.className='textAnswer';inp.placeholder='ここに かこう';inp.autocomplete='off';inp.spellcheck=false;inp.oninput=()=>selected=inp.value.trim();answerArea.appendChild(inp)}}
function normalize(s){return(s||'').replace(/[ 　]/g,'').trim()}
checkBtn.onclick=()=>{if(!selected){feedback.textContent='こたえを えらんでね 😊';feedback.className='feedback ng';return}const item=questions[index];checked=true;const ok=normalize(selected)===normalize(item.answer);if(item.type==='choice'){document.querySelectorAll('.choice').forEach(btn=>{if(btn.dataset.value===item.answer)btn.classList.add('correct');if(btn.dataset.value===selected&&!ok)btn.classList.add('wrong');btn.disabled=true})}else{const inp=document.getElementById('textInput');inp.disabled=true;inp.style.borderColor=ok?'#43b66a':'#ef6461'}if(ok){feedback.textContent='せいかい！ 🎉';feedback.className='feedback ok'}else{feedback.textContent=`おしい！ せいかいは「${item.answer}」`;feedback.className='feedback ng';wrongItems.push(item)}checkBtn.style.display='none';nextBtn.style.display=''};
nextBtn.onclick=()=>{index++;if(index<questions.length)render();else showResult()};
function showResult(){progress.style.width='100%';document.getElementById('quizArea').style.display='none';const result=document.getElementById('result');result.style.display='block';const correct=questions.length-wrongItems.length;const score=Math.round(correct/questions.length*100);document.getElementById('scoreText').textContent=`${score}てん`;let stars='⭐',msg='よく がんばったね！';if(score===100){stars='⭐⭐⭐';msg='ぜんもん せいかい！ すごい！ 🎉'}else if(score>=80){stars='⭐⭐⭐';msg='とっても よくできました！'}else if(score>=60){stars='⭐⭐';msg='あと すこし！ もう1かい やってみよう！'}document.getElementById('stars').textContent=stars;document.getElementById('resultMsg').textContent=msg;const review=document.getElementById('review');if(wrongItems.length===0){review.innerHTML='まちがいは ありません。かんぺき！';document.getElementById('retryWrong').style.display='none'}else{review.innerHTML='<b>もう1かい やってみる もんだい</b><br>'+wrongItems.map((x,i)=>`${i+1}. ${x.q}`).join('<br>');document.getElementById('retryWrong').style.display=''}}
document.getElementById('retryWrong').onclick=()=>{questions=[...wrongItems];wrongItems=[];index=0;document.getElementById('result').style.display='none';document.getElementById('quizArea').style.display='';render()};
document.getElementById('restart').onclick=()=>{questions=[...allQuestions];wrongItems=[];index=0;document.getElementById('result').style.display='none';document.getElementById('quizArea').style.display='';render()};
render();
</script>
</body>
</html>
