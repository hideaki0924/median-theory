<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101f"><title>中央コンピ検証</title><style>
*{box-sizing:border-box}body{margin:0;background:#07101f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;padding:12px 12px 90px;font-size:16px}h1{font-size:24px;margin:4px 0 2px}small,.sub{color:#9fb3c8}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;position:sticky;top:0;background:#07101f;padding:8px 0;z-index:9}.tabs button,.btn{border:0;border-radius:13px;font-weight:900}.tabs button{padding:10px 2px;background:#17314d;color:#cfe3f8}.tabs button.on{background:#2563eb;color:#fff}.page{display:none}.page.on{display:block}.card{background:#0e2035;border:1px solid #2f4f6d;border-radius:17px;padding:13px;margin:10px 0}h2{font-size:19px;margin:0 0 8px}textarea{width:100%;height:285px;border:2px solid #3b82f6;border-radius:14px;padding:11px;font:15px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:#f8fafc;color:#111}.short{height:205px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.btn{padding:12px 14px;font-size:15px;background:#22c55e;color:#052e16}.btn.b{background:#3b82f6;color:#fff}.btn.g{background:#27445f;color:#e7f3ff}.btn.r{background:#be123c;color:#fff}.msg{font-size:13px;margin-top:8px}.ok{color:#86efac}.bad{color:#fda4af}.race{background:#09192b;border:1px solid #2c4965;border-radius:14px;padding:10px;margin:8px 0}.head{display:flex;justify-content:space-between;gap:8px}.badge{padding:3px 7px;border-radius:99px;font-size:11px;font-weight:900}.P1{background:#7f1d1d}.P2{background:#9a3412}.P3{background:#854d0e}.P4{background:#1e40af}.P5{background:#166534}.P6{background:#065f46}.mono{font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:#dcecff;margin-top:6px}.line{font-size:13px;margin-top:4px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.kpi{background:#081728;border:1px solid #294563;border-radius:13px;padding:10px}.kpi b{display:block;font-size:21px}.scroll{overflow:auto;border:1px solid #294563;border-radius:13px}table{border-collapse:collapse;min-width:690px;width:100%;background:#09192b}th,td{padding:8px;border-bottom:1px solid #294563;font-size:12px;text-align:left}th{background:#16314c}select,input[type=file]{width:100%;padding:10px;border-radius:12px;background:#fff;color:#111}.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}pre{white-space:pre-wrap;background:#020817;border:1px solid #294563;border-radius:12px;padding:10px;color:#dcecff;font-size:12px}.foot{position:fixed;bottom:0;left:0;right:0;background:#07101fee;border-top:1px solid #294563;padding:9px;text-align:center;color:#9fb3c8;font-size:12px}
</style></head><body>
<h1>中央コンピ検証アプリ V1</h1><div class="sub">コンピ登録 → 事前判定 → 結果登録 → 集計。Safari内に自動保存。</div>
<div class="tabs"><button class="on" data-p="in">①コンピ</button><button data-p="res">②結果</button><button data-p="pre">③事前</button><button data-p="sum">④集計</button></div>
<section id="in" class="page on"><div class="card"><h2>コンピ一括登録</h2><div class="sub">3会場まとめて貼付可能。芝・ダ・距離は省略できます。</div><textarea id="ci" placeholder="[2026-07-19 函館]
1R 芝1200 1:88 8:65 4:64 5:57 2:55 3:54 6:46 7:40

[2026-07-19 小倉]
1R 9:82 8:75 10:63 5:56 1:54 6:53 4:51 2:49 11:48 3:41 7:40"></textarea><div class="actions"><button class="btn" id="saveC">登録</button><button class="btn g" id="sampleC">入力例</button><button class="btn g" id="clearC">クリア</button></div><div id="cm" class="msg"></div></div><div class="card"><h2>登録済み</h2><div id="meet"></div></div></section>
<section id="res" class="page"><div class="card"><h2>結果一括登録</h2><div class="sub">最後は三連複払戻。分からなければ省略できます。</div><textarea id="ri" class="short" placeholder="[2026-07-19 函館]
1R 1-5-3 1260
2R 7-4-1 7920"></textarea><div class="actions"><button class="btn" id="saveR">登録</button><button class="btn g" id="sampleR">入力例</button><button class="btn g" id="clearR">クリア</button></div><div id="rm" class="msg"></div></div><div class="card"><h2>バックアップ</h2><div class="actions"><button class="btn b" id="exp">JSON保存</button><button class="btn g" id="copy">チャッピー用コピー</button><button class="btn r" id="del">全削除</button></div><input id="imp" type="file" accept=".json,application/json" style="margin-top:10px"></div></section>
<section id="pre" class="page"><div class="card"><h2>事前判定</h2><div class="filters"><select id="fd"></select><select id="ft"></select><select id="fp"><option value="">全P</option><option>P1</option><option>P2</option><option>P3</option><option>P4</option><option>P5</option><option>P6</option></select></div><div id="list"></div></div></section>
<section id="sum" class="page"><div class="card"><h2>全体</h2><div class="grid" id="kpis"></div></div><div class="card"><h2>テクニカル6</h2><div class="scroll"><table><thead><tr><th>型</th><th>件数</th><th>平均配当</th><th>中央値</th><th>万馬券率</th><th>1位勝率</th></tr></thead><tbody id="ts"></tbody></table></div></div><div class="card"><h2>ボーダーライン</h2><div class="scroll"><table><thead><tr><th>理論</th><th>該当馬</th><th>馬券内</th><th>複勝率</th><th>1着</th></tr></thead><tbody id="bs"></tbody></table></div></div><div class="card"><h2>仮想買い目</h2><div class="scroll"><table><thead><tr><th>方式</th><th>対象</th><th>的中</th><th>購入</th><th>払戻</th><th>回収率</th></tr></thead><tbody id="bets"></tbody></table></div></div></section>
<div class="foot" id="status">端末保存：準備完了</div>
<script>
const K='centralCompiV1';let D=(()=>{try{return JSON.parse(localStorage.getItem(K))||{}}catch{return {}}})();
const $=x=>document.getElementById(x),yen=n=>Number.isFinite(n)?Math.round(n).toLocaleString()+'円':'—',pct=(a,b)=>b?(a*100/b).toFixed(1)+'%':'—',med=a=>{if(!a.length)return NaN;a=[...a].sort((x,y)=>x-y);let m=a.length>>1;return a.length%2?a[m]:(a[m-1]+a[m])/2};
function save(){localStorage.setItem(K,JSON.stringify(D));$('status').textContent='端末保存：'+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});draw()}
function head(s){let m=s.match(/^\[\s*(\d{4}[-/]\d{1,2}[-/]\d{1,2})\s+(.+?)\s*\]$/);return m?{date:m[1].replaceAll('/','-'),track:m[2].trim()}:null}
function pc(text){let c=null,out=[],err=[];text.split(/\r?\n/).forEach((z,i)=>{let s=z.trim();if(!s)return;let h=head(s);if(h){c=h;return}if(!c){err.push(`${i+1}行:会場見出しなし`);return}let m=s.match(/^(\d{1,2})R\s+(.+)$/i);if(!m){err.push(`${i+1}行:R形式違い`);return}let race=+m[1],rest=m[2],surface='',distance='';let q=rest.match(/^(芝|ダ|障害)\s*(\d{3,4})\s+(.+)$/);if(q){surface=q[1];distance=+q[2];rest=q[3]}let e=[...rest.matchAll(/(\d{1,2})\s*[:：=]\s*(\d{2,3})/g)].map((x,o)=>({horse:+x[1],index:+x[2],o}));if(e.length<3){err.push(`${i+1}行:指数3頭未満`);return}e.sort((a,b)=>b.index-a.index||a.o-b.o).forEach((x,j)=>x.rank=j+1);out.push({...c,race,surface,distance,entries:e})});return{out,err}}
function pr(text){let c=null,out=[],err=[];text.split(/\r?\n/).forEach((z,i)=>{let s=z.trim();if(!s)return;let h=head(s);if(h){c=h;return}if(!c){err.push(`${i+1}行:会場見出しなし`);return}let m=s.match(/^(\d{1,2})R\s+(\d{1,2})[-－>](\d{1,2})[-－>](\d{1,2})(?:\s+(\d[\d,]*))?$/);if(!m){err.push(`${i+1}行:結果形式違い`);return}out.push({...c,race:+m[1],finish:[+m[2],+m[3],+m[4]],payout:m[5]?+m[5].replaceAll(',',''):null})});return{out,err}}
const key=x=>`${x.date}|${x.track}|${x.race}`,races=()=>Object.values(D).sort((a,b)=>a.date.localeCompare(b.date)||a.track.localeCompare(b.track,'ja')||a.race-b.race);
function tech(e){let sum=e.slice(0,3).reduce((a,b)=>a+b.index,0),p=sum>=220?'P6':sum>=216?'P5':sum>=212?'P4':sum>=209?'P3':sum>=206?'P2':'P1',lab={P1:'激乱',P2:'波乱',P3:'やや波乱',P4:'平均',P5:'順当',P6:'順当'}[p];return{sum,p,lab}}
function det(r){let e=r.entries,n=e.length,t=tech(e),top=e[0].index;let mag=e.filter((x,i)=>x.index===46&&n>=13&&n<=16&&x.rank>=13&&(i===n-1||x.index-e[i+1].index>=4)).map(x=>({horse:x.horse,rank:x.rank,high:top>=81,gap:x.rank===n?0:x.index-e[x.rank].index}));let fifty=[];for(let i=2;i<n-1;i++){let a=e[i],b=e[i-1],c=e[i-2],nx=e[i+1],g=a.index-nx.index;if(a.index>=50&&b.index>=52&&c.index>=53&&g>=7)fifty.push({horses:[c,b,a],gap:g,after:nx.index})}let big=[];for(let i=0;i<n-1;i++){let rank=i+1,g=e[i].index-e[i+1].index;if(rank>=8&&rank<=10&&g>=7)big.push({type:'大断層1',horse:e[i],gap:g});if(rank>=6&&rank<=9&&g>=9)big.push({type:'大断層2',horse:e[i],gap:g});if(rank>=5&&rank<=6&&g>=12)big.push({type:'大断層3',horse:e[i],gap:g})}let last=n>=9&&n<=11&&[46,47].includes(e[n-1].index)?e[n-1]:null;return{t,mag,fifty,big,last}}
function boxHit(r,d){return d.fifty.some(f=>{let s=new Set([r.entries[0].horse,...f.horses.map(x=>x.horse)]);return r.result.finish.every(x=>s.has(x))})}
function draw(){let a=races(),comp=a.filter(x=>x.entries),done=comp.filter(x=>x.result),grp={};comp.forEach(r=>{let k=r.date+' '+r.track;(grp[k]??=[]).push(r)});$('meet').innerHTML=comp.length?Object.entries(grp).map(([k,v])=>`<div class="race"><div class="head"><b>${k}</b><span class="sub">${v.length}R／結果${v.filter(x=>x.result).length}</span></div></div>`).join(''):'<div class="sub">まだ登録なし</div>';
let dates=[...new Set(comp.map(x=>x.date))],tracks=[...new Set(comp.map(x=>x.track))];opt('fd',dates,'全日付');opt('ft',tracks,'全会場');pre();
let pay=done.map(x=>x.result.payout).filter(Number.isFinite);$('kpis').innerHTML=[['登録',comp.length],['結果',done.length],['万馬券',pay.filter(x=>x>=10000).length],['平均',yen(pay.length?pay.reduce((a,b)=>a+b,0)/pay.length:NaN)]].map(x=>`<div class="kpi"><span class="sub">${x[0]}</span><b>${x[1]}</b></div>`).join('');
$('ts').innerHTML=['P1','P2','P3','P4','P5','P6'].map(p=>{let x=done.filter(r=>det(r).t.p===p),q=x.map(r=>r.result.payout).filter(Number.isFinite),w=x.filter(r=>r.result.finish[0]===r.entries[0].horse).length;return`<tr><td><span class="badge ${p}">${p}</span></td><td>${x.length}</td><td>${yen(q.length?q.reduce((a,b)=>a+b,0)/q.length:NaN)}</td><td>${yen(med(q))}</td><td>${pct(q.filter(y=>y>=10000).length,q.length)}</td><td>${pct(w,x.length)}</td></tr>`}).join('');
let types=[['マグナム46',d=>d.mag.map(x=>x.horse)],['46＋1位81以上',d=>d.mag.filter(x=>x.high).map(x=>x.horse)],['50断層3頭',d=>d.fifty.flatMap(x=>x.horses.map(y=>y.horse))],['大断層直前',d=>d.big.map(x=>x.horse.horse)],['最下位46/47',d=>d.last?[d.last.horse]:[]]];$('bs').innerHTML=types.map(([n,f])=>{let N=0,P=0,W=0;done.forEach(r=>{let h=[...new Set(f(det(r)))];N+=h.length;P+=h.filter(x=>r.result.finish.includes(x)).length;W+=h.filter(x=>r.result.finish[0]===x).length});return`<tr><td>${n}</td><td>${N}</td><td>${P}</td><td>${pct(P,N)}</td><td>${W}</td></tr>`}).join('');
let T=0,H=0,B=0,Y=0;done.forEach(r=>{let d=det(r);if(d.fifty.length){T++;B+=400;if(boxHit(r,d)){H++;Y+=r.result.payout||0}}});$('bets').innerHTML=`<tr><td>50断層4頭BOX</td><td>${T}</td><td>${H}</td><td>${yen(B)}</td><td>${yen(Y)}</td><td>${pct(Y,B)}</td></tr>`}
function opt(id,a,first){let s=$(id),v=s.value;s.innerHTML=`<option value="">${first}</option>`+a.map(x=>`<option>${x}</option>`).join('');if(a.includes(v))s.value=v}
function pre(){let d=$('fd').value,t=$('ft').value,p=$('fp').value,x=races().filter(r=>r.entries&&(!d||r.date===d)&&(!t||r.track===t));$('list').innerHTML=x.map(r=>{let z=det(r);if(p&&z.t.p!==p)return'';let L=[];z.mag.forEach(m=>L.push(`💥マグナム46 ${m.horse}番(${m.rank}位${m.high?'・1位81以上':''})`));z.fifty.forEach(f=>L.push(`🟦50断層 ${f.horses.map(x=>x.horse+'番'+x.index).join('・')}→${f.after}`));z.big.forEach(g=>L.push(`🟧${g.type} ${g.horse.horse}番 差${g.gap}`));if(z.last)L.push(`🩷最下位46/47 ${z.last.horse}番`);return`<div class="race"><div class="head"><b>${r.date} ${r.track}${r.race}R</b><span class="badge ${z.t.p}">${z.t.p} ${z.t.sum}</span></div><div class="sub">${r.surface||''}${r.distance||''}／${r.entries.length}頭／結果 ${r.result?r.result.finish.join('-')+' '+yen(r.result.payout):'未入力'}</div><div class="mono">${r.entries.map(x=>`${x.rank}位 ${x.horse}:${x.index}`).join('　')}</div><div class="line">${L.join('<br>')||'特別ボーダーなし'}</div></div>`}).join('')||'<div class="sub">該当なし</div>'}
function download(n,s){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'application/json'}));a.download=n;a.click()}
function summary(){return races().filter(r=>r.entries).map(r=>{let d=det(r);return`[${r.date} ${r.track}${r.race}R]
COMPI ${r.entries.map(x=>x.horse+':'+x.index).join(' ')}
TECH ${d.t.p} ${d.t.sum}
MAGNUM ${d.mag.map(x=>x.horse).join(',')||'-'}
FIFTY ${d.fifty.map(f=>f.horses.map(x=>x.horse).join('-')).join(',')||'-'}
RESULT ${r.result?r.result.finish.join('-')+' '+(r.result.payout||''):'-'}`}).join('\n\n')}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button,.page').forEach(x=>x.classList.remove('on'));b.classList.add('on');$(b.dataset.p).classList.add('on');draw()});
$('saveC').onclick=()=>{let x=pc($('ci').value);x.out.forEach(r=>D[key(r)]={...(D[key(r)]||{}),...r});if(x.out.length)save();$('cm').innerHTML=`<span class="ok">${x.out.length}R登録</span>${x.err.length?'<br><span class="bad">'+x.err.join('<br>')+'</span>':''}`};
$('saveR').onclick=()=>{let x=pr($('ri').value);x.out.forEach(r=>D[key(r)]={...(D[key(r)]||r),result:{finish:r.finish,payout:r.payout}});if(x.out.length)save();$('rm').innerHTML=`<span class="ok">${x.out.length}R登録</span>${x.err.length?'<br><span class="bad">'+x.err.join('<br>')+'</span>':''}`};
$('sampleC').onclick=()=>ci.value='[2026-07-19 函館]\n1R 芝1200 1:88 8:65 4:64 5:57 2:55 3:54 6:46 7:40\n2R ダ1000 4:84 8:78 10:58 6:57 5:53 3:52 7:51 2:50 9:49 1:46\n\n[2026-07-19 小倉]\n1R 9:82 8:75 10:63 5:56 1:54 6:53 4:51 2:49 11:48 3:41 7:40';
$('sampleR').onclick=()=>ri.value='[2026-07-19 函館]\n1R 1-5-3 1260\n2R 7-4-1 7920\n\n[2026-07-19 小倉]\n1R 10-5-8 5380';$('clearC').onclick=()=>ci.value='';$('clearR').onclick=()=>ri.value='';['fd','ft','fp'].forEach(x=>$(x).onchange=pre);
$('exp').onclick=()=>download('central-compi-backup.json',JSON.stringify(D,null,2));$('copy').onclick=()=>navigator.clipboard.writeText(summary()).then(()=>alert('コピーしました')).catch(()=>prompt('コピー',summary()));$('del').onclick=()=>{if(confirm('全削除しますか？')){D={};save()}};$('imp').onchange=e=>{let f=e.target.files[0],r=new FileReader();r.onload=()=>{try{D=JSON.parse(r.result);save();alert('読込み完了')}catch{alert('JSONエラー')}};if(f)r.readAsText(f)};draw();
</script></body></html>
