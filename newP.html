id #f59e0b;background:linear-gradient(145deg,#3b2002,#78350f,#07101f)}\n.sectionYoso{border:3px solid #ec4899;background:linear-gradient(145deg,#4a102d,#831843,#07101f)}\n.sectionFinal{border:4px solid #facc15;background:radial-gradient(circle at top,#713f12,#2b2000 45%,#07101f);box-shadow:0 0 20px rgba(250,204,21,.22)}\n\n.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}\n.box{background:#020617;border:1px solid #475569;border-radius:11px;padding:8px}.boxL{font-size:10px;color:#93c5fd;font-weight:950}.boxV{font-size:17px;font-weight:950;margin-top:2px;line-height:1.35}\n.marketRow{background:#020617;border:1px solid #1e5b78;border-radius:11px;padding:8px;margin:6px 0}.marketName{font-weight:950;color:#bae6fd}.marketValue{font-size:13px;margin-top:2px}\n.horseChips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.horse{display:inline-block;background:#0f172a;border:1px solid #64748b;border-radius:999px;padding:4px 8px;font-weight:950}.horse.hot{border-color:#fb7185;color:#fecdd3}.horse.good{border-color:#4ade80;color:#bbf7d0}.horse.gold{border-color:#facc15;color:#fef08a}\n.tableWrap{overflow-x:auto}.miniTable{width:100%;border-collapse:collapse;font-size:12px}.miniTable th,.miniTable td{border-bottom:1px solid #334155;padding:5px 4px;text-align:left}.miniTable th{color:#93c5fd;font-size:10px}\n.finalThree{text-align:center;font-size:clamp(42px,13vw,70px);font-weight:1000;color:#fff7a8;letter-spacing:.02em;line-height:1.15;margin:7px 0;text-shadow:0 0 14px rgba(250,204,21,.28)}\n.finalWhy{background:#020617;border:1px solid #a16207;border-radius:12px;padding:8px;margin:6px 0;font-size:13px}.ticket{background:#020617;border:1px solid #a16207;border-radius:12px;padding:9px;margin:6px 0}.ticketL{font-size:11px;color:#fde68a;font-weight:950}.ticketV{font-size:17px;font-weight:950;line-height:1.65;margin-top:2px}\n\n/* 五市場順位表：旧アプリの見た目・壁表示をそのまま復元 */\n.marketScroll{overflow-x:auto;background:#061326;border-radius:10px;padding:4px 1px;margin-top:7px}\n.row{display:flex;align-items:center;min-width:max-content;margin:2px 0}\n.label{width:43px;min-width:43px;font-size:11px;font-weight:950}\n.cell{width:28px;min-width:28px;text-align:center;font-size:16px;font-weight:950;line-height:1.04}\n.pt{display:block;font-size:8px;color:#d8b4fe;line-height:1.0}\n.sep{width:1px;min-width:1px;height:21px;margin:0 1px;border-radius:4px;background:#35517a}\n.sep.big{width:4px;min-width:4px;height:25px;background:#fb7185;box-shadow:0 0 7px #fb7185}\n.sep.mid{width:3px;min-width:3px;height:24px;background:#f59e0b;box-shadow:0 0 6px #f59e0b}\n.sep.small{width:2px;min-width:2px;height:22px;background:#22d3ee}\n.sep.marketWall{width:4px;min-width:4px;height:27px;border:1px solid #ecfeff}\n.sep.baseWall{width:4px;min-width:4px;height:27px;border:1px solid #fff7a8}\n.sep.doubleWall{width:6px;min-width:6px;height:29px;border:1px solid #fff;background:linear-gradient(#fff 0 18%,currentColor 18% 82%,#fff 82%)}\n.sep.marketWall.uma{background:#fb7185;box-shadow:0 0 10px #fb7185}.sep.marketWall.tan{background:#38bdf8;box-shadow:0 0 10px #38bdf8}.sep.marketWall.fuku{background:#fde047;box-shadow:0 0 10px #fde047}.sep.marketWall.wide{background:#a78bfa;box-shadow:0 0 10px #a78bfa}.sep.marketWall.san{background:#4ade80;box-shadow:0 0 10px #4ade80}\n.sep.baseWall.tan{background:#f472b6;box-shadow:0 0 10px #f472b6}.sep.baseWall.fuku{background:#fb923c;box-shadow:0 0 10px #fb923c}\n.wallLegend{display:flex;gap:4px;flex-wrap:wrap;margin:6px 1px 2px;font-size:9px;font-weight:900}.wallLegend span{display:inline-flex;align-items:center;gap:4px;border:1px solid #475569;background:#111c35;border-radius:999px;padding:3px 6px}.legendLine{display:inline-block;width:19px;height:4px;border-radius:999px}.legendLine.uma{background:#fb7185;box-shadow:0 0 8px #fb7185}.legendLine.tan{background:#38bdf8;box-shadow:0 0 8px #38bdf8}.legendLine.fuku{background:#fde047;box-shadow:0 0 8px #fde047}.legendLine.wide{background:#a78bfa;box-shadow:0 0 8px #a78bfa}.legendLine.san{background:#4ade80;box-shadow:0 0 8px #4ade80}.legendLine.f6{background:#fde047;box-shadow:0 0 8px #fde047}.legendLine.f15{background:#fb923c;box-shadow:0 0 8px #fb923c}.legendLine.t80{background:#f472b6;box-shadow:0 0 8px #f472b6}\n\n\n/* V8.02: V6系からそのまま移植した重要表＋全馬タテ目 */\n.oldMarketCard{border:3px solid var(--blue);background:linear-gradient(145deg,#061326,#10285b,#07101f)}\n.tateCard{border:3px solid #14b8a6;background:linear-gradient(145deg,#042f2e,#115e59,#07101f)}\n.tateNote{background:#020617;border:1px solid #0f766e;border-radius:11px;padding:8px;margin:6px 0;font-size:12px;color:#ccfbf1}\n.tateTable{width:100%;border-collapse:collapse;min-width:620px;font-size:12px}\n.tateTable th{color:#99f6e4;font-weight:950;padding:5px;border-bottom:2px solid #0f766e;white-space:nowrap}\n.tateTable td{padding:5px;border-top:1px solid #334155;text-align:center;white-space:nowrap}\n\npre{white-space:pre-wrap;word-break:break-word;background:#020617;border-radius:11px;padding:9px;font-size:12px}\n@media(max-width:390px){.pHuge{font-size:68px}.detailHuge{font-size:24px}.modeHuge{font-size:26px}.rangeV{font-size:19px}.boxV{font-size:15px}}\n</style>\n</head>\n<body>\n<main>\n<h1>競馬メジアン <span class=\"tag\">V8.02</span><br>P型司令塔・旧五市場表＋全馬タテ目</h1>\n\n<div class=\"card\">\n  <div class=\"title\">レースデータ入力</div>\n  <div class=\"sub\">結果保存・CSV・履歴機能なし。予想だけに集中する新規設計。</div>\n  <textarea id=\"input\" placeholder=\"【2026年8月10日 盛岡9R】\n\n[COMPI]\n12 71\n2 69\n...\n\n[TANFUKU]\n12 3.7 2.1\n...\n\n[UMAREN]\n12-2 7.4\n...\n\n[WIDE]\n12-2 3.3 3.8\n...\n\n[SANPUKU]\n2-11-12 10.2\n...\n\n[YOSOSHI]\n7 11 12\"></textarea>\n  <button class=\"go\" onclick=\"run()\">解析する</button>\n  <button class=\"sample\" onclick=\"sample()\">盛岡9Rサンプル</button>\n  <button class=\"clear\" onclick=\"clearAll()\">リセット</button>\n  <button class=\"copy\" onclick=\"copyForChat()\">チャッピー用コピー</button>\n</div>\n\n<div id=\"out\"></div>\n</main>\n<script>\n'use strict';\nlet latest=null;\nconst $=id=>document.getElementById(id);\nconst esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst zen=s=>String(s||'').replace(/[０-９]/g,x=>String.fromCharCode(x.charCodeAt(0)-65248)).replace(/．/g,'.').replace(/[－ー―−]/g,'-').replace(/　/g,' ');\nconst nums=s=>(zen(s).match(/\\d+(?:\\.\\d+)?/g)||[]).map(Number);\nconst uniq=a=>[...new Set((a||[]).filter(x=>x!==null&&x!==undefined&&String(x)!=='').map(String))];\nconst sorted=(a,k='od')=>a.slice().sort((x,y)=>Number(x[k])-Number(y[k]));\nconst rankMap=a=>Object.fromEntries(a.map((h,i)=>[String(h),i+1]));\nconst fmt=a=>a&&a.length?a.map(x=>x+'番').join('・'):'なし';\nconst pairKey=(a,b)=>[String(a),String(b)].sort((x,y)=>+x-+y).join('-');\nconst triKey=(a,b,c)=>[String(a),String(b),String(c)].sort((x,y)=>+x-+y).join('-');\nfunction medianHorses(arr){if(!arr.length)return[];return arr.length%2?[arr[Math.floor(arr.length/2)]]:[arr[arr.length/2-1],arr[arr.length/2]]}\n\nfunction parse(raw){\n  const d={title:'レース',compi:[],tf:[],uma:[],wide:[],san:[],yoso:[]}; let sec='';\n  for(let line of zen(raw).split(/\\r?\\n/)){\n    line=line.trim(); if(!line)continue;\n    if(line.startsWith('【')){d.title=line.replace(/[【】]/g,'');continue}\n    const up=line.toUpperCase();\n    if(up.startsWith('[')){\n      if(up.includes('COMPI'))sec='C';\n      else if(up.includes('TAN')||up.includes('単複'))sec='TF';\n      else if(up.includes('UMAREN')||up.includes('馬連'))sec='U';\n      else if(up.includes('WIDE')||up.includes('ワイド'))sec='W';\n      else if(up.includes('SAN')||up.includes('三連複')||up.includes('3REN'))sec='S';\n      else if(up.includes('YOSO')||up.includes('予想師'))sec='Y';\n      else sec='';\n      continue;\n    }\n    const n=nums(line);\n    if(sec==='C'&&n.length>=2)d.compi.push({h:String(Math.floor(n[0])),pt:n[1]});\n    else if(sec==='TF'&&n.length>=2)d.tf.push({h:String(Math.floor(n[0])),tan:n[1],fuku:n.length>=3?n[n.length-1]:null});\n    else if(sec==='U'){\n      const m=line.match(/(\\d+)\\s*-\\s*(\\d+)/); if(m&&n.length>=3)d.uma.push({a:m[1],b:m[2],od:n[n.length-1]});\n    }else if(sec==='W'){\n      const m=line.match(/(\\d+)\\s*-\\s*(\\d+)/); if(m&&n.length>=3)d.wide.push({a:m[1],b:m[2],lo:n.length>=4?n[n.length-2]:n[n.length-1],hi:n[n.length-1],od:n[n.length-1]});\n    }else if(sec==='S'){\n      const m=line.match(/(\\d+)\\s*-\\s*(\\d+)\\s*-\\s*(\\d+)/); if(m&&n.length>=4)d.san.push({a:m[1],b:m[2],c:m[3],od:n[n.length-1]});\n    }else if(sec==='Y'&&n.length)d.yoso.push(...n.map(x=>String(Math.floor(x))));\n  }\n  d.yoso=uniq(d.yoso).slice(0,3);\n  return d;\n}\nfunction pClass(sum){return sum<=205?'P1':sum<=209?'P2':sum<=213?'P3':sum<=216?'P4':sum<=219?'P5':'P6'}\nfunction ratioWalls(rank,values,ratio=1.8){\n  const out=[]; for(let i=0;i<rank.length-1;i++){const a=+values[rank[i]],b=+values[rank[i+1]];if(a>0&&b/a>=ratio)out.push({idx:i,before:rank[i],next:rank[i+1],ratio:+(b/a).toFixed(2)});} return out;\n}\nfunction thresholdWall(rank,values,limit){let idx=-1;rank.forEach((h,i)=>{if(+values[h]<=limit)idx=i});return idx>=0&&idx<rank.length-1?{idx,before:rank[idx],next:rank[idx+1]}:null}\nfunction rankPairs(list){\n  const s={};sorted(list).forEach((p,i)=>[p.a,p.b].forEach(h=>{s[h]=s[h]||{h,c:0,b:999,z:0};s[h].c++;s[h].b=Math.min(s[h].b,i+1);s[h].z+=i+1}));\n  return Object.values(s).sort((x,y)=>y.c-x.c||x.b-y.b||x.z-y.z||+x.h-+y.h).map(x=>x.h);\n}\nfunction rankTri(list){\n  const s={};sorted(list).forEach((p,i)=>[p.a,p.b,p.c].forEach(h=>{s[h]=s[h]||{h,c:0,b:999,z:0};s[h].c++;s[h].b=Math.min(s[h].b,i+1);s[h].z+=i+1}));\n  return Object.values(s).sort((x,y)=>y.c-x.c||x.b-y.b||x.z-y.z||+x.h-+y.h).map(x=>x.h);\n}\nfunction rankUmaByFav(list,fav,fallback=[]){\n  fav=String(fav||''); if(!fav)return rankPairs(list);\n  const rows=sorted(list).filter(p=>String(p.a)===fav||String(p.b)===fav);\n  if(!rows.length)return rankPairs(list);\n  const mates=uniq(rows.map(p=>String(p.a)===fav?String(p.b):String(p.a)));\n  return uniq([fav,...mates,...fallback.filter(h=>h!==fav&&!mates.includes(h))]);\n}\nfunction venueMode(title=''){return /札幌|函館|福島|新潟|東京|中山|中京|京都|阪神|小倉/.test(title)?'JRA':'NAR'}\nfunction horsePairAnalysis(h,umaSorted){\n  h=String(h);\n  const withHorse=umaSorted.filter(x=>String(x.a)===h||String(x.b)===h);\n  if(withHorse.length<2)return {h,status:'馬連入力不足',ratio:null};\n  const p1=withHorse[0],p2=withHorse[1];\n  const m1=String(p1.a)===h?String(p1.b):String(p1.a);\n  const m2=String(p2.a)===h?String(p2.b):String(p2.a);\n  const cross=umaSorted.find(x=>pairKey(x.a,x.b)===pairKey(m1,m2));\n  if(!cross)return {h,status:'タテ目未入力',pair1:pairKey(p1.a,p1.b),pair2:pairKey(p2.a,p2.b),mate1:m1,mate2:m2,baseOdds:Number(p1.od),ratio:null};\n  return {h,status:'OK',pair1:pairKey(p1.a,p1.b),pair2:pairKey(p2.a,p2.b),mate1:m1,mate2:m2,verticalPair:pairKey(m1,m2),baseOdds:Number(p1.od),verticalOdds:Number(cross.od),ratio:Number(cross.od)/Number(p1.od)};\n}\n\nfunction typeAndRange(compi,p,otani,g13,firstMajor){\n  const n=compi.length,top4=n>=4?compi[0].pt-compi[3].pt:99,top1=compi[0]?.pt||0,g56=n>=6?compi[4].pt-compi[5].pt:null;\n  let type='標準上位型',code=p+'-S',feature='上位構造と市場を併用',mode='MID';\n  if(n>=4&&top4<=7){type='上位4頭密集・頭替わり型';code=p+'-A';feature='1着固定なし／上位4頭頭替わり＋壁下監査'}\n  else if(top1>=85&&g13>=18){type='一強・相手荒れ型';code=p+'-B';feature='1位能力抜け／相手荒れを重視';mode='SOLID'}\n  else if(top1>=80&&g13>=14){type='一強・相手入替型';code=p+'-C';feature='1位固定性高め／相手を市場で入替';mode='SOLID'}\n  else if(firstMajor&&firstMajor.after<=3){type='上位核＋壁直後侵入型';code=p+'-D';feature='壁前を核／壁直後を強制監査'}\n  else if(otani===3&&(p==='P1'||p==='P2'||p==='P3')){type='大谷式大穴型';code=p+'-E';feature='大谷3条件成立／上位固定を弱め中位・壁前後を保護';mode='UPSET'}\n  else if(p==='P1'||p==='P2'){type='低P・上位崩れ警戒型';code=p+'-F';feature='固定軸を作らず下位侵入まで監査';mode='UPSET'}\n  else if(g56!=null&&g56>=8){type='上位5頭ロック型';code=p+'-G';feature='5位後の壁を境に上位5頭内を優先'}\n  if((p==='P1'||p==='P2')&&!type.includes('一強'))mode='UPSET';\n  if((p==='P5'||p==='P6')&&mode!=='UPSET')mode='SOLID';\n  let head=3,place=5,third=7,note='標準型：上位中心';\n  if(type.includes('一強')){head=3;place=6;third=8;note='1位を残し、相手は6位・3着は8位まで'}\n  if(type.includes('上位4頭')){head=4;place=6;third=8;note='上位4頭は頭候補、壁下～8位を3着監査'}\n  if(type.includes('壁直後')){const w=Math.max(1,Math.min(n,firstMajor?.after||3));head=Math.min(4,w);place=Math.min(n,w+2);third=Math.min(n,w+4);note=`壁前${w}位を核、${third}位まで侵入監査`}\n  if(type.includes('大谷式')||type.includes('低P')){head=Math.min(n,7);place=Math.min(n,9);third=Math.min(n,12);note='上位崩れ型。頭7位・連対9位・3着12位まで拡張'}\n  if(type.includes('上位5頭')){head=5;place=5;third=6;note='1～5位主戦場、6位は3着まで'}\n  if((p==='P1'||p==='P2')&&!type.includes('一強')){head=Math.max(head,Math.min(n,6));place=Math.max(place,Math.min(n,8));third=Math.max(third,Math.min(n,10));note+='／低P補正'}\n  return {type,code,feature,mode,head,place,third,note,top4};\n}\n\nfunction build(d){\n  const compi=d.compi.slice().sort((a,b)=>b.pt-a.pt||+a.h-+b.h),cr=compi.map(x=>x.h),n=compi.length;\n  if(n<3)throw new Error('COMPIは最低3頭必要です');\n  const sum=compi.slice(0,3).reduce((s,x)=>s+x.pt,0),p=pClass(sum);\n  const gaps=[]; for(let i=0;i<n-1;i++)gaps.push({after:i+1,gap:compi[i].pt-compi[i+1].pt,before:compi[i].h,next:compi[i+1].h});\n  const maxGap=gaps.slice().sort((a,b)=>b.gap-a.gap||a.after-b.after)[0];\n  const firstMajor=gaps.find(x=>x.gap>=10)||gaps.find(x=>x.gap>=7)||null;\n  const g12=compi[0].pt-compi[1].pt,g23=compi[1].pt-compi[2].pt,g13=compi[0].pt-compi[2].pt;\n  const linePos=Math.max(1,Math.min(n,Math.ceil(n*.75))),lineHorse=compi[linePos-1];\n  const otaniRules=[compi[0].pt<=78,g13<=12,lineHorse&&lineHorse.pt>=40&&lineHorse.pt<=49];\n  const otani=otaniRules.filter(Boolean).length;\n  const meta=typeAndRange(compi,p,otani,g13,firstMajor);\n\n  const tan=sorted(d.tf.map(x=>({...x,od:x.tan})),'tan'),fuku=sorted(d.tf.filter(x=>x.fuku!=null).map(x=>({...x,od:x.fuku})),'fuku');\n  const tr=tan.map(x=>x.h),fr=fuku.map(x=>x.h),fav=tr[0]||'';\n  const ur=rankUmaByFav(d.uma,fav,cr),wr=rankPairs(d.wide),sr=rankTri(d.san);\n  const rm={compi:rankMap(cr),tan:rankMap(tr),fuku:rankMap(fr),uma:rankMap(ur),wide:rankMap(wr),san:rankMap(sr)};\n  const tv=Object.fromEntries(tan.map(x=>[x.h,x.tan])),fv=Object.fromEntries(fuku.map(x=>[x.h,x.fuku]));\n  const uv={}; if(fav){sorted(d.uma).filter(p=>[p.a,p.b].includes(fav)).forEach(p=>{const mate=p.a===fav?p.b:p.a;if(uv[fav]==null)uv[fav]=p.od;if(uv[mate]==null)uv[mate]=p.od})}\n  const wv={};sorted(d.wide).forEach(p=>[p.a,p.b].forEach(h=>{if(wv[h]==null)wv[h]=p.hi}));\n  const sv={};sorted(d.san).forEach(p=>[p.a,p.b,p.c].forEach(h=>{if(sv[h]==null)sv[h]=p.od}));\n  const walls={\n    uma:ratioWalls(ur,uv),tan:ratioWalls(tr,tv),fuku:ratioWalls(fr,fv),wide:ratioWalls(wr,wv),san:ratioWalls(sr,sv),\n    f6:thresholdWall(fr,fv,6),f10:thresholdWall(fr,fv,10),f15:thresholdWall(fr,fv,15),\n    t10:thresholdWall(tr,tv,10),t30:thresholdWall(tr,tv,30),t80:thresholdWall(tr,tv,80)\n  };\n  const wallFront=uniq([walls.f15?.before,walls.f10?.before,walls.f6?.before,walls.t10?.before,walls.t30?.before,walls.t80?.before,...walls.uma.map(x=>x.before),...walls.tan.map(x=>x.before),...walls.fuku.map(x=>x.before),...walls.wide.map(x=>x.before),...walls.san.map(x=>x.before)]);\n  const wallAfter=uniq([walls.f15?.next,walls.f10?.next,walls.f6?.next,walls.t10?.next,walls.t30?.next,walls.t80?.next,...walls.uma.map(x=>x.next),...walls.tan.map(x=>x.next),...walls.fuku.map(x=>x.next),...walls.wide.map(x=>x.next),...walls.san.map(x=>x.next)]);\n\n  // 1番人気信用度＋全馬タテ目（V5.36/V6系の旧ロジックをそのまま移植）\n  const umaSorted=sorted(d.uma);\n  const allHorseVertical=cr.map(h=>horsePairAnalysis(h,umaSorted));\n  const favVertical=allHorseVertical.find(x=>x.h===String(fav))||{h:String(fav||''),status:'判定不可',ratio:null};\n  const mate1=favVertical.mate1||'',mate2=favVertical.mate2||'';\n  const baseUma=favVertical.baseOdds??null,verticalOdds=favVertical.verticalOdds??null,verticalRatio=favVertical.ratio??null;\n  const sanSorted=sorted(d.san),contains=(x,h)=>[x.a,x.b,x.c].includes(h),absIdx=fav?sanSorted.findIndex(x=>!contains(x,fav)):-1;\n  const absence=absIdx>=0?absIdx+1:(sanSorted.length?sanSorted.length+1:null),absenceRow=absIdx>=0?sanSorted[absIdx]:null,absenceOdds=absenceRow?.od??null;\n  const favCompi=compi.find(x=>x.h===fav)?.pt??null,favCompiRank=rm.compi[fav]||99;\n  const marketFirstCount=[rm.tan[fav],rm.fuku[fav],rm.uma[fav],rm.wide[fav],rm.san[fav]].filter(x=>x===1).length;\n  let favLevel='通常',favNote='決定的な危険材料なし',favHeadOK=true;\n  if(verticalRatio!=null&&verticalRatio<4&&absenceOdds!=null&&absenceOdds<40){favLevel='危険・強警報';favNote='タテ目4倍未満＋三連複初不在40倍未満';favHeadOK=false}\n  else if((verticalRatio!=null&&verticalRatio<4)||(absenceOdds!=null&&absenceOdds<40)){favLevel='危険';favNote=(verticalRatio!=null&&verticalRatio<4?'タテ目4倍未満':'三連複初不在40倍未満');favHeadOK=false}\n  else if(absenceOdds!=null&&absenceOdds<60){favLevel='警戒';favNote='三連複初不在40～60倍帯';favHeadOK=false}\n  else if(fav&&favCompiRank>=5&&marketFirstCount>=4){favLevel='市場過集中';favNote='市場1位集中に対してコンピ順位が低い';favHeadOK=false}\n  else if(fav&&favCompi!=null&&favCompi>=88){favLevel='強い';favNote='コンピ88P以上＋市場中心';favHeadOK=true}\n\n  // 各種シグナルを一度だけ計算。最終3頭はこれをP型が使う。\n  const medians=uniq([...medianHorses(tr),...medianHorses(fr),...medianHorses(ur),...medianHorses(sr)]);\n  const marketRise=[];\n  cr.forEach(h=>{const c=rm.compi[h]||99;const gains=[rm.tan[h],rm.fuku[h],rm.uma[h],rm.wide[h],rm.san[h]].filter(Boolean).filter(r=>c-r>=2).length;if(gains>=2)marketRise.push(h)});\n  const midOverlap=[];\n  cr.forEach(h=>{const c=rm.compi[h]||99;if(c>=5&&c<=8){const hits=[rm.fuku[h],rm.uma[h],rm.wide[h],rm.san[h]].filter(r=>r&&r<=8).length;if(hits>=2)midOverlap.push({h,hits})}});\n  midOverlap.sort((a,b)=>b.hits-a.hits||(+rm.compi[a.h]-+rm.compi[b.h]));\n  const f15Pair=walls.f15?uniq([fr[Math.max(0,walls.f15.idx-1)],walls.f15.before]).filter(Boolean):[];\n\n  const overlapScore={}; const overlapReason={};\n  const ovAdd=(h,pts,reason)=>{if(!h)return;overlapScore[h]=(overlapScore[h]||0)+pts;(overlapReason[h]=overlapReason[h]||[]).push(reason)};\n  midOverlap.forEach(x=>ovAdd(x.h,x.hits,`中穴5～8位 ${x.hits}/4`));\n  f15Pair.forEach(h=>ovAdd(h,1,'複勝15壁前2頭'));\n  marketRise.forEach(h=>ovAdd(h,1,'市場複数上昇'));\n  walls.uma.forEach(w=>{ovAdd(w.before,1,'馬連壁前');ovAdd(w.next,1,'馬連壁直後')});\n  medians.forEach(h=>ovAdd(h,1,'メジアン'));\n  const bookMedian=Object.keys(overlapScore).map(h=>({h,score:overlapScore[h],reasons:uniq(overlapReason[h])})).sort((a,b)=>b.score-a.score||(+rm.compi[a.h]-+rm.compi[b.h]));\n\n  // 穴スコア：Pの許容順位内＋複数根拠を優先。人気上位を単純に穴扱いしない。\n  const holeScore={};const holeReason={};const addHole=(h,pts,reason)=>{if(!h)return;holeScore[h]=(holeScore[h]||0)+pts;(holeReason[h]=holeReason[h]||[]).push(reason)};\n  cr.forEach(h=>{\n    const r=rm.compi[h]||99,t=rm.tan[h]||99,fo=rm.fuku[h]||99,u=rm.uma[h]||99,w=rm.wide[h]||99,s=rm.san[h]||99;\n    if(r>=4&&r<=meta.head)addHole(h,3,'P型の頭穴順位内');\n    if(r>=5&&r<=meta.place)addHole(h,2,'P型の連対穴順位内');\n    if(r>=6&&r<=meta.third)addHole(h,1,'P型の3着穴順位内');\n    if(wallFront.includes(h))addHole(h,2,'壁前');\n    if(wallAfter.includes(h))addHole(h,3,'壁直後');\n    if(medians.includes(h))addHole(h,2,'メジアン');\n    if(marketRise.includes(h))addHole(h,3,'市場複数上昇');\n    const bm=bookMedian.find(x=>x.h===h);if(bm)addHole(h,bm.score,'書籍×メジアン重複'+bm.score);\n    if(t<=8||fo<=8||u<=8||w<=8||s<=8)addHole(h,1,'市場接続');\n    const tanOdd=tv[h];if(tanOdd!=null&&tanOdd>=5&&tanOdd<100)addHole(h,1,'単勝中穴帯');\n  });\n  const holes=Object.keys(holeScore).map(h=>({h,score:holeScore[h],reasons:uniq(holeReason[h]),rank:rm.compi[h]||99,tan:tv[h]??null})).sort((a,b)=>b.score-a.score||a.rank-b.rank||+a.h-+b.h);\n  const holeSingles=holes.filter(x=>x.rank>=4&&x.rank<=meta.head&&x.tan!=null&&x.tan>=5&&x.tan<100).slice(0,3).map(x=>x.h);\n  const bigHead=holes.find(x=>x.rank>=4&&x.rank<=meta.head)?.h||holes[0]?.h||'';\n  const win5Hole=holes.filter(x=>x.rank>=4&&x.rank<=meta.head).slice(0,2).map(x=>x.h);\n\n  // 青白光：5カテゴリ以上なら強い\n  const blue=[];\n  cr.forEach(h=>{const cats=[];if(wallFront.includes(h)||wallAfter.includes(h))cats.push('壁');if((rm.uma[h]||99)<=8)cats.push('馬連');if((rm.wide[h]||99)<=8)cats.push('ワイド');if((rm.san[h]||99)<=10)cats.push('三連複');if(medians.includes(h))cats.push('メジアン');if(marketRise.includes(h))cats.push('市場逆行');if(win5Hole.includes(h)||(rm.compi[h]||99)<=3)cats.push('WIN5');if(cats.length>=4)blue.push({h,cats})});\n\n  // 最終3頭：P型が司令塔。旧上位予想へ戻らない。\n  const finalScore={};const finalReason={};const addFinal=(h,pts,reason)=>{if(!h)return;finalScore[h]=(finalScore[h]||0)+pts;(finalReason[h]=finalReason[h]||[]).push(reason)};\n  const yoso=d.yoso;\n  if(meta.mode==='UPSET'){\n    // 荒れ型：予想師があれば「1～2頭保全＋穴補正」。なければ人気側1頭＋穴2頭。\n    yoso.forEach((h,i)=>addFinal(h,10-i*2,'予想師原型'));\n    holes.slice(0,8).forEach((x,i)=>addFinal(x.h,Math.max(3,10-i),'荒れ型穴スコア'));\n    bookMedian.slice(0,5).forEach((x,i)=>addFinal(x.h,7-i,'書籍×メジアン'));\n    if(bigHead)addFinal(bigHead,8,'大荒れ頭');\n    holeSingles.forEach((h,i)=>addFinal(h,7-i,'まっちゃん穴単'));\n    // 人気側は完全排除しない。1番人気が危険なら頭点は与えず、相手残し点のみ。\n    const stable=cr.slice(0,3).filter(h=>h!==fav||favHeadOK);\n    stable.forEach((h,i)=>addFinal(h,4-i,'上位残し'));\n    if(fav){addFinal(fav,favHeadOK?6:3,favHeadOK?'1人気保護':'危険1人気・相手残し')}\n  }else if(meta.mode==='SOLID'){\n    cr.slice(0,4).forEach((h,i)=>addFinal(h,12-i*2,'堅め型コンピ上位'));\n    yoso.forEach((h,i)=>addFinal(h,7-i,'予想師原型'));\n    holes.slice(0,4).forEach((x,i)=>addFinal(x.h,4-i,'相手穴補正'));\n    if(fav)addFinal(fav,favHeadOK?7:2,favHeadOK?'1人気信頼':'1人気警戒');\n  }else{\n    cr.slice(0,5).forEach((h,i)=>addFinal(h,8-i,'中間型コンピ'));\n    yoso.forEach((h,i)=>addFinal(h,8-i,'予想師原型'));\n    holes.slice(0,5).forEach((x,i)=>addFinal(x.h,6-i,'穴補正'));\n    if(fav)addFinal(fav,favHeadOK?5:2,favHeadOK?'1人気保護':'1人気警戒');\n  }\n  // 各市場上位はP型範囲内だけ加点\n  cr.forEach(h=>{const r=rm.compi[h]||99;if(r<=meta.third){const support=[rm.tan[h],rm.fuku[h],rm.uma[h],rm.wide[h],rm.san[h]].filter(x=>x&&x<=5).length;if(support)addFinal(h,support,'五市場上位'+support)}});\n  const rankedFinal=Object.keys(finalScore).map(h=>({h,score:finalScore[h],reasons:uniq(finalReason[h]),rank:rm.compi[h]||99})).filter(x=>x.rank<=meta.third).sort((a,b)=>b.score-a.score||a.rank-b.rank||+a.h-+b.h);\n\n  let final3=[];\n  if(meta.mode==='UPSET'){\n    // まず穴側トップを最低1頭、理想は2頭。次に人気・予想師側を残す。\n    const holePool=rankedFinal.filter(x=>holes.some(h=>h.h===x.h)&&x.rank>=4);\n    if(holePool[0])final3.push(holePool[0].h);\n    if(holePool[1]&&holePool[1].score>=holePool[0].score-4)final3.push(holePool[1].h);\n    const protectPool=rankedFinal.filter(x=>!final3.includes(x.h)&&((yoso.includes(x.h))||x.rank<=3||x.h===fav));\n    for(const x of protectPool){if(final3.length>=3)break;final3.push(x.h)}\n    for(const x of rankedFinal){if(final3.length>=3)break;if(!final3.includes(x.h))final3.push(x.h)}\n  }else final3=rankedFinal.slice(0,3).map(x=>x.h);\n  final3=uniq(final3).slice(0,3);\n\n  // 3頭内の役割\n  const headCandidates=final3.filter(h=>(rm.compi[h]||99)<=meta.head && !(h===fav&&!favHeadOK));\n  const headMain=headCandidates[0]||final3[0]||'';\n  const singleProtect=meta.mode==='UPSET'?holeSingles.slice(0,3):[];\n  const pairs=[];for(let i=0;i<final3.length;i++)for(let j=i+1;j<final3.length;j++)pairs.push(pairKey(final3[i],final3[j]));\n  const tri=final3.length===3?triKey(...final3):'';\n  return {d,compi,cr,sum,p,g12,g23,g13,maxGap,firstMajor,otani,meta,rm,tan,fuku,tr,fr,ur,wr,sr,tv,fv,walls,wallFront,wallAfter,\n    fav,favCompi,favCompiRank,marketFirstCount,mate1,mate2,baseUma,verticalOdds,verticalRatio,allHorseVertical,absence,absenceOdds,absenceRow,favLevel,favNote,favHeadOK,\n    medians,marketRise,midOverlap,f15Pair,bookMedian,holes,holeSingles,bigHead,win5Hole,blue,yoso,rankedFinal,final3,headMain,singleProtect,pairs,tri};\n}\n\nfunction compiRow(x){\n  let s='<div class=\"row\"><div class=\"label\">コンピ</div>';\n  x.compi.forEach((z,i)=>{\n    let c='sep';\n    if(i<x.compi.length-1){const g=z.pt-x.compi[i+1].pt;c+=g>=10?' big':g>=7?' mid':g>=4?' small':''}\n    s+=`<div class=\"cell\">${z.h}<span class=\"pt\">${z.pt}P</span></div>${i<x.compi.length-1?`<i class=\"${c}\"></i>`:''}`;\n  });\n  return s+'</div>';\n}\nfunction marketRankRow(label,arr,ratioList=[],baseList=[],market='uma'){\n  if(!arr.length)return'';\n  const ratioPairs=new Set((ratioList||[]).map(w=>`${w.before}>${w.next}`));\n  const basePairs=new Set((baseList||[]).filter(Boolean).map(w=>`${w.before}>${w.next}`));\n  let s=`<div class=\"row\"><div class=\"label\">${label}</div>`;\n  arr.forEach((h,i)=>{\n    s+=`<div class=\"cell\">${h}</div>`;\n    if(i<arr.length-1){\n      const pair=`${h}>${arr[i+1]}`,r=ratioPairs.has(pair),b=basePairs.has(pair);\n      const cls=r&&b?`doubleWall ${market}`:r?`marketWall ${market}`:b?`baseWall ${market}`:'';\n      s+=`<i class=\"sep ${cls}\"></i>`;\n    }\n  });\n  return s+'</div>';\n}\nfunction wallsText(arr){return arr&&arr.length?arr.map(w=>`${w.before}→${w.next} ${w.ratio}倍`).join(' ／ '):'明確な比率壁なし'}\nfunction allVerticalCard(x){\n  const rows=x.allHorseVertical||[];\n  return `<div class=\"card tateCard\"><div class=\"title\">🧪 全馬タテ目倍率（独自研究）</div>\n    <div class=\"tateNote\">各馬を仮想中心馬として、その馬を含む馬連上位2組の相手同士をタテ目にして計算。旧V5.36/V6系の表と計算方法をそのまま移植。</div>\n    <div class=\"marketScroll\" style=\"margin-top:8px\"><table class=\"tateTable\">\n      <thead><tr><th>馬</th><th>上位1組</th><th>上位2組</th><th>タテ目</th><th>基準</th><th>タテ目オッズ</th><th>倍率</th></tr></thead>\n      <tbody>${rows.map(z=>`<tr><td style=\"font-weight:950\">${z.h}</td><td>${z.pair1||'-'}</td><td>${z.pair2||'-'}</td><td>${z.verticalPair||'-'}</td><td>${z.baseOdds??'-'}</td><td>${z.verticalOdds??'-'}</td><td class=\"${z.ratio!=null&&z.ratio>=4?'good':z.ratio!=null?'warn':''}\">${z.ratio==null?esc(z.status):Number(z.ratio).toFixed(2)}</td></tr>`).join('')}</tbody>\n    </table></div>\n  </div>`;\n}\n\nfunction render(x){\n  const m=x.meta,modeClass=m.mode==='UPSET'?'mode-upset':m.mode==='SOLID'?'mode-solid':'mode-mid';\n  const modeLabel=m.mode==='UPSET'?'🔥 荒れモード':m.mode==='SOLID'?'🛡️ 本線保全モード':'⚖️ 選別モード';\n  const favTate=x.verticalRatio==null?'判定不可':`${x.verticalOdds}倍 ÷ ${x.baseUma}倍 = ${x.verticalRatio.toFixed(2)}倍`;\n  const absence=x.absence==null?'判定不可':`${x.absence}位 ${x.absenceRow?triKey(x.absenceRow.a,x.absenceRow.b,x.absenceRow.c):''} ${x.absenceOdds??'-'}倍`;\n  const holeRows=x.holes.slice(0,8).map(z=>`<tr><td>${z.h}</td><td>${z.rank}位</td><td>${z.score}</td><td>${esc(z.reasons.join('＋'))}</td></tr>`).join('');\n  const bmRows=x.bookMedian.slice(0,8).map(z=>`<tr><td>${z.h}</td><td>${z.score}</td><td>${esc(z.reasons.join('＋'))}</td></tr>`).join('');\n  const finalWhy=x.final3.map(h=>{const r=x.rankedFinal.find(z=>z.h===h);return `<div class=\"finalWhy\"><b>${h}番</b>：${esc((r?.reasons||[]).join('＋')||'総合選抜')}</div>`}).join('');\n  return `\n  <div class=\"card commander\">\n    <div class=\"cmdEyebrow\">🚨 最初にここを見る・P型司令塔</div>\n    <div class=\"pHuge\">${x.p}</div>\n    <div class=\"pSum\">上位3頭合計 ${x.sum}</div>\n    <div class=\"detailHuge\">${m.code} ${esc(m.type)}</div>\n    <div class=\"modeHuge ${modeClass}\">${modeLabel}</div>\n    <div class=\"cmdRule\">${esc(m.feature)}</div>\n    <div class=\"rangeGrid\">\n      <div class=\"range\"><div class=\"rangeL\">1着候補</div><div class=\"rangeV\">${m.head}位まで</div></div>\n      <div class=\"range\"><div class=\"rangeL\">連対候補</div><div class=\"rangeV\">${m.place}位まで</div></div>\n      <div class=\"range\"><div class=\"rangeL\">3着候補</div><div class=\"rangeV\">${m.third}位まで</div></div>\n    </div>\n    <div class=\"cmdTags\"><span class=\"pill\">大谷 ${x.otani}/3</span><span class=\"pill\">1-3差 ${x.g13}P</span><span class=\"pill\">最大壁 ${x.maxGap.after}位後 ${x.maxGap.gap}P</span><span class=\"pill\">${esc(m.note)}</span></div>\n  </div>\n\n  <div class=\"card sectionCompi\">\n    <div class=\"title\">① コンピ骨格</div>\n    <div class=\"grid2\">\n      <div class=\"box\"><div class=\"boxL\">レース型</div><div class=\"boxV\">${esc(m.type)}</div </div>\n\n  <div class=\"card sectionYoso\">\n    <div class=\"title\">④ 予想師原型</div>\n    <div class=\"sub\">入力がある場合だけ使用。P型を上書きせず、当たり部分を保全する材料にする。</div>\n    <div class=\"horseChips\">${x.yoso.length?x.yoso.map((h,i)=>`<span class=\"horse ${i===0?'gold':'good'}\">${['◎','○','▲'][i]||''} ${h}番</span>`).join(''):'<span class=\"sub\">[YOSOSHI] 未入力</span>'}</div>\n  </div>\n\n  <div class=\"card sectionHole\">\n    <div class=\"title\">⑤ 各種穴関係・研究シグナル</div>\n    <div class=\"grid2\">\n      <div class=\"box\"><div class=\"boxL\">まっちゃん穴単</div><div class=\"boxV\">${fmt(x.holeSingles)}</div></div>\n      <div class=\"box\"><div class=\"boxL\">大荒れ頭</div><div class=\"boxV\">${x.bigHead?x.bigHead+'番':'なし'}</div></div>\n      <div class=\"box\"><div class=\"boxL\">WIN5穴</div><div class=\"boxV\">${fmt(x.win5Hole)}</div></div>\n      <div class=\"box\"><div class=\"boxL\">市場複数上昇</div><div class=\"boxV\">${fmt(x.marketRise)}</div></div>\n      <div class=\"box\"><div class=\"boxL\">複勝15壁前2頭</div><div class=\"boxV\">${fmt(x.f15Pair)}</div></div>\n      <div class=\"box\"><div class=\"boxL\">青白光 4関以上</div><div class=\"boxV\">${x.blue.length?x.blue.map(z=>z.h+'番['+z.cats.join('+')+']').join(' / '):'なし'}</div></div>\n    </div>\n    <div class=\"title\" style=\"font-size:16px;margin-top:10px\">書籍×メジアン重複</div>\n    <div class=\"tableWrap\"><table class=\"miniTable\"><thead><tr><th>馬</th><th>重複</th><th>理由</th></tr></thead><tbody>${bmRows||'<tr><td colspan=\"3\">なし</td></tr>'}</tbody></table></div>\n    <div class=\"title\" style=\"font-size:16px;margin-top:10px\">P型穴スコア</div>\n    <div class=\"tableWrap\"><table class=\"miniTable\"><thead><tr><th>馬</th><th>コンピ</th><th>点</th><th>理由</th></tr></thead><tbody>${holeRows||'<tr><td colspan=\"4\">なし</td></tr>'}</tbody></table></div>\n  </div>\n\n  <div class=\"card sectionFinal\">\n    <div class=\"title\">⑥ P型へ戻して最終3頭</div>\n    <div class=\"sub\">最初のP型が最後まで司令塔。P1/P2大荒れ型で上位人気だけに戻ることを禁止。</div>\n    <div class=\"finalThree\">${x.final3.length?x.final3.join('・'):'判定不可'}</div>\n    ${finalWhy}\n    <div class=\"grid2\">\n      <div class=\"box\"><div class=\"boxL\">1着本線</div><div class=\"boxV\">${x.headMain?x.headMain+'番':'なし'}</div></div>\n      <div class=\"box\"><div class=\"boxL\">穴単100円保護</div><div class=\"boxV\">${fmt(x.singleProtect)}</div></div>\n    </div>\n    <div class=\"ticket\"><div class=\"ticketL\">馬連</div><div class=\"ticketV\">${x.pairs.length?x.pairs.join(' / '):'なし'}</div></div>\n    <div class=\"ticket\"><div class=\"ticketL\">ワイド</div><div class=\"ticketV\">${x.pairs.length?x.pairs.join(' / '):'なし'}</div></div>\n    <div class=\"ticket\"><div class=\"ticketL\">三連複</div><div class=\"ticketV\">${x.tri||'なし'}</div></div>\n  </div>`;\n}\n\nfunction run(){\n  try{const d=parse($('input').value);latest=build(d);$('out').innerHTML=render(latest);window.scrollTo({top:$('out').offsetTop-8,behavior:'smooth'});}catch(e){$('out').innerHTML=`<div class=\"card\"><div class=\"title\">入力エラー</div><div class=\"warn\">${esc(e.message)}</div></div>`}\n}\nfunction clearAll(){$('input').value='';$('out').innerHTML='';latest=null}\nfunction copyForChat(){\n  if(!latest){alert('先に解析してください');return}\n  const x=latest,m=x.meta;\n  const t=`【${x.d.title}】\\n競馬メジアン V8.02 P型司令塔・旧五市場表＋全馬タテ目・予想専用\\n\\n【最上段P司令塔】\\n${x.p}（${x.sum}）\\n${m.code} ${m.type}\\nモード：${m.mode==='UPSET'?'荒れ':m.mode==='SOLID'?'本線保全':'選別'}\\n大谷式：${x.otani}/3\\n1-3差：${x.g13}P\\n最大壁：${x.maxGap.after}位後${x.maxGap.gap}P（${x.maxGap.before}→${x.maxGap.next}）\\n頭：${m.head}位まで／連対：${m.place}位まで／3着：${m.third}位まで\\n\\n【1番人気信用度】\\n対象：${x.fav||'-'}番\\n判定：${x.favLevel}\\nタテ目倍率：${x.verticalRatio==null?'判定不可':x.verticalRatio.toFixed(2)+'倍'}\\n三連複初不在：${x.absenceOdds??'-'}倍\\n\\n【全馬タテ目倍率・独自研究】\\n${x.allHorseVertical.map(z=>`${z.h}番 ${z.pair1||'-'} / ${z.pair2||'-'} → ${z.verticalPair||'-'} ${z.verticalOdds??'-'}倍 ÷ ${z.baseOdds??'-'}倍 = ${z.ratio==null?z.status:z.ratio.toFixed(2)+'倍'}`).join('\\\\n')}\\n\\n【予想師原型】\\n${fmt(x.yoso)}\\n\\n【穴関係】\\nまっちゃん穴単：${fmt(x.holeSingles)}\\n大荒れ頭：${x.bigHead||'なし'}\\nWIN5穴：${fmt(x.win5Hole)}\\n市場複数上昇：${fmt(x.marketRise)}\\n書籍×メジアン上位：${x.bookMedian.slice(0,5).map(z=>z.h+'番('+z.score+')').join(' / ')||'なし'}\\n\\n【最終3頭】\\n${x.final3.join('・')}\\n1着本線：${x.headMain||'なし'}\\n穴単100円保護：${fmt(x.singleProtect)}\\n馬連：${x.pairs.join(' / ')}\\nワイド：${x.pairs.join(' / ')}\\n三連複：${x.tri||'なし'}`;\n  navigator.clipboard?.writeText(t).then(()=>alert('コピーしました')).catch(()=>prompt('コピーしてください',t));\n}\nfunction sample(){\n$('input').value=`【2026年8月10日 盛岡9R】\n\n[COMPI]\n12 71\n2 69\n11 68\n10 60\n1 59\n7 58\n3 46\n5 44\n4 43\n8 42\n6 41\n9 40\n\n[TANFUKU]\n12 3.7 2.1\n2 3.8 1.5\n11 4.9 2.8\n7 6.4 2.9\n10 7.1 3.4\n1 9.8 2.7\n4 25.5 13.4\n5 29.6 4.0\n9 35.2 14.3\n3 92.9 10.1\n6 123.8 37.5\n8 251.8 45.2\n\n[UMAREN]\n12-2 7.4\n12-11 7.8\n12-10 8.0\n12-7 17.4\n12-1 19.3\n12-4 46.7\n12-5 50.8\n12-9 126.3\n12-3 154.0\n12-6 237.8\n12-8 376.1\n\n[WIDE]\n12-2 3.3 3.8\n12-11 3.6 4.2\n12-1 4.2 4.8\n12-10 4.6 5.0\n12-7 4.9 5.4\n12-4 14.1 15.3\n12-5 16.9 18.5\n12-9 25.9 28.1\n12-3 45.8 49.6\n12-8 62.9 67.9\n12-6 63.7 68.8\n\n[SANPUKU]\n2-11-12 10.2\n10-11-12 13.1\n1-2-12 16.4\n2-10-12 16.9\n2-7-12 18.4\n1-2-11 20.5\n7-11-12 21.0\n2-7-11 22.0\n1-11-12 22.9\n2-10-11 23.4\n7-10-12 26.3\n1-10-12 28.4\n1-2-7 34.3\n2-7-10 34.9\n1-2-10 36.5\n7-10-11 38.1\n1-7-12 41.3\n1-10-11 42.8\n\n[YOSOSHI]\n7 11 12`;\nrun();\n}\n<\/script>\n</body>\n</html>\n";

 b.classList.add('active'); document.getElementById(b.dataset.t).classList.add('active');

function setTextAndRun(frame,txt){
 const d=frame.contentDocument,w=frame.contentWindow;if(!d)return false;
 const tas=[...d.querySelectorAll('textarea')];
 const ta=tas.find(x=>/COMPI|TANFUKU|入力|貼/.test((x.placeholder||'')+(x.value||'')))||tas[0];
 if(ta){ta.value=txt;ta.dispatchEvent(new Event('input',{bubbles:true}));ta.dispatchEvent(new Event('change',{bubbles:true}));}
 const btn=[...d.querySelectorAll('button,input[type=button],input[type=submit]')].find(x=>/解析|実行|判定|run/i.test((x.innerText||x.value||'')));
 if(btn){btn.click();return true} if(w&&typeof w.run==='function'){w.run();return true} return !!ta;
}
function bodyText(f){try{return f.contentDocument.body.innerText||''}catch(e){return ''}}
function pick(rex,s){const m=s.match(rex);return m?m[1].trim():''}
function buildFinal(){
 const h=bodyText(f125),m=bodyText(f265),p=bodyText(f802);
 const first=pick(/1着候補[:：]\s*([^\n]+)/,h), second=pick(/2着候補[:：]\s*([^\n]+)/,h);
 const a=pick(/3着A[^：:]*[:：]\s*([^\n]+)/,h), b=pick(/3着B[^：:]*[:：]\s*([^\n]+)/,h);
 const head=pick(/HEAD[:：]\s*([^/\n]+)/,h)||'通常';
 const big=pick(/大荒れ頭[:：]?\s*([0-9]+番?)/,m);
 const phead=pick(/1着本線[:：]\s*([0-9]+番?)/,p);
 const strong=/HEAD2-LOCK|HEAD3-LOCK|H2-BLOCK S|H2-BLOCK SS/.test(h);
 let out='【V1.31.4 完全統合司令塔】\n';
 out+='HEAD：'+head+'\n1着候補：'+(first||'-')+'\n2着候補：'+(second||'-')+'\n3着A：'+(a||'-')+'\n3着B：'+(b||'-')+'\n';
 if(big) out+='市場大荒れ頭：'+big+(strong?' → 強HEADのため頭上書き禁止・穴保護へ降格':' → HEAD通常時のみ頭候補として監査')+'\n';
 if(phead) out+='V8.02頭本線：'+phead+'\n';
 out+='優先順位：純コンピHEAD ＞ 市場補正 ＞ 穴保護 ＞ P型・タテ目監査';
 const box=document.getElementById('finalBox');box.textContent=out;box.style.display='block';return out;
}
document.getElementById('runBtn').onclick=()=>{

 document.getElementById('status').textContent='⏳ 3エンジン解析中…';
 setTextAndRun(f125,txt);setTextAndRun(f265,txt);setTextAndRun(f802,txt);
 setTimeout(()=>{buildFinal();document.getElementById('status').textContent='✅ 3エンジン解析完了'},1800);
};
document.getElementById('copyBtn').onclick=async()=>{const t=buildFinal();try{await navigator.clipboard.writeText(t);alert('コピーしました')}catch(e){prompt('コピーしてください',t)}};
