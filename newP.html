const dec=s=>decodeURIComponent(escape(atob(s)));
const frames={head:document.getElementById('headFrame'),market:document.getElementById('marketFrame'),p8:document.getElementById('p8Frame')};
frames.head.srcdoc=dec(B125);frames.market.srcdoc=dec(B265);frames.p8.srcdoc=dec(B802);
let lastFinalText='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uniq=a=>[...new Set((a||[]).filter(Boolean).map(Number))];

function parseNumList(text,rx){const m=text.match(rx);if(!m)return[];return uniq((m[1]||'').match(/\d+/g)||[])}
function parseOne(text,rx){const m=text.match(rx);return m?Number(m[1]):null}
function has(text,s){return text.indexOf(s)>=0}

async function waitReady(){for(let i=0;i<80;i++){try{if(frames.head.contentWindow&&frames.head.contentDocument?.getElementById('input')&&frames.market.contentDocument?.getElementById('input')&&frames.p8.contentDocument?.getElementById('input'))return true}catch(e){}await sleep(100)}return false}

async function runEngines(input){
 const ok=await waitReady();if(!ok)throw new Error('内部エンジンの準備に失敗しました');
 // HEAD
 const hw=frames.head.contentWindow,hd=frames.head.contentDocument;hd.getElementById('input').value=input;
 if(typeof hw.doAnalyze==='function')await hw.doAnalyze(false);else hd.getElementById('analyzeBtn')?.click();
 await sleep(80);
 // Market
 const mw=frames.market.contentWindow,md=frames.market.contentDocument;md.getElementById('input').value=input;if(typeof mw.run==='function')mw.run();
 await sleep(120);
 // P8
 const pw=frames.p8.contentWindow,pd=frames.p8.contentDocument;pd.getElementById('input').value=input;if(typeof pw.run==='function')pw.run();
 await sleep(80);
 return {hw,hd,mw,md,pw,pd};
}

function buildUnified(ctx){

 let first=uniq(pv?.first||a.headCandidates||[v.headMain,v.axis].concat(v.reversals||[]));

 let thirdA=uniq(pv?.thirdA||[]),thirdB=uniq(pv?.thirdB||[]),thirdC=uniq(pv?.thirdC||[]),thirdD=uniq(pv?.thirdD||[]);
 const blockStrong=a.h2==='H2-BLOCK S'||a.h2==='H2-BLOCK SS';

 const p8Final=parseNumList(ptxt,/【最終3頭】\s*([^\n]+)/);
 const p8Head=parseOne(ptxt,/1着本線：\s*(\d+)/);
 const favDanger=/判定：危険(?:・強警報)?/.test(ptxt)||/完全消滅危険\s*A/.test(mv);
 const marketUpset=/大荒れ/.test(mv)||/全面崩壊/.test(mv);
 const overrideException=a.np==='PF'&&a.x&&marketUpset&&((tri?.length||0)>=3||favDanger);
 let blockedHead=[];
 // 強HEADなら市場系は頭上書き禁止。3着穴へ送る
 if(headStrong&&!overrideException){
   blockedHead=uniq([marketBig,marketHole].concat(tri||[])).filter(h=>h&&!first.includes(h));
   thirdC=uniq(thirdC.concat(blockedHead)).slice(0,5);
 }else{
   // 通常HEADではV8本線を、元HEAD候補内なら先頭へ上げる
   if(p8Head&&first.includes(p8Head))first=uniq([p8Head].concat(first));
   // PF+X強例外だけ市場大荒れ頭を追加
   if(overrideException&&marketBig)first=uniq(first.concat([marketBig])).slice(0,5);
 }
 // V8最終3頭は相手補助。HEAD強では頭を変えず、2着へのみ追加
 second=uniq(second.concat(p8Final||[]).concat(tri||[])).slice(0,a.np==='PF'?7:6);
 // 市場穴は3着保護
 thirdC=uniq(thirdC.concat([marketHole,marketBig]).filter(h=>h&&!first.slice(0,2).includes(h))).slice(0,5);
 // 最終序列
 const headMain=first[0]||v.headMain||v.axis;
 const reverse=first.slice(1);
 const topOpp=second.filter(h=>h!==headMain).slice(0,5);
 const holes=uniq(thirdC.concat(thirdD).concat(blockedHead)).filter(h=>h&&!first.includes(h)).slice(0,5);
 // 買い目生成。BLOCK専用7点があればそれを優先
 let umaren=[];
 if(pv?.blockTickets?.length)umaren=pv.blockTickets.map(x=>x.join('-'));
 else{
  for(const h of first.slice(0,2)){for(const s of second){if(h!==s){const k=[h,s].sort((x,y)=>x-y).join('-');if(!umaren.includes(k))umaren.push(k)}if(umaren.length>=6)break}if(umaren.length>=6)break;}
 }
 let wide=[];for(const h of first.slice(0,2)){for(const x of uniq(topOpp.concat(holes))){if(h!==x){const k=[h,x].sort((a,b)=>a-b).join('-');if(!wide.includes(k))wide.push(k)}if(wide.length>=5)break}if(wide.length>=5)break}
 let san=[];const tpool=uniq(thirdA.concat(thirdB).concat(thirdC).concat(thirdD));for(const h of first.slice(0,2)){for(const s of second){if(s===h)continue;for(const t of tpool){if(t===h||t===s)continue;const k=[h,s,t].sort((a,b)=>a-b).join('-');if(!san.includes(k))san.push(k);if(san.length>=6)break}if(san.length>=6)break}if(san.length>=6)break}
 let level='通常';if(blockStrong)level='S級HEADロック';else if(head3)level='HEAD3ロック';else if(c2Strong)level='C2-S頭強化';if(overrideException)level='全面崩壊・ロック解除候補';
 const raceName=`${a.date||''} ${a.place||''}${a.race||''}R`.trim();
 return {a,pv,mv,ptxt,raceName,level,headMain,first,reverse,second,thirdA,thirdB,thirdC,thirdD,holes,blockedHead,marketBig,marketHole,tri,p8Final,p8Head,favDanger,overrideException,umaren:umaren.slice(0,7),wide:wide.slice(0,5),san:san.slice(0,6)};
}

function renderFinal(u){
 const rule=u.overrideException?'PF＋X＋市場独立警報でHEAD解除候補':'純コンピHEADを優先、市場は相手・穴補正';
 const tags=[u.a.np,u.a.h2||'H2なし',u.a.headCover||'HEAD通常',u.a.c2||'C2なし',u.a.t3h?'T3-HR':'T3-HR OFF',u.a.x?'X ON':'X OFF'];
 lastFinalText=`【${u.raceName}】\n競馬メジアン V1.31 完全統合司令塔\n\n【最終結論】\n1着本線：${u.headMain}\n逆転頭：${join(u.reverse)}\n1着候補：${join(u.first)}\n2着候補：${join(u.second)}\n3着A：${join(u.thirdA)}\n3着B：${join(u.thirdB)}\n穴保護：${join(u.holes)}\n頭上書き禁止：${join(u.blockedHead)}\n\n判定：${u.level}\n統合方針：${rule}\n\n馬連：${u.umaren.join(' / ')||'なし'}\nワイド：${u.wide.join(' / ')||'なし'}\n三連複：${u.san.join(' / ')||'なし'}\n\n内部：${tags.join(' / ')}`;
 document.getElementById('final').innerHTML=`<div class="card hero"><div class="heroTitle">🎯 ${esc(u.raceName)} 最終統合結論</div><div class="row">${tags.map((x,i)=>`<span class="badge ${i===1&&/BLOCK S/.test(x)?'locked':u.a.x?'warn':''}">${esc(x)}</span>`).join('')}</div><div class="divider"></div><div class="grid">
 <div class="box"><div class="k">1着本線</div><div class="v big">${u.headMain||'—'}番</div></div><div class="box"><div class="k">逆転頭</div><div class="v">${join(u.reverse)}</div></div>
 <div class="box"><div class="k">2着候補</div><div class="v cyan">${join(u.second)}</div></div><div class="box"><div class="k">穴保護（2・3着/ワイド）</div><div class="v purple">${join(u.holes)}</div></div>
 </div><div class="divider"></div><div class="grid"><div class="box"><div class="k">3着A 本線</div><div class="v">${join(u.thirdA)}</div></div><div class="box"><div class="k">3着B スライド</div><div class="v">${join(u.thirdB)}</div></div><div class="box"><div class="k">3着C/D・市場穴</div><div class="v">${join(uniq(u.thirdC.concat(u.thirdD)))}</div></div><div class="box"><div class="k">頭上書き禁止</div><div class="v redTxt">${join(u.blockedHead)}</div></div></div>
 <div class="divider"></div><div><span class="badge ${u.overrideException?'danger':'locked'}">${esc(u.level)}</span><span class="muted">${esc(rule)}</span></div></div>
 <div class="card"><b>🎫 最終圧縮買い目</b><div class="tickets">馬連　${esc(u.umaren.join(' / ')||'なし')}\nワイド ${esc(u.wide.join(' / ')||'なし')}\n三連複 ${esc(u.san.join(' / ')||'なし')}</div></div>
 <div class="card"><b>🔍 3エンジン監査</b><div class="grid"><div class="box"><div class="k">V1.25 HEAD</div><div class="v">${esc(u.a.headCover||'通常')}</div></div><div class="box"><div class="k">市場大荒れ頭</div><div class="v">${u.marketBig?u.marketBig+'番':'なし'}</div></div><div class="box"><div class="k">V8.02 1着本線</div><div class="v">${u.p8Head?u.p8Head+'番':'取得なし'}</div></div><div class="box"><div class="k">V8.02 最終3頭</div><div class="v">${join(u.p8Final)}</div></div></div></div>`;
}

document.getElementById('runAll').onclick=async()=>{const input=document.getElementById('masterInput').value.trim();if(!input){alert('コードを貼ってください');return}const st=document.getElementById('status');st.textContent='3エンジン解析中...';try{const ctx=await runEngines(input);const u=buildUnified(ctx);renderFinal(u);st.innerHTML='<span style="color:#86efac">完全統合解析完了</span>';document.getElementById('final').scrollIntoView({behavior:'smooth',block:'start'})}catch(e){st.innerHTML='<span style="color:#fb7185">'+esc(e.message||e)+'</span>'}};
document.getElementById('copyFinal').onclick=async()=>{if(!lastFinalText){alert('先に解析してください');return}try{await navigator.clipboard.writeText(lastFinalText);alert('最終結論をコピーしました')}catch(e){prompt('コピーしてください',lastFinalText)}};
document.getElementById('clear').onclick=()=>{document.getElementById('masterInput').value='';document.getElementById('final').innerHTML='';lastFinalText=''};
document.querySelectorAll('.tabbtn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabbtn').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.engine').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.t).classList.add('active')});
waitReady().then(ok=>document.getElementById('status').textContent=ok?'3エンジン準備完了':'エンジン準備に時間がかかっています');
</script></body></html>
