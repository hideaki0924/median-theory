<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>チャッピー競馬統合判定 V1.01 一括入力版</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f4f5f7;color:#171717}
main{max-width:980px;margin:auto;padding:14px}.card{background:white;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 1px 5px #0002}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:17px;margin:4px 0 10px}
textarea,input{width:100%;box-sizing:border-box;border:1px solid #bbb;border-radius:9px;padding:10px;font-size:14px}
textarea{min-height:105px;font-family:ui-monospace,monospace}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}
button{border:0;border-radius:10px;padding:12px 15px;font-weight:800;font-size:15px;background:#111;color:#fff;margin:5px 5px 5px 0}
button.secondary{background:#555}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#eee;margin:2px;font-weight:700}
.good{background:#dcfce7}.warn{background:#fef3c7}.bad{background:#fee2e2}
pre{white-space:pre-wrap;word-break:break-word;background:#f7f7f8;padding:12px;border-radius:10px}
small{color:#666}.big{font-size:20px;font-weight:900}.row{border-top:1px solid #eee;padding:8px 0}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body><main>
<h1>🏇 チャッピー競馬統合判定 V1.01 一括入力版</h1>

<div class="card">
<h2>一括コピペ入力</h2>
<textarea id="allin" style="min-height:420px" placeholder="ここに全部まとめて1回だけ貼り付け

【2026-08-20 園田7R】

[COMPI]
9 86
7 66
10 64

[TANFUKU]
9 1.8 1.1
10 5.3 1.5
2 5.6 1.6

[UMAREN]
9-10 3.0
7-9 4.5

[UMATAN]
9-10 6.0
10-9 12.1

[WIDE]
9-10 1.8
2-9 2.0

[SANREN]
2-7-9 5.7
7-9-10 6.1

[SANTAN]
9-2-7 20.0
10-9-2 25.0

[RESULT]
"></textarea>
<small>この欄だけ使えばOK。解析時に各市場へ自動振り分けします。</small>
</div>

<div style="display:none">
<input id="race">
<textarea id="compi"></textarea>
<textarea id="tf"></textarea>
<textarea id="uma"></textarea>
<textarea id="utan"></textarea>
<textarea id="wide"></textarea>
<textarea id="san"></textarea>
<textarea id="santan"></textarea>
</div>
<div>
<button onclick="run()">解析する</button><button class="secondary" onclick="copyChat()">チャッピー用コピー</button><button class="secondary" onclick="clearAll()">クリア</button>
</div>
<div id="out"></div>
</main>
<script>
const $=id=>document.getElementById(id);
const lines=id=>$(id).value.trim().split(/\n+/).map(x=>x.trim()).filter(Boolean);
function nums(s){return (s.match(/\d+(?:\.\d+)?/g)||[]).map(Number)}
function parseCompi(){return lines('compi').map(x=>{let n=nums(x);return {h:n[0],p:n[1]}}).filter(x=>x.h&&x.p).sort((a,b)=>b.p-a.p)}
function parseTF(){return lines('tf').map(x=>{let n=nums(x);return {h:n[0],tan:n[1],fuku:n[2]}}).filter(x=>x.h&&x.tan).sort((a,b)=>a.tan-b.tan)}
function parsePairs(id,nH){return lines(id).map(x=>{let n=nums(x);return {hs:n.slice(0,nH),o:n[nH]}}).filter(x=>x.hs.length===nH&&Number.isFinite(x.o)).sort((a,b)=>a.o-b.o)}
const key=hs=>[...hs].sort((a,b)=>a-b).join('-');
function oldP(sum){return sum<=203?'P1':sum<=207?'P2':sum<=211?'P3':sum<=215?'P4':sum<=219?'P5':'P6'}
function newP(c){
 if(c.length<3)return '—'; let p1=c[0].p,p2=c[1].p,p3=c[2].p,sum=p1+p2+p3,d12=p1-p2,d23=p2-p3;
 // V1.00 practical approximation; special gates are displayed separately.
 if(p1>=80&&d12>=10)return 'PA';
 if(p1>=78&&d12>=6)return 'PB';
 if(d12<=5&&p1>=72)return 'PC';
 if(sum<=203&&p1<75)return 'PF';
 if(p1<72||sum<=207)return 'PE';
 return 'PD';
}
function wall(c){let best={pos:0,gap:-1};for(let i=0;i<c.length-1;i++){let g=c[i].p-c[i+1].p;if(g>best.gap)best={pos:i+1,gap:g}}return best}
function median(a){a=[...a].sort((x,y)=>x-y);if(!a.length)return null;let m=Math.floor(a.length/2);return a.length%2?a[m]:(a[m-1]+a[m])/2}
function fmt(x){return Number.isFinite(x)?x.toFixed(2):'—'}
let latest='';
function parseAllInput(){
 const raw=$('allin').value.replace(/\r/g,'');
 if(!raw.trim())return;
 const title=(raw.match(/【([^】]+)】/)||[])[1] || (raw.match(/^\s*([^\n\[]+R)\s*$/m)||[])[1] || '';
 $('race').value=title.trim();

 const aliases={
   compi:['COMPI','コンピ'],
   tf:['TANFUKU','単複','TAN','TANFUKUODDS'],
   uma:['UMAREN','馬連','馬複'],
   utan:['UMATAN','馬単'],
   wide:['WIDE','ワイド'],
   san:['SANREN','三連複','3連複'],
   santan:['SANTAN','三連単','3連単']
 };
 const tags=[];
 for(const [id,names] of Object.entries(aliases)){
   for(const n of names)tags.push({id,name:n});
 }
 const tagPattern=tags.map(x=>x.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|');
 const re=new RegExp('^\\s*\\[('+tagPattern+'|RESULT)\\]\\s*$','gmi');
 let matches=[],m;
 while((m=re.exec(raw))!==null) matches.push({name:m[1],start:m.index,end:re.lastIndex});
 function idFor(name){
   name=name.toUpperCase();
   for(const [id,names] of Object.entries(aliases)){
     if(names.some(n=>n.toUpperCase()===name)) return id;
   }
   return null;
 }
 ['compi','tf','uma','utan','wide','san','santan'].forEach(id=>$(id).value='');
 for(let i=0;i<matches.length;i++){
   const cur=matches[i], next=matches[i+1];
   const id=idFor(cur.name);
   if(!id)continue;
   const body=raw.slice(cur.end,next?next.start:raw.length).trim();
   $(id).value=body;
 }
}
function run(){
 parseAllInput();
 let c=parseCompi(),tf=parseTF(),uma=parsePairs('uma',2),utan=parsePairs('utan',2),wide=parsePairs('wide',2),san=parsePairs('san',3),st=parsePairs('santan',3);
 if(c.length<3||!tf.length){alert('COMPI上位3頭以上と単複を入力してください');return}
 let p1=c[0].p,p2=c[1].p,p3=c[2].p,sum=p1+p2+p3,d12=p1-p2,d23=p2-p3,d13=p1-p3,w=wall(c),np=newP(c),op=oldP(sum);
 let fav=tf[0],favh=fav.h;
 // sub / H2 / X2
 let sub='—'; if(np==='PB'&&d12>=10)sub='PB-S'; else if(np==='PB'&&d23<=2)sub='PB-H'; else if(np==='PE'&&d12<=3)sub='PE-2H';
 let h2='—'; if(np==='PC'&&d12<=2&&d23>=19)h2='H2-BLOCK SS'; else if(np==='PC'&&d12<=2&&d23>=18)h2='H2-BLOCK S'; else if(np==='PC'&&d12<=2&&d23>=14)h2='H2-BLOCK A'; else if(p1>=80&&d12<=3)h2='H2-C SS'; else if(p1>=80&&d12<=5)h2='H2-C';
 let x2='OFF'; if(c.length>=14&&sum<=202){x2=(d12<=2&&w.gap<=7)?'SS':(d23>=6||((np==='PE'||np==='PF')&&w.pos>=3&&w.pos<=6))?'S':(np==='PD'&&d12>=11&&w.pos===1)?'A':'WATCH'}
 // favorite-axis quinella vertical
 let favPairs=uma.filter(x=>x.hs.includes(favh));
 let A=favPairs[0]?.hs.find(h=>h!==favh), B=favPairs[1]?.hs.find(h=>h!==favh), base=favPairs[0]?.o;
 let vert=uma.find(x=>A&&B&&key(x.hs)===key([A,B])); let ratio=(base&&vert)?vert.o/base:null;
 let verticalJudge=ratio==null?'未判定':ratio>4?'信頼側':'警戒側';
 // trifecta? triple initial absence
 let absenceIndex=san.findIndex(x=>!x.hs.includes(favh)), abs=absenceIndex>=0?san[absenceIndex]:null;
 let absRank=absenceIndex>=0?absenceIndex+1:null, absJudge=abs?(abs.o>=40?'信頼側':'警戒側'):'未判定';
 // 1.x compi warning
 let oneX=fav.tan<2;
 let compiOneX=oneX?(p1>=88?'大谷式本来ゾーン':'指数不足警戒'):'通常';
 // odds walls / median
 let fukus=tf.filter(x=>Number.isFinite(x.fuku)).sort((a,b)=>a.fuku-b.fuku);
 function boundary(v){let below=fukus.filter(x=>x.fuku<v).slice(-2), above=fukus.find(x=>x.fuku>=v);return {below,above}}
 let b6=boundary(6),b10=boundary(10),b15=boundary(15);
 let hole=tf.filter(x=>x.tan>=20&&x.tan<100), holeMed=median(hole.map(x=>x.tan));
 // market rank up
 let tanRank={};tf.forEach((x,i)=>tanRank[x.h]=i+1);let fsort=[...tf].filter(x=>Number.isFinite(x.fuku)).sort((a,b)=>a.fuku-b.fuku),fr={};fsort.forEach((x,i)=>fr[x.h]=i+1);
 let ups=fsort.filter(x=>tanRank[x.h]&&fr[x.h]<tanRank[x.h]).map(x=>`${x.h}(単${tanRank[x.h]}→複${fr[x.h]})`);
 // order top
 let utanTop=utan.slice(0,5).map(x=>`${x.hs.join('→')} ${x.o}`).join(' / ');
 let stTop=st.slice(0,5).map(x=>`${x.hs.join('→')} ${x.o}`).join(' / ');
 let headJudge=(ratio!=null&&ratio<=4)|| (oneX&&p1<88) ? '頭固定警戒' : '頭候補';
 let placeJudge=(abs&&abs.o>=40&&absRank>=10)?'馬券内◎':(abs&&abs.o<40)?'馬券内○〜△':'馬券内○';
 let text=`【${$('race').value||'レース'}】チャッピー競馬統合判定 V1.01 一括入力版
[P]
新P=${np} / 旧P=${op} / SUB=${sub} / H2=${h2} / X2=${x2}
1位=${c[0].h}:${p1} 2位=${c[1].h}:${p2} 3位=${c[2].h}:${p3}
上位3合計=${sum} / 1-2差=${d12} / 2-3差=${d23} / 1-3差=${d13}
最大壁=${w.pos}位後 ${w.gap}P

[1人気安全監査]
単勝1人気=${favh} ${fav.tan}倍 / コンピ1位=${p1} / ${compiOneX}
馬連A=${A??'-'} / B=${B??'-'}
馬連基準=${base??'-'} / A-Bタテ目=${vert?.o??'-'} / タテ目倍率=${fmt(ratio)} → ${verticalJudge}
三連複初不在=${absRank??'-'}位 / ${abs?abs.hs.join('-'):'-'} / ${abs?.o??'-'}倍 → ${absJudge}
総合=${headJudge} / ${placeJudge}

[穴センサー]
複勝6倍壁前=${b6.below.map(x=>x.h).join(',')||'-'} / 直後=${b6.above?.h??'-'}
複勝10倍壁前=${b10.below.map(x=>x.h).join(',')||'-'} / 直後=${b10.above?.h??'-'}
複勝15倍壁前=${b15.below.map(x=>x.h).join(',')||'-'} / 直後=${b15.above?.h??'-'}
単勝20〜100倍=${hole.map(x=>x.h+'('+x.tan+')').join(', ')||'-'} / メジアン=${holeMed??'-'}
単→複UP=${ups.join(', ')||'-'}

[ORDER市場]
馬単上位=${utanTop||'-'}
三連単上位=${stTop||'-'}

[RESULT]
`;
 latest=text;
 $('out').innerHTML=`<div class="card"><div class="big">${np}｜1人気${favh}：${headJudge}・${placeJudge}</div>
 <div class="row"><span class="pill ${ratio>4?'good':'warn'}">馬連タテ目 ${fmt(ratio)}</span>
 <span class="pill ${abs&&abs.o>=40?'good':'warn'}">三連複初不在 ${absRank??'-'}位 / ${abs?.o??'-'}倍</span>
 <span class="pill ${oneX&&p1<88?'bad':'good'}">${compiOneX}</span></div>
 <pre>${text}</pre></div>`;
}
async function copyChat(){if(!latest)run();try{await navigator.clipboard.writeText(latest);alert('チャッピー用結果をコピーしました')}catch(e){prompt('コピーしてください',latest)}}
function clearAll(){['allin','race','compi','tf','uma','utan','wide','san','santan'].forEach(x=>$(x).value='');$('out').innerHTML='';latest=''}
</script></body></html>
