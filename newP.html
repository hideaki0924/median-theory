<script>
const HTML125 = "<!doctype html>\n<html lang=\"ja\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover\">\n<meta name=\"theme-color\" content=\"#07101f\">\n<meta name=\"app-build\" content=\"central-newp-v1.23-slide-subtype-20260815\">\n<title>競馬メジアン 中央新P統合研究所 V1.25</title>\n\n<style>\n:root{\n  --bg:#07101f;--card:#0e1d3c;--card2:#0a1731;--line:#2f466f;\n  --cyan:#67e8f9;--yellow:#fde047;--red:#fb7185;--green:#4ade80;\n  --orange:#fb923c;--violet:#c084fc;--muted:#a8b4cc;--white:#f8fafc;\n}\n*{box-sizing:border-box}\nhtml,body{margin:0;background:var(--bg);color:var(--white);overflow-x:hidden}\nbody{\n font-family:-apple-system,BlinkMacSystemFont,\"Hiragino Sans\",\"Yu Gothic\",sans-serif;\n padding:8px 8px calc(34px + env(safe-area-inset-bottom));\n line-height:1.45\n}\nmain{max-width:1100px;margin:auto}\nh1{font-size:21px;margin:4px 0 2px}\n.sub{color:var(--muted);font-size:12px;margin-bottom:9px}\n\n.topbar,.rowbuttons{\n display:flex;gap:6px;flex-wrap:wrap;margin:8px 0\n}\nbutton,.btn{\n border:0;border-radius:11px;padding:10px 12px;font-weight:800;font-size:14px;\n background:#1d4ed8;color:#fff;cursor:pointer\n}\nbutton.secondary{background:#334155}\nbutton.green{background:#15803d}\nbutton.orange{background:#c2410c}\nbutton.red{background:#be123c}\nbutton.purple{background:#7e22ce}\nbutton:disabled{opacity:.45}\n\n.card{\n background:var(--card);border:1px solid var(--line);\n border-radius:15px;padding:11px;margin:9px 0;overflow:hidden\n}\n.card.inner{background:var(--card2)}\n\ntextarea,input,select{\n width:100%;background:#061128;color:#fff;border:1px solid #3b557f;\n border-radius:10px;padding:10px;font-size:16px;outline:none\n}\ntextarea{\n min-height:260px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;\n line-height:1.45;resize:vertical\n}\n\n.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}\n.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}\n.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}\n\n@media(max-width:700px){\n .grid2,.grid3,.grid4{grid-template-columns:1fr}\n}\n\n.badges{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}\n.badge{\n display:inline-flex;align-items:center;border-radius:999px;\n padding:4px 8px;font-size:12px;font-weight:900;\n background:#263b62;border:1px solid #49628c\n}\n.badge.pa{background:#14532d}\n.badge.pb{background:#166534}\n.badge.pc{background:#164e63}\n.badge.pd{background:#1e3a8a}\n.badge.pe{background:#7c2d12}\n.badge.pf{background:#881337}\n.badge.h2{background:#6b21a8}\n.badge.x{background:#991b1b}\n.badge.subb{background:#854d0e}\n.badge.structure{background:#334155}\n.badge.pick{background:#713f12}\n.badge.slide0{background:#14532d}\n.badge.slide1{background:#854d0e}\n.badge.slide2{background:#9a3412}\n.badge.slide2p{background:#991b1b}\n.badge.x3{background:#701a75}\n\n.title{font-weight:900;color:var(--cyan);font-size:17px}\n.kv{display:grid;grid-template-columns:145px 1fr;gap:3px 8px;font-size:14px}\n.kv .k{color:var(--muted)}\n.kv .v{font-weight:800;overflow-wrap:anywhere}\n.big{font-size:23px;font-weight:950}\n\n.good{color:var(--green)}\n.warn{color:var(--yellow)}\n.bad{color:var(--red)}\n.cyan{color:var(--cyan)}\n\n.rankline{font-size:14px;margin-top:4px}\n.horses{font-size:22px;font-weight:950;letter-spacing:.04em}\n.sep{height:1px;background:#2d4368;margin:9px 0}\n.note{font-size:12px;color:var(--muted)}\n.mini{font-size:12px}\n\n.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}\n@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}\n\n.stat{\n background:#08162e;border:1px solid #2e466d;\n border-radius:12px;padding:8px;text-align:center\n}\n.stat .n{font-size:22px;font-weight:950}\n.stat .l{font-size:11px;color:var(--muted)}\n\n.tablewrap{overflow:auto;border-radius:10px}\ntable{border-collapse:collapse;width:100%;min-width:980px;font-size:12px}\nth,td{\n border-bottom:1px solid #294263;\n padding:7px;white-space:nowrap;text-align:left\n}\nth{\n position:sticky;top:0;background:#0a1731;\n color:var(--cyan);z-index:1\n}\n\n.tabs{\n display:flex;gap:5px;position:sticky;top:0;\n background:rgba(7,16,31,.96);padding:5px 0;z-index:5\n}\n.tab{flex:1;background:#253756}\n.tab.active{background:#1d4ed8}\n.panel{display:none}\n.panel.active{display:block}\n\n.notice{\n border-left:4px solid var(--yellow);padding:7px 9px;\n background:#2a2207;border-radius:8px;font-size:13px\n}\n.engine{\n border-left:4px solid var(--cyan);padding:7px 9px;\n background:#052632;border-radius:8px;font-size:12px\n}\n.finalbox{\n border:2px solid #f59e0b!important;\n background:#251b05!important\n}\n.slidebox{\n border:2px solid #c084fc!important;\n background:#1f1230!important\n}\n.practicalbox{\n border:2px solid #22c55e!important;\n background:#0c2118!important\n}\n.practical-grid{\n display:grid;grid-template-columns:140px 1fr;gap:7px 10px;align-items:start\n}\n.practical-grid .k{color:#b7c3d9;font-weight:800}\n.practical-grid .v{font-weight:950;font-size:19px;overflow-wrap:anywhere}\n.third-a{color:#f8fafc}\n.third-b{color:#67e8f9}\n.third-c{color:#fde047}\n.third-d{color:#fb7185}\ndetails.research{\n margin-top:8px;border:1px solid #3a4d6e;border-radius:12px;background:#09162c\n}\ndetails.research>summary{\n cursor:pointer;padding:10px 12px;font-weight:900;color:#cbd5e1\n}\ndetails.research[open]>summary{border-bottom:1px solid #294263}\ndetails.research .research-body{padding:9px}\nhr{border:0;border-top:1px solid #294263}\n</style>\n</head>\n\n<body>\n<main>\n\n<h1>競馬メジアン 中央新P統合研究所 V1.25</h1>\n<div class=\"sub\">\n696R再構築PA〜PF ＋ 3着スライドV0.5 ＋ H2-BLOCK ＋ HEAD司令塔V1.0。BLOCK最優先、C2/T3-H/T3-2を独立統合\n</div>\n\n<div class=\"tabs\">\n <button class=\"tab active\" data-tab=\"judge\">予想判定</button>\n <button class=\"tab\" data-tab=\"history\">保存履歴</button>\n <button class=\"tab\" data-tab=\"stats\">検証集計</button>\n</div>\n\n<section id=\"judge\" class=\"panel active\">\n\n<div class=\"card\">\n <div class=\"title\">① データを貼る</div>\n <div class=\"note\">\n [COMPI]必須。[PICK]はコンピ推奨馬。[RESULT]は後から追加して同じレースを再保存できます。\n </div>\n\n<textarea id=\"input\" spellcheck=\"false\" placeholder=\"【2026年8月15日 新潟1R】\n[COMPI]\n10 86\n12 72\n2 62\n4 56\n3 54\n9 52\n11 51\n1 50\n14 49\n13 48\n7 47\n8 46\n5 41\n6 40\n\n[PICK]\n12\n\n[RESULT]\n12-3-10\"></textarea>\n\n <div class=\"topbar\">\n  <button id=\"analyzeBtn\">解析・確認</button>\n  <button id=\"saveBtn\" class=\"green\">解析・保存</button>\n  <button id=\"sampleBtn\" class=\"secondary\">サンプル</button>\n  <button id=\"clearBtn\" class=\"red\">入力クリア</button>\n </div>\n\n <div id=\"status\" class=\"note\">入力待機中</div>\n</div>\n\n<div class=\"engine\">\n実戦表示は<strong>1着候補 → 2着候補 → 3着A/B/C/D → レース全体 → 3着荒れ度</strong>の順。\nPA〜PF・S2+・X3・壁・指数帯などの研究情報は下の「研究詳細」にまとめます。\n</div>\n\n<div id=\"results\"></div>\n\n</section>\n\n<section id=\"history\" class=\"panel\">\n\n<div class=\"card\">\n <div class=\"title\">保存履歴</div>\n\n <div class=\"topbar\">\n  <button id=\"reanalyzeAll\" class=\"purple\">V1.23で全件再解析</button>\n  <button id=\"exportJson\" class=\"green\">JSONバックアップ</button>\n  <button id=\"exportCsv\" class=\"orange\">CSV出力</button>\n  <button id=\"importJson\" class=\"purple\">JSON読込</button>\n  <input id=\"importFile\" type=\"file\" accept=\".json,application/json\" style=\"display:none\">\n  <button id=\"deleteAll\" class=\"red\">全件削除</button>\n </div>\n\n <div class=\"notice\">\n V1.20から更新する前にJSONバックアップ推奨。更新後は\n 「V1.23で全件再解析」を押すと、保存済みレースにも3着スライド判定が追加されます。\n </div>\n\n <div class=\"tablewrap\">\n <table>\n  <thead>\n  <tr>\n   <th>日付</th><th>場</th><th>R</th>\n   <th>新P</th><th>構造</th><th>SUB</th><th>H2</th><th>X</th>\n   <th>3着S</th><th>深候補</th><th>X3</th>\n   <th>PICK</th><th>頭候補</th><th>削除禁止</th><th>最終5頭</th>\n   <th>参加</th><th>結果</th><th>順位</th><th>操作</th>\n  </tr>\n  </thead>\n  <tbody id=\"historyBody\"></tbody>\n </table>\n </div>\n</div>\n\n</section>\n\n<section id=\"stats\" class=\"panel\">\n\n<div class=\"card\">\n\n <div class=\"title\">総合集計</div>\n <div id=\"statsCards\" class=\"stats\"></div>\n\n <div class=\"sep\"></div>\n\n <div class=\"title\">新P別</div>\n <div class=\"tablewrap\">\n <table>\n  <thead>\n   <tr>\n    <th>型</th><th>結果済</th><th>1位勝率</th><th>1位馬券内</th>\n    <th>頭候補捕捉</th><th>最終5頭3頭内包</th><th>PICK馬券内</th>\n   </tr>\n  </thead>\n  <tbody id=\"pStatsBody\"></tbody>\n </table>\n </div>\n\n <div class=\"sep\"></div>\n\n <div class=\"title\">3着スライド検証</div>\n <div class=\"tablewrap\">\n <table>\n  <thead>\n   <tr>\n    <th>判定</th><th>結果済</th><th>3着1〜5位</th><th>3着6〜8位</th>\n    <th>3着9位以下</th><th>深候補的中</th><th>X3的中</th>\n   </tr>\n  </thead>\n  <tbody id=\"slideStatsBody\"></tbody>\n </table>\n </div>\n\n <div class=\"sep\"></div>\n\n <div class=\"title\">特殊警報</div>\n <div class=\"tablewrap\">\n <table>\n  <thead>\n   <tr>\n    <th>警報</th><th>結果済</th><th>2位勝率</th><th>2位馬券内</th>\n    <th>頭候補捕捉</th><th>最終5頭内包</th>\n   </tr>\n  </thead>\n  <tbody id=\"specialStatsBody\"></tbody>\n </table>\n </div>\n\n <div class=\"sep\"></div>\n\n <div class=\"title\">特殊指数帯</div>\n <div class=\"tablewrap\">\n <table>\n  <thead>\n   <tr>\n    <th>指数帯</th><th>対象馬数</th><th>1着</th><th>2着</th><th>3着</th><th>馬券内率</th>\n   </tr>\n  </thead>\n  <tbody id=\"indexStatsBody\"></tbody>\n </table>\n </div>\n\n</div>\n\n</section>\n\n</main>\n\n<script>\n'use strict';\n\nconst $=s=>document.querySelector(s);\nconst $$=s=>Array.from(document.querySelectorAll(s));\n\nconst esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({\n '&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'\n}[c]));\n\nconst uniq=a=>[...new Set(a.filter(x=>x!==null&&x!==undefined&&x!==''\n))];\n\nconst pct=(n,d)=>d?`${(100*n/d).toFixed(1)}%`:'—';\n\n/* ==============================\n   中央新P コア\n   ============================== */\n\nconst P_BANDS={\n PA:{head:[1,2,3],place2:[1,2,3,4,5],place3:[1,2,3,4,5,6,7],desc:'1位強軸型'},\n PB:{head:[1,2,3,4],place2:[1,2,3,4,5,6],place3:[1,2,3,4,5,6,7],desc:'1位優勢・穴侵入型'},\n PC:{head:[1,2,3],place2:[1,2,3,4,5],place3:[1,2,3,4,5,6,7],desc:'上位入替型'},\n PD:{head:[1,2,3,4,5],place2:[1,2,3,4,5,6,7,8],place3:[1,2,3,4,5,6,7,8],desc:'標準混戦型'},\n PE:{head:[1,2,3,4,5,6],place2:[1,2,3,4,5,6,7],place3:[1,2,3,4,5,6,7,8],desc:'1位危険型'},\n PF:{head:[2,3,4,5,6,7,8],place2:[1,2,3,4,5,6,7,8,9],place3:[1,2,3,4,5,6,7,8,9],desc:'全面崩壊型'}\n};\n\nfunction oldP(sum){\n if(sum<=203)return 'P1';\n if(sum<=207)return 'P2';\n if(sum<=211)return 'P3';\n if(sum<=215)return 'P4';\n if(sum<=219)return 'P5';\n return 'P6';\n}\n\nfunction newP(f){\n const {n,p1,sum,d12,wallPos,wallGap}=f;\n if(d12<=4){\n  if(p1<=75){\n   if(wallPos<=3){\n    if(p1<=74){\n     if(d12<=3)return wallGap<=10?'PF':'PE';\n     return 'PE';\n    }\n    return 'PE';\n   }else{\n    if(n<=8)return wallGap<=9?'PC':'PD';\n    return 'PE';\n   }\n  }else{\n   if(n<=12)return sum<=215?'PD':'PC';\n   return 'PD';\n  }\n }else{\n  if(n<=13){\n   if(p1<=82){\n    if(sum<=215)return 'PD';\n    return n<=12?'PC':'PD';\n   }else{\n    if(sum<=215)return 'PB';\n    if(d12<=9){\n     if(d12<=7)return n<=12?'PC':'PD';\n     return 'PB';\n    }\n    return 'PA';\n   }\n  }\n  return 'PD';\n }\n}\n\nfunction subType(f){\n const {n,p1,p2,p3,sum,d12,d23,wallPos,wallGap}=f;\n if(p1<=74){\n  if(wallPos<=3){\n   if(d12<=3){\n    if(wallGap<=10)return 'PF';\n    return wallPos<=2?'PE-2H':'';\n   }\n   return '';\n  }else{\n   if(d23<=4)return '';\n   if(p2<=68)return '';\n   if(n<=8)return '';\n   return d12<=2?'PE-2H':'';\n  }\n }else{\n  if(p1<=83){\n   if(p1<=75){\n    if(d12<=2)return sum<=216?'PE-2H':'';\n    return '';\n   }else{\n    if(p1<=82)return '';\n    if(n<=11){\n     if(sum<=216)return p3<=61?'PB-H':'PB-S';\n     return '';\n    }\n    return '';\n   }\n  }else{\n   if(sum<=215){\n    if(n<=13)return d23<=6?'PB-S':'PB-H';\n    return '';\n   }else{\n    if(d12<=9){\n     if(d12<=7)return '';\n     return 'PB-H';\n    }\n    return '';\n   }\n  }\n }\n}\n\nfunction xFlag(f){\n return f.sum<=204 && f.n>=14;\n}\n\n/* ==============================\n   入力\n   ============================== */\n\nfunction parseBlocks(text){\n const norm=text.replace(/\\r/g,'').trim();\n if(!norm)return [];\n const starts=[...norm.matchAll(/【([^】]+)】/g)];\n if(!starts.length)throw new Error('【日付 場R】の見出しがありません');\n\n const out=[];\n for(let i=0;i<starts.length;i++){\n  const head=starts[i][1].trim();\n  const from=starts[i].index+starts[i][0].length;\n  const to=i+1<starts.length?starts[i+1].index:norm.length;\n  const body=norm.slice(from,to);\n\n  const m=\n   head.match(/(\\d{4})年(\\d{1,2})月(\\d{1,2})日\\s+(.+?)(\\d+)R$/)\n   ||\n   head.match(/(\\d{4})-(\\d{1,2})-(\\d{1,2})\\s+(.+?)(\\d+)R$/);\n\n  if(!m)throw new Error(`見出しを読めません：${head}`);\n\n  const date=`${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;\n  const place=m[4].trim();\n  const race=Number(m[5]);\n\n  const compiSec=(body.match(/\\[COMPI\\]([\\s\\S]*?)(?=\\n\\[[A-Z]+\\]|$)/i)||[])[1];\n  if(!compiSec)throw new Error(`${head}：[COMPI]がありません`);\n\n  const compi=[];\n  compiSec.split('\\n').forEach(line=>{\n   const mm=line.trim().match(/^(\\d+)\\s+(\\d+(?:\\.\\d+)?)/);\n   if(mm)compi.push({horse:Number(mm[1]),point:Number(mm[2])});\n  });\n\n  if(compi.length<3)throw new Error(`${head}：コンピは最低3頭必要です`);\n  compi.sort((a,b)=>b.point-a.point);\n\n  const pickSec=(body.match(/\\[PICK\\]([\\s\\S]*?)(?=\\n\\[[A-Z]+\\]|$)/i)||[])[1]||'';\n  const pickMatch=pickSec.match(/(\\d+)/);\n  const pick=pickMatch?Number(pickMatch[1]):null;\n\n  const resSec=(body.match(/\\[RESULT\\]([\\s\\S]*?)(?=\\n\\[[A-Z]+\\]|$)/i)||[])[1]||'';\n  const rm=resSec.match(/(\\d+)\\s*[-－]\\s*(\\d+)\\s*[-－]\\s*(\\d+)/);\n  const result=rm?[Number(rm[1]),Number(rm[2]),Number(rm[3])]:[];\n\n  out.push({date,place,race,compi,pick,result});\n }\n return out;\n}\n\n/* ==============================\n   構造\n   ============================== */\n\nfunction structureType(f){\n const {p1,d12,d23,d13,wallPos,wallGap}=f;\n if(d12>=20)return '一強・大断層型';\n if(d12<=4 && d23>=10)return '上位2頭ブロック型';\n if(d12<=5 && d23<=5)return '上位密集・頭替わり型';\n if(wallPos>=4 && wallGap>=10)return '上位ロック・壁直後侵入型';\n if(p1<=75 && d12<=5)return '1位危険・全面入替型';\n if(d13<=10)return '上位3頭密集型';\n if(wallPos<=2 && wallGap>=10)return '上位断層型';\n return '標準構造型';\n}\n\n/* ==============================\n   3着スライド V0.5\n   ============================== */\n\nfunction thirdSlideJudge(c,f){\n const n=f.n;\n const p1=f.p1;\n const p3=c[2]?.point;\n const p5=c[4]?.point;\n const d35=Number.isFinite(p3)&&Number.isFinite(p5)?p3-p5:null;\n\n let slide='S1';\n let slideSub='';\n let label='軽スライド';\n let level='中';\n let baseThird='1〜8位';\n\n if(n<=9){\n  slide='S0';\n  label='固定型';\n  level='低';\n  baseThird='1〜5位';\n }\n else if(Number.isFinite(d35) && n>=14 && d35<=7){\n\n  slide='S2+';\n\n  /* 696R S2+ 230Rを再分解したV0.5 */\n  if(f.d23>=10 && f.d12<=10){\n   slideSub='A';\n   label='上位2頭ブロック型';\n   level='中';\n   baseThird='1〜8位中心';\n  }\n  else if(f.d12<=5 && f.d23<=5){\n   slideSub='B';\n   label='上位密集・深滑り型';\n   level='最高';\n   baseThird='1〜8位＋深層';\n  }\n  else if(f.d12>=10){\n   slideSub='C';\n   label='1位突出・下位流動型';\n   level='最高';\n   baseThird='1〜8位＋深層';\n  }\n  else{\n   slideSub='D';\n   label='混合型';\n   level='高';\n   baseThird='1〜8位＋深層';\n  }\n }\n else if(Number.isFinite(d35) && d35>=8 && p1<=76){\n  slide='S2';\n  label='深スライド警戒';\n  level='高';\n  baseThird='1〜8位＋深層';\n }\n else if(Number.isFinite(d35) && d35>=8 && p1>=77){\n  slide='S0+';\n  label='上位止まり寄り';\n  level='低〜中';\n  baseThird='1〜8位';\n }\n else{\n  slide='S1';\n  label='軽スライド';\n  level='中';\n  baseThird='1〜8位';\n }\n\n const deepPool=c\n  .map((z,i)=>({rank:i+1,horse:z.horse,point:z.point}))\n  .filter(z=>z.rank>=9&&z.rank<=12&&z.point>=46&&z.point<=52);\n\n /* Aは深滑り率が低いため2頭まで。B/Cは3頭、DとS2は2頭 */\n let deepLimit=0;\n if(slide==='S2+') deepLimit=(slideSub==='B'||slideSub==='C')?3:2;\n else if(slide==='S2') deepLimit=2;\n\n const deepCandidates=deepPool.slice(0,deepLimit);\n\n const x3Pool=c\n  .map((z,i)=>({rank:i+1,horse:z.horse,point:z.point}))\n  .filter(z=>z.rank>=14&&z.rank<=16&&z.point>=40&&z.point<=42);\n\n /* A型は超深を自動ONにしない。B/C/DまたはS2で最大壁12P以下の時だけ */\n const x3Eligible=\n  slide==='S2' ||\n  (slide==='S2+' && slideSub!=='A');\n\n const x3On=x3Eligible && f.wallGap<=12 && x3Pool.length>0;\n const x3Hot=x3On && p1<=72;\n\n return {\n  slide,slideSub,label,level,baseThird,d35,\n  deepPool,\n  deepCandidates,\n  x3On,\n  x3Hot,\n  x3Candidates:x3On?x3Pool:[],\n  deepRule:'9〜12位 × 46〜52P',\n  x3Rule:'14〜16位 × 40〜42P'\n };\n}\n\n/* ==============================\n   信頼\n   ============================== */\n\nfunction trustJudge(a){\n let head='C';\n let place='C';\n if(a.np==='PA'){head='A';place='A';}\n else if(a.np==='PB'){head='B';place='B';}\n else if(a.np==='PC'){head='C';place='B';}\n else if(a.np==='PD'){head='C';place='B';}\n else if(a.np==='PE'){head='D';place='C';}\n else if(a.np==='PF'){head='D';place='D';}\n\n if(a.sub==='PE-2H')head='D';\n if(a.h2==='H2-C SS'){head='B';place='B';}\n if(a.h2==='H2-BLOCK S'){head='A';place='A';}\n if(a.h2==='H2-BLOCK SS'){head='A';place='A';}\n if(a.x){\n  if(head==='A')head='B';\n  else if(head==='B')head='C';\n  if(place==='A')place='B';\n }\n return {head,place};\n}\n\n/* ==============================\n   解析\n   ============================== */\n\nfunction analyzeRace(r){\n const c=r.compi;\n const n=c.length;\n\n const p1=c[0].point;\n const p2=c[1].point;\n const p3=c[2].point;\n const p5=c[4]?.point??null;\n\n const sum=p1+p2+p3;\n const d12=p1-p2;\n const d23=p2-p3;\n const d13=p1-p3;\n const d35=Number.isFinite(p5)?p3-p5:null;\n const p4=c[3]?.point??null;\n const d34=Number.isFinite(p4)?p3-p4:null;\n const pickRank=r.pick?((c.findIndex(z=>z.horse===r.pick))+1):null;\n\n let wallPos=1;\n let wallGap=-Infinity;\n let secondPos=null;\n let secondGap=-Infinity;\n\n const gaps=[];\n for(let i=0;i<c.length-1;i++){\n  gaps.push({pos:i+1,gap:c[i].point-c[i+1].point});\n }\n gaps.sort((a,b)=>b.gap-a.gap||a.pos-b.pos);\n\n if(gaps[0]){wallPos=gaps[0].pos;wallGap=gaps[0].gap;}\n if(gaps[1]){secondPos=gaps[1].pos;secondGap=gaps[1].gap;}\n\n const f={n,p1,p2,p3,sum,d12,d23,d13,wallPos,wallGap};\n const op=oldP(sum);\n const np=newP(f);\n const sub=subType(f);\n const x=xFlag(f);\n\n let h2='';\n /* H2-BLOCK V1.0（696R検証）\n    A : PC＋1-2差<=2＋2-3差14〜17P = 研究監視級\n    S : PC＋1-2差<=2＋2-3差18P以上 = 実戦強判定\n    SS: Sのうち2-3差19P以上 = 最上位信頼表示\n */\n if(np==='PC' && d12<=2 && d23>=19)h2='H2-BLOCK SS';\n else if(np==='PC' && d12<=2 && d23>=18)h2='H2-BLOCK S';\n else if(np==='PC' && d12<=2 && d23>=14)h2='H2-BLOCK A';\n else if(p1>=80 && d12<=3)h2='H2-C SS';\n else if(p1>=80 && d12<=5)h2='H2-C';\n else if(p1>=80&&op==='P3'&&np==='PD'&&d12>=10&&d12<=18&&d23>=6)h2='H2-D SS';\n\n /* HEAD司令塔 V1.0（V1.55・696R再検証）\n    C2-S: 1-2差=1P＋2-3差>=8P。全28Rで2位頭60.7%。\n           ただしBLOCK S重複5Rは2位頭2/5のため、BLOCKを必ず優先。\n           BLOCK外かつNP!=PCでは2位頭15? ではなく12/17=70.6%相当の強化帯。\n    C2-A/B: 研究タグのみ（頭強制なし）。\n    T3-HR: 3位指数>=69＋3-4差>=12P。18R中17Rで上位3頭頭(94.4%)。\n    T3-2: 3-4差>=13P＋PICK順位1/2。馬連2点研究。PCでは抑制。\n */\n let c2='';\n if(d12===1 && d23>=8)c2='C2-S';\n else if(d12===2 && d23>=8)c2='C2-A';\n else if(d12===3 && d23>=8)c2='C2-B';\n\n const t3h=Number.isFinite(d34) && p3>=69 && d34>=12;\n const t3hOriginal=Number.isFinite(d34) && p3>=70 && d34>=12;\n const t32=Number.isFinite(d34) && d34>=13 && (pickRank===1||pickRank===2);\n let headCover='';\n if(h2==='H2-BLOCK S'||h2==='H2-BLOCK SS') headCover='HEAD2-LOCK';\n else if(t3h) headCover='HEAD3-LOCK';\n else if(c2==='C2-S' && np!=='PC') headCover='HEAD2-C2';\n else if(c2==='C2-S') headCover='HEAD2-C2-WATCH';\n\n let band={\n  ...P_BANDS[np],\n  head:[...P_BANDS[np].head],\n  place2:[...P_BANDS[np].place2],\n  place3:[...P_BANDS[np].place3]\n };\n\n const notes=[];\n\n if(c2==='C2-S'){\n  if(h2==='H2-BLOCK S'||h2==='H2-BLOCK SS') notes.push('C2-S発動。ただしH2-BLOCKと重複するため2位固定は禁止・BLOCK優先');\n  else if(np!=='PC') notes.push('C2-S強化：BLOCK外＋非PC。コンピ2位を頭本線へ昇格');\n  else notes.push('C2-S監視：PCでは2位頭固定せず、2位を頭有力候補に留める');\n }\n if(c2==='C2-A')notes.push('C2-A：2位頭有力の研究タグ。実戦頭は強制しない');\n if(c2==='C2-B')notes.push('C2-B：2位頭候補・連軸研究タグ。実戦頭は強制しない');\n if(t3h)notes.push(`T3-HR：3位${p3}P＋3-4差${d34}P。頭を上位3頭へロック`);\n if(t32){\n  if(np==='PC')notes.push('T3-2：条件成立だがPCでは馬連2点の自動推奨を抑制');\n  else notes.push('T3-2：PICK＋上位3頭残り2頭への馬連2点を監視候補');\n }\n\n if(sub==='PB-S'){\n  band.head=[1,2,3];\n  notes.push('PB-S：PA寄り。頭1〜3位を優先');\n }\n if(sub==='PB-H')notes.push('PB-H：1位優勢だが下位侵入を強制監査');\n if(sub==='PE-2H'){\n  band.head=[2,3,4,5,6,7];\n  notes.push('PE-2H：1位を頭から降格。2位を逆転頭A');\n }\n if(np==='PF')notes.push('PF：全面崩壊型。1位頭固定禁止');\n if(x){\n  notes.push('X：下位侵入警報。2・3着帯を拡張');\n  band.place2=uniq(band.place2.concat([9,10]));\n  band.place3=uniq(band.place3.concat([9,10]));\n }\n\n const structure=structureType(f);\n const slide=thirdSlideJudge(c,f);\n\n if(slide.slide==='S2+'){\n  const tag=slide.slideSub?`S2+${slide.slideSub}`:'S2+';\n  notes.push(`3着${tag}：${slide.label} / 3-5差${slide.d35}P`);\n }else if(slide.slide==='S2'){\n  notes.push(`3着S2：1位${p1}P＋3-5差${slide.d35}P。9〜12位を解禁`);\n }\n if(slide.deepCandidates.length){\n  notes.push(`3着深候補：${slide.deepCandidates.map(z=>`${z.horse}番(${z.rank}位/${z.point}P)`).join('・')}`);\n }\n if(slide.x3On){\n  notes.push(`X3${slide.x3Hot?'🔥':''}：超深3着候補 ${slide.x3Candidates.map(z=>`${z.horse}番(${z.rank}位/${z.point}P)`).join('・')}`);\n }\n\n const byRank=rank=>c[rank-1]?.horse;\n\n const band54to57=c.filter(z=>z.point>=54&&z.point<=57).map(z=>z.horse);\n const mid49to55=c.filter(z=>z.point>=49&&z.point<=55).map(z=>z.horse);\n const low46to49=c.filter(z=>z.point>=46&&z.point<=49).map(z=>z.horse);\n\n let headRanks=[...band.head];\n let headPriority=[];\n\n if(h2==='H2-BLOCK SS'||h2==='H2-BLOCK S'){\n  headPriority=[1,2];\n  headRanks=[1,2];\n  notes.push(`${h2}：頭はコンピ1・2位に圧縮。2着は5位以内、3着は8位以内を基本`);\n }\n else if(h2==='H2-BLOCK A'){\n  headPriority=[1,2,3,4,5];\n  notes.push('H2-BLOCK A：14〜17P帯は監視級。頭1・2位を強制固定しない');\n }\n else if(t3h){\n  headPriority=[1,2,3];\n  headRanks=[1,2,3];\n }\n else if(c2==='C2-S' && np!=='PC'){\n  headPriority=[2,1,3,4,5,6];\n  headRanks=uniq([2,1,3].concat(headRanks));\n }\n else if(c2==='C2-S'){\n  headPriority=[2,1,3,4,5,6];\n }\n else if(h2==='H2-C SS'||h2==='H2-C'){\n  headPriority=[2,1,3,4,5];\n  headRanks=uniq([2,1,3].concat(headRanks));\n  notes.push(`${h2}：コンピ2位を頭上位へ昇格`);\n }\n else if(h2==='H2-D SS'){\n  headPriority=[2,1,3,4,5,6,7];\n  notes.push('H2-D SS：2位頭攻撃型');\n }\n else if(sub==='PE-2H')headPriority=[2,3,4,5,6,7,1];\n else if(np==='PA'||np==='PB')headPriority=[1,2,3,4,5];\n else if(np==='PF')headPriority=[2,3,4,5,6,7,8,1];\n else headPriority=[1,2,3,4,5,6];\n\n let headCandidates=[];\n headPriority.forEach(rr=>{\n  if(headRanks.includes(rr)||h2){\n   const h=byRank(rr);\n   if(h)headCandidates.push(h);\n  }\n });\n headCandidates=uniq(headCandidates).slice(0,6);\n\n let protectedHorses=[];\n if(np==='PA')protectedHorses.push(byRank(1));\n if(sub==='PE-2H')protectedHorses.push(byRank(2));\n if(h2.startsWith('H2-C'))protectedHorses.push(byRank(2));\n if(h2.startsWith('H2-BLOCK'))protectedHorses.push(byRank(1),byRank(2));\n if(h2==='H2-D SS')protectedHorses.push(byRank(1),byRank(2));\n if(t3h)protectedHorses.push(byRank(1),byRank(2),byRank(3));\n if(c2==='C2-S')protectedHorses.push(byRank(2));\n\n const wallAfter=byRank(wallPos+1);\n if(wallAfter&&wallGap>=8&&wallPos<=6){\n  protectedHorses.push(wallAfter);\n  notes.push(`最大壁直後：${wallAfter}番を侵入監査`);\n }\n\n c.forEach((z,i)=>{\n  const rank=i+1;\n  if(z.point>=54&&z.point<=57&&rank<=6)protectedHorses.push(z.horse);\n });\n protectedHorses=uniq(protectedHorses);\n\n let final=[];\n const add=h=>{\n  if(h&&!final.includes(h)&&final.length<5)final.push(h);\n };\n\n headCandidates.slice(0,3).forEach(add);\n [1,2,3,4,5].forEach(rk=>add(byRank(rk)));\n protectedHorses.forEach(add);\n add(wallAfter);\n for(let rk=6;rk<=n;rk++)add(byRank(rk));\n\n const trust=trustJudge({np,sub,h2,x});\n\n const resultRanks=r.result.length\n  ?r.result.map(h=>{\n    const i=c.findIndex(z=>z.horse===h);\n    return i>=0?i+1:null;\n   })\n  :[];\n\n const thirdHorse=r.result?.[2]??null;\n const thirdRank=resultRanks?.[2]??null;\n const deepCandidateHorses=slide.deepCandidates.map(z=>z.horse);\n const x3CandidateHorses=slide.x3Candidates.map(z=>z.horse);\n\n const a={\n  ...r,\n  n,p1,p2,p3,p5,sum,\n  d12,d23,d13,d35,d34,p4,pickRank,\n  wallPos,wallGap,secondPos,secondGap,\n  oldP:op,np,sub,x,h2,c2,t3h,t3hOriginal,t32,headCover,structure,band,\n  headCandidates,protectedHorses,final,\n  band54to57,mid49to55,low46to49,\n  resultRanks,\n  trustHead:trust.head,\n  trustPlace:trust.place,\n  notes,\n  slide:slide.slide,\n  slideSub:slide.slideSub||'',\n  slideLabel:slide.label,\n  slideLevel:slide.level,\n  slideBaseThird:slide.baseThird,\n  slideDeepRule:slide.deepRule,\n  slideDeepPool:slide.deepPool,\n  slideDeepCandidates:slide.deepCandidates,\n  slideDeepHorses:deepCandidateHorses,\n  x3On:slide.x3On,\n  x3Hot:slide.x3Hot,\n  x3Rule:slide.x3Rule,\n  x3Candidates:slide.x3Candidates,\n  x3Horses:x3CandidateHorses,\n  thirdHorse,\n  thirdRank,\n  slideDeepHit:thirdHorse?deepCandidateHorses.includes(thirdHorse):false,\n  x3Hit:thirdHorse?x3CandidateHorses.includes(thirdHorse):false,\n  id:`${r.date}_${r.place}_${r.race}`\n };\n\n return {...a,verdict:finalVerdict(a)};\n}\n\n/* ==============================\n   最終司令塔\n   ============================== */\n\nfunction finalVerdict(a){\n const c=a.compi||[];\n const byRank=r=>c[r-1]?.horse;\n\n const top1=byRank(1),top2=byRank(2),top3=byRank(3),\n       top4=byRank(4),top5=byRank(5),top6=byRank(6);\n\n let axis=top1,headMain=top1,reversals=[],mainOpp=[],holeWatch=[];\n let danger='中',join='B';\n\n if(a.np==='PA'){\n  axis=top1;headMain=top1;reversals=[top2,top3];mainOpp=[top2,top3,top4,top5];danger='低';join='A';\n }else if(a.np==='PB'){\n  axis=top1;headMain=top1;reversals=[top2,top3,top4];mainOpp=[top2,top3,top4,top5];\n  danger=a.sub==='PB-H'?'中':'低〜中';join='B+';\n }else if(a.np==='PC'){\n  danger='中';join='B';\n  if(a.h2==='H2-BLOCK SS'||a.h2==='H2-BLOCK S'){\n   axis=top1;headMain=top1;reversals=[top2];danger='低';join='A';\n  }\n  else if((a.h2||'').startsWith('H2-C')){axis=top2;headMain=top2;reversals=[top1,top3];}\n  else{axis=top1;headMain=top1;reversals=[top2,top3];}\n  mainOpp=[top1,top2,top3,top4,top5].filter(h=>h!==axis);\n }else if(a.np==='PD'){\n  danger=a.x?'高':'中';join=a.x?'C':'B';\n  if(a.h2==='H2-D SS'){axis=top2;headMain=top2;reversals=[top1,top3,top4];}\n  else if((a.h2||'').startsWith('H2-C')){axis=top2;headMain=top2;reversals=[top1,top3];}\n  else{axis=top1;headMain=top1;reversals=[top2,top3,top4];}\n  mainOpp=[top1,top2,top3,top4,top5].filter(h=>h!==axis);\n }else if(a.np==='PE'){\n  danger='高';join='C';axis=top2||top1;headMain=axis;\n  reversals=a.sub==='PE-2H'?[top3,top4,top5,top1]:[top1,top3,top4,top5];\n  mainOpp=[top1,top2,top3,top4,top5].filter(h=>h!==axis);\n }else{\n  danger='最高';join='見送り';axis=top2||top3||top1;headMain=axis;\n  reversals=[top3,top4,top5,top6].filter(h=>h!==axis);\n  mainOpp=[top2,top3,top4,top5,top6].filter(h=>h&&h!==axis);\n }\n\n if(a.structure==='上位2頭ブロック型'){\n  axis=top1;headMain=top1;reversals=uniq([top2].concat(reversals));\n }\n if(a.structure==='上位密集・頭替わり型'){\n  reversals=uniq([top2,top3,top4].concat(reversals));\n  if(join==='A')join='B+';\n }\n if(a.structure==='1位危険・全面入替型'){\n  axis=top2||top3||top1;headMain=axis;reversals=uniq([top3,top4,top1].concat(reversals));\n  danger='高';join='C';\n }\n\n // HEAD司令塔：BLOCK > T3-HR > C2-S の順で上書き\n if(a.h2==='H2-BLOCK S'||a.h2==='H2-BLOCK SS'){\n  axis=top1;headMain=top1;reversals=uniq([top2]);danger='低';join='A';\n }else if(a.t3h){\n  axis=top1;headMain=top1;reversals=uniq([top2,top3]);\n  if(join==='C'||join==='見送り')join='B';\n }else if(a.c2==='C2-S' && a.np!=='PC'){\n  axis=top2;headMain=top2;reversals=uniq([top1,top3].concat(reversals));\n }else if(a.c2==='C2-S'){\n  reversals=uniq([top2,top1,top3].concat(reversals));\n }\n\n if(a.x){\n  danger='最高';\n  if(join==='A')join='B';\n  else if(join==='B+')join='C';\n }\n\n reversals=uniq(reversals).filter(Boolean);\n mainOpp=uniq(mainOpp).filter(Boolean);\n\n holeWatch=uniq(\n  (a.mid49to55||[])\n  .concat(a.low46to49||[])\n  .concat((a.band.place3||[]).filter(r=>r>=6).map(byRank))\n )\n .filter(h=>h&&h!==axis&&!mainOpp.includes(h))\n .slice(0,5);\n\n return {axis,headMain,reversals,mainOpp,holeWatch,danger,join};\n}\n\n/* ==============================\n   表示\n   ============================== */\n\nfunction slideBadgeClass(s){\n if(s==='S2+')return 'slide2p';\n if(s==='S2')return 'slide2';\n if(s==='S1')return 'slide1';\n return 'slide0';\n}\n\nfunction fmtSlideCandidates(a){\n return (a.slideDeepCandidates||[])\n  .map(z=>`${z.horse}番(${z.rank}位/${z.point}P)`)\n  .join('・')||'なし';\n}\n\nfunction fmtX3Candidates(a){\n return (a.x3Candidates||[])\n  .map(z=>`${z.horse}番(${z.rank}位/${z.point}P)`)\n  .join('・')||'なし';\n}\n\n\nfunction practicalVerdict(a){\n const c=a.compi||[];\n const byRank=r=>c[r-1]?.horse;\n const top=(n)=>c.slice(0,n).map(z=>z.horse);\n\n // 1着候補：新P・構造・H2を使いながら実戦用に圧縮\n let first=[];\n if(a.np==='PA') first=top(2);\n else if(a.np==='PB') first=top(3);\n else if(a.np==='PC') first=top(3);\n else if(a.np==='PD') first=top(4);\n else if(a.np==='PE') first=[byRank(2),byRank(3),byRank(4),byRank(1)];\n else first=[byRank(2),byRank(3),byRank(4),byRank(5)];\n\n if((a.h2||'').startsWith('H2-C')) first=uniq([byRank(2),byRank(1),byRank(3)]);\n if(a.h2==='H2-D SS') first=uniq([byRank(2),byRank(1),byRank(3),byRank(4)]);\n if(a.sub==='PE-2H') first=uniq([byRank(2),byRank(3),byRank(4),byRank(1)]);\n if(a.structure==='上位2頭ブロック型') first=uniq([byRank(1),byRank(2)]);\n if(a.structure==='一強・大断層型') first=uniq([byRank(1),byRank(2)]);\n if(a.slide==='S2+' && a.slideSub==='A') first=uniq([byRank(1),byRank(2),byRank(3)]);\n // HEAD司令塔。BLOCKは必ず最後に優先する\n if(a.t3h) first=uniq([byRank(1),byRank(2),byRank(3)]);\n if(a.c2==='C2-S' && a.np!=='PC' && a.h2!=='H2-BLOCK S' && a.h2!=='H2-BLOCK SS') first=uniq([byRank(2),byRank(1),byRank(3),byRank(4)]);\n else if(a.c2==='C2-S' && a.h2!=='H2-BLOCK S' && a.h2!=='H2-BLOCK SS') first=uniq([byRank(2),byRank(1),byRank(3)]);\n // H2-BLOCK S/SS は最後に強制圧縮（他ルールより優先）\n if(a.h2==='H2-BLOCK S'||a.h2==='H2-BLOCK SS') first=uniq([byRank(1),byRank(2)]);\n first=uniq(first).filter(Boolean).slice(0,4);\n\n // 2着候補：1着候補＋上位の相手、ただし広げすぎない\n let second=uniq(first.concat(top(a.np==='PA'?4:5))).filter(Boolean).slice(0,5);\n if(a.np==='PE'||a.np==='PF') second=uniq(second.concat([byRank(6)])).filter(Boolean).slice(0,6);\n\n // 3着A：上位残り\n let thirdA=uniq(top(5).filter(h=>!first.slice(0,2).includes(h))).filter(Boolean).slice(0,4);\n if(!thirdA.length) thirdA=top(5).slice(2,5);\n\n // 3着B：6〜8位の軽スライド\n let thirdB=[6,7,8].map(byRank).filter(Boolean);\n\n // 3着C：深層候補\n let thirdC=(a.slideDeepHorses||[]).slice(0,3);\n\n // 3着D：超深候補\n let thirdD=(a.x3Horses||[]).slice(0,2);\n\n // H2-BLOCK S/SS 専用の実戦圧縮\n let blockTickets=[];\n let blockExacta=[];\n let t32Tickets=[];\n if(a.t32 && a.np!=='PC' && a.pickRank && (a.pickRank===1||a.pickRank===2)){\n   const others=[1,2,3].filter(r=>r!==a.pickRank);\n   t32Tickets=others.map(r=>[byRank(a.pickRank),byRank(r)]).filter(z=>z[0]&&z[1]);\n }\n if(a.h2==='H2-BLOCK S'||a.h2==='H2-BLOCK SS'){\n   first=uniq([byRank(1),byRank(2)]).filter(Boolean);\n   second=top(5).filter(Boolean);\n   thirdA=[byRank(1),byRank(3),byRank(4),byRank(5)].filter(Boolean);\n   thirdB=[byRank(6),byRank(7),byRank(8)].filter(Boolean);\n   thirdC=[];\n   thirdD=[];\n   const pairRanks=[[1,2],[1,3],[1,4],[1,5],[2,3],[2,4],[2,5]];\n   const exactRanks=[[1,2],[1,3],[1,4],[1,5],[2,3],[2,4],[2,5]];\n   blockTickets=pairRanks.map(([x,y])=>[byRank(x),byRank(y)]).filter(z=>z[0]&&z[1]);\n   blockExacta=exactRanks.map(([x,y])=>[byRank(x),byRank(y)]).filter(z=>z[0]&&z[1]);\n }\n\n // レース全体の荒れ度は3着スライドとは分離\n let raceShape='普通';\n if(a.np==='PA' || a.structure==='一強・大断層型' || a.structure==='上位2頭ブロック型'){\n   raceShape='硬め';\n }\n if(a.np==='PE' || a.np==='PF' || a.x){\n   raceShape='荒れ';\n }\n // 上位断層型は1・2着硬め寄り\n if(a.structure==='上位断層型' && a.p1>=76 && a.d23>=8){\n   raceShape='硬め';\n }\n\n let thirdRisk=a.slideLevel||'普通';\n if(a.h2==='H2-BLOCK S'||a.h2==='H2-BLOCK SS'){\n   raceShape='硬め（HEAD2ロック）';\n   thirdRisk='低〜中（9位以下抑制）';\n }else if(a.t3h){\n   raceShape='上位3頭ロック型';\n }\n\n return {first,second,thirdA,thirdB,thirdC,thirdD,raceShape,thirdRisk,blockTickets,blockExacta,t32Tickets};\n}\n\nfunction summaryText(a){\n const v=finalVerdict(a);\n const p=practicalVerdict(a);\n\n return `【${a.date} ${a.place}${a.race}R】\n中央新P統合 V1.25\n\n【実戦結論】\n1着候補：${p.first.join('・')||'なし'}\n2着候補：${p.second.join('・')||'なし'}\n\n3着A 本線：${p.thirdA.join('・')||'なし'}\n3着B 軽スライド：${p.thirdB.join('・')||'なし'}\n3着C 深穴：${p.thirdC.join('・')||'なし'}\n3着D 超穴：${p.thirdD.join('・')||'なし'}\n\nレース全体：${p.raceShape}\n3着荒れ度：${p.thirdRisk}\n${p.blockTickets.length?`BLOCK馬連7点：${p.blockTickets.map(z=>z.join('-')).join(' / ')}`:''}\n${p.blockExacta.length?`BLOCK馬単7点：${p.blockExacta.map(z=>z.join('→')).join(' / ')}`:''}\n${p.t32Tickets.length?`T3-2馬連2点：${p.t32Tickets.map(z=>z.join('-')).join(' / ')}`:''}\n\n【研究詳細】\n新P：${a.np}（${P_BANDS[a.np].desc}）\n構造：${a.structure}\nSUB：${a.sub||'なし'}\nH2：${a.h2||'なし'}\nHEAD：${a.headCover||'通常'} / C2：${a.c2||'なし'} / T3-HR：${a.t3h?'ON':'OFF'} / T3-2：${a.t32?'ON':'OFF'}\nX：${a.x?'ON':'OFF'}\n3着S：${a.slide}${a.slideSub||''}（${a.slideLabel}）\nX3：${a.x3On?(a.x3Hot?'🔥ON':'ON'):'OFF'}\n\n旧P：${a.oldP}（${a.sum}P・補助）\n1-2差：${a.d12}P / 2-3差：${a.d23}P / 3-4差：${Number.isFinite(a.d34)?a.d34:'—'}P / 1-3差：${a.d13}P / 3-5差：${Number.isFinite(a.d35)?a.d35:'—'}P\n最大壁：${a.wallPos}位後 ${a.wallGap}P\n第2壁：${a.secondPos??'—'}位後 ${Number.isFinite(a.secondGap)?a.secondGap:'—'}P\n\n軸：${v.axis||'なし'}\n頭本線：${v.headMain||'なし'}\n相手本線：${v.mainOpp.join('・')||'なし'}\n\n${a.result.length\n ?`\\n【結果】${a.result.join('-')} / コンピ順位 ${a.resultRanks.join('|')}`\n :''}`;\n}\n\nfunction renderResults(arr){\n $('#results').innerHTML=arr.map(a=>{\n  const v=finalVerdict(a);\n  const p=practicalVerdict(a);\n\n  return `\n  <div class=\"card\">\n   <div class=\"title\">${esc(a.date)} ${esc(a.place)}${a.race}R</div>\n\n   <div class=\"card inner practicalbox\">\n    <div class=\"title\" style=\"color:#4ade80\">🏇 実戦結論</div>\n    <div class=\"practical-grid\">\n      <div class=\"k\">1着候補</div>\n      <div class=\"v\">${p.first.join('・')||'なし'}</div>\n\n      <div class=\"k\">2着候補</div>\n      <div class=\"v\">${p.second.join('・')||'なし'}</div>\n\n      <div class=\"k\">3着A 本線</div>\n      <div class=\"v third-a\">${p.thirdA.join('・')||'なし'}</div>\n\n      <div class=\"k\">3着B 軽穴</div>\n      <div class=\"v third-b\">${p.thirdB.join('・')||'なし'}</div>\n\n      <div class=\"k\">3着C 深穴</div>\n      <div class=\"v third-c\">${p.thirdC.join('・')||'なし'}</div>\n\n      <div class=\"k\">3着D 超穴</div>\n      <div class=\"v third-d\">${p.thirdD.join('・')||'なし'}</div>\n\n      <div class=\"k\">レース全体</div>\n      <div class=\"v\">${p.raceShape}</div>\n\n      <div class=\"k\">3着荒れ度</div>\n      <div class=\"v\">${p.thirdRisk}</div>\n\n      ${p.blockTickets.length?`<div class=\"k\">BLOCK馬連7点</div><div class=\"v\">${p.blockTickets.map(z=>z.join('-')).join(' / ')}</div>`:''}\n      ${p.blockExacta.length?`<div class=\"k\">BLOCK馬単7点</div><div class=\"v\">${p.blockExacta.map(z=>z.join('→')).join(' / ')}</div>`:''}\n      ${p.t32Tickets.length?`<div class=\"k\">T3-2馬連2点</div><div class=\"v\">${p.t32Tickets.map(z=>z.join('-')).join(' / ')}</div>`:''}\n    </div>\n   </div>\n\n   <details class=\"research\">\n    <summary>研究詳細を開く</summary>\n    <div class=\"research-body\">\n\n      <div class=\"badges\">\n       <span class=\"badge ${a.np.toLowerCase()}\">${a.np}・${esc(P_BANDS[a.np].desc)}</span>\n       <span class=\"badge structure\">${esc(a.structure)}</span>\n       ${a.sub?`<span class=\"badge subb\">${esc(a.sub)}</span>`:''}\n       ${a.h2?`<span class=\"badge h2\">${esc(a.h2)}</span>`:''}\n       ${a.headCover?`<span class=\"badge h2\">${esc(a.headCover)}</span>`:''}\n       ${a.c2?`<span class=\"badge pick\">${esc(a.c2)}</span>`:''}\n       ${a.t3h?`<span class=\"badge structure\">T3-HR</span>`:''}\n       ${a.t32?`<span class=\"badge pick\">T3-2</span>`:''}\n       ${a.x?`<span class=\"badge x\">X ON</span>`:'<span class=\"badge\">X OFF</span>'}\n       <span class=\"badge ${slideBadgeClass(a.slide)}\">${a.slide}${a.slideSub||''}・${esc(a.slideLabel)}</span>\n       ${a.x3On?`<span class=\"badge x3\">X3 ${a.x3Hot?'🔥':''}ON</span>`:'<span class=\"badge\">X3 OFF</span>'}\n      </div>\n\n      <div class=\"grid2\">\n       <div class=\"card inner\">\n        <div class=\"kv\">\n         <div class=\"k\">旧P（補助）</div><div class=\"v\">${a.oldP} / ${a.sum}P</div>\n         <div class=\"k\">上位3</div><div class=\"v\">${a.p1} - ${a.p2} - ${a.p3}</div>\n         <div class=\"k\">指数差</div><div class=\"v\">1-2 ${a.d12} / 2-3 ${a.d23} / 3-4 ${Number.isFinite(a.d34)?a.d34:'—'} / 1-3 ${a.d13} / 3-5 ${Number.isFinite(a.d35)?a.d35:'—'}</div>\n         <div class=\"k\">HEAD司令塔</div><div class=\"v\">${a.headCover||'通常'} / ${a.c2||'C2なし'} / T3-HR ${a.t3h?'ON':'OFF'} / T3-2 ${a.t32?'ON':'OFF'}</div>\n         <div class=\"k\">最大壁</div><div class=\"v\">${a.wallPos}位後 ${a.wallGap}P</div>\n         <div class=\"k\">第2壁</div><div class=\"v\">${a.secondPos??'—'}位後 ${Number.isFinite(a.secondGap)?a.secondGap:'—'}P</div>\n         <div class=\"k\">1位信頼</div><div class=\"v\">頭 ${a.trustHead} / 馬券内 ${a.trustPlace}</div>\n        </div>\n       </div>\n\n       <div class=\"card inner\">\n        <div class=\"mini\">軸</div>\n        <div class=\"horses\">${v.axis??'—'}</div>\n        <div class=\"mini\">頭候補</div>\n        <div class=\"horses\">${a.headCandidates.join('・')||'—'}</div>\n        <div class=\"mini\">最終5頭</div>\n        <div class=\"horses cyan\">${a.final.join('・')||'—'}</div>\n       </div>\n      </div>\n\n      <div class=\"card inner slidebox\">\n       <div class=\"title\" style=\"color:#c084fc\">🎯 3着スライド V0.5</div>\n       <div class=\"kv\">\n        <div class=\"k\">判定</div><div class=\"v\">${a.slide}${a.slideSub||''}（${a.slideLabel}）</div>\n        <div class=\"k\">深層候補</div><div class=\"v warn\">${fmtSlideCandidates(a)}</div>\n        <div class=\"k\">X3</div><div class=\"v\">${a.x3On?(a.x3Hot?'🔥ON':'ON'):'OFF'}</div>\n        <div class=\"k\">超深候補</div><div class=\"v ${a.x3On?'bad':''}\">${fmtX3Candidates(a)}</div>\n       </div>\n      </div>\n\n      ${a.notes.length?`<div class=\"notice\">${a.notes.map(esc).join('<br>')}</div>`:''}\n\n      ${a.result.length?`<div class=\"rankline\">\n       <b>結果：</b>${a.result.join('-')}　\n       <b>コンピ順位：</b>${a.resultRanks.join('|')}\n      </div>`:''}\n    </div>\n   </details>\n\n   <div class=\"rowbuttons\">\n    <button class=\"secondary copyOne\" data-id=\"${esc(a.id)}\">この判定をコピー</button>\n   </div>\n  </div>\n  `;\n }).join('');\n\n window.currentAnalyses=arr;\n $$('.copyOne').forEach(b=>{\n  b.onclick=()=>{\n   const a=window.currentAnalyses.find(x=>x.id===b.dataset.id);\n   copyText(summaryText(a));\n  };\n });\n}\n\nasync function copyText(t){\n try{\n  await navigator.clipboard.writeText(t);\n  alert('コピーしました');\n }catch(e){\n  prompt('コピーしてください',t);\n }\n}\n\n/* ==============================\n   IndexedDB\n   既存DB名を維持\n   ============================== */\n\nconst DB='CentralNewP_V110';\nconst STORE='races';\n\nfunction openDB(){\n return new Promise((res,rej)=>{\n  const q=indexedDB.open(DB,1);\n  q.onupgradeneeded=e=>{\n   const d=e.target.result;\n   if(!d.objectStoreNames.contains(STORE)){\n    d.createObjectStore(STORE,{keyPath:'id'});\n   }\n  };\n  q.onsuccess=e=>res(e.target.result);\n  q.onerror=e=>rej(e.target.error);\n });\n}\n\nasync function put(a){\n const d=await openDB();\n return new Promise((res,rej)=>{\n  const t=d.transaction(STORE,'readwrite');\n  t.objectStore(STORE).put(a);\n  t.oncomplete=res;\n  t.onerror=e=>rej(e.target.error);\n });\n}\n\nasync function allRows(){\n const d=await openDB();\n return new Promise((res,rej)=>{\n  const q=d.transaction(STORE).objectStore(STORE).getAll();\n  q.onsuccess=()=>res(q.result);\n  q.onerror=e=>rej(e.target.error);\n });\n}\n\nasync function del(id){\n const d=await openDB();\n return new Promise((res,rej)=>{\n  const t=d.transaction(STORE,'readwrite');\n  t.objectStore(STORE).delete(id);\n  t.oncomplete=res;\n  t.onerror=e=>rej(e.target.error);\n });\n}\n\nasync function clearDB(){\n const d=await openDB();\n return new Promise((res,rej)=>{\n  const t=d.transaction(STORE,'readwrite');\n  t.objectStore(STORE).clear();\n  t.oncomplete=res;\n  t.onerror=e=>rej(e.target.error);\n });\n}\n\nfunction serialize(a){\n return {...a,compi:a.compi.map(x=>({...x}))};\n}\n\n/* ==============================\n   解析\n   ============================== */\n\nasync function doAnalyze(save=false){\n try{\n  const races=parseBlocks($('#input').value);\n  const arr=races.map(analyzeRace);\n  renderResults(arr);\n\n  $('#status').innerHTML=`<span class=\"good\">${arr.length}レース解析成功</span>`;\n\n  if(save){\n   for(const a of arr)await put(serialize(a));\n   $('#status').innerHTML=`<span class=\"good\">${arr.length}レース解析・保存完了</span>`;\n   await refreshAll();\n  }\n }catch(e){\n  $('#status').innerHTML=`<span class=\"bad\">${esc(e.message)}</span>`;\n }\n}\n\n/* ==============================\n   V1.21 再解析\n   ============================== */\n\nasync function reanalyzeAll(){\n const rows=await allRows();\n\n if(!rows.length){\n  alert('保存データがありません');\n  return;\n }\n\n if(!confirm(`${rows.length}件をV1.23判定で再解析します。\\n先にJSONバックアップを推奨します。`))return;\n\n let count=0;\n for(const old of rows){\n  if(!Array.isArray(old.compi)||old.compi.length<3)continue;\n\n  const base={\n   date:old.date,\n   place:old.place,\n   race:old.race,\n   compi:old.compi.map(x=>({horse:Number(x.horse),point:Number(x.point)})),\n   pick:old.pick??null,\n   result:Array.isArray(old.result)?old.result:[]\n  };\n\n  const fresh=analyzeRace(base);\n  await put(serialize(fresh));\n  count++;\n }\n\n await refreshAll();\n alert(`${count}件をV1.23で再解析しました`);\n}\n\n/* ==============================\n   履歴\n   ============================== */\n\nasync function refreshHistory(){\n const rows=(await allRows()).sort((a,b)=>{\n  const ka=`${a.date}_${String(a.race).padStart(2,'0')}`;\n  const kb=`${b.date}_${String(b.race).padStart(2,'0')}`;\n  return kb.localeCompare(ka);\n });\n\n $('#historyBody').innerHTML=rows.map(a=>{\n  const v=a.verdict||finalVerdict(a);\n  return `\n   <tr>\n    <td>${esc(a.date)}</td><td>${esc(a.place)}</td><td>${a.race}R</td>\n    <td>${a.np||'—'}</td><td>${esc(a.structure||'—')}</td><td>${a.sub||'—'}</td><td>${a.h2||'—'}</td><td>${a.x?'ON':'—'}</td>\n    <td>${a.slide?`${a.slide}${a.slideSub||''}`:'—'}</td>\n    <td>${(a.slideDeepHorses||[]).join('・')||'—'}</td>\n    <td>${a.x3On?`${a.x3Hot?'🔥':''}${(a.x3Horses||[]).join('・')}`:'—'}</td>\n    <td>${a.pick??'—'}</td>\n    <td>${(a.headCandidates||[]).join('・')}</td>\n    <td>${(a.protectedHorses||[]).join('・')}</td>\n    <td>${(a.final||[]).join('・')}</td>\n    <td>${v.join||'—'}</td>\n    <td>${(a.result||[]).join('-')||'—'}</td>\n    <td>${(a.resultRanks||[]).join('|')||'—'}</td>\n    <td><button class=\"red delOne\" data-id=\"${esc(a.id)}\">削除</button></td>\n   </tr>\n  `;\n }).join('');\n\n $$('.delOne').forEach(b=>{\n  b.onclick=async()=>{\n   if(confirm('このレースを削除しますか？')){\n    await del(b.dataset.id);\n    await refreshAll();\n   }\n  };\n });\n}\n\n/* ==============================\n   検証関数\n   ============================== */\n\nfunction resultDone(a){\n return Array.isArray(a.resultRanks)&&a.resultRanks.length===3&&a.resultRanks.every(x=>Number.isFinite(x));\n}\nfunction headHit(a){return resultDone(a)&&(a.headCandidates||[]).includes(a.result[0]);}\nfunction top1Win(a){return resultDone(a)&&a.resultRanks[0]===1;}\nfunction top1Place(a){return resultDone(a)&&a.resultRanks.includes(1);}\nfunction secondWin(a){return resultDone(a)&&a.resultRanks[0]===2;}\nfunction secondPlace(a){return resultDone(a)&&a.resultRanks.includes(2);}\nfunction finalContainsAll(a){return resultDone(a)&&a.result.every(h=>(a.final||[]).includes(h));}\nfunction pickPlace(a){\n if(!resultDone(a)||!Number.isFinite(Number(a.pick)))return false;\n return a.result.includes(Number(a.pick));\n}\nfunction thirdRankIn(a,lo,hi){\n return resultDone(a)&&Number.isFinite(a.resultRanks[2])&&a.resultRanks[2]>=lo&&a.resultRanks[2]<=hi;\n}\nfunction thirdDeep(a){return resultDone(a)&&Number.isFinite(a.resultRanks[2])&&a.resultRanks[2]>=9;}\nfunction slideDeepHitFn(a){return resultDone(a)&&(a.slideDeepHorses||[]).includes(a.result[2]);}\nfunction x3HitFn(a){return resultDone(a)&&(a.x3Horses||[]).includes(a.result[2]);}\n\n/* ==============================\n   集計\n   ============================== */\n\nasync function refreshStats(){\n const rows=await allRows();\n const done=rows.filter(resultDone);\n\n const h2=done.filter(a=>a.h2);\n const x=done.filter(a=>a.x);\n\n const headHits=done.filter(headHit).length;\n const finalHits=done.filter(finalContainsAll).length;\n\n const picks=done.filter(a=>Number.isFinite(Number(a.pick)));\n const pickPlaces=picks.filter(pickPlace).length;\n\n const deepDone=done.filter(a=>a.slide==='S2'||a.slide==='S2+');\n const deepHit=deepDone.filter(slideDeepHitFn).length;\n\n $('#statsCards').innerHTML=[\n  ['保存R',rows.length],\n  ['結果済',done.length],\n  ['頭候補捕捉',`${headHits}/${done.length} ${pct(headHits,done.length)}`],\n  ['最終5頭3頭内包',`${finalHits}/${done.length} ${pct(finalHits,done.length)}`],\n  ['PICK馬券内',`${pickPlaces}/${picks.length} ${pct(pickPlaces,picks.length)}`],\n  ['S2/S2+結果済',deepDone.length],\n  ['深候補3着的中',`${deepHit}/${deepDone.length} ${pct(deepHit,deepDone.length)}`],\n  ['1位勝率',pct(done.filter(top1Win).length,done.length)],\n  ['1位馬券内',pct(done.filter(top1Place).length,done.length)]\n ].map(([l,n])=>`\n  <div class=\"stat\"><div class=\"n\">${n}</div><div class=\"l\">${l}</div></div>\n `).join('');\n\n $('#pStatsBody').innerHTML=['PA','PB','PC','PD','PE','PF'].map(p=>{\n  const a=done.filter(x=>x.np===p);\n  const picksP=a.filter(x=>Number.isFinite(Number(x.pick)));\n  return `\n   <tr>\n    <td>${p}</td><td>${a.length}</td>\n    <td>${pct(a.filter(top1Win).length,a.length)}</td>\n    <td>${pct(a.filter(top1Place).length,a.length)}</td>\n    <td>${pct(a.filter(headHit).length,a.length)}</td>\n    <td>${pct(a.filter(finalContainsAll).length,a.length)}</td>\n    <td>${pct(picksP.filter(pickPlace).length,picksP.length)}</td>\n   </tr>\n  `;\n }).join('');\n\n const slideDefs=[\n  ['S0',x=>x.slide==='S0'],\n  ['S0+',x=>x.slide==='S0+'],\n  ['S1',x=>x.slide==='S1'],\n  ['S2',x=>x.slide==='S2'],\n  ['S2+A',x=>x.slide==='S2+'&&x.slideSub==='A'],\n  ['S2+B',x=>x.slide==='S2+'&&x.slideSub==='B'],\n  ['S2+C',x=>x.slide==='S2+'&&x.slideSub==='C'],\n  ['S2+D',x=>x.slide==='S2+'&&x.slideSub==='D']\n ];\n $('#slideStatsBody').innerHTML=slideDefs.map(([s,fn])=>{\n  const a=done.filter(fn);\n  const s15=a.filter(x=>thirdRankIn(x,1,5)).length;\n  const s68=a.filter(x=>thirdRankIn(x,6,8)).length;\n  const s9=a.filter(thirdDeep).length;\n  const dh=a.filter(slideDeepHitFn).length;\n  const x3Base=a.filter(x=>x.x3On);\n  const x3h=x3Base.filter(x3HitFn).length;\n\n  return `\n   <tr>\n    <td>${s}</td><td>${a.length}</td>\n    <td>${s15} ${pct(s15,a.length)}</td>\n    <td>${s68} ${pct(s68,a.length)}</td>\n    <td>${s9} ${pct(s9,a.length)}</td>\n    <td>${dh} ${pct(dh,a.length)}</td>\n    <td>${x3h}/${x3Base.length} ${pct(x3h,x3Base.length)}</td>\n   </tr>\n  `;\n }).join('');\n\n const specs=[\n  ['PE-2H',a=>a.sub==='PE-2H'],\n  ['PB-S',a=>a.sub==='PB-S'],\n  ['PB-H',a=>a.sub==='PB-H'],\n  ['H2-C SS',a=>a.h2==='H2-C SS'],\n  ['H2-C',a=>a.h2==='H2-C'],\n  ['H2-D SS',a=>a.h2==='H2-D SS'],\n  ['X',a=>a.x]\n ];\n\n $('#specialStatsBody').innerHTML=specs.map(([name,fn])=>{\n  const a=done.filter(fn);\n  return `\n   <tr>\n    <td>${name}</td><td>${a.length}</td>\n    <td>${pct(a.filter(secondWin).length,a.length)}</td>\n    <td>${pct(a.filter(secondPlace).length,a.length)}</td>\n    <td>${pct(a.filter(headHit).length,a.length)}</td>\n    <td>${pct(a.filter(finalContainsAll).length,a.length)}</td>\n   </tr>\n  `;\n }).join('');\n\n refreshIndexStats(done);\n}\n\n/* ==============================\n   指数帯検証\n   ============================== */\n\nfunction refreshIndexStats(done){\n const defs=[['54〜57',54,57],['49〜55',49,55],['46〜52',46,52],['46〜49',46,49],['40〜42',40,42],['40〜45',40,45]];\n const rows=[];\n\n defs.forEach(([label,lo,hi])=>{\n  let total=0,win=0,second=0,third=0;\n\n  done.forEach(a=>{\n   a.compi.forEach(z=>{\n    if(z.point>=lo&&z.point<=hi){\n     total++;\n     if(a.result[0]===z.horse)win++;\n     if(a.result[1]===z.horse)second++;\n     if(a.result[2]===z.horse)third++;\n    }\n   });\n  });\n\n  const place=win+second+third;\n  rows.push(`\n   <tr>\n    <td>${label}</td><td>${total}</td><td>${win}</td><td>${second}</td><td>${third}</td><td>${pct(place,total)}</td>\n   </tr>\n  `);\n });\n\n $('#indexStatsBody').innerHTML=rows.join('');\n}\n\nasync function refreshAll(){\n await refreshHistory();\n await refreshStats();\n}\n\n/* ==============================\n   出力\n   ============================== */\n\nfunction download(content,name,type){\n const blob=new Blob([content],{type});\n const u=URL.createObjectURL(blob);\n const a=document.createElement('a');\n a.href=u;\n a.download=name;\n a.click();\n setTimeout(()=>URL.revokeObjectURL(u),1200);\n}\n\nfunction csvEsc(v){\n const s=Array.isArray(v)?v.map(x=>typeof x==='object'?JSON.stringify(x):x).join('|'):String(v??'');\n return /[,\"\\n]/.test(s)?`\"${s.replace(/\"/g,'\"\"')}\"`:s;\n}\n\nasync function exportJSON(){\n const rows=await allRows();\n download(\n  JSON.stringify({\n   app:'競馬メジアン 中央新P統合研究所',\n   version:'1.23',\n   thirdSlide:'V0.5',\n   exportedAt:new Date().toISOString(),\n   races:rows\n  },null,2),\n  `中央新P_V1.23_backup_${new Date().toISOString().slice(0,10)}.json`,\n  'application/json'\n );\n}\n\nasync function exportCSV(){\n const rows=await allRows();\n\n const keys=[\n  'date','place','race','n',\n  'p1','p2','p3','p5','sum',\n  'd12','d23','d13','d35',\n  'wallPos','wallGap','secondPos','secondGap',\n  'oldP','np','structure','sub','h2','headCover','c2','t3h','t32','d34','pickRank','x','pick',\n  'trustHead','trustPlace',\n  'slide','slideSub','slideLabel','slideLevel','slideBaseThird',\n  'slideDeepHorses','x3On','x3Hot','x3Horses','slideDeepHit','x3Hit',\n  'headCandidates','band54to57','mid49to55','low46to49',\n  'protectedHorses','final','result','resultRanks'\n ];\n\n const labels=[\n  '日付','場','R','頭数',\n  '1位指数','2位指数','3位指数','5位指数','上位3合計',\n  '差1_2','差2_3','差1_3','差3_5',\n  '最大壁位置','最大壁差','第2壁位置','第2壁差',\n  '旧P','新P','構造型','SUB','H2','HEAD','C2','T3-HR','T3-2','差3_4','PICK順位','X','PICK',\n  '頭信頼','馬券内信頼',\n  '3着S','3着Sサブ型','3着S名称','3着S危険度','基本3着帯',\n  '深候補','X3','X3強','X3候補','深候補的中','X3的中',\n  '頭候補','54_57','49_55','46_49',\n  '削除禁止','最終5頭','結果','結果コンピ順位'\n ];\n\n const text='\\ufeff'+labels.join(',')+'\\n'+\n  rows.map(r=>keys.map(k=>csvEsc(r[k])).join(',')).join('\\n');\n\n download(\n  text,\n  `中央新P_V1.25_HEAD_log_${new Date().toISOString().slice(0,10)}.csv`,\n  'text/csv;charset=utf-8'\n );\n}\n\n/* ==============================\n   JSON読込\n   ============================== */\n\nasync function importJSON(file){\n const t=await file.text();\n const j=JSON.parse(t);\n const arr=Array.isArray(j)?j:j.races;\n\n if(!Array.isArray(arr))throw new Error('races配列がありません');\n\n for(const old of arr)await put(old);\n\n await refreshAll();\n alert(`${arr.length}件読み込みました。\\n旧版データならV1.23で全件再解析してください。`);\n}\n\n/* ==============================\n   タブ\n   ============================== */\n\n$$('.tab').forEach(b=>{\n b.onclick=()=>{\n  $$('.tab').forEach(x=>x.classList.remove('active'));\n  $$('.panel').forEach(x=>x.classList.remove('active'));\n  b.classList.add('active');\n  $('#'+b.dataset.tab).c er-radius:9px;background:rgba(2,6,23,.75);min-width:0}\n.pseudoCompi251Cond.ok{border-color:#22c55e;background:rgba(5,46,22,.78)}\n.pseudoCompi251Cond.near{border-color:#f59e0b;background:rgba(69,26,3,.78)}\n.pseudoCompi251Cond.ng{border-color:#ef4444;background:rgba(69,10,10,.74)}\n.pseudoCompi251CondName{font-size:10px;color:#bae6fd;font-weight:900}\n.pseudoCompi251CondValue{font-size:17px;color:#fff;font-weight:900;margin-top:2px}\n.pseudoCompi251CondNote{font-size:9px;color:#cbd5e1;line-height:1.3;margin-top:2px}\n.pseudoCompi251Ranks{margin-top:8px;border:1px solid #3b82f6;border-radius:10px;overflow:hidden}\n.pseudoCompi251Row{display:grid;grid-template-columns:32px 40px 43px 1fr;align-items:center;gap:4px;padding:6px 7px;border-bottom:1px solid rgba(148,163,184,.22);background:rgba(2,6,23,.68)}\n.pseudoCompi251Row:last-child{border-bottom:0}\n.pseudoCompi251Rank{color:#bae6fd;font-weight:900;text-align:center}\n.pseudoCompi251Horse{font-size:17px;font-weight:900;text-align:center;color:#fff}\n.pseudoCompi251Index{font-size:18px;font-weight:900;text-align:center;color:#fde047}\n.pseudoCompi251Move{font-size:10px;line-height:1.4;color:#e2e8f0}\n.pseudoCompi251Up{color:#86efac;font-weight:900}.pseudoCompi251Down{color:#fda4af;font-weight:900}.pseudoCompi251Stay{color:#cbd5e1;font-weight:900}\n.pseudoCompi251Bar{height:12px;border-radius:999px;background:#172554;overflow:hidden;position:relative;margin-top:3px}\n.pseudoCompi251Bar>span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#0284c7,#6366f1,#d946ef,#f59e0b)}\n.pseudoCompi251Foot{font-size:10px;line-height:1.45;color:#cbd5e1;margin-top:8px}\n@media(max-width:520px){.pseudoCompi251Conditions{grid-template-columns:1fr}.pseudoCompi251Row{grid-template-columns:28px 36px 40px 1fr}}\n</style>\n\n<script>\n(function(){\n  'use strict';\n\n  var V250_buildPseudoCompi = window.buildPseudoCompi;\n  var V250_makeCopyText = window.makeCopyText;\n  var V250_run = window.run;\n\n  document.title = 'チャッピー神予想 競馬 V2.51 推定コンピ順位補正版';\n  var heading = document.querySelector('h1');\n  if(heading){\n    heading.innerHTML =\n      'チャッピー神予想 競馬 V2.51<br>'+\n      '📊推定コンピ順位補正版＋大谷式荒れ計測<br>'+\n      '5市場の順位合意・同点帯終端順位・欠損市場を補正';\n  }\n\n  function n(v,d){v=Number(v);return isFinite(v)?v:(d===0?0:(d||0));}\n  function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}\n  function pct(v){return (n(v)*100).toFixed(1)+'%';}\n  function addOnce(arr,v){v=String(v||'');if(v&&arr.indexOf(v)<0)arr.push(v);}\n\n  function directOrder(rows,field){\n    return (rows||[]).filter(function(x){return n(x&&x[field])>0;}).slice().sort(function(a,b){\n      return n(a[field])-n(b[field])||Number(a.h)-Number(b.h);\n    }).map(function(x){return String(x.h);});\n  }\n\n  function connectedOrder(rows,size){\n    var list=(rows||[]).filter(function(x){return n(x&&x.od)>0;}).slice().sort(function(a,b){return n(a.od)-n(b.od);});\n    var seen={},out=[];\n    list.forEach(function(x){\n      var hs=size===3?[x.a,x.b,x.c]:[x.a,x.b];\n      hs.forEach(function(h){h=String(h||'');if(h&&!seen[h]){seen[h]=1;out.push(h);}});\n    });\n    return out;\n  }\n\n  function rankMap(order,N){\n    var m={};(order||[]).forEach(function(h,i){m[String(h)]=i+1;});\n    return {map:m,missing:N+2};\n  }\n\n  function percentile(rank,N){\n    if(N<=1)return 1;\n    rank=clamp(n(rank,N+2),1,N+2);\n    return clamp(1-(rank-1)/(N+1),0,1);\n  }\n\n  function buildConsensus(data,horses){\n    var N=horses.length;\n    var markets=[\n      {key:'単勝',weight:.30,order:directOrder(data.tanfuku,'tan')},\n      {key:'複勝',weight:.20,order:directOrder(data.tanfuku,'fuku')},\n      {key:'馬連',weight:.20,order:connectedOrder(data.umaren,2)},\n      {key:'ワイド',weight:.10,order:connectedOrder(data.wide,2)},\n      {key:'三連複',weight:.20,order:connectedOrder(data.sanpuku,3)}\n    ].filter(function(x){return x.order.length;});\n    var totalW=markets.reduce(function(s,x){return s+x.weight;},0)||1;\n    markets.forEach(function(x){x.weight=x.weight/totalW;x.rank=rankMap(x.order,N);});\n\n    var rows=horses.map(function(h){\n      var score=0,coverage=0,topZone=0,bottomZone=0,ranks={};\n      markets.forEach(function(m){\n        var r=m.rank.map.hasOwnProperty(h)?m.rank.map[h]:m.rank.missing;\n        ranks[m.key]=r;\n        if(r<=N){coverage++;score+=m.weight*percentile(r,N);}\n        else score+=m.weight*0;\n        if(r<=Math.max(3,Math.ceil(N*.25)))topZone++;\n        if(r>=Math.max(7,Math.ceil(N*.70))&&r<=N)bottomZone++;\n      });\n      return {h:h,score:score,coverage:coverage,topZone:topZone,bottomZone:bottomZone,ranks:ranks};\n    });\n    rows.sort(function(a,b){return b.score-a.score||b.coverage-a.coverage||Number(a.h)-Number(b.h);});\n    rows.forEach(function(x,i){x.rank=i+1;});\n    return {rows:rows,markets:markets};\n  }\n\n  function correctedBaseBand(ranked){\n    var chosen=null;\n    for(var target=46;target>=40;target--){\n      var group=ranked.filter(function(x){return x.index===target;});\n      if(group.length){chosen={value:target,group:group};break;}\n    }\n    if(!chosen){\n      var eligible=ranked.filter(function(x){return x.index<=46;});\n      if(eligible.length){\n        var best=Math.max.apply(null,eligible.map(function(x){return x.index;}));\n        chosen={value:best,group:ranked.filter(function(x){return x.index===best;})};\n      }\n    }\n    if(!chosen)return {available:false,value:null,rank:null,rankStart:null,rankEnd:null,horses:[]};\n    var positions=chosen.group.map(function(x){return x.rank;});\n    return {\n      available:true,value:chosen.value,\n      rankStart:Math.min.apply(null,positions),rankEnd:Math.max.apply(null,positions),\n      rank:Math.max.apply(null,positions),\n      horses:chosen.group.map(function(x){return x.h;})\n    };\n  }\n\n  function buildPseudoCompi251(data){\n    var base=V250_buildPseudoCompi?V250_buildPseudoCompi(data):null;\n    if(!base||!base.available)return base||{available:false,reason:'擬似コンピを算出できません',ranked:[]};\n\n    var horses=(data.tanfuku||[]).map(function(x){return String(x.h);}),u=[];\n    horses.forEach(function(h){addOnce(u,h);});horses=u;\n    var N=horses.length;\n    var consensus=buildConsensus(data,horses);\n    var cMap={};consensus.rows.forEach(function(x){cMap[x.h]=x;});\n    var baseMap={};base.ranked.forEach(function(x){baseMap[x.h]=x;});\n\n    var corrected=horses.map(function(h){\n      var b=baseMap[h]||{rank:N,index:40,support:0};\n      var c=cMap[h]||{rank:N,score:0,coverage:0,topZone:0,bottomZone:0,ranks:{}};\n      var shift=n(b.rank,N)-n(c.rank,N); /* ＋なら市場順位合意が上 */\n      var correction=Math.round(clamp(shift,-5,5)*.9);\n      if(c.topZone>=3)correction+=1;\n      if(c.bottomZone>=3)correction-=1;\n      if(c.coverage<=2)correction-=1;\n      correction=clamp(correction,-5,5);\n      var idx=Math.round(clamp(n(b.index,40)+correction,40,90));\n      return {\n        h:h,index:idx,baseIndex:n(b.index,40),baseRank:n(b.rank,N),support:n(b.support),\n        consensusRank:n(c.rank,N),consensusScore:n(c.score),coverage:n(c.coverage),\n        topZone:n(c.topZone),bottomZone:n(c.bottomZone),correction:correction,ranks:c.ranks||{}\n      };\n    });\n\n    corrected.sort(function(a,b){\n      return b.index-a.index||a.consensusRank-b.consensusRank||b.support-a.support||Number(a.h)-Number(b.h);\n    });\n\n    /* 指数が逆転しないよう単調性を保ち、順位は合意スコアで厳密に決める。 */\n    corrected.forEach(function(x,i){\n      if(i>0&&x.index>corrected[i-1].index)x.index=corrected[i-1].index;\n      x.rank=i+1;\n      x.move=x.baseRank-x.rank;\n    });\n\n    var top=corrected[0]||null,third=corrected[2]||null;\n    var diff=top&&third?top.index-third.index:null;\n    var band=correctedBaseBand(corrected);\n    var eligible=N>=14;\n    var c1=!!(top&&top.index<=80);\n    /* 同点帯の先頭ではなく終端順位を採用し、裾の深さを過小評価しない。 */\n    var c2=!!(band.available&&band.rankEnd>=11);\n    var c3=diff!==null&&diff<=14;\n    var big=eligible&&c1&&c2&&c3;\n    var semi=eligible&&!big&&(\n      (top&&top.index===81&&c2&&c3)||\n      (c1&&band.available&&band.rankEnd===10&&c3)\n    );\n    var tooWild=!!(top&&top.index<=69);\n    var judge='条件外',judgeClass='out',reasons=[];\n    if(!eligible){judge='少頭数・大谷式対象外';reasons.push('14頭立て以上が最低条件');}\n    else if(big){judge='大穴型レース';judgeClass='big';reasons.push('順位補正後に3条件すべてクリア');}\n    else if(semi){judge='準大穴型レース';judgeClass='semi';reasons.push('順位補正後、境界を1ポイントまたは1順位だけ外す');}\n    else{\n      judgeClass='normal';\n      if(top&&top.index>81)reasons.push('1位指数が高く本命寄り');\n      if(band.available&&band.rankEnd<10)reasons.push('基準指数帯の終端順位が浅い');\n      if(diff!==null&&diff>=15)reasons.push('1位と3位の差が15以上で上位集中');\n      if(!band.available)reasons.push('46〜40ポイントの基準指数帯なし');\n      if(!reasons.length)reasons.push('大穴型の3条件に届かず');\n    }\n\n    return {\n      available:true,N:N,ranked:corrected,top:top,third:third,diff:diff,base:band,\n      eligible:eligible,c1:c1,c2:c2,c3:c3,big:big,semi:semi,tooWild:tooWild,\n      judge:judge,judgeClass:judgeClass,reasons:reasons,markets:consensus.markets,\n      baseVersion:base\n    };\n  }\n\n  function condClass(ok,near){return ok?'ok':(near?'near':'ng');}\n  function moveClass(v){return v>0?'pseudoCompi251Up':(v<0?'pseudoCompi251Down':'pseudoCompi251Stay');}\n  function moveText(v){return v>0?('↑'+v):v<0?('↓'+Math.abs(v)):'→0';}\n\n  function renderPseudoCompi251(p){\n    if(!p||!p.available)return'';\n    var top=p.top||{},base=p.base||{},diff=p.diff;\n    var c1near=top.index===81,c2near=base.available&&base.rankEnd===10,c3near=diff===15;\n    var rows=p.ranked.map(function(x){\n      var width=clamp((x.index-40)/50*100,2,100);\n      var corr=x.correction>0?('+'+x.correction):String(x.correction);\n      return '<div class=\"pseudoCompi251Row\">'+\n        '<div class=\"pseudoCompi251Rank\">'+x.rank+'位</div>'+\n        '<div class=\"pseudoCompi251Horse\">'+x.h+'番</div>'+\n        '<div class=\"pseudoCompi251Index\">'+x.index+'</div>'+\n        '<div><div class=\"pseudoCompi251Move\"><s
