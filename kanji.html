<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>漢字ランダムテスト</title>
<style>
  :root {
    --bg:#fff9ef;
    --card:#ffffff;
    --main:#ff9e57;
    --sub:#ffe3c8;
    --text:#333;
    --ok:#1b8a3b;
    --ng:#c53d3d;
    --line:#f0d1b3;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; background:linear-gradient(180deg,#fff8ed 0%,#fff3df 100%); color:var(--text); }
  .wrap { max-width: 980px; margin:0 auto; padding:16px; }
  .hero { background:var(--card); border-radius:24px; box-shadow:0 8px 24px rgba(0,0,0,.08); overflow:hidden; border:3px solid var(--sub); }
  .hero-inner { display:flex; gap:16px; align-items:center; padding:16px; flex-wrap:wrap; }
  .hero img { width:min(280px, 100%); border-radius:18px; object-fit:cover; }
  .hero-text { flex:1; min-width:250px; }
  h1 { margin:0 0 8px; font-size: clamp(26px, 4vw, 40px); color:#d56b12; }
  .lead { font-size:18px; line-height:1.7; margin:0 0 12px; }
  .speech { display:inline-block; background:#fff7b8; border:2px solid #e8d45d; border-radius:999px; padding:8px 14px; font-weight:700; }
  .controls { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
  button { appearance:none; border:none; border-radius:16px; padding:14px 18px; font-size:16px; font-weight:700; cursor:pointer; }
  .primary { background:var(--main); color:#fff; }
  .secondary { background:#fff; color:#d56b12; border:2px solid #ffbf8b; }
  .ghost { background:#fff5ee; color:#8b4d20; }
  .scorebox { margin-top:14px; padding:14px 16px; background:#fff9d8; border:2px dashed #e9c84f; border-radius:18px; display:none; font-size:18px; font-weight:700; }
  .meta { margin:18px 0 10px; font-weight:700; color:#8b4d20; }
  .grid { display:grid; grid-template-columns:1fr; gap:14px; }
  .q { background:var(--card); border:2px solid var(--line); border-radius:20px; padding:16px; box-shadow:0 6px 18px rgba(0,0,0,.04); }
  .qhead { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
  .badge { background:#fff0df; color:#c86400; padding:6px 10px; border-radius:999px; font-size:13px; font-weight:700; }
  .prompt { font-size:22px; line-height:1.7; font-weight:700; margin:10px 0 12px; }
  .answer-row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  input[type="text"] { width:min(100%, 280px); font-size:22px; padding:12px 14px; border:2px solid #e5c5a7; border-radius:14px; }
  .feedback { margin-top:10px; font-weight:700; display:none; }
  .ok { color:var(--ok); }
  .ng { color:var(--ng); }
  .mascot-card { display:flex; align-items:center; gap:14px; background:#fff; border:2px dashed #ffcf9d; border-radius:22px; padding:12px; }
  .mascot-card img { width:110px; height:110px; object-fit:cover; border-radius:18px; }
  .small { font-size:14px; color:#7b6b5d; }
  .footer-note { margin:24px 0 10px; font-size:14px; color:#7b6b5d; text-align:center; }
  @media (max-width: 640px) {
    .prompt { font-size:20px; }
    input[type="text"] { width:100%; }
    .hero-inner { padding:12px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <div class="hero-inner">
      <img id="heroImg" src="assets/char_beach1.jpg" alt="キャラクター" />
      <div class="hero-text">
        <h1>漢字ランダムテスト</h1>
        <p class="lead">このテストは、<strong>開くたびに30問がランダム</strong>で出ます。<br>下のボタンで新しい30問に入れかえられます。</p>
        <div class="speech" id="speech">がんばってね！</div>
        <div class="controls">
          <button class="primary" id="regenBtn">新しいランダム30問</button>
          <button class="secondary" id="checkBtn">こたえあわせ</button>
          <button class="ghost" id="showBtn">こたえを見る</button>
        </div>
        <div class="scorebox" id="scoreBox"></div>
      </div>
    </div>
  </section>

  <p class="meta">30問 / もんだいは毎回シャッフルされます</p>
  <div class="grid" id="quiz"></div>
  <p class="footer-note">※ 入力は、漢字かなまじりでOK。答えがまちがっていたら正解が表示されます。</p>
</div>
<script>
const allQuestions = [{"id": 1, "type": "char", "prompt": "□車（きしゃ）に のる。", "answer": "汽", "alts": ["汽車"]}, {"id": 2, "type": "char", "prompt": "□後（ごご）の おやつ。", "answer": "午", "alts": ["午後"]}, {"id": 3, "type": "word", "prompt": "「かえす」を 漢字で かこう。", "answer": "帰す", "alts": []}, {"id": 4, "type": "word", "prompt": "「かえる」を 漢字で かこう。", "answer": "帰る", "alts": []}, {"id": 5, "type": "word", "prompt": "「つよまる」を 漢字で かこう。", "answer": "強まる", "alts": []}, {"id": 6, "type": "word", "prompt": "「つよい」を 漢字で かこう。", "answer": "強い", "alts": []}, {"id": 7, "type": "word", "prompt": "「ひろい」を 漢字で かこう。", "answer": "広い", "alts": []}, {"id": 8, "type": "word", "prompt": "「とめる」を 漢字で かこう。", "answer": "止める", "alts": []}, {"id": 9, "type": "word", "prompt": "「あう」を 漢字で かこう。", "answer": "合う", "alts": ["話し合う"]}, {"id": 10, "type": "word", "prompt": "「つくる」を 漢字で かこう。", "answer": "作る", "alts": []}, {"id": 11, "type": "word", "prompt": "「よわい」を 漢字で かこう。", "answer": "弱い", "alts": []}, {"id": 12, "type": "word", "prompt": "「よわまる」を 漢字で かこう。", "answer": "弱まる", "alts": []}, {"id": 13, "type": "word", "prompt": "「すくない」を 漢字で かこう。", "answer": "少ない", "alts": []}, {"id": 14, "type": "word", "prompt": "「すこし」を 漢字で かこう。", "answer": "少し", "alts": []}, {"id": 15, "type": "char", "prompt": "□せつな ともだち。", "answer": "大", "alts": ["大切"]}, {"id": 16, "type": "char", "prompt": "□がっせん をする。", "answer": "雪", "alts": ["雪合戦"]}, {"id": 17, "type": "word", "prompt": "「きる」を 漢字で かこう。", "answer": "切る", "alts": []}, {"id": 18, "type": "word", "prompt": "「くむ」を 漢字で かこう。", "answer": "組む", "alts": []}, {"id": 19, "type": "word", "prompt": "「はしる」を 漢字で かこう。", "answer": "走る", "alts": []}, {"id": 20, "type": "word", "prompt": "「おおい」を 漢字で かこう。", "answer": "多い", "alts": []}, {"id": 21, "type": "char", "prompt": "テストの □すう。", "answer": "点", "alts": ["点数"]}, {"id": 22, "type": "char", "prompt": "□を かかえる。", "answer": "頭", "alts": []}, {"id": 23, "type": "word", "prompt": "「あたる」を 漢字で かこう。", "answer": "当たる", "alts": []}, {"id": 24, "type": "word", "prompt": "「こたえる」を 漢字で かこう。", "answer": "答える", "alts": []}, {"id": 25, "type": "word", "prompt": "「こたえ」を 漢字で かこう。", "answer": "答え", "alts": []}, {"id": 26, "type": "word", "prompt": "「おなじ」を 漢字で かこう。", "answer": "同じ", "alts": []}, {"id": 27, "type": "char", "prompt": "□を ひたすら 進む。", "answer": "道", "alts": []}, {"id": 28, "type": "char", "prompt": "本が □れる。", "answer": "売", "alts": ["売れる"]}, {"id": 29, "type": "word", "prompt": "「あわせて」を 漢字で かこう。", "answer": "合わせて", "alts": ["合せて"]}, {"id": 30, "type": "word", "prompt": "「とおい」を 漢字で かこう。", "answer": "遠い", "alts": []}, {"id": 31, "type": "word", "prompt": "「ちかい」を 漢字で かこう。", "answer": "近い", "alts": []}, {"id": 32, "type": "word", "prompt": "「きこえる」を 漢字で かこう。", "answer": "聞こえる", "alts": []}, {"id": 33, "type": "char", "prompt": "□京（じょうきょう）する。", "answer": "上", "alts": ["上京"]}, {"id": 34, "type": "char", "prompt": "元□（げんき）になる。", "answer": "気", "alts": ["元気"]}, {"id": 35, "type": "char", "prompt": "黒字を □上（けいじょう）する。", "answer": "計", "alts": ["計上"]}, {"id": 36, "type": "char", "prompt": "へやの □を あける。", "answer": "戸", "alts": []}];
const mascotImages = [
  'assets/char_beach1.jpg',
  'assets/char_beach2.jpg',
  'assets/char_backview.jpg'
];
const mascotLines = [
  'がんばってね！',
  '30問チャレンジだよ！',
  'ていねいに書けばだいじょうぶ！',
  'あと少し、いい感じ！',
  'まちがえても大丈夫。つぎいこう！',
  'よーし、ランダムテスト！'
];
let currentQuestions = [];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function normalize(s) {
  return (s || '')
    .replace(/[\s　]/g, '')
    .replace(/，/g, ',')
    .replace(/。/g, '')
    .trim();
}

function setHero() {
  document.getElementById('heroImg').src = mascotImages[Math.floor(Math.random()*mascotImages.length)];
  document.getElementById('speech').textContent = mascotLines[Math.floor(Math.random()*mascotLines.length)];
}

function renderQuiz() {
  currentQuestions = shuffle(allQuestions).slice(0, 30);
  const quiz = document.getElementById('quiz');
  quiz.innerHTML = '';
  document.getElementById('scoreBox').style.display = 'none';
  currentQuestions.forEach((q, idx) => {
    if (idx > 0 && idx % 5 === 0) {
      const m = document.createElement('div');
      m.className = 'mascot-card';
      m.innerHTML = `
        <img src="${mascotImages[idx % mascotImages.length]}" alt="キャラクター">
        <div>
          <div style="font-weight:800; font-size:20px; margin-bottom:4px;">ひとやすみメッセージ</div>
          <div style="font-size:18px; line-height:1.6;">${mascotLines[idx % mascotLines.length]}</div>
          <div class="small">このままつづけよう！</div>
        </div>`;
      quiz.appendChild(m);
    }
    const card = document.createElement('div');
    card.className = 'q';
    card.innerHTML = `
      <div class="qhead">
        <div><strong>第${idx+1}問</strong></div>
        <div class="badge">${q.type === 'char' ? '1文字を入れる' : 'ことばを漢字で書く'}</div>
      </div>
      <div class="prompt">${q.prompt}</div>
      <div class="answer-row">
        <input type="text" data-id="${q.id}" placeholder="ここにこたえを入力" autocapitalize="off" autocomplete="off" />
      </div>
      <div class="feedback" id="fb-${q.id}"></div>
    `;
    quiz.appendChild(card);
  });
  setHero();
  window.scrollTo({ top:0, behavior:'smooth' });
}

function mark(showOnly=false) {
  let score = 0;
  currentQuestions.forEach(q => {
    const input = document.querySelector(`input[data-id="${q.id}"]`);
    const fb = document.getElementById(`fb-${q.id}`);
    const value = normalize(input.value);
    const accepted = [normalize(q.answer), ...(q.alts || []).map(normalize)];
    const ok = accepted.includes(value);
    if (!showOnly && ok) score++;
    fb.style.display = 'block';
    if (showOnly) {
      fb.className = 'feedback ok';
      fb.textContent = `正解：${q.answer}`;
    } else if (ok) {
      fb.className = 'feedback ok';
      fb.textContent = `○ せいかい！　答え：${q.answer}`;
    } else {
      fb.className = 'feedback ng';
      fb.textContent = `× ざんねん。正解：${q.answer}`;
    }
  });
  if (!showOnly) {
    const scoreBox = document.getElementById('scoreBox');
    scoreBox.style.display = 'block';
    scoreBox.textContent = `てんすう：${score} / 30 問せいかい`;
  }
}

document.getElementById('regenBtn').addEventListener('click', renderQuiz);
document.getElementById('checkBtn').addEventListener('click', () => mark(false));
document.getElementById('showBtn').addEventListener('click', () => mark(true));
renderQuiz();
</script>
</body>
</html>
