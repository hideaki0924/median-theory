<style>
*{box-sizing:border-box}
body{margin:0;background:#07101f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;padding:14px;line-height:1.5}
main{max-width:760px;margin:auto}
h1{font-size:24px;margin:6px 0 4px} .sub{color:#a9c2e8;font-size:13px;font-weight:800}
.card{background:#10224a;border:1px solid #3b82f6;border-radius:17px;padding:14px;margin:12px 0}
h2{font-size:19px;margin:0 0 10px}
textarea,input,button{font:inherit}
textarea,input{width:100%;border:1px solid #60a5fa;border-radius:12px;background:#f8fafc;color:#111;padding:10px}
textarea{min-height:250px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.4}
button{border:0;border-radius:12px;padding:13px 14px;font-weight:900;cursor:pointer}
.row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}
.blue{background:#2563eb;color:#fff} .green{background:#16a34a;color:#fff} .red{background:#dc2626;color:#fff} .light{background:#dbeafe;color:#0f172a}
.msg{margin-top:9px;padding:10px;border-radius:10px;font-weight:900} .ok{background:#123d25} .ng{background:#4b1717}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:#09162f;border:1px solid #315b9f;border-radius:12px;padding:10px}
.v{font-size:24px;font-weight:900} .k{font-size:12px;color:#a9c2e8}
.tableWrap{overflow:auto;border:1px solid #315b9f;border-radius:12px;margin-top:10px}
table{border-collapse:collapse;width:100%;min-width:650px;background:#09162f}
th,td{padding:7px;border-bottom:1px solid #223d6b;text-align:center;font-size:12px;white-space:nowrap}
th{background:#173462}
.small{font-size:12px;color:#a9c2e8}
@media(max-width:600px){.row,.stats{grid-template-columns:1fr 1fr}}

const DB_NAME="compi_lab_db";
const STORE="races";
let db;

function openDb(){
 return new Promise((resolve,reject)=>{
  const req=indexedDB.open(DB_NAME,1);
  req.onupgradeneeded=()=>{
   const d=req.result;
   if(!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE,{keyPath:"id"});
  };
  req.onsuccess=()=>{db=req.result;resolve(db)};
  req.onerror=()=>reject(req.error);
 });
}
function allRecords(){
 return new Promise((resolve,reject)=>{
  const req=db.transaction(STORE,"readonly").objectStore(STORE).getAll();
  req.onsuccess=()=>resolve(req.result||[]);
  req.onerror=()=>reject(req.error);
 });
}
function putRecord(r){
 return new Promise((resolve,reject)=>{
  const req=db.transaction(STORE,"readwrite").objectStore(STORE).put(r);
  req.onsuccess=()=>resolve(); req.onerror=()=>reject(req.error);
 });
}
function clearRecords(){
 return new Promise((resolve,reject)=>{
  const req=db.transaction(STORE,"readwrite").objectStore(STORE).clear();
  req.onsuccess=()=>resolve(); req.onerror=()=>reject(req.error);
 });
}
function pClass(sum){if(sum>=219)return"P5";if(sum>=213)return"P4";if(sum>=207)return"P3";if(sum>=203)return"P2";return"P1"}
function metrics(c){
 const sum3=c.slice(0,3).reduce((a,x)=>a+x.index,0);
 return {headCount:c.length,sum3,p:pClass(sum3),gap13:c.length>=3?c[0].index-c[2].index:null,gap56:c.length>=6?c[4].index-c[5].index:null};
}
function classify(r){
 if(!r.result)return{ranks:[],label:"結果未入力",top3:false,top5:false,invaders:null};
 const map=new Map(r.compi.map((x,i)=>[x.horse,i+1]));
 const ranks=r.result.map(h=>map.get(h)??null);
 if(ranks.some(x=>x===null))return{ranks,label:"結果馬不在",top3:false,top5:false,invaders:null};
 const max=Math.max(...ranks), invaders=ranks.filter(x=>x>=6).length;
 let label=max<=3?"上位3頭完結":max<=4?"上位4頭完結":max<=5?"上位5頭完結":invaders===1?"6位以下1頭侵入":invaders===2?"6位以下2頭侵入":"上位5頭全崩れ";
 return{ranks,label,top3:max<=3,top5:max<=5,invaders};
}
function parseCompi(lines){
 const out=[];
 for(const raw of lines){
  const s=raw.trim(); if(!s)continue;
  const m=s.match(/^(\d+)\s*[,，]\s*(\d+(?:\.\d+)?)$/);
  if(!m)throw new Error("コンピ行エラー："+s);
  out.push({horse:+m[1],index:+m[2]});
 }
 return out.sort((a,b)=>b.index-a.index||a.horse-b.horse);
}
function parseBulk(text){
 const lines=String(text).split(/\r?\n/);
 let date="",place="",raceNo=null,buf=[],result=null; const out=[];
 const flush=()=>{
  if(raceNo===null)return;
  const compi=parseCompi(buf);
  if(!date||!place||compi.length<3)throw new Error("DATE・PLACE・コンピを確認してください");
  const base={id:`${date}_${place}_${raceNo}`,date,place,raceNo,compi,result};
  out.push(Object.assign(base,metrics(compi),classify(base)));
  raceNo=null;buf=[];result=null;
 };
 for(const raw of lines){
  const s=raw.trim(); if(!s)continue; let m;
  if((m=s.match(/^DATE\s*=\s*(\d{4}-\d{2}-\d{2})$/i))){date=m[1];continue}
  if((m=s.match(/^PLACE\s*=\s*(.+)$/i))){place=m[1].trim();continue}
  if((m=s.match(/^R(?:ACE)?\s*(\d{1,2})$/i))){flush();raceNo=+m[1];continue}
  if((m=s.match(/^RESULT\s*=\s*(\d+)\s*[-－]\s*(\d+)\s*[-－]\s*(\d+)$/i))){result=[+m[1],+m[2],+m[3]];continue}
  if(raceNo===null)throw new Error("R番号より前に数字があります："+s);
  buf.push(s);
 }
 flush(); return out;
}
function pct(n,d){return d?(n/d*100).toFixed(1)+"%":"—"}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
async function render(){
 const rows=(await allRecords()).sort((a,b)=>(a.date+a.place+String(a.raceNo).padStart(2,"0")).localeCompare(b.date+b.place+String(b.raceNo).padStart(2,"0")));
 const done=rows.filter(x=>x.result&&x.ranks&&!x.ranks.some(v=>v===null));
 const top3=done.filter(x=>x.top3).length,top5=done.filter(x=>x.top5).length,inv1=done.filter(x=>x.invaders===1).length,inv2=done.filter(x=>(x.invaders??0)>=2).length;
 const cards=[["登録レース",rows.length],["結果入力済み",done.length],["上位3頭内",`${top3} / ${pct(top3,done.length)}`],["上位5頭内",`${top5} / ${pct(top5,done.length)}`],["6位以下1頭",`${inv1} / ${pct(inv1,done.length)}`],["6位以下2頭以上",`${inv2} / ${pct(inv2,done.length)}`]];
 document.getElementById("stats").innerHTML=cards.map(x=>`<div class="stat"><div class="v">${esc(x[1])}</div><div class="k">${esc(x[0])}</div></div>`).join("");
 document.getElementById("tbody").innerHTML=rows.map(x=>`<tr><td>${x.date}</td><td>${esc(x.place)}</td><td>${x.raceNo}R</td><td>${x.headCount}</td><td>${x.ranks?.join("・")||"—"}</td><td>${esc(x.label)}</td><td>${x.gap13??"—"}</td><td>${x.gap56??"—"}</td><td>${x.p}</td></tr>`).join("");
}
function show(t,ok=true){document.getElementById("msg").innerHTML=`<div class="msg ${ok?"ok":"ng"}">${esc(t)}</div>`}
function download(name,text,type){
 const blob=new Blob([text],{type}),a=document.createElement("a");
 a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
document.getElementById("load36").onclick=()=>{document.getElementById("bulk").value=PRESET;show("36Rコードを入れました。次に「一括読込・保存」を押してください。")};
document.getElementById("clearBox").onclick=()=>document.getElementById("bulk").value="";
document.getElementById("saveBulk").onclick=async()=>{
 try{
  const arr=parseBulk(document.getElementById("bulk").value);
  for(const r of arr)await putRecord(r);
  show(arr.length+"レース保存しました。");await render();
 }catch(e){show(e.message,false)}
};
document.getElementById("clearDb").onclick=async()=>{if(confirm("研究データを全部削除しますか？")){await clearRecords();show("全削除しました。");render()}};
document.getElementById("exportJson").onclick=async()=>download("compi_lab_backup.json",JSON.stringify(await allRecords(),null,2),"application/json");
document.getElementById("exportCsv").onclick=async()=>{
 const rows=await allRecords();const head="date,place,raceNo,headCount,resultRanks,class,gap13,gap56,p";
 const body=rows.map(x=>[x.date,x.place,x.raceNo,x.headCount,(x.ranks||[]).join("-"),x.label,x.gap13,x.gap56,x.p].map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\n");
 download("compi_lab.csv",head+"\n"+body,"text/csv;charset=utf-8");
};
(async()=>{try{await openDb();await render()}catch(e){show("保存機能の初期化に失敗："+e.message,false)}})();
</script>
</body>
</html>
