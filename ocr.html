<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101f"><title>コンピ研究所 V2.00</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07101f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;padding:14px;line-height:1.5}main{max-width:900px;margin:auto}h1{font-size:26px;margin:3px 0 8px}.ver{display:inline-block;background:#facc15;color:#111827;font-weight:900;padding:6px 11px;border-radius:999px}.notice{margin-top:9px;background:#164e63;border:2px solid #22d3ee;border-radius:13px;padding:10px;font-weight:800}.card{background:#10224a;border:2px solid #3b82f6;border-radius:20px;padding:15px;margin:13px 0}h2{font-size:21px;margin:0 0 10px}textarea{width:100%;min-height:360px;border:2px solid #60a5fa;border-radius:16px;padding:12px;background:#f8fafc;color:#111827;font-size:14px;line-height:1.45;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}button,label.fileBtn{width:100%;border:0;border-radius:15px;padding:14px 8px;font-size:16px;font-weight:900;text-align:center;display:block;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.green{background:#16a34a;color:#fff}.blue{background:#2563eb;color:#fff}.light{background:#dbeafe;color:#0f172a}.red{background:#dc2626;color:#fff}.orange{background:#d97706;color:#fff}.purple{background:#7c3aed;color:#fff}.msg{margin-top:12px;padding:13px;border-radius:13px;font-weight:900;white-space:pre-wrap}.ok{background:#14532d}.ng{background:#7f1d1d}.info{background:#1e3a8a}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#09162f;border:1px solid #315b9f;border-radius:14px;padding:12px}.v{font-size:26px;font-weight:900}.k{font-size:12px;color:#a9c2e8}.sub{font-size:13px;color:#c7d8f2}.table{overflow:auto;border:1px solid #315b9f;border-radius:12px;margin-top:10px}table{border-collapse:collapse;width:100%;min-width:850px;background:#09162f}th,td{padding:7px;border-bottom:1px solid #223d6b;text-align:center;font-size:12px;white-space:nowrap}th{background:#173462;position:sticky;top:0}.sectionTitle{font-weight:900;margin:15px 0 7px;color:#fde68a}.rankRow{background:#09162f;border:1px solid #315b9f;border-radius:12px;padding:10px;margin:7px 0}.good{color:#86efac}.warn{color:#fde047}.bad{color:#fca5a5}input[type=file]{display:none}@media(max-width:600px){button,label.fileBtn{font-size:15px;padding:13px 5px}.stats{grid-template-columns:1fr 1fr}textarea{min-height:420px}}
</style></head><body><main>
<h1>コンピ研究所</h1><div class="ver">V2.00 完全作り直し版</div>
<div class="notice">3会場・複数レースを一括貼付。COMPIが途中で改行されても読み取ります。</div>
<section class="card"><h2>① レースを一括登録</h2>
<textarea id="bulk" placeholder="【札幌1R】
DATE=2026-07-26
PLACE=札幌
R=1
COMPI=10:88,6:68,11:60,9:55,7:54,1:53
RECOMMEND=10
RESULT=10-2-1

【札幌2R】
..."></textarea>
<div class="grid"><button class="blue" id="sampleBtn">見本を入れる</button><button class="green" id="saveBtn">一括読込・保存</button><button class="light" id="clearInputBtn">入力欄を消す</button><button class="red" id="clearAllBtn">研究データ全削除</button></div>
<div id="msg" class="msg info">待機中。コードを貼り、「一括読込・保存」を押してください。</div></section>
<section class="card"><h2>② 基本集計</h2><div id="stats" class="stats"></div></section>
<section class="card"><h2>③ コンピ推奨馬が来る条件</h2><div id="conditionReport"></div></section>
<section class="card"><h2>④ チャッピーへ送る・バックアップ</h2><div class="grid"><button class="orange" id="shareBtn">分析結果を共有</button><button class="purple" id="copyBtn">チャッピー用コピー</button><button class="light" id="csvBtn">CSV出力</button><button class="light" id="txtBtn">全件TXT出力</button><label class="fileBtn blue" for="importFile">CSV/JSON読込</label><input id="importFile" type="file" accept=".csv,.json,.txt,text/csv,application/json"></div></section>
<section class="card"><h2>⑤ 保存データ</h2><div class="table"><table><thead><tr><th>日付</th><th>場</th><th>R</th><th>頭数</th><th>P</th><th>gap13</th><th>gap56</th><th>結果</th><th>結果順位</th><th>型</th><th>推奨</th><th>推奨順位</th><th>的中</th></tr></thead><tbody id="tbody"></tbody></table></div></section>
</main><script>
'use strict';
const KEY='compi_lab_v200'; let rows=[];
const $=id=>document.getElementById(id); const pct=(n,d)=>d?(n/d*100).toFixed(1)+'%':'—';
function showMsg(t,type='ok'){const el=$('msg');el.className='msg '+type;el.textContent=t}
function normalize(s){return String(s??'').replace(/^\uFEFF/,'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[Ｒｒ]/g,'R').replace(/＝/g,'=').replace(/：/g,':').replace(/[－―ー−]/g,'-').replace(/，/g,',').replace(/[［【]/g,'【').replace(/[］】]/g,'】').replace(/```(?:text)?/gi,'').trim()}
function pClass(sum){if(sum>=219)return'P5';if(sum>=213)return'P4';if(sum>=207)return'P3';if(sum>=203)return'P2';return'P1'}
function numList(s){return String(s??'').match(/\d+/g)?.map(Number)||[]}
function analyze(r){r.compi=[...new Map(r.compi.map(x=>[x.horse,x])).values()].sort((a,b)=>b.index-a.index||a.horse-b.horse);r.headCount=r.compi.length;r.sum3=r.compi.slice(0,3).reduce((s,x)=>s+x.index,0);r.p=pClass(r.sum3);r.gap13=r.compi.length>=3?r.compi[0].index-r.compi[2].index:null;r.gap56=r.compi.length>=6?r.compi[4].index-r.compi[5].index:null;const rank=new Map(r.compi.map((x,i)=>[x.horse,i+1]));r.resultRanks=(r.result||[]).map(h=>rank.get(h)||null);r.recommendRanks=(r.recommend||[]).map(h=>rank.get(h)||null);r.recHits=(r.recommend||[]).filter(h=>(r.result||[]).includes(h));r.recWin=(r.recommend||[]).includes((r.result||[])[0]);if(r.resultRanks.length===3&&!r.resultRanks.includes(null)){const mx=Math.max(...r.resultRanks),inv=r.resultRanks.filter(x=>x>=6).length;r.class=mx<=3?'上位3頭完結':mx<=4?'上位4頭完結':mx<=5?'上位5頭完結':inv===1?'6位以下1頭侵入':inv===2?'6位以下2頭侵入':'6位以下3頭'}else r.class=r.result?.length?'結果馬不在':'結果未入力';r.id=`${r.date}_${r.place}_${r.raceNo}`;return r}
function field(block,name){const re=new RegExp('(?:^|\\n)\\s*'+name+'\\s*=\\s*([\\s\\S]*?)(?=\\n\\s*(?:DATE|PLACE|R|COMPI|RECOMMEND|REC|推奨|RESULT)\\s*=|$)','i');const m=block.match(re);return m?m[1].trim():''}
function parseCompi(raw){const pairs=[];const re=/(\d+)\s*:\s*(\d+(?:\.\d+)?)/g;let m;while((m=re.exec(raw)))pairs.push({horse:+m[1],index:+m[2]});return pairs}
function parseBlocks(text){const src=normalize(text);if(!src)throw Error('入力欄が空です。');const header=/【\s*([^【】\n]+?)\s*(\d{1,2})\s*R\s*】/gi;const marks=[];let m;while((m=header.exec(src)))marks.push({index:m.index,end:header.lastIndex,place:m[1].trim(),raceNo:+m[2]});const out=[];
 if(marks.length){for(let i=0;i<marks.length;i++){const a=marks[i],b=marks[i+1];const block=src.slice(a.end,b?b.index:src.length);const date=field(block,'DATE');const place=field(block,'PLACE')||a.place;const rNo=+(field(block,'R')||a.raceNo);const compi=parseCompi(field(block,'COMPI'));const recommend=numList(field(block,'(?:RECOMMEND|REC|推奨)'));const result=numList(field(block,'RESULT'));if(!date)throw Error(`${place}${rNo}R：DATEがありません`);if(compi.length<3)throw Error(`${place}${rNo}R：COMPIを3頭以上読み取れません`);if(result.length&&result.length!==3)throw Error(`${place}${rNo}R：RESULTは3頭必要です`);out.push(analyze({date,place,raceNo:rNo,compi,recommend,result:result.length?result:null}));}}
 else {const date=field(src,'DATE'),place=field(src,'PLACE');const starts=[...src.matchAll(/(?:^|\n)\s*R\s*=*\s*(\d{1,2})\s*(?=\n|$)/gi)];if(!starts.length)throw Error('【札幌1R】のような見出しを読み取れません。');for(let i=0;i<starts.length;i++){const rNo=+starts[i][1],start=starts[i].index,end=starts[i+1]?.index||src.length,block=src.slice(start,end),compi=parseCompi(field(block,'COMPI'));const recommend=numList(field(block,'(?:RECOMMEND|REC|推奨)')),result=numList(field(block,'RESULT'));if(compi.length<3)throw Error(`${place}${rNo}R：COMPI不足`);out.push(analyze({date,place,raceNo:rNo,compi,recommend,result:result.length?result:null}));}}
 return out}
function load(){try{rows=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(rows))rows=[];rows=rows.map(analyze)}catch{rows=[]}render()}
function persist(){localStorage.setItem(KEY,JSON.stringify(rows))}
function save(){try{const got=parseBlocks($('bulk').value);for(const r of got){const i=rows.findIndex(x=>x.id===r.id);if(i>=0)rows[i]=r;else rows.push(r)}persist();render();showMsg(`${got.length}レース保存しました。合計${rows.length}レースです。`,'ok')}catch(e){showMsg(e.message,'ng')}}
function sample(){$('bulk').value=`【札幌1R】\nDATE=2026-07-26\nPLACE=札幌\nR=1\nCOMPI=10:88,6:68,11:60,9:55,7:54,1:53,\n2:52,3:51,8:50,4:47,5:46,12:40\nRECOMMEND=10\nRESULT=10-2-1\n\n【札幌2R】\nDATE=2026-07-26\nPLACE=札幌\nR=2\nCOMPI=6:82,8:71,2:70,9:55,5:54,10:53,4:50,1:49,7:48,3:46\nRECOMMEND=6\nRESULT=9-5-6`;showMsg('2レースの見本を入れました。保存を押してください。','info')}
function doneRows(){return rows.filter(x=>x.resultRanks?.length===3&&!x.resultRanks.includes(null))}
function groupStats(label,getKey){const d=doneRows().filter(x=>x.recommend?.length);const mp=new Map();for(const r of d){const key=getKey(r);if(key==null||key==='')continue;if(!mp.has(key))mp.set(key,{races:0,hitRace:0,winRace:0,recs:0,hits:0});const z=mp.get(key);z.races++;if(r.recHits.length)z.hitRace++;if(r.recWin)z.winRace++;z.recs+=r.recommend.length;z.hits+=r.recHits.length}return {label,items:[...mp.entries()].map(([key,z])=>({key,...z,rate:z.hitRace/z.races})).sort((a,b)=>b.rate-a.rate||b.races-a.races)}}
function conditionGroups(){return [groupStats('P判定別',r=>r.p),groupStats('頭数別',r=>r.headCount<=8?'8頭以下':r.headCount<=12?'9〜12頭':r.headCount<=15?'13〜15頭':'16頭以上'),groupStats('gap13別',r=>r.gap13<=5?'0〜5':r.gap13<=10?'6〜10':'11以上'),groupStats('gap56別',r=>r.gap56==null?null:r.gap56<=1?'0〜1':r.gap56<=3?'2〜3':'4以上'),groupStats('上位5頭決着別',r=>Math.max(...r.resultRanks)<=5?'上位5頭完結':'6位以下侵入'),groupStats('推奨馬のコンピ順位別',r=>r.recommendRanks.length===1?`${r.recommendRanks[0]}位`:'複数推奨')]}
function render(){rows.sort((a,b)=>(a.date+a.place+String(a.raceNo).padStart(2,'0')).localeCompare(b.date+b.place+String(b.raceNo).padStart(2,'0')));const done=doneRows(),top5=done.filter(x=>Math.max(...x.resultRanks)<=5).length,rec=done.filter(x=>x.recommend?.length),hitRace=rec.filter(x=>x.recHits.length).length,win=rec.filter(x=>x.recWin).length,recN=rec.reduce((s,x)=>s+x.recommend.length,0),hitN=rec.reduce((s,x)=>s+x.recHits.length,0);$('stats').innerHTML=[['登録レース',rows.length],['結果入力済み',done.length],['上位5頭完結',`${top5}/${done.length} ${pct(top5,done.length)}`],['6位以下侵入',`${done.length-top5}/${done.length} ${pct(done.length-top5,done.length)}`],['推奨馬1頭以上馬券内',`${hitRace}/${rec.length} ${pct(hitRace,rec.length)}`],['推奨馬が1着',`${win}/${rec.length} ${pct(win,rec.length)}`],['推奨馬単位の複勝率',`${hitN}/${recN} ${pct(hitN,recN)}`],['推奨対象レース',rec.length]].map(x=>`<div class="stat"><div class="v">${x[1]}</div><div class="k">${x[0]}</div></div>`).join('');
 const groups=conditionGroups();$('conditionReport').innerHTML=groups.map(g=>`<div class="sectionTitle">${g.label}</div>${g.items.length?g.items.map(x=>`<div class="rankRow"><b>${x.key}</b>　対象${x.races}R　<span class="${x.rate>=.7?'good':x.rate>=.5?'warn':'bad'}">1頭以上馬券内 ${x.hitRace}/${x.races}＝${pct(x.hitRace,x.races)}</span>　1着${x.winRace}/${x.races}　推奨馬単位${x.hits}/${x.recs}＝${pct(x.hits,x.recs)}</div>`).join(''):'<div class="sub">対象データなし</div>'}`).join('');
 $('tbody').innerHTML=rows.map(x=>`<tr><td>${x.date}</td><td>${x.place}</td><td>${x.raceNo}R</td><td>${x.headCount}</td><td>${x.p}</td><td>${x.gap13??'—'}</td><td>${x.gap56??'—'}</td><td>${(x.result||[]).join('-')||'—'}</td><td>${(x.resultRanks||[]).join('-')||'—'}</td><td>${x.class}</td><td>${(x.recommend||[]).join('-')||'—'}</td><td>${(x.recommendRanks||[]).join('-')||'—'}</td><td>${(x.recHits||[]).join('-')||'なし'}</td></tr>`).join('')}
function summary(){const done=doneRows(),top5=done.filter(x=>Math.max(...x.resultRanks)<=5).length,rec=done.filter(x=>x.recommend?.length),hitRace=rec.filter(x=>x.recHits.length).length,win=rec.filter(x=>x.recWin).length,recN=rec.reduce((s,x)=>s+x.recommend.length,0),hitN=rec.reduce((s,x)=>s+x.recHits.length,0);let t=`【コンピ研究所 V2 分析依頼】\n登録：${rows.length}R\n結果済：${done.length}R\n上位5頭完結：${top5}/${done.length}=${pct(top5,done.length)}\n6位以下侵入：${done.length-top5}/${done.length}=${pct(done.length-top5,done.length)}\n\n【コンピ推奨馬】\n対象：${rec.length}R\n1頭以上馬券内：${hitRace}/${rec.length}=${pct(hitRace,rec.length)}\n1着：${win}/${rec.length}=${pct(win,rec.length)}\n推奨馬単位の複勝率：${hitN}/${recN}=${pct(hitN,recN)}\n`;for(const g of conditionGroups()){t+=`\n【${g.label}】\n`;for(const x of g.items)t+=`${x.key}: 対象${x.races}R / 馬券内${x.hitRace}R=${pct(x.hitRace,x.races)} / 1着${x.winRace}R / 馬単位${x.hits}/${x.recs}=${pct(x.hits,x.recs)}\n`}t+='\nコンピ推奨馬が来る条件・飛ぶ条件と、上位5頭完結との関係を分析してください。';return t}
async function copyText(t){try{await navigator.clipboard.writeText(t);showMsg('コピーしました。ChatGPTへ貼り付けてください。','ok')}catch{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();showMsg('コピーしました。','ok')}}
async function share(){const t=summary();if(navigator.share){try{await navigator.share({title:'コンピ研究所 V2',text:t});return}catch(e){if(e.name==='AbortError')return}}copyText(t)}
function download(name,text,type){const u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}
function exportCsv(){const cols=['date','place','raceNo','headCount','p','gap13','gap56','result','resultRanks','class','recommend','recommendRanks','recommendHits','recommendWin','compi'];const body=rows.map(r=>[r.date,r.place,r.raceNo,r.headCount,r.p,r.gap13,r.gap56,(r.result||[]).join('-'),(r.resultRanks||[]).join('-'),r.class,(r.recommend||[]).join('-'),(r.recommendRanks||[]).join('-'),(r.recHits||[]).join('-'),r.recWin?'1':'0',r.compi.map(x=>`${x.horse}:${x.index}`).join('|')].map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');download('compi_lab_v200.csv','\uFEFF'+cols.join(',')+'\n'+body,'text/csv;charset=utf-8')}
function exportTxt(){download('compi_lab_v200_chappy.txt',summary()+'\n\n---全件JSON---\n'+rows.map(x=>JSON.stringify(x)).join('\n'),'text/plain;charset=utf-8')}
function importFile(file){const rd=new FileReader();rd.onload=()=>{try{const text=String(rd.result);if(file.name.toLowerCase().endsWith('.json')){const arr=JSON.parse(text);if(!Array.isArray(arr))throw Error('JSON配列ではありません');for(const x of arr){const r=analyze(x);const i=rows.findIndex(y=>y.id===r.id);i>=0?rows[i]=r:rows.push(r)}}else{const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(Boolean);const head=lines.shift().split(',').map(x=>x.replace(/^"|"$/g,''));for(const line of lines){const vals=[];let cur='',q=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'&&line[i+1]==='"'){cur+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){vals.push(cur);cur=''}else cur+=c}vals.push(cur);const o=Object.fromEntries(head.map((h,i)=>[h,vals[i]??'']));if(!o.date||!o.place)continue;const compi=String(o.compi||'').split('|').map(z=>z.match(/(\d+):(\d+(?:\.\d+)?)/)).filter(Boolean).map(m=>({horse:+m[1],index:+m[2]}));if(!compi.length)continue;const r=analyze({date:o.date,place:o.place,raceNo:+o.raceNo,compi,recommend:numList(o.recommend),result:numList(o.result)});const i=rows.findIndex(y=>y.id===r.id);i>=0?rows[i]=r:rows.push(r)}}persist();render();showMsg(`読込完了。合計${rows.length}レースです。`,'ok')}catch(e){showMsg('読込失敗：'+e.message,'ng')}};rd.readAsText(file)}
$('sampleBtn').onclick=sample;$('saveBtn').onclick=save;$('clearInputBtn').onclick=()=>{$('bulk').value='';showMsg('入力欄を消しました。','info')};$('clearAllBtn').onclick=()=>{if(confirm('研究データをすべて削除しますか？')){rows=[];persist();render();showMsg('全データを削除しました。','ok')}};$('shareBtn').onclick=share;$('copyBtn').onclick=()=>copyText(summary());$('csvBtn').onclick=exportCsv;$('txtBtn').onclick=exportTxt;$('importFile').onchange=e=>{if(e.target.files[0])importFile(e.target.files[0]);e.target.value=''};window.addEventListener('error',e=>showMsg('アプリ内部エラー：'+e.message,'ng'));load();
</script></body></html>
