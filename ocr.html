<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>チャッピーOCR V0.6 netkeiba単複専用</title>
<script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
body{background:#07101f;color:white;font-family:sans-serif;padding:16px}
h1{color:#ffd84d}
.box{background:#111827;padding:14px;border-radius:16px;margin:12px 0}
button,input{width:100%;font-size:20px;padding:14px;margin:8px 0;border-radius:12px}
textarea{width:100%;height:230px;font-size:16px;border-radius:12px;padding:10px;box-sizing:border-box}
.copy{background:#16a34a;color:white;font-weight:bold}
img{max-width:100%;border-radius:12px}
.small{font-size:14px;color:#cbd5e1}
</style>
</head>

<body>

<h1>📸チャッピーOCR V0.6</h1>
<p>netkeiba単複専用：人気列を無視して、馬番・単勝・複勝上限だけ読む</p>

<div class="box">
<input type="file" id="img" accept="image/*">
<img id="preview">
<button onclick="runNetkeibaTanfuku()">netkeiba単複を読む</button>
<div id="status" class="small"></div>
</div>

<div class="box">
<h2>メジアンアプリコード</h2>
<textarea id="code"></textarea>
<button class="copy" onclick="copyCode()">コピー</button>
</div>

<canvas id="cv" style="display:none"></canvas>

<script>
let imageObj=null;

document.getElementById("img").addEventListener("change",e=>{
  const file=e.target.files[0];
  if(!file)return;

  const url=URL.createObjectURL(file);
  document.getElementById("preview").src=url;

  imageObj=new Image();
  imageObj.onload=()=>{};
  imageObj.src=url;
});

async function ocrCrop(img,x,y,w,h){
  const cv=document.getElementById("cv");
  cv.width=w;
  cv.height=h;
  const ctx=cv.getContext("2d");

  ctx.fillStyle="white";
  ctx.fillRect(0,0,w,h);
  ctx.drawImage(img,x,y,w,h,0,0,w,h);

  const result=await Tesseract.recognize(
    cv,
    "eng",
    {
      tessedit_char_whitelist:"0123456789."
    }
  );

  return result.data.text
    .replace(/[^\d.]/g," ")
    .replace(/\s+/g," ")
    .trim();
}

function pickNumber(text){
  const m=text.match(/\d+(?:\.\d+)?/g);
  return m && m.length ? m[m.length-1] : "";
}

async function runNetkeibaTanfuku(){
  if(!imageObj){
    alert("画像を選択してください");
    return;
  }

  const img=imageObj;
  const W=img.naturalWidth || img.width;
  const H=img.naturalHeight || img.height;

  document.getElementById("status").textContent="読み取り中...";
  document.getElementById("code").value="[TANFUKU]\n";

  /*
    netkeiba単複スクショ用の位置指定
    画像サイズに対する割合で読む
  */

  const startY=0.155;   // 1行目の上
  const rowH=0.057;     // 1行の高さ
  const rows=18;        // 最大18頭まで読む

  const horseX=0.105;
  const horseW=0.080;

  const winX=0.690;
  const winW=0.105;

  const placeX=0.885;
  const placeW=0.105;

  let out="[TANFUKU]\n";
  const used=new Set();

  for(let i=0;i<rows;i++){
    const y=Math.floor(H*(startY + rowH*i));
    const h=Math.floor(H*rowH*0.85);

    const horseTxt=await ocrCrop(
      img,
      Math.floor(W*horseX),
      y,
      Math.floor(W*horseW),
      h
    );

    const winTxt=await ocrCrop(
      img,
      Math.floor(W*winX),
      y,
      Math.floor(W*winW),
      h
    );

    const placeTxt=await ocrCrop(
      img,
      Math.floor(W*placeX),
      y,
      Math.floor(W*placeW),
      h
    );

    const horse=pickNumber(horseTxt);
    const win=pickNumber(winTxt);
    const place=pickNumber(placeTxt);

    if(!horse || !win || !place)continue;
    if(Number(horse)<1 || Number(horse)>18)continue;
    if(used.has(horse))continue;

    out+=horse+" "+win+" "+place+"\n";
    used.add(horse);

    document.getElementById("code").value=out;
    document.getElementById("status").textContent=
      "読み取り中... "+(i+1)+"行目";
  }

  document.getElementById("code").value=out;
  document.getElementById("status").textContent="完了";
}

function copyCode(){
  navigator.clipboard.writeText(document.getElementById("code").value);
  alert("コピーしました");
}
</script>

</body>
</html>
