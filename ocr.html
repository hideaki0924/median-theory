<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101f"><title>コンピ研究所 V1.30</title><style>
*{box-sizing:border-box}body{margin:0;background:#07101f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;padding:14px;line-height:1.5}main{max-width:820px;margin:auto}h1{font-size:25px;margin:4px 0}.ver{display:inline-block;background:#facc15;color:#111827;font-weight:900;padding:5px 10px;border-radius:999px;margin-bottom:8px}.card{background:#10224a;border:2px solid #3b82f6;border-radius:18px;padding:14px;margin:12px 0}h2{font-size:20px;margin:0 0 10px}textarea{width:100%;min-height:330px;border:2px solid #60a5fa;border-radius:15px;padding:12px;background:#f8fafc;color:#111;font-size:14px;line-height:1.45;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}button{width:100%;border:0;border-radius:14px;padding:14px 8px;font-size:17px;font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.green{background:#16a34a;color:#fff}.blue{background:#2563eb;color:#fff}.light{background:#dbeafe;color:#0f172a}.red{background:#dc2626;color:#fff}.orange{background:#d97706;color:#fff}.msg{margin-top:12px;padding:13px;border-radius:12px;font-weight:900;white-space:pre-wrap}.ok{background:#14532d}.ng{background:#7f1d1d}.info{background:#1e3a8a}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#09162f;border:1px solid #315b9f;border-radius:13px;padding:11px}.v{font-size:25px;font-weight:900}.k{font-size:12px;color:#a9c2e8}.small{font-size:12px;color:#bcd0ec}.table{overflow:auto;border:1px solid #315b9f;border-radius:12px}table{border-collapse:collapse;width:100%;min-width:760px;background:#09162f}th,td{padding:7px;border-bottom:1px solid #223d6b;text-align:center;font-size:12px;white-space:nowrap}th{background:#173462}.banner{background:#4c1d95;border:2px solid #c4b5fd;padding:10px;border-radius:12px;font-weight:900}@media(max-width:600px){button{font-size:15px;padding:13px 6px}}
</style></head><body><main>
<h1>コンピ研究所</h1><div class="ver">V1.30 iPhone安定版</div><div class="banner">この黄色い「V1.30」が見えていれば新しい版です。</div>
<section class="card"><h2>① コードを貼って保存</h2><textarea id="bulk" placeholder="【札幌1R】
DATE=2026-07-26
PLACE=札幌
R=1
COMPI=10:88,6:68,11:60,9:55,7:54,1:53
RECOMMEND=10
RESULT=10-2-1"></textarea><div class="grid"><button class="blue" onclick="putSample()">見本を入れる</button><button class="green" onclick="saveNow()">一括読込・保存</button><button class="light" onclick="clearInput()">入力欄を消す</button><button class="red" onclick="clearAll()">研究データ全削除</button></div><div id="msg" class="msg info">待機中。まず「見本を入れる」を押すと、ボタンが動くか確認できます。</div></section>
<section class="card"><h2>② 集計</h2><div id="stats" class="stats"></div></section>
<section class="card"><h2>③ チャッピーへ送る</h2><div class="grid"><button class="orange" onclick="shareSummary()">蓄積結果を送る</button><button class="light" onclick="copySummary()">蓄積結果をコピー</button><button class="light" onclick="exportCsv()">CSV出力</button><button class="light" onclick="exportTxt()">全件TXT出力</button></div></section>
<section class="card"><h2>④ 保存データ</h2><div class="table"><table><thead><tr><th>日付</th><th>場</th><th>R</th><th>頭数</th><th>P</th><th>結果</th><th>結果順位</th><th>分類</th><th>推奨</th><th>推奨的中</th></tr></thead><tbody id="tbody"></tbody></table></div></section>
</main><script>
'use strict';
const KEY='compi_lab_v130'; let rows=[];
const $=id=>document.getElementById(id); const pct=(n,d)=>d?(n/d*100).toFixed(1)+'%':'—';
function msg(t,ok=true){$('msg').className='msg '+(ok?'ok':'ng');$('msg').textContent=t}
function load(){try{rows=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(rows))rows=[]}catch{rows=[]}render()}
function persist(){localStorage.setItem(KEY,JSON.stringify(rows))}
function pClass(sum){if(sum>=219)return'P5';if(sum>=213)return'P4';if(sum>=207)return'P3';if(sum>=203)return'P2';return'P1'}
function nums(s){return String(s).split(/[-－,，\s]+/).map(Number).filter(Number.isFinite)}
function normalize(s){return String(s).replace(/^\uFEFF/,'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[Ｒｒ]/g,'R').replace(/＝/g,'=').replace(/：/g,':').replace(/[［【]/g,'【').replace(/[］】]/g,'】').trim()}
function finalize(cur,out){if(!cur)return;if(!cur.date||!cur.place||!cur.raceNo)throw Error('日付・場・Rが足りません：'+JSON.stringify(cur));if(!cur.compi||cur.compi.length<3)throw Error(cur.place+cur.raceNo+'RのCOMPIが3頭未満です');cur.compi.sort((a,b)=>b.index-a.index||a.horse-b.horse);cur.headCount=cur.compi.length;cur.sum3=cur.compi.slice(0,3).reduce((s,x)=>s+x.index,0);cur.p=pClass(cur.sum3);cur.gap13=cur.compi[0].index-cur.compi[2].index;cur.gap56=cur.compi.length>=6?cur.compi[4].index-cur.compi[5].index:null;const mp=new Map(cur.compi.map((x,i)=>[x.horse,i+1]));cur.resultRanks=(cur.result||[]).map(h=>mp.get(h)||null);if(cur.resultRanks.length===3&&!cur.resultRanks.includes(null)){const mx=Math.max(...cur.resultRanks),inv=cur.resultRanks.filter(x=>x>=6).length;cur.class=mx<=3?'上位3頭完結':mx<=4?'上位4頭完結':mx<=5?'上位5頭完結':inv===1?'6位以下1頭侵入':inv===2?'6位以下2頭侵入':'上位5頭全崩れ'}else cur.class=cur.result?.length?'結果馬不在':'結果未入力';cur.recHits=(cur.recommend||[]).filter(h=>(cur.result||[]).includes(h));cur.id=`${cur.date}_${cur.place}_${cur.raceNo}`;out.push(cur)}
function parse(text){const lines=String(text).split(/\r?\n/);let date='',place='',cur=null,out=[];for(const raw of lines){const s=normalize(raw);if(!s||s.startsWith('```'))continue;let m;if((m=s.match(/^【\s*(.+?)\s*(\d{1,2})\s*R\s*】$/i))){finalize(cur,out);place=m[1].trim();cur={date,place,raceNo:+m[2],compi:[],recommend:[],result:null};continue}if((m=s.match(/^DATE\s*=\s*(\d{4})[-\/]?(\d{1,2})[-\/]?(\d{1,2})$/i))){date=`${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;if(cur)cur.date=date;continue}if((m=s.match(/^PLACE\s*=\s*(.+)$/i))){place=m[1].trim();if(cur)cur.place=place;continue}if((m=s.match(/^R(?:ACE)?\s*=*\s*(\d{1,2})$/i))){const n=+m[1];if(cur&&cur.compi.length)finalize(cur,out);cur={date,place,raceNo:n,compi:[],recommend:[],result:null};continue}if((m=s.match(/^COMPI\s*=\s*(.+)$/i))){if(!cur)throw Error('COMPIより前にRがありません');for(const p of m[1].split(/[,、]/)){const z=p.trim().match(/^(\d+)\s*:\s*(\d+(?:\.\d+)?)$/);if(!z)throw Error('COMPIの読めない組：'+p);cur.compi.push({horse:+z[1],index:+z[2]})}continue}if((m=s.match(/^(?:RECOMMEND|REC|推奨)\s*=\s*(.+)$/i))){if(!cur)throw Error('RECOMMENDより前にRがありません');cur.recommend=nums(m[1]);continue}if((m=s.match(/^RESULT\s*=\s*(.+)$/i))){if(!cur)throw Error('RESULTより前にRがありません');cur.result=nums(m[1]);if(cur.result.length!==3)throw Error('RESULTは3頭必要です：'+s);continue}if((m=s.match(/^(\d+)\s*[,，]\s*(\d+(?:\.\d+)?)$/))){if(!cur)throw Error('指数行より前にRがありません');cur.compi.push({horse:+m[1],index:+m[2]});continue}throw Error('読み取れない行：'+s)}finalize(cur,out);return out}
function saveNow(){try{const got=parse($('bulk').value);if(!got.length)throw Error('レースを1件も読み取れませんでした');for(const r of got){const i=rows.findIndex(x=>x.id===r.id);if(i>=0)rows[i]={...rows[i],...r};else rows.push(r)}persist();render();msg(got.length+'レース保存しました。合計'+rows.length+'レースです。')}catch(e){msg(e.message,false)}}
function putSample(){$('bulk').value='【札幌1R】\nDATE=2026-07-26\nPLACE=札幌\nR=1\nCOMPI=10:88,6:68,11:60,9:55,7:54,1:53,2:52,3:51,8:50,4:47,5:46,12:40\nRECOMMEND=10\nRESULT=10-2-1';msg('見本を入れました。次に「一括読込・保存」を押してください。')}
function clearInput(){$('bulk').value='';msg('入力欄を消しました。')}
function clearAll(){if(confirm('保存データを全部削除しますか？')){rows=[];persist();render();msg('全データを削除しました。')}}
function render(){rows.sort((a,b)=>(a.date+a.place+String(a.raceNo).padStart(2,'0')).localeCompare(b.date+b.place+String(b.raceNo).padStart(2,'0')));const done=rows.filter(x=>x.resultRanks?.length===3&&!x.resultRanks.includes(null));const top5=done.filter(x=>Math.max(...x.resultRanks)<=5).length;const rec=done.filter(x=>x.recommend?.length);const recRace=rec.filter(x=>x.recHits?.length).length;const recN=rec.reduce((s,x)=>s+x.recommend.length,0);const hitN=rec.reduce((s,x)=>s+(x.recHits?.length||0),0);$('stats').innerHTML=[['登録レース',rows.length],['結果入力済み',done.length],['上位5頭完結',top5+'／'+pct(top5,done.length)],['6位以下侵入',done.length-top5+'／'+pct(done.length-top5,done.length)],['推奨馬1頭以上的中',recRace+'／'+pct(recRace,rec.length)],['推奨馬単位の複勝率',hitN+'／'+pct(hitN,recN)]].map(x=>`<div class="stat"><div class="v">${x[1]}</div><div class="k">${x[0]}</div></div>`).join('');$('tbody').innerHTML=rows.map(x=>`<tr><td>${x.date}</td><td>${x.place}</td><td>${x.raceNo}R</td><td>${x.headCount}</td><td>${x.p}</td><td>${(x.result||[]).join('-')||'—'}</td><td>${(x.resultRanks||[]).join('-')||'—'}</td><td>${x.class}</td><td>${(x.recommend||[]).join('-')||'—'}</td><td>${(x.recHits||[]).join('-')||'なし'}</td></tr>`).join('')}
function summary(){const done=rows.filter(x=>x.resultRanks?.length===3&&!x.resultRanks.includes(null));const top5=done.filter(x=>Math.max(...x.resultRanks)<=5).length;const rec=done.filter(x=>x.recommend?.length),rr=rec.filter(x=>x.recHits?.length).length,rn=rec.reduce((s,x)=>s+x.recommend.length,0),hn=rec.reduce((s,x)=>s+(x.recHits?.length||0),0);return `【コンピ研究所・蓄積結果】\n登録：${rows.length}R\n結果済：${done.length}R\n上位5頭完結：${top5}/${done.length}=${pct(top5,done.length)}\n6位以下侵入：${done.length-top5}/${done.length}=${pct(done.length-top5,done.length)}\n\nコンピ推奨馬対象：${rec.length}R\n1頭以上馬券内：${rr}/${rec.length}=${pct(rr,rec.length)}\n推奨馬単位：${hn}/${rn}=${pct(hn,rn)}\n\nコンピ推奨馬が来る条件と飛ぶ条件を分析してください。`}
async function copyText(t){try{await navigator.clipboard.writeText(t);msg('コピーしました。ChatGPTへ貼り付けてください。')}catch{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();msg('コピーしました。')}}
async function shareSummary(){const t=summary();if(navigator.share){try{await navigator.share({title:'コンピ研究所',text:t});return}catch(e){if(e.name==='AbortError')return}}copyText(t)}function copySummary(){copyText(summary())}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportCsv(){const h='date,place,raceNo,headCount,p,gap13,gap56,result,resultRanks,class,recommend,recommendHits\n';const b=rows.map(x=>[x.date,x.place,x.raceNo,x.headCount,x.p,x.gap13,x.gap56,(x.result||[]).join('-'),(x.resultRanks||[]).join('-'),x.class,(x.recommend||[]).join('-'),(x.recHits||[]).join('-')].map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');download('compi_lab_v130.csv','\uFEFF'+h+b,'text/csv;charset=utf-8')}
function exportTxt(){download('compi_lab_chappy.txt',summary()+'\n\n---全件---\n'+rows.map(x=>JSON.stringify(x)).join('\n'),'text/plain;charset=utf-8')}
window.addEventListener('error',e=>msg('アプリ内部エラー：'+e.message,false));load();
</script></body></html>
