<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>たーたんの掛け算</title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
  background: linear-gradient(#fff7cf, #ffe4ec);
}

.app {
  width: 90%;
  max-width: 600px;
  background: white;
  border-radius: 30px;
  padding: 30px 20px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.15);
}

h1 {
  font-size: 42px;
  color: #ff6b61;
  margin-bottom: 20px;
}

.info {
  font-size: 22px;
  margin-bottom: 30px;
}

button {
  font-size: 30px;
  font-weight: bold;
  padding: 18px 45px;
  border: none;
  border-radius: 40px;
  background: #ff8a3d;
  color: white;
}

#question {
  font-size: 70px;
  font-weight: bold;
  margin: 35px 0 10px;
}

#countdown {
  font-size: 42px;
  font-weight: bold;
  color: #ff8a3d;
  min-height: 55px;
}

#count {
  font-size: 24px;
  color: #666;
}

.answer {
  color: #1681d4;
}

.hidden {
  display: none;
}

.finish {
  font-size: 48px;
  font-weight: bold;
  color: #ff6b61;
  margin: 40px 0;
}
</style>
</head>

<body>

<div class="app">

<div id="startScreen">

<h1>たーたんの掛け算</h1>

<div class="info">
1×1から9×9まで<br>
ランダムで20問！
</div>

<button onclick="startGame()">
スタート
</button>

</div>


<div id="gameScreen" class="hidden">

<div id="count"></div>

<div id="question"></div>

<div id="countdown"></div>

</div>


<div id="finishScreen" class="hidden">

<h1>たーたんの掛け算</h1>

<div class="finish">
20問おわり！ 🎉
</div>

<button onclick="startGame()">
もう一回
</button>

</div>

</div>


<script>

let problems = [];
let current = 0;

const totalQuestions = 20;


// 音を鳴らす
function beep(frequency = 700, duration = 120) {

  const AudioContext =
    window.AudioContext ||
    window.webkitAudioContext;

  const audioCtx =
    new AudioContext();

  const oscillator =
    audioCtx.createOscillator();

  const gain =
    audioCtx.createGain();

  oscillator.connect(gain);
  gain.connect(audioCtx.destination);

  oscillator.frequency.value =
    frequency;

  oscillator.type = "sine";

  gain.gain.setValueAtTime(
    0.18,
    audioCtx.currentTime
  );

  oscillator.start();

  oscillator.stop(
    audioCtx.currentTime +
    duration / 1000
  );

}


// 問題を作る
function makeProblems() {

  let list = [];

  for (let a = 1; a <= 9; a++) {

    for (let b = 1; b <= 9; b++) {

      list.push([a,b]);

    }

  }


// ランダム並び替え
  for (let i = list.length - 1; i > 0; i--) {

    let j =
    Math.floor(
      Math.random() * (i + 1)
    );

    [list[i], list[j]] =
    [list[j], list[i]];

  }


// 20問だけ使う
  problems =
  list.slice(0,totalQuestions);

}


// スタート
function startGame() {

  makeProblems();

  current = 0;

  document
  .getElementById("startScreen")
  .classList.add("hidden");

  document
  .getElementById("finishScreen")
  .classList.add("hidden");

  document
  .getElementById("gameScreen")
  .classList.remove("hidden");

  beep(500,100);

  showQuestion();

}


// 問題表示
function showQuestion() {

  if (current >= totalQuestions) {

    finishGame();

    return;

  }

  const a =
    problems[current][0];

  const b =
    problems[current][1];

  const question =
    document.getElementById("question");

  const countdown =
    document.getElementById("countdown");


  document
  .getElementById("count")
  .textContent =
    (current + 1) + " / 20";


  question.classList.remove("answer");

  question.textContent =
    a + " × " + b + " ＝";


  countdown.textContent =
    "2";

  beep(650,120);


  // 1秒後
  setTimeout(function() {

    countdown.textContent =
      "1";

    beep(750,120);

  },1000);


  // 2秒後に答え
  setTimeout(function() {

    countdown.textContent =
      "答え！";

    beep(1000,180);

    question.classList.add("answer");

    question.textContent =
      a + " × " + b +
      " ＝ " + (a*b);


    // 答えを1.5秒表示して次へ
    setTimeout(function() {

      current++;

      showQuestion();

    },1500);


  },2000);

}


// 終了
function finishGame() {

  beep(900,150);

  setTimeout(function() {
    beep(1100,180);
  },180);

  document
  .getElementById("gameScreen")
  .classList.add("hidden");

  document
  .getElementById("finishScreen")
  .classList.remove("hidden");

}

</script>

</body>
</html>
