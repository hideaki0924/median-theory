<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>たーたんの掛け算 1.5秒</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin:0; min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  background:linear-gradient(180deg,#fff7d6 0%,#ffe9f1 100%);
  color:#333; padding:14px;
}
.app {
  width:min(860px,100%); margin:0 auto;
  background:rgba(255,255,255,.96);
  border-radius:28px; padding:20px;
  box-shadow:0 12px 35px rgba(0,0,0,.12); text-align:center;
}
h1 { margin:0 0 8px; font-size:clamp(30px,7vw,52px); color:#ff6f61; }
.sub { font-size:clamp(16px,4vw,22px); margin-bottom:14px; line-height:1.5; }
.count { font-size:clamp(18px,4vw,24px); font-weight:800; color:#666; margin-bottom:4px; }
.question {
  font-size:clamp(48px,13vw,90px); font-weight:900;
  min-height:110px; display:flex; align-items:center; justify-content:center;
}
.answer { color:#187bcd; }
.timer-note { color:#ff6f61; font-weight:900; font-size:20px; }
.characters {
  min-height:100px; display:flex; gap:8px; justify-content:center; align-items:center;
  flex-wrap:wrap; margin:6px 0;
}
.characters img {
  width:95px; height:95px; object-fit:cover;
  border-radius:20px; border:3px solid white; box-shadow:0 3px 12px #0002;
}
.characters img:first-child { width:125px; height:125px; }
.cheer {
  display:inline-block; background:#fff0f5; border:2px solid #ffd0df;
  border-radius:999px; padding:7px 16px; font-weight:900;
}
.write-title { font-weight:900; margin:8px 0 6px; font-size:18px; }
.canvasbox {
  position:relative; width:min(76vw,420px); aspect-ratio:1.45/1;
  margin:0 auto; background:white; border:3px solid #dbc8d1;
  border-radius:20px; overflow:hidden; touch-action:none;
}
.guide {
  position:absolute; inset:0; pointer-events:none;
  background:
    linear-gradient(90deg,transparent 49.7%,#eee 49.7%,#eee 50.3%,transparent 50.3%),
    linear-gradient(transparent 49.7%,#eee 49.7%,#eee 50.3%,transparent 50.3%);
}
canvas { position:absolute; inset:0; width:100%; height:100%; touch-action:none; }
.row { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:10px; }
button {
  border:0; border-radius:999px; padding:13px 24px;
  font-size:clamp(18px,5vw,28px); font-weight:900; cursor:pointer;
  background:#ff8b3d; color:white; box-shadow:0 6px 0 #d96c25;
}
button.secondary { background:#88c9c1; box-shadow:0 6px 0 #5da49c; }
button:active { transform:translateY(3px); box-shadow:none; }
.hidden { display:none; }
.finish { font-size:clamp(34px,9vw,60px); font-weight:900; color:#ff6f61; margin:18px 0; }
.small { color:#777; font-size:14px; margin-top:8px; }
</style>
</head>
<body>
<main class="app">
  <section id="startScreen">
    <h1>たーたんの掛け算</h1>
    <div class="sub">
      <b>2の段〜9の段</b>からランダム20問！<br>
      <span class="timer-note">1.5秒で答えが出るよ ⚡</span><br>
      タッチペンで答えを書いてみよう
    </div>
    <div class="characters" id="startChars"></div>
    <button id="startBtn">スタート</button>
  </section>

  <section id="quizScreen" class="hidden">
    <div class="count" id="count">1 / 20</div>
    <div class="characters" id="quizChars"></div>
    <div class="cheer" id="cheer">いけるよ！</div>

    <div class="question" id="question"></div>

    <div class="write-title">答えをここに書こう ✏️</div>
    <div class="canvasbox" id="canvasBox">
      <div class="guide"></div>
      <canvas id="drawCanvas"></canvas>
    </div>
    <div class="row">
      <button class="secondary" id="clearBtn">消す</button>
    </div>

    <div class="small">問題が出てから1.5秒後に答えを表示します</div>
  </section>

  <section id="finishScreen" class="hidden">
    <h1>たーたんの掛け算</h1>
    <div class="characters" id="finishChars"></div>
    <div class="finish">20問 おわり！ 🎉</div>
    <button id="restartBtn">もう一回</button>
  </section>
</main>

const CHEERS = ["いけるよ！","その調子！","はやい！","がんばれ！","すごい！","あと少し！"];

const startScreen = document.getElementById("startScreen");
const quizScreen = document.getElementById("quizScreen");
const finishScreen = document.getElementById("finishScreen");
const questionEl = document.getElementById("question");
const countEl = document.getElementById("count");
const cheerEl = document.getElementById("cheer");
const startChars = document.getElementById("startChars");
const quizChars = document.getElementById("quizChars");
const finishChars = document.getElementById("finishChars");
const startBtn = document.getElementById("startBtn");
const restartBtn = document.getElementById("restartBtn");
const clearBtn = document.getElementById("clearBtn");

let problems = [];
let index = 0;
let timer1 = null;
let timer2 = null;

function addChars(container, ids) {
  container.innerHTML = "";
  if (!CHARS.length) return;
  ids.forEach(i => {
    const img = document.createElement("img");
    img.src = CHARS[i % CHARS.length];
    container.appendChild(img);
  });
}

function makeProblems() {
  const all = [];
  // 1の段は出さない。2〜9の段のみ。
  for (let a = 2; a <= 9; a++) {
    for (let b = 1; b <= 9; b++) {
      all.push([a,b]);
    }
  }
  for (let i = all.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [all[i], all[j]] = [all[j], all[i]];
  }
  return all.slice(0, TOTAL);
}

function clearTimers() {
  if (timer1) clearTimeout(timer1);
  if (timer2) clearTimeout(timer2);
}

function startQuiz() {
  clearTimers();
  problems = makeProblems();
  index = 0;
  startScreen.classList.add("hidden");
  finishScreen.classList.add("hidden");
  quizScreen.classList.remove("hidden");
  setTimeout(() => {
    resizeCanvas();
    showQuestion();
  }, 50);
}

function showQuestion() {
  if (index >= TOTAL) {
    finishQuiz();
    return;
  }
  clearCanvas();
  const [a,b] = problems[index];
  countEl.textContent = `${index + 1} / ${TOTAL}`;
  questionEl.classList.remove("answer");
  questionEl.textContent = `${a} × ${b} ＝`;
  cheerEl.textContent = CHEERS[index % CHEERS.length];

  const charCount = index < 5 ? 1 : index < 10 ? 2 : 3;
  const ids = [];
  for (let k = 0; k < charCount; k++) ids.push(index + k * 2);
  addChars(quizChars, ids);

  timer1 = setTimeout(() => {
    questionEl.classList.add("answer");
    questionEl.textContent = `${a} × ${b} ＝ ${a*b}`;
    timer2 = setTimeout(() => {
      index++;
      showQuestion();
    }, NEXT_DELAY);
  }, ANSWER_DELAY);
}

function finishQuiz() {
  clearTimers();
  quizScreen.classList.add("hidden");
  finishScreen.classList.remove("hidden");
  addChars(finishChars, [1,3,5]);
}

startBtn.addEventListener("click", startQuiz);
restartBtn.addEventListener("click", startQuiz);

// --- タッチペン / 指で書く ---
const canvas = document.getElementById("drawCanvas");
const ctx = canvas.getContext("2d");
let drawing = false;
let last = null;

function resizeCanvas() {
  const r = document.getElementById("canvasBox").getBoundingClientRect();
  const d = window.devicePixelRatio || 1;
  canvas.width = Math.round(r.width * d);
  canvas.height = Math.round(r.height * d);
  canvas.style.width = r.width + "px";
  canvas.style.height = r.height + "px";
  ctx.setTransform(d,0,0,d,0,0);
  ctx.strokeStyle = "#333";
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.lineWidth = 8;
}

function pointerPos(e) {
  const r = canvas.getBoundingClientRect();
  return {x:e.clientX-r.left, y:e.clientY-r.top};
}

canvas.addEventListener("pointerdown", e => {
  e.preventDefault();
  drawing = true;
  last = pointerPos(e);
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
});
canvas.addEventListener("pointermove", e => {
  if (!drawing) return;
  e.preventDefault();
  const p = pointerPos(e);
  ctx.lineWidth = (e.pointerType === "pen" && e.pressure > 0) ? 5 + e.pressure * 9 : 8;
  ctx.beginPath();
  ctx.moveTo(last.x,last.y);
  ctx.lineTo(p.x,p.y);
  ctx.stroke();
  last = p;
});
["pointerup","pointercancel","pointerout"].forEach(ev => {
  canvas.addEventListener(ev, () => { drawing=false; last=null; });
});

function clearCanvas() {
  const r = canvas.getBoundingClientRect();
  ctx.clearRect(0,0,r.width,r.height);
}
clearBtn.addEventListener("click", clearCanvas);
window.addEventListener("resize", resizeCanvas);

if (CHARS.length) addChars(startChars,[0,1,2]);
