<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>たーたんの掛け算</title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
  background: linear-gradient(#fff7cf, #ffe4ec);
}

.app {
  width: 90%;
  max-width: 600px;
  background: white;
  border-radius: 30px;
  padding: 30px 20px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.15);
}

h1 {
  font-size: 42px;
  color: #ff6b61;
  margin-bottom: 20px;
}

.info {
  font-size: 22px;
  margin-bottom: 30px;
}

button {
  font-size: 30px;
  font-weight: bold;
  padding: 18px 45px;
  border: none;
  border-radius: 40px;
  background: #ff8a3d;
  color: white;
}

#question {
  font-size: 70px;
  font-weight: bold;
  margin: 35px 0 10px;
}

#countdown {
  font-size: 42px;
  font-weight: bold;
  color: #ff8a3d;
  min-height: 55px;
}

#count {
  font-size: 24px;
  color: #666;
}

.answer {
  color: #1681d4;
}

.hidden {
  display: none;
}

.finish {
  font-size: 48px;
  font-weight: bold;
  color: #ff6b61;
  margin: 40px 0;
}
</style>
</head>

<body>

<div class="app">

<div id="startScreen">
  <h1>たーたんの掛け算</h1>

  <div class="info">
    1×1から9×9まで<br>
    ランダムで20問！
  </div>

  <button onclick="startGame()">スタート</button>
</div>


<div id="gameScreen" class="hidden">

  <div id="count"></div>

  <div id="question"></div>

  <div id="countdown"></div>

</div>


<div id="finishScreen" class="hidden">

  <h1>たーたんの掛け算</h1>

  <div class="finish">
    20問おわり！ 🎉
  </div>

  <button onclick="startGame()">もう一回</button>

</div>

</div>


<script>

let problems = [];
let current = 0;

const totalQuestions = 20;

let audioCtx = null;

let bgmRunning = false;
let bgmIndex = 0;
let bgmTimeout = null;


// 音の準備
function initAudio() {

  if (!audioCtx) {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    audioCtx = new AudioContext();

  }

  if (audioCtx.state === "suspended") {
    audioCtx.resume();
  }

}


// 効果音
function beep(frequency = 700, duration = 120, volume = 0.12) {

  if (!audioCtx) return;

  const oscillator =
    audioCtx.createOscillator();

  const gain =
    audioCtx.createGain();

  oscillator.connect(gain);
  gain.connect(audioCtx.destination);

  oscillator.type = "sine";

  oscillator.frequency.setValueAtTime(
    frequency,
    audioCtx.currentTime
  );

  gain.gain.setValueAtTime(
    volume,
    audioCtx.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    0.001,
    audioCtx.currentTime + duration / 1000
  );

  oscillator.start();

  oscillator.stop(
    audioCtx.currentTime + duration / 1000
  );

}


// BGMの1音
function playBgmNote(frequency) {

  if (!audioCtx || !bgmRunning) return;

  if (audioCtx.state === "suspended") {
    audioCtx.resume();
  }

  const oscillator =
    audioCtx.createOscillator();

  const gain =
    audioCtx.createGain();

  oscillator.connect(gain);
  gain.connect(audioCtx.destination);

  oscillator.type = "triangle";

  oscillator.frequency.setValueAtTime(
    frequency,
    audioCtx.currentTime
  );

  gain.gain.setValueAtTime(
    0.035,
    audioCtx.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    0.001,
    audioCtx.currentTime + 0.22
  );

  oscillator.start();

  oscillator.stop(
    audioCtx.currentTime + 0.22
  );

}


// BGM
function bgmLoop() {

  if (!bgmRunning) return;

  const melody = [
    523.25,
    659.25,
    783.99,
    659.25,
    587.33,
    698.46,
    880.00,
    698.46,
    659.25,
    783.99,
    987.77,
    783.99
  ];

  playBgmNote(
    melody[bgmIndex % melody.length]
  );

  bgmIndex++;

  bgmTimeout =
    setTimeout(bgmLoop, 320);

}


function startBGM() {

  stopBGM();

  bgmRunning = true;

  bgmIndex = 0;

  bgmLoop();

}


function stopBGM() {

  bgmRunning = false;

  if (bgmTimeout) {

    clearTimeout(bgmTimeout);

    bgmTimeout = null;

  }

}


// 問題作成
function makeProblems() {

  let list = [];

  for (let a = 1; a <= 9; a++) {

    for (let b = 1; b <= 9; b++) {

      list.push([a,b]);

    }

  }


  for (let i = list.length - 1; i > 0; i--) {

    let j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [list[i], list[j]] =
    [list[j], list[i]];

  }


  problems =
    list.slice(0,totalQuestions);

}


// スタート
function startGame() {

  initAudio();

  makeProblems();

  current = 0;

  document
    .getElementById("startScreen")
    .classList.add("hidden");

  document
    .getElementById("finishScreen")
    .classList.add("hidden");

  document
    .getElementById("gameScreen")
    .classList.remove("hidden");

  beep(500,100,0.12);

  startBGM();

  showQuestion();

}


// 問題表示
function showQuestion() {

  if (current >= totalQuestions) {

    finishGame();

    return;

  }

  if (audioCtx && audioCtx.state === "suspended") {
    audioCtx.resume();
  }


  const a =
    problems[current][0];

  const b =
    problems[current][1];

  const question =
    document.getElementById("question");

  const countdown =
    document.getElementById("countdown");


  document
    .getElementById("count")
    .textContent =
    (current + 1) + " / 20";


  question.classList.remove("answer");

  question.textContent =
    a + " × " + b + " ＝";


  countdown.textContent = "2";

  beep(650,100,0.13);


  // 0.75秒後
  setTimeout(function() {

    countdown.textContent = "1";

    beep(780,100,0.13);

  },750);


  // 1.5秒後に答え
  setTimeout(function() {

    countdown.textContent = "答え！";

    beep(1100,180,0.18);

    question.classList.add("answer");

    question.textContent =
      a + " × " + b +
      " ＝ " + (a*b);


    // 答えを1.5秒表示
    setTimeout(function() {

      current++;

      showQuestion();

    },1500);


  },1500);

}


// 終了
function finishGame() {

  stopBGM();

  beep(800,150,0.15);

  setTimeout(function() {
    beep(1000,150,0.15);
  },180);

  setTimeout(function() {
    beep(1300,300,0.18);
  },360);


  document
    .getElementById("gameScreen")
    .classList.add("hidden");

  document
    .getElementById("finishScreen")
    .classList.remove("hidden");

}

</script>

</body>
</html>
