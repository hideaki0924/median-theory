name: Public JRA odds snapshot
on:
  workflow_dispatch:
  push:
    paths:
      - "research-ai/odds-live/targets.json"
      - "research-ai/scripts/fetch_netkeiba_odds.py"
      - "research-ai/scripts/fetch_sportsnavi_odds.py"
      - ".github/workflows/public-odds.yml"
  schedule:
    # 09:00-17:59 JST Sat/Sun, roughly once every 10 minutes.
    - cron: "*/10 0-8 * * 6,0"
permissions:
  contents: write
concurrency:
  group: public-jra-odds-snapshot
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch registered race odds
        run: python research-ai/scripts/fetch_netkeiba_odds.py
      - name: Publish only successful public odds snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-ai/odds-live/*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update public JRA odds snapshots"
          git push
