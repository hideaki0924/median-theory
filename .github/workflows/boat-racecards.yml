name: Boat racecards
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'boat-ai/fetch_today.py'
      - '.github/workflows/boat-racecards.yml'
  schedule:
    - cron: '17 21,22,23,0,1,2,4,6,8,10 * * *'
permissions:
  contents: write
concurrency:
  group: boat-racecards
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 boat-ai/fetch_today.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add boat-ai/data/today.json
          git diff --cached --quiet || git commit -m "Refresh boat racecards"
          git pull --rebase origin main
          git push
