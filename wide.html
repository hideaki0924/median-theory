<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>チャッピーOCR ワイドV0.1</title>
<script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
body{background:#07101f;color:white;font-family:sans-serif;padding:16px}
h1{color:#ffd84d}
.box{background:#111827;padding:14px;border-radius:16px;margin:12px 0}
button,input{width:100%;font-size:20px;padding:14px;margin:8px 0;border-radius:12px}
textarea{width:100%;height:240px;font-size:16px;border-radius:12px;padding:10px;box-sizing:border-box}
.copy{background:#16a34a;color:white;font-weight:bold}
.small{font-size:14px;color:#cbd5e1}
</style>
</head>
<body>

<h1>📸ワイドOCR V0.1</h1>
<p>SPAT4ワイド表専用：画像順から組み合わせを復元</p>

<div class="box">
<h2>設定</h2>
<div class="small">出走頭数</div>
<input id="horseCount" value="12">
<div class="small">画像1枚目の先頭列</div>
<input id="startCol" value="1">
<div class="small">1画像あたりの列数</div>
<input id="colsPerImage" value="3">
</div>

<div class="box">
<h2>ワイド画像</h2>
<div class="small">左から順番に複数選択</div>
<input type="file" id="imgs" accept="image/*" multiple>
<button onclick="runOCR()">画像を読み取る</button>
</div>

<div class="box">
<h2>OCR結果</h2>
<textarea id="raw"></textarea>
<button onclick="makeWide()">[WIDE]生成</button>
</div>

<div class="box">
<h2>メジアンアプリコード</h2>
<textarea id="code"></textarea>
<button class="copy" onclick="copyCode()">コピー</button>
</div>

<script>
let imageTexts=[];

async function runOCR(){
  const files=[...document.getElementById("imgs").files];
  if(!files.length){alert("画像を選択してください");return;}

  imageTexts=[];
  let all="";

  for(let i=0;i<files.length;i++){
    document.getElementById("raw").value="読み取り中... 画像"+(i+1);
    const result=await Tesseract.recognize(files[i],"eng");
    const text=result.data.text;
    imageTexts.push(text);
    all+="\n--- 画像"+(i+1)+" ---\n"+text+"\n";
    document.getElementById("raw").value=all;
  }
}

function cleanLine(s){
  return s
    .replace(/[０-９]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0))
    .replace(/[．]/g,".")
    .replace(/[ー―－–—]/g,"-")
    .replace(/[|｜]/g," ")
    .replace(/\s+/g," ")
    .trim();
}

function getLineIndex(lines,target){
  let count=0;
  for(let i=0;i<lines.length;i++){
    const odds=lines[i].match(/\d+\.\d+\s*-\s*\d+\.\d+/g);
    if(odds && odds.length){
      if(lines[i]===target)return count;
      count++;
    }
  }
  return 0;
}

function makeWide(){
  const N=Number(document.getElementById("horseCount").value);
  const firstStart=Number(document.getElementById("startCol").value);
  const colsPerImage=Number(document.getElementById("colsPerImage").value);

  let rows=[];

  imageTexts.forEach((text,imgIndex)=>{
    const baseStart=firstStart + imgIndex * colsPerImage;
    const lines=text.split(/\n/).map(cleanLine).filter(Boolean);

    lines.forEach(line=>{
      const ranges=line.match(/\d+\.\d+\s*-\s*\d+\.\d+/g);
      if(!ranges)return;

      ranges.forEach((range,idx)=>{
        const base=baseStart + idx;
        if(base<1 || base>=N)return;

        const lineIndex=getLineIndex(lines,line);
        const opponent=base + lineIndex + 1;
        if(opponent<=base || opponent>N)return;

        const upper=Number(range.split("-")[1].trim());

        rows.push({
          pair:base+"-"+opponent,
          range,
          upper
        });
      });
    });
  });

  const map=new Map();
  rows.forEach(r=>{
    if(!map.has(r.pair) || r.upper<map.get(r.pair).upper){
      map.set(r.pair,r);
    }
  });

  let out="[WIDE]\n";

  [...map.values()]
    .sort((a,b)=>a.upper-b.upper)
    .slice(0,20)
    .forEach(x=>{
      out+=x.pair+" "+x.range+"\n";
    });

  document.getElementById("code").value=out;
}

function copyCode(){
  navigator.clipboard.writeText(document.getElementById("code").value);
  alert("コピーしました");
}
</script>

</body>
</html>
