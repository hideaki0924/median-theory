<body>
<main>
<h1>競馬メジアン <span class="tag">V8.02</span><br>P型司令塔・旧五市場表＋全馬タテ目</h1>

<div class="card">
  <div class="title">レースデータ入力</div>
  <div class="sub">結果保存・CSV・履歴機能なし。予想だけに集中する新規設計。</div>
  <textarea id="input" placeholder="【2026年8月10日 盛岡9R】

[COMPI]

</main>
<script>
'use strict';
let latest=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const zen=s=>String(s||'').replace(/[０-９]/g,x=>String.fromCharCode(x.charCodeAt(0)-65248)).replace(/．/g,'.').replace(/[－ー―−]/g,'-').replace(/　/g,' ');
const nums=s=>(zen(s).match(/\d+(?:\.\d+)?/g)||[]).map(Number);
const uniq=a=>[...new Set((a||[]).filter(x=>x!==null&&x!==undefined&&String(x)!=='').map(String))];
const sorted=(a,k='od')=>a.slice().sort((x,y)=>Number(x[k])-Number(y[k]));
const rankMap=a=>Object.fromEntries(a.map((h,i)=>[String(h),i+1]));
const fmt=a=>a&&a.length?a.map(x=>x+'番').join('・'):'なし';
const pairKey=(a,b)=>[String(a),String(b)].sort((x,y)=>+x-+y).join('-');
const triKey=(a,b,c)=>[String(a),String(b),String(c)].sort((x,y)=>+x-+y).join('-');
function medianHorses(arr){if(!arr.length)return[];return arr.length%2?[arr[Math.floor(arr.length/2)]]:[arr[arr.length/2-1],arr[arr.length/2]]}

function parse(raw){
  const d={title:'レース',compi:[],tf:[],uma:[],wide:[],san:[],yoso:[]}; let sec='';
  for(let line of zen(raw).split(/\r?\n/)){
    line=line.trim(); if(!line)continue;
    if(line.startsWith('【')){d.title=line.replace(/[【】]/g,'');continue}
    const up=line.toUpperCase();
    if(up.startsWith('[')){
      if(up.includes('COMPI'))sec='C';
      else if(up.includes('TAN')||up.includes('単複'))sec='TF';
      else if(up.includes('UMAREN')||up.includes('馬連'))sec='U';
      else if(up.includes('WIDE')||up.includes('ワイド'))sec='W';
      else if(up.includes('SAN')||up.includes('三連複')||up.includes('3REN'))sec='S';
      else if(up.includes('YOSO')||up.includes('予想師'))sec='Y';
      else sec='';
      continue;
    }
    const n=nums(line);
    if(sec==='C'&&n.length>=2)d.compi.push({h:String(Math.floor(n[0])),pt:n[1]});
    else if(sec==='TF'&&n.length>=2)d.tf.push({h:String(Math.floor(n[0])),tan:n[1],fuku:n.length>=3?n[n.length-1]:null});
    else if(sec==='U'){
      const m=line.match(/(\d+)\s*-\s*(\d+)/); if(m&&n.length>=3)d.uma.push({a:m[1],b:m[2],od:n[n.length-1]});
    }else if(sec==='W'){
      const m=line.match(/(\d+)\s*-\s*(\d+)/); if(m&&n.length>=3)d.wide.push({a:m[1],b:m[2],lo:n.length>=4?n[n.length-2]:n[n.length-1],hi:n[n.length-1],od:n[n.length-1]});
    }else if(sec==='S'){
      const m=line.match(/(\d+)\s*-\s*(\d+)\s*-\s*(\d+)/); if(m&&n.length>=4)d.san.push({a:m[1],b:m[2],c:m[3],od:n[n.length-1]});
    }else if(sec==='Y'&&n.length)d.yoso.push(...n.map(x=>String(Math.floor(x))));
  }
  d.yoso=uniq(d.yoso).slice(0,3);
  return d;
}
function pClass(sum){return sum<=205?'P1':sum<=209?'P2':sum<=213?'P3':sum<=216?'P4':sum<=219?'P5':'P6'}
function ratioWalls(rank,values,ratio=1.8){
  const out=[]; for(let i=0;i<rank.length-1;i++){const a=+values[rank[i]],b=+values[rank[i+1]];if(a>0&&b/a>=ratio)out.push({idx:i,before:rank[i],next:rank[i+1],ratio:+(b/a).toFixed(2)});} return out;
}
function thresholdWall(rank,values,limit){let idx=-1;rank.forEach((h,i)=>{if(+values[h]<=limit)idx=i});return idx>=0&&idx<rank.length-1?{idx,before:rank[idx],next:rank[idx+1]}:null}
function rankPairs(list){
  const s={};sorted(list).forEach((p,i)=>[p.a,p.b].forEach(h=>{s[h]=s[h]||{h,c:0,b:999,z:0};s[h].c++;s[h].b=Math.min(s[h].b,i+1);s[h].z+=i+1}));
  return Object.values(s).sort((x,y)=>y.c-x.c||x.b-y.b||x.z-y.z||+x.h-+y.h).map(x=>x.h);
}
function rankTri(list){
  const s={};sorted(list).forEach((p,i)=>[p.a,p.b,p.c].forEach(h=>{s[h]=s[h]||{h,c:0,b:999,z:0};s[h].c++;s[h].b=Math.min(s[h].b,i+1);s[h].z+=i+1}));
  return Object.values(s).sort((x,y)=>y.c-x.c||x.b-y.b||x.z-y.z||+x.h-+y.h).map(x=>x.h);
}
function rankUmaByFav(list,fav,fallback=[]){
  fav=String(fav||''); if(!fav)return rankPairs(list);
  const rows=sorted(list).filter(p=>String(p.a)===fav||String(p.b)===fav);
  if(!rows.length)return rankPairs(list);
  const mates=uniq(rows.map(p=>String(p.a)===fav?String(p.b):String(p.a)));
  return uniq([fav,...mates,...fallback.filter(h=>h!==fav&&!mates.includes(h))]);
}
function venueMode(title=''){return /札幌|函館|福島|新潟|東京|中山|中京|京都|阪神|小倉/.test(title)?'JRA':'NAR'}
function horsePairAnalysis(h,umaSorted){
  h=String(h);
  const withHorse=umaSorted.filter(x=>String(x.a)===h||String(x.b)===h);
  if(withHorse.length<2)return {h,status:'馬連入力不足',ratio:null};
  const p1=withHorse[0],p2=withHorse[1];
  const m1=String(p1.a)===h?String(p1.b):String(p1.a);
  const m2=String(p2.a)===h?String(p2.b):String(p2.a);
  const cross=umaSorted.find(x=>pairKey(x.a,x.b)===pairKey(m1,m2));
  if(!cross)return {h,status:'タテ目未入力',pair1:pairKey(p1.a,p1.b),pair2:pairKey(p2.a,p2.b),mate1:m1,mate2:m2,baseOdds:Number(p1.od),ratio:null};
  return {h,status:'OK',pair1:pairKey(p1.a,p1.b),pair2:pairKey(p2.a,p2.b),mate1:m1,mate2:m2,verticalPair:pairKey(m1,m2),baseOdds:Number(p1.od),verticalOdds:Number(cross.od),ratio:Number(cross.od)/Number(p1.od)};
}

function typeAndRange(compi,p,otani,g13,firstMajor){
  const n=compi.length,top4=n>=4?compi[0].pt-compi[3].pt:99,top1=compi[0]?.pt||0,g56=n>=6?compi[4].pt-compi[5].pt:null;
  let type='標準上位型',code=p+'-S',feature='上位構造と市場を併用',mode='MID';
  if(n>=4&&top4<=7){type='上位4頭密集・頭替わり型';code=p+'-A';feature='1着固定なし／上位4頭頭替わり＋壁下監査'}
  else if(top1>=85&&g13>=18){type='一強・相手荒れ型';code=p+'-B';feature='1位能力抜け／相手荒れを重視';mode='SOLID'}
  else if(top1>=80&&g13>=14){type='一強・相手入替型';code=p+'-C';feature='1位固定性高め／相手を市場で入替';mode='SOLID'}
  else if(firstMajor&&firstMajor.after<=3){type='上位核＋壁直後侵入型';code=p+'-D';feature='壁前を核／壁直後を強制監査'}
  else if(otani===3&&(p==='P1'||p==='P2'||p==='P3')){type='大谷式大穴型';code=p+'-E';feature='大谷3条件成立／上位固定を弱め中位・壁前後を保護';mode='UPSET'}
  else if(p==='P1'||p==='P2'){type='低P・上位崩れ警戒型';code=p+'-F';feature='固定軸を作らず下位侵入まで監査';mode='UPSET'}
  else if(g56!=null&&g56>=8){type='上位5頭ロック型';code=p+'-G';feature='5位後の壁を境に上位5頭内を優先'}
  if((p==='P1'||p==='P2')&&!type.includes('一強'))mode='UPSET';
  if((p==='P5'||p==='P6')&&mode!=='UPSET')mode='SOLID';
  let head=3,place=5,third=7,note='標準型：上位中心';
  if(type.includes('一強')){head=3;place=6;third=8;note='1位を残し、相手は6位・3着は8位まで'}
  if(type.includes('上位4頭')){head=4;place=6;third=8;note='上位4頭は頭候補、壁下～8位を3着監査'}
  if(type.includes('壁直後')){const w=Math.max(1,Math.min(n,firstMajor?.after||3));head=Math.min(4,w);place=Math.min(n,w+2);third=Math.min(n,w+4);note=`壁前${w}位を核、${third}位まで侵入監査`}
  if(type.includes('大谷式')||type.includes('低P')){head=Math.min(n,7);place=Math.min(n,9);third=Math.min(n,12);note='上位崩れ型。頭7位・連対9位・3着12位まで拡張'}
  if(type.includes('上位5頭')){head=5;place=5;third=6;note='1～5位主戦場、6位は3着まで'}
  if((p==='P1'||p==='P2')&&!type.includes('一強')){head=Math.max(head,Math.min(n,6));place=Math.max(place,Math.min(n,8));third=Math.max(third,Math.min(n,10));note+='／低P補正'}
  return {type,code,feature,mode,head,place,third,note,top4};
}

function build(d){
  const compi=d.compi.slice().sort((a,b)=>b.pt-a.pt||+a.h-+b.h),cr=compi.map(x=>x.h),n=compi.length;
  if(n<3)throw new Error('COMPIは最低3頭必要です');
  const sum=compi.slice(0,3).reduce((s,x)=>s+x.pt,0),p=pClass(sum);
  const gaps=[]; for(let i=0;i<n-1;i++)gaps.push({after:i+1,gap:compi[i].pt-compi[i+1].pt,before:compi[i].h,next:compi[i+1].h});
  const maxGap=gaps.slice().sort((a,b)=>b.gap-a.gap||a.after-b.after)[0];
  const firstMajor=gaps.find(x=>x.gap>=10)||gaps.find(x=>x.gap>=7)||null;
  const g12=compi[0].pt-compi[1].pt,g23=compi[1].pt-compi[2].pt,g13=compi[0].pt-compi[2].pt;
  const linePos=Math.max(1,Math.min(n,Math.ceil(n*.75))),lineHorse=compi[linePos-1];
  const otaniRules=[compi[0].pt<=78,g13<=12,lineHorse&&lineHorse.pt>=40&&lineHorse.pt<=49];
  const otani=otaniRules.filter(Boolean).length;
  const meta=typeAndRange(compi,p,otani,g13,firstMajor);

  const tan=sorted(d.tf.map(x=>({...x,od:x.tan})),'tan'),fuku=sorted(d.tf.filter(x=>x.fuku!=null).map(x=>({...x,od:x.fuku})),'fuku');
  const tr=tan.map(x=>x.h),fr=fuku.map(x=>x.h),fav=tr[0]||'';
  const ur=rankUmaByFav(d.uma,fav,cr),wr=rankPairs(d.wide),sr=rankTri(d.san);
  const rm={compi:rankMap(cr),tan:rankMap(tr),fuku:rankMap(fr),uma:rankMap(ur),wide:rankMap(wr),san:rankMap(sr)};
  const tv=Object.fromEntries(tan.map(x=>[x.h,x.tan])),fv=Object.fromEntries(fuku.map(x=>[x.h,x.fuku]));
  const uv={}; if(fav){sorted(d.uma).filter(p=>[p.a,p.b].includes(fav)).forEach(p=>{const mate=p.a===fav?p.b:p.a;if(uv[fav]==null)uv[fav]=p.od;if(uv[mate]==null)uv[mate]=p.od})}
  const wv={};sorted(d.wide).forEach(p=>[p.a,p.b].forEach(h=>{if(wv[h]==null)wv[h]=p.hi}));
  const sv={};sorted(d.san).forEach(p=>[p.a,p.b,p.c].forEach(h=>{if(sv[h]==null)sv[h]=p.od}));
  const walls={
    uma:ratioWalls(ur,uv),tan:ratioWalls(tr,tv),fuku:ratioWalls(fr,fv),wide:ratioWalls(wr,wv),san:ratioWalls(sr,sv),
    f6:thresholdWall(fr,fv,6),f10:thresholdWall(fr,fv,10),f15:thresholdWall(fr,fv,15),
    t10:thresholdWall(tr,tv,10),t30:thresholdWall(tr,tv,30),t80:thresholdWall(tr,tv,80)
  };
  const wallFront=uniq([walls.f15?.before,walls.f10?.before,walls.f6?.before,walls.t10?.before,walls.t30?.before,walls.t80?.before,...walls.uma.map(x=>x.before),...walls.tan.map(x=>x.before),...walls.fuku.map(x=>x.before),...walls.wide.map(x=>x.before),...walls.san.map(x=>x.before)]);
  const wallAfter=uniq([walls.f15?.next,walls.f10?.next,walls.f6?.next,walls.t10?.next,walls.t30?.next,walls.t80?.next,...walls.uma.map(x=>x.next),...walls.tan.map(x=>x.next),...walls.fuku.map(x=>x.next),...walls.wide.map(x=>x.next),...walls.san.map(x=>x.next)]);

  // 1番人気信用度＋全馬タテ目（V5.36/V6系の旧ロジックをそのまま移植）
  const umaSorted=sorted(d.uma);
  const allHorseVertical=cr.map(h=>horsePairAnalysis(h,umaSorted));
  const favVertical=allHorseVertical.find(x=>x.h===String(fav))||{h:String(fav||''),status:'判定不可',ratio:null};
  const mate1=favVertical.mate1||'',mate2=favVertical.mate2||'';
  const baseUma=favVertical.baseOdds??null,verticalOdds=favVertical.verticalOdds??null,verticalRatio=favVertical.ratio??null;
  const sanSorted=sorted(d.san),contains=(x,h)=>[x.a,x.b,x.c].includes(h),absIdx=fav?sanSorted.findIndex(x=>!contains(x,fav)):-1;
  const absence=absIdx>=0?absIdx+1:(sanSorted.length?sanSorted.length+1:null),absenceRow=absIdx>=0?sanSorted[absIdx]:null,absenceOdds=absenceRow?.od??null;
  const favCompi=compi.find(x=>x.h===fav)?.pt??null,favCompiRank=rm.compi[fav]||99;
  const marketFirstCount=[rm.tan[fav],rm.fuku[fav],rm.uma[fav],rm.wide[fav],rm.san[fav]].filter(x=>x===1).length;
  let favLevel='通常',favNote='決定的な危険材料なし',favHeadOK=true;
  if(verticalRatio!=null&&verticalRatio<4&&absenceOdds!=null&&absenceOdds<40){favLevel='危険・強警報';favNote='タテ目4倍未満＋三連複初不在40倍未満';favHeadOK=false}
  else if((verticalRatio!=null&&verticalRatio<4)||(absenceOdds!=null&&absenceOdds<40)){favLevel='危険';favNote=(verticalRatio!=null&&verticalRatio<4?'タテ目4倍未満':'三連複初不在40倍未満');favHeadOK=false}
  else if(absenceOdds!=null&&absenceOdds<60){favLevel='警戒';favNote='三連複初不在40～60倍帯';favHeadOK=false}
  else if(fav&&favCompiRank>=5&&marketFirstCount>=4){favLevel='市場過集中';favNote='市場1位集中に対してコンピ順位が低い';favHeadOK=false}
  else if(fav&&favCompi!=null&&favCompi>=88){favLevel='強い';favNote='コンピ88P以上＋市場中心';favHeadOK=true}

  // 各種シグナルを一度だけ計算。最終3頭はこれをP型が使う。
  const medians=uniq([...medianHorses(tr),...medianHorses(fr),...medianHorses(ur),...medianHorses(sr)]);
  const marketRise=[];
  cr.forEach(h=>{const c=rm.compi[h]||99;const gains=[rm.tan[h],rm.fuku[h],rm.uma[h],rm.wide[h],rm.san[h]].filter(Boolean).filter(r=>c-r>=2).length;if(gains>=2)marketRise.push(h)});
  const midOverlap=[];
  cr.forEach(h=>{const c=rm.compi[h]||99;if(c>=5&&c<=8){const hits=[rm.fuku[h],rm.uma[h],rm.wide[h],rm.san[h]].filter(r=>r&&r<=8).length;if(hits>=2)midOverlap.push({h,hits})}});
  midOverlap.sort((a,b)=>b.hits-a.hits||(+rm.compi[a.h]-+rm.compi[b.h]));
  const f15Pair=walls.f15?uniq([fr[Math.max(0,walls.f15.idx-1)],walls.f15.before]).filter(Boolean):[];

  const overlapScore={}; const overlapReason={};
  const ovAdd=(h,pts,reason)=>{if(!h)return;overlapScore[h]=(overlapScore[h]||0)+pts;(overlapReason[h]=overlapReason[h]||[]).push(reason)};
  midOverlap.forEach(x=>ovAdd(x.h,x.hits,`中穴5～8位 ${x.hits}/4`));
  f15Pair.forEach(h=>ovAdd(h,1,'複勝15壁前2頭'));
  marketRise.forEach(h=>ovAdd(h,1,'市場複数上昇'));
  walls.uma.forEach(w=>{ovAdd(w.before,1,'馬連壁前');ovAdd(w.next,1,'馬連壁直後')});
  medians.forEach(h=>ovAdd(h,1,'メジアン'));
  const bookMedian=Object.keys(overlapScore).map(h=>({h,score:overlapScore[h],reasons:uniq(overlapReason[h])})).sort((a,b)=>b.score-a.score||(+rm.compi[a.h]-+rm.compi[b.h]));

  // 穴スコア：Pの許容順位内＋複数根拠を優先。人気上位を単純に穴扱いしない。
  const holeScore={};const holeReason={};const addHole=(h,pts,reason)=>{if(!h)return;holeScore[h]=(holeScore[h]||0)+pts;(holeReason[h]=holeReason[h]||[]).push(reason)};
  cr.forEach(h=>{
    const r=rm.compi[h]||99,t=rm.tan[h]||99,fo=rm.fuku[h]||99,u=rm.uma[h]||99,w=rm.wide[h]||99,s=rm.san[h]||99;
    if(r>=4&&r<=meta.head)addHole(h,3,'P型の頭穴順位内');
    if(r>=5&&r<=meta.place)addHole(h,2,'P型の連対穴順位内');
    if(r>=6&&r<=meta.third)addHole(h,1,'P型の3着穴順位内');
    if(wallFront.includes(h))addHole(h,2,'壁前');
    if(wallAfter.includes(h))addHole(h,3,'壁直後');
    if(medians.includes(h))addHole(h,2,'メジアン');
    if(marketRise.includes(h))addHole(h,3,'市場複数上昇');
    const bm=bookMedian.find(x=>x.h===h);if(bm)addHole(h,bm.score,'書籍×メジアン重複'+bm.score);
    if(t<=8||fo<=8||u<=8||w<=8||s<=8)addHole(h,1,'市場接続');
    const tanOdd=tv[h];if(tanOdd!=null&&tanOdd>=5&&tanOdd<100)addHole(h,1,'単勝中穴帯');
  });
  const holes=Object.keys(holeScore).map(h=>({h,score:holeScore[h],reasons:uniq(holeReason[h]),rank:rm.compi[h]||99,tan:tv[h]??null})).sort((a,b)=>b.score-a.score||a.rank-b.rank||+a.h-+b.h);
  const holeSingles=holes.filter(x=>x.rank>=4&&x.rank<=meta.head&&x.tan!=null&&x.tan>=5&&x.tan<100).slice(0,3).map(x=>x.h);
  const bigHead=holes.find(x=>x.rank>=4&&x.rank<=meta.head)?.h||holes[0]?.h||'';
  const win5Hole=holes.filter(x=>x.rank>=4&&x.rank<=meta.head).slice(0,2).map(x=>x.h);

  // 青白光：5カテゴリ以上なら強い
  const blue=[];
  cr.forEach(h=>{const cats=[];if(wallFront.includes(h)||wallAfter.includes(h))cats.push('壁');if((rm.uma[h]||99)<=8)cats.push('馬連');if((rm.wide[h]||99)<=8)cats.push('ワイド');if((rm.san[h]||99)<=10)cats.push('三連複');if(medians.includes(h))cats.push('メジアン');if(marketRise.includes(h))cats.push('市場逆行');if(win5Hole.includes(h)||(rm.compi[h]||99)<=3)cats.push('WIN5');if(cats.length>=4)blue.push({h,cats})});

  // 最終3頭：P型が司令塔。旧上位予想へ戻らない。
  const finalScore={};const finalReason={};const addFinal=(h,pts,reason)=>{if(!h)return;finalScore[h]=(finalScore[h]||0)+pts;(finalReason[h]=finalReason[h]||[]).push(reason)};
  const yoso=d.yoso;
  if(meta.mode==='UPSET'){
    // 荒れ型：予想師があれば「1～2頭保全＋穴補正」。なければ人気側1頭＋穴2頭。
    yoso.forEach((h,i)=>addFinal(h,10-i*2,'予想師原型'));
    holes.slice(0,8).forEach((x,i)=>addFinal(x.h,Math.max(3,10-i),'荒れ型穴スコア'));
    bookMedian.slice(0,5).forEach((x,i)=>addFinal(x.h,7-i,'書籍×メジアン'));
    if(bigHead)addFinal(bigHead,8,'大荒れ頭');
    holeSingles.forEach((h,i)=>addFinal(h,7-i,'まっちゃん穴単'));
    // 人気側は完全排除しない。1番人気が危険なら頭点は与えず、相手残し点のみ。
    const stable=cr.slice(0,3).filter(h=>h!==fav||favHeadOK);
    stable.forEach((h,i)=>addFinal(h,4-i,'上位残し'));
    if(fav){addFinal(fav,favHeadOK?6:3,favHeadOK?'1人気保護':'危険1人気・相手残し')}
  }else if(meta.mode==='SOLID'){
    cr.slice(0,4).forEach((h,i)=>addFinal(h,12-i*2,'堅め型コンピ上位'));
    yoso.forEach((h,i)=>addFinal(h,7-i,'予想師原型'));
    holes.slice(0,4).forEach((x,i)=>addFinal(x.h,4-i,'相手穴補正'));
    if(fav)addFinal(fav,favHeadOK?7:2,favHeadOK?'1人気信頼':'1人気警戒');
  }else{
    cr.slice(0,5).forEach((h,i)=>addFinal(h,8-i,'中間型コンピ'));
    yoso.forEach((h,i)=>addFinal(h,8-i,'予想師原型'));
    holes.slice(0,5).forEach((x,i)=>addFinal(x.h,6-i,'穴補正'));
    if(fav)addFinal(fav,favHeadOK?5:2,favHeadOK?'1人気保護':'1人気警戒');
  }
  // 各市場上位はP型範囲内だけ加点
  cr.forEach(h=>{const r=rm.compi[h]||99;if(r<=meta.third){const support=[rm.tan[h],rm.fuku[h],rm.uma[h],rm.wide[h],rm.san[h]].filter(x=>x&&x<=5).length;if(support)addFinal(h,support,'五市場上位'+support)}});
  const rankedFinal=Object.keys(finalScore).map(h=>({h,score:finalScore[h],reasons:uniq(finalReason[h]),rank:rm.compi[h]||99})).filter(x=>x.rank<=meta.third).sort((a,b)=>b.score-a.score||a.rank-b.rank||+a.h-+b.h);

  let final3=[];
  if(meta.mode==='UPSET'){
    // まず穴側トップを最低1頭、理想は2頭。次に人気・予想師側を残す。
    const holePool=rankedFinal.filter(x=>holes.some(h=>h.h===x.h)&&x.rank>=4);
    if(holePool[0])final3.push(holePool[0].h);
    if(holePool[1]&&holePool[1].score>=holePool[0].score-4)final3.push(holePool[1].h);
    const protectPool=rankedFinal.filter(x=>!final3.includes(x.h)&&((yoso.includes(x.h))||x.rank<=3||x.h===fav));
    for(const x of protectPool){if(final3.length>=3)break;final3.push(x.h)}
    for(const x of rankedFinal){if(final3.length>=3)break;if(!final3.includes(x.h))final3.push(x.h)}
  }else final3=rankedFinal.slice(0,3).map(x=>x.h);
  final3=uniq(final3).slice(0,3);

  // 3頭内の役割
  const headCandidates=final3.filter(h=>(rm.compi[h]||99)<=meta.head && !(h===fav&&!favHeadOK));
  const headMain=headCandidates[0]||final3[0]||'';
  const singleProtect=meta.mode==='UPSET'?holeSingles.slice(0,3):[];
  const pairs=[];for(let i=0;i<final3.length;i++)for(let j=i+1;j<final3.length;j++)pairs.push(pairKey(final3[i],final3[j]));
  const tri=final3.length===3?triKey(...final3):'';
  return {d,compi,cr,sum,p,g12,g23,g13,maxGap,firstMajor,otani,meta,rm,tan,fuku,tr,fr,ur,wr,sr,tv,fv,walls,wallFront,wallAfter,
    fav,favCompi,favCompiRank,marketFirstCount,mate1,mate2,baseUma,verticalOdds,verticalRatio,allHorseVertical,absence,absenceOdds,absenceRow,favLevel,favNote,favHeadOK,
    medians,marketRise,midOverlap,f15Pair,bookMedian,holes,holeSingles,bigHead,win5Hole,blue,yoso,rankedFinal,final3,headMain,singleProtect,pairs,tri};
}

function compiRow(x){
  let s='<div class="row"><div class="label">コンピ</div>';
  x.compi.forEach((z,i)=>{
    let c='sep';
    if(i<x.compi.length-1){const g=z.pt-x.compi[i+1].pt;c+=g>=10?' big':g>=7?' mid':g>=4?' small':''}
    s+=`<div class="cell">${z.h}<span class="pt">${z.pt}P</span></div>${i<x.compi.length-1?`<i class="${c}"></i>`:''}`;
  });
  return s+'</div>';
}
function marketRankRow(label,arr,ratioList=[],baseList=[],market='uma'){
  if(!arr.length)return'';
  const ratioPairs=new Set((ratioList||[]).map(w=>`${w.before}>${w.next}`));
  const basePairs=new Set((baseList||[]).filter(Boolean).map(w=>`${w.before}>${w.next}`));
  let s=`<div class="row"><div class="label">${label}</div>`;
  arr.forEach((h,i)=>{
    s+=`<div class="cell">${h}</div>`;
    if(i<arr.length-1){
      const pair=`${h}>${arr[i+1]}`,r=ratioPairs.has(pair),b=basePairs.has(pair);
      const cls=r&&b?`doubleWall ${market}`:r?`marketWall ${market}`:b?`baseWall ${market}`:'';
      s+=`<i class="sep ${cls}"></i>`;
    }
  });
  return s+'</div>';
}
function wallsText(arr){return arr&&arr.length?arr.map(w=>`${w.before}→${w.next} ${w.ratio}倍`).join(' ／ '):'明確な比率壁なし'}

    <div class="title" style="font-size:16px;margin-top:10px">五市場・オッズの壁</div>
    <div class="marketRow"><div class="marketName">馬連</div><div class="marketValue">${wallsText(x.walls.uma)}</div></div>
    <div class="marketRow"><div class="marketName">単勝</div><div class="marketValue">${wallsText(x.walls.tan)}<br>10倍壁 ${x.walls.t10?x.walls.t10.before+'→'+x.walls.t10.next:'なし'} ／ 30倍壁 ${x.walls.t30?x.walls.t30.before+'→'+x.walls.t30.next:'なし'} ／ 80倍壁 ${x.walls.t80?x.walls.t80.before+'→'+x.walls.t80.next:'なし'}</div></div>
    <div class="marketRow"><div class="marketName">複勝</div><div class="marketValue">${wallsText(x.walls.fuku)}<br>6倍壁 ${x.walls.f6?x.walls.f6.before+'→'+x.walls.f6.next:'なし'} ／ 10倍壁 ${x.walls.f10?x.walls.f10.before+'→'+x.walls.f10.next:'なし'} ／ 15倍壁 ${x.walls.f15?x.walls.f15.before+'→'+x.walls.f15.next:'なし'}</div></div>
    <div class="marketRow"><div class="marketName">ワイド</div><div class="marketValue">${wallsText(x.walls.wide)}</div></div>
    <div class="marketRow"><div class="marketName">三連複</div><div class="marketValue">${wallsText(x.walls.san)}</div></div>
    <div class="grid2"><div class="box"><div class="boxL">壁前保護</div><div class="boxV">${fmt(x.wallFront)}</div></div><div class="box"><div class="boxL">壁直後保護</div><div class="boxV">${fmt(x.wallAfter)}</div></div></div>
  </div>

  ${allVerticalCard(x)}

  <div class="card sectionFav">
    <div class="title">③ 1番人気信用度・タテ目</div>
    <div class="grid2">
      <div class="box"><div class="boxL">対象</div><div class="boxV">${x.fav?x.fav+'番':'判定不可'}<br><span class="sub">コンピ${x.favCompiRank}位 ${x.favCompi??'-'}P</span></div></div>
      <div class="box"><div class="boxL">総合</div><div class="boxV ${x.favHeadOK?'good':'warn'}">${esc(x.favLevel)}</div></div>
      <div class="box"><div class="boxL">馬連上位2組の相手</div><div class="boxV">${x.mate1||'-'}・${x.mate2||'-'}</div></div>
      <div class="box"><div class="boxL">タテ目倍率</div><div class="boxV">${esc(favTate)}</div></div>
      <div class="box"><div class="boxL">三連複初不在</div><div class="boxV">${esc(absence)}</div></div>
      <div class="box"><div class="boxL">五市場1位</div><div class="boxV">${x.marketFirstCount}/5</div></div>
    </div>
    <div class="cmdRule">${esc(x.favNote)}${x.favHeadOK?'':' ／ 頭固定禁止・相手残し可'}</div>
  </div>

  <div class="card sectionYoso">
    <div class="title">④ 予想師原型</div>
    <div class="sub">入力がある場合だけ使用。P型を上書きせず、当たり部分を保全する材料にする。</div>
    <div class="horseChips">${x.yoso.length?x.yoso.map((h,i)=>`<span class="horse ${i===0?'gold':'good'}">${['◎','○','▲'][i]||''} ${h}番</span>`).join(''):'<span class="sub">[YOSOSHI] 未入力</span>'}</div>
  </div>

  <div class="card sectionHole">
    <div class="title">⑤ 各種穴関係・研究シグナル</div>
    <div class="grid2">
      <div class="box"><div class="boxL">まっちゃん穴単</div><div class="boxV">${fmt(x.holeSingles)}</div></div>
      <div class="box"><div class="boxL">大荒れ頭</div><div class="boxV">${x.bigHead?x.bigHead+'番':'なし'}</div></div>
      <div class="box"><div class="boxL">WIN5穴</div><div class="boxV">${fmt(x.win5Hole)}</div></div>
      <div class="box"><div class="boxL">市場複数上昇</div><div class="boxV">${fmt(x.marketRise)}</div></div>
      <div class="box"><div class="boxL">複勝15壁前2頭</div><div class="boxV">${fmt(x.f15Pair)}</div></div>
      <div class="box"><div class="boxL">青白光 4関以上</div><div class="boxV">${x.blue.length?x.blue.map(z=>z.h+'番['+z.cats.join('+')+']').join(' / '):'なし'}</div></div>
    </div>
    <div class="title" style="font-size:16px;margin-top:10px">書籍×メジアン重複</div>
    <div class="tableWrap"><table class="miniTable"><thead><tr><th>馬</th><th>重複</th><th>理由</th></tr></thead><tbody>${bmRows||'<tr><td colspan="3">なし</td></tr>'}</tbody></table></div>
    <div class="title" style="font-size:16px;margin-top:10px">P型穴スコア</div>
    <div class="tableWrap"><table class="miniTable"><thead><tr><th>馬</th><th>コンピ</th><th>点</th><th>理由</th></tr></thead><tbody>${holeRows||'<tr><td colspan="4">なし</td></tr>'}</tbody></table></div>
  </div>

  <div class="card sectionFinal">
    <div class="title">⑥ P型へ戻して最終3頭</div>
    <div class="sub">最初のP型が最後まで司令塔。P1/P2大荒れ型で上位人気だけに戻ることを禁止。</div>
    <div class="finalThree">${x.final3.length?x.final3.join('・'):'判定不可'}</div>
    ${finalWhy}
    <div class="grid2">
      <div class="box"><div class="boxL">1着本線</div><div class="boxV">${x.headMain?x.headMain+'番':'なし'}</div></div>
      <div class="box"><div class="boxL">穴単100円保護</div><div class="boxV">${fmt(x.singleProtect)}</div></div>
    </div>
    <div class="ticket"><div class="ticketL">馬連</div><div class="ticketV">${x.pairs.length?x.pairs.join(' / '):'なし'}</div></div>
    <div class="ticket"><div class="ticketL">ワイド</div><div class="ticketV">${x.pairs.length?x.pairs.join(' / '):'なし'}</div></div>
    <div class="ticket"><div class="ticketL">三連複</div><div class="ticketV">${x.tri||'なし'}</div></div>
  </div>`;
}

function run(){
  try{const d=parse($('input').value);latest=build(d);$('out').innerHTML=render(latest);window.scrollTo({top:$('out').offsetTop-8,behavior:'smooth'});}catch(e){$('out').innerHTML=`<div class="card"><div class="title">入力エラー</div><div class="warn">${esc(e.message)}</div></div>`}
}
function clearAll(){$('input').value='';$('out').innerHTML='';latest=null}

  navigator.clipboard?.writeText(t).then(()=>alert('コピーしました')).catch(()=>prompt('コピーしてください',t));
}
